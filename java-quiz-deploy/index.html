function loadPS(){
  try{PS=JSON.parse(localStorage.getItem(SK)||'{}');}catch{PS={};}
  if(!PS.t)PS.t={};
  if(!PS.gs)PS.gs=[];
  if(!PS.gp)PS.gp={n:0,c:0};
  if(!PS.sq)PS.sq={};
  gpSeen=new Set(PS.gs);
}
function savePS(){try{localStorage.setItem(SK,JSON.stringify(PS));}catch{}}
loadPS();

function tpc(t){return PS.t[t]=PS.t[t]||{ch:[]};}
function cpc(t,ci){const tp=tpc(t);return tp.ch[ci]=tp.ch[ci]||{r:0,q:0,s:0,n:0};}
function isDone(t){
  const c=chunks(t);if(!c.length)return false;
  const tp=PS.t[t];if(!tp)return false;
  return c.every((_,i)=>tp.ch[i]&&tp.ch[i].q);
}
function doneChunks(t){
  const c=chunks(t),tp=PS.t[t];if(!tp)return 0;
  return c.filter((_,i)=>tp.ch[i]&&tp.ch[i].q).length;
}
function topicsDone(){return allTopics.filter(t=>isDone(t)).length;}
function qCovered(){
  const seen=new Set(PS.gs);
  allTopics.forEach(t=>{
    const c=chunks(t),tp=PS.t[t];if(!tp)return;
    c.forEach((ch,i)=>{if(tp.ch[i]&&tp.ch[i].q)ch.forEach(q=>seen.add(q.id));});
  });
  return seen.size;
}

// â”€â”€ ROUTING â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let CUR='home';
// ── ROUTING ──────────────────────────────────────────────────────
function setHash(h){
  const cur=(location.hash||'').replace(/^#/,'');
  if(cur!==h) history.pushState(null,'',h?'#'+h:location.pathname+location.search);
}
function applyHash(){
  const h=(location.hash||'').replace(/^#/,'');
  if(h==='stages'){homeView='stages';show('home');}
  else if(/^t\/\d+$/.test(h)){const si=parseInt(h.slice(2));homeView='topics';homeCat=CO[si]||'all';show('home');}
  else if(/^sq\/\d+$/.test(h)){const si=parseInt(h.slice(3));if(CO[si])startStageQuiz(CO[si]);else{homeView='stages';show('home');}}
  else if(h.startsWith('study/')){const t=decodeURIComponent(h.slice(6));if(byTopic[t])startTopic(t);else{homeView='topics';homeCat='all';show('home');}}
  else if(h==='gp'){startGP();}
  else{homeView='topics';homeCat='all';show('home');}
}
window.addEventListener('popstate',applyHash);

function show(s){
  ['home','study'].forEach(n=>{el('s-'+n).style.display=n===s?'':'none';});
  CUR=s;
  el('backBtn').style.display=s==='home'?'none':'';
  el('studyBar').style.display=s==='study'?'':'none';
  if(s==='home'){
    el('topTitle').textContent='Java MCQ';el('sessScore').textContent='';
    if(homeView==='stages')setHash('stages');
    else if(homeCat!=='all'){const si=CO.indexOf(homeCat);setHash(si>=0?'t/'+si:'');}
    else setHash('');
    renderHome();
  }
}
function goBack(){
  if(CUR==='study'){
    if(SS.topic==='__gp__'&&!SS.done){
      showModal('Mark as Seen?',
        'Count these '+SS.chs[SS.ci].length+' questions as seen in your practice pool?',
        [{l:'Yes, mark seen',c:'nbtn pri',f:'markGPSeenAndHome()'},{l:'No, just exit',c:'nbtn',f:'homeFromGP()'}]);
    }else{show('home');}
  }
}
function homeFromGP(){closeModal();show('home');}
function markGPSeenAndHome(){
  const chunk=SS.chs[SS.ci];
  const correct=chunk.filter(q=>SS.ans[q.id]===q.ans).length;
  chunk.forEach(q=>{if(!gpSeen.has(q.id)){gpSeen.add(q.id);PS.gs.push(q.id);}});
  PS.gp.n+=chunk.length;PS.gp.c+=correct;
  savePS();closeModal();show('home');
}
function toggleStageDone(si){
  if(!PS.sq[si])PS.sq[si]={};
  PS.sq[si].done=!PS.sq[si].done;
  savePS();renderHome();
}

// â”€â”€ HOME â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let homeCat='all',homeView='topics';
function setHomeView(v){homeView=v;setHash(v==='stages'?'stages':'');renderHome();}
function renderHome(){
  const td=topicsDone(),tt=allTopics.length;
  const cramSeen=CRAM_Q.filter(q=>gpSeen.has(q.id)).length;
  el('heroStats').innerHTML=
    '<div class="hstat"><div class="hstat-n">'+CRAM_Q.length+'</div><div class="hstat-l">Cram Qs</div></div>'+
    '<div class="hstat"><div class="hstat-n">'+tt+'</div><div class="hstat-l">Topics</div></div>'+
    '<div class="hstat"><div class="hstat-n">'+td+'</div><div class="hstat-l">Done</div></div>'+
    '<div class="hstat"><div class="hstat-n">'+cramSeen+'</div><div class="hstat-l">Seen</div></div>';
  el('pbar').style.width=(cramSeen/CRAM_Q.length*100)+'%';

  const cramUnseen=CRAM_Q.filter(q=>!gpSeen.has(q.id)).length;
  const acc=PS.gp.n>0?Math.round(PS.gp.c/PS.gp.n*100)+'%':'--';
  el('gpHero').innerHTML=
    '<div class="gp-icon"></div>'+
    '<div class="gp-txt"><h3>CRAM MODE \u2014 15 Qs Per Lap</h3>'+
    '<p>Stages 5\u201314 \u00b7 '+cramUnseen+' unseen \u00b7 acc: '+acc+'</p></div>'+
    '<span class="gp-badge">'+(PS.gp.n>0?acc:'CRAM NOW')+'</span>';

  const viewSwitch='<div class="view-switch">'+
    '<button class="vbtn'+(homeView==='topics'?' active':'')+'" onclick="setHomeView(\'topics\')">Topics</button>'+
    '<button class="vbtn'+(homeView==='stages'?' active':'')+'" onclick="setHomeView(\'stages\')">Stages</button>'+
    '</div>';

  if(homeView==='stages'){
    el('catTabs').innerHTML=viewSwitch;
    const doneCount=CO.filter((_,si)=>PS.sq&&PS.sq[si]&&PS.sq[si].done).length;
    el('topicList').innerHTML='<div class="sgrid">'+CO.map((stageName,si)=>{
      const topics=CM[stageName]||[],qs=topics.flatMap(t=>byTopic[t]||[]);
      const doneT=topics.filter(t=>isDone(t)).length;
      const pct=topics.length?Math.round(doneT/topics.length*100):0;
      const isDoneS=!!(PS.sq&&PS.sq[si]&&PS.sq[si].done);
      const shortName=stageName.replace(/^Stage \d+: /,'');
      return '<div class="sgc'+(isDoneS?' done':'')+'">'+
        '<div class="sgc-num">'+stageName.replace(/^(Stage \d+):.*/,'$1')+'</div>'+'
        '<div class="sgc-name">'+e(shortName)+'</div>'+
        '<div class="sgc-meta">'+topics.length+' topics \u00b7 '+qs.length+' questions</div>'+
        '<div class="tc-bar" style="margin-bottom:4px"><div class="tc-fill" style="width:'+pct+'%"></div></div>'+
        '<div style="font-size:10px;color:var(--g500);margin-bottom:2px">'+doneT+'/'+topics.length+' topics done</div>'+
        '<div class="sgc-acts">'+
          '<button class="sgc-qbtn" onclick="startStageQuiz(\''+ea(stageName)+'\')">Quiz Stage \u2192</button>'+
          '<button class="sgc-chk" onclick="toggleStageDone('+si+')" title="'+(isDoneS?'Unmark done':'Mark as done')+'">\u2713</button>'+
        '</div>'+
        '</div>';
    }).join('')+'</div>';
    el('sdis').textContent=doneCount+'/'+CO.length+' stages marked done';
    el('navBtns').innerHTML=
      '<button class="nbtn sm" onclick="showReset()">Reset</button>'+
      '<button class="nbtn pri" onclick="startGP()">General Practice</button>';
    return;
  }

  el('catTabs').innerHTML=viewSwitch+
    '<button class="cbtn'+(homeCat==='all'?' active':'')+'" onclick="setCat(\'all\')">All</button>'+
    CO.map(c=>'<button class="cbtn'+(homeCat===c?' active':'')+'" onclick="setCat(\''+ea(c)+'\')">'+e(c)+'</button>').join('');

  const cats=homeCat==='all'?CO:[homeCat];
  let html='';
  cats.forEach(cat=>{
    const topics=CM[cat]||[];if(!topics.length)return;
    const cards=topics.map(t=>{
      const c=chunks(t),done=doneChunks(t),pct=c.length?done/c.length*100:0,fin=isDone(t);
      return '<div class="tc'+(fin?' done':'')+'" onclick="startTopic(\''+ea(t)+'\')">'+
        (fin?'<span class="tc-chk">Done</span>':'')+
        '<div class="tc-name">'+e(t)+'</div>'+
        '<div class="tc-meta">'+(byTopic[t]||[]).length+' Q \u00b7 '+c.length+' chunk'+(c.length!==1?'s':'')+'</div>'+
        '<div class="tc-bar"><div class="tc-fill" style="width:'+pct+'%"></div></div>'+
        '<div class="tc-st">'+(fin?'Complete':done>0?done+'/'+c.length+' chunks':'Not started')+'</div></div>';
    }).join('');
    html+='<div class="cat-sec"><div class="cat-hdr">'+e(cat)+'</div><div class="tgrid">'+cards+'</div></div>';
  });
  el('topicList').innerHTML=html;
  el('sdis').textContent=td+'/'+tt+' topics done \u00b7 '+cramSeen+'/'+CRAM_Q.length+' cram Qs seen';
  el('navBtns').innerHTML=
    '<button class="nbtn sm" onclick="showReset()">Reset</button>'+
    '<button class="nbtn pri" onclick="startGP()">General Practice</button>';
}
function setCat(cat){
  homeCat=cat;homeView='topics';
  if(cat==='all')setHash('');
  else{const si=CO.indexOf(cat);if(si>=0)setHash('t/'+si);}
  renderHome();
}

// â”€â”€ STUDY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let SS={topic:'',chs:[],ci:0,phase:'read',ans:{},done:false};

function startTopic(topic){
  const chs=chunks(topic);if(!chs.length)return;
  const tp=PS.t[topic];
  let ci=0;
  if(tp){for(let i=0;i<chs.length;i++){if(tp.ch[i]&&tp.ch[i].q)ci=i+1;else break;}}
  ci=Math.min(ci,chs.length-1);
  SS={topic,chs,ci,phase:'read',ans:{},done:false};
  setHash('study/'+encodeURIComponent(topic));
  show('study');
  el('topTitle').textContent=topic;
  renderStudy();
}

function chgChunk(d){
  const n=SS.ci+d;
  if(n<0||n>=SS.chs.length)return;
  SS.ci=n;SS.phase='read';SS.ans={};SS.done=false;
  el('chunkSum').style.display='none';
  el('studyContent').style.display='';
  renderStudy();
}

function setPhase(p){
  if(p===SS.phase)return;
  SS.phase=p;SS.ans={};SS.done=false;
  el('chunkSum').style.display='none';
  el('studyContent').style.display='';
  renderStudy();
}

function renderStudy(){
  const {chs,ci,phase,topic}=SS,chunk=chs[ci];
  const isGP=topic==='__gp__';
  const isStage=topic.startsWith('__sq_');
  el('sh-topic').textContent=isGP?'General Practice':isStage?(SS.stageName||topic):topic;
  el('sh-info').textContent=isStage
    ?chunk.length+' questions \u00b7 random sample across '+(CM[SS.stageName]||[]).length+' topics'
    :(isGP?'Batch ':'Chunk ')+(ci+1)+' of '+chs.length+' \u00b7 '+chunk.length+' questions';
  el('clbl').textContent=isStage?chunk.length+' Qs':(isGP?'Batch ':'Chunk ')+(ci+1)+'/'+chs.length;
  el('prevC').disabled=ci===0;
  el('nextC').disabled=ci===chs.length-1;

  if(isGP){
    el('ldots').innerHTML='';
    el('pbar').style.width='0%';
  }else if(isStage){
    const maxD=Math.min(chs.length,10);
    let dhtml='';
    for(let i=0;i<maxD;i++){
      if(i>0)dhtml+='<div class="lline'+(i<=ci?' done':'')+'"></div>';
      dhtml+='<div class="ldot'+(i===ci?' active':i<ci?' done':'')+'">'+( i+1)+'</div>';
    }
    if(chs.length>10)dhtml+='<div style="font-size:9px;color:var(--g400);margin-left:2px">+'+(chs.length-10)+'</div>';
    el('ldots').innerHTML=dhtml;
    el('pbar').style.width=(ci/chs.length*100)+'%';
  }else{
    const tp=PS.t[topic],maxD=Math.min(chs.length,10);
    let dhtml='';
    for(let i=0;i<maxD;i++){
      const fin=tp&&tp.ch[i]&&tp.ch[i].q,act=i===ci;
      if(i>0)dhtml+='<div class="lline'+(fin?' done':'')+'"></div>';
      dhtml+='<div class="ldot'+(act?' active':fin?' done':'')+'">'+(i+1)+'</div>';
    }
    if(chs.length>10)dhtml+='<div style="font-size:9px;color:var(--g400);margin-left:2px">+'+(chs.length-10)+'</div>';
    el('ldots').innerHTML=dhtml;
    el('pbar').style.width=(doneChunks(topic)/chs.length*100)+'%';
  }

  el('mRead').className='phase-btn'+(phase==='read'?' active-read':'');
  el('mQuiz').className='phase-btn'+(phase==='quiz'?' active-quiz':'');

  if(phase==='read')renderRead(chunk,ci);
  else renderQuiz(chunk,ci);
}

function renderRead(chunk,ci){
  if(SS.topic!=='__gp__'&&!SS.topic.startsWith('__sq_')){cpc(SS.topic,ci).r=1;savePS();}
  el('chunkSum').style.display='none';el('studyContent').style.display='';
  el('studyContent').innerHTML=chunk.map((q,i)=>qCard(q,ci*CS+i,'read',{})).join('');
  el('sdis').textContent='Read mode \u2014 '+chunk.length+' questions with answers visible';
  el('navBtns').innerHTML=
    '<button class="nbtn" onclick="chgChunk(-1)" '+(ci===0?'disabled':'')+'>&#8592; Prev</button>'+
    '<button class="nbtn grn" onclick="setPhase(\'quiz\')">Take Quiz &#8594;</button>';
}

function renderQuiz(chunk,ci){
  if(SS.done){renderSum(chunk,ci);return;}
  el('chunkSum').style.display='none';el('studyContent').style.display='';
  const dots=chunk.map(q=>{const ch=SS.ans[q.id];return '<div class="qdot'+(ch?(ch===q.ans?' ans':' wrg'):'')+'"></div>';}).join('');
  el('studyContent').innerHTML=
    '<div class="qdots">'+dots+'</div>'+
    chunk.map((q,i)=>qCard(q,ci*CS+i,'quiz',SS.ans)).join('');

  const answered=Object.keys(SS.ans).length,total=chunk.length;
  const correct=chunk.filter(q=>SS.ans[q.id]===q.ans).length;
  el('sdis').textContent=answered===0?'Click an option to answer'
    :answered+'/'+total+' answered \u00b7 '+correct+' correct';
  const allDone=answered===total;
  el('navBtns').innerHTML=
    '<button class="nbtn" onclick="setPhase(\'read\')">&#8592; Review</button>'+
    '<button class="nbtn '+(allDone?'grn':'pri')+'" '+(allDone?'onclick="finishQuiz()"':'disabled')+'>'+
    (allDone?'See Results &#8594;':(total-answered)+' remaining')+'</button>';
}

function ansQ(qid,letter){
  if(SS.ans[qid])return;
  SS.ans[qid]=letter;
  renderQuiz(SS.chs[SS.ci],SS.ci);
  setTimeout(()=>{const e2=document.getElementById('qc-'+qid);if(e2)e2.scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}

function finishQuiz(){
  const chunk=SS.chs[SS.ci],ci=SS.ci;
  const correct=chunk.filter(q=>SS.ans[q.id]===q.ans).length;
  if(SS.topic==='__gp__'){
    chunk.forEach(q=>{gpSeen.add(q.id);PS.gs.push(q.id);});
    PS.gp.n+=chunk.length;PS.gp.c+=correct;savePS();
  }else if(SS.topic.startsWith('__sq_')){
    // no auto-tracking; user marks stage done manually
  }else{
    const cp=cpc(SS.topic,ci);cp.q=1;cp.s=correct;cp.n=chunk.length;savePS();
  }
  SS.done=true;renderSum(chunk,ci);
}

function renderSum(chunk,ci){
  const correct=chunk.filter(q=>SS.ans[q.id]===q.ans).length;
  const tot=chunk.length,pct=Math.round(correct/tot*100);
  const cls=pct>=80?'grt':pct>=50?'ok':'poor';
  const msgs={grt:'Excellent! Well done.',ok:'Good effort! Keep going.',poor:'Review and try again!'};
  const isGP=SS.topic==='__gp__';
  const isStage=SS.topic.startsWith('__sq_');
  const isLast=ci>=SS.chs.length-1,topicFin=!isGP&&!isStage&&isDone(SS.topic);
  el('studyContent').style.display='none';el('chunkSum').style.display='';
  el('csScore').textContent=correct+'/'+tot;
  el('csScore').className='csum-score '+cls;
  el('csLbl').textContent=isGP
    ?pct+'% correct \u00b7 '+(Q.length-gpSeen.size)+' questions left in pool'
    :isStage
      ?(pct+'% correct \u00b7 '+correct+'/'+tot+' questions')
      :(topicFin?'Topic Complete! All '+SS.chs.length+' chunks done.'
        :pct+'% correct \u00b7 Chunk '+(ci+1)+' of '+SS.chs.length);
  el('csMsg').textContent=msgs[cls];
  el('csBtns').innerHTML=
    '<button class="nbtn" onclick="setPhase(\'read\')">Review</button>'+
    '<button class="nbtn" onclick="retake()">Retake</button>'+
    (isGP?'<button class="nbtn pri" onclick="startGP()">Next Batch &#8594;</button>'
      :isStage?(isLast?'<button class="nbtn grn" onclick="show(\'home\')">Stage Done &#10003;</button>'
                      :'<button class="nbtn pri" onclick="chgChunk(1)">Next Part &#8594;</button>')
      :(isLast?'<button class="nbtn pri" onclick="show(\'home\')">All Topics</button>'
              :'<button class="nbtn pri" onclick="chgChunk(1)">Next Chunk &#8594;</button>'));
  el('sdis').textContent='Score: '+correct+'/'+tot+' ('+pct+'%)';
  el('navBtns').innerHTML=
    '<button class="nbtn" onclick="show(\'home\')">&#8592; Home</button>'+
    (isGP?'<button class="nbtn pri" onclick="startGP()">Next Batch &#8594;</button>'
      :isStage?(isLast?'':'<button class="nbtn pri" onclick="chgChunk(1)">Next Part &#8594;</button>')
      :(isLast?'':'<button class="nbtn pri" onclick="chgChunk(1)">Next Chunk &#8594;</button>'));
}
function retake(){SS.ans={};SS.done=false;renderQuiz(SS.chs[SS.ci],SS.ci);}

function qCard(q,gIdx,mode,ans){
  const chosen=ans[q.id];
  const optsHtml=q.opts.map(([k,t])=>{
    let cls='opt';
    if(mode==='read'){if(k===q.ans)cls+=' cr';}
    else{cls+=' click';if(chosen){cls+=' answered';if(k===q.ans)cls+=' cr';if(chosen===k&&k!==q.ans)cls+=' sw';}}
    const clk=(mode==='quiz'&&!chosen)?'onclick="ansQ('+q.id+',\''+k+'\')"':'';
    return '<div class="'+cls+'" '+clk+'><div class="opt-l">'+k.toUpperCase()+'</div><div>'+e(t)+'</div></div>';
  }).join('');
  let extra='';
  if(mode==='read'&&q.exp)extra='<div class="expl">'+e(q.exp)+'</div>';
  if(mode==='quiz'&&chosen){
    const ok=chosen===q.ans;
    extra='<div class="rexpl '+(ok?'rc':'rw')+'">'+(ok?'Correct!':'Wrong \u2014 correct: <b>'+q.ans.toUpperCase()+'</b>')+
      (q.exp?'<br><small style="opacity:.8;display:block;margin-top:3px">'+e(q.exp)+'</small>':'')+
      '</div>';
  }
  const LABELS=['i)','ii)','iii)','iv)'];
  const codeHtml=q.cod?(q.cod.length>1?q.cod.map((c,i)=>'<div class="cod-lbl">'+LABELS[i]+'</div><pre class="qcode">'+e(c)+'</pre>').join(''):'<pre class="qcode">'+e(q.cod[0])+'</pre>'):'';
  const qText=(q.cod&&q.cod.length>1)?q.q.replace(/(\n[ivx]+\))+\s*$/i,'').trim():q.q;
  return '<div class="qc" id="qc-'+q.id+'">'+
    '<div class="qnum">Q'+(gIdx+1)+'<span class="tbadge">'+e(q.topic)+'</span></div>'+
    '<div class="qtext">'+e(qText).replace(/\n/g,'<br>')+'</div>'+codeHtml+
    '<div class="opts">'+optsHtml+'</div>'+extra+'</div>';
}

// â”€â”€ GENERAL PRACTICE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function startGP(){
  const unCode=CRAM_Q.filter(q=>q.cod&&!gpSeen.has(q.id)).sort(()=>Math.random()-.5);
  const unNone=CRAM_Q.filter(q=>!q.cod&&!gpSeen.has(q.id)).sort(()=>Math.random()-.5);
  if(!unCode.length&&!unNone.length){
    showModal('Cram Complete!','You\u2019ve seen all '+CRAM_Q.length+' cram questions! Reset to restart.',
      [{l:'Reset & Restart',c:'nbtn pri',f:'resetPool()'},{l:'Cancel',c:'nbtn',f:'closeModal()'}]);
    return;
  }
  const maxCode=Math.floor(CS*0.3);
  const codeSlice=unCode.slice(0,maxCode);
  const noneSlice=unNone.slice(0,CS-codeSlice.length);
  const shortfall=CS-codeSlice.length-noneSlice.length;
  const fill=unCode.slice(maxCode,maxCode+shortfall);
  const batch=[...codeSlice,...noneSlice,...fill].slice(0,CS).sort(()=>Math.random()-.5);
  const lapNum=PS.gp.n+1;
  SS={topic:'__gp__',chs:[batch],ci:0,ans:{},done:false,phase:'quiz'};
  setHash('gp');
  show('study');
  el('topTitle').textContent='Cram Lap '+lapNum;
  renderStudy();
}
function resetPool(){PS.gs=[];PS.gp={n:0,c:0};gpSeen.clear();savePS();closeModal();renderHome();}

function startStageQuiz(stageName){
  const topics=CM[stageName]||[];
  // Sample ~50% from each topic, then shuffle across topics
  const qs=topics.flatMap(t=>{
    const tqs=[...(byTopic[t]||[])].sort(()=>Math.random()-.5);
    return tqs.slice(0,Math.max(1,Math.round(tqs.length*.5)));
  }).sort(()=>Math.random()-.5);
  if(!qs.length)return;
  const si=CO.indexOf(stageName);
  if(!PS.sq[si])PS.sq[si]={};
  // Single chunk — one focused quiz, no parts
  SS={topic:'__sq_'+si+'__',chs:[qs],ci:0,phase:'quiz',ans:{},done:false,stageName};
  setHash('sq/'+si);
  show('study');
  el('topTitle').textContent=stageName;
  renderStudy();
}
