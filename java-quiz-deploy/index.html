n{\n    private int num;\n    Sum(int rn)\n    {\n        num = num + rn;\n    }\n    public static void main(String args[])\n    {\n        Sum obj = new Sum();\n    }\n}"],"exp":"In the above program, the constructor Sum() takes an integer parameter and adds it with the instance variable 'num'. But the object 'obj' created for calling the constructor doesn't have any parameter, hence the compiler throws an error."},{"id":1206,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","50"],["b","0"],["c","Compilation Error"],["d","Null"]],"ans":"c","cod":["class Division\n{\n    int num;\n    Division(int div)\n    {\n        num = div/num;\n    }\n    public static void main(String args[])\n    {\n        Division obj = new Division(50);\n    }\n}"],"exp":"In the above class Division, there is a parameterized constructor which takes the dividend as an input for the division operation to be performed inside the block. Since the instance variable 'num' is not initialized, it is assigned a default value of 0. Since division by 0 is not valid, the compiler throws an error during run-time."},{"id":1207,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","50"],["b","Infinite"],["c","Compilation Error"],["d","0"]],"ans":"c","cod":["class Cricket\n{\n    int runs,balls;\n    Cricket(char x)\n    {\n        x=5;\n    }\n    Cricket(int runs, int balls)\n    {\n        int strikerate = runs/balls * 100;\n    }\n\n    public static void main(String args[])\n    {\n        Cricket obj = new Cricket(50);\n    }\n}"],"exp":"In the above program, the class Cricket has one parameterized constructor and one default constructor, used to calculate Strike Rate and other to assign a value of 5 respectively. As 'runs' and 'balls' are parameters, they need to be present in the function call in the main() method. But in this case, there is only one value given in the function call. Therefore, an error is thrown."},{"id":1208,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","1"],["b","100"],["c","Compilation Error"],["d","50"]],"ans":"b","cod":["class Cricket2\n{\n    int runs,balls;\n    Cricket2()\n    {\n        runs=0;\n    }\n    Cricket2(int runs, int balls)\n    {\n        int strikerate = runs/balls * 100;\n        System.out.println(strikerate);\n    }\n    public static void main(String args[])\n    {\n        Cricket2 obj = new Cricket2(50, 50);\n    }\n}"],"exp":"The above program uses the concept of constructor overloading to perform an arithmetic operation. There are two constructors in the class Cricket2. One is a default constructor while the other is a parameterized one. Since the parameterized constructor is called in the main() method, it is executed while the initialization is ignored."},{"id":1209,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","0"],["b","Garbage Value"],["c","Compilation Error"],["d","No Output"]],"ans":"d","cod":["class Data\n{\n    int num;\n    Data()\n    {\n        num=0;\n    }\n    Data(int num)\n    {\n        System.out.println(num);\n    }\n    public static void main(String args[])\n    {\n        Data obj = new Data();\n    }\n}"],"exp":"The above program is uses two constructors of the same name 'Data', which is also called as constructor overloading in object oriented programming. The parameterized constructor prints the input received but there is no input given during the object creation which indicates that only the default constructor is executed and hence no output."},{"id":1210,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","75"],["b","0"],["c","Null"],["d","Compilation Error"]],"ans":"a","cod":["class Display\n{\n    long num;\n    Display()\n    {\n        num=0;\n        System.out.println(num);\n    }\n    Display(long num)\n    {\n        System.out.println(num);\n    }\n    public static void main(String args[])\n    {\n        Display obj = new Display(75);\n    }\n}"],"exp":"Constructor overloading is a concept of having more than one constructor with different parameters or with different datatypes. In the above program, class Display has two constructors-one default constructor and other of type parameterized. Only the parameterized constructor is executed by the compiler due to the object creation statement in the main() method."},{"id":1211,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","3"],["b","0"],["c","Null"],["d","Compilation Error"]],"ans":"a","cod":["class DefaultConstructor\n{\n    float num;\n    public DefaultConstructor(int num)\n    {\n        this.num=num;\n    }\n    public DefaultConstructor(float num)\n    {\n        this.num=num;\n    }\n    void Display()\n    {\n        System.out.println(num);\n    }\n    public static void main(String[] args)\n    {\n        DefaultConstructor obj2=new DefaultConstructor(3);\n        obj2.Display();\n    }\n}"],"exp":"In the above program, a class named DefaultConstructor has two default constructors used to initial the float variable 'num'. The object created in the main() method is given an int value, hence the constructor with int parameter is executed."},{"id":1212,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","27.0"],["b","27"],["c","Compilation error"],["d","0"]],"ans":"c","cod":["class Cube\n{\n    float num;\n    public Cube(int num)\n    {\n        this.num=num*num*num;\n    }\n    public Cube(char num)\n    {\n        this.num=num*num*num;\n    }\n    void Display()\n    {\n        System.out.println(num);\n    }\n    public static void main(String[] args)\n    {\n        Cube obj=new Cube(3.0);\n        obj.Display();\n    }\n}"],"exp":"In the above program, the class Cube has two constructors. While one of them has a parameter of type int, the other one has a parameter of type char. In the main() method, the object is created for a float value even though none of the constructors accept that value. Hence an error is thrown due to contrasting datatypes."},{"id":1213,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","25"],["b","12.5"],["c","12"],["d","Compilation Error"]],"ans":"a","cod":["class Triangle extends Square\n{\n    Triangle(int b,int h)\n    {\n        double area=(b*h)/2;\n        System.out.println(area);\n    }\n    public static void main(String args[])\n    {\n        Square obj=new Square(5);\n    }\n}\nclass Square\n{\n    Square(int l)\n    {\n        System.out.println(l*l);\n    }\n}"],"exp":"Constructor overloading is a concept in programming in which a class may have any number of constructors that differ in parameter list. It can be combined with inheritance as shown in the above program. The object created is of class Sqaure and hence the Square constructor is executed."},{"id":1214,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","5"],["b","6"],["c","0"],["d","Compilation error"]],"ans":"b","cod":[" class Even\n{\n    long num;\n    Even()\n    {\n        if(num%2 == 0)\n            System.out.println(num--);\n    }\n    Even(long num)\n    {\n        System.out.println(num);\n    }\n    public static void main(String args[])\n    {\n        Even obj = new Even(6);\n    }\n}"],"exp":"In the above program, class Even consists of two constructors. The parameterized constructor prints the number while the no-arguement constructor checks whether the number is even. In the object creation, only the parameterized constructor is executed as one value is given."},{"id":1215,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","5.99"],["b","6.0"],["c","Compilation Error"],["d","Garbage Value"]],"ans":"c","cod":["class Number\n{\n    long num;\n    Number(float num)\n    {\n        System.out.println(num--);\n    }\n    Number(char num)\n    {\n        System.out.println(num);\n    }\n    public static void main(String args[])\n    {\n        Number obj = new Number(6.0);\n    }\n}"],"exp":"The above program is an illustration of constructor overloading. Both the constructors are parameterized and take in float and char type parameters respectively. In the main method, the value passed during the object creation is of type float, hence an error is thrown."},{"id":1216,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","7.0"],["b","7"],["c","6.0"],["d","5.0"]],"ans":"a","cod":["class Unary\n{\n    protected int num;\n    Unary(float num)\n    {\n        System.out.println(num--);\n    }\n    Unary(double num)\n    {\n        System.out.println(++num);\n    }\n    public static void main(String args[])\n    {\n        Unary obj = new Unary(6.0);\n    }\n}"],"exp":"The above program is an example of constructor overloading. There are two constructors with the same name but different parameters(data types). During the object creation, a double value of 6.0 is given, therefore the constructor with a double datatype is executed while the other constructor is ignored."},{"id":1217,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","0"],["c","Garbage Value"],["d","-1"]],"ans":"a","cod":["class Constructor\n{\n    int x;\n    public Constructor()\n    {\n        x = 5;\n    }\n    public static void main(String[] args)\n    {\n        Constructor obj = new Constructor();\n        System.out.println(obj.x);\n    }\n}"],"exp":"A constructor in Java is a special method that is used to initialize objects. They are used to set initial values for object attributes also. In this case, the variable 'x' is initialized in the same manner."},{"id":1218,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","0"],["c","Garbage Value"],["d","-1"]],"ans":"b","cod":["class Constructor\n{\n    int x;\n    public void Constructor()\n    {\n        x = 5;\n    }\n    public static void main(String[] args)\n    {\n        Constructor obj = new Constructor();\n        System.out.println(obj.x);\n    }\n}"],"exp":"A constructor in Java is a special method that is used to initialize objects. They have no return type, not even the 'void' keyword that is used to indicate that there is no return type. In this case, Constructor() is an ordinary method because it has the 'void' keyword. Hence, the compiler assigns a default value of 0 to 'x' which is a class variable."},{"id":1219,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","0"],["c","1"],["d","-1"]],"ans":"a","cod":["class Constructor\n{\n    static int x = 1;\n    public  Constructor()\n    {\n        x = 5;\n    }\n    public static void main(String[] args)\n    {\n        Constructor obj = new Constructor();\n        System.out.println(obj.x);\n    }\n}"],"exp":"Constructor is a block of code that initializes the newly created object. The constructor has the same name as that of the class. In the above program, the constructor initializes the value of variable 'x' to 5."},{"id":1220,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","0"],["c","1"],["d","4"]],"ans":"d","cod":["class Constructor\n{\n    static int x = 1;\n    public  Constructor(int n)\n    {\n        x = n;\n    }\n    public static void main(String[] args)\n    {\n        Constructor obj = new Constructor(4);\n        System.out.println(obj.x);\n    }\n}"],"exp":"Constructor is a block of code that initializes the newly created object. The constructor has the same name as that of the class. In the above program, a parameterized constructor is used to initialize the value of class variable."},{"id":1221,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","0"],["c","1"],["d","4"]],"ans":"d","cod":["class Constructor\n{\n    int x=1;\n    public Constructor(int n)\n    {\n        x=x+n;\n    }\n    public static void main(String[] args)\n    {\n        Constructor obj = new Constructor(3);\n        System.out.println(obj.x);\n    }\n}"],"exp":"A constructor in Java is a special method that is used to initialize objects. The constructor has the same name as that of the class. Since the variable 'x' is of class type, it is possible to modify it inside the constructor."},{"id":1222,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","Compilation error"],["c","Garbage Value"],["d","4"]],"ans":"b","cod":["class Constructor\n{\n    final int x=1;\n    public Constructor(int n)\n    {\n        x=x+n;\n    }\n    public static void main(String[] args)\n    {\n        Constructor obj = new Constructor(3);\n        System.out.println(obj.x);\n    }\n}"],"exp":"A constructor is similar to a method that is invoked automatically when an object of the class is created. A constructor has the same name as that of class and it does not return any value. Here, variable 'x' of type final and hence it is not possible to modify the value of variables."},{"id":1223,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","Compilation error"],["c","10"],["d","4"]],"ans":"c","cod":["class Constructor\n{\n    private int x;\n    private Constructor()\n    {\n        System.out.println(\"Constructor Called\");\n        x = 10;\n    }\n   public static void main(String[] args)\n   {\n       Constructor obj = new Constructor();\n       System.out.println(\"Value of x = \" + obj.x);\n   }\n}"],"exp":"A constructor is a member function of a class which initializes objects of a class. A constructor has the same name as that of class and it does not return any value. It doesn't return any value but can have an access-specifier to control the execution in different classes."},{"id":1224,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","Compilation error"],["c","10"],["d","4"]],"ans":"b","cod":["class Constructor\n{\n    private int x;\n    private Constructor()\n    {\n        System.out.println(\"Constructor Called\");\n        x = 15;\n    }\n}\nclass Main\n{\n   public static void main(String[] args)\n   {\n       Constructor obj = new Constructor();\n       System.out.println(\"Value of x = \" + obj.x);\n   }\n}"],"exp":"The constructor method is a special method for creating and initializing an object created within a class. Since the variable 'x' is of type private, it has access only in the particular class. Members of a program present outside a class cannot be accessed."},{"id":1225,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","Dravid"],["b","Compilation error"],["c","Garbage value"],["d","Null"]],"ans":"a","cod":["class Name\n{\n    Name(String str)\n    {\n        System.out.println(str);\n    }\n    public static void main(String args[])\n    {\n        Name ob=new Name(\"Dravid\");\n    }\n}"],"exp":"In Java, a constructor is a block of codes similar to the method. It is called when an instance of the class is created. An object 'ob' is created of class type 'Name'. It is given a parameterized value of "Dravid"."},{"id":1226,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","abc"],["b","Null"],["c","Compilation error"],["d","-1"]],"ans":"a","cod":["class Name\n{\n    String str=\"abc\";\n    Name()\n    {\n        System.out.println(str);\n    }\n    public static void main(String args[])\n    {\n        Name ob=new Name();\n    }\n}"],"exp":"Constructor is a block of code that initializes the newly created object. It has the same name as that of the class. The constructor is invoked as soon as the object 'ob' of class Name is created."},{"id":1227,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","Compilation error"],["c","12"],["d","7"]],"ans":"d","cod":["class Main\n{\n    int x=5;\n    Main()\n    {\n        this.x = 7;\n    }\n    public static void main(String[] args)\n    {\n        Main obj = new Main();\n        System.out.println(obj.x);\n    }\n}"],"exp":"A constructor in Java is a special method that is used to initialize objects. They are used to set initial values for object attributes also. 'this' keyword is used to refer to the current object."},{"id":1228,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","Compilation error"],["c","Garbage value"],["d","10"]],"ans":"d","cod":["class Main\n{\n    int x=10;\n    Main()\n    {\n        this.x = x;\n    }\n    public static void main(String[] args)\n    {\n        Main obj = new Main();\n        System.out.println(obj.x);\n    }\n}"],"exp":"A constructor is a special method that is used to initialize a newly created object. 'this' keyword is a reference to the current object, whose method is being called upon."},{"id":1229,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","Garbage value"],["b","10"],["c","-1"],["d","15"]],"ans":"d","cod":["class Main\n{\n    int x=10;\n    Main()\n    {\n        System.out.print(x+\" \");\n    }\n    Main(int x)\n    {\n        this.x = x;\n        System.out.print(x+\" \");\n    }\n    public static void main(String[] args)\n    {\n        Main obj = new Main(15);\n        System.out.println(obj.x);\n    }\n}"],"exp":"'this' is a reference variable that refers to the current object. It is also used to distinguish between parameters and class variables. The constructor is invoked as soon as the object is created and the parameterized constructor is executed while the default constructor is ignored."},{"id":1230,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","Garbage value"],["b","7 5"],["c","5 7"],["d","5"]],"ans":"c","cod":["class Main\n{\n    int x=7;\n    Main()\n    {\n        System.out.print(x+\" \");\n    }\n    Main(int x)\n    {\n        this.x = x;\n        System.out.print(x+\" \");\n    }\n    public static void main(String[] args)\n    {\n        Main obj = new Main(5);\n        Main obj2= new Main();\n    }\n}"],"exp":"The most common use of the this keyword is to eliminate the confusion between class attributes and parameters with the same name. It refers to the current object in a method or constructor. Here, the default constructor is called first and then the parameterized constructor is executed."},{"id":1231,"cat":"OOP using Java","topic":"Constructors","q":"What is the output of the following Java code?","opts":[["a","10"],["b","Garbage value"],["c","Compilation error"],["d","10 10"]],"ans":"a","cod":["class Constructor\n{\n    int x=10;\n    public void Constructor(int x)\n    {\n        this.x = x;\n        System.out.print(x+\" \");\n    }\n\n    public static void main(String[] args)\n    {\n        Constructor obj = new Constructor();\n        System.out.println(obj.x);\n    }\n}"],"exp":"A constructor is a member function of a class which initializes objects of a class. There is only one constructor in the above program, that too a parameterized constructor. Since only a default constructor execution statement is given in the main() method, compiler assigns the value of 10 automatically and thereby the parameterized constructor is not executed."},{"id":1232,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","Runtime Error"],["c","a"],["d","Sanfoundry"]],"ans":"d","cod":["public class Main\n{\n    String s;\n    Main(String s)\n    {\n        this.s = s;\n    }\n    Main(Main a)\n    {\n        s = a.s;\n    }\n    void Print()\n    {\n        System.out.println(s);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"Sanfoundry\");\n        Main b = new Main(a);\n        b.Print();\n    }\n}"],"exp":"The copy constructor takes an object of the same class as an argument and then copies the value of the string variable s of the object passed to that of the object veing created."},{"id":1233,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a","Free 30-Day Java Certification Bootcamp is Live. Join Now!"],["b",""],["c",""],["d",""]],"ans":"c","cod":["public class Main\n{\n    int a;\n    Main(int a)\n    {\n        this.a = a;\n    }\n    Main(Main s)\n    {\n        a = 10;\n    }\n    void disp()\n    {\n        System.out.println(a);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(20);\n        Main b = new Main(a);\n        a.disp();\n        b.disp();\n    }\n}"],"exp":"For the object a, the value of the variable a is set to 20. When b is created, the copy constructor is called, but the value here is being set to 10."},{"id":1234,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["public class Main\n{\n    int a;\n    int b;\n    Main(int a, int b)\n    {\n        this.a = a;\n        this.b = b;\n    }\n    Main(Main s)\n    {\n        a = s.a;\n        b = s.b;\n    }\n    void Set()\n    {\n        a = 10;\n        b = 20;\n    }\n    void calc()\n    {\n        System.out.println(a*b);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(20, 30);\n        Main b = new Main(a);\n        a.calc();\n        a.Set();\n        b.calc();\n    }\n}"],"exp":"Since a copy constructor is being used instead of equating the objects, they do not correspond to the same object, therefore changing one object doesn't affect the other."},{"id":1235,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","C"],["c","o"],["d","a"]],"ans":"c","cod":["public class Main\n{\n    String s;\n    Main(String s)\n    {\n        this.s = s;\n    }\n    Main(Main a)\n    {\n        s = a.s;\n    }\n    void pos(int a)\n    {\n        System.out.println(s.charAt(a));\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"Copy Constructor\");\n        Main b = new Main(a);\n        b.pos(6);\n    }\n}"],"exp":"The charAt function returns the character at the index passed to it in the string calling it. As indexing starts at 0, the 6th index corresponds to the 7th position in the string."},{"id":1236,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b",""],["c",""],["d",""]],"ans":"c","cod":["public class Main\n{\n    String s;\n    Main(String s)\n    {\n        this.s = s;\n    }\n    Main(Main a)\n    {\n        s = a.s;\n    }\n    void print()\n    {\n        System.out.println(this);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"Copy Constructor\");\n        Main b = new Main(a);\n        a.print();\n        b.print();\n    }\n}"],"exp":"When an object is printed, it is printed in the format ClassName@HashCode. Since a copy constructor is used here, they do not correspond to the same object, hence have different hashcodes."},{"id":1237,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b",""],["c",""],["d",""]],"ans":"c","cod":["public class Main\n{\n    String s;\n    Main(String s)\n    {\n        this.s = s;\n    }\n    void print()\n    {\n        System.out.println(this);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"Copy Constructor\");\n        Main b = a;\n        a.print();\n        b.print();\n    }\n}"],"exp":"The object b is equated to b, hence linking it to the same object. When an object is printed, it is printed in the format ClassName@HashCode. Since both of them correspond to the same object, they have the same hashcode."},{"id":1238,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"c","cod":["public class Main\n{\n    int a;\n    Main(int a)\n    {\n        this.a = a;\n    }\n    Main(Main s)\n    {\n        a = s.a;\n    }\n    void set()\n    {\n        a = 40;\n    }\n    void display()\n    {\n        System.out.println(a);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(10);\n        Main b = new Main(a);\n        Main c = a;\n        a.display();\n        a.set();\n        b.display();\n        c.display();\n    }\n}"],"exp":"When an object is copied using the copy constructor, it creates a new reference for that object, thus changing it won't affect the other object. Equating an object links both the object to the same reference, hence changing any one affects the other."},{"id":1239,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a",""],["b","Compilation Error"],["c",""],["d",""]],"ans":"d","cod":["public class Main\n{\n    char s;\n    Main(char s)\n    {\n        this.s = s;\n    }\n    Main(Main a)\n    {\n        s = 's';\n    }\n    void Char()\n    {\n        System.out.println((int)s);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main('S');\n        Main b = new Main(a);\n        a.Char();\n        b.Char();\n    }\n}"],"exp":"The copy constructor changes the value of String s to the character 's'. The ascii value of 'S' is 83 and 's' is 115."},{"id":1240,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"b","cod":["import java.util.*;\npublic class Main\n{\n    LinkedList l = new LinkedList();\n    Main(int i)\n    {\n        l.add(i);\n    }\n    Main(Main a)\n    {\n        l = (LinkedList) a.l.clone();\n    }\n    void push(int a)\n    {\n        l.add(a);\n    }\n    void size()\n    {\n        System.out.println(l.size());\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(5);\n        Main b = new Main(a);\n        a.push(10);\n        b.size();\n        a.size();\n    }\n}"],"exp":"The copy constructor creates a clone of the linkedlist, hence they do not correspond to the same linked list, hence changing a doesn't change b."},{"id":1241,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["import java.util.*;\npublic class Main\n{\n    LinkedList l = new LinkedList();\n    Main(int i)\n    {\n        l.add(i);\n    }\n    Main(Main a)\n    {\n        l = (LinkedList) a.l.clone();\n    }\n    void push(int a)\n    {\n        l.add(a);\n    }\n    void size()\n    {\n        System.out.println(l.size());\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(10);\n        Main b = a;\n        a.push(20);\n        b.size();\n        a.size();\n    }\n}"],"exp":"The object b is equated to a, which links both the objects to the same reference, therefore a change in a results a change in b."},{"id":1242,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"c","cod":["import java.util.*;\npublic class Main\n{\n    LinkedList l = new LinkedList();\n    Main(int i)\n    {\n        l.add(i);\n    }\n    Main(Main a)\n    {\n        l = (LinkedList) a.l.clone();\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(5);\n        Main b = new Main(a);\n        System.out.println(b.getClass());\n        System.out.println(a.getClass().getSuperclass());\n    }\n}"],"exp":"A class is an object of the superclass Object of the lang package of Java. Therefore when the superclass of Main is called, it returns java.lang.Object."},{"id":1243,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"c","cod":["import java.util.*;\npublic class Main\n{\n    LinkedList l = new LinkedList();\n    Main(int i)\n    {\n        l.add(i);\n    }\n    Main(Main a)\n    {\n        l = (LinkedList) a.l.clone();\n    }\n    void className()\n    {\n        System.out.println(l.getClass());\n        System.out.println(l.getClass().getSuperclass());\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(5);\n        Main b = a;\n        b.className();\n    }\n}"],"exp":"The LinkedList is a subclass of the class AbstractSequentialList in the util package of java. The classname() function therefore executes the getClass() method which returns the paths of Linked list and Sequential LinkedList respectively."},{"id":1244,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["import java.util.*;\npublic class Main\n{\n    LinkedList l = new LinkedList();\n    Main(int i)\n    {\n        l.add(i);\n    }\n    Main(Main a)\n    {\n        l = (LinkedList) a.l.clone();\n    }\n    void push(int a)\n    {\n        l.add(a);\n    }\n    void print()\n    {\n        System.out.println(l);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(5);\n        Main b = new Main(a);\n        a.push(10);\n        a.push(20);\n        b.push(30);\n        b.push(40);\n        b.print();\n        a.print();\n    }\n}"],"exp":"Linked lists are displayed with elements inside square brackets[] separated by commas. Here, the object b is copied from a, hence it retains the 5 that was initially passed to a."},{"id":1245,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["import java.util.*;\npublic class Main\n{\n    int a,b;\n    Main(int i, int j)\n    {\n        a=i;\n        b=j;\n    }\n    Main(Main m)\n    {\n        a=m.a;\n        b=m.b;\n    }\n    void change(int i, int j)\n    {\n        a=i;\n        b=j;\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(5, 10);\n        Main b = new Main(a);\n        System.out.println(a.a*a.b);\n        System.out.println(b.a*b.b);\n        a.change(30,40);\n        System.out.println(b.a*b.b);\n    }\n}"],"exp":"The object b is copied from object a using a copy constructor, hence they aren't linked to the same reference. Therefore changing a doesn't change b."},{"id":1246,"cat":"OOP using Java","topic":"Copy Constructors","q":"What will be the output of the following Java code?","opts":[["a","108"],["b","27"],["c","216"],["d","Compilation Error"]],"ans":"a","cod":["import java.util.*;\npublic class Main\n{\n    int a,b;\n    Main(int i, int j)\n    {\n        a=i;\n        b=j;\n    }\n    Main(Main m)\n    {\n        a=m.a;\n        b=m.b;\n    }\n    void push()\n    {\n        System.out.println(a<<b);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(27, 2);\n        Main b = new Main(a);\n        b.push();\n\n    }\n}"],"exp":"The left shift operator shifts the bits of the operand to the left followed by 0s. Here the bits of a are pushed to the left 2 times, hence increasing the value to 4 times the original value."},{"id":1247,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a","Price: 20"],["b","20"],["c","Compilation error"],["d","Runtime error"]],"ans":"c","cod":["class Books\n{\n    abstract int price;\n    Books(int p)\n    {\n        this.price = p;\n    }\n    public void getPrice()\n    {\n        System.out.println(\"Price: \"+this.price);\n    }\n}\npublic class AbstractDataMembers\n{\n    public static void main(String[] args)\n    {\n        Books b = new Books(20);\n        b.getPrice();\n    }\n}"],"exp":"An abstract modifier in java is a non-access modifier which can only be applied to classes and methods but not for variables. In the program, we marked the instance data member "price" as an abstract, so we get a compilation error."},{"id":1248,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a","Free 30-Day Python Certification Bootcamp is Live. Join Now!"],["b",""],["c",""],["d",""]],"ans":"c","cod":["import java.io.*;\nclass TransientVariables implements Serializable\n{\n    int num1 = 20;\n    transient int num2 = 30;\n    public static void main(String[] args) throws Exception\n    {\n        TransientVariables t = new TransientVariables();\n        FileOutputStream fo = new FileOutputStream(\"input.txt\");\n        ObjectOutputStream oo = new ObjectOutputStream(fo);\n        oo.writeObject(t);\n        FileInputStream fi = new FileInputStream(\"input.txt\");\n        ObjectInputStream oi = new ObjectInputStream(fi);\n        TransientVariables t1 = (TransientVariables) oi.readObject();\n        System.out.println(\"num1: \" + t1.num1);\n        System.out.println(\"num2: \" + t1.num2);\n    }\n}"],"exp":"Instance data members can be transient in java. In the program, we declared the instance data member "num2" as transient. The transient keyword makes the JVM ignore the original value of the variable "num2" (20) at the time of serialization and saves the default value of the variable's data type. As "num2" is an integer, it saves 0 as default value."},{"id":1249,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a","Speed: 10"],["b","Compilation error"],["c","Runtime error"],["d","Speed: 0"]],"ans":"a","cod":["//Create a directory/folder named p1, and save a Java file(Vehicle.java)\npackage p1;\npublic class Vehicle\n{\n    protected int color;\n    protected int speed = 10;\n}\n//Create another directory named p2, and save a Java file(ProtectedVariables.java) and make sure that two packages should be under the same root directory.\n//another program\npackage p2;\nimport p1.Vehicle; //import package p1\npublic class ProtectedVariables extends Vehicle\n{\n    public static void main(String[] args)\n    {\n        ProtectedVariables p = new ProtectedVariables();\n        System.out.println(\"Speed: \"+p.speed);\n    }\n}"],"exp":"We can access the Protected modifiers outside the package by using Inheritance. In the program, we have accessed the protected variable "speed" outside the package (p1) by importing the package(p1) in p2."},{"id":1250,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a","Book Title: Java Programming"],["b","Compilation error"],["c","Runtime error"],["d","Java Programming"]],"ans":"b","cod":["class Book\n{\n    String title;\n    String author;\n    Book(String t)\n    {\n        this.title = t;\n    }\n}\npublic class InstanceMembers\n{\n    public static void main(String[] args)\n    {\n        Book b = new Book(\"Java Programming\");\n        System.out.println(\"Book Title: \"+Book.title);\n    }\n}"],"exp":"An instance variable is accessed using the respective object name. In the program, we are accessing it by calling the class name, so we get an error. Instance data members are also known as "Object Level Data Members" because they depend on object names instead of class names."},{"id":1251,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Runtime error"]],"ans":"a","cod":["class Employee\n{\n    int salary = 1000000;\n    static float experience = 4.5f;\n}\npublic class StaticDatamembers\n{\n    public static void main(String[] args)\n    {\n        Employee e = new Employee();\n        System.out.println(e.experience);\n        System.out.println(Employee.experience);\n    }\n}"],"exp":"Unlike the Instance variable, we can access static variables through objects or directly using class names. As the variable "experience" in the program is static, we don't get an error."},{"id":1252,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a","Compilation error"],["b","Runtime error"],["c","Instance variables cannot be protected"],["d","Java"]],"ans":"d","cod":["class Student\n{\n    protected String name = \"Java\";\n}\nclass ProtectedVariables\n{\n    public static void main(String[] args)\n    {\n        Student s = new Student();\n        System.out.println(s.name);\n    }\n}"],"exp":"The protected access modifier is accessible within the package. However, it can also be accessible outside the package but through the inheritance only."},{"id":1253,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a","Initialize instance variables before use"],["b","Compilation error"],["c","Area: 0"],["d","Runtime error"]],"ans":"c","cod":["class Area\n{\n    int side;\n    public int squareArea()\n    {\n        int a = this.side * this.side;\n        return a;\n    }\n}\npublic class InstanceVariables\n{\n    public static void main(String[] args)\n    {\n        Area a = new Area();\n        System.out.println(\"Area: \"+a.squareArea());\n    }\n}"],"exp":"Instance variables in java are initialized to their default values if the code doesn't explicitly initialize them. In the program, we didn't initialize the variable "side", so, by default, we get the value as 0 because the variable "side" is an integer."},{"id":1254,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a","Speed: 10"],["b","Compilation error"],["c","Runtime error"],["d",""]],"ans":"b","cod":["class Distance\n{\n    int time;\n    static int speed = 10;\n    static\n    {\n        int d = speed * time;\n    }\n}\npublic class StaticVariables\n{\n    public static void main(String[] args)\n    {\n        Distance d = new Distance();\n        System.out.println(\"Speed: \"+d.speed);\n        System.out.println(\"Time: \"+d.time);\n    }\n}"],"exp":"Static methods/blocks can only use those instance variables that are static. But in the program, the instance variable "time" is not static, so we get a compilation error as we are using the non-static variable in the static block."},{"id":1255,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a","Simple Interest: 600"],["b","Compilation error"],["c","Runtime error"],["d","Simple Interest: 60"]],"ans":"d","cod":["class Interest\n{\n    int principal = 1000;\n    int time = 2;\n    static int rate = 3;\n    static\n    {\n        Interest i = new Interest();\n        int interest = (i.principal * i.time * rate)/100;\n        System.out.println(\"Simple Interest: \"+interest);\n    }\n}\npublic class StaticMembers\n{\n    public static void main(String[] args)\n    {\n        Interest i = new Interest();\n    }\n}"],"exp":"We can use the instance variables inside the static blocks by creating the instance of a class. In the program, we used the non-static variables (principal, time) by creating the instance of the class."},{"id":1256,"cat":"OOP using Java","topic":"Data Members","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["import java.io.*;\nclass TransientAndFinal implements Serializable\n{\n    int num1 = 50;\n    transient final int num2 = 100;\n    public static void main(String[] args) throws Exception\n    {\n        TransientAndFinal t = new TransientAndFinal();\n        FileOutputStream fo = new FileOutputStream(\"input.txt\");\n        ObjectOutputStream oo = new ObjectOutputStream(fo);\n        oo.writeObject(t);\n        FileInputStream fi = new FileInputStream(\"input.txt\");\n        ObjectInputStream oi = new ObjectInputStream(fi);\n        TransientAndFinal t1 = (TransientAndFinal) oi.readObject();\n        System.out.println(\"num1: \" + t1.num1);\n        System.out.println(\"num2: \" + t1.num2);\n    }\n}"],"exp":"The instance variable "num2" is both final and transient. Final variables are directly serialized by their values, so there is no impact of declaring the final variable "num2" as transient."},{"id":1257,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c","Compilation Error"],["d",""]],"ans":"a","cod":["class one\n{\n    public void print1()\n    {\n        System.out.println(\"Hello\");\n    }\n}\nclass two extends one\n{\n    public void print2()\n    {\n        System.out.println(\"World\");\n    }\n}\nclass Main\n{\n    public static void main(String[] args)\n    {\n        two g = new two();\n        g.print2();\n        g.print1();\n    }\n}"],"exp":"In single inheritance, subclasses inherit the features of one superclass. In this case, class two is the subclass which inherits the properties of class 'one', which is the superclass. Hence, print2() method is executed first as it is called earlier than print1() method."},{"id":1258,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c","Compilation error"],["d","Child function"]],"ans":"a","cod":["class Super\n{\n    public void pfunc()\n    {\n        System.out.println(\"Parent function\");\n    }\n}\nclass Sub extends Super\n{\n    public void cfunc()\n    {\n        System.out.println(\"Child function\");\n    }\n    public static void main(String[] args)\n    {\n        Sub obj = new Sub();\n        obj.cfunc();\n        obj.pfunc();\n    }\n}"],"exp":"In single inheritance, subclasses inherit the features of one superclass. Single inheritance is one in which the derived class inherits the single base class. In this case, subclass Sub inherits the features of Super and calls the methods using the object of the subclass."},{"id":1259,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a","Compilation error"],["b","Sports"],["c","Pulsar 2.0"],["d",""]],"ans":"c","cod":["class Pulsar\n{\n    String name;\n}\nclass Bike extends Pulsar\n{\n    String modelType;\n    public void showDetail()\n    {\n        name = \"Pulsar 2.0\";\n        modelType = \"Sports\";\n        System.out.println(name);\n    }\n    public static void main(String[] args)\n    {\n        Bike car = new Bike();\n        car.showDetail();\n    }\n}"],"exp":"All the members of super class implicitly inherits to the child class. Member consists of instance variable and methods of the class. In this case, the subclass Bike uses the variables defined in the superclass Pulsar."},{"id":1260,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a","Derived and base"],["b","base and Derived"],["c","base and"],["d","Derived and"]],"ans":"b","cod":["class Base\n{\n    String name=\"base\";\n}\nclass Derived extends Base\n{\n    String name;\n    public void details()\n    {\n        name = \"Derived\";\n        System.out.println(super.name+\" and \"+name);\n    }\n    public static void main(String[] args)\n    {\n        Derived obj = new Derived();\n        obj.details();\n    }\n}"],"exp":"In Java, super keyword is used to refer to immediate parent class of a child class. It can be used to call parent class' variables and methods. In this case, Base is the parent class and Derived is the child class. The variable in Base class is used in the Derived class for printing the output."},{"id":1261,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b","Compilation error"],["c",""],["d","None"]],"ans":"a","cod":["class Person\n{\n    public void show()\n    {\n        System.out.println(\"None\");\n    }\n}\nclass College extends Person\n{\n    public void show1()\n    {\n        System.out.println(\"I am in a College\");\n    }\n}\nclass School extends Person\n{\n    public void show2()\n    {\n        System.out.println(\"I am in a School\");\n    }\n}\nclass University extends Person\n{\n    public void show3()\n    {\n        System.out.println(\"I am in a University\");\n    }\n}\nclass HierarchicalInheritance\n{\n    public static void main(String args[])\n    {\n        School teacher = new School();\n        College student = new College();\n        University doctor = new University();\n        student.show();\n        student.show1();\n        teacher.show2();\n        doctor.show3();\n    }\n}"],"exp":"In Hierarchical Inheritance, one class acts as a superclass (base class) for more than one subclass. More than one subclass can inherit the features of a base class. In this case, there are three subclasses - School, College and University and one base class named Person."},{"id":1262,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c","Compilation error"],["d","Hello"]],"ans":"c","cod":["class Base\n{\n    void msg()\n    {\n        System.out.println(\"Hello\");\n    }\n}\nclass Intermediate\n{\n    void msg()\n    {\n        System.out.println(\"Welcome\");\n    }\n}\nclass Derived extends Base,Intermediate\n{\n    public static void main(String args[])\n    {\n        C obj=new C();\n        obj.msg();\n    }\n}"],"exp":"Multiple Inheritance is a feature of object oriented concept, where a class can inherit properties of more than one parent class. A class can also be derived from more than one base class according to this concept. Java doesn't allow Multiple Inheritance, hence it throws an error."},{"id":1263,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a","one two one"],["b","two three three"],["c","three two three"],["d","two three one"]],"ans":"c","cod":["class one\n{\n    public void print_one()\n    {\n        System.out.print(\"one\");\n    }\n}\nclass two extends one\n{\n    public void print_two()\n    {\n        System.out.print(\"two\");\n    }\n    public void print_one()\n    {\n        System.out.print(\"three\");\n    }\n}\nclass three extends two\n{\n    public static void main(String[] args)\n    {\n        three obj = new three();\n        obj.print_one();\n        obj.print_two();\n        obj.print_one();\n    }\n}"],"exp":"The above question illustrates the concept of multilevel inheritance. When a class extends a class, which extends anther class then this is called multilevel inheritance. Here, an object is created of classtype three and all methods are called using that object."},{"id":1264,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a","Inside display"],["b","Inside area"],["c","Inside volume"],["d","Compilation error"]],"ans":"a","cod":["class Line\n{\n    public void print()\n    {\n        System.out.println(\"Inside display\");\n    }\n}\nclass Rectangle extends Line\n{\n    public void area()\n    {\n        System.out.println(\"Inside area\");\n    }\n}\nclass Square extends Rectangle\n{\n    public void volume()\n    {\n        System.out.println(\"Inside volume\");\n    }\n}\nclass Main\n{\n    public static void main(String[] arguments)\n    {\n        Square obj = new Square();\n        obj.print();\n    }\n}"],"exp":"The above program is an example of multilevel inheritance. When a class extends a class, which extends another class then this is called multilevel inheritance. An object of class Square is created and is used to call the print() method in Class 'Line'."},{"id":1265,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a","45"],["b","54"],["c","5"],["d","4"]],"ans":"a","cod":["class one\n{\n    public void print1()\n    {\n        System.out.print(\"4\");\n    }\n}\nclass two extends one\n{\n    public void print2()\n    {\n        System.out.println(\"5\");\n    }\n}\nclass three extends one\n{\n    void print()\n    {\n        System.out.println(\" \");\n    }\n}\nclass Main\n{\n    public static void main(String[] args)\n    {\n        three g = new three();\n        g.print1();\n        two t = new two();\n        t.print2();\n\n    }\n}"],"exp":"The above program is a case of hierarchical inheritance. In Hierarchical Inheritance, one class serves as a superclass (base class) for more than one sub class. In this case, two objects of class three and two are created and are used to call the print1() and print2() methods."},{"id":1266,"cat":"OOP using Java","topic":"Derived Class","q":"What will be the output of the following Java code?","opts":[["a","Compilation error"],["b","Parent1"],["c","Parent2"],["d",""]],"ans":"a","cod":["class Method1\n{\n    void fun()\n    {\n        System.out.println(\"Parent1\");\n    }\n}\nclass Method2\n{\n    void fun()\n    {\n        System.out.println(\"Parent2\");\n    }\n}\nclass Test extends Method1, Method2\n{\n    public static void main(String args[])\n    {\n        Test t = new Test();\n        t.fun();\n    }\n}"],"exp":"The above question uses the concept of multiple inheritance. When one class extends more than one classes, it is called multiple inheritance. Java does not support multiple inheritance and hence an error is thrown on execution."},{"id":1267,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a","Garbage Value"],["b","Sanfoundry"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["final class Final\n{\n    static String s = \"Sanfoundry\";\n}\npublic class Program extends Final\n{\n    public static void main(String[] args)\n    {\n        System.out.println(s);\n    }\n}"],"exp":"Since the class Final has been declared as final, it cannot be inherited by any other class. The 'final' keyword indicates the same in the above program. This is the main objective of using the 'final' keyword. Since 's' is a static variable, it can be called inside the main() method which is also a static class."},{"id":1268,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a","Garbage Value"],["b","Sanfoundry"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"b","cod":["final class Final extends Program\n{\n    public void Print()\n    {\n        System.out.println(s);\n    }\n}\nclass Program\n{\n    String s = \"Sanfoundry\";\n}\npublic class FinalCall\n{\n    public static void main(String[] args)\n    {\n        Final f = new Final();\n        f.Print();\n    }\n}"],"exp":"If a class is final, it cannot be inherited or extended by sub classes. Final classes cannot be inherited by any other classes despite their accessibility, but they can inherit other classes. Therefore Final inherits the properties of class Program."},{"id":1269,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a","The ascii value of c is 67"],["b","The ascii value of c is 99"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"d","cod":["static final class Program\n{\n    public void display(char ch)\n    {\n        System.out.println(\"The ascii value of \"+ch+\" is \"+(int)ch);\n    }\n}\npublic class FinalExe\n{\n    public static void main(String[] args)\n    {\n        Program.display('c');\n    }\n}"],"exp":"Java doesn't allow a final class to be given static privileges as it leads to security concerns and contradicts the concept of final classes. Hence it leads to a compilation error as Program is an outer class."},{"id":1270,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a","afudy"],["b","Snonr"],["c","Sanfoundry"],["d","Compilation Error"]],"ans":"b","cod":["public class Outer\n{\n    class Program\n    {\n        String s = \"Sanfoundry\";\n    }\n    final class Final extends Program\n    {\n        void print()\n        {\n            for(int i=0;i<s.length();i++)\n            {\n                if(i%2==0)\n                System.out.print(s.charAt(i));\n            }\n        }\n    }\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Final j = i.new Final();\n        j.print();\n    }\n}"],"exp":"Since class Final extends class Program, it can access the value of String s. The for loop inside the Final class prints only the characters at even indexes starting from 0 which is Snonr."},{"id":1271,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a","Compilation Error"],["b",""],["c",""],["d",""]],"ans":"d","cod":["public class StaticFinalClass\n{\n    static final class Final\n    {\n        Integer i = new Integer(6124);\n        void ClassCheck()\n        {\n            System.out.println(i.getClass());\n            System.out.println(i.getClass().getSuperclass());\n        }\n    }\n    public static void main(String[] args)\n    {\n        StaticFinalClass.Final i = new StaticFinalClass.Final();\n        i.ClassCheck();\n    }\n}"],"exp":"Integer is a subclass of the main class Number in the java.lang or the java language package. java.lang.Number class is the superclass of the class java.lang.Integer. Final class is a nested class inside the class StaticFinalClass."},{"id":1272,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a","Infinite loop"],["b","Compilation Error"],["c",""],["d",""]],"ans":"b","cod":["final class Program\n{\n    public void Loop()\n    {\n        for(int i=1;i>0;i++);\n        {\n            System.out.println(i);\n        }\n    }\n}\npublic class LoopClass\n{\n    public static void main (String[] args) {\n        Program i = new Program();\n        i.Loop();\n    }\n}"],"exp":"In the function Loop, the for loop is followed by a semicolon, hence ending the loop at that point. The code in the curly brackets cannot be executed, hence leads to a compilation error."},{"id":1273,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a",""],["b","Infinite loop"],["c","Compilation Error"],["d","32767"]],"ans":"d","cod":["public final class Check\n{\n    public static void main (String[] args)\n    {\n        for(short i=32767;i>0;i++)\n        {\n            System.out.println(i);\n        }\n    }\n}"],"exp":"Since the limit of signed short datatype is 32767, upon increasing the value, it changes to the other extreme end, which is -32768 which is less than 0, hence ending the loop."},{"id":1274,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a","Sanfoundry"],["b","Saonfoundry"],["c","Soanfoundry"],["d","Soafoundry"]],"ans":"d","cod":["public final class StringBuffer\n{\n    public static void main (String[] args)\n    {\n        StringBuffer s = new StringBuffer(\"Sonfoundry\");\n        s.setCharAt(2,'a');\n        System.out.println(s);\n    }\n}"],"exp":"setCharAt is a function that changes the character at the specified index position of a StringBuffer to the specified character. Here, index 2 corresponds to the third character in the string, which is 'n', and changes it to 'a'."},{"id":1275,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a","""9999999"],["b","""0"],["c","'\\0'0"],["d","null0"]],"ans":"d","cod":["public final class StaticString\n{\n    static String x;\n    static int y;\n    public static void main (String[] args)\n    {\n        StaticString i = new StaticString();\n        System.out.println(x+y);\n    }\n}"],"exp":"When an object of a class is created, the variables of the class are given default values if they are not declared by the user. Integer's default value is 0 and String's default value is null according to the JVM."},{"id":1276,"cat":"OOP using Java","topic":"Final Class","q":"What is the output of the following Java code?","opts":[["a","Compilation Error"],["b","Runtime Error"],["c","Null"],["d","Class Program"]],"ans":"d","cod":["public final class Inheritance\n{\n    class Program\n    {\n        String s = \"Class Program\";\n    }\n    class Print extends Program\n    {\n        void display()\n        {\n            System.out.println(s);\n        }\n    }\n    public static void main (String[] args)\n    {\n        Inheritance i = new Inheritance();\n        Inheritance.B j = i.new B();\n        j.display();\n    }\n}"],"exp":"final keyword when given to classes makes them uninheritable, but subclasses of a final class can inherit other classes within the final class, hence class B inherits String s from class Program and prints it."},{"id":1277,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["class Generic<T>\n{\n    T t;\n    Generic(T t)\n    {\n        this.t = t;\n    }\n    public T getT()\n    {\n        return this.t;\n    }\n}\nclass MainCall\n{\n    public static void main (String[] args)\n    {\n        Generic <Integer> i = new Generic<Integer>(25);\n        System.out.println(i.getT());\n        Generic <Double> j = new Generic<Double>(37);\n        System.out.println(j.getT());\n    }\n}"],"exp":"Generic classes are designed in Java which allow a type or method to operate on objects of various types. Since double needs to have a decimal point in the number passed to it, when 37 is passed to j, it leads to a compilation error."},{"id":1278,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a","Garbage Value"],["b","n"],["c","f"],["d","Compilation Error"]],"ans":"c","cod":["class Generic<T>\n{\n    T t;\n    Generic(T t)\n    {\n        this.t = t;\n    }\n    public T Position()\n    {\n        return this.t;\n    }\n}\nclass StringGeneric\n{\n    public static void main (String[] args)\n    {\n        Generic <String> i = new Generic<String>(\"Sanfoundry\");\n        System.out.println(i.Position().charAt(3));\n    }\n}"],"exp":"The function Position returns the string object which stores the value "Sanfoundry". The third index of the string is 'f' as indexing starts from 0, it is printed."},{"id":1279,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","Runtime Error"],["c","Sanfoundry"],["d","foundrySan"]],"ans":"d","cod":["class Generic<T,U>\n{\n    T t;\n    U u;\n    Generic(T t, U u)\n    {\n        this.t = t;\n        this.u = u;\n    }\n    public void append()\n    {\n        System.out.print(u);\n        System.out.print(t);\n    }\n}\nclass GenericString\n{\n    public static void main (String[] args)\n    {\n        Generic <String, String> i = new Generic<String, String>(\"San\", \"foundry\");\n        i.append();\n    }\n}"],"exp":"When function append is called, the strings "San" and "foundry" are currently stored in t and u respectively. Since they are printed in the order of u followed by t, the resulting output is foundrySan."},{"id":1280,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["class Generic<T>\n{\n    T t;\n    Generic(T t)\n    {\n        this.t = t;\n    }\n    public T getT()\n    {\n        return this.t;\n    }\n}\nclass GenericString2\n{\n    public static void main (String[] args)\n    {\n        Generic <String> i = new Generic<String>(\"Sanfoundry\");\n        System.out.println(i.getClass());\n        System.out.println(i.getT().getClass());\n    }\n}"],"exp":"A class that can refer to any type is known as a generic class. In the above program, 'i' is an object of the class Generic, and getT returns the string object which stores the string "Sanfoundry", which is an object of the java.lang.String class."},{"id":1281,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["class Generic<T>\n{\n    T t;\n    Generic(T t)\n    {\n        this.t = t;\n    }\n    public T getT()\n    {\n        return this.t;\n    }\n}\nclass GenericInt\n{\n    public static void main (String[] args)\n    {\n        Generic <Integer> i = new Generic<Integer>(100);\n        Generic <Generic> j = new Generic<Generic>(i);\n        System.out.println(j.getClass());\n        System.out.println(j.getT().getClass());\n    }\n}"],"exp":"Here j is an object of the class Generic, with the value i, which inturn is an object of the class Generic with an integer value of 100. Hence both the getClass() functions give class Generic."},{"id":1282,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b",""Sanfoundry""],["c","Generic@2a139a55"],["d","GenericProg@2a139a55"]],"ans":"c","cod":["class Generic<T>\n{\n    T t;\n    Generic(T t)\n    {\n        this.t = t;\n    }\n    public T getT()\n    {\n        return this.t;\n    }\n}\nclass GenericProg\n{\n    public static void main (String[] args)\n    {\n        Generic <String> i = new Generic<String>(\"Sanfoundry\");\n        System.out.println(i);\n    }\n}"],"exp":"When an object of a class is printed, it is returned in the format of ClassName@Hashcode. Here an object of the Generic class is called, hence it returns Generic@2a139a55."},{"id":1283,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b","Compilation Error"],["c",""],["d",""]],"ans":"d","cod":["class Generic <T>\n{\n    Stack <T> t = new Stack <T>();\n    public void push(T i)\n    {\n        t.push(i);\n    }\n    public T pop()\n    {\n        return t.pop();\n    }\n    public Stack Array()\n    {\n        return t;\n    }\n}\npublic class GenericPop\n{\n    public static void main(String args[])\n    {\n        Generic <String> i = new Generic<String>();\n        i.push(\"San\");\n        i.push(\"foundry\");\n        System.out.println(i.Array());\n        System.out.println(i.pop());\n        System.out.println(i.pop());\n\n    }\n}"],"exp":"The push function of a stack adds an element to the rightmost of the stack, while the pop function removes the rightmost element and returns it. Hence the items are obtained in reverse order."},{"id":1284,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c","Runtime Error"],["d","Compilation Error"]],"ans":"d","cod":["class Generic <T>\n{\n    Stack <T> t = new Stack <T>();\n    public void push(T i)\n    {\n        t.push(i);\n    }\n    public T pop()\n    {\n        return t.pop();\n    }\n}\npublic class GenericStack\n{\n    public static void main(String args[])\n    {\n        Generic <String> i = new Generic<String>();\n        i.push(\"37\");\n        i.push(37.0);\n        System.out.println(i.pop());\n        System.out.println(i.pop());\n    }\n}"],"exp":"The object i of the class Generic is defined to have values of type String. the second push command passes a double value and hence leads to a compilation error."},{"id":1285,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a","840.0"],["b","1280.0"],["c","672.0"],["d","Compilation Error"]],"ans":"b","cod":["class Generic <T>\n{\n    Stack <T> t = new Stack <T>();\n    public void push(T i)\n    {\n        t.push(i);\n    }\n    public T pop()\n    {\n        return t.pop();\n    }\n}\npublic class GenericStackProg\n{\n    public double multiply(double a, double b)\n    {\n        return a*b;\n    }\n    public static void main(String args[])\n    {\n        Generic <Double> i = new Generic<Double>();\n        i.push(21.0);\n        i.push(32.0);\n        i.push(40.0);\n        GenericStackProg j = new GenericStackProg();\n        System.out.println(j.multiply(i.pop(),i.pop()));\n    }\n}"],"exp":"The pop() method is used to remove the object at the top of this stack and returns that object as the value of this function. In this case, the pop() function removes the rightmost element of a stack, hence sending the last 2 values into the multiply function which are 32.0 and 40.0."},{"id":1286,"cat":"OOP using Java","topic":"Generic Class","q":"What will be the output of the following Java code?","opts":[["a","2"],["b","1"],["c","-1"],["d","0"]],"ans":"c","cod":["class Generic <T>\n{\n    Stack <T> t = new Stack <T>();\n    public void push(T i)\n    {\n        t.push(i);\n    }\n    public T pop()\n    {\n        return t.pop();\n    }\n    public int search(String s)\n    {\n        return t.search(s);\n    }\n}\npublic class GenericStackMultiply\n{\n    public double multiply(double a, double b)\n    {\n        return a*b;\n    }\n    public static void main(String args[])\n    {\n        Generic <String> i = new Generic<String>();\n        i.push(\"San\");\n        i.push(\"Fou\");\n        i.push(\"Nd\");\n        String k = i.pop();\n        i.push(\"nd\");\n        System.out.println(i.search(\"Nd\"));\n    }\n}"],"exp":"Push function adds an element to the rightmost of a stack and pop function removes the rightmost element of a stack. When pop is called, the string "Nd" is removed and after the push command, "nd" is added in that place. Hence the search function returns -1, which implies that the element wasn't found in the stack."},{"id":1287,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["class A\n{\n    public void functionA()\n    {\n        System.out.println(\"Class A\");\n    }\n}\nclass B extends A\n{\n    public void functionB()\n    {\n        System.out.println(\"Class B\");\n    }\n}\nclass C extends A\n{\n  public void functionC()\n  {\n     System.out.println(\"Class C\");\n  }\n}\npublic class Hierarchical1\n{\n    public static void main(String args[])\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        obj1.functionA();\n        obj2.functionA();\n    }\n}"],"exp":"The objects 'obj1' and 'obj2' are objects of the classes B and C respectively, which inherit the properties of the class A. Both the objects 'obj1' and 'obj2' are able to access the method of class A [function A()] as they are the objects of derived classes B and C respectively."},{"id":1288,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"123\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"456\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"789\");\n    }\n}\npublic class Hierarchical2\n{\n    public static void main(String[] args)\n    {\n        Y ob1 = new Y();\n        Z ob2 = new Z();\n        ob1.A();\n        ob2.C();\n    }\n}"],"exp":"The objects 'ob1' and 'ob2' are objects of the classes Y and Z respectively, which inherit the properties of class X. The object 'ob1' calls a method of class X[A()] as ob1 is an object of the derived class Y. The object 'ob2' calls a method of class Z[C()]."},{"id":1289,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Welcome"],["b","Welcome to Sanfoundry"],["c","Sanfoundry"],["d","to"]],"ans":"b","cod":["class A\n{\n    public void X()\n    {\n        System.out.print(\"Welcome\");\n    }\n}\nclass B extends A\n{\n    public void Y()\n    {\n        System.out.print(\" to \");\n    }\n}\nclass C extends A\n{\n    public void Z()\n    {\n        System.out.print(\"Sanfoundry\");\n    }\n}\npublic class Display\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        obj1.X();\n        obj1.Y();\n        obj2.Z();\n    }\n}"],"exp":"Classes B and C are derived classes, i.e., they inherit the properties of class A. Hence, objects 'obj1' and 'obj2' are able to access the method of class A[X()] along with the methods of their own class[Y() and Z() respectively]."},{"id":1290,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Rank-1"],["b","Rank-2"],["c","Rank"],["d","Rank-3"]],"ans":"d","cod":["class A\n{\n    public void X()\n    {\n        System.out.print(\"Rank-\");\n    }\n}\nclass B extends A\n{\n    public void Y()\n    {\n        System.out.print(\"1\");\n    }\n}\nclass C extends A\n{\n    public void Z()\n    {\n        System.out.print(\"2\");\n    }\n}\nclass D extends A\n{\n    public void Z()\n    {\n        System.out.print(\"3\");\n    }\n}\npublic class Numbers\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        D obj3 = new D();\n        obj1.X();\n        obj3.Z();\n\n    }\n}"],"exp":"Classes B, C and D are derived classes of class A. Hence, when objects of these classes are created, they can access the methods of class A. Objects 'obj1', 'obj2' and 'obj3' are objects of classes B, C and D respectively."},{"id":1291,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a","@&#"],["b","#@&"],["c","@#&"],["d","&#@"]],"ans":"a","cod":["class X\n{\n    public void A()\n    {\n        System.out.print(\"#\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.print(\"@\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n         System.out.print(\"&\");\n    }\n}\npublic class Symbols\n{\n    public static void main(String[] args)\n    {\n        Y ob1 = new Y();\n        Z ob2 = new Z();\n        ob1.B();\n        ob2.C();\n        ob2.A();\n    }\n}"],"exp":"The objects 'ob1' and 'ob2' are objects of the derived classes Y and Z respectively. This means that objects ob1 and ob2 can access the methods of the base class X also and hence the methods in the main() method are called successfully."},{"id":1292,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a","5"],["b","10"],["c","15"],["d","20"]],"ans":"d","cod":["class A\n{\n    static int a =5;\n}\nclass B extends A\n{\n    B()\n    {\n        A.a = 10;\n    }\n}\nclass C extends A\n{\n    C()\n    {\n         A.a = 15;\n    }\n}\nclass D extends A\n{\n    D()\n    {\n        A.a = 20;\n    }\n}\npublic class DotOperator\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        D obj3 = new D();\n\n        System.out.println(A.a);\n    }\n}"],"exp":"Static variables are those, whose only one copy exists in memory. In this program, the variable a of class A is static. Hence, it is modified by the constructors of the class that inherit from class A. The final that is called, is of class D which initialises (variable 'a')'s value to 20."},{"id":1293,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a","5"],["b","10"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["final class A\n{\n    int a;\n    A()\n    {\n        a=5;\n    }\n}\nclass B extends A\n{\n    int a;\n    B()\n    {\n        A obj = new A();\n        a = obj.a;\n    }\n}\nclass C extends A\n{\n    int a;\n    C()\n    {\n        A obj = new A();\n        a = obj.a;\n    }\n}\nclass D extends A\n{\n    int a;\n    D()\n    {\n        A obj = new A();\n        a = obj.a;\n    }\n}\npublic class Hierarchy\n{\n    public static void main(String[] args) {\n        B obj1 = new B();\n        C obj2 = new C();\n        D obj3 = new D();\n        A obj = new B();\n        System.out.println(obj.a);\n    }\n}"],"exp":"The final keyword in java is used to restrict users. It can be applied to variables, classes and methods. If you declare a class as a final class, you cannot inherit it. A final variable is one whose value cannot be changed throughout a program and a final method is one that cannot be overridden."},{"id":1294,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Runtime Error"]],"ans":"b","cod":["class A\n{\n    protected void func()\n    {\n        System.out.println(\"Class A\");\n    }\n}\nclass B extends A\n{\n    public void func()\n    {\n        System.out.println(\"Class B\");\n    }\n}\nclass C extends A\n{\n    public void func()\n    {\n        System.out.println(\"Class C\");\n    }\n}\npublic class Display1\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        A obj2 = new C();\n        obj1.func();\n        obj2.func();\n    }\n}"],"exp":"Function overriding takes place when a subclass has a function with the same name as the parent class. In this program, the class B overrides the function func() present in class A to print "Class B" as the output. For obj2, though we create an object of type class A, we do it by calling the constructor of class C. Therefore, the overriding function present in class C is called, printing "Class C" as the output."},{"id":1295,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a","10"],["b","20"],["c","30"],["d","Runtime Error"]],"ans":"c","cod":["class A\n{\n    int a = 10;\n}\nclass B extends A\n{\n    int a = super.a;\n}\nclass C extends A\n{\n    int c = a+10;\n}\npublic class Add\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        System.out.println(obj1.a + obj2.c);\n    }\n}"],"exp":"The super keyword is similar to "this" keyword. It can be used to access any data member of the parent class. In this program, the value of the variable a of class B is initialised to the value of the variable a of the parent class A. Therefore, the value of a is equal to 10 in class B. Since class C extends class A, it can directly access the variable of the parent class. Hence, the value of variable c in class C is 20. On adding, the sum is 30."},{"id":1296,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Runtime Error"]],"ans":"a","cod":["class A\n{\n    A()\n    {\n        System.out.println(\"Class A\");\n    }\n}\nclass B extends A\n{\n    B()\n    {\n        System.out.println(\"Class B\");\n    }\n}\nclass C extends A\n{\n    C()\n    {\n        System.out.println(\"Class C\");\n    }\n}\npublic class MultipleObjects\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n    }\n}"],"exp":"In this program, class B extends class A. Therefore, when an object of class B is created, it calls the constructor of parent class A first and then calls the constuctor of derived class B. The same occurs for class C since class C also extends class A."},{"id":1297,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a","560102"],["b","Bangalore-560102"],["c","Bangalore-560108"],["d","560108"]],"ans":"c","cod":["class A\n{\n    public void X()\n    {\n        System.out.print(\"Bangalore-\");\n    }\n}\nclass B extends A\n{\n    public void Y()\n    {\n        System.out.print(\"560102\");\n    }\n}\nclass C extends A\n{\n    public void Z()\n    {\n        System.out.print(\"560108\");\n    }\n}\npublic class Details\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        obj2.X();\n        obj2.Z();\n    }\n}"],"exp":"Classes B and C inherit properties of class A. Therefore, objects 'obj1' and 'obj2' of derived classes B and C respectively can access the method of class A[X()] and print the values inside the method without any compilation error using the concept of hierarchical inheritance."},{"id":1298,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b","15 50"],["c",""],["d","50 15"]],"ans":"a","cod":["class A\n{\n    int a=10, b=5;\n}\nclass B extends A\n{\n    public void Y()\n    {\n        System.out.println(a+b);\n    }\n}\nclass C extends A\n{\n    public void Z()\n    {\n        System.out.print(a*b);\n    }\n}\npublic class SumandProduct\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        obj1.Y();\n        obj2.Z();\n    }\n}"],"exp":"As classes B and C are derived classes of base class A, they can access the variables a and b which are initialized in class A. Class B performs addition of the two variables while class C performs multiplication and prints the output."},{"id":1299,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["import java.lang.Math;\nclass A\n{\n    int a=9;\n}\nclass B extends A\n{\n    public void Y()\n    {\n        System.out.println(Math.sqrt(a));\n    }\n}\nclass C extends A\n{\n    public void Z()\n    {\n        System.out.println(Math.pow(a,2));\n    }\n}\npublic class Power\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        obj1.Y();\n        obj2.Z();\n    }\n}"],"exp":"As classes B and C are derived classes of base class A, they can access the variable a which is initialized in class A. Class B finds the square root of variable a while class C finds the square value of variable 'a' and it is executed successfully in the main() method."},{"id":1300,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a","20"],["b","30"],["c","40"],["d","Compile time Error"]],"ans":"d","cod":["class A\n{\n    private int a
