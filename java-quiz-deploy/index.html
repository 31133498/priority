"exp":"The Math.random() method returns a number greater than or equal to 0 and less than 1. so 2.5 will be greater than or equal to 2.5 and less than 3.5, we can be sure that Math.round() will round that number to 3."},{"id":818,"cat":"Core Java","topic":"Object & Math Classes","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","3"],["c","3.0"],["d","3.1"]],"ans":"b","cod":["    class Output\n    {\n         public static void main(String args[])\n         {\n             int x = 3.14;\n             int y = (int) Math.abs(x);\n             System.out.print(y);\n         }\n    }"]},{"id":819,"cat":"Core Java","topic":"Object & Math Classes","q":"What will be the output of the following Java program?","opts":[["a","true"],["b","flase"],["c","3.1"],["d","4.5"]],"ans":"d","cod":["    class Output\n    {\n         public static void main(String args[])\n        {\n            double x = 3.1;\n            double y = 4.5;\n            double z = Math.max( x, y );\n            System.out.print(z);\n        }\n    }"]},{"id":820,"cat":"Core Java","topic":"Object & Math Classes","q":"What will be the output of the following Java program?","opts":[["a","2.0"],["b","4.0"],["c","8.0"],["d","9.0"]],"ans":"c","cod":["    class Output\n    {\n         public static void main(String args[])\n        {\n            double x = 2.0;\n            double y = 3.0;\n            double z = Math.pow( x, y );\n            System.out.print(z);\n        }\n    }"],"exp":"Math.pow(x, y) methods returns value of y to the power x, i:e x ^ y, 2.0 ^ 3.0 = 8.0."},{"id":821,"cat":"Core Java","topic":"Object & Math Classes","q":"Which of these class is superclass of all other classes?","opts":[["a","Math"],["b","Process"],["c","System"],["d","Object"]],"ans":"d","exp":"The object class class is superclass of all other classes."},{"id":822,"cat":"Core Java","topic":"Object & Math Classes","q":"Which of these method of Object class can generate duplicate copy of the object on which it is called?","opts":[["a","clone()"],["b","copy()"],["c","dublicate()"],["d","dito()"]],"ans":"a"},{"id":823,"cat":"Core Java","topic":"Object & Math Classes","q":"What is the value of double constant 'E' defined in Math class?","opts":[["a","approximately 3"],["b","approximately 3.14"],["c","approximately 2.72"],["d","approximately 0"]],"ans":"c"},{"id":824,"cat":"Core Java","topic":"Object & Math Classes","q":"What is the value of "d" after this line of code has been executed?","opts":[["a","2"],["b","3"],["c","4"],["d","2.5"]],"ans":"b","cod":["   double d = Math.round ( 2.5 + Math.random() );"],"exp":"The Math.random() method returns a number greater than or equal to 0 and less than 1. so 2.5 will be greater than or equal to 2.5 and less than 3.5, we can be sure that Math.round() will round that number to 3."},{"id":825,"cat":"Core Java","topic":"Object & Math Classes","q":"What is the output of this program?","opts":[["a","0"],["b","3"],["c","3.0"],["d","3.1"]],"ans":"b","cod":["    class Output\n    {\n         public static void main(String args[])\n         {\n             int x = 3.14;\n             int y = (int) Math.abs(x);\n             System.out.print(y);\n         }\n    }"],"exp":"$ javac Output.java\n$ java Output\n3"},{"id":826,"cat":"Core Java","topic":"Object & Math Classes","q":"What is the output of this program?","opts":[["a","true"],["b","flase"],["c","3.1"],["d","4.5"]],"ans":"d","cod":["    class Output\n    {\n         public static void main(String args[])\n        {\n            double x = 3.1;\n            double y = 4.5;\n            double z = Math.max( x, y );\n            System.out.print(z);\n        }\n    }"],"exp":"$ javac Output.java\n$ java Output\n4.5"},{"id":827,"cat":"Core Java","topic":"Object & Math Classes","q":"What is the output of this program?","opts":[["a","2.0"],["b","4.0"],["c","8.0"],["d","9.0"]],"ans":"c","cod":["    class Output\n    {\n         public static void main(String args[])\n        {\n            double x = 2.0;\n            double y = 3.0;\n            double z = Math.pow( x, y );\n            System.out.print(z);\n        }\n    }"],"exp":"Math.pow(x, y) methods returns value of y to the power x, i:e x ^ y, 2.0 ^ 3.0 = 8.0.\n$ javac Output.java\n$ java Output\n8.0"},{"id":828,"cat":"Core Java","topic":"Object Class","q":"Which of these class is superclass of every class in Java?","opts":[["a","String class"],["b","Object class"],["c","Abstract class"],["d","ArrayList class"]],"ans":"b","exp":"Object class is superclass of every class in Java."},{"id":829,"cat":"Core Java","topic":"Object Class","q":"Which of these method of Object class can clone an object?","opts":[["a","Objectcopy()"],["b","copy()"],["c","Object clone()"],["d","clone()"]],"ans":"c"},{"id":830,"cat":"Core Java","topic":"Object Class","q":"Which of these method of Object class is used to obtain class of an object at run time?","opts":[["a","get()"],["b","void getclass()"],["c","Class getclass()"],["d","None of the mentioned"]],"ans":"c"},{"id":831,"cat":"Core Java","topic":"Object Class","q":"Which of these keywords can be used to prevent inheritance of a class?","opts":[["a","super"],["b","constant"],["c","class"],["d","final"]],"ans":"d","exp":"Declaring a class final implicitly declared all of its methods final, and makes the class inheritable."},{"id":832,"cat":"Core Java","topic":"Object Class","q":"Which of these keywords cannot be used for a class which has been declared final?","opts":[["a","abstract"],["b","extends"],["c","abstract and extends"],["d","none of the mentioned"]],"ans":"a","exp":"A abstract class is incomplete by itself and relies upon its subclasses to provide a complete implementation. If we declare a class final then no class can inherit that class, an abstract class needs its subclasses hence both final and abstract cannot be used for a same class."},{"id":833,"cat":"Core Java","topic":"Object Class","q":"Which of these class relies upon its subclasses for complete implementation of its methods?","opts":[["a","Object class"],["b","abstract class"],["c","ArrayList class"],["d","None of the mentioned"]],"ans":"b"},{"id":834,"cat":"Core Java","topic":"Object Class","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","2"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"b","cod":["    abstract class A\n    {\n        int i;\n        abstract void display();\n    }\n    class B extends A\n    {\n        int j;\n        void display()\n        {\n            System.out.println(j);\n        }\n    }\n    class Abstract_demo\n    {\n        public static void main(String args[])\n        {\n            B obj = new B();\n            obj.j=2;\n            obj.display();\n        }\n    }"],"exp":"class A is an abstract class, it contains a abstract function display(), the full implementation of display() method is given in its subclass B, Both the display functions are the same. Prototype of display() is defined in class A and its implementation is given in class B."},{"id":835,"cat":"Core Java","topic":"Object Class","q":"What will be the output of the following Java program?","opts":[["a","false"],["b","true"],["c","1"],["d","Compilation Error"]],"ans":"a","cod":["   class A\n   {\n\tint i;\n\tint j;\n        A()\n        {\n            i = 1;\n            j = 2;\n        }\n   }\n   class Output\n   {\n        public static void main(String args[])\n        {\n             A obj1 = new A();\n             A obj2 = new A();\n\t     System.out.print(obj1.equals(obj2));\n        }\n   }"],"exp":"obj1 and obj2 are two different objects. equals() is a method of Object class, Since Object class is superclass of every class it is available to every object."},{"id":836,"cat":"Core Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a","Object"],["b","class Object"],["c","class java.lang.Object"],["d","Compilation Error"]],"ans":"c","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n             Object obj = new Object();\n\t     System.out.print(obj.getclass());\n        }\n    }"]},{"id":837,"cat":"Core Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a","true"],["b","false"],["c","String associated with obj1"],["d","Compilation Error"]],"ans":"c","cod":["   class A\n   {\n        int i;\n\tint j;\n        A()\n        {\n            i = 1;\n            j = 2;\n        }\n   }\n   class Output\n   {\n        public static void main(String args[])\n        {\n             A obj1 = new A();\n\t     System.out.print(obj1.toString());\n        }\n   }"],"exp":"toString() is method of class Object, since it is superclass of every class, every object has this method. toString() returns the string associated with the calling object."},{"id":838,"cat":"Core Java","topic":"Observable & Timer Class","q":"What is the use of Observable class?","opts":[["a","It is used to create global subclasses"],["b","It is used to create classes that other part of the program can observe"],["c","It is used to create classes that can be accessed by other parts of program"],["d","It is used to create methods that can be accessed by other parts of program"]],"ans":"b","exp":"The Observable class is used to create subclasses that other part of program can observe."},{"id":839,"cat":"Core Java","topic":"Observable & Timer Class","q":"Which of these methods is used to notify observer the change in observed object?","opts":[["a","update()"],["b","notify()"],["c","check()"],["d","observed()"]],"ans":"a"},{"id":840,"cat":"Core Java","topic":"Observable & Timer Class","q":"Which of these methods calls update() method?","opts":[["a","notify()"],["b","observeObject()"],["c","updateObserver()"],["d","notifyObserver()"]],"ans":"d","exp":"notifyObserver() notifies all the observers of the invoking object that it has changed by calling update(). A null is passed as the second argument to update()."},{"id":841,"cat":"Core Java","topic":"Observable & Timer Class","q":"Which of these methods is called when observed object has changed?","opts":[["a","setChanged()"],["b","update()"],["c","notifyObserver()"],["d","all of the mentioned"]],"ans":"d"},{"id":842,"cat":"Core Java","topic":"Observable & Timer Class","q":"Which of these classes can schedule task for execution in future?","opts":[["a","Thread"],["b","Timer"],["c","System"],["d","Observer"]],"ans":"b","exp":"Timer and TimerTask are the classes that support the ability to schedule tasks for execution at some future time."},{"id":843,"cat":"Core Java","topic":"Observable & Timer Class","q":"Which of these interfaces is implemented by TimerTask class?","opts":[["a","Runnable"],["b","Thread"],["c","Observer"],["d","ThreadCount"]],"ans":"a"},{"id":844,"cat":"Core Java","topic":"Observable & Timer Class","q":"Which of these package provides the ability to read and write in Zip format?","opts":[["a","java.lang"],["b","java.io"],["c","java.util.zip"],["d","java.util.zar"]],"ans":"c"},{"id":845,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"What is the process of defining two or more methods within same class that have same name but different parameters declaration?","opts":[["a","method overloading"],["b","method overriding"],["c","method hiding"],["d","none of the mentioned"]],"ans":"a","exp":"Two or more methods can have same name as long as their parameters declaration is different, the methods are said to be overloaded and process is called method overloading. Method overloading is a way by which Java implements polymorphism."},{"id":846,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"Which of these can be overloaded?","opts":[["a","Methods"],["b","Constructors"],["c","All of the mentioned"],["d","None of the mentioned"]],"ans":"c"},{"id":847,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"Which of these is correct about passing an argument by call-by-value process?","opts":[["a","Copy of argument is made into the formal parameter of the subroutine"],["b","Reference to original argument is passed to formal parameter of the subroutine"],["c","Copy of argument is made into the formal parameter of the subroutine and changes made on parameters of subroutine have effect on original argument"],["d","Reference to original argument is passed to formal parameter of the subroutine and changes made on parameters of subroutine have effect on original argument"]],"ans":"a","exp":"When we pass an argument by call-by-value a copy of argument is made into the formal parameter of the subroutine and changes made on parameters of subroutine have no effect on original argument, they remain the same."},{"id":848,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"What is the process of defining a method in terms of itself, that is a method that calls itself?","opts":[["a","Polymorphism"],["b","Abstraction"],["c","Encapsulation"],["d","Recursion"]],"ans":"d"},{"id":849,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"What will be the output of the following Java code?","opts":[["a","int float method"],["b","float int method"],["c","compile time error"],["d","run time error"]],"ans":"c","cod":["class San\n{\n public void m1 (int i,float f)\n {\n  System.out.println(\" int float method\");\n }\n\n public void m1(float f,int i);\n  {\n  System.out.println(\"float int method\");\n  }\n\n  public static void main(String[]args)\n  {\n    San s=new San();\n        s.m1(20,20);\n  }\n}"],"exp":"While resolving overloaded method, compiler automatically promotes if exact match is not found. But in this case, which one to promote is an ambiguity."},{"id":850,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"What will be the output of the following Java code?","opts":[["a","5"],["b","6"],["c","7"],["d","8"]],"ans":"c","cod":["    class overload\n    {\n        int x;\n \tint y;\n        void add(int a)\n        {\n            x =  a + 1;\n        }\n        void add(int a, int b)\n        {\n            x =  a + 2;\n        }\n    }\n    class Overload_methods\n    {\n        public static void main(String args[])\n        {\n            overload obj = new overload();\n            int a = 0;\n            obj.add(6);\n            System.out.println(obj.x);\n        }\n   }"]},{"id":851,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"What will be the output of the following Java code?","opts":[["a","6"],["b","7"],["c","8"],["d","9"]],"ans":"c","cod":["    class overload\n    {\n        int x;\n \tint y;\n        void add(int a)\n        {\n            x =  a + 1;\n        }\n        void add(int a , int b)\n        {\n            x =  a + 2;\n        }\n    }\n    class Overload_methods\n    {\n        public static void main(String args[])\n        {\n            overload obj = new overload();\n            int a = 0;\n            obj.add(6, 7);\n            System.out.println(obj.x);\n        }\n    }"]},{"id":852,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"What will be the output of the following Java code?","opts":[["a","6 6"],["b","6.4 6.4"],["c","6.4 6"],["d","4 6.4"]],"ans":"d","cod":["   class overload\n   {\n        int x;\n \tdouble y;\n        void add(int a , int b)\n        {\n            x = a + b;\n        }\n        void add(double c , double d)\n        {\n            y = c + d;\n        }\n        overload()\n        {\n            this.x = 0;\n            this.y = 0;\n        }\n    }\n    class Overload_methods\n    {\n        public static void main(String args[])\n        {\n            overload obj = new overload();\n            int a = 2;\n            double b = 3.2;\n            obj.add(a, a);\n            obj.add(b, b);\n            System.out.println(obj.x + \" \" + obj.y);\n        }\n   }"],"exp":"For obj.add(a,a); ,the function in line number 4 gets executed and value of x is 4. For the next function call, the function in line number 7 gets executed and value of y is 6.4"},{"id":853,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"What will be the output of the following Java code?","opts":[["a","10 20"],["b","20 10"],["c","20 40"],["d","40 20"]],"ans":"a","cod":["    class test\n    {\n        int a;\n        int b;\n        void meth(int i , int j)\n        {\n            i *= 2;\n            j /= 2;\n        }\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            test obj = new test();\n\t    int a = 10;\n            int b = 20;\n            obj.meth(a , b);\n            System.out.println(a + \" \" + b);\n        }\n    }"],"exp":"Variables a & b are passed by value, copy of their values are made on formal parameters of function meth() that is i & j. Therefore changes done on i & j are not reflected back on original arguments. a & b remain 10 & 20 respectively."},{"id":854,"cat":"Core Java","topic":"Overloading Methods & Argument Passing","q":"What will be the output of the following Java code?","opts":[["a","10 20"],["b","20 10"],["c","20 40"],["d","40 20"]],"ans":"b","cod":["    class test\n    {\n        int a;\n        int b;\n        test(int i, int j)\n        {\n            a = i;\n            b = j;\n        }\n        void meth(test o)\n        {\n            o.a *= 2;\n            o.b /= 2;\n        }\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            test obj = new test(10 , 20);\n            obj.meth(obj);\n            System.out.println(obj.a + \" \" + obj.b);\n        }\n    }"],"exp":"Class objects are always passed by reference, therefore changes done are reflected back on original arguments. obj.meth(obj) sends object obj as parameter whose variables a & b are multiplied and divided by 2 respectively by meth() function of class test. a & b becomes 20 & 10 respectively."},{"id":855,"cat":"Core Java","topic":"Packages","q":"Which of these keywords is used to define packages in Java?","opts":[["a","pkg"],["b","Pkg"],["c","package"],["d","Package"]],"ans":"c"},{"id":856,"cat":"Core Java","topic":"Packages","q":"Which of these is a mechanism for naming and visibility control of a class and its content?","opts":[["a","Object"],["b","Packages"],["c","Interfaces"],["d","None of the Mentioned."]],"ans":"b","exp":"Packages are both naming and visibility control mechanism. We can define a class inside a package which is not accessible by code outside the package."},{"id":857,"cat":"Core Java","topic":"Packages","q":"Which of this access specifies can be used for a class so that its members can be accessed by a different class in the same package?","opts":[["a","Public"],["b","Protected"],["c","No Modifier"],["d","All of the mentioned"]],"ans":"d","exp":"Either we can use public, protected or we can name the class without any specifier."},{"id":858,"cat":"Core Java","topic":"Packages","q":"Which of these access specifiers can be used for a class so that its members can be accessed by a different class in the different package?","opts":[["a","Public"],["b","Protected"],["c","Private"],["d","No Modifier"]],"ans":"a"},{"id":859,"cat":"Core Java","topic":"Packages","q":"Which of the following is the correct way of importing an entire package 'pkg'?","opts":[["a","import pkg."],["b","Import pkg."],["c","import pkg.*"],["d","Import pkg.*"]],"ans":"c","exp":"Operator * is used to import the entire package."},{"id":860,"cat":"Core Java","topic":"Packages","q":"Which of the following is an incorrect statement about packages?","opts":[["a","Package defines a namespace in which classes are stored"],["b","A package can contain other package within it"],["c","Java uses file system directories to store packages"],["d","A package can be renamed without renaming the directory in which the classes are stored"]],"ans":"d","exp":"A package can be renamed only after renaming the directory in which the classes are stored."},{"id":861,"cat":"Core Java","topic":"Packages","q":"Which of the following package stores all the standard java classes?","opts":[["a","lang"],["b","java"],["c","util"],["d","java.packages"]],"ans":"a","exp":"The lang package contains fundamental/standard classes that are essential for Java programming which includes object, string, system, maths and many more. The util package stores classes for various functionalities like collection, date/time, etc. Out the given choices, "lang" package is the most appropriate."},{"id":862,"cat":"Core Java","topic":"Packages","q":"What will be the output of the following Java program?\nNote : packages.class file is in directory pkg;","opts":[["a","0"],["b","1"],["c","2"],["d","0 1 2"]],"ans":"c","cod":["    package pkg;\n    class display\n    {\n        int x;\n        void show()\n        {\n            if (x > 1)\n                System.out.print(x + \" \");\n        }\n    }\n    class packages\n    {\n        public static void main(String args[])\n        {\n            display[] arr=new display[3];\n            for(int i=0;i<3;i++)\n                arr[i]=new display();\n            arr[0].x = 0;\n            arr[1].x = 1;\n            arr[2].x = 2;\n            for (int i = 0; i < 3; ++i)\n                arr[i].show();\n         }\n    }"]},{"id":863,"cat":"Core Java","topic":"Packages","q":"What will be the output of the following Java program?","opts":[["a","xello"],["b","xxxxx"],["c","Hxllo"],["d","Hexlo"]],"ans":"c","cod":["    package pkg;\n    class output\n    {\n        public static void main(String args[])\n        {\n            StringBuffer s1 = new StringBuffer(\"Hello\");\n            s1.setCharAt(1, x);\n            System.out.println(s1);\n        }\n    }"]},{"id":864,"cat":"Core Java","topic":"Packages","q":"What will be the output of the following Java program?\nNote : Output.class file is not in directory pkg.","opts":[["a","HelloGoodWorld"],["b","HellGoodoWorld"],["c","Compilation error"],["d","Runtime error"]],"ans":"d","cod":["    package pkg;\n    class output\n    {\n        public static void main(String args[])\n        {\n            StringBuffer s1 = new StringBuffer(\"Hello World\");\n            s1.insert(6 , \"Good \");\n            System.out.println(s1);\n        }\n   }"],"exp":"Since output.class file is not in the directory pkg in which class output is defined, program will not be able to run."},{"id":865,"cat":"Core Java","topic":"Random Number","q":"Which class is used to generate random number?","opts":[["a","java.lang.Object"],["b","java.util.randomNumber"],["c","java.util.Random"],["d","java.util.Object"]],"ans":"c","exp":"The java.util.Random class is used to generate random numbers in Java. It provides methods such as nextInt(), nextDouble(), and nextFloat() to generate different types of random values. The other options are either incorrect class names or unrelated to random number generation."},{"id":866,"cat":"Core Java","topic":"Random Number","q":"Which method is used to generate boolean random values in java?","opts":[["a","nextBoolean()"],["b","randomBoolean()"],["c","previousBoolean()"],["d","generateBoolean()"]],"ans":"a","exp":"nextBoolean() method of java.util.Random class is used to generate random numbers."},{"id":867,"cat":"Core Java","topic":"Random Number","q":"What is the return type of Math.random() method?","opts":[["a","Integer"],["b","Double"],["c","String"],["d","Boolean"]],"ans":"b","exp":"Math.random() method returns floating point number or precisely a double."},{"id":868,"cat":"Core Java","topic":"Random Number","q":"Random is a final class?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"Random is not a final class and can be extended to implement the algorithm as per requirement."},{"id":869,"cat":"Core Java","topic":"Random Number","q":"What is the range of numbers returned by Math.random() method?","opts":[["a","-1.0 to 1.0"],["b","-1 to 1"],["c","0 to 100"],["d","0.0 to 1.0"]],"ans":"d","exp":"Math.random() returns only double value greater than or equal to 0.0 and less than 1.0."},{"id":870,"cat":"Core Java","topic":"Random Number","q":"How many bits are used for generating random numbers?","opts":[["a","32"],["b","64"],["c","48"],["d","8"]],"ans":"c","exp":"Random number can accept 64 bits but it only uses 48 bits for generating random numbers."},{"id":871,"cat":"Core Java","topic":"Random Number","q":"What will be the output of the following Java code snippet?","opts":[["a","Random number between 1 to 15, including 1 and 15"],["b","Random number between 1 to 15, excluding 15"],["c","Random number between 1 to 15, excluding 1"],["d","Random number between 1 to 15, excluding 1 and 15"]],"ans":"a","cod":["int a = random.nextInt(15) + 1;"],"exp":"random.nextInt(15) + 1; returns random numbers between 1 to 15 including 1 and 15."},{"id":872,"cat":"Core Java","topic":"Random Number","q":"What will be the output of the following Java code snippet?","opts":[["a","Random number between 4 to 7, including 4 and 7"],["b","Random number between 4 to 7, excluding 4 and 7"],["c","Random number between 4 to 10, excluding 4 and 10"],["d","Random number between 4 to 10, including 4 and 10"]],"ans":"d","cod":["int a = random.nextInt(7) + 4;"],"exp":"random.nextInd(7) + 4; returns random numbers between 4 to 10 including 4 and 10. it follows "nextInt(max - min +1) + min" formula."},{"id":873,"cat":"Core Java","topic":"Random Number","q":"Math.random() guarantees uniqueness?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"Math.random() doesn't guarantee uniqueness. To guarantee uniqueness we must store the generated value in the database and compare against already generated values."},{"id":874,"cat":"Core Java","topic":"Random Number","q":"What is the signature of Math.random() method?","opts":[["a","public static double random()"],["b","public void double random()"],["c","public static int random()"],["d","public void int random()"]],"ans":"a","exp":"public static double random() is the utility method provided by Math class which returns double."},{"id":875,"cat":"Core Java","topic":"Reading & Writing Files","q":"Which of these class contains the methods used to write in a file?","opts":[["a","FileStream"],["b","FileInputStream"],["c","BufferedOutputStream"],["d","FileBufferStream"]],"ans":"b","exp":"BufferedOutputStream Provides buffering for output streams, which helps to improve efficiency by reducing the number of write operations to the underlying file."},{"id":876,"cat":"Core Java","topic":"Reading & Writing Files","q":"Which of these exception is thrown in cases when the file specified for writing is not found?","opts":[["a","IOException"],["b","FileException"],["c","FileNotFoundException"],["d","FileInputException"]],"ans":"c","exp":"In cases when the file specified is not found, then FileNotFoundException is thrown by java run-time system, earlier versions of java used to throw IOException but after Java 2.0 they throw FileNotFoundException."},{"id":877,"cat":"Core Java","topic":"Reading & Writing Files","q":"Which of these methods are used to read in from file?","opts":[["a","get()"],["b","read()"],["c","scan()"],["d","readFileInput()"]],"ans":"b","exp":"Each time read() is called, it reads a single byte from the file and returns the byte as an integer value. read() returns -1 when the end of the file is encountered."},{"id":878,"cat":"Core Java","topic":"Reading & Writing Files","q":"Which of these values is returned by read() method is end of file (EOF) is encountered?","opts":[["a","0"],["b","1"],["c","-1"],["d","Null"]],"ans":"c","exp":"Each time read() is called, it reads a single byte from the file and returns the byte as an integer value. read() returns -1 when the end of the file is encountered."},{"id":879,"cat":"Core Java","topic":"Reading & Writing Files","q":"Which of these exception is thrown by close() and read() methods?","opts":[["a","IOException"],["b","FileException"],["c","FileNotFoundException"],["d","FileInputOutputException"]],"ans":"a","exp":"Both close() and read() method throw IOException."},{"id":880,"cat":"Core Java","topic":"Reading & Writing Files","q":"Which of these methods is used to write() into a file?","opts":[["a","put()"],["b","putFile()"],["c","write()"],["d","writeFile()"]],"ans":"c","exp":"The write() method is used to write data into a file. Specifically, the write() method of the FileWriter class is commonly used for this purpose."},{"id":881,"cat":"Core Java","topic":"Reading & Writing Files","q":"What will be the output of the following Java program?\nNote: inputoutput.java is stored in the disk.","opts":[["a","true"],["b","false"],["c","prints number of bytes in file"],["d","prints number of characters in the file"]],"ans":"c","cod":["   import java.io.*;\n   class filesinputoutput\n   {\n       public static void main(String args[]) throws Exception\n       {\n           InputStream obj = new FileInputStream(\"inputoutput.java\");\n           System.out.print(obj.available());\n       }\n   }"],"exp":"obj.available() returns the number of bytes."},{"id":882,"cat":"Core Java","topic":"Reading & Writing Files","q":"What will be the output of the following Java program?","opts":[["a","AaBaCa"],["b","ABCaaa"],["c","AaaBaaCaa"],["d","AaBbCc"]],"ans":"d","cod":["import java.io.*;\npublic class filesinputoutput\n{\n    public static void main(String[] args)\n    {\n        String obj  = \"abc\";\n        byte b[] = obj.getBytes();\n        ByteArrayInputStream obj1 = new ByteArrayInputStream(b);\n        for (int i = 0; i < 2; ++ i)\n        {\n            int c;\n            while((c = obj1.read()) != -1)\n            {\n                if(i == 0)\n                {\n                    System.out.print(Character.toUpperCase((char)c));\n                }\n                System.out.print((char)c);\n            }\n        }\n    }\n}"],"exp":"The String object is converted to array of bytes and create a object of ByteArrayInputStream and read from the object byte by byte in an integer and printed by parsing the character to uppercase followed by lowercase."},{"id":883,"cat":"Core Java","topic":"Reading & Writing Files","q":"What will be the output of the following Java program?","opts":[["a","abc"],["b","abcd"],["c","abcde"],["d","abcdef"]],"ans":"a","cod":["    import java.io.*;\n    class Chararrayinput\n    {\n        public static void main(String[] args)\n        {\n\t    String obj  = \"abcdef\";\n            int length = obj.length();\n            char c[] = new char[length];\n            obj.getChars(0, length, c, 0);\n            CharArrayReader input1 = new CharArrayReader(c);\n            CharArrayReader input2 = new CharArrayReader(c, 0, 3);\n            int i;\n            try\n            {\n\t\twhile((i = input2.read()) != -1)\n                {\n                    System.out.print((char)i);\n                }\n       \t    }\n            catch (IOException e)\n            {\n                e.printStackTrace();\n\t    }\n\t}\n    }"],"exp":"The input2 object contains the first three characters from the character array; later, each of these characters is printed one by one."},{"id":884,"cat":"Core Java","topic":"Reading Console Inputs","q":"Which exception is thrown by read() method?","opts":[["a","IOException"],["b","InterruptedException"],["c","SystemException"],["d","SystemInputException"]],"ans":"a","exp":"read method throws IOException."},{"id":885,"cat":"Core Java","topic":"Reading Console Inputs","q":"Which of these is used to read a string from the input stream?","opts":[["a","get()"],["b","getLine()"],["c","read()"],["d","readLine()"]],"ans":"c"},{"id":886,"cat":"Core Java","topic":"Reading Console Inputs","q":"Which of these class is used to read characters and strings in Java from console?","opts":[["a","BufferedReader"],["b","StringReader"],["c","BufferedStreamReader"],["d","InputStreamReader"]],"ans":"a"},{"id":887,"cat":"Core Java","topic":"Reading Console Inputs","q":"Which of these class is implemented by FilterInputStream class?","opts":[["a","InputStream"],["b","InputOutputStream"],["c","BufferedInputStream"],["d","SequenceInputStream"]],"ans":"a","exp":"FileInputStream implements InputStream."},{"id":888,"cat":"Core Java","topic":"Reading Console Inputs","q":"What will be the output of the following Java program if input given is "Hello stop World"?","opts":[["a","Hello"],["b","Hello stop"],["c","World"],["d","Hello stop World"]],"ans":"d","cod":["    class Input_Output\n    {\n        public static void main(String args[]) throws IOException\n        {\n            string str;\n            BufferedReader obj = new BufferedReader(new InputStreamReader(System.in));\n            do\n            {\n                str = (char) obj.readLine();\n\t        System.out.print(str);\n            } while(!str.equals(\"strong\"));\n        }\n    }"],"exp":""stop" will be able to terminate the do-while loop only when it occurs singly in a line. "Hello stop World" does not terminate the loop."},{"id":889,"cat":"Core Java","topic":"Reading Console Inputs","q":"What will be the output of the following Java program?","opts":[["a","Hello"],["b","World"],["c","Helloworld"],["d","Hello World"]],"ans":"d","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n             StringBuffer c = new StringBuffer(\"Hello\");\n             StringBuffer c1 = new StringBuffer(\" World\");\n             c.append(c1);\n             System.out.println(c);\n        }\n    }"],"exp":"append() method of class StringBuffer is used to concatenate the string representation to the end of invoking string."},{"id":890,"cat":"Core Java","topic":"Reading Console Inputs","q":"What will be the output of the following Java program?","opts":[["a","xello"],["b","xxxxx"],["c","Hxllo"],["d","Hexlo"]],"ans":"c","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n           StringBuffer s1 = new StringBuffer(\"Hello\");\n           s1.setCharAt(1,x);\n           System.out.println(s1);\n        }\n    }"]},{"id":891,"cat":"Core Java","topic":"Reading Console Inputs","q":"What will be the output of the following Java program if input given is "abc'def/'egh"?","opts":[["a","abc'"],["b","abcdef/'"],["c","abc'def/'egh"],["d","abcqfghq"]],"ans":"a","cod":["    class Input_Output\n    {\n        public static void main(String args[]) throws IOException\n        {\n            char c;\n            BufferedReader obj = new BufferedReader(new InputStreamReader(System.in));\n            do\n            {\n                c = (char) obj.read();\n\t        System.out.print(c);\n            } while(c != '\\'');\n        }\n    }"],"exp":"\\' is used for single quotes that is for representing ' ."},{"id":892,"cat":"Core Java","topic":"Recursion","q":"What is Recursion in Java?","opts":[["a","Recursion is a class"],["b","Recursion is a process of defining a method that calls other methods repeatedly"],["c","Recursion is a process of defining a method that calls itself repeatedly"],["d","Recursion is a process of defining a method that calls other methods which in turn call again this method"]],"ans":"c","exp":"Recursion is the process of defining something in terms of itself. It allows us to define a method that calls itself."},{"id":893,"cat":"Core Java","topic":"Recursion","q":"Which of these data types is used by operating system to manage the Recursion in Java?","opts":[["a","Array"],["b","Stack"],["c","Queue"],["d","Tree"]],"ans":"b","exp":"Recursions are always managed by using stack."},{"id":894,"cat":"Core Java","topic":"Recursion","q":"Which of these will happen if recursive method does not have a base case?","opts":[["a","An infinite loop occurs"],["b","System stops the program after some time"],["c","After 1000000 calls it will be automatically stopped"],["d","None of the mentioned"]],"ans":"a","exp":"If a recursive method does not have a base case then an infinite loop occurs which results in Stack Overflow."},{"id":895,"cat":"Core Java","topic":"Recursion","q":"Which of these is not a correct statement?","opts":[["a","A recursive method must have a base case"],["b","Recursion always uses stack"],["c","Recursive methods are faster than programmer's written loop statement that calls the function iteratively"],["d","Recursion is managed by Java Runtime environment"]],"ans":"c","exp":"Recursion has always an overhead associated with a function call i.e., it has to maintain the function in the stack, manage space for variables, temp memories, and return pointers. Every recursive call will be in its own stack frame that can lead to stack overflow. An iterative method will be faster in general as it doesn't have stackframe overheads. Recursion is managed by Java Runtime only which in turn can utilize the platform APIs."},{"id":896,"cat":"Core Java","topic":"Recursion","q":"Which of these packages contains the error StackOverflowError in Java?","opts":[["a","java.lang"],["b","java.util"],["c","java.io"],["d","java.system"]],"ans":"a","exp":"StackOverflowError is a subclass of VirtualMachineError located in the java.lang package, which contains fundamental classes and errors used by the Java runtime."},{"id":897,"cat":"Core Java","topic":"Recursion","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","1"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"d","cod":["    class recursion\n    {\n        int func (int n)\n        {\n            int result;\n            result = func (n - 1);\n            return result;\n        }\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            recursion obj = new recursion() ;\n            System.out.print(obj.func(12));\n        }\n    }"],"exp":"Since the base case of the recursive function func() is not defined hence infinite loop occurs and results in Stack Overflow."},{"id":898,"cat":"Core Java","topic":"Recursion","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","1"],["c","120"],["d","None of the mentioned"]],"ans":"b","cod":["    class recursion\n    {\n        int func (int n)\n        {\n            int result;\n            if (n == 1)\n                return 1;\n            result = func (n - 1);\n            return result;\n        }\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            recursion obj = new recursion() ;\n            System.out.print(obj.func(5));\n        }\n    }"],"exp":"The function recursively calls itself until n equals 1, then returns 1. Since there's no operation besides returning the recursive call's result, the final output is always 1 regardless of the input."},{"id":899,"cat":"Core Java","topic":"Recursion","q":"What will be the output of the following Java program?","opts":[["a","24"],["b","30"],["c","120"],["d","720"]],"ans":"c","cod":["    class recursion\n    {\n        int fact(int n)\n        {\n            int result;\n            if (n == 1)\n                return 1;\n            result = fact(n - 1) * n;\n            return result;\n        }\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            recursion obj = new recursion() ;\n            System.out.print(obj.fact(5));\n        }\n    }"],"exp":"fact() method recursively calculates factorial of a number, when value of n reaches 1, base case is executed and 1 is returned. In each call the expression 5*4*3*2*1 is formed to stack the final call folded and return the result as their product i.e. 120."},{"id":900,"cat":"Core Java","topic":"Recursion","q":"What will be the output of the following Java program?","opts":[["a","1"],["b","30"],["c","120"],["d","Runtime Error"]],"ans":"a","cod":["    class recursion\n    {\n        int fact(int n)\n        {\n            int result;\n            if (n == 1)\n                return 1;\n            result = fact(n - 1) * n;\n            return result;\n        }\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            recursion obj = new recursion() ;\n            System.out.print(obj.fact(1));\n        }\n    }"],"exp":"fact() method recursively calculates factorial of a number, when value of n reaches 1, base case is excuted and 1 is returned."},{"id":901,"cat":"Core Java","topic":"Recursion","q":"What will be the output of the following Java program?","opts":[["a","1"],["b","30"],["c","120"],["d","720"]],"ans":"d","cod":["    class recursion\n    {\n        int fact(int n)\n        {\n            int result;\n            if (n == 1)\n                return 1;\n            result = fact(n - 1) * n;\n            return result;\n        }\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            recursion obj = new recursion() ;\n            System.out.print(obj.fact(6));\n        }\n    }"],"exp":"fact() method recursively calculates factorial of a number, when value of n reaches 1, base case is executed and 1 is returned. In each call the expression 6*5*4*3*2*1 is formed to stack the final call folded and return the result as their product i.e. 720."},{"id":902,"cat":"Core Java","topic":"Regular Expression","q":"Which of the following is not a class of java.util.regex?","opts":[["a","Pattern class"],["b","matcher class"],["c","PatternSyntaxException"],["d","Regex class"]],"ans":"d","exp":"java.util.regex consists 3 classes. PatternSyntaxException indicates syntax error in regex."},{"id":903,"cat":"Core Java","topic":"Regular Expression","q":"What is the significance of Matcher class for regular expression in java?","opts":[["a","interpretes pattern in the string"],["b","Performs match in the string"],["c","interpreted both pattern and performs match operations in the string"],["d","None of the mentioned."]],"ans":"c","exp":"macther() method is invoked using matcher object which interpretes pattern and performs match operations in the input string."},{"id":904,"cat":"Core Java","topic":"Regular Expression","q":"Object of which class is used to compile regular expression?","opts":[["a","Pattern class"],["b","Matcher class"],["c","PatternSyntaxException"],["d","None of the mentioned"]],"ans":"a","exp":"object of Pattern class can represent compiled regular expression."},{"id":905,"cat":"Core Java","topic":"Regular Expression","q":"Which capturing group can represent the entire expression?","opts":[["a","group *"],["b","group 0"],["c","group * or group 0"],["d","None of the mentioned"]],"ans":"b","exp":"Group 0 is a special group which represents the entire expression."},{"id":906,"cat":"Core Java","topic":"Regular Expression","q":"groupCount reports a total number of Capturing groups.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"groupCount reports total number of Capturing groups. this does not include special group, group 0."},{"id":907,"cat":"Core Java","topic":"Regular Expression","q":"Which of the following matches nonword character using regular expression in java?","opts":[["a","\\w"],["b","\\W"],["c","\\s"],["d","\\S"]],"ans":"b","exp":"\\W matches nonword characters. [0-9], [A-Z] and _ (underscore) are word characters. All other than these characters are nonword characters."},{"id":908,"cat":"Core Java","topic":"Regular Expression","q":"Which of the following matches end of the string using regular expression in java?","opts":[["a","\\z"],["b","\\\\"],["c","\\*"],["d","\\Z"]],"ans":"a","exp":"\\z is used to match end of the entire string in regular expression in java."},{"id":909,"cat":"Core Java","topic":"Regular Expression","q":"What does public int end(int group) return?","opts":[["a","offset from last character of the subsequent group"],["b","offset from first character of the subsequent group"],["c","offset from last character matched"],["d","offset from first character matched"]],"ans":"a","exp":"public int end(int group) returns offset from the last character of the subsequent group."},{"id":910,"cat":"Core Java","topic":"Regular Expression","q":"what does public String replaceAll(string replace) do?","opts":[["a","Replace all characters that matches pattern with a replacement string"],["b","Replace first subsequence that matches pattern with a replacement string"],["c","Replace all other than first subsequence of that matches pattern with a replacement string"],["d","Replace every subsequence of the input sequence that matches pattern with a replacement string"]],"ans":"d","exp":"replaceAll method replaces every subsequence of the sequence that matches pattern with a replacement string."},{"id":911,"cat":"Core Java","topic":"Regular Expression","q":"What does public int start() return?","opts":[["a","returns start index of the input string"],["b","returns start index of the current match"],["c","returns start index of the previous match"],["d","none of the mentioned"]],"ans":"c","exp":"public int start() returns index of the previous match in the input string."},{"id":912,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"What is the output of relational operators?","opts":[["a","int"],["b","boolean"],["c","char"],["d","double"]],"ans":"b","exp":"relational operators return the boolean result which is either true or false, boolean is one of the primitive data type for relational statements."},{"id":913,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"Which of these is returned by ">", "<" and "==" operators?","opts":[["a","int"],["b","double"],["c","boolean"],["d","none of the mentioned"]],"ans":"c","exp":"All relational operators return a boolean value ie. true and false."},{"id":914,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"Which of the following operators can operate on a boolean variable?","opts":[["a","3 & 2"],["b","1 & 4"],["c","1, 2 & 4"],["d","1, 2 & 3"]],"ans":"d","cod":["   1. &&\n\n   2. ==\n\n   3. ?:\n\n   4. +="],"exp":"Operator Short circuit AND, &&, equal to, == , ternary if-then-else, ?:, are boolean logical operators. += is an arithmetic operator it can operate only on numeric values."},{"id":915,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"Which of these operators can skip evaluating right hand operand?","opts":[["a","!"],["b","|"],["c","&"],["d","&&"]],"ans":"d","exp":"Operator short circuit and, &&, and short circuit or, ||, skip evaluating right hand operand when output can be determined by left operand alone."},{"id":916,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"Which of these statements is correct?","opts":[["a","true and false are numeric values 1 and 0"],["b","true and false are numeric values 0 and 1"],["c","true is any non zero value and false is 0"],["d","true and false are non numeric values"]],"ans":"d","exp":"True and false are keywords, they are non numeric values which do not relate to zero or non zero numbers. true and false are boolean values."},{"id":917,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"What will be the output of the following Java code?","opts":[["a","1"],["b","0"],["c","true"],["d","false"]],"ans":"d","cod":["    class Relational_operator\n    {\n        public static void main(String args[])\n        {\n            int var1 = 5;\n            int var2 = 6;\n            System.out.print(var1 > var2);\n        }\n    }"],"exp":"Operator > returns a boolean value. 5 is not greater than 6 therefore false is returned."},{"id":918,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"What will be the output of the following Java code?","opts":[["a","false false"],["b","true ture"],["c","true false"],["d","false true"]],"ans":"d","cod":["    class bool_operator\n    {\n        public static void main(String args[])\n        {\n             boolean a = true;\n             boolean b = !true;\n             boolean c = a | b;\n \t     boolean d = a & b;\n             boolean e = d ? b : c;\n             System.out.println(d + \" \" + e);\n        }\n    }"],"exp":"Operator | returns true if any one operand is true, thus 'c = true | false' is true. Operator & returns a true if both of the operand is true thus d is false. Ternary operator ?: assigns left of ':' if condition is true and right hand of ':' if condition is false. d is false thus e = d ? b : c , assigns c to e , e contains true."},{"id":919,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","1"],["c","3"],["d","-4"]],"ans":"c","cod":["    class ternary_operator\n    {\n        public static void main(String args[])\n        {\n             int x = 3;\n             int y = ~ x;\n             int z;\n             z = x > y ? x : y;\n             System.out.print(z);\n        }\n    }"],"exp":"The variable x is set to 3. Then, the expression y = ~x means y is assigned the 1's complement of 3. According to the formula, ~n = -(n + 1), so y = -4. Since the condition 3 > -4 evaluates to true, the value before the colon (:) in a conditional (ternary) expression is selected. Hence, z is assigned the value 3."},{"id":920,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"What will be the output of the following Java code?","opts":[["a","1"],["b","2"],["c","Runtime error owing to division by zero in if condition"],["d","Unpredictable behavior of program"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n             int x , y = 1;\n             x = 10;\n             if (x != 10 && x / 0 == 0)\n                 System.out.println(y);\n             else\n                 System.out.println(++y);\n        }\n    }"],"exp":"Operator short circuit and, &&, skips evaluating right hand operand if left hand operand is false thus division by zero in if condition does not give an error."},{"id":921,"cat":"Core Java","topic":"Relational Operators and Boolean Logic Operators","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","1"],["c","false"],["d","true"]],"ans":"c","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n             boolean a = true;\n             boolean b = false;\n             boolean c = a ^ b;\n             System.out.println(!c);\n        }\n    }"],"exp":"The XOR ^ returns false when both operands are the same, i.e., true ^ true or false ^ false, and returns true when they are different, i.e., true ^ false or false ^ true. So, c is true, but since we print the NOT of c, the output is false."},{"id":922,"cat":"Core Java","topic":"Remote Method Invocation (RMI)","q":"What is Remote method invocation (RMI)?","opts":[["a","RMI allows us to invoke a method of java object that executes on another machine"],["b","RMI allows us to invoke a method of java object that executes on another Thread in multithreaded programming"],["c","RMI allows us to invoke a method of java object that executes parallely in same machine"],["d","None of the mentioned"]],"ans":"a","exp":"Remote method invocation RMI allows us to invoke a method of java object that executes on another machine."},{"id":923,"cat":"Core Java","topic":"Remote Method Invocation (RMI)","q":"Which of these package is used for remote method invocation?","opts":[["a","java.applet"],["b","java.rmi"],["c","java.lang.rmi"],["d","java.lang.reflect"]],"ans":"b","exp":"The package used for remote method invocation in Java is java.rmi. This package provides the necessary classes and interfaces to implement RMI in Java applications, enabling remote communication between client and server programs."},{"id":924,"cat":"Core Java","topic":"Remote Method Invocation (RMI)","q":"Which of these methods are member of Remote class?","opts":[["a","checkIP()"],["b","addLocation()"],["c","AddServer()"],["d","None of the mentioned"]],"ans":"d","exp":"Remote class does not define any methods, its purpose is simply to indicate that an interface uses remote methods."},{"id":925,"cat":"Core Java","topic":"Remote Method Invocation (RMI)","q":"Which of these Exceptions is thrown by remote method?","opts":[["a","RemoteException"],["b","InputOutputException"],["c","RemoteAccessException"],["d","RemoteInputOutputException"]],"ans":"a","exp":"All remote methods throw RemoteException."},{"id":926,"cat":"Core Java","topic":"Remote Method Invocation (RMI)","q":"Which of these class is used for creating a client for a server-client operations?","opts":[["a","Client.java"],["b","ServerClient.java"],["c","both Client.java and ServerClient.java"],["d","None of the mentioned"]],"ans":"c","exp":"The class used for creating a client for server-client operations is ServerClient.java or Client.java."},{"id":927,"cat":"Core Java","topic":"Remote Method Invocation (RMI)","q":"Which of these package is used for all the text related modifications?","opts":[["a","java.text"],["b","java.awt"],["c","java.lang.text"],["d","java.text.modify"]],"ans":"a","exp":"java.text provides capabilities for formatting, searching and manipulating text."},{"id":928,"cat":"Core Java","topic":"Remote Method Invocation (RMI)","q":"What will be the output of the following Java code?","opts":[["a","Program prints all the constructors of 'java.awt.Dimension' package"],["b","Program prints all the possible constructors of class 'Class'"],["c","Program prints "Exception""],["d","Runtime Error"]],"ans":"a","cod":["    import java.lang.reflect.*;\n    class Additional_packages\n    {\n         public static void main(String args[])\n         {\n\t     try\n             {\n\t         Class c = Class.forName(\"java.awt.Dimension\");\n\t\t Constructor constructors[] = c.getConstructors();\n\t\t for (int i = 0; i < constructors.length; i++)\n\t\t     System.out.println(constructors[i]);\n\t     }\n\t     catch (Exception e)\n             {\n             System.out.print(\"Exception\");\n             }\n        }\n    }"],"exp":"getConstructors() Returns an array containing Constructor objects reflecting all the public constructors of the class represented by this Class object."},{"id":929,"cat":"Core Java","topic":"Remote Method Invocation (RMI)","q":"What will be the output of the following Java code?","opts":[["a","Program prints all the constructors of 'java.awt.Dimension' package"],["b","Program prints all the methods of 'java.awt.Dimension' package"],["c","Program prints all the data members of 'java.awt.Dimension' package"],["d","program prints all the methods and data member of 'java.awt.Dimension' package"]],"ans":"c","cod":["    import java.lang.reflect.*;\n    class Additional_packages\n    {\n         public static void main(String args[])\n         {\n\t     try\n             {\n\t         Class c = Class.forName(\"java.awt.Dimension\");\n\t\t Field fields[] = c.getFields();\n\t\t for (int i = 0; i < fields.length; i++)\n\t\t     System.out.println(fields[i]);\n\t     }\n\t     catch (Exception e)\n             {\n             System.out.print(\"Exception\");\n             }\n        }\n    }"],"exp":"getFields() Returns an array containing Field objects reflecting all the accessible public fields of the class or interface represented by this Class object."},{"id":930,"cat":"Core Java","topic":"Remote Method Invocation (RMI)","q":"What will be the output of the following Java program?","opts":[["a","Program prints all the constructors of 'java.awt.Dimension' package"],["b","Program prints all the methods of 'java.awt.Dimension' package"],["c","Program prints all the data members of 'java.awt.Dimension' package"],["d","program prints all the methods and data member of 'java.awt.Dimension' package"]],"ans":"b","cod":["    import java.lang.reflect.*;\n    class Additional_packages\n    {\n         public static void main(String args[])\n         {\n\t     try\n             {\n\t         Class c = Class.forName(\"java.awt.Dimension\");\n\t\t Method methods[] = c.getMethods();\n\t\t for (int i = 0; i < methods.length; i++)\n\t\t     System.out.println(methods[i]);\n\t     }\n\t     catch (Exception e)\n             {\n             System.out.print(\"Exception\");\n             }\n        }\n    }"],"exp":"getMethods() Returns an array containing Method objects reflecting all the public methods of the class or interface represented by this Class object, including those declared by the class or interface and those inherited from superclasses and superinterfaces."},{"id":931,"cat":"Core Java","topic":"Restrictions on Generics","q":"Which of these types cannot be used to initiate a generic type?","opts":[["a","Integer class"],["b","Float class"],["c","Primitive Types"],["d","Collections"]],"ans":"c"},{"id":932,"cat":"Core Java","topic":"Restrictions on Generics","q":"Which of these instance cannot be created?","opts":[["a","Integer instance"],["b","Generic class instance"],["c","Generic type instance"],["d","Collection instances"]],"ans":"c","exp":"It is not possible to create generic type instances. Example - "E obj = new E()" will give a compilation error."},{"id":933,"cat":"Core Java","topic":"Restrictions on Generics","q":"Which of these data type cannot be type parameterized?","opts":[["a","Array"],["b","List"],["c","Map"],["d","Set"]],"ans":"a"},{"id":934,"cat":"Core Java","topic":"Restrictions on Generics","q":"What will be the output of the following Java program?","opts":[["a","5.0"],["b","7.0"],["c","8.0"],["d","6.0"]],"ans":"b","cod":["    import java.util.*;\n    class Output\n    {\n        public static double sumOfList(List<? extends Number> list)\n        {\n            double s = 0.0;\n            for (Number n : list)\n                s += n.doubleValue();\n            return s;\n        }\n        public static void main(String args[])\n        {\n           List<Double> ld = Arrays.asList(1.2, 2.3, 3.5);\n           System.out.println(sumOfList(ld));\n        }\n    }"]},{"id":935,"cat":"Core Java","topic":"Restrictions on Generics","q":"What will be the output of the following Java program?","opts":[["a","1"],["b","2"],["c","3"],["d","6"]],"ans":"a","cod":["    import java.util.*;\n    class Output\n    {\n        public static void addNumbers(List<? super Integer> list)\n        {\n            for (int i = 1; i <= 10; i++)\n            {\n                list.add(i);\n            }\n        }\n        public static void main(String args[])\n        {\n           List<Double> ld = Arrays.asList();\n           addnumbers(10.4);\n           System.out.println(\"getList(2)\");\n        }\n    }"]},{"id":936,"cat":"Core Java","topic":"Restrictions on Generics","q":"What will be the output of the following Java program?","opts":[["a","H"],["b","Hello"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"d","cod":["    import java.util.*;\n    public class genericstack <E>\n    {\n        Stack <E> stk = new Stack <E>();\n\tpublic void push(E obj)\n        {\n            stk.push(obj);\n\t}\n\tpublic E pop()\n        {\n            E obj = stk.pop();\n\t    return obj;\n\t}\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            genericstack <Integer> gs = new genericstack<Integer>();\n            gs.push(36);\n            System.out.println(gs.pop());\n        }\n    }"],"exp":"generic stack object gs is defined to contain a string parameter but we are sending an integer parameter, which results in compilation error."},{"id":937,"cat":"Core Java","topic":"Rounding Functions","q":"Which of these class provides various types of rounding functions?","opts":[["a","Math"],["b","Process"],["c","System"],["d","Object"]],"ans":"a"},{"id":938,"cat":"Core Java","topic":"Rounding Functions","q":"Which of these methods return a smallest whole number greater than or equal to variable X?","opts":[["a","double ceil(double X)"],["b","double floor(double X)"],["c","double max(double X)"],["d","double min(double X)"]],"ans":"a","exp":"ceil(double X) returns the smallest whole number greater than or equal to variable X."},{"id":939,"cat":"Core Java","topic":"Rounding Functions","q":"Which of these method returns a largest whole number less than or equal to variable X?","opts":[["a","double ceil(double X)"],["b","double floor(double X)"],["c","double max(double X)"],["d","double min(double X)"]],"ans":"b","exp":"double floor(double X) returns a largest whole number less than or equal to variable X."},{"id":940,"cat":"Core Java","topic":"Rounding Functions","q":"Which of function return absolute value of a variable?","opts":[["a","abs()"],["b","absolute()"],["c","absolutevariable()"],["d","none of the mentioned"]],"ans":"a","exp":"abs() returns the absolute value of a variable."},{"id":941,"cat":"Core Java","topic":"Rounding Functions","q":"What will be the output of the following Java code?","opts":[["a","1 2 0 0"],["b","1 2 1 2"],["c","0 0 0 0"],["d","System Dependent"]],"ans":"b","cod":["    class A\n    {\n         int x;\n         int y;\n         void display()\n         {\n              System.out.print(x + \" \" + y);\n         }\n    }\n    class Output\n    {\n         public static void main(String args[])\n         {\n             A obj1 = new A();\n             A obj2 = new A();\n             obj1.x = 1;\n             obj1.y = 2;\n             obj2 = obj1.clone();\n             obj1.display();\n             obj2.display();\n         }\n    }"],"exp":"clone() method of object class is used to generate duplicate copy of the object on which it is called. Copy of obj1 is generated and stored in obj2."},{"id":942,"cat":"Core Java","topic":"Rounding Functions","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","3"],["c","3.0"],["d","3.1"]],"ans":"b","cod":["    class Output\n    {\n         public static void main(String args[])\n         {\n             double x = 3.14;\n             int y = (int) Math.abs(x);\n             System.out.print(y);\n         }\n    }"]},{"id":943,"cat":"Core Java","topic":"Rounding Functions","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","3"],["c","3.0"],["d","4"]],"ans":"d","cod":["    class Output\n    {\n         public static void main(String args[])\n         {\n             double x = 3.14;\n             int y = (int) Math.ceil(x);\n             System.out.print(y);\n         }\n    }"],"exp":"ciel(double X) returns the smallest whole number greater than or equal to variable x."},{"id":944,"cat":"Core Java","topic":"Rounding Functions","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","3"],["c","3.0"],["d","4"]],"ans":"b","cod":["    class Output\n    {\n         public static void main(String args[])\n         {\n             double x = 3.14;\n             int y = (int) Math.floor(x);\n             System.out.print(y);\n         }\n    }"],"exp":"double floor(double X) returns a largest whole number less than or equal to variable X. Here the smallest whole number less than 3.14 is 3."},{"id":945,"cat":"Core Java","topic":"Runnable Interface","q":"Which of interface contains all the methods used for handling thread related operations in Java?","opts":[["a","Runnable interface"],["b","Math interface"],["c","System interface"],["d","ThreadHandling interface"]],"ans":"a","exp":"Runnable interface defines all the methods for handling thread operations in Java."},{"id":946,"cat":"Core Java","topic":"Runnable Interface","q":"What is the output of this program?","opts":[["a","true"],["b","false"],["c","truetrue"],["d","falsefalse"]],"ans":"d","cod":["    class newthread implements Runnable {\n\tThread t1,t2;\n        newthread() {\n            t1 = new Thread(this,\"Thread_1\");\n            t2 = new Thread(this,\"Thread_2\");\n            t1.start();\n            t2.start();\n\t}\n\tpublic void run() {\n            t2.setPriority(Thread.MAX_PRIORITY);\n\t    System.out.print(t1.equals(t2));\n        }\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"Threads t1 & t2 are created by class newthread that is implementing runnable interface, hence both the threads are provided their own run() method specifying the actions to be taken. When constructor of newthread class is called first the run() method of t1 executes than the run method of t2 printing 2 times "false" as both the threads are not equal one is having different priority than other, hence falsefalse is printed.\n$ javac multithreaded_programing.java\n$ java multithreaded_programing\nfalsefalse"},{"id":947,"cat":"Core Java","topic":"Searching and Modifying a String","q":"Which of this method of class String is used to extract a substring from a String object?","opts":[["a","substring()"],["b","Substring()"],["c","SubString()"],["d","None of the mentioned"]],"ans":"a","exp":"The substring() method is a predefined method in the String class that returns a portion of the string based on the given arguments."},{"id":948,"cat":"Core Java","topic":"Searching and Modifying a String","q":"What will s2 contain after following lines of Java code?","opts":[["a","one"],["b","two"],["c","onetwo"],["d","twoone"]],"ans":"c","cod":[" String s1 = \"one\";\nString s2 = s1.concat(\"two\")"],"exp":"Two strings can be concatenated by using concat() method."},{"id":949,"cat":"Core Java","topic":"Searching and Modifying a String","q":"Which of these method of class String is used to remove leading and trailing whitespaces?","opts":[["a","startsWith()"],["b","trim()"],["c","Trim()"],["d","doTrim()"]],"ans":"b","exp":"The trim() method is a predefined method that removes leading and trailing whitespace characters such as newline (\\n), tab (\\t), and space ( )."},{"id":950,"cat":"Core Java","topic":"Searching and Modifying a String","q":"What is the value returned by function compareTo() if the invoking string is greater than the string compared?","opts":[["a","zero"],["b","value less than zero"],["c","value greater than zero"],["d","none of the mentioned"]],"ans":"c","exp":": compareTo() method returns the int value\n-ve when comparing string is smaller than comparing string.\n+ve when comparing string is greater than comparing string.\n0 when comparing strings are equal."},{"id":951,"cat":"Core Java","topic":"Searching and Modifying a String","q":"Which of the following statement is correct?","opts":[["a","replace() method replaces all occurrences of one character in invoking string with another character"],["b","replace() method replaces only first occurrences of a character in invoking string with another character"],["c","replace() method replaces all the characters in invoking string with another character"],["d","replace() replace() method replaces last occurrence of a character in invoking string with another character"]],"ans":"a","exp":"replace() method replaces all occurrences of one character in invoking string with another character."},{"id":952,"cat":"Core Java","topic":"Searching and Modifying a String","q":"What will be the output of the following Java program?","opts":[["a","""Hello World"""],["b","""Hello World""],["c",""Hello World""],["d","Hello world"]],"ans":"c","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n           String c = \"  Hello World  \";\n           String s = c.trim();\n           System.out.println(\"\\\"\"+s+\"\\\"\");\n        }\n    }"],"exp":"trim() method is used to remove leading and trailing whitespaces in a string."},{"id":953,"cat":"Core Java","topic":"Searching and Modifying a String","q":"What will be the output of the following Java program?","opts":[["a","one"],["b","two"],["c","one ndexOf('l');\n             System.out.print(i + \" \" + j);\n\n        }\n   }"],"exp":"indexOf() method returns the index of first occurrence of the character where as lastIndexOf() returns the index of last occurrence of the character."},{"id":957,"cat":"Core Java","topic":"Serialization & Deserialization","q":"Which of these is a process of extracting/removing the state of an object from a stream?","opts":[["a","Serialization"],["b","Externalization"],["c","File Filtering"],["d","Deserialization"]],"ans":"d","exp":"Deserialization is a process by which the data written in the stream can be extracted out from the stream."},{"id":958,"cat":"Core Java","topic":"Serialization & Deserialization","q":"Which of these process occur automatically by java run time system?","opts":[["a","Serialization"],["b","Memory allocation"],["c","Deserialization"],["d","All of the mentioned"]],"ans":"d","exp":"Serialization, deserialization and Memory allocation occur automatically by java run time system."},{"id":959,"cat":"Core Java","topic":"Serialization & Deserialization","q":"Which of these interface extends DataInput interface?","opts":[["a","Serializable"],["b","Externalization"],["c","ObjectOutput"],["d","ObjectInput"]],"ans":"d","exp":"ObjectInput interface extends the DataInput interface and supports object serialization."},{"id":960,"cat":"Core Java","topic":"Serialization & Deserialization","q":"Which of these is a method of ObjectInput interface used to deserialize an object from a stream?","opts":[["a","int read()"],["b","void close()"],["c","Object readObject()"],["d","Object WriteObject()"]],"ans":"c"},{"id":961,"cat":"Core Java","topic":"Serialization & Deserialization","q":"Which of these class extend InputStream class?","opts":[["a","ObjectStream"],["b","ObjectInputStream"],["c","ObjectOutput"],["d","ObjectInput"]],"ans":"b","exp":"ObjectInputStream class extends the InputStream class and implements the ObjectInput interface."},{"id":962,"cat":"Core Java","topic":"S ;\n                System.exit(0);\n            }\n\t    try\n            {\n\t        int x;\n\t        FileInputStream fis = new FileInputStream(\"serial\");\n\t        ObjectInputStream ois = new ObjectInputStream(fis);\n\t        x = ois.readInt();\n\t        ois.close();\n\t        System.out.println(x);\n\t    }\n\t    catch (Exception e)\n            {\n                System.out.print(\"deserialization\");\n\t        System.exit(0);\n\t    }\n        }\n    }\n    class Myclass implements Serializable\n    {\n\tString s;\n\tint i;\n\tdouble d;\n\tMyclass(String s, int i, double d)\n        {\n\t    this.d = d;\n\t    this.i = i;\n\t    this.s = s;\n\t}\n    }"],"exp":"x = ois.readInt(); will try to read an integer value from the stream 'serial' created before, since stream contains an object of Myclass hence error will occur and it will be catched by catch printing deserialization."},{"id":964,"cat":"Core Java","topic":"Serialization & Deserialization","q":"What will be the output of the following Java program?","opts":[["a","1"],["b","2"],["c","3"],["d","0"]],"ans":"d","cod":["    import java.io.*;\n    class streams\n    {\n        public static void main(String[] args)\n        {\n            try\n            {\n\t        FileOutputStream fos = new FileOutputStream(\"serial\");\n\t        ObjectOutputStream oos = new ObjectOutputStream(fos);\n\t        oos.writeFloat(3.5);\n\t        oos.flush();\n\t        oos.close();\n\t    }\n\t    catch(Exception e)\n            {\n\t        System.out.println(\"Serialization\" + e);\n                System.exit(0);\n            }\n\t    try\n            {\n\t        FileInputStream fis = new FileInputStream(\"serial\");\n\t        ObjectInputStream ois = new ObjectInputStream(fis);\n\t        ois.close();\n\t        System.out.println(ois.available());\n\t    }\n\t    catch (Exception e)\n            {\n                System.out.print(\"deserialization\");\n\t        System.exit(0);\n\t    }\n        }\n    }"],"ex iteReadObject()"],["d","unSerializaedObject()"]],"ans":"a","exp":"writeObject() and readObject() methods should be implemented to avoid Java serialization."},{"id":984,"cat":"Core Java","topic":"Serialization - 2","q":"Which of the following methods is not used while Serialization and DeSerialization?","opts":[["a","readObject()"],["b","readExternal()"],["c","readWriteObject()"],["d","writeObject()"]],"ans":"c","exp":"Using readObject(), writeObject(), readExternal() and writeExternal() methods Serialization and DeSerialization are implemented."},{"id":985,"cat":"Core Java","topic":"Serialization - 2","q":"Serializaed object can be transferred via network.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"Serialized object can be transferred via network because Java serialized object remains in form of bytes which can be transmitted over network."},{"id":986,"cat":"Core Java","topic":"Server, Sockets & Httpd Classes","q":"Which of these interface abstractes the output of messages from httpd?","opts":[["a","LogMessage"],["b","LogResponse"],["c","Httpdserver"],["d","httpdResponse"]],"ans":"a","exp":"LogMessage is a simple interface that is used to abstract the output of messages from the httpd."},{"id":987,"cat":"Core Java","topic":"Server, Sockets & Httpd Classes","q":"Which of these class is used to create servers that listen for either local or remote client programs?","opts":[["a","httpServer"],["b","ServerSockets"],["c","MimeHeader"],["d","HttpResponse"]],"ans":"b"},{"id":988,"cat":"Core Java","topic":"Server, Sockets & Httpd Classes","q":"Which of these is a standard for communicating multimedia content over email?","opts":[["a","http"],["b","https"],["c","Mime"],["d","httpd"]],"ans":"c","exp":"MIME is an internet standard for communicating multimedia content over email. The HTTP protocol uses and extends the notion of MIME headers to pass attribute pairs between HTTP client and server."},{"id":989,"cat":"Core Java","topic":"Server, Sockets & Httpd Classes", ue if both the string are equal and false if they are unequal."},{"id":1009,"cat":"Core Java","topic":"String Comparision","q":"What will be the output of the following Java code?","opts":[["a","true"],["b","false"],["c","0"],["d","1"]],"ans":"b","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n           String c = \"Hello i love java\";\n           boolean var;\n           var = c.startsWith(\"hello\");\n           System.out.println(var);\n        }\n    }"],"exp":"startsWith() method is case sensitive "hello" and "Hello" are treated differently, hence false is stored in var."},{"id":1010,"cat":"Core Java","topic":"String Comparision","q":"What will be the output of the following Java code?","opts":[["a","true true"],["b","false false"],["c","true false"],["d","false true"]],"ans":"d","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n           String s1 = \"Hello i love java\";\n           String s2 = new String(s1);\n           System.out.println((s1 == s2) + \" \" + s1.equals(s2));\n        }\n    }"],"exp":"The == operator compares two object references to see whether they refer to the same instance, where as equals() compares the content of the two objects."},{"id":1011,"cat":"Core Java","topic":"String Comparision","q":"What will be the output of the following Java code?","opts":[["a","true true"],["b","false false"],["c","true false"],["d","false true"]],"ans":"c","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n           String s1 = \"Hello\";\n           String s2 = new String(s1);\n           String s3 = \"HELLO\";\n           System.out.println(s1.equals(s2) + \" \" + s2.equals(s3));\n        }\n    }"]},{"id":1012,"cat":"Core Java","topic":"String Comparision","q":"In the following Java code, which code fragment should be inserted at line 3 so that the output will be: "123abc 123abc"?","opts":[["a","sb1.append("abc"); s1.append("abc");"],["b","sb1.append("abc"); s1.concat("abc");"],["c","sb1.concat("abc"); s1.append("abc");"],["d","sb1.append("abc"); s1 = s1.concat("abc");"]],"ans":"d","cod":[" 1. StringBuilder sb1 = new StringBuilder(\"123\");\n 2. String s1 = \"123\";\n 3.  // insert code here\n 4. System.out.println(sb1 + \" \" + s1);"],"exp":"append() is stringbuffer method and concat is String class method.\nappend() is stringbuffer method and concat is String class method."},{"id":1013,"cat":"Core Java","topic":"String Comparision","q":"What will be the output of the following Java code?","opts":[["a","ab"],["b","bc"],["c","ca"],["d","ac"]],"ans":"d","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n             String chars[] = {\"a\", \"b\", \"c\", \"a\", \"c\"};\n             for (int i = 0; i < chars.length; ++i)\n                 for (int j = i + 1; j < chars.length; ++j)\n                     if(chars[i].compareTo(chars[j]) == 0)\n                         System.out.print(chars[j]);\n        }\n   }"],"exp":"compareTo() function returns zero when both the strings are equal, it returns a value less than zero if the invoking string is less than the other string being compared and value greater than zero when invoking string is greater than the string compared to."},{"id":1014,"cat":"Core Java","topic":"String Handling","q":"Which of these class is superclass of String and StringBuffer class?","opts":[["a","java.util"],["b","java.lang"],["c","ArrayList"],["d","None of the mentioned"]],"ans":"b","exp":"String and StringBuffer are part of the java.lang package, which means they inherit from the Object class, the root of the Java class hierarchy."},{"id":1015,"cat":"Core Java","topic":"String Handling","q":"Which of these operators can be used to concatenate two or more String objects?","opts":[["a","+"],["b","+="],["c","&"],["d","||"]],"ans":"a","exp":"Operator + is used to concatenate strings, Example String s = "i " + "like " + "java"; ion which are used to get the index of first and last occurrence of\nthe character pointed by c in the given array."},{"id":1029,"cat":"Core Java","topic":"StringBuffer Class","q":"What will be the output of the following Java program?","opts":[["a","He"],["b","Hel"],["c","lo"],["d","llo"]],"ans":"d","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n             StringBuffer c = new StringBuffer(\"Hello\");\n             c.delete(0,2);\n             System.out.println(c);\n        }\n    }"],"exp":"delete(0,2) is used to delete the characters from 0 th position to 1 st position."},{"id":1030,"cat":"Core Java","topic":"StringBuffer Class","q":"What will be the output of the following Java program?","opts":[["a","Hello"],["b","olleH"],["c","HelloolleH"],["d","olleHHello"]],"ans":"b","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n           StringBuffer s1 = new StringBuffer(\"Hello\");\n           StringBuffer s2 = s1.reverse();\n           System.out.println(s2);\n        }\n    }"],"exp":"reverse() method reverses all characters. It returns the reversed object on which it was called."},{"id":1031,"cat":"Core Java","topic":"StringBuffer Class","q":"What will be the output of the following Java program?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["    class output\n    {\n       class output\n       {\n         public static void main(String args[])\n         {\n            char c[]={'A', '1', 'b' ,' ' ,'a' , '0'};\n            for (int i = 0; i < 5; ++i)\n            {\n                   i++;\n                   if(Character.isDigit(c[i]))\n                       System.out.println(c[i]+\" is a digit\");\n                   if(Character.isWhitespace(c[i]))\n                       System.out.println(c[i]+\" is a Whitespace character\");\n                   if(Character.isUpperCase(c[i]))\n                       System.out.println(c[i]+\" is an Upper case Letter\"
