= 10;\n}\nclass B extends A\n{\n    int b = a;\n}\nclass C extends A\n{\n    int c = a;\n}\npublic class PrivateVariable\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        System.out.println(obj1.b+obj2.c);\n    }\n}"],"exp":"The "private" keyword in java is an access modifier which can be assigned to variables, methods or inner classes. In this program, the variable a of class A is declared as a private variable. Therefore, its scope is limited to the class A and cannot be inherited by classes B and C. Therefore, it throws an error."},{"id":1301,"cat":"OOP using Java","topic":"Hierarchical Inheritance","q":"What will be the output of the following Java code?","opts":[["a","50"],["b","100"],["c","Runtime Error"],["d","Compile time Error"]],"ans":"b","cod":["class A\n{\n    int a;\n    A()\n    {\n        a=50;\n    }\n}\nclass B extends A\n{\n    int b= a;\n}\nclass C extends A\n{\n    int c = a;\n}\npublic class Hierarchical15\n{\n    public static void main(String[] args)\n    {\n        B obj1 = new B();\n        C obj2 = new C();\n        System.out.println(obj1.b+obj2.c);\n    }\n}"],"exp":"As classes B and C are derived classes of base class A, they can access the variable a which is initialized in class A. Since the two classes extend class A, the constructor of class A is called first during the creation of their objects. Therefore, the value of 'a' is initialised to 50 before the values of variable 'b' and 'c' are assigned."},{"id":1302,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Class A"],["b","Class B"],["c","Class C"],["d","Class D"]],"ans":"d","cod":["class A\n{\n   public void disp()\n   {\n\tSystem.out.println(\"Class A\");\n   }\n}\nclass B extends A\n{\n   public void disp()\n   {\n\tSystem.out.println(\"Class B\");\n   }\n}\nclass C extends A\n{\n   public void disp()\n   {\n\tSystem.out.println(\"Class C\");\n   }\n}\npublic class Display extends C\n{\n   public void disp()\n   {\n\tSystem.out.println(\"Class D\");\n   }\n   public static void main(String args[])\n   {\n\tDisplay obj = new Display();\n\tobj.disp();\n   }\n}"],"exp":"The inheritance whose the derivation of a class involves more than one form of any inheritance is called hybrid inheritance. In the above block of code, there are four classes - A, B, C and Display which are involved in inheritance but as the object is created of class-type Display, the disp() function inside that class is executed."},{"id":1303,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Free 30-Day Python Certification Bootcamp is Live. Join Now!"],["b",""],["c",""],["d",""]],"ans":"a","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"1\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"2\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"3\");\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        System.out.println(\"4\");\n    }\n}\npublic class Numbers\n{\n    public static void main(String[] args)\n    {\n        Z ob1=new Z();\n        V ob2=new V();\n        ob1.A();\n        ob2.B();\n    }\n}"],"exp":"Hybrid inheritance is a combination of various types if inheritances like multiple inheritance and multilevel inheritance. A class is derived from two classes as in multiple inheritance (classes X and Y in this case). As methods A() and B() are called, 1 and 2 are printed."},{"id":1304,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"123\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"456\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"789\");\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        System.out.println(\"10\");\n    }\n}\npublic class Hybrid1\n{\n    public static void main(String[] args)\n    {\n        Y obj=new Y();\n        V obj2=new V();\n        obj.A();\n        obj2.B();\n    }\n}"],"exp":"A hybrid inheritance is a combination of more than one types of inheritance. There are four classes involved in inheritance in the above block of code. As 'obj' and 'obj2' are of classtype Y and V respectively, methods A() and B() are called and output is obtained."},{"id":1305,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Add"],["b","Subtract"],["c","Divide"],["d","Multiply"]],"ans":"a","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"Add\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"Subtract\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"Divide\");\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        System.out.println(\"Multiply\");\n    }\n}\npublic class Hybrid2\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        obj.A();\n    }\n}"],"exp":"The inheritance in which the derivation of a class involves more than one form of any inheritance is called hybrid inheritance. In the above block of code, it is a combination of single and multiple inheritance. An object 'obj' is created of classtype V which in turn is used to call a method A() which inturn prints "Add"."},{"id":1306,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Rank 1"],["b","Rank 2"],["c","Rank 3"],["d","Rank 4"]],"ans":"d","cod":["class A\n{\n    public void disp()\n    {\n\t    System.out.println(\"Rank 1\");\n    }\n}\nclass B extends A\n{\n    public void disp()\n    {\n\t    System.out.println(\"Rank 2\");\n    }\n}\nclass C extends A\n{\n    public void disp()\n    {\n\t    System.out.println(\"Rank 3\");\n    }\n}\npublic class Hybrid3 extends C\n{\n    public void disp()\n    {\n\t    System.out.println(\"Rank 4\");\n    }\n    public static void main(String args[])\n    {\n\t    Hybrid3 obj = new Hybrid3();\n\t    obj.disp();\n    }\n}"],"exp":"Hybrid inheritance is combination of two or more inheritances such as single, multiple, multilevel or hierarchical inheritances. There are multiple methods of the same function-name of disp(), but as the object 'obj' is of type Hybrid3, "Rank 4" is given as the output on execution."},{"id":1307,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"%\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"#\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"@\");\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        System.out.println(\"&\");\n    }\n}\npublic class Symbol\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        Z obj2=new Z();\n        obj.A();\n        obj2.C();\n    }\n}"],"exp":"The main class Symbol consists of a main() method which involves creation of two objects 'obj' and 'obj2' of class types V and Z respectively. Using the concept of hybrid inheritance, methods A() and C() are accessible using the two objects 'obj' and 'obj2' as mentioned in the main() method."},{"id":1308,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"Bangalore\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"Delhi\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"Kolkata\");\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        System.out.println(\"Chennai\");\n    }\n}\npublic class Cities\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        Z obj2=new Z();\n        obj.A();\n        obj2.A();\n    }\n}"],"exp":"In object oriented programming, the combination of any two or more types of inheritance is known as hybrid inheritance. Each method displays a city name when called using an object. As the method A() is called twice using different objects in the main method, the string "Bangalore" is printed twice."},{"id":1309,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"India-New Delhi\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"USA-Washington, D.C.\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"England-London\");\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        System.out.println(\"Australia-Canberra\");\n    }\n}\npublic class Capitals\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        Z obj2=new Z();\n        obj.A();\n        obj.D();\n        obj2.C();\n    }\n}"],"exp":"The above program is used to print particular strings in each function. As the four classes - X, Y, Z and V are linked to each other by inheritance, the functions can be called by using the object of the parent class. The methods are called using 'obj' and 'obj2' of classes V and Z and hence the strings are printed."},{"id":1310,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"Living\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"Humans\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"Animals\");\n    }\n}\nclass V extends Z\n{\n    public void D()\n    {\n        System.out.println(\"Dog\");\n    }\n}\npublic class Pets\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        Z obj2=new Z();\n        obj.A();\n        obj2.C();\n        obj.D();\n    }\n}"],"exp":"Output: Hybrid inheritance is performed when there is a valid combination of different types of inheritances. In the above block of code, the objects 'obj' and 'obj2' are used to call functions A(), C() and D() and as these objects are of parent classes V and Z, they can be used to call the methods."},{"id":1311,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Multilevel Inheritance"],["b","Hybrid Inheritance"],["c","Single Inheritance"],["d","Hierarchical Inheritance"]],"ans":"b","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"Hybrid Inheritance\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"Single Inheritance\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"Hierarchical Inheritance\");\n    }\n}\nclass V extends Z\n{\n    public void D()\n    {\n        System.out.println(\"Multilevel Inheritance\");\n    }\n}\npublic class Inheritance1\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        obj.A();\n    }\n}"],"exp":"When more than one type of inheritance is combined in a particular program, it is called as hybrid inheritance. The method A() belongs to class X, but as class X is indirectly inherited to class V, the object of class V ('obj' in this case) can be used to call it in the main() method."},{"id":1312,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"d","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"C\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"Python\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"C++\");\n    }\n}\nclass V extends Y, Z\n{\n    public void D()\n    {\n        System.out.println(\"Java\");\n    }\n}\npublic class Programming\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        obj.A();\n        obj.B();\n        obj.C();\n        obj.D();\n    }\n}"],"exp":"Hybrid inheritance is considered a valid combination of one or more types of inheritance in a program. In the above block of code, multiple inheritance is being implemented for class V as it extends two classes. Since Java doesn't support multiple inheritance, the compiler throws an error on execution."},{"id":1313,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class X\n{\n    public void A()\n    {\n        System.out.println(\"Superclass\");\n    }\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(\"Subclass of X\");\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(\"Subclass of X\");\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        System.out.println(\"Subclass of Y\");\n    }\n}\npublic class Superclass\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        obj.A();\n        obj.D();\n    }\n}"],"exp":"The following block of code is implemented using the concept of hybrid inheritance. Sub Class is the class that inherits properties from another class whereas\nsuper class is the class whose properties are inherited by the sub class. In the above block of code class A is the superclass and class B is the subclass."},{"id":1314,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"b","cod":["class X\n{\n        int a;\n}\nclass Y extends X\n{\n    public void B()\n    {\n        a=10;\n        System.out.println(a);\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        a=5;\n        System.out.println(a);\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        a=15;\n        System.out.println(a);\n    }\n}\npublic class Value\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        obj.B();\n        obj.D();\n    }\n}"],"exp":"Hybrid inheritance is the process of deriving a class using more than one level or more than one mode of inheritance. The object of class V is given an identifier called 'obj' and this is used to call the methods B() and D() and therefore prints the value present in those functions."},{"id":1315,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class X\n{\n    int a=2,b=5;\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(a+b);\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(a-b);\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        System.out.println(a*b);\n    }\n}\npublic class Calculation\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        Z obj2=new Z();\n        obj.B();\n        obj.D();\n        obj2.C();\n    }\n}"],"exp":"Hybrid inheritance is a type of inheritance which comprises more than one form of inheritance. In the above block of code, there are three functions B(), D() and C() which are called using the objects 'obj' and 'obj2' of classes V and Z respectively. Hence, the compilation is successful and output is given."},{"id":1316,"cat":"OOP using Java","topic":"Hybrid Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["class X\n{\n        int a=4,b=8;\n}\nclass Y extends X\n{\n    public void B()\n    {\n        System.out.println(Math.pow(a,b));\n    }\n}\nclass Z extends X\n{\n    public void C()\n    {\n        System.out.println(Math.sqrt(a));\n    }\n}\nclass V extends Y\n{\n    public void D()\n    {\n        System.out.println(Math.cbrt(b));\n    }\n}\npublic class Operations\n{\n    public static void main(String[] args)\n    {\n        V obj=new V();\n        Z obj2=new Z();\n        obj.B();\n        obj.D();\n        obj2.C();\n    }\n}"],"exp":"The inheritance in which the derivation of a class involves more than one form of any inheritance is called hybrid inheritance. The classes V and Z are used to create objects 'obj' and 'obj2', which are used inturn to call the methods B(), C() and D() whose properties are inherited by classes V and Z using the 'extends' keyword."},{"id":1317,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","30"],["c","15"],["d","Garbage Value"]],"ans":"b","cod":["class MainClass\n{\n    int x = 15;\n    class NestedClass\n    {\n        int y = 15;\n    }\n}\nclass InnerClass\n{\n    public static void main(String[] args)\n    {\n        MainClass obj1 = new MainClass();\n        MainClass.NestedClass obj2 = obj1.new NestedClass();\n        System.out.println(obj2.y + obj1.x);\n    }\n}"],"exp":"The concept of inner classes is used. The purpose of inner classes is to group classes that belong together, which makes your code more readable and maintainable. Objects obj1 and obj2 are used to access the data members of both the classes."},{"id":1318,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","30"],["c","15"],["d","Garbage Value"]],"ans":"a","cod":["class Outer\n{\n    int x = 15;\n    private class Nested\n    {\n        int y = 15;\n    }\n}\nclass Nested\n{\n    public static void main(String[] args)\n    {\n        Outer ob1 = new Outer();\n        Outer.Nested ob2 = ob1.new Nested();\n        System.out.println(ob2.y + ob1.x);\n    }\n}"],"exp":"In the above program, the concept of inner classes is used. The idea of inner classes is to group classes that belong together, which makes the code more readable and maintainable. The data members of both the classes Outer and Nested can usually be accessed by creating individual objects but as the class Nested is private, it is not possible to access the data members of that class."},{"id":1319,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","10"],["b","Compilation error"],["c","Garbage Value"],["d","-1"]],"ans":"a","cod":["class Outer\n{\n    int x = 10;\n    class Inner\n    {\n        public int ReturnMethod()\n        {\n            return x;\n        }\n    }\n}\nclass NestedClass\n{\n    public static void main(String[] args)\n    {\n        Outer obj1 = new Outer();\n        Outer.Inner obj2 = obj1.new Inner();\n        System.out.println(obj2.ReturnMethod());\n    }\n}"],"exp":"An inner class or nested class is a class declared entirely within the body of another class. By using the object of inner class, the data members of both the inner and outer classes can be accessed (given that they are accessible by virtue of their access specifier). As the variable 'x' is returned from the inner function, it is called in the main() method."},{"id":1320,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","10"],["b","Compilation error"],["c","Garbage Value"],["d","-1"]],"ans":"b","cod":["class Outer\n{\n    int x = 10;\n    class Inner\n    {\n        public int ReturnMethod()\n        {\n            return x;\n        }\n    }\n}\nclass MainCall\n{\n    public static void main(String[] args)\n    {\n        Outer obj1 = new Outer();\n        Outer.Inner obj2 = obj1.new Inner();\n        System.out.println(obj1.ReturnMethod());\n    }\n}"],"exp":"Java inner class or nested class is a class which is declared inside the class. Here, two objects obj1 and obj2 of classtypes Outer and Outer.Inner types are declared. The inner class can access the data members and members functions of the outer function using it's object but vice versa is not possible. Method ReturnMethod() inside in the Inner class can't be accessed using Outer class object."},{"id":1321,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","30"],["b","15"],["c","Compilation error"],["d","Garbage Value"]],"ans":"a","cod":["class MainClass\n{\n    int x = 15;\n    class NestedClass\n    {\n        int y = 15;\n        void print()\n        {\n            System.out.println(x+y);\n        }\n    }\n}\nclass Sum\n{\n    public static void main(String[] args)\n    {\n        MainClass obj1 = new MainClass();\n        MainClass.NestedClass obj2 = obj1.new NestedClass();\n        obj2.print();\n    }\n}"],"exp":"The concept of nested classes is used in the above program. Here, two objects obj1 and obj2 of classtypes MainClass and MainClass.NestedClass types are declared. The method print() of NestedClass is called using the object obj2 and hence is successfully executed."},{"id":1322,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","15"],["b","Compilation error"],["c","Garbage Value"],["d","30"]],"ans":"b","cod":["class Outer\n{\n    int x = 15;\n    class Inner\n    {\n        int y = 15;\n        int print()\n        {\n            return(x+y);\n        }\n    }\n}\nclass SumReturn\n{\n    public static void main(String[] args)\n    {\n        Outer obj1 = new Outer();\n        Outer.Inner obj2 = obj1.new Inner();\n        System.out.println(obj1.print());\n    }\n}"],"exp":"An inner class or nested class is a class declared entirely within the body of another class. Here, Inner class is placed inside the Outer clas, hence it is a nested class. As the Inner class can access the data members and members functions of the Outer class, the return statement works if it is called using the object of the Inner class but it is called using the outer class. Therefore an error is thrown."},{"id":1323,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","1050"],["b","1500"],["c","Compilation error"],["d","Null"]],"ans":"a","cod":["class MainClass\n{\n    int x = 15;\n    final int z=7;\n    class NestedClass\n    {\n        int y = 10;\n        int Calc()\n        {\n            return(x*y*z);\n        }\n    }\n}\nclass Product\n{\n    public static void main(String[] args)\n    {\n        MainClass obj1 = new MainClass();\n        MainClass.NestedClass obj2 = obj1.new NestedClass();\n        System.out.println(obj2.Calc());\n    }\n}"],"exp":"Inner class or nested class is a class which is declared inside the class. Here, NestedClass is declared inside the MainClass. The NestedClass method 'Calc()' is called using the object of NestedClass. Hence, the return statement is executed perfectly and a value is returned."},{"id":1324,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","1050"],["b","1500"],["c","Compilation error"],["d","200"]],"ans":"d","cod":["class MainClass\n{\n    int x=5;\n    protected int z=4;\n    class NestedClass\n    {\n        int y = 10;\n        void Calculate()\n        {\n            System.out.println(x*y*z);\n        }\n    }\n}\nclass ProductCalc\n{\n    public static void main(String[] args)\n    {\n        MainClass obj1 = new MainClass();\n        MainClass.NestedClass obj2 = obj1.new NestedClass();\n        obj2.Calculate();\n    }\n}"],"exp":"The purpose of nested classes is to group classes that belong together, which makes your code more readable and maintainable. An inner class can be private or protected. Protected access specifier allows the data members and member functions to be accessed in the classes present in the same package."},{"id":1325,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","25"],["b","10"],["c","Compilation error"],["d","150"]],"ans":"a","cod":["class Outer\n{\n    protected int x = 10;\n    class Inner\n    {\n        final int y = 15;\n    }\n}\nclass Final\n{\n    public static void main(String[] args)\n    {\n        Outer myOuter = new Outer();\n        Outer.Inner myInner = myOuter.new Inner();\n        System.out.println(myInner.y + myOuter.x);\n    }\n}"],"exp":"The concept of nested classes is used in the above program. Here, two objects myOuter and myInner of classtypes Outer and Outer.Inner types are declared. Protected access specifier allows the data members and member functions to be accessed in the classes present in the same package."},{"id":1326,"cat":"OOP using Java","topic":"Inner Class","q":"What will be the output of the following Java code?","opts":[["a","185"],["b","175"],["c","Compilation error"],["d","150"]],"ans":"b","cod":["class Outer\n{\n    int x = 10;\n    class Inner\n    {\n        int y = 15;\n        public void update()\n        {\n            y = y*11;\n        }\n    }\n}\nclass Updation\n{\n    public static void main(String[] args)\n    {\n        Outer myOuter = new Outer();\n        Outer.Inner myInner = myOuter.new Inner();\n        myInner.update();\n        System.out.println(myInner.y + myOuter.x);\n    }\n}"],"exp":"An inner class or nested class is a class declared entirely within the body of another class. The inner class Inner can access the data members and member functions of the outer class Outer in case of this program. The object myInner is used to call the update() function inside the Inner class. The value is updated and the value is printed."},{"id":1327,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","Hello World"],["b","Compilation error"],["c","Null"],["d","Hello World!"]],"ans":"d","cod":["class Function\n{\n  void Print()\n  {\n        System.out.println(\"Hello World!\");\n  }\n  public static void main(String[] args)\n  {\n        Function obj=new Function();\n        obj.Print();\n  }\n}"],"exp":"A function is a block of code which only runs when it is called. If a function is present and called in a class, it is called the member function of that particular class. In this case, Print() is a member function which is called in the main method using an object 'obj'."},{"id":1328,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","Print successful!"],["b","Compilation error"],["c","Null"],["d","Garbage Value"]],"ans":"a","cod":["class TestCase\n{\n    public static void main(String[] args)\n    {\n        Function();\n    }\n    private static void Function()\n    {\n        System.out.println(\"Print successful!\");\n    }\n}"],"exp":"Methods are declared within a class and they are used to perform certain actions defined in it. In this case, even if the member method Function() is of protection level private, it is accessible in the same class in which it is present. Hence, the method is executed successfully."},{"id":1329,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","12"],["b","8"],["c","Garbage Value"],["d","Compilation error"]],"ans":"b","cod":["class MinMax\n{\n   public static void main(String[] args)\n   {\n      int a = 12;\n      int b = 8;\n      int c = Calc(a, b);\n      System.out.println(c);\n   }\n   public static int Calc(int n1, int n2)\n   {\n      int min;\n      if (n1 > n2)\n      {\n          min = n2;\n      }\n      else\n      {\n          min = n1;\n      }\n      return min;\n   }\n}"],"exp":"A Java method is a collection of statements that are grouped together to perform an operation as mentioned by the user. In the above program, a static member function Calc() is used to find the minimum of two numbers. The function is called successfully in the main() method."},{"id":1330,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","4"],["b","Null"],["c","Compilation error"],["d","-4"]],"ans":"a","cod":["class SubtractionofNum\n{\n    public static void main(String[] args)\n    {\n        Prog1 obj=new Prog1();\n        obj.callSub();\n    }\n    public void callSub()\n    {\n        int theSum = sub(7, 3);\n        System.out.print(theSum);\n    }\n\n    public int sub(int value1, int value2)\n    {\n        return (value1 - value2);\n    }\n}"],"exp":"A Java method is a collection of statements that are grouped together to perform an operation as mentioned by the user. In the above program, a member function sub() is called within another method callSub(). Since both are present in the same class, it is possible to perform this operation."},{"id":1331,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","9000"],["b","8000"],["c","10000"],["d","1000"]],"ans":"a","cod":["class Depreciation\n{\n    public static void main(String arg[])\n    {\n        int amount, dep, year;\n        System.out.println(Depreciation.Calc(10000, 10, 1));\n    }\n    static int Calc(int amount, int dep, int year )\n    {\n        for(int i=0;i<year;i++)\n        {\n            amount=((100-dep)*amount)/100;\n        }\n        return amount;\n    }\n}"],"exp":"A method is a block of code which only runs when it is called. In the above program, the value is passed in the main() method to the Calc() function which returns a value."},{"id":1332,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","75"],["b","150"],["c","Garbage Value"],["d","Compilation error"]],"ans":"d","cod":["class Triangle\n{\n   public static void main(String args[])\n   {\n       Triangle obj=new Triangle();\n       obj.Area(10, 15.0);\n   }\n   void Area(int b,int h)\n   {\n      double area=(b*h)/2;\n      System.out.println(area);\n   }\n}"],"exp":"A function is a set of statements that take inputs, do some specific computation and produces output. In this case, method Area() is a member function of class Triangle. Since the value of 'h' is given as a double in the function call, an error is thrown."},{"id":1333,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","25"],["b","0"],["c","12"],["d","Compilation error"]],"ans":"a","cod":["class TriangleArea extends Square\n{\n   void Area(int b, int h)\n   {\n        double area=(b*h)/2;\n        System.out.println(area);\n   }\n   public static void main(String args[])\n   {\n        TriangleArea obj=new TriangleArea();\n        obj.Area(5);\n   }\n}\nclass Square\n{\n   void Area(int l)\n   {\n        System.out.println(l*l);\n   }\n}"],"exp":"In the above program, the concept of function overloading is used. As there are two methods of same name 'Area', the compiler differentiates between them using the number and the type of arguements that are passed to the function. As there is only one parameter in the function call, the compiler executes the Area() method inside the Square class."},{"id":1334,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","60"],["b","30"],["c","200"],["d","Compilation error"]],"ans":"a","cod":["class Perimeter\n{\n    static double area(double l, double b)\n    {\n        double a=2*(l+b);\n        return a;\n    }\n    public static void main(String args[])\n    {\n        System.out.println(Perimeter.area(10, 20));\n    }\n}"],"exp":"A method is a block of code which only runs when it is called. A member function is a part of the current class in which the execution is taking place. In this case, area() is a static method and hence the function can be called without an object."},{"id":1335,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","212"],["b","37.777"],["c","100"],["d","Compilation error"]],"ans":"b","cod":["class Conversion\n{\n    double celsius(double f)\n    {\n        return (f-32)*5/9;\n    }\n    public static void main(String args[])\n    {\n\tConversion obj=new Conversion();\n\tdouble result=obj.celsius(100);\n\tSystem.out.println(result);\n    }\n}"],"exp":"A Java method is a collection of statements that are grouped together to perform an operation. The above program is used to convert Fahrenheit to Celsius. As celsius() method is a part of class Conversion, it is called in the main() method using the object created."},{"id":1336,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","3"],["b","2"],["c","6"],["d","10"]],"ans":"b","cod":["class HCF\n{\n    void Prime()\n    {\n   \tint n1=10;\n   \tint n2=6;\n\tint temp;\n   \twhile (n2 != 0)\n   \t{\n   \t    temp = n2;\n   \t    n2 = n1% n2;\n   \t    n1 = temp;\n   \t}\n\tSystem.out.println(n1);\n    }\n    public static void main(String args[])\n    {\n        HCF obj=new HCF();\n        obj.Prime();\n    }\n}"],"exp":"Methods are defined as blocks of code which is used to maintain reusability and perform various operations. In this case, prime() method is called in the main() method using the object of class type HCF and hence execution takes place without any error and the highest common factor is printed."},{"id":1337,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","1"],["b","3600"],["c","360"],["d","Compilation error"]],"ans":"b","cod":["class Time\n{\n    int sec;\n    void seconds(int m)\n    {\n        sec=m*60;\n        System.out.println(sec);\n    }\n    public static void main(String[] args)\n    {\n        int min=60;\n        Time obj=new Time();\n        obj.seconds(min);\n    }\n}"],"exp":"A function is a block of code that performs a specific task. Method seconds() is used to convert minutes into seconds. It is called in the main() method using the object 'obj' of class Time."},{"id":1338,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a",""],["b",""],["c","Done"],["d","Compilation error"]],"ans":"d","cod":["class Loop\n{\n    void loop()\n    {\n        for(int i = 0;i!=0;i++);\n        {\n            System.out.println(\"Hello\");\n            break;\n        }\n        System.out.println(\"Done\");\n    }\n    public static void main(String[] args)\n    {\n        Method obj=new Method();\n        obj.loop();\n    }\n}"],"exp":"Methods are declared within a class and they are used to perform certain actions defined by the user. The object 'obj' is created but inside the loop() function, the for loop has a semi colon next to it which leads to an error as the value of 'i' would not be valid inside the braces."},{"id":1339,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","15"],["b","14"],["c","Compilation error"],["d","0"]],"ans":"a","cod":["class Sum\n{\n    static int sum(int num)\n    {\n        int sum=0;\n        while(num!=0)\n        {\n            sum=sum + (num%10);\n            num=num/10;\n        }\n        return sum;\n    }\n    public static void main(String arg[])\n    {\n        System.out.println(sum(195));\n    }\n}"],"exp":"A method is a block of code or collection of statements or a set of code grouped together to perform a certain task or operation. In the above program, the static function sum() is used to find the sum of digits in a given number. Since the method is static, there is no need to create an object."},{"id":1340,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","44"],["b","44.0"],["c","484"],["d","Compilation error"]],"ans":"b","cod":["class Circle\n{\n    public static void main(String args[])\n    {\n        System.out.println(Circle.circum(7));\n    }\n    public static double circum(double r)\n    {\n        double  a=(22*2*r)/7;\n        return a;\n    }\n}"],"exp":"A Java method is a collection of statements that are grouped together to perform an operation as mentioned by the user. The above code consists of a static function circum() which returns a double value. Since it is a double value, there should be a value after the decimal place."},{"id":1341,"cat":"OOP using Java","topic":"Member Functions","q":"What is the output of the following Java code?","opts":[["a","110"],["b","111"],["c","001"],["d","Compilation error"]],"ans":"a","cod":["class LeapYear\n{\n    static int flag=0;\n    public static void main(String arg[])\n    {\n        System.out.print(leap(2004));\n        System.out.print(leap(2000));\n        System.out.print(leap(1900));\n    }\n    static int leap(int year)\n    {\n        if(year!=0)\n        {\n            if(year%400==0)\n            {\n                flag=1;\n            }\n            else if(year%100==0)\n            {\n                flag=0;\n            }\n            else if(year%4==0)\n            {\n                flag=1;\n            }\n            else\n            {\n                flag=0;\n            }\n        }\n        return flag;\n\n    }\n}"],"exp":"A method is basically a set of code which is referred to by name and can be called or invoked at any point in a program. In this case, a static method leap() returns an integer flag to check whether the given year is leap or not. As 'flag' is a static variable, it can be accessed inside both the main() and leap() methods and execution will be done successfully. It displays 1 for a leap year and 0 for a non-leap year."},{"id":1342,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","a"],["c","f"],["d","n"]],"ans":"d","cod":["public class Sanfoundry\n{\n    public static void main(String[] args)\n    {\n        String s = new String(\"Sanfoundry\");\n        System.out.println(s.charAt(2));\n    }\n}"],"exp":"The new keyword is used to allot memory to the string object s. The function charAt returns the character at the specified index, and as indexing starts from 0, the index 2 corresponds to the third position."},{"id":1343,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","3"],["b","2"],["c","7"],["d","6"]],"ans":"b","cod":["public class Java\n{\n    void print(String s)\n    {\n        System.out.println(s.indexOf('n'));\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        String s = new String(\"Sanfoundry\");\n        a.print(s);\n    }\n}"],"exp":"The new keyword is used to allot memory to the string object s and the object a. The indexOf function returns the index of the character specified in the string."},{"id":1344,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","8"],["b","9"],["c","-1"],["d","Compilation Error"]],"ans":"c","cod":["public class Main\n{\n    String s = new String(\"Memory Allocation\");\n    void position()\n    {\n        System.out.println(s.indexOf('l'));\n    }\n    void replace()\n    {\n        s=s.replace(\"l\", \"L\");\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        a.replace();\n        a.position();\n    }\n}"],"exp":"The new keyword is used to allocate memory to the objects. The replace function replaces all the occurences of the string passed to the function with the other string passed to the function, hence changing all 'l's to 'L's."},{"id":1345,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","3"],["b","7"],["c","6"],["d","-1"]],"ans":"c","cod":["public class Memory\n{\n    String s = new String(\"Sanfoundry\");\n    void position()\n    {\n        System.out.println(s.indexOf('n'));\n    }\n    void replace()\n    {\n        s=s.replaceFirst(\"n\", \"N\");\n    }\n    public static void main(String[] args)\n    {\n        Memory a = new Memory();\n        a.replace();\n        a.position();\n    }\n}"],"exp":"The new keyword is used to allocate memory to the objects created. The replaceFirst function replaces the first instance of the first substring passed to it with the second substring passed to the function."},{"id":1346,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","Compilation Error"],["c","200"],["d","Runtime Error"]],"ans":"c","cod":["public class Malloc\n{\n    Integer h = new Integer(0);\n    Integer b = new Integer(0);\n    void Area()\n    {\n        System.out.println(h*b);\n    }\n    public static void main(String[] args)\n    {\n        Malloc a = new Malloc();\n        a.h=10;\n        a.b=20;\n        a.Area();\n    }\n}"],"exp":"The new keyword is used to allocate memory to the objects created. The Integer objects h and b are given initial values 0, which are then changed in the main function."},{"id":1347,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","20"],["b","30"],["c","80"],["d","120"]],"ans":"c","cod":["public class Java\n{\n    public static void main(String[] args)\n    {\n        Integer i = new Integer(10);\n        Integer j = new Integer(3);\n        System.out.println(i<<j);\n    }\n}"],"exp":"The new keyword is used to allocate memory to the objects created. The left shift operator shifts the bits of the number to the left followed by 0s at the end. It is equivalent to multiplying the number by 2n where n is the number to the right of the shift operator."},{"id":1348,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"a","cod":["public class Memory\n{\n    public static void main(String[] args)\n    {\n        Integer i = new Integer(10);\n        String s = new String(\"Sanfoundry\");\n        System.out.println(i.getClass().getSuperclass());\n        System.out.println(s.getClass().getSuperclass());\n    }\n}"],"exp":"The new keyword is used to allocate memory to the integer and string objects. Integer is a subclass of the Number class of the lang package, and String is a subclass of the Object class of the lang package."},{"id":1349,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","99"],["b","Compilation Error"],["c","67"],["d","Runtime Error"]],"ans":"a","cod":["public class Ascii\n{\n    public static void main(String[] args)\n    {\n        Character ch = new Character('c');\n        System.out.println((int)ch);\n    }\n}"],"exp":"The new keyword is used to assign memory to the character object ch. When a character is converted to an integer, it is converted based on it's ascii value. The ascii value of 'c' is 99 and that of 'C' 67."},{"id":1350,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","[90, 20, 70, 30, 50]"],["b","[90, 30, 20, 50, 70]"],["c","[70, 30, 20, 50, 90]"],["d","Random order"]],"ans":"d","cod":["import java.util.*;\npublic class list\n{\n    public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        l.add(20);\n        l.add(30);\n        l.add(50);\n        l.add(70);\n        l.add(90);\n        Collections.shuffle(l);\n        System.out.println(l);\n    }\n}"],"exp":"The new keyword is used to allot memory to the linked list l. The shuffle function of the Collections class is used to shuffle the order of the elements of the linked list passed to it as a parameter."},{"id":1351,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","[28, 41, 4, 3]"],["b","[28, 41, 3, 10]"],["c","[28, 41, 4, 10]"],["d","Compilation Error"]],"ans":"a","cod":["import java.util.*;\npublic class lists\n{\n    public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        l.add(28);\n        l.add(41);\n        l.add(4);\n        l.add(3);\n        l.add(10);\n        l.remove(4);\n        System.out.println(l);\n    }\n}"],"exp":"The new keyword is used to allot memory to the linked list l. THe remove function of the linked list is used to remove the element at the index specified in the value passed to the function, and as indexing starts at 0, 4th index corresponds to the 5th position."},{"id":1352,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","E"],["b","e"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"d","cod":["public class Char\n{\n    public static void main(String args[])\n    {\n        Integer i = new Integer(69);\n        System.out.println((char)i);\n    }\n}"],"exp":"The new keyword allots memory to the integer object i. As i is an integer object, it cannot be converted to a character."},{"id":1353,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a","true"],["b","Compilation Error"],["c","false"],["d","Runtime Error"]],"ans":"c","cod":["public class Sanfoundry\n{\n    public static void main(String args[])\n    {\n        String s = \"Sanfoundry\";\n        String t = new String(\"Sanfoundry\");\n        System.out.println(s==t);\n    }\n}"],"exp":"The '==' operator checks if the reference is the same when comparing two objects. As the new keyword is used to make object t, it is allotted a different memory location, hence they aren't equal."},{"id":1354,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["public class Empty\n{\n    public static void main(String args[])\n    {\n        String s = new String(\"  \");\n        System.out.println(s.isEmpty());\n        System.out.println(s.trim().isEmpty());\n    }\n}"],"exp":"The new keyword allots memory to the string object s with an initial value of " ". The trim function removes spaces at the start and end of the string. As this string has only spaces, it removes all of them. The isEmpty function checks if the string is empty or not."},{"id":1355,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"a","cod":["public class Objects\n{\n    public static void main(String args[])\n    {\n        Objects a = new Objects();\n        Objects b = a;\n        Objects c = new Objects();\n        System.out.println(a);\n        System.out.println(b);\n        System.out.println(c);\n    }\n}"],"exp":"The objects a and b refer to the same reference as a is assigned to b. The objects a and c refer to two different memory locations as they both are created using the new keyword which assigns them separate memory locations."},{"id":1356,"cat":"OOP using Java","topic":"Memory Allocation","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c","Compilation Error"],["d",""]],"ans":"a","cod":["public class MemAlloc\n{\n    public static void main(String args[])\n    {\n        int a[]= new int[]{1, 2, 3, 4, 5};\n        for(int i=1;i<=a.length;i++)\n        {\n            if(i%2==0)\n            {\n                System.out.println(a[i-1]);\n            }\n        }\n    }\n}"],"exp":"The new keyword allots memory to the integer array a. The for loop checks for even values of i and prints the elements at that position. As indexing starts at 0, the ith position is the (i-1)th index of that array."},{"id":1357,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","10"],["b","11"],["c","Compilation Error"],["d","Null"]],"ans":"c","cod":["class Calc\n{\n    public int disp()\n    {\n        return 10;\n    }\n    public long disp()\n    {\n        return 11;\n    }\n    public static void main(String[] args)\n    {\n        Calc obj = new Calc();\n        System.out.println(obj.disp());\n    }\n}"],"exp":"In the above program, there are two functions disp() with the same function signature and function prototype. Since there is no difference between the two function signatures, the compiler is not able to implement the concept of function or method overloading and thereby a compilation error is thrown."},{"id":1358,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","10"],["b","11"],["c","Compilation Error"],["d","Null"]],"ans":"b","cod":["class Calc1\n{\n    public int disp()\n    {\n        return 10;\n    }\n    public long disp(int a)\n    {\n        return 11;\n    }\n    public static void main(String[] args)\n    {\n        Calc obj = new Calc();\n        System.out.println(obj.disp(11));\n    }\n}"],"exp":"The above block of code uses the concept of method overloading. Two or more methods can have same name inside the same class if they accept different arguments. In this case, as function disp() occurs twice with different parameters, the program is executed successfully and returns 11 as mentioned in the function body."},{"id":1359,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","5"],["b","4"],["c","Compilation Error"],["d","1 4"]],"ans":"a","cod":["class Display\n{\n    private static void display(int a)\n    {\n        System.out.println(a);\n    }\n    private static void display(int a, int b)\n    {\n        System.out.println(a +\" \"+ b);\n    }\n    public static void main(String[] args)\n    {\n        display(5);\n    }\n}"],"exp":"When a class has multiple methods by same name but consists of different parameters, it is known as function overloading. In the above program, there are two display() functions which have different function signatures. As the function with two parameters in called in the main() method, the value 5 is printed."},{"id":1360,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","1.0 4.0"],["b","1 4.0"],["c","Compilation Error"],["d","1 4"]],"ans":"b","cod":["class Float\n{\n    static void display(int a, float b)\n    {\n        System.out.println(a +\" \"+ b);\n    }\n    public static void main(String[] args)\n    {\n        display(1, 4);\n    }\n}"],"exp":"Overloaded methods are differentiated based on the number and type of the parameters passed as arguments to the function when method overloading is used in a program. In this case, the integer value 4 is converted to float value 4.0 automatically by the compiler as there is no loss of precision mathematically and the program is executed."},{"id":1361,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","string"],["b","int"],["c","Compilation Error"],["d","Hello"]],"ans":"b","cod":["class PrintValue\n{\n    private static void display(int a)\n    {\n        System.out.println(\"string\");\n    }\n    private static void display(String a)\n    {\n        System.out.println(\"int\");\n    }\n    public static void main(String[] args)\n    {\n        display(\"Hello\");\n    }\n}"],"exp":"Method overloading or function overloading is a feature of object oriented programming where polymorphism is implemented. In the above program, there are two display() functions which have different function signatures but have the same number of parameters. Since a string is passed in the main() method, the method with string arguments is executed."},{"id":1362,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","int"],["c","string"],["d","Compilation error"]],"ans":"d","cod":["class DataType\n{\n    static void print(int a)\n    {\n        System.out.println(\"string\");\n    }\n    static void print(String a, int c)\n    {\n        System.out.println(\"int\");\n    }\n    public static void main(String[] args)\n    {\n        print(\"0\");\n    }\n}"],"exp":"If the argument lists of both the given functions are different in terms of number of parameters and their types, the polymorphism aspect of object oriented programming is invoked. This phenomenon is called method or function overloading. In this case, the main() method calls a single string value but there is no function print() with exatly one string value, hence an error is thrown."},{"id":1363,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","int"],["c","string"],["d","compilation error"]],"ans":"b","cod":["class StringandInteger\n{\n    static void print(int a)\n    {\n        System.out.println(\"string\");\n    }\n    static void print(String a, int c)\n    {\n        System.out.println(\"int\");\n    }\n    public static void main(String[] args)\n    {\n        print(\"0\",5);\n    }\n}"],"exp":"Multiple methods can have same name inside the same class in a program if they accept different arguments in terms of their datatype or the number of arguments. This feature is known as method overloading. In this case, the main() method calls the second print() function with two arguments."},{"id":1364,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","int"],["c","string"],["d","compilation error"]],"ans":"d","cod":["class StringandInteger2\n{\n    static void print(int a)\n    {\n        System.out.println(\"string\");\n    }\n    static void print(String a, int c)\n    {\n        System.out.println(\"int\");\n    }\n    public static void main(String[] args)\n    {\n        print(150,\"int\");\n    }\n}"],"exp":"Method overloading is a concept in Java that allows to have many functions with same name but different parameters. The order of datatype also matters. In this case, an integer and string are passed, but even though the second print() function contains the same datatypes, they are not in the same order. Hence, an error is thrown."},{"id":1365,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","15.5"],["b","20.0"],["c","20"],["d","Compilation Error"]],"ans":"b","cod":["class Sum\n{\n    static void calc(int a)\n    {\n        System.out.println(a+a);\n    }\n    static void print(double a, int c)\n    {\n        System.out.println(a+c);\n    }\n    public static void main(String[] args)\n    {\n        print(15.0,5);\n    }\n}"],"exp":"If the data types are compatible, then Java will perform the conversion automatically known as Automatic Type Conversion. In this case, since the main() method calls the second print() function, the integer is directly converted to double datatype by the compiler and does the arithmetic after that."},{"id":1366,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","15.5"],["b","20.0"],["c","20"],["d","Compilation Error"]],"ans":"d","cod":["class Sum2\n{\n    static void print(int a)\n    {\n        System.out.println(a+a);\n    }\n    static void print(float a, int c)\n    {\n        System.out.println(a+c);\n    }\n    public static void main(String[] args)\n    {\n        print(15.0,5);\n    }\n}"],"exp":"In the above program, the concept of function or method overloading is used. As there are two parameters used to call the function the main() method, the second function apparently seems to be executed but that's not the case because the value of 15.0 is read as a double datatype and not float. Hence an error is thrown by the compiler."},{"id":1367,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","15.5"],["b","20.0"],["c","20"],["d","Compilation Error"]],"ans":"d","cod":["class FloatAdd\n{\n    static void print(float a, double b)\n    {\n        System.out.println(a+a);\n    }\n    static void print(float a, float c)\n    {\n        System.out.println(a+c);\n    }\n    public static void main(String[] args)\n    {\n        print(15.0,5.0);\n    }\n}"],"exp":"Method overloading or function overloading is a feature of object oriented programming where polymorphism is implemented. In the above program, there are two print() functions and none of them are executed due to mismatch of datatypes in the main() method."},{"id":1368,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","30.0"],["b","20.0"],["c","20"],["d","Compilation Error"]],"ans":"a","cod":["class FloatAdd2\n{\n    static void calc(float a, double b)\n    {\n        System.out.println(a+a);\n    }\n    static void calc(float a,float c)\n    {\n        System.out.println(a+c);\n    }\n    public static void main(String[] args)\n    {\n        calc(15.0f,5.0);\n    }\n}"],"exp":"Multiple methods can have same name inside the same class in a program if they accept different arguments in terms of their datatype or the number of arguments. This feature is known as method overloading. The function calc() in this case is called in the main() method and is successfully executed."},{"id":1369,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","30.0"],["b","20.0"],["c","25.0"],["d","Compilation Error"]],"ans":"c","cod":["class PointAdd\n{\n    static void calc(float a, double b)\n    {\n        System.out.println(a+a);\n    }\n    static void calc(float a,int c)\n    {\n        System.out.println(a+c);\n    }\n    public static void main(String[] args)\n    {\n        calc(15.0f, 10);\n    }\n}"],"exp":"Method overloading is a concept in Java that allows to have many functions with same name but different parameters. The order of datatype also matters. Here, the float and integer values, 15.0f and 10 are passed to the calc() function. Hence, 25.0 is attained as the output."},{"id":1370,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","30.0"],["b","20.0"],["c","16.0"],["d","Compilation Error"]],"ans":"c","cod":["class Calculations\n{\n    static float calc(float a, double b)\n    {\n        return(a+a);\n    }\n    static float calc(float a,int c)\n    {\n        return(a+c);\n    }\n    public static void main(String[] args)\n    {\n        System.out.println(calc(15.0f,1));\n    }\n}"],"exp":"Method overloading is a feature of object oriented programming which allows multiple functions to have the same number but should be distinguishable by their signature and prototype. The two calc() funtions have different datatypes as parameters, hence the second function is called in the main() method and is executed."},{"id":1371,"cat":"OOP using Java","topic":"Method Overloading","q":"What will be the output of the following Java code?","opts":[["a","15"],["b","0"],["c","16"],["d","Compilation Error"]],"ans":"a","cod":["class Calculation2\n{\n    static float calc(float a, double b)\n    {\n        return(a*b);\n    }\n    static int calc(int a,int c)\n    {\n        return(a+c);\n    }\n    public static void main(String[] args)\n    {\n        System.out.println(calc(15,0));\n    }\n}"],"exp":"When a class consists of multiple methods by same name but having different parameters, it is known as method overloading. Since 15 and 0 are integer datatypes, the compiler executes the second calc() function and prints their arithmetic sum."},{"id":1372,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Base"],["b","Compilation Error"],["c","Derived"],["d","Runtime Error"]],"ans":"c","cod":["class Base\n{\n    public void show()\n    {\n       System.out.println(\"Base\");\n    }\n}\nclass Derived extends Base\n{\n    public void show()\n    {\n       System.out.println(\"Derived\");\n    }\n}\npublic class Overriding\n{\n    public static void main(String[] args)\n    {\n        Base i = new Derived();\n        i.show();\n    }\n}"],"exp":"Here, the method show() is being overridden by the classes Derived and Base. Method overriding allows a child class to have it's own implementation of a method provided by the parent class, hence Derived is printed."},{"id":1373,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","3"],["b","1"],["c","4"],["d","2"]],"ans":"c","cod":["class Base\n{\n    public void show(int a)\n    {\n       System.out.println(\"1\");\n    }\n    public void show(double a)\n    {\n       System.out.println(\"2\");\n    }\n}\nclass Derived extends Base\n{\n    public void show(int a)\n    {\n       System.out.println(\"3\");\n    }\n    public void show(double a)\n    {\n       System.out.println(\"4\");\n    }\n}\npublic class Override\n{\n    public static void main(String[] args)\n    {\n        Base i = new Derived();\n        i.show(10.0);\n    }\n}"],"exp":"Here the method show() is being overridden and overloaded simultaneously. Method overriding allows a child class to have it's own implementation of a method provided by the parent class, and since a double value is passed, 4 is printed."},{"id":1374,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","Main@2a139a55"],["c","Obj"],["d","Runtime Error"]],"ans":"c","cod":["public class Main\n{\n    public String toString()\n    {\n        return \"Obj\";\n    }\n    public static void main(String[] args)\n    {\n        System.out.println(new Main());\n    }\n}"],"exp":"Here, the default toString() method of the Object class, which returns the object in as a string in the format ClassName@HashCode, is being overridden by the toString() method of the Main class, and returns Obj."},{"id":1375,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","Main@2a139a55"],["c","Obj"],["d","Runtime Error"]],"ans":"a","cod":["public class A\n{\n    public void toString()\n    {\n        System.out.println(\"Obj\");\n    }\n    public static void main(String[] args)\n    {\n        A a = new A();\n        a.toString();\n    }\n}"],"exp":"Here, the default toString() method of the Object class, which returns the object in as a string in the format ClassName@HashCode, is being overridden by the toString() method of the Main class which doesn't return any string, and hence leads to a compilation error due to incompatible datatypes."},{"id":1376,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","B"],["b","C"],["c","Runtime error"],["d","Compilation error"]],"ans":"d","cod":["class B\n{\n    protected final void Display()\n    {\n        System.out.println(\"B\");\n    }\n}\npublic class C extends B\n{\n    protected final void Display()\n    {\n        System.out.println(\"C\");\n    }\n    public static void main(String[] args)\n    {\n        B obj = new B();\n        obj.Display();\n    }\n}"],"exp":"Here, the function Display() of the classes B and C are being overridden. This leads to a compilation error as the function is a final function, and final functions cannot be overridden."},{"id":1377,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Base Class"],["b","Derived Class"],["c","Runtime error"],["d","Compilation error"]],"ans":"d","cod":["class Derived1\n{\n    public int print()\n    {\n        System.out.println(\"Derived class\");\n        return 0;\n    }\n}\npublic class Base1 extends Derived1\n{\n    public void print()\n    {\n        System.out.println(\"Base class\");\n    }\n    public static void main(String[] args)\n    {\n        Derived1 obj = new Derived1();\n        obj.print();\n    }\n}"],"exp":"Here, the function print() of the classes Base1 and Derived1 are being overridden. This leads to a compilation error as the functions do not have the same function signature in both cases, one of them returns an integer, while the other doesn't return anything."},{"id":1378,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Base Class"],["b","Derived Class"],["c","Runtime error"],["d","Compilation error"]],"ans":"d","cod":["class Derived\n{\n    public void print()\n    {\n        System.out.println(\"Derived class\");\n    }\n}\npublic class Over extends Derived\n{\n    protected void print()\n    {\n        System.out.println(\"Base class\");\n    }\n    public static void main(String[] args)\n    {\n        Derived obj = new Over();\n        obj.print();\n    }\n}"],"exp":"Here, the function print of the classes Derived and Over are being overridden. This leads to a compilation error because the method which is overriding the print method has a more restricted access specifier than the overridden function."},{"id":1379,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Base Class"],["b","Derived Class"],["c","Runtime error"],["d","Compilation error"]],"ans":"a","cod":["class Derived\n{\n    protected void print()\n    {\n        System.out.println(\"Derived class\");\n    }\n}\npublic class Override1 extends Derived\n{\n    public void print()\n    {\n        System.out.println(\"Base class\");\n    }\n    public static void main(String[] args)\n    {\n        Derived obj = new Override1();\n        obj.print();\n    }\n}"],"exp":"Here the function print() of the classes Derived and Override1 are being overridden. As the method being overridden has a more restricted access specifier compared to that of the method overriding it, it executes without any problem and prints "Base Class"."},{"id":1380,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Base ClassDerived Class"],["b","Derived ClassBase Class"],["c","Runtime error"],["d","Compilation error"]],"ans":"a","cod":["class Derived\n{\n    public void display()\n    {\n        System.out.print(\"Derived class\");\n    }\n}\npublic class OverRiding extends Derived\n{\n    public void display()\n    {\n        System.out.print(\"Base class\");\n        super.display();\n    }\n    public static void main(String[] args)\n    {\n        Derived obj = new OverRiding();\n        obj.display();\n    }\n}"],"exp":"Here the function display() of the classes Derived and OverRiding are being overridden. Here the method display() of the OverRiding class is calling super.display() after printing Base Class, hence the display() function of the Derived class is also called."},{"id":1381,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Exception"],["b","IOE"],["c","Runtime error"],["d","Compilation error"]],"ans":"d","cod":["import java.io.IOException;\n\nclass Derived\n{\n    public void print() throws IOException\n    {\n        System.out.println(\"IOE\");\n    }\n}\npublic class Exceptions extends Derived\n{\n    public void print() throws Exception\n    {\n        System.out.println(\"Exception\");\n    }\n    public static void main(String[] args) throws IOException\n    {\n        Derived obj = new Exceptions();\n        obj.print();\n    }\n}"],"exp":"Here, the method print of the classes Exceptions and Derived are being overridden. The print function of the class Exceptions throws Exception, which is a broader exception and different from IOException, hence leads to a compilation error."},{"id":1382,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Sanfoundry"],["b","foundrySan"],["c","San"],["d","Compilation Error"]],"ans":"a","cod":["class Base\n{\n    public void display()\n    {\n        String s = \"San\";\n        System.out.print(s);\n\n    }\n}\nclass Derived extends Base\n{\n    public void display()\n    {\n        String s = \"foundry\";\n        super.display();\n        System.out.print(s);\n    }\n}\npublic class Display\n{\n    public static void main(String[] args)\n    {\n        Base i = new Derived();\n        i.display();\n    }\n}"],"exp":"The function display() of the class Base is extended in this program. The method of the class Derived is called first, which in-turn calls the method of Base, hence Sanfoundry is printed."},{"id":1383,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","A"],["b","V"],["c","n"],["d","f"]],"ans":"b","cod":["class Base\n{\n    public void position()\n    {\n        String s = \"Sanfoundry\";\n        System.out.println(s.charAt(3));\n    }\n}\nclass Derived extends Base\n{\n    public void position()\n    {\n        String s = \"JAVA\";\n        System.out.print(s.charAt(2));\n    }\n}\npublic class Position\n{\n    public static void main(String[] args)\n    {\n        Base i = new Derived();\n        i.position();\n    }\n}"],"exp":"The position() function of the Base and Derived classes are being overridden in this program. Here, the position method of the Derived class overrides the other method and is hence executed first, thus printing the character at the third position(2nd index) of the string "JAVA", which is 'V'."},{"id":1384,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","this"],["b","Derived"],["c","Base@2a139a55"],["d","Derived@2a139a55"]],"ans":"d","cod":["class Base\n{\n    public void show()\n    {\n        System.out.println(this);\n    }\n}\nclass Derived extends Base\n{\n    public void show()\n    {\n        System.out.println(this);\n    }\n}\npublic class PrintObject\n{\n    public static void main(String[] args)\n    {\n        Base i = new Derived();\n        i.show();\n    }\n}"],"exp":"Here the method show of the classes Derived and Base are being overridden. The show method of the Derived class overrides the method of the base class, and hence it is executed upon call. The object calling it is printed, in the form ClassName@HashCode."},{"id":1385,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","Sanfoundry"],["b","foundrySan"],["c","San"],["d","Compilation Error"]],"ans":"c","cod":["class Base\n{\n    public void display()\n    {\n        String s = \"San\";\n        System.out.print(s);\n    }\n}\nclass Derived extends Base\n{\n    public void display()\n    {\n        String s = \"foundry\";\n        System.out.print(s);\n        super.show();\n    }\n}\npublic class Print\n{\n    public static void main(String[] args)\n    {\n        Base i = new Base();\n        i.display();\n    }\n}"],"exp":"The functions display of the classes Base and Derived are being overridden in this program. Here, althought the display method of the Derived class is overriding the display method of the base class, the object i is an object of the class Base, hence it calls the display method of the Base class, and thus prints "San"."},{"id":1386,"cat":"OOP using Java","topic":"Method Overriding","q":"What will be the output of the following Java code?","opts":[["a","A"],["b","B"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"d","cod":["class Base\n{\n    private void show()\n    {\n        System.out.println(\"A\");\n    }\n}\nclass Derived extends Base\n{\n    private void show()\n    {\n        System.out.println(\"B\");\n    }\n}\npublic class Private\n{\n    public static void main(String[] args)\n    {\n        Base i = new Derived();\n        i.show();\n    }\n}"],"exp":"Here the methods show() of the classes Base and Derived are being overridden. This leads to a compilation error as the methods have a private access specifier, and hence cannot override each other as they belong to different classes."},{"id":1387,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","A"],["b","B"],["c","C"],["d","Compilation Error"]],"ans":"c","cod":["class A\n{\n    public void Print()\n    {\n        System.out.println(\"A\");\n    }\n}\nclass B extends A\n{\n    public void Print()\n    {\n        System.out.println(\"B\");\n    }\n}\nclass C extends B\n{\n    public void Print()\n    {\n        System.out.println(\"C\");\n    }\n}\npublic class Multilevel\n{\n    public static void main(String[] args)\n    {\n        B c = new C();\n        c.Print();\n    }\n}"],"exp":"The object 'c' is an object of the class C. Class C inherits the properties of class B, which inherits the properties of class A, through the concept of multilevel inheritance. Although class C inherits the properties of class B and class A, as it is an object of the class C, the print function of class C is called."},{"id":1388,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"d","cod":["class A\n{\n    public void Print()\n    {\n        System.out.println(\"A\");\n    }\n}\nclass B extends A\n{\n    public void Print()\n    {\n        System.out.println(\"B\");\n    }\n}\nclass C extends B\n{\n    public void Print()\n    {\n        super.super.Print();\n        System.out.println(\"C\");\n    }\n}\npublic class Multi1\n{\n    public static void main(String[] args)\n    {\n        B c = new C();\n        c.Print();\n    }\n}"],"exp":"Class C inherits the properties of classes A and B through multilevel inheritance. The super keyword is used to refer to the parent class of the derived class, but it cannot be used more than once in the same statement in order to call the parent of the parent class. Multiple super or nested super statements are not valid in Java."},{"id":1389,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"a","cod":["class A\n{\n    public void Print()\n    {\n        System.out.println(\"A\");\n    }\n}\nclass B extends A\n{\n    public void Print()\n    {\n        super.Print();\n        System.out.println(\"B\");\n    }\n}\nclass C extends B\n{\n    public void Print()\n    {\n        super.Print();\n        System.out.println(\"C\");\n    }\n}\npublic class Multilevel2\n{\n    public static void main(String[] args)\n    {\n        B c = new C();\n        c.Print();\n    }\n}"],"exp":"The object 'c' is an object of class C, which inherits class B and class A through multilevel inheritance. The super keyword is used to refer to the parent class of the class it is called from. The super keyword in class C refers to class B, and that in class B refers to class A."},{"id":1390,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","120"],["b","40"],["c","50"],["d","Compilation Error"]],"ans":"a","cod":["class A\n{\n    int a = 30;\n}\nclass B extends A\n{\n    int b = 40;\n}\nclass C extends B\n{\n    int c = 50;\n    public void display()\n    {\n        System.out.println(a+b+c);\n    }\n}\npublic class Sum\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.display();\n    }\n}"],"exp":"The object c is an object of the class C, which inherits the properties of classes A and B through multilevel inheritance. As class C has inherited both the classes,A and B, it can use the values of the variables of those respective classes in it's own class functions."},{"id":1391,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","o"],["b","Compilation Error"],["c","u"],["d","Runtime Error"]],"ans":"c","cod":["class A\n{\n    String s = \"Sanfoundry\";\n}\nclass B extends A\n{\n    int b = 5;\n}\nclass C extends B\n{\n    public void print()\n    {\n        System.out.println(s.charAt(b));\n    }\n}\npublic class CharAt\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.print();\n    }\n}"],"exp":"Class C inherits the properties of class B, which inherits the properties of class A, through multilevel inheritance. Therefore an object of class C can access the values of the variables of classes A and B. The charAt() function returns the character at the index passed to the function in the string calling it."},{"id":1392,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","2"],["b","3"],["c","7"],["d","6"]],"ans":"d","cod":["class A\n{\n    String s = \"Sanfoundry\";\n}\nclass B extends A\n{\n    char ch = 'n';\n}\nclass C extends B\n{\n    int a = 3;\n    public void display()\n    {\n        System.out.println(s.indexOf(ch,a));\n    }\n}\npublic class IndexOf\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.display();\n    }\n}"],"exp":"The object 'c' is an object of the class C, which extends classes A and B through multilevel inheritance, and hence can access the variables of those classes. The indexOf function returns the first index of the character passed to it in the string calling it. If an integer is passed along with the character, it starts the search from that index."},{"id":1393,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","C"],["b","Compilation Error"],["c","c"],["d","Runtime Error"]],"ans":"a","cod":["class A\n{\n    int a = 67;\n}\nclass B extends A\n{\n    char ch = (char)a;\n}\nclass C extends B\n{\n    public void ascii()\n    {\n        System.out.println(ch);\n    }\n}\npublic class Ascii\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.ascii();\n    }\n}"],"exp":"The object 'c' is an object of the class C, which extends classes A and B through multilevel inheritance, and hence can access the variables of those classes. When an integer is converted to a character, it is converted on the basis of it's ascii value. The ascii value of 'c' is 99, while that of
