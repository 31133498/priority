 'C' is 67."},{"id":1394,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","160"],["b","Compilation Error"],["c","0"],["d","120"]],"ans":"a","cod":["import java.util.*;\nclass A\n{\n    LinkedList l = new LinkedList();\n}\nclass B extends A\n{\n    void add(int a)\n    {\n        l.add(a);\n    }\n}\nclass C extends B\n{\n    public void sum()\n    {\n        int sum=0;\n        Iterator i = l.iterator();\n        while(i.hasNext())\n        sum+=(int)i.next();\n        System.out.println(sum);\n    }\n}\npublic class Sum\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.add(53);\n        c.add(27);\n        c.add(80);\n        c.sum();\n    }\n}"],"exp":"Class C inherits the properties and variables of class A and class B through multilevel inheritance, and hence can access the add function and the linked list 'l'. The iterator is used to iterate through the elements of the linked list and the sum of those elements is then printed."},{"id":1395,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Sanfoundry"],["b","Sandry"],["c","foundry"],["d","Compilation Error"]],"ans":"a","cod":["class A\n{\n    String s = \"San\";\n}\nclass B extends A\n{\n    String s = super.s+\"foun\";\n}\nclass C extends B\n{\n    public void print()\n    {\n        System.out.println(s+\"dry\");\n    }\n}\npublic class Print\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.print();\n    }\n}"],"exp":"The object 'c' is an object of the class C, which inherits both classes A and B through multilevel inheritance, hence can access their string variable 's'. The super keyword is used to call the parent class of the class calling it. When 's' is called in print() function, it refers to the string 's' of it's parent class, which is class B."},{"id":1396,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","10, 20, 30"],["b","a = 10, b = 20, c = 30"],["c","C@2a139a55"],["d","A$B$C@2a139a55"]],"ans":"c","cod":["class A\n{\n    int a = 10;\n}\nclass B extends A\n{\n    int b = 20;\n}\nclass C extends B\n{\n    int c = 30;\n}\npublic class ClassName\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        System.out.println(c);\n    }\n}"],"exp":"The object 'c' is an object of the class C, which inherits the properties of classes A and B through multilevel inheritance. Although class C inherits classes A and B, it is not a subclass of either of them, hence it's ClassName remains C. When an object is printed, it is in the format ClassName@HashCode."},{"id":1397,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","5"],["b","120"],["c","Compilation Error"],["d","24"]],"ans":"b","cod":["class A\n{\n    int x = 5;\n}\nclass B extends A\n{\n    int fact = 1;\n    void fact()\n    {\n        for(int i = 1; i<=x; i++)\n        {\n            fact*=i;\n        }\n    }\n}\nclass C extends B\n{\n    void print()\n    {\n        System.out.println(fact);\n    }\n}\npublic class Factorial\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.fact();\n        c.print();\n    }\n}"],"exp":"Class C extends classes A and B through multilevel inheritance, thus gaining access to the function fact and the variables 'x' and 'fact'. The function fact() is used to calculate the factorial of the variable 'x', and the print() function is used to print it."},{"id":1398,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","300"],["b","6000"],["c","0"],["d","200"]],"ans":"c","cod":["import java.util.*;\nclass A\n{\n    int a = 10;\n}\nclass B extends A\n{\n    int b = 20;\n}\nclass C extends B\n{\n    int c = 30;\n}\nclass D extends C\n{\n    int c;\n    public void multiply()\n    {\n        System.out.println(a*b*c);\n    }\n}\npublic class Multiply\n{\n    public static void main(String[] args)\n    {\n        D d = new D();\n        d.multiply();\n    }\n}"],"exp":"The class D extends classes A, B and C through multilevel inheritance, therefore gaining access to the variables 'a', 'b' and 'c'. Although it inherits class C, class D also has declared the variable 'c' with no initial value, hence at the time of object creation, it is given the initial value of 0 and thus the multiplication product is 0."},{"id":1399,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","[1, 2, 3]"],["b","[1, 2, 4]"],["c","{1, 2, 3}"],["d","{1, 2, 4}"]],"ans":"a","cod":["import java.util.*;\nclass A\n{\n    LinkedList l = new LinkedList();\n}\nclass B extends A\n{\n    void add(int a)\n    {\n        l.add(a);\n    }\n}\nclass C extends B\n{\n    public void remove(int a)\n    {\n        l.remove(a);\n    }\n}\npublic class list\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.add(1);\n        c.add(2);\n        c.add(3);\n        c.add(4);\n        c.remove(3);\n        System.out.println(c.l);\n    }\n}"],"exp":"THe object 'c' is an object of the class C, which inherits the properties and members of the classes A and B through multilevel inheritance. The add() function adds elements to the linked list 'l', while the remove function removes elements. The remove function removes elements at the index specified to it, and as indexing starts at 0, the nth position refers to the (n-1)th index."},{"id":1400,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","30"],["b","Compilation Error"],["c","40"],["d","Runtime Error"]],"ans":"c","cod":["class A\n{\n    int a = 30;\n}\nclass B extends A\n{\n    int a = 40;\n}\nclass C extends B\n{\n    public void display()\n    {\n        System.out.println(a);\n    }\n}\npublic class Parent\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.display();\n    }\n}"],"exp":"Class C inherits the properties of classes A and B through multilevel inheritance, thus gaining access to their variables and functions. Although class C inherits both classes A and B, it's immediate parent class is B, hence it uses that value in the display() function."},{"id":1401,"cat":"OOP using Java","topic":"Multilevel Inheritance","q":"What will be the output of the following Java code?","opts":[["a","89"],["b","Compilation Error"],["c","121"],["d","Runtime Error"]],"ans":"a","cod":["class A\n{\n    char ch = 'Y';\n}\nclass B extends A\n{\n    int a = (int)ch;\n}\nclass C extends B\n{\n    public void print()\n    {\n        System.out.println(a);\n    }\n}\npublic class Ascii1\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.print();\n    }\n}"],"exp":"The object 'c' is an obejct of the class C, which inherits the properties of the classes A and B through multilevel inheritance, thus can use their variables and functions. When a character is converted to an integer, it is converted based on it's ascii value. The ascii value of 'y' is 121, while that of 'Y' is 89."},{"id":1402,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["class Outer\n{\n    int y = 10;\n    class Nested\n    {\n        int y = 15;\n    }\n}\nclass Prog\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested j = i.new Nested();\n        System.out.println(i.y);\n        System.out.println(j.y);\n\n    }\n}"],"exp":"The object 'i' is an object of the outer class, hence it fetches the value of y from the outer class, which is 10. The object j is an object of the nested class, therefore it fetches the value of y from the nested class, which is 15."},{"id":1403,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class Outer\n{\n    void print()\n    {\n        System.out.println(\"Outer\");\n    }\n    class Nested\n    {\n        void print()\n        {\n            System.out.println(\"Nested\");\n        }\n    }\n}\nclass MainCall\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested j = i.new Nested();\n        i.print();\n        j.print();\n    }\n}"],"exp":"In the main function, the objects i and j are the objects of the classes Outer and Nested respectively. They call their respective print functions in order as mentioned in the above program."},{"id":1404,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a","98"],["b","B"],["c","b"],["d","Compilation Error"]],"ans":"c","cod":["class Outer\n{\n    int x = 98;\n    class Nested\n    {\n        void Display()\n        {\n            System.out.println((char)x);\n        }\n    }\n}\nclass ProgCall\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested j = i.new Nested();\n        j.Display();\n    }\n}"],"exp":"The function Display() is called by the object j of the nested class. Since it is an object of the inner class, it can access members of the outer class. Since the ASCII equivalent of 98 is the character 'b', it is printed in the Display() function."},{"id":1405,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a","x=98"],["b","x = 98"],["c","Outer$Nested@2a139a55"],["d","Nested@2a139a55"]],"ans":"c","cod":["class Outer\n{\n    int x = 98;\n    class Nested\n    {\n        void print()\n        {\n            System.out.println(this);\n        }\n    }\n}\nclass MainExecution\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested j = i.new Nested();\n        j.print();\n    }\n}"],"exp":"The 'this' keyword refers to the object calling the function. When it is printed, it is printed in the format ClassName@HashCode. Although here the class name is Nested, it is a nested class of the Outer class, hence it is referred to as Outer$Nested."},{"id":1406,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a","Runtime Error"],["b","Compilation Error"],["c","3000"],["d","6000"]],"ans":"d","cod":["class Outer\n{\n    int x = 10;\n    class Nested\n    {\n        int y = 20;\n        class Nested2\n        {\n            int z = 30;\n            void multiply()\n            {\n                System.out.println(x*y*z);\n            }\n        }\n    }\n}\nclass Call\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested j = i.new Nested();\n        Outer.Nested.Nested2 k = j.new Nested2();\n        k.multiply();\n    }\n}"],"exp":"The innermost class Nested2, can access all elements of the outer classes, and hence the multiply function multiplies all the three values 'x', 'y' and 'z'. Hence, the value of 6000(20*30*10) is printed."},{"id":1407,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a","Garbage value"],["b","1"],["c","0"],["d","Compilation Error"]],"ans":"b","cod":["class Outer\n{\n    class Nested\n    {\n        int y;\n        void factorial()\n        {\n            int fact=1;\n            for(int i=1;i<=y;i++)\n            {\n                fact*=i;\n            }\n            System.out.println(fact);\n        }\n    }\n}\nclass Factorial\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested j = i.new Nested();\n        j.factorial();\n    }\n}"],"exp":"Here there is no separate value given to the variable 'y' by the user and when an object is being created, the default constructor initializes all the integer values to 0, hence the value of y is set to 0. The factorial of 0 is 1 mathematically."},{"id":1408,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a","120"],["b","240"],["c","24"],["d","1"]],"ans":"b","cod":["class Outer\n{\n    class Nested\n    {\n        int y;\n        void fact()\n        {\n            int fact=1;\n            for(int i=1;i<=y;i++)\n            {\n                fact*=i;\n            }\n            System.out.println(fact);\n        }\n        Nested(int y)\n        {\n            this.y=y;\n        }\n    }\n}\nclass OuterCall\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested j = i.new Nested(5);\n        j.fact();\n    }\n}"],"exp":"When the object j is created, it calls the constructor, which sets the value of y to 5. The for loop inside the Nested class is executed as the condition is true until 'i' becomes 5. Factorial of 5 is 120."},{"id":1409,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a","10"],["b","20"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["class Outer\n{\n    int x=10;\n    static class Nested\n    {\n        int y = 10;\n        static void Calc()\n        {\n            System.out.println(x+y);\n        }\n    }\n}\nclass Calculation\n{\n    public static void main(String[] args)\n    {\n        Outer.Nested.Calc();\n    }\n}"],"exp":"The class Nested and the function Calc are static as indicated by the 'static' keyword, therefore they cannot use non-static variables x and y. Static functions must use static variables only. Therefore, a compilation error."},{"id":1410,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a","n"],["b","a"],["c","f"],["d","Compilation Error"]],"ans":"a","cod":["class Outer\n{\n    String s = \"Sanfoundry\";\n    class Nested\n    {\n        void pos(int a)\n        {\n            System.out.println(s.charAt(a));\n        }\n    }\n}\nclass NestedCall\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested j = i.new Nested();\n        j.pos(3);\n    }\n}"],"exp":"The charAt function returns the character at the given index in the string that calls it. As indexing starts from 0, 3 corresponds to the 4th character in the string and therefore the character 'n' is printed after execution."},{"id":1411,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["class Outer\n{\n    class Nested\n    {\n        String s = \"Sanfoundry\";\n        void index(char c)\n        {\n            System.out.println(s.indexOf(c));\n            System.out.println(s.indexOf(c,3));\n        }\n    }\n}\nclass Index\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested j = i.new Nested();\n        j.index('n');\n    }\n}"],"exp":"The indexOf function returns the index of the character passed in the string calling it. If an integer is passed along with the character, then the character is searched starting from that index."},{"id":1412,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a","a"],["b","d"],["c","r"],["d","Compilation error"]],"ans":"a","cod":["class Outer\n{\n    class Nested\n    {\n        String s = \"Dravid\";\n        void display()\n        {\n            System.out.println(s.charAt(2));\n        }\n    }\n}\nclass CharAt\n{\n    public static void main(String[] args)\n    {\n        Outer i = new Outer();\n        Outer.Nested obj = i.new Nested();\n        obj.display();\n    }\n}"],"exp":"Here, Nested is an inner class of the class Outer which has a string that is used for string manipulation. charAt() function is used to find a particular character present in the index provided by the user."},{"id":1413,"cat":"OOP using Java","topic":"Nested Class","q":"What will be the output of the following Java code?","opts":[["a","40"],["b","10"],["c","80"],["d","Compilation error"]],"ans":"a","cod":["class MainClass\n{\n    int x=5;\n    protected int z=4;\n    class NestedClass\n    {\n        int y = 2;\n        void Calculate()\n        {\n            System.out.println(x*y*z);\n        }\n    }\n}\nclass Product\n{\n    public static void main(String[] args)\n    {\n        MainClass obj1 = new MainClass();\n        MainClass.NestedClass obj2 = obj1.new NestedClass();\n        obj2.Calculate();\n    }\n}"],"exp":"In Java, inner class or nested class is a class which is declared inside the class or interface. In the above program, NestedClass is inside the MainClass and NestedClass uses the data members of the outerclass. Hence the output is printed without any errors."},{"id":1414,"cat":"OOP using Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["class StudentHashcode\n{\n    static int num = 60;\n    int temp;\n    Student()\n    {\n        temp = num;\n    }\n    public int hashCode()\n    {\n        return temp;\n    }\n    public static void main(String args[])\n    {\n        Student s = new Student();\n        System.out.println(s.hashCode());\n        System.out.println(s);\n    }\n}"],"exp":"In java.lang class, the hashCode() method returns a hash value that is used to search object in a collection. The toString() method returns a string which has the name of the class, the at-sign character '@', and the unsigned hexadecimal representation of the hash code of the object. In this case, the hexadecimal representation of 60 is 3c as 3*(161) + 12*(160)."},{"id":1415,"cat":"OOP using Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a","false"],["b","true"],["c","0"],["d","Compilation error"]],"ans":"a","cod":["class boolEqual\n{\n    public static void main(String[] args)\n    {\n        Boolean obj1 = new Boolean(true);\n        Boolean obj2 = new Boolean(false);\n        System.out.println(obj1.equals(obj2));\n    }\n}"],"exp":"equals() method is a non-static method of java.lang.Object class that is used to compare two objects. As all classes in Java are a sub-part of Object class, this method is inherited to every class you create in java. In this 'obj1' and 'obj2' have the values of true and false respectively. So, the equals() method when invoked returns false as output."},{"id":1416,"cat":"OOP using Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class Clock\n{\n   public static void main(String[] args)\n   {\n      Clock time = new Clock();\n      System.out.println(\"\" + time.getClass());\n      Integer i = new Integer(5);\n      System.out.println(\"\" + i.getClass());\n   }\n}"],"exp":"getClass() is the method of Object class. This method returns the runtime class of the object. In the above example, time is an object which belongs to the Clock class whereas 'i' belongs to the Integer which is a subset of java.lang class."},{"id":1417,"cat":"OOP using Java","topic":"Object Class","q":"Which of the following options can be a possible output of the Java code mentioned below?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["class FormDetails\n{\n    int id;\n    String name;\n    String tag;\n    Details(int id, String name, String tag)\n    {\n        this.id=id;\n        this.name=name;\n        this.tag=tag;\n    }\n    public static void main(String args[])\n    {\n        Details obj1=new Details(1,\"Pawan\",\"NoTag\");\n        Details obj2=new Details(2,\"Mahesh\",\"NoTag\");\n        System.out.println(obj1);\n        System.out.println(obj2);\n    }\n}"],"exp":"When we try to print the object without using toString(), we get the output which is in the form of classname@HashCode_in_Hexadecimal_form. If we want the proper information about 'obj1' and 'obj2' objects, then we have to override toString() method of Object class in the Details class, which is missing in the above code."},{"id":1418,"cat":"OOP using Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a",""Gautam Nanda" 21"],["b","Gautam Nanda 21"],["c","Compilation Error"],["d",""Gautam Nanda 21""]],"ans":"b","cod":["class PersonalDetails\n{\n    String name;\n    int age;\n    Person (String name, int age)\n    {\n        this.name = name;\n        this.age = age;\n    }\n    public String toString()\n    {\n        return name + \" \" + age;\n    }\n    public static void main(String[] args)\n    {\n        Person b = new Person(\"Gautam Nanda\", 21);\n        System.out.println(b.toString());\n    }\n}"],"exp":"Java compiler internally invokes the toString() method on the object. So by overriding the toString() method, it returns the desired output. By overriding the toString() method of the Object class, we can return values of the object."},{"id":1419,"cat":"OOP using Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a","This is the finalise() method"],["b","Hi, Welcome in Java World"],["c","This is finalize class"],["d","Compilation error"]],"ans":"c","cod":["class FinaliseObject\n{\n    public void finalize()\n    {\n        System.out.println(\"This is the finalize() method \");\n    }\n    public static void main(String[] args) {\n        String str = new String(\"Hi, Welcome in Java World\");\n        str = null;\n        System.gc();\n        System.out.println(\"This is finalize class\");\n    }\n}"],"exp":"Every class inherits the finalize() method from java.lang.Object. The method is invoked by the garbage collection protocol when it determines that there are no more references to the existing object."},{"id":1420,"cat":"OOP using Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b","1 dravid"],["c",""],["d","Compilation error"]],"ans":"a","cod":["class Cloning implements Cloneable\n{\n    int id;\n    String name;\n    Cloning(int id, String name)\n    {\n        this.id=id;\n        this.name=name;\n    }\n    public Object clone()throws CloneNotSupportedException\n    {\n        return super.clone();\n    }\n    public static void main(String args[])\n    {\n        try\n        {\n            Cloning obj1=new Cloning(1,\"dravid\");\n            Cloning obj2=(Cloning)obj1.clone();\n            System.out.println(obj1.id+\" \"+obj1.name);\n            System.out.println(obj2.id+\" \"+obj2.name);\n        }\n        catch(CloneNotSupportedException c){}\n    }\n}"],"exp":"Both reference variables in this case have the same value. Thus, the clone() replicates the values of one object to another. So we don't need to write any separate code to copy the value of an object to another. After cloning takes place, both the objects have the exact same values."},{"id":1421,"cat":"OOP using Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a","Class is Apple"],["b","Class is JavaClassExample"],["c","Class is java.lang.String"],["d","Class is String"]],"ans":"c","cod":["public class JavaClassExample\n{\n    public static void main(String[] args)\n    {\n        Object obj1 = new String(\"Apple\");\n        Class b = obj1.getClass();\n        System.out.println(\"Class is:\" + b.getName());\n    }\n}"],"exp":"getClass() is the method of Object class. This method returns the runtime class of this object. It returns the Class objects that represent the runtime class of this object. In the above case, the object belongs to java.lang.String."},{"id":1422,"cat":"OOP using Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a","true"],["b","false"],["c","Compilation error"],["d","-1"]],"ans":"a","cod":[" class Equality\n {\n     public int hashCode()\n     {\n        return 199;\n     }\n     public static void main(String[] args)\n     {\n         String a = new String(\"a\");\n         String b = new String(\"a\");\n         System.out.println(a.equals(b));\n     }\n }"],"exp":"The equals method is used when one wants to know if two objects are equivalent by whatever definition the objects find suitable. It returns true if and only if the argument is not null and is a Boolean object that represents the same boolean value as this object. In this case, both the objects are same."},{"id":1423,"cat":"OOP using Java","topic":"Object Class","q":"What will be the output of the following Java code?","opts":[["a","155"],["b",""155""],["c","Compilation error"],["d","Hash code Value for object is: 155"]],"ans":"c","cod":["class IntegerHashCode\n{\n    public static void main(String[] args)\n    {\n        int hashValue = Integer.hashCode(\"155\");\n        System.out.println(\"Hash code Value for object is: \" + hashValue);\n    }\n}"],"exp":"The java.lang.Integer.hashCode() method of Integer class in Java is used to return the hash code for a particular Integer. It is equal to the uncomplicated primitive integer value, represented by this Integer object. But in this case, a string "155" is passed to an Integer which therefore is not executable and error is thrown."},{"id":1424,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","10"],["b","Compilation Error"],["c","0"],["d","Runtime Error"]],"ans":"a","cod":["class A\n{\n    int a = 10;\n}\nclass B extends A\n{\n    void print()\n    {\n        System.out.println(a);\n    }\n}\npublic class Inheritance\n{\n    public static void main(String[] args)\n    {\n        B b = new B();\n        b.print();\n    }\n}"],"exp":"The object 'b' is an object of the class B, which inherits the properties of class A through single level inheritance. The value of variable 'a' is given to the print function in class B by class A through the concept of single level inheritance."},{"id":1425,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","A"],["b","Compilation Error"],["c","B"],["d","Runtime Error"]],"ans":"c","cod":["class A\n{\n    void print()\n    {\n        System.out.println(\"A\");\n    }\n}\nclass B extends A\n{\n    void print()\n    {\n        System.out.println(\"B\");\n    }\n}\npublic class Single\n{\n    public static void main(String[] args)\n    {\n        A b = new B();\n        b.print();\n    }\n}"],"exp":"The object 'b' is an object of the class B, which extends class A. As it is an object of the class B, the print function of the class B is executed. This program is an example of single inheritance as class B inherits the properties of class A."},{"id":1426,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","B"],["b","Runtime Error"],["c","A"],["d","Compilation Error"]],"ans":"c","cod":["class A\n{\n    void print()\n    {\n        System.out.println(\"A\");\n    }\n}\nclass B extends A\n{\n    void print()\n    {\n        System.out.println(\"B\");\n    }\n}\npublic class Single1\n{\n    public static void main(String[] args)\n    {\n        A a = new A();\n        a.print();\n    }\n}"],"exp":"The object 'a' is an object of the class A. Although the class B extends class A, in order to call its print function, it requires the creation of an object of class B. Hence, only the print() function in class A is executed successfully."},{"id":1427,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["class Base\n{\n    int a = 10;\n    void display()\n    {\n        System.out.println(a);\n        System.out.println(\"Base\");\n    }\n}\nclass Derived extends Base\n{\n    int a = 20;\n    void display()\n    {\n        System.out.println(a);\n        System.out.println(\"Derived\");\n    }\n}\npublic class Polymorphism\n{\n    public static void main(String[] args)\n    {\n        Base a = new Derived();\n        a.display();\n    }\n}"],"exp":"The object 'a' is an object of the class Derived, which extends class Base by the concept of single inheritance. As the object is an object of the Derived class, it calls the print() function which is a part of the Derived class."},{"id":1428,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","3"],["b","7"],["c","2"],["d","-1"]],"ans":"d","cod":["class Base\n{\n    String s = \"Sanfoundry\";\n}\nclass Derived extends Base\n{\n    void index()\n    {\n        System.out.println(s.indexOf('N'));\n    }\n}\npublic class Index\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.index();\n    }\n}"],"exp":"The object 'a' is an object of the class Derived, which inherits the properties of the class Base through single inheritance. The indexOf function returns the index of the character specified in the parameters in the string calling it. It is case sensitive. Hence 'n' and 'N' are different."},{"id":1429,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","I"],["b","e"],["c","n"],["d","h"]],"ans":"c","cod":["class Base\n{\n    String s = \"Single Inheritance\";\n}\nclass Derived extends Base\n{\n    void charAt()\n    {\n        System.out.println(s.charAt(8));\n    }\n}\npublic class Index1\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.charAt();\n    }\n}"],"exp":"The object 'a' is an object of the class Derived, which inherits the properties of the class Base through single inheritance. The charAt() function is used to return the character in the string calling it at the index passed to the function. As indexing starts at 0, the nth position corresponds to the (n-1)th index."},{"id":1430,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","68"],["b","Compilation Error"],["c","100"],["d","Runtime Error"]],"ans":"a","cod":["class Base\n{\n    char ch = 'D';\n}\nclass Derived extends Base\n{\n    void ascii()\n    {\n        System.out.println((int)ch);\n    }\n}\npublic class Ascii\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.ascii();\n    }\n}"],"exp":"The object 'a' is an object of the Derived class, which inherits class Base through single inheritance. When a character is converted to an integer, it is converted based on the ascii value of that character. The ascii value of 'd' is 100, and that of 'D' is 68."},{"id":1431,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","L"],["b","Compilation Error"],["c","l"],["d","Runtime Error"]],"ans":"a","cod":["class Base\n{\n    int a = 76;\n}\nclass Derived extends Base\n{\n    void ascii()\n    {\n        System.out.println((char)a);\n    }\n}\npublic class Ascii1\n{\n    public static void main(String[] args)\n    {\n        Derived i = new Derived();\n        i.ascii();\n    }\n}"],"exp":"The object 'i' is an object of the Derived class, which inherits class Base through single inheritance. When an integer is converted to a character, it is converted on the basis of it's ascii value. The ascii value of 'L' is 76, while that of 'l' is 108."},{"id":1432,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","2 4 6"],["b","Compilation Error"],["c","1 3 5"],["d","Runtime Error"]],"ans":"c","cod":["class Base\n{\n    int a[] = {1,2,3,4,5,6};\n}\nclass Derived extends Base\n{\n    void even()\n    {\n        for(int i = 0; i < a.length; i++)\n        {\n            if(i%2==0)\n            {\n                System.out.print(a[i]+\" \");\n            }\n        }\n    }\n}\npublic class Array\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.even();\n    }\n}"],"exp":"The object 'a' is an object of the class Derived, which inherits the properties of the class Base through single inheritance. The for loop checks for even values of 'i', and prints the elements at that index. As indexing starts from 0, the nth position corresponds to the (n-1)th index, hence odd numbers are printed."},{"id":1433,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","30, 45"],["b","x = 30, y = 45"],["c","Derived@2a139a55"],["d","Base$Derived@2a139a55"]],"ans":"c","cod":["class Base\n{\n    int x = 30;\n}\nclass Derived extends Base\n{\n    int y = 45;\n    void display()\n    {\n        System.out.println(this);\n    }\n}\npublic class ClassName\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.display();\n    }\n}"],"exp":"When an object is printed, it is in the format ClassName@HashCode. The object a is an object of the class Derived. Although the class Derived inherits the class Base, it is not a subclass of Base, hence only Derived appears in the ClassName."},{"id":1434,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class Base\n{\n    String s = \"Sanfoundry\";\n}\nclass Derived extends Base\n{\n    Integer y = new Integer(47);\n    void display()\n    {\n        System.out.println(s.getClass().getSuperclass());\n        System.out.println(y.getClass().getSuperclass());\n    }\n}\npublic class ClassName1\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.display();\n    }\n}"],"exp":"String is a subclass of the Object class of the lang package of java, and Integer is a subclass of Number class of the lang package in java. The object a is an object of the Derived class, which extends the class Base, thereby inheriting its properties."},{"id":1435,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b","Derived"],["c","Base"],["d",""]],"ans":"d","cod":["class Base\n{\n    void print()\n    {\n        System.out.println(\"Base\");\n    }\n}\nclass Derived extends Base\n{\n    void print()\n    {\n        super.print();\n        System.out.println(\"Derived\");\n    }\n}\npublic class Super\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.print();\n    }\n}"],"exp":"The super keyword is used to refer to the parent class of the class where it is called. Here, the class Derived extends class Base, hence making it a child class of the Base class. Therefore, the super keyword refers to the Base class, and calls the print function of the base class before printing "Derived"."},{"id":1436,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","Compilation Error"],["c","1665"],["d","Runtime Error"]],"ans":"c","cod":["class Base\n{\n    int a = 37;\n}\nclass Derived extends Base\n{\n    int b = 45;\n    void calculate()\n    {\n        System.out.println(a*b);\n    }\n}\npublic class Multiply\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.calculate();\n    }\n}"],"exp":"The object 'a' is an object of the class Derived, which inherits the properties of class Base, hence obtaining the value of integer variable 'a' which results in 1665(37*45) as mentioned in the calculate() function."},{"id":1437,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","146"],["c","129"],["d","Runtime Error"]],"ans":"b","cod":["import java.util.*;\nclass Base\n{\n    LinkedList l = new LinkedList();\n    void sum()\n    {\n        int sum=0;\n        Iterator i = l.iterator();\n        while(i.hasNext())\n        sum+=(int)i.next();\n        System.out.println(sum);\n    }\n}\nclass Derived extends Base\n{\n    void add(int a)\n    {\n        l.add(a);\n    }\n}\npublic class Sum\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.add(31);\n        a.add(36);\n        a.add(28);\n        a.add(51);\n        a.sum();\n    }\n}"],"exp":"The object 'a' is an object of the class Derived, which inherits the variables and functions of the parent class, Base. The add() function adds an element to the end of the linked list, and the iterator is used to iterate through the linked list."},{"id":1438,"cat":"OOP using Java","topic":"Single Level Inheritance","q":"What will be the output of the following Java code?","opts":[["a","SanSan"],["b","foundryfoundry"],["c","Sanfoundry"],["d","Compilation Error"]],"ans":"c","cod":["class Base\n{\n    String s = \"San\";\n}\nclass Derived extends Base\n{\n    String s = \"foundry\";\n    void print()\n    {\n        System.out.println(super.s+s);\n    }\n}\npublic class Sanfoundry\n{\n    public static void main(String[] args)\n    {\n        Derived a = new Derived();\n        a.print();\n    }\n}"],"exp":"The class Derived inherits the properties of the class Base through single inheritance. The super keyword is used to refer to the parent class, and hence super. The variable 's' corresponds to the string variable 's' of the parent class Base. Hence the string "Sanfoundry" is printed."},{"id":1439,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a","Runtime Error"],["b","Compilation Error"],["c","0"],["d","30"]],"ans":"d","cod":["public class Sum\n{\n    public static class Inner\n    {\n        static int sum=0;\n        public static void add(int a, int b)\n        {\n            sum=a+b;\n        }\n        public void print()\n        {\n            System.out.println(sum);\n        }\n    }\n    public static void main(String[] args)\n    {\n        Sum.Inner.add(10,20);\n        Sum.Inner i = new Sum.Inner();\n        i.print();\n    }\n}"],"exp":"For calling a static function of a static inner class, we do not require an object of the main class hence, when add is called from main function, 30 is stored in sum."},{"id":1440,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b","class getClass.InnerInner"],["c",""],["d",""]],"ans":"a","cod":["public class getClass\n{\n    public static class Inner\n    {\n        public void print()\n        {\n            System.out.println(\"Inner\");\n        }\n    }\n    public static void main(String[] args)\n    {\n        getClass.Inner i = new getClass.Inner();\n        System.out.println(i.getClass());\n        i.print();\n    }\n}"],"exp":"The getClass function returns the name of the class of the object it is called with. An inner static class' name is given by the outer class' name followed by the '$' symbol and then the name of the inner class."},{"id":1441,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b","Runtime Error"],["c",""],["d","Compilation Error"]],"ans":"d","cod":["public class StaticOuter\n{\n    public static class StaticInner\n    {\n        public void display()\n        {\n            System.out.println(\"StaticInner\");\n        }\n    }\n    public class Inner\n    {\n        public void display()\n        {\n            System.out.println(\"Inner\");\n        }\n    }\n    public static void main(String[] args)\n    {\n        StaticOuter.StaticInner i = new StaticOuter.StaticInner();\n        System.out.println(i.getClass());\n        i.display();\n        StaticOuter.Inner j = new StaticOuter.Inner();\n        System.out.println(j.getClass());\n        j.display();\n    }\n}"],"exp":"As the inner class is non-static, it is not possible to directly create an object for it, instead we have to first create an object for the outer class. Therefore an error is thrown by the compiler as an object of inner class cannot be created in this case."},{"id":1442,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a","A"],["b","The unicode character of the integer is A"],["c","The unicode character of the integer is a"],["d","Error"]],"ans":"c","cod":["public class Program\n{\n    public static class Char\n    {\n        public void print(int a)\n        {\n            System.out.println((char)c);\n        }\n    }\n    public static void main(String[] args)\n    {\n        Program.Inner i = new Program.Inner();\n        i.print(97);\n    }\n}"],"exp":"Static members belong to the class instead of a specific instance and since it is a static class, we can directly make an object for the class. The unicode equivalent of 97 is 'a' and therefore it is printed."},{"id":1443,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a","Strings are equal"],["b","The strings aren't equal"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"d","cod":["public class DisplayProg\n{\n    public static class Display\n    {\n        String a;\n        Display(String a)\n        {\n            this.a = a;\n        }\n        public static void display()\n        {\n            System.out.println(a);\n        }\n    }\n    public static void main(String[] args)\n    {\n        DisplayProg.Display i = new DisplayProg.Display(\"A\",\"A\");\n        i.display();\n    }\n}"],"exp":"As display is a static function, the string variable 'a' has to be static too. Therefore, it leads to a compilation error in the compare funtion while accessing the string variable 'a'."},{"id":1444,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["public class String\n{\n    public static class obj\n    {\n        String a;\n        int b;\n        obj(String x, int y)\n        {\n            a=x;\n            b=y;\n        }\n    }\n    public static void main(String[] args)\n    {\n        String.obj i = new String.obj(\"San\",10);\n        System.out.println(i);\n        System.out.println(i.toString());\n    }\n}"],"exp":"When we try to print an object directly, it returns the name of the class, followed by '@' and a hashcode in hexadecimal whereas the toString() method converts it into a string."},{"id":1445,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a","Runtime Error"],["b","Compilation Error"],["c","The strings are equal"],["d","The strings aren't equal"]],"ans":"d","cod":["public class StringProgram\n{\n    public static class Compare\n    {\n        static String a,b;\n        Compare(String x, String y)\n        {\n            a=x;\n            b=y;\n        }\n        public static void compare()\n        {\n            if(a==b)\n                System.out.println(\"The strings are equal\");\n            else\n                System.out.println(\"The strings aren't equal\");\n        }\n    }\n    public static void main(String[] args)\n    {\n        String a = new String(\"Sanfoundry\");\n        String b = new String(\"Sanfoundry\");\n        StringProgram.Compare i = new StringProgram.Compare(a, b);\n        i.compare();\n    }\n}"],"exp":"Strings when created as objects refer to different memory locations. When using '==' operator, they do not correspond to the same location and hence moves to the else part."},{"id":1446,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a","d"],["b","r"],["c","Compilation error"],["d","Runtime Error"]],"ans":"b","cod":["public class charAtFunction\n{\n    public static class Inner\n    {\n        public static void indexChar(String a, int b)\n        {\n            System.out.println(a.charAt(b));\n        }\n    }\n    public static void main(String[] args)\n    {\n        charAtFunction.Inner.indexChar(\"Sanfoundry\", 8);\n    }\n}"],"exp":"charAt returns the character at the given index. Since indexing starts at 0, the character at the n+1th position is returned. And since indexChar is a static function, it can be called directly without making an object."},{"id":1447,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["public class indexOfFunction\n{\n    public static class Inner\n    {\n        public void charPos(String a, char b)\n        {\n            System.out.println(a.indexOf(b));\n            System.out.println(a.indexOf(b,3);\n        }\n    }\n    public static void main(String[] args)\n    {\n        indexOfFunction.Inner i = new indexOfFunction.Inner();\n        i.charPos(\"Sanfoundry\", 'n');\n    }\n}"],"exp":"indexOf returns the first index of the given character in the string. When followed by an integer, it starts the search from the specified index of the string. Since 'n' is at index 2, it searches for the next instance of 'n' in the string."},{"id":1448,"cat":"OOP using Java","topic":"Static Class","q":"What will be the output of the following Java code?","opts":[["a","2.5"],["b","2"],["c","40"],["d","20"]],"ans":"c","cod":["public class Nested\n{\n    public static class Push\n    {\n        public void push(int a, int b)\n        {\n            System.out.println(a<<b);\n        }\n    }\n    public static void main(String[] args)\n    {\n        Nested.Push i = new Nested.Push();\n        i.push(10, 2);\n    }\n}"],"exp":"The left shift operator takes two numbers, left shifts the bits of the first operand and the second operand decides the number of places to shift. Here 10, which is 1010 after the push becomes 101000 which is 40."},{"id":1449,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","Sanfoundry"],["c","Runtime Error"],["d","ABC"]],"ans":"b","cod":["public class Main\n{\n    String s=\"ABC\";\n    Main(String s)\n    {\n        this.s = s;\n    }\n    void print()\n    {\n        System.out.println(this.s);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"Sanfoundry\");\n        a.print();\n    }\n}"],"exp":"The this keyword is used to refer to the object that is calling that function. Here this is used to set the value of the string s to Sanfoundry and then to print it."},{"id":1450,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","Sanfoundry"],["b","Compilation Error"],["c",""],["d","Runtime Error"]],"ans":"c","cod":["public class Main\n{\n    String s;\n    Main(String s)\n    {\n        this.s = s;\n    }\n    void print()\n    {\n        System.out.println(this.s);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"San\");\n        Main b = new Main(\"foundry\");\n        a.print();\n        b.print();\n    }\n}"],"exp":"The this keyword is use to refer to the object calling the respective function. Both a and b have a different value of s, which is called using the this keyword."},{"id":1451,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","300"],["b","50"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"b","cod":["public class Main\n{\n    int a=100, b=200;\n    void calculate(int a, int b)\n    {\n        System.out.println(a+b);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        a.calculate(20, 30);\n    }\n}"],"exp":"In the function calculate, if this keyowrd is not used, it refers to the parameters passed into the function due to the scope of the variables."},{"id":1452,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","105"],["b","800"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"b","cod":["public class Main\n{\n    int a=500, b=300;\n    void sum(int a, int b)\n    {\n        System.out.println(this.a+this.b);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        a.sum(45, 60);\n    }\n}"],"exp":"In the sum function, this keyword is used, hence it refers to the global variables in the print statement."},{"id":1453,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","50"],["c","600"],["d","Compilation Error"]],"ans":"a","cod":["public class Main\n{\n    int breadth, height;\n    void Area(int breadth, int height)\n    {\n        System.out.println(this.breadth*this.height);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        a.Area(20, 30);\n    }\n}"],"exp":"When an object is created, all the variables are initialised to their respective default values. For integers, the default value is 0. In the Area function, the this keyword refers to the global variables, and as both are 0, it prints 0."},{"id":1454,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","2, 6"],["b","2"],["c","3, 7"],["d","3"]],"ans":"b","cod":[" public class Main\n{\n    String s;\n    Main(String s)\n    {\n        this.s=s;\n    }\n    void position(char ch)\n    {\n        System.out.println(this.s.indexOf(ch));\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"Sanfoundry\");\n        a.position('n');\n    }\n}"],"exp":"The indexOf function returns the index of the first instance of the character in the string calling it. Indexing starts from 0, so the nth position in the string is the (n-1)th index."},{"id":1455,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["public class Main\n{\n    String s;\n    Main(String s)\n    {\n        this.s=s;\n    }\n    void className()\n    {\n        System.out.println(this.s.getClass());\n        System.out.println(this.s.getClass().getSuperclass());\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"this\");\n        a.className();\n    }\n}"],"exp":"Strings are a subclass of the class Object of the lang package in java. Since getClass and getSuperclass are used on a string, it prints out the classes."},{"id":1456,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"c","cod":["public class Main\n{\n    static class A\n    {\n        void print()\n        {\n            System.out.println(this.getClass());\n            System.out.println(this.getClass().getSuperclass());\n        }\n    }\n    public static void main(String[] args)\n    {\n        Main.A a = new Main.A();\n        a.print();\n    }\n}"],"exp":"The object a is an object of the class A, but since A is a subclass of Main, it retains the class name as Main$A. The Main class is a subclass of the java Object class of the java package."},{"id":1457,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","e"],["b","y"],["c","k"],["d","Compilation Error"]],"ans":"a","cod":["public class Main\n{\n    String s;\n    Main(String s)\n    {\n        this.s=s;\n    }\n    void character(int a)\n    {\n        System.out.println(this.s.charAt(a));\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"this keyword\");\n        a.character(6);\n    }\n}"],"exp":"The charAt function returns the character at the specified index of the string. As indexing starts from 0, the nth position is the (n-1)th index."},{"id":1458,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"b","cod":["public class Main\n{\n    int a=10;\n    static class A\n    {\n        int a=20;\n        void display(int a)\n        {\n            System.out.println(this.a);\n            System.out.println(a);\n        }\n    }\n    public static void main(String[] args)\n    {\n        Main.A a = new Main.A();\n        a.display(30);\n    }\n}"],"exp":"When this keyword is used, it refers to the object of the class calling that function. Here, the this keyword refers to the class A, hence the value of a is 20."},{"id":1459,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","10, "Sanfoundry""],["b","10 Sanfoundry"],["c","Main@2a139a55"],["d","Compilation Error"]],"ans":"c","cod":["public class Main\n{\n    int a = 10;\n    String s = \"Sanfoundry\"\n    void display()\n    {\n        System.out.println(this);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        a.display();\n    }\n}"],"exp":"When an object is printed, it is in the format ClassName@HashCode. Here, this refers to the object of the class calling it, which is Main."},{"id":1460,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","32"],["b","16"],["c","8"],["d","Compilation Error"]],"ans":"a","cod":["public class Main\n{\n    int a = 2;\n    void Shift(int a)\n    {\n        System.out.println(this.a<<a);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        a.Shift(4);\n    }\n}"],"exp":"The left shift operator shifts the bits to the left by adding 0s at the end. Here this.a refers to the value of the global variable, which is 2. This is shifted by 4 units, which is the same as multiplying it by 24."},{"id":1461,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","97"],["b","99"],["c","67"],["d","65"]],"ans":"b","cod":["public class Main\n{\n    char ch = 'a';\n    void print(char ch)\n    {\n        System.out.println((int)ch);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        a.print('c');\n    }\n}"],"exp":"When a character is converted to int, it changes to it's ascii value. As the this keyword is not used, it refers to the parameter passed to the function, which is 'c'. The ascii value of 'c' is 99, while that of 'C' is 67."},{"id":1462,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","f"],["b","i"],["c","F"],["d","I"]],"ans":"a","cod":["public class Main\n{\n    int a = 102;\n    void display(int a)\n    {\n        System.out.println((char)this.a);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        a.display(105);\n    }\n}"],"exp":"When an integer is converted to a character, it is changed based on the ascii value of the integer. The ascii value of 'f' is 102, and that of 'i' is 105. The this keyword refers to the global variable, hence 'f' is printed."},{"id":1463,"cat":"OOP using Java","topic":"This Keyword","q":"What will be the output of the following Java code?","opts":[["a","true"],["b","Compilation Error"],["c","false"],["d","Runtime Error"]],"ans":"c","cod":["public class Main\n{\n    String s=\"\";\n    void set(String s)\n    {\n        this.s = s;\n    }\n    void compare()\n    {\n        System.out.println(this.s.equals(\"Sanfoundry\"));\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main();\n        Main b = new Main();\n        a.set(\"Sanfoundry\");\n        b.compare();\n    }\n}"],"exp":"The value of s is set to "Sanfoundry" for object a, but not for object b. Hence when compare is called, the value of s is "" and thus prints false."},{"id":1464,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","A"],["b","Null"],["c","" ""],["d","Compilation error"]],"ans":"a","cod":["class Constructor\n{\n    String name;\n    ConstructorName()\n    {\n        this.name = \"A\";\n    }\n    public static void main(String[] args)\n    {\n        ConstructorName obj = new ConstructorName();\n        System.out.println(obj.name);\n    }\n}"],"exp":"Constructor is a block of code that initializes the newly created object. In the above program, the class variable 'String' is initialized using the constructor during the creation of object 'obj'. 'this' keyword is used to refer to the currently executing object."},{"id":1465,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","0"],["b","" ""],["c","Garbage Value"],["d","Compilation Error"]],"ans":"a","cod":["class ConstructorDisplay\n{\n    int id;\n    void display()\n    {\n        System.out.println(id);\n    }\n    public static void main(String args[])\n    {\n        ConstructorDisplay obj1=new ConstructorDisplay();\n        obj1.display();\n    }\n}"],"exp":"Constructor is a special type of method which is used to initialize the object. Default constructor is automatically invoked when an object is created. In this case, an object 'obj1' is created and hence the constructor is invoked. The default value of an int variable is 0.\nFree 30-Day Java Certification Bootcamp is Live. Join Now!"},{"id":1466,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","0"],["b","0.0f"],["c","0.0"],["d","Compilation Error"]],"ans":"c","cod":["class ConstructorPrint\n{\n    float f;\n    void Print()\n    {\n        System.out.println(f);\n    }\n    public static void main(String args[])\n    {\n        ConstructorPrint obj1=new ConstructorPrint();\n        obj1.Print();\n    }\n}"],"exp":"Constructor is a special type of method which is used to initialize the object. Default constructor is automatically invoked when an object is created. A float class variable 'f' is present, as there is no initial value assigned to it, the default value of 0.0 is assigned to it."},{"id":1467,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","0"],["b","Null"],["c","Garbage Value"],["d","Compilation Error"]],"ans":"d","cod":["class ConstructorString\n{\n    String s;\n    ConstructorString(String str)\n    {\n        System.out.println(str);\n    }\n    public static void main(String args[])\n    {\n        ConstructorString obj1=new ConstructorString();\n    }\n}"],"exp":"A constructor initializes an object as soon as it is created. It has the same name as the class and is a special kind of method. In this case, a parameterized constructor is present but in the object creation, the parameter is not present to execute the parameterized constructor."},{"id":1468,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","Hello"],["b","World"],["c","Null"],["d","Compilation Error"]],"ans":"a","cod":["class Parameterised\n{\n    String str=\"Hello\";\n    Parameterised(String str)\n    {\n        System.out.println(this.str);\n    }\n    public static void main(String args[])\n    {\n        Parameterised obj1=new Parameterised(\"World\");\n    }\n}"],"exp":"A constructor is a member function of a class which initializes objects of a class. It is called during the object creation. As a parameterized constructor is present in the above program, the value is passed in the object creation and printed using the 'this' keyword."},{"id":1469,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","10 20"],["b","20 20"],["c","Null"],["d","Compilation"]],"ans":"a","cod":["class Add\n{\n    int  a;\n    int  b;\n    Add(int x, int y)\n    {\n        a = x;\n        a = a + 10;\n        b = y;\n        System.out.println(x+\" \"+y);\n    }\n    public static void main(String args[])\n    {\n        Add obj1 = new Add(10,20);\n    }\n}"],"exp":"Constructor is a special method that is used to initialize a newly created object and is called just after the memory is allocated for the object.\nThe values of x and y are given as 10 and 20 at the object creation itself and hence the values are printed successfully."},{"id":1470,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","8"],["b","10"],["c","0"],["d","Compilation Error"]],"ans":"b","cod":["class Parameterised2\n{\n    int num=8;\n    Parameterised2(int num)\n    {\n        this.num=num;\n        System.out.println(this.num);\n    }\n    public static void main(String args[])\n    {\n        Parameterised2 obj1=new Parameterised2(10);\n    }\n}"],"exp":"A constructor is a special method that is used to initialize an object. In the above block of code, a parameterized constructor is used to set the value of an instance variable at the object creation in the main() method. 'this' keyword is used to refer to the instance variable."},{"id":1471,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","40"],["b","80"],["c","Null"],["d","Compilation Error"]],"ans":"a","cod":["class Parameterised3\n{\n    int  num1;\n    int  num2;\n    Parameterised3(int y, int x)\n    {\n        num1 = x;\n        num2 = y;\n        System.out.println(num2);\n    }\n    public static void main(String args[])\n    {\n        Parameterised3 obj1 = new Parameterised3(40, 80);\n    }\n}"],"exp":"A constructor is a member function of a class which initializes objects of a class. Constructor is automatically called when object is created. A parameterized constructor is executed in the above block of code."},{"id":1472,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","10"],["b","Null"],["c","-1"],["d","Compilation Error"]],"ans":"a","cod":["class Parameter\n{\n    int num=10;\n    Parameter()\n    {\n        System.out.print(num+\" \");\n    }\n    Parameter(int num)\n    {\n        this.num = num;\n        System.out.print(num+\" \");\n    }\n    public static void main(String[] args)\n    {\n        Parameter obj = new Parameter();\n        System.out.println(obj.num);\n    }\n}"],"exp":"Constructor is a block of code that initializes the newly created object. It is a special method for creating and initializing an object created within a class. In this case, the parameterized constructor is not called as there is no value given in the main() method."},{"id":1473,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","Null"],["b","Compilation Error"],["c","0"],["d","Garbage Value"]],"ans":"b","cod":["class ConstructorCall\n{\n    int x, y;\n    public ConstructorCall(int x, int y)\n    {\n        this.x = x;\n        this.y = y;\n        System.out.println(x);\n    }\n    public static void main(String args[])\n    {\n        ConstructorCall p = new ConstructorCall();\n    }\n}"],"exp":"The main function calls the paramater-less constructor, but there is only one constructor defined in class which takes two parameters. Hence, the parameterized constructor is not executed and since there is no default constructor, the compiler throws an error."},{"id":1474,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","5"],["b","0"],["c","Garbage Value"],["d","Compilation Error"]],"ans":"d","cod":["class NoArgs\n{\n    private int data;\n    private NoArgs()\n    {\n        data = 5;\n    }\n}\npublic class NoArgsCall\n{\n    public static void main(String[] args)\n    {\n        NoArgs obj = new NoArgs();\n        System.out.println(obj.data);\n    }\n}"],"exp":"Default constructor is a constructor that is automatically generated by the compiler when the object is created. It is a constructor which can be called with no arguments. Since NoArgs() Constructor has private access, it cannot be accessed outside the NoArgs class."},{"id":1475,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","false"],["b","true"],["c","0"],["d","1"]],"ans":"a","cod":["class DefaultConstructor\n{\n    boolean ch;\n    public static void main(String[] args)\n    {\n        DefaultConstructor obj = new DefaultConstructor();\n        System.out.println(obj.ch);\n\n    }\n}"],"exp":"Since there is no constructor in the above code, the Java compiler will automatically create a no-argument constructor during run-time. This constructor is known as the default constructor. The default constructor initializes all instance variables with default values. Boolean datatype has a default value of 'false'."},{"id":1476,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","BD"],["b","DB"],["c","Compilation Error"],["d","BDB"]],"ans":"a","cod":["class Derived extends Base\n{\n    Derived()\n    {\n        System.out.print(\"D\");\n    }\n}\nclass Base\n{\n    Base()\n    {\n        System.out.print(\"B\");\n    }\n}\nclass MainMethod\n{\n    public static void main(String[] args)\n    {\n        Derived obj1=new Derived();\n    }\n}"],"exp":"When a subclass constructor is called, default constructors of the superclass are called first and then the subclass constructor. Here when Derived is called, the superclass constructor, that is Base will be called first and then Derived will be called."},{"id":1477,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","B"],["b","D"],["c","BD"],["d","Compilation Error"]],"ans":"a","cod":["class Derived extends Base\n{\n    Derived()\n    {\n        System.out.print(\"D\");\n    }\n}\nclass Base\n{\n    Base()\n    {\n        System.out.print(\"B\");\n    }\n}\nclass FunctionCall\n{\n    public static void main(String[] args)\n    {\n        Base obj1=new Base();\n    }\n}"],"exp":"A programmer-defined constructor that takes no parameters is called a default constructor. In the above block of code, subclass constructor Base() is called using the Base object and hence only the subclass constructor would be executed."},{"id":1478,"cat":"OOP using Java","topic":"Types of Constructors","q":"What is the output of the following Java code?","opts":[["a","Null 0f"],["b","Null 0.0"],["c","-1 0.0f"],["d","-1 0.0"]],"ans":"b","cod":["class Default\n{\n    Default d;\n    float f;\n}\nclass InstanceVariables\n{\n    public static void main(String args[])\n    {\n        Default obj = new Default();\n        System.out.print(obj.d+\" \");\n        System.out.println(obj.f);\n    }\n}"],"exp":"The default constructor initializes all instance variables with default values. Float datatype has a default value of 0.0 while all objects of parent class have a value of 'null' unless they are initialized."},{"id":1479,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Base"],["b","Compilation Error"],["c","Derived"],["d","Runtime Error"]],"ans":"c","cod":["public class Inheritance\n{\n    public static void main(String[] args)\n    {\n        Super i = new Super();\n        i.show();\n    }\n}\nclass Super\n{\n    public void show()\n    {\n       System.out.println(\"Base\");\n    }\n}\n class Sub extends Super\n{\n    public void show()\n    {\n       System.out.println(\"Derived\");\n    }\n}"],"exp":"The object 'i' is an object of the class Sub, which inherits the properties of the class Super. When the show() function is called, it refers to the show() function of the derived class as mentioned in the main() method in the above block of code."},{"id":1480,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Base"],["b","Compilation Error"],["c","Derived"],["d","Runtime Error"]],"ans":"a","cod":["class Base\n{\n    public void show()\n    {\n       System.out.println(\"Base\");\n    }\n}\nclass Derived extends Base\n{\n    public void show()\n    {\n       System.out.println(\"Derived\");\n    }\n}\n  public class Inheritance1\n{\n    public static void main(String[] args)\n    {\n        Base i = new Base();\n        i.show();\n    }\n}"],"exp":"The object 'i' is an object of the class Base. Although the class Derived inherits the properties of Base, in order to call the show function of the Derived class, it is necessary to create an object of the derived class."},{"id":1481,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"b","cod":["class Base\n{\n    int a = 30;\n    public void display()\n    {\n        System.out.println(a);\n        System.out.println(\"Base\");\n    }\n}\nclass Derived extends Base\n{\n    public void display()\n    {\n        System.out.println(a);\n        System.out.println(\"Derived\");\n    }\n}\npublic class InheritCall\n{\n    public static void main(String[] args)\n    {\n        Base b = new Derived();\n        b.display();\n    }\n}"],"exp":"The object 'b' is an object of the class Derived, which in turn inherits the properties of Base. The display() function of the Derived class is called using the object and the value of 'a' is accessed from the Base class."},{"id":1482,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Base"],["b","Compilation Error"],["c","Derived class"],["d","Runtime Error"]],"ans":"a","cod":["public class Inherit1\n{\n    public static void main(String[] args)\n    {\n        Base b = new Derived();\n        b.print();\n    }\n}\nclass Base\n{\n    public static void print()\n    {\n        System.out.println(\"Base\");\n    }\n}\nclass Derived extends Base\n{\n    public static void print()\n    {\n        System.out.println(\"Derived class\");\n    }\n}"],"exp":"The function print() is static in both the Base and Derived classes. As it is known that static functions do not allow runtime polymorphism, only the Base class print function is called and the string "Base" is printed."},{"id":1483,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"c","cod":["class Base\n{\n    public static void display()\n    {\n        System.out.println(\"Base\");\n    }\n}\nclass Derived extends Base\n{\n    public static void display()\n    {\n        System.out.println(\"Derived\");\n    }\n}\nclass Inheritance2\n{\n    public static void main(String[] args)\n    {\n        Base x = new Base();\n        Base y = new Derived();\n        Derived z = new Derived();\n        x.display();\n        y.display();\n        z.display();\n    }\n}"],"exp":"Although the object 'y' is an object of the derived class, it is of the Base class type. As all the display functions are all static, runtime polymorphism doesn't take place, hence the object 'y' calls the display() function of the base class."},{"id":1484,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"d","cod":["class A\n{\n    public void Print()\n    {\n        System.out.println(\"A\");\n    }\n}\nclass B extends A\n{\n    public void Print()\n    {\n        System.out.println(\"B\");\n    }\n}\nclass C extends B\n{\n    public void Print()\n    {\n        super.super.Print();\n        System.out.println(\"C\");\n    }\n}\npublic class ExtendsCall\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.Print();\n    }\n}"],"exp":"The super keyword is used to refer to the parent class of the derived class, but it cannot be used more than once in the same statement in order to call the parent of the parent class as this is not possible in Java."},{"id":1485,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["class A\n{\n    public void Print()\n    {\n        System.out.println(\"A\");\n    }\n}\nclass B extends A\n{\n    public void Print()\n    {\n        super.Print();\n        System.out.println(\"B\");\n    }\n}\nclass C extends B\n{\n    public void Print()\n    {\n        super.Print();\n        System.out.println(\"C\");\n    }\n}\npublic class ExtendsCall1\n{\n    public static void main(String[] args)\n    {\n        C c = new C();\n        c.Print();\n    }\n}"],"exp":"The super keyword is used to refer to the immediate parent of the class it is called in. Here the super keyword in the class C refers to class B, and that in class B refers to class A. The super keyword is followed by the print() function, hence it calls the respective print functions of their parent classes."},{"id":1486,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","20"],["b","30"],["c","2000"],["d","6000"]],"ans":"d","cod":["class A\n{\n    int a = 10;\n}\nclass B extends A\n{\n    int b = 20;\n}\nclass C extends B\n{\n    int c = 30;\n}\nclass D extends C\n{\n    public void calculate()\n    {\n        System.out.println(a*b*c);\n    }\n}\npublic class Multilevel\n{\n    public static void main(String[] args)\n    {\n        D d = new D();\n        d.calculate();\n    }\n}"],"exp":"This code is an example of multilevel inheritance where class B inherits class A, class C inherits class B and class D inherits class C. The values 'a', 'b' and 'c' are inherited to D through this multilevel inheritance and hence when calculate is called, it uses all the values of the three classes."},{"id":1487,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","200"],["b","6000"],["c","0"],["d","600"]],"ans":"c","cod":["class A\n{\n    int a = 10;\n}\nclass B extends A\n{\n    int b = 20;\n}\nclass C extends B\n{\n    int c = 30;\n}\nclass D extends C\n{\n    int c;\n    public void calculate()\n    {\n        System.out.println(a*b*c);\n    }\n}\npublic class Default\n{\n    public static void main(String[] args)\n    {\n        D d = new D();\n        d.calculate();\n    }\n}"],"exp":"When the object 'd' is created, the value of the variable 'c' of the class D is set to 0 by default. Although all the values are achieved by inheritance, the value of 'c' is still 0 because it presents in class D."},{"id":1488,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","20"],["b","30"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["class A\n{\n    int a = 10;\n}\nclass B extends A\n{\n    int b = 20;\n}\nclass C extends A\n{\n    int b = 30;\n}\nclass D extends B,C\n{\n    void disp()\n    {\n        System.out.println(b);\n    }\n}\npublic class Display\n{\n    public static void main(String[] args)\n    {\n        D d = new D();\n        d.calculate();\n    }\n}"],"exp":"Java doesn't support the concept of multiple inheritance in object oriented programming as it leads to confusion as to which value of 'b' to refer to in this program. Hence it results in a compilation error."},{"id":1489,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","n"],["c","a"],["d","f"]],"ans":"d","cod":["class A\n{\n    String s = \"Sanfoundry\";\n}\nclass B extends A\n{\n    void position(int a)\n    {\n        System.out.println(s.charAt(a));\n    }\n}\npublic class Position\n{\n    public static void main(String[] args)\n    {\n       B b = new B();\n       b.position(3);\n    }\n}"],"exp":"The object b is an object of the class B, which extends class A, thus inheriting it's string variable 's'. The charAt function returns the character at the specified index in the string calling it. As indexing starts at 0, the nth position is the (n-1)th index."},{"id":1490,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","e"],["b","Compilation Error"],["c","E"],["d","Runtime Error"]],"ans":"c","cod":["class A\n{\n    int a = 69;\n}\nclass B extends A\n{\n    void ascii()\n    {\n        System.out.println((char)a);\n    }\n}\npublic class Ascii\n{\n    public static void main(String[] args)\n    {\n       B b = new B();\n       b.ascii();\n    }\n}"],"exp":"The object 'b' is an object of the class B, which extends class A, hence inheriting the value of the integer variable 'a'. When an integer is converted to a character, it is converted based on it's ascii value. The ascii value of 'e' is 101, and that of 'E' is 69."},{"id":1491,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","f"],["b","Compilation Error"],["c","F"],["d","Runtime Error"]],"ans":"a","cod":["class A\n{\n    char ch = 'f';\n}\nclass B extends A\n{\n    void ascii()\n    {\n        System.out.println((int)ch);\n    }\n}\npublic class AsciiValue\n{\n    public static void main(String[] args)\n    {\n       B b = new B();\n       b.ascii();\n    }\n}"],"exp":"The object 'b' is an object of the class B, which extends class A, hence inheriting the value of the character variable ch. When a character is converted to an integer, it is converted based on it's ascii value. The ascii value of 'f' is 102, and that of 'F' is 70."},{"id":1492,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","50, 100"],["b","100, 50"],["c","B@2a139a55"],["d","A$B@2a139a55"]],"ans":"c","cod":["class A\n{\n    int a = 50;\n}\nclass B extends A\n{\n    int a = 100;\n}\npublic class PrintObject\n{\n    public static void main(String[] args)\n    {\n       A b = new B();\n       System.out.println(b);\n    }\n}"],"exp":"The object 'b' is an object of the class B, which extends class A. When an object is printed, it is printed in the format ClassName@HashCode. Although class B extends class A, it is not a subclass of it, hence it is an object of only class B."},{"id":1493,"cat":"OOP using Java","topic":"Types of Inheritance","q":"What will be the output of the following Java code?","opts":[["a","3"],["b","2"],["c","6"],["d","7"]],"ans":"b","cod":["class A\n{\n    String s
