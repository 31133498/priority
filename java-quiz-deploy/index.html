ns when two or more threads need access to a shared resource."],["b","Its a process by which many thread are able to access same shared resource simultaneously."],["c","Its a process by which a method is able to access many different threads simultaneously."],["d","Its a method that allow to many threads to access any information require."]],"ans":"a","exp":"When two or more threads need to access the same shared resource, they need some way to ensure that the resource will be used by only one thread at a time, the process by which this is achieved is called synchronization"},{"id":304,"cat":"Core Java","topic":"Creating Threads","q":"What is the output of this program?","opts":[["a","My Thread"],["b","Thread[My Thread,5,main]"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"b","cod":["    class newthread extends Thread {\n\tnewthread() {\n\t    super(\"My Thread\");\n\t    start();\n\t}\n\tpublic void run() {\n\t    System.out.println(this);\n\t}\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"Although we have not created any object of thread class still we can make a thread pointing to main method, we can refer it by using this.\n$ javac multithreaded_programing.java\n$ java multithreaded_programing\nThread[My Thread,5,main]"},{"id":305,"cat":"Core Java","topic":"Creating Threads","q":"What is the output of this program?","opts":[["a","My Thread"],["b","Thread[My Thread,5,main]"],["c","Exception"],["d","Runtime Error"]],"ans":"d","cod":["    class newthread extends Thread {\n\tThread t;\n\tnewthread() {\n\t    t = new Thread(this,\"My Thread\");\n\t    t.start();\n\t}\n\tpublic void run() {\n            try {\n                t.join()\n\t        System.out.println(t.getName());\n            }\n            catch(Exception e) {\n            System.out.print(\"Exception\");\n            }\n\t}\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"join() method of Thread class waits for thread being called to finish or terminate, but here we have no condition which can terminate the thread, hence code 't.join()' leads to runtime error and nothing will be printed on the screen.\n$ javac multithreaded_programing.java\n$ java multithreaded_programing"},{"id":306,"cat":"Core Java","topic":"Creating Threads","q":"What is the output of this program?","opts":[["a","0"],["b","1"],["c","true"],["d","false"]],"ans":"c","cod":["    class newthread extends Thread {\n\tThread t;\n\tnewthread() {\n\t    t = new Thread(this,\"New Thread\");\n\t    t.start();\n\t}\n\tpublic void run() {\n\t   System.out.println(t.isAlive());\n\t}\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"isAlive() method is used to check whether the thread being called is running or not, here thread is the main() method which is running till the program is terminated hence it returns true.\n$ javac multithreaded_programing.java\n$ java multithreaded_programing\ntrue"},{"id":307,"cat":"Core Java","topic":"Creating Threads","q":"What is the output of this program?","opts":[["a","true"],["b","false"],["c","truetrue"],["d","falsefalse"]],"ans":"d","cod":["    class newthread extends Thread {\n\tThread t1,t2;\n\tnewthread() {\n\t    t1 = new Thread(this,\"Thread_1\");\n\t    t2 = new Thread(this,\"Thread_2\");\n\t    t1.start();\n\t    t2.start();\n\t}\n\tpublic void run() {\n\t    t2.setPriority(Thread.MAX_PRIORITY);\n\t    System.out.print(t1.equals(t2));\n        }\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"This program was previously done by using Runnable interface, here we have used Thread class. This shows both the method are equivalent, we can use any of them to create a thread.\n$ javac multithreaded_programing.java\n$ java multithreaded_programing\nfalsefalse"},{"id":308,"cat":"Core Java","topic":"Data Structures-Enums","q":"What is the order of variables in Enum?","opts":[["a","Ascending order"],["b","Descending order"],["c","Random order"],["d","Depends on the order() method"]],"ans":"d","exp":"The order of appearance of variables in Enum is their natural order (the natural order means the order in which they are declared inside Enum type). However, the compareTo() method is implemented to order the variable in ascending order."},{"id":309,"cat":"Core Java","topic":"Data Structures-Enums","q":"Can we create an instance of Enum outside of Enum itself?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"No, instances of Enum cannot be created outside of Enum boundary, because Enum does not have a public constructor."},{"id":310,"cat":"Core Java","topic":"Data Structures-Enums","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","1"],["c","2"],["d","3"]],"ans":"a","cod":["    enum Season\n    {\n        WINTER, SPRING, SUMMER, FALL\n    };\n    System.out.println(Season.WINTER.ordinal());"],"exp":"ordinal() method provides number to the variables defined in Enum."},{"id":311,"cat":"Core Java","topic":"Data Structures-Enums","q":"If we try to add Enum constants to a TreeSet, what sorting order will it use?","opts":[["a","Sorted in the order of declaration of Enums"],["b","Sorted in alphabetical order of Enums"],["c","Sorted based on order() method"],["d","Sorted in descending order of names of Enums"]],"ans":"a","exp":"Tree Set will sort the values in the order in which Enum constants are declared."},{"id":312,"cat":"Core Java","topic":"Data Structures-Enums","q":"What will be the output of the following Java code snippet?","opts":[["a","Runtime Error"],["b","Compilation Error"],["c","It runs successfully"],["d","EnumNotDefined Exception"]],"ans":"b","cod":["class A\n{\n\n}\n\nenum Enums extends A\n{\n    ABC, BCD, CDE, DEF;\n}"],"exp":"Enum types cannot extend class."},{"id":313,"cat":"Core Java","topic":"Data Structures-Enums","q":"What will be the output of the following Java code snippet?","opts":[["a","Runtime Error"],["b","EnumNotDefined Exception"],["c","It runs successfully"],["d","Compilation Error"]],"ans":"d","cod":[" enum Levels\n{\n    private TOP,\n\n    public MEDIUM,\n\n    protected BOTTOM;\n}"],"exp":"Enum cannot have any modifiers. They are public, static and final by default."},{"id":314,"cat":"Core Java","topic":"Data Structures-Enums","q":"What will be the output of the following Java code snippet?","opts":[["a",""],["b","Compilation Error"],["c",""],["d","Runtime Exception"]],"ans":"a","cod":["enum Enums\n{\n    A, B, C;\n\n    private Enums()\n    {\n        System.out.println(10);\n    }\n}\n\npublic class MainClass\n{\n    public static void main(String[] args)\n    {\n        Enum en = Enums.B;\n    }\n}"],"exp":"The constructor of Enums is called which prints 10."},{"id":315,"cat":"Core Java","topic":"Data Structures-Enums","q":"Which method returns the elements of Enum class?","opts":[["a","getEnums()"],["b","getEnumConstants()"],["c","getEnumList()"],["d","getEnum()"]],"ans":"b","exp":"getEnumConstants() returns the elements of this enum class or null if this Class object does not represent an enum type."},{"id":316,"cat":"Core Java","topic":"Data Structures-Enums","q":"Which class does all the Enums extend?","opts":[["a","Object"],["b","Enums"],["c","Enum"],["d","EnumClass"]],"ans":"c","exp":"All enums implicitly extend java.lang.Enum. Since Java does not support multiple inheritance, an enum cannot extend anything else."},{"id":317,"cat":"Core Java","topic":"Data Structures-Enums","q":"Are enums are type-safe?","opts":[["a","True"],["b","False"]],"ans":"a","exp":"Enums are type-safe as they have own name-space."},{"id":318,"cat":"Core Java","topic":"Data Structures-HashMap","q":"Map implements collection interface?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"Collection interface provides add, remove, search or iterate while map has clear, get, put, remove, etc."},{"id":319,"cat":"Core Java","topic":"Data Structures-HashMap","q":"Which of the below does not implement Map interface?","opts":[["a","HashMap"],["b","Hashtable"],["c","EnumMap"],["d","Vector"]],"ans":"d","exp":"Vector implements AbstractList which internally implements Collection. Others come from implementing the Map interface."},{"id":320,"cat":"Core Java","topic":"Data Structures-HashMap","q":"What is the premise of equality for IdentityHashMap?","opts":[["a","Reference equality"],["b","Name equality"],["c","Hashcode equality"],["d","Length equality"]],"ans":"a","exp":"IdentityHashMap is rarely used as it violates the basic contract of implementing equals() and hashcode() method."},{"id":321,"cat":"Core Java","topic":"Data Structures-HashMap","q":"What happens if we put a key object in a HashMap which exists?","opts":[["a","The new object replaces the older object"],["b","The new object is discarded"],["c","The old object is removed from the map"],["d","It throws an exception as the key already exists in the map"]],"ans":"a","exp":"HashMap always contains unique keys. If same key is inserted again, the new object replaces the previous object."},{"id":322,"cat":"Core Java","topic":"Data Structures-HashMap","q":"While finding the correct location for saving key value pair, how many times the key is hashed?","opts":[["a","1"],["b","2"],["c","3"],["d","unlimited till bucket is found"]],"ans":"b","exp":"The key is hashed twice; first by hashCode() of Object class and then by internal hashing method of HashMap class."},{"id":323,"cat":"Core Java","topic":"Data Structures-HashMap","q":"Is hashmap an ordered collection.","opts":[["a","True"],["b","False"]],"ans":"b","exp":"Hashmap outputs in the order of hashcode of the keys. So it is unordered but will always have same result for same set of keys."},{"id":324,"cat":"Core Java","topic":"Data Structures-HashMap","q":"If two threads access the same hashmap at the same time, what would happen?","opts":[["a","ConcurrentModificationException"],["b","NullPointerException"],["c","ClassNotFoundException"],["d","RuntimeException"]],"ans":"a","exp":"The code will throw ConcurrentModificationException if two threads access the same hashmap at the same time."},{"id":325,"cat":"Core Java","topic":"Data Structures-HashMap","q":"How to externally synchronize hashmap?","opts":[["a","HashMap.synchronize(HashMap a);"],["b",""],["c","Collections.synchronizedMap(new HashMap<String, String>());"],["d","Collections.synchronize(new HashMap<String, String>());"]],"ans":"c","exp":"Collections.synchronizedMap() synchronizes entire map. ConcurrentHashMap provides thread safety without synchronizing entire map."},{"id":326,"cat":"Core Java","topic":"Data Structures-HashMap","q":"What will be the output of the following Java code snippet?","opts":[["a","{1=null, 2=null, 3=null, 4=null, 5=null}"],["b","{5=null}"],["c","Exception is thrown"],["d","{1=null, 5=null, 3=null, 2=null, 4=null}"]],"ans":"a","cod":["public class Demo\n{\n  public static void main(String[] args)\n  {\n\t\tMap<Integer, Object> sampleMap = new TreeMap<Integer, Object>();\n\t\tsampleMap.put(1, null);\n\t\tsampleMap.put(5, null);\n\t\tsampleMap.put(3, null);\n\t\tsampleMap.put(2, null);\n\t\tsampleMap.put(4, null);\n\n       System.out.println(sampleMap);\n   }\n}"],"exp":"HashMap needs unique keys. TreeMap sorts the keys while storing objects."},{"id":327,"cat":"Core Java","topic":"Data Structures-HashMap","q":"If large number of items are stored in hash bucket, what happens to the internal structure?","opts":[["a","The bucket will switch from LinkedList to BalancedTree"],["b","The bucket will increase its size by a factor of load size defined"],["c","The LinkedList will be replaced by another hashmap"],["d","Any further addition throws Overflow exception"]],"ans":"a","exp":"BalancedTree will improve performance from O(n) to O(log n) by reducing hash collisions."},{"id":328,"cat":"Core Java","topic":"Data Structures-List","q":"How can we remove an object from ArrayList?","opts":[["a","remove() method"],["b","using Iterator"],["c","remove() method and using Iterator"],["d","delete() method"]],"ans":"c","exp":"There are 2 ways to remove an object from ArrayList. We can use overloaded method remove(int index) or remove(Object obj). We can also use an Iterator to remove the object."},{"id":329,"cat":"Core Java","topic":"Data Structures-List","q":"How to remove duplicates from List?","opts":[["a","HashSet<String> listToSet = new HashSet<String>(duplicateList);"],["b","HashSet<String> listToSet = duplicateList.toSet();"],["c","HashSet<String> listToSet = Collections.convertToSet(duplicateList);"],["d","HashSet<String> listToSet = duplicateList.getSet();"]],"ans":"a","exp":"Duplicate elements are allowed in List. Set contains unique objects."},{"id":330,"cat":"Core Java","topic":"Data Structures-List","q":"How to sort elements of ArrayList?","opts":[["a","Collection.sort(listObj);"],["b","Collections.sort(listObj);"],["c","listObj.sort();"],["d","Sorter.sortAsc(listObj);"]],"ans":"b","exp":"Collections provides a method to sort the list. The order of sorting can be defined using Comparator."},{"id":331,"cat":"Core Java","topic":"Data Structures-List","q":"When two threads access the same ArrayList object what is the outcome of the program?","opts":[["a","Both are able to access the object"],["b","ConcurrentModificationException is thrown"],["c","One thread is able to access the object and second thread gets Null Pointer exception"],["d","One thread is able to access the object and second thread will wait till control is passed to the second one"]],"ans":"b","exp":"ArrayList is not synchronized. Vector is the synchronized data structure."},{"id":332,"cat":"Core Java","topic":"Data Structures-List","q":"How is Arrays.asList() different than the standard way of initialising List?","opts":[["a","Both are same"],["b","Arrays.asList() throws compilation error"],["c","Arrays.asList() returns a fixed length list and doesn't allow to add or remove elements"],["d","We cannot access the list returned using Arrays.asList()"]],"ans":"c","exp":"List returned by Arrays.asList() is a fixed length list which doesn't allow us to add or remove element from it.add() and remove() method will throw UnSupportedOperationException if used."},{"id":333,"cat":"Core Java","topic":"Data Structures-List","q":"What is the difference between length() and size() of ArrayList?","opts":[["a","length() and size() return the same value"],["b","length() is not defined in ArrayList"],["c","size() is not defined in ArrayList"],["d","length() returns the capacity of ArrayList and size() returns the actual number of elements stored in the list"]],"ans":"d","exp":"length() returns the capacity of ArrayList and size() returns the actual number of elements stored in the list which is always less than or equal to capacity."},{"id":334,"cat":"Core Java","topic":"Data Structures-List","q":"Which class provides thread safe implementation of List?","opts":[["a","ArrayList"],["b","CopyOnWriteArrayList"],["c","HashList"],["d","List"]],"ans":"b","exp":"CopyOnWriteArrayList is a concurrent collection class. Its very efficient if ArrayList is mostly used for reading purpose because it allows multiple threads to read data without locking, which was not possible with synchronized ArrayList."},{"id":335,"cat":"Core Java","topic":"Data Structures-List","q":"Which of the below is not an implementation of List interface?","opts":[["a","RoleUnresolvedList"],["b","Stack"],["c","AttibuteList"],["d","SessionList"]],"ans":"d","exp":"SessionList is not an implementation of List interface. The others are concrete classes of List."},{"id":336,"cat":"Core Java","topic":"Data Structures-List","q":"What is the worst case complexity of accessing an element in ArrayList?","opts":[["a","O(n)"],["b","O(1)"],["c","O(nlogn)"],["d","O(2)"]],"ans":"b","exp":"ArrayList has O(1) complexity for accessing an element in ArrayList. O(n) is the complexity for accessing an element from LinkedList."},{"id":337,"cat":"Core Java","topic":"Data Structures-List","q":"When an array is passed to a method, will the content of the array undergo changes with the actions carried within the function?","opts":[["a","True"],["b","False"]],"ans":"a","exp":"If we make a copy of array before any changes to the array the content will not change. Else the content of the array will undergo changes."},{"id":338,"cat":"Core Java","topic":"Data Structures-Queue","q":"Which of the below is not a subinterface of Queue?","opts":[["a","BlockingQueue"],["b","BlockingEnque"],["c","TransferQueue"],["d","BlockingQueue"]],"ans":"b","exp":"BlockingQueue, TransferQueue and BlockingQueue are subinterfaces of Queue."},{"id":339,"cat":"Core Java","topic":"Data Structures-Queue","q":"What is the remaining capacity of BlockingQueue whose intrinsic capacity is not defined?","opts":[["a","Integer.MAX_VALUE"],["b","BigDecimal.MAX_VALUE"],["c","99999999"],["d","Integer.INFINITY"]],"ans":"a","exp":"A BlockingQueue without any intrinsic capacity constraints always reports a remaining capacity of Integer.MAX_VALUE."},{"id":340,"cat":"Core Java","topic":"Data Structures-Queue","q":"PriorityQueue is thread safe.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"PriorityQueue is not synchronized. BlockingPriorityQueue is the thread safe implementation."},{"id":341,"cat":"Core Java","topic":"Data Structures-Queue","q":"What is difference between dequeue() and peek() function of java?","opts":[["a","dequeue() and peek() remove and return the next time in line"],["b","dequeue() and peek() return the next item in line"],["c","dequeue() removes and returns the next item in line while peek() returns the next item in line"],["d","peek() removes and returns the next item in line while dequeue() returns the next item in line"]],"ans":"c","exp":"dequeue() removes the item next in line. peek() returns the item without removing it from the queue."},{"id":342,"cat":"Core Java","topic":"Data Structures-Queue","q":"What is the difference between Queue and Stack?","opts":[["a","Stack is LIFO; Queue is FIFO"],["b","Queue is LIFO; Stack is FIFO"],["c","Stack and Queue is FIFO"],["d","Stack and Queue is LIFO"]],"ans":"a","exp":"Stack is Last in First out (LIFO) and Queue is First in First out(FIFO)."},{"id":343,"cat":"Core Java","topic":"Data Structures-Queue","q":"What are the use of front and rear pointers in CircularQueue implementation?","opts":[["a","Front pointer points to first element; rear pointer points to the last element"],["b","Rear pointer points to first element; front pointer points to the last element"],["c","Front and read pointers point to the first element"],["d","Front pointer points to the first element; rear pointer points to null object"]],"ans":"c","exp":"CircularQueue implementation is an abstract class where first and rear pointer point to the same object."},{"id":344,"cat":"Core Java","topic":"Data Structures-Queue","q":"What is the correct method used to insert and delete items from the queue?","opts":[["a","push and pop"],["b","enqueue and dequeue"],["c","enqueue and peek"],["d","add and remove"]],"ans":"b","exp":"enqueue is pushing item into queue; dequeue is removing item from queue; peek returns object without removing it from queue.\nStack uses push and pop methods. add and remove are used in the list."},{"id":345,"cat":"Core Java","topic":"Data Structures-Queue","q":"Which data structure is used in Breadth First Traversal of a graph?","opts":[["a","Stack"],["b","Queue"],["c","Array"],["d","Tree"]],"ans":"b","exp":"In Breadth First Traversal of graph the nodes at the same level are accessed in the order of retrieval (i.e FIFO)."},{"id":346,"cat":"Core Java","topic":"Data Structures-Queue","q":"Where does a new element be inserted in linked list implementation of a queue?","opts":[["a","Head of list"],["b","Tail of list"],["c","At the centre of list"],["d","All the old entries are pushed and then the new element is inserted"]],"ans":"b","exp":"To maintain FIFO, newer elements are inserted to the tail of the list."},{"id":347,"cat":"Core Java","topic":"Data Structures-Queue","q":"If the size of the array used to implement a circular queue is MAX_SIZE. How rear moves to traverse inorder to insert an element in the queue?","opts":[["a","rear=(rear%1)+MAX_SIZE"],["b","rear=(rear+1)%MAX_SIZE"],["c","rear=rear+(1%MAX_SIZE)"],["d","rear=rear%(MAX_SIZE+1)"]],"ans":"b","exp":"The front and rear pointer od circular queue point to the first element."},{"id":348,"cat":"Core Java","topic":"Data Structures-Set","q":"What is the default clone of HashSet?","opts":[["a","Deep clone"],["b","Shallow clone"],["c","Plain clone"],["d","Hollow clone"]],"ans":"b","exp":"Default clone() method uses shallow copy. The internal elements are not cloned. A shallow copy only copies the reference object."},{"id":349,"cat":"Core Java","topic":"Data Structures-Set","q":"Do we have get(Object o) method in HashSet.","opts":[["a","True"],["b","False"]],"ans":"b","exp":"get(Object o) method is useful when we want to compare objects based on the comparison of values. HashSet does not provide any way to compare objects. It just guarantees unique objects stored in the collection."},{"id":350,"cat":"Core Java","topic":"Data Structures-Set","q":"What does Collections.emptySet() return?","opts":[["a","Immutable Set"],["b","Mutable Set"],["c","The type of Set depends on the parameter passed to the emptySet() method"],["d","Null object"]],"ans":"a","exp":"Immutable Set is useful in multithreaded environment. One does not need to declare generic type collection. It is inferred by the context of method call."},{"id":351,"cat":"Core Java","topic":"Data Structures-Set","q":"What are the initial capacity and load factor of HashSet?","opts":[["a","10, 1.0"],["b","32, 0.75"],["c","16, 0.75"],["d","32, 1.0"]],"ans":"c","exp":"We should not set the initial capacity too high and load factor too low if iteration performance is needed."},{"id":352,"cat":"Core Java","topic":"Data Structures-Set","q":"What is the relation between hashset and hashmap?","opts":[["a","HashSet internally implements HashMap"],["b","HashMap internally implements HashSet"],["c","HashMap is the interface; HashSet is the concrete class"],["d","HashSet is the interface; HashMap is the concrete class"]],"ans":"a","exp":"HashSet is implemented to provide uniqueness feature which is not provided by HashMap. This also reduces code duplication and provides the memory efficient behavior of HashMap."},{"id":353,"cat":"Core Java","topic":"Data Structures-Set","q":"What will be the output of the following Java code snippet?","opts":[["a",""],["b","Test - 10"],["c","Runtime Exception"],["d","Compilation Failure"]],"ans":"a","cod":["public class Test\n{\n\tpublic static void main(String[] args)\n        {\n\t\tSet s = new HashSet();\n\t\ts.add(new Long(10));\n\t\ts.add(new Integer(10));\n\t\tfor(Object object : s)\n                {\n\t\t    System.out.println(\"test - \"+object);\n\t\t}\n\t}\n}"],"exp":"Integer and Long are two different data types and different objects. So they will be treated as unique elements and not overridden."},{"id":354,"cat":"Core Java","topic":"Data Structures-Set","q":"Set has contains(Object o) method.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"Set has contains(Object o) method instead of get(Object o) method as get is needed for comparing object and getting corresponding value."},{"id":355,"cat":"Core Java","topic":"Data Structures-Set","q":"What is the difference between TreeSet and SortedSet?","opts":[["a","TreeSet is more efficient than SortedSet"],["b","SortedSet is more efficient than TreeSet"],["c","TreeSet is an interface; SortedSet is a concrete class"],["d","SortedSet is an interface; TreeSet is a concrete class"]],"ans":"d","exp":"SortedSet is an interface. It maintains an ordered set of elements. TreeSet is an implementation of SortedSet."},{"id":356,"cat":"Core Java","topic":"Data Structures-Set","q":"What happens if two threads simultaneously modify TreeSet?","opts":[["a","ConcurrentModificationException is thrown"],["b","Both threads can perform action successfully"],["c","FailFastException is thrown"],["d","IteratorModificationException is thrown"]],"ans":"a","exp":"TreeSet provides fail-fast iterator. Hence when concurrently modifying TreeSet it throws ConcurrentModificationException."},{"id":357,"cat":"Core Java","topic":"Data Structures-Set","q":"What is the unique feature of LinkedHashSet?","opts":[["a","It is not a valid class"],["b","It maintains the insertion order and guarantees uniqueness"],["c","It provides a way to store key values with uniqueness"],["d","The elements in the collection are linked to each other"]],"ans":"b","exp":"Set is a collection of unique elements.HashSet has the behavior of Set and stores key value pairs. The LinkedHashSet stores the key value pairs in the order of insertion."},{"id":358,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"How to format date from one form to another?","opts":[["a","SimpleDateFormat"],["b","DateFormat"],["c","SimpleFormat"],["d","DateConverter"]],"ans":"a","exp":"SimpleDateFormat can be used as"},{"id":359,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"How to convert Date object to String?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"b","exp":"SimpleDateFormat takes a string containing pattern. sdf.format converts the Date object to String."},{"id":360,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"How to convert a String to a Date object?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","exp":"SimpleDateFormat takes a string containing pattern. sdf.parse converts the String to Date object."},{"id":361,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"Is SimpleDateFormat thread safe?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"SimpleDateFormat is not thread safe. In the multithreaded environment, we need to manage threads explicitly."},{"id":362,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"How to identify if a timezone is eligible for DayLight Saving?","opts":[["a","useDaylightTime() of Time class"],["b","useDaylightTime() of Date class"],["c","useDaylightTime() of TimeZone class"],["d","useDaylightTime() of DateTime class"]],"ans":"c","exp":"public abstract boolean useDaylightTime() is provided in TimeZone class."},{"id":363,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"What is the replacement of joda time library in java 8?","opts":[["a","java.time (JSR-310)"],["b","java.date (JSR-310)"],["c","java.joda"],["d","java.jodaTime"]],"ans":"a","exp":"In java 8, we are asked to migrate to java.time (JSR-310) which is a core part of the JDK which replaces joda library project."},{"id":364,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"How is Date stored in database?","opts":[["a","java.sql.Date"],["b","java.util.Date"],["c","java.sql.DateTime"],["d","java.util.DateTime"]],"ans":"a","exp":"java.sql.Date is the datatype of Date stored in database."},{"id":365,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"What does LocalTime represent?","opts":[["a","Date without time"],["b","Time without Date"],["c","Date and Time"],["d","Date and Time with timezone"]],"ans":"b","exp":"LocalTime of joda library represents time without date."},{"id":366,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"How to get difference between two dates?","opts":[["a","long diffInMilli = java.time.Duration.between(dateTime1, dateTime2).toMillis();"],["b","long diffInMilli = java.time.difference(dateTime1, dateTime2).toMillis();"],["c","Date diffInMilli = java.time.Duration.between(dateTime1, dateTime2).toMillis();"],["d","Time diffInMilli = java.time.Duration.between(dateTime1, dateTime2).toMillis();"]],"ans":"a","exp":"Java 8 provides a method called between which provides Duration between two times."},{"id":367,"cat":"Core Java","topic":"Data Type - Date and TimeZone","q":"How to get UTC time?","opts":[["a","Time.getUTC();"],["b","Date.getUTC();"],["c","Instant.now();"],["d","TimeZone.getUTC();"]],"ans":"c","exp":"In java 8, Instant.now() provides current time in UTC/GMT."},{"id":368,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"Which of these class object uses key to store value?","opts":[["a","Dictionary"],["b","Map"],["c","Hashtable"],["d","All if the mentioned"]],"ans":"d","exp":"Dictionary, Map & Hashtable all implement Map interface hence all of them uses keys to store value in the object."},{"id":369,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"Which of these method is used to insert value and its key?","opts":[["a","put()"],["b","set()"],["c","insertElement()"],["d","addElement()"]],"ans":"a"},{"id":370,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"Which of these is the interface of legacy is implemented by Hashtable and Dictionary classes?","opts":[["a","Map"],["b","Enumeration"],["c","HashMap"],["d","Hashtable"]],"ans":"a","exp":"Dictionary, Map & Hashtable all implement Map interface hence all of them uses keys to store value in the object."},{"id":371,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"Which of these is a class which uses String as a key to store the value in object?","opts":[["a","Array"],["b","ArrayList"],["c","Dictionary"],["d","Properties"]],"ans":"d"},{"id":372,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"Which of these methods is used to retrieve the elements in properties object at specific location?","opts":[["a","get()"],["b","Elementat()"],["c","ElementAt()"],["d","getProperty()"]],"ans":"d"},{"id":373,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"What is the output of this program?","opts":[["a","0"],["b","1"],["c","true"],["d","false"]],"ans":"d","cod":["    import java.util.*;\n    class hashtable {\n        public static void main(String args[]) {\n            Hashtable obj = new Hashtable();\n            obj.put(\"A\", new Integer(3));\n            obj.put(\"B\", new Integer(2));\n            obj.put(\"C\", new Integer(8));\n            System.out.print(obj.contains(new Integer(5)));\n        }\n    }"],"exp":"Hashtable object obj contains values 3, 2, 8 when obj.contains(new Integer(5)) is executed it searches for 5 in the hashtable since it is not present false is returned.\n$ javac hashtable.java\n$ java hashtable\nfalse"},{"id":374,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"What is the output of this program?","opts":[["a","0"],["b","1"],["c","2"],["d","3"]],"ans":"a","cod":["    import java.util.*;\n    class hashtable {\n        public static void main(String args[]) {\n            Hashtable obj = new Hashtable();\n            obj.put(\"A\", new Integer(3));\n            obj.put(\"B\", new Integer(2));\n            obj.put(\"C\", new Integer(8));\n            obj.clear();\n            System.out.print(obj.size());\n        }\n    }"],"exp":"$ javac hashtable.java\n$ java hashtable\n0"},{"id":375,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"What is the output of this program?","opts":[["a","{C=8, B=2}"],["b","[C=8, B=2]"],["c","{A=3, C=8, B=2}"],["d","[A=3, C=8, B=2]"]],"ans":"a","cod":["    import java.util.*;\n    class hashtable {\n        public static void main(String args[]) {\n            Hashtable obj = new Hashtable();\n            obj.put(\"A\", new Integer(3));\n            obj.put(\"B\", new Integer(2));\n            obj.put(\"C\", new Integer(8));\n            obj.remove(new String(\"A\"));\n            System.out.print(obj);\n        }\n    }"],"exp":"$ javac hashtable.java\n$ java hashtable\n{C=8, B=2}"},{"id":376,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"What is the output of this program?","opts":[["a","{C=8, B=2}"],["b","[C=8, B=2]"],["c","{A=3, C=8, B=2}"],["d","[A=3, C=8, B=2]"]],"ans":"c","cod":["    import java.util.*;\n    class hashtable {\n        public static void main(String args[]) {\n            Hashtable obj = new Hashtable();\n            obj.put(\"A\", new Integer(3));\n            obj.put(\"B\", new Integer(2));\n            obj.put(\"C\", new Integer(8));\n            System.out.print(obj.toString());\n        }\n    }"],"exp":"obj.toString returns String equivalent of the hashtable, which can also be obtained by simply writing System.out.print(obj); as print system automatically coverts the obj to string equivalent.\n$ javac hashtable.java\n$ java hashtable\n{A=3, C=8, B=2}"},{"id":377,"cat":"Core Java","topic":"Dictionary, Hashtable & Properties Classes","q":"What is the output of this program?","opts":[["a","{AB, BC, CD}"],["b","[AB, BC, CD]"],["c","[3, 2, 8]"],["d","{3, 2, 8}"]],"ans":"b","cod":["    import java.util.*;\n    class properties {\n        public static void main(String args[]) {\n            Properties obj = new Properties();\n            obj.put(\"AB\", new Integer(3));\n            obj.put(\"BC\", new Integer(2));\n            obj.put(\"CD\", new Integer(8));\n            System.out.print(obj.keySet());\n        }\n    }"],"exp":"obj.keySet() returns a set containing all the keys used in properties object, here obj contains keys AB, BC, CD therefore obj.keySet() returns [AB, BC, CD].\n$ javac properties.java\n$ java properties\n[AB, BC, CD]"},{"id":378,"cat":"Core Java","topic":"Double & Float Wrappers","q":"Which of these is a super class of wrappers Double and Float?","opts":[["a","Long"],["b","Digits"],["c","Float"],["d","Number"]],"ans":"d","exp":"Number is an abstract class containing subclasses Double, Float, Byte, Short, Integer and Long."},{"id":379,"cat":"Core Java","topic":"Double & Float Wrappers","q":"Which of the following methods return the value as a double?","opts":[["a","doubleValue()"],["b","converDouble()"],["c","getDouble()"],["d","getDoubleValue()"]],"ans":"a"},{"id":380,"cat":"Core Java","topic":"Double & Float Wrappers","q":"Which of these methods can be used to check whether the given value is a number or not?","opts":[["a","isNaN()"],["b","isNumber()"],["c","checkNaN()"],["d","checkNumber()"]],"ans":"a","exp":"isNaN() methods returns true if num specified is not a number, otherwise it returns false."},{"id":381,"cat":"Core Java","topic":"Double & Float Wrappers","q":"Which of these method of Double wrapper can be used to check whether a given value is infinite or not?","opts":[["a","Infinite()"],["b","isInfinite()"],["c","checkInfinite()"],["d","None of the mentioned"]],"ans":"b","exp":"isInfinite() methods returns true if the specified value is an infinite value otherwise it returns false."},{"id":382,"cat":"Core Java","topic":"Double & Float Wrappers","q":"Which of these exceptions is thrown by compareTo() method defined in a double wrapper?","opts":[["a","IOException"],["b","SystemException"],["c","CastException"],["d","ClassCastException"]],"ans":"d","exp":"compareTo() methods compare the specified object to be double, if it is not then ClassCastException is thrown."},{"id":383,"cat":"Core Java","topic":"Double & Float Wrappers","q":"What will be the output of the following Java code?","opts":[["a","true"],["b","false"],["c","0"],["d","1"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            Double i = new Double(257.5);\n            boolean x = i.isNaN();\n            System.out.print(x);\n        }\n    }"],"exp":"i.isNaN() method returns returns true if i is not a number and false when i is a number. Here false is returned because i is a number i:e 257.5."},{"id":384,"cat":"Core Java","topic":"Double & Float Wrappers","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","1"],["c","256"],["d","257"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            Double i = new Double(257.578);\n            int x = i.intValue();\n            System.out.print(x);\n        }\n    }"],"exp":"i.intValue() method returns the value of wrapper i as a Integer. i is 257.578 is double number when converted to an integer data type its value is 257."},{"id":385,"cat":"Core Java","topic":"Double & Float Wrappers","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","257.0"],["c","257.57812"],["d","257.578123456789"]],"ans":"c","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n\t    Double i = new Double(257.578123456789);\n            float x = i.floatValue();\n            System.out.print(x);\n        }\n    }"],"exp":"floatValue() converts the value of wrapper i into float, since float can measure till 5 places after decimal hence 257.57812 is stored in floating point variable x."},{"id":386,"cat":"Core Java","topic":"Double & Float Wrappers","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","1"],["c","Exception"],["d","None of the mentioned"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            Double y = new Double(257.57812);\n\t    Double i = new Double(257.578123456789);\n            try\n            {\n\t        int x = i.compareTo(y);\n                System.out.print(x);\n            }\n            catch(ClassCastException e)\n            {\n                System.out.print(\"Exception\");\n            }\n\t}\n    }"],"exp":"i.compareTo() methods two double values, if they are equal then 0 is returned and if not equal then 1 is returned, here 257.57812 and 257.578123456789 are not equal hence 1 is returned and stored in x."},{"id":387,"cat":"Core Java","topic":"Environment Properties","q":"Which object Java application uses to create a new process?","opts":[["a","Process"],["b","Builder"],["c","ProcessBuilder"],["d","CreateBuilder"]],"ans":"c","exp":"Java application uses ProcessBuilder object to create a new process. By default, same set of environment variables passed which are set in application's virtual machine process."},{"id":388,"cat":"Core Java","topic":"Environment Properties","q":"Which of the following is true about Java system properties?","opts":[["a","Java system properties are accessible by any process"],["b","Java system properties are accessible by processes they are added to"],["c","Java system properties are retrieved by System.getenv()"],["d","Java system properties are set by System.setenv()"]],"ans":"b","exp":"Java system properties are only used and accessible by the processes they are added."},{"id":389,"cat":"Core Java","topic":"Environment Properties","q":"Java system properties can be set at runtime.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"Java system properties can be set at runtime using System.setProperty(name, value) or using System.getProperties().load() methods."},{"id":390,"cat":"Core Java","topic":"Environment Properties","q":"Which system property stores installation directory of JRE?","opts":[["a","user.home"],["b","java.class.path"],["c","java.home"],["d","user.dir"]],"ans":"c","exp":"java.home is the installation directory of Java Runtime Environment."},{"id":391,"cat":"Core Java","topic":"Environment Properties","q":"What does System.getProperty("variable") return?","opts":[["a","compilation error"],["b","value stored in variable"],["c","runtime error"],["d","null"]],"ans":"d","exp":"System.getProperty("variable") returns null value. Because, variable is not a property and if property does not exist, this method returns null value."},{"id":392,"cat":"Core Java","topic":"Environment Properties","q":"What is true about the setProperties method?","opts":[["a","setProperties method changes the set of Java Properties which are persistent"],["b","Changing the system properties within an application will affect future invocations"],["c","setProperties method changes the set of Java Properties which are not persistent"],["d","setProperties writes the values directly into the file which stores all the properties"]],"ans":"c","exp":"The changes made by the setProperties method are not persistent. Hence, it does not affect future invocation."},{"id":393,"cat":"Core Java","topic":"Environment Properties","q":"How to use environment properties in the class?","opts":[["a","@Environment"],["b","@Variable"],["c","@Property"],["d","@Autowired"]],"ans":"d"},{"id":394,"cat":"Core Java","topic":"Environment Properties","q":"How to assign values to variable using property?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","exp":"@Value are used to inject the properties and assign them to variables."},{"id":395,"cat":"Core Java","topic":"Environment Properties","q":"Which environment variable is used to set java path?","opts":[["a","JAVA"],["b","JAVA_HOME"],["c","CLASSPATH"],["d","MAVEN_HOME"]],"ans":"b","exp":"JAVA_HOME is used to store a path to the java installation."},{"id":396,"cat":"Core Java","topic":"Environment Properties","q":"How to read a classpath file?","opts":[["a","InputStream in = this.getClass().getResource("SomeTextFile.txt");"],["b","InputStream in = this.getClass().getResourceClasspath("SomeTextFile.txt");"],["c","InputStream in = this.getClass().getResourceAsStream("SomeTextFile.txt");"],["d","InputStream in = this.getClass().getResource("classpath:/SomeTextFile.txt");"]],"ans":"c","exp":"This method can be used to load files using relative path to the package of the class."},{"id":397,"cat":"Core Java","topic":"Event Handling","q":"Which of these packages contains all the classes and methods required for even handling in Java?","opts":[["a","java.applet"],["b","java.awt"],["c","java.event"],["d","java.awt.event"]],"ans":"d","exp":"Most of the event to which an applet response is generated by a user. Hence they are in Abstract Window Kit package, java.awt.event."},{"id":398,"cat":"Core Java","topic":"Event Handling","q":"What is an event in delegation event model used by Java programming language?","opts":[["a","An event is an object that describes a state change in a source"],["b","An event is an object that describes a state change in processing"],["c","An event is an object that describes any change by the user and system"],["d","An event is a class used for defining object, to create events"]],"ans":"a","exp":"An event is an object that describes a state change in a source."},{"id":399,"cat":"Core Java","topic":"Event Handling","q":"Which of these methods are used to register a keyboard event listener?","opts":[["a","KeyListener()"],["b","addKistener()"],["c","addKeyListener()"],["d","eventKeyboardListener()"]],"ans":"c"},{"id":400,"cat":"Core Java","topic":"Event Handling","q":"Which of these methods are used to register a mouse motion listener?","opts":[["a","addMouse()"],["b","addMouseListener()"],["c","addMouseMotionListner()"],["d","eventMouseMotionListener()"]],"ans":"c"},{"id":401,"cat":"Core Java","topic":"Event Handling","q":"What is a listener in context to event handling?","opts":[["a","A listener is a variable that is notified when an event occurs"],["b","A listener is a object that is notified when an event occurs"],["c","A listener is a method that is notified when an event occurs"],["d","None of the mentioned"]],"ans":"b","exp":"A listener is a object that is notified when an event occurs. It has two major requirements first, it must have been registered with one or more sources to receive notification about specific event types, and secondly it must implement methods to receive and process these notifications."},{"id":402,"cat":"Core Java","topic":"Event Handling","q":"Event class is defined in which of these libraries?","opts":[["a","java.io"],["b","java.lang"],["c","java.net"],["d","java.awt.event"]],"ans":"d","exp":"The Event class is part of the java.awt.event package, which provides various event classes for handling events in Java. Even though the Event class exists in Java, it is considered obsolete as of Java 1.1 due to the introduction of more specific and efficient event handling mechanisms."},{"id":403,"cat":"Core Java","topic":"Event Handling","q":"Which of these methods can be used to determine the type of event?","opts":[["a","getID()"],["b","getSource()"],["c","getEvent()"],["d","getEventObject()"]],"ans":"a","exp":"getID() can be used to determine the type of an event."},{"id":404,"cat":"Core Java","topic":"Event Handling","q":"Which of these class is super class of all the events?","opts":[["a","EventObject"],["b","EventClass"],["c","ActionEvent"],["d","ItemEvent"]],"ans":"a","exp":"EventObject class is a super class of all the events and is defined in java.util package."},{"id":405,"cat":"Core Java","topic":"Event Handling","q":"Which of these events will be notified if scroll bar is manipulated?","opts":[["a","ActionEvent"],["b","ComponentEvent"],["c","AdjustmentEvent"],["d","WindowEvent"]],"ans":"c","exp":"AdjustmentEvent is generated when a scroll bar is manipulated."},{"id":406,"cat":"Core Java","topic":"Event Handling","q":"Which of these events will be generated if we close an applet's window?","opts":[["a","ActionEvent"],["b","ComponentEvent"],["c","AdjustmentEvent"],["d","WindowEvent"]],"ans":"d","exp":"WindowEvent is generated when a window is activated, closed, deactivated, deiconfied, iconfied, opened or quit."},{"id":407,"cat":"Core Java","topic":"Event Listener Interfaces","q":"Which of these packages contains all the event handling interfaces?","opts":[["a","java.lang"],["b","java.awt"],["c","java.awt.event"],["d","java.event"]],"ans":"c"},{"id":408,"cat":"Core Java","topic":"Event Listener Interfaces","q":"Which of these interfaces handles the event when a component is added to a container?","opts":[["a","ComponentListener"],["b","ContainerListener"],["c","FocusListener"],["d","InputListener"]],"ans":"b","exp":"The ContainerListener defines methods to recognize when a component is added to or removed from a container."},{"id":409,"cat":"Core Java","topic":"Event Listener Interfaces","q":"Which of these interfaces define a method actionPerformed()?","opts":[["a","ComponentListener"],["b","ContainerListener"],["c","ActionListener"],["d","InputListener"]],"ans":"c","exp":"ActionListener defines the actionPerformed() method that is invoked when an adjustment event occurs."},{"id":410,"cat":"Core Java","topic":"Event Listener Interfaces","q":"Which of these interfaces define four methods?","opts":[["a","ComponentListener"],["b","ContainerListener"],["c","ActionListener"],["d","InputListener"]],"ans":"a","exp":"ComponentListener defines four methods componentResized(), componentMoved(), componentShown() and componentHidden()."},{"id":411,"cat":"Core Java","topic":"Event Listener Interfaces","q":"Which of these interfaces define a method itemStateChanged()?","opts":[["a","ComponentListener"],["b","ContainerListener"],["c","ActionListener"],["d","ItemListener"]],"ans":"d"},{"id":412,"cat":"Core Java","topic":"Event Listener Interfaces","q":"Which of these methods will respond when you click any button by mouse?","opts":[["a","mouseClicked()"],["b","mouseEntered()"],["c","mousePressed()"],["d","all of the mentioned"]],"ans":"d","exp":"when we click a button, first we enter the region of button hence mouseEntered() method responds then we press the button which leads to respond from mouseClicked() and mousePressed()."},{"id":413,"cat":"Core Java","topic":"Event Listener Interfaces","q":"Which of these methods will be invoked if a character is entered?","opts":[["a","keyPressed()"],["b","keyReleased()"],["c","keyTyped()"],["d","keyEntered()"]],"ans":"c"},{"id":414,"cat":"Core Java","topic":"Event Listener Interfaces","q":"Which of these methods is defined in MouseMotionAdapter class?","opts":[["a","mouseDragged()"],["b","mousePressed()"],["c","mouseReleased()"],["d","mouseClicked()"]],"ans":"a","exp":"The MouseMotionAdapter class defines 2 methods - mouseDragged() and mouseMoved."},{"id":415,"cat":"Core Java","topic":"Event Listener Interfaces","q":"Which of these is a superclass of all Adapter classes?","opts":[["a","Applet"],["b","ComponentEvent"],["c","Event"],["d","InputEvent"]],"ans":"a","exp":"All Adapter classes extend Applet class."},{"id":416,"cat":"Core Java","topic":"Exception Handling","q":"When does Exceptions in Java arises in code sequence?","opts":[["a","Run Time"],["b","Compilation Time"],["c","Can Occur Any Time"],["d","None of the mentioned"]],"ans":"a","exp":"Exceptions in Java are run-time errors."},{"id":417,"cat":"Core Java","topic":"Exception Handling","q":"Which of these keywords is not a part of exception handling?","opts":[["a","try"],["b","finally"],["c","thrown"],["d","catch"]],"ans":"c","exp":"Exceptional handling is managed via 5 keywords - try, catch, throws, throw and finally."},{"id":418,"cat":"Core Java","topic":"Exception Handling","q":"Which of these keywords must be used to monitor for exceptions?","opts":[["a","try"],["b","finally"],["c","throw"],["d","catch"]],"ans":"a"},{"id":419,"cat":"Core Java","topic":"Exception Handling","q":"Which of these keywords must be used to handle the exception thrown by try block in some rational manner?","opts":[["a","try"],["b","finally"],["c","throw"],["d","catch"]],"ans":"d","exp":"If an exception occurs within the try block, it is thrown and cached by catch block for processing."},{"id":420,"cat":"Core Java","topic":"Exception Handling","q":"Which of these keywords is used to manually throw an exception?","opts":[["a","try"],["b","finally"],["c","throw"],["d","catch"]],"ans":"c"},{"id":421,"cat":"Core Java","topic":"Exception Handling","q":"What will be the output of the following Java program?","opts":[["a","Hello"],["b","World"],["c","HelloWorld"],["d","Hello World"]],"ans":"b","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n            {\n                System.out.print(\"Hello\" + \" \" + 1 / 0);\n            }\n            catch(ArithmeticException e)\n            {\n        \tSystem.out.print(\"World\");\n            }\n        }\n    }"],"exp":"System.ou.print() function first converts the whole parameters into a string and then prints, before "Hello" goes to output stream 1 / 0 error is encountered which is cached by catch block printing just "World"."},{"id":422,"cat":"Core Java","topic":"Exception Handling","q":"What will be the output of the following Java program?","opts":[["a","A"],["b","B"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"b","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n           {\n                int a, b;\n                b = 0;\n                a = 5 / b;\n                System.out.print(\"A\");\n            }\n            catch(ArithmeticException e)\n            {\n        \tSystem.out.print(\"B\");\n            }\n        }\n    }"]},{"id":423,"cat":"Core Java","topic":"Exception Handling","q":"What will be the output of the following Java program?","opts":[["a","A"],["b","B"],["c","AC"],["d","BC"]],"ans":"d","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n            {\n                int a, b;\n                b = 0;\n                a = 5 / b;\n                System.out.print(\"A\");\n            }\n            catch(ArithmeticException e)\n            {\n        \tSystem.out.print(\"B\");\n            }\n            finally\n            {\n    \t        System.out.print(\"C\");\n            }\n        }\n    }"],"exp":"finally keyword is used to execute the code before try and catch block end."},{"id":424,"cat":"Core Java","topic":"Exception Handling","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","05"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n            {\n                int i, sum;\n                sum = 10;\n                for (i = -1; i < 3 ;++i)\n                    sum = (sum / i);\n            }\n            catch(ArithmeticException e)\n            {\n        \tSystem.out.print(\"0\");\n            }\n            System.out.print(sum);\n        }\n    }"],"exp":"Value of variable sum is printed outside of try block, sum is declared only in try block, outside try block it is undefined."},{"id":425,"cat":"Core Java","topic":"Exceptions Types","q":"Which of these is a super class of all exceptional type classes?","opts":[["a","String"],["b","RuntimeExceptions"],["c","Throwable"],["d","Cacheable"]],"ans":"c","exp":"All the exception types are subclasses of the built in class Throwable."},{"id":426,"cat":"Core Java","topic":"Exceptions Types","q":"Which of these class is related to all the exceptions that can be caught by using catch?","opts":[["a","Error"],["b","Exception"],["c","RuntimeExecption"],["d","All of the mentioned"]],"ans":"b","exp":"Error class is related to java run time error that can't be caught usually, RuntimeExecption is subclass of Exception class which contains all the exceptions that can be caught."},{"id":427,"cat":"Core Java","topic":"Exceptions Types","q":"Which of these class is related to all the exceptions that cannot be caught?","opts":[["a","Error"],["b","Exception"],["c","RuntimeExecption"],["d","All of the mentioned"]],"ans":"a","exp":"Error class is related to java run time error that can't be caught usually, RuntimeExecption is subclass of Exception class which contains all the exceptions that can be caught."},{"id":428,"cat":"Core Java","topic":"Exceptions Types","q":"Which of these handles the exception when no catch is used?","opts":[["a","Default handler"],["b","finally"],["c","throw handler"],["d","Java run time system"]],"ans":"a"},{"id":429,"cat":"Core Java","topic":"Exceptions Types","q":"What exception thrown by parseInt() method?","opts":[["a","ArithmeticException"],["b","ClassNotFoundException"],["c","NullPointerException"],["d","NumberFormatException"]],"ans":"d","exp":"parseInt() method parses input into integer. The exception thrown by this method is NumberFormatException."},{"id":430,"cat":"Core Java","topic":"Exceptions Types","q":"What will be the output of the following Java code?","opts":[["a","Hello"],["b","World"],["c","Compilation Error"],["d","First Exception then World"]],"ans":"d","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n            {\n                System.out.print(\"Hello\" + \" \" + 1 / 0);\n            }\n            finally\n            {\n        \tSystem.out.print(\"World\");\n            }\n        }\n    }"]},{"id":431,"cat":"Core Java","topic":"Exceptions Types","q":"What will be the output of the following Java code?","opts":[["a","-1"],["b","0"],["c","-10"],["d","-101"]],"ans":"c","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n            {\n                int i, sum;\n                sum = 10;\n                for (i = -1; i < 3 ;++i)\n                {\n                    sum = (sum / i);\n                System.out.print(i);\n                }\n            }\n            catch(ArithmeticException e)\n            {\n                System.out.print(\"0\");\n            }\n        }\n    }"],"exp":"For the 1st iteration -1 is displayed. The 2nd exception is caught in catch block and 0 is displayed."},{"id":432,"cat":"Core Java","topic":"File and Directory","q":"Which method is used to create a directory with fileattributes?","opts":[["a","Path.create()"],["b","Path.createDirectory()"],["c","Files.createDirectory(path, fileAttributes)"],["d","Files.create(fileAttributes)"]],"ans":"c","exp":"The createDirectory() method performs an atomic operation that checks for the existence of the directory and creates it if it does not exist, ensuring that this check-and-create action is indivisible with respect to other file system operations."},{"id":433,"cat":"Core Java","topic":"File and Directory","q":"Which method can be used to check fileAccessiblity?","opts":[["a","isReadable(path)"],["b","isWritable(path)"],["c","isExecutable(path)"],["d","isReadable(path), isWritable(path), and isExecutable(path)"]],"ans":"d","exp":"File accessibilty can be checked using isReadable(Path), isWritable(Path), and isExecutable(Path)."},{"id":434,"cat":"Core Java","topic":"File and Directory","q":"How can we delete all files in a directory?","opts":[["a","Files.delete(path)"],["b","Files.deleteDir()"],["c","Directory.delete()"],["d","Directory.delete(path)"]],"ans":"a","exp":"The delete(Path) method deletes the file or throws an exception if the deletion fails. If file does not exist a NoSuchFileException is thrown."},{"id":435,"cat":"Core Java","topic":"File and Directory","q":"How to copy the file from one location to other?","opts":[["a","Files.copy(source, target)"],["b","Path.copy(source, target)"],["c","source.copy(target)"],["d","Files.createCopy(target)"]],"ans":"a","exp":"Files.copy(source, target) is used to copy a file from one location to another. There are various options available like REPLACE_EXISTING, COPY_ATTRIBUTES and NOFOLLOW_LINKS."},{"id":436,"cat":"Core Java","topic":"File and Directory","q":"How can we get the size of specified file?","opts":[["a","capacity(path)"],["b","size(path)"],["c","length(path)"],["d","Path.size()"]],"ans":"b","exp":"size(Path) returns the size of the specified file in bytes."},{"id":437,"cat":"Core Java","topic":"File and Directory","q":"How to read entire file in one line using java 8?","opts":[["a","Files.readAllLines()"],["b","Files.read()"],["c","Files.readFile()"],["d","Files.lines()"]],"ans":"a","exp":"Java 8 provides Files.readAllLines() which allows us to read entire file in one task. We do not need to worry about readers and writers."},{"id":438,"cat":"Core Java","topic":"File and Directory","q":"How can we create a symbolic link to file?","opts":[["a","createLink()"],["b","createSymLink()"],["c","createSymbolicLink()"],["d","createTempLink()"]],"ans":"c","exp":"To create a symbolic link to a file in Java, you can use the Files.createSymbolicLink() method from the java.nio.file package. This method allows you to create a symbolic link that points to another file or directory."},{"id":439,"cat":"Core Java","topic":"File and Directory","q":"How can we filter lines based on content?","opts":[["a","lines.filter()"],["b","filter(lines)"],["c","lines.contains(filter)"],["d","lines.select()"]],"ans":"a","exp":"lines.filter(line -> line.contains("===-> Loaded package")) can be used to filter out."},{"id":440,"cat":"Core Java","topic":"File and Directory","q":"Which jar provides FileUtils which contains methods for file operations?","opts":[["a","org.apache.file.io"],["b","org.apache.commons.io"],["c","org.file.commons.io"],["d","org.file.common.dir"]],"ans":"b","exp":"The FileUtils class, part of the org.apache.commons.io package, provides various methods for performing file operations and is included in the Apache Commons IO library."},{"id":441,"cat":"Core Java","topic":"File and Directory","q":"Which feature in Java allows automatic resource management, ensuring that IO resources are closed after usage without explicitly calling the close method?","opts":[["a","try-with-resources"],["b","IOException"],["c","AutoCloseable"],["d","Streams"]],"ans":"a","exp":"The try-with-resources statement allows automatic closing of resources that implement the AutoCloseable interface, ensuring proper release of resources such as files or sockets without the need for an explicit close() call."},{"id":442,"cat":"Core Java","topic":"Generic Methods","q":"What are generic methods?","opts":[["a","Generic methods are the methods defined in a generic class"],["b","Generic methods are the methods that extend generic class methods"],["c","Generic methods are methods that introduce their own type parameters"],["d","Generic methods are methods that take void parameters"]],"ans":"c","exp":"Generic methods are methods that introduce their own type parameters. This is similar to declaring a generic type, but the type parameter scope is limited to the method where it is declared. Static and non-static generic methods are allowed, as well as generic class constructors."},{"id":443,"cat":"Core Java","topic":"Generic Methods","q":"Which of these type parameters is used for a generic methods to return and accept any type of object?","opts":[["a","K"],["b","N"],["c","T"],["d","V"]],"ans":"c","exp":"T is used for type, A type variable can be any non-primitive type you specify: any class type, any interface type, any array type, or even another type variable."},{"id":444,"cat":"Core Java","topic":"Generic Methods","q":"Which of these type parameters is used for a generic methods to return and accept a number?","opts":[["a","K"],["b","N"],["c","T"],["d","V"]],"ans":"b","exp":"N is used for Number."},{"id":445,"cat":"Core Java","topic":"Generic Methods","q":"Which of these is an correct way of defining generic method?","opts":[["a","<T1, T2, ..., Tn> name(T1, T2, ..., Tn) { /* ... */ }"],["b","public <T1, T2, ..., Tn> name<T1, T2, ..., Tn> { /* ... */ }"],["c","class <T1, T2, ..., Tn> name[T1, T2, ..., Tn] { /* ... */ }"],["d","<T1, T2, ..., Tn> name{T1, T2, ..., Tn} { /* ... */ }"]],"ans":"b","exp":"The syntax for a generic method includes a type parameter, inside angle brackets, and appears before the method's return type. For static generic methods, the type parameter section must appear before the method's return type."},{"id":446,"cat":"Core Java","topic":"Generic Methods","q":"Which of the following allows us to call generic methods as a normal method?","opts":[["a","Type Interface"],["b","Interface"],["c","Inner class"],["d","All of the mentioned"]],"ans":"a","exp":"Type inference, allows you to invoke a generic method as an ordinary method, without specifying a type between angle brackets."},{"id":447,"cat":"Core Java","topic":"Generic Methods","q":"What will be the output of the following Java program?","opts":[["a","H"],["b","Hello"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"b","cod":["    import java.util.*;\n    public class genericstack <E>\n    {\n        Stack <E> stk = new Stack <E>();\n\tpublic void push(E obj)\n        {\n            stk.push(obj);\n\t}\n\tpublic E pop()\n        {\n            E obj = stk.pop();\n\t    return obj;\n\t}\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            genericstack <String> gs = new genericstack<String>();\n            gs.push(\"Hello\");\n            System.out.println(gs.pop());\n        }\n    }"]},{"id":448,"cat":"Core Java","topic":"Generic Methods","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","36"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"b","cod":["    import java.util.*;\n    public class genericstack <E>\n    {\n        Stack <E> stk = new Stack <E>();\n\tpublic void push(E obj)\n        {\n            stk.push(obj);\n\t}\n        public E pop()\n        {\n            E obj = stk.pop();\n\t    return obj;\n\t}\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            genericstack <Integer> gs = new genericstack<Integer>();\n            gs.push(36);\n            System.out.println(gs.pop());\n        }\n    }"]},{"id":449,"cat":"Core Java","topic":"Generic Methods","q":"What will be the output of the following Java program?","opts":[["a","Error"],["b","Hello"],["c","36"],["d","
