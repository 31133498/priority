me exceptions have two constructors: one with no parameters and one that takes a string parameter."},{"id":1072,"cat":"Core Java","topic":"Throw, Throws & Nested Try","q":"Which of these keywords is used to by the calling function to guard against the exception that is thrown by called function?","opts":[["a","try"],["b","throw"],["c","throws"],["d","catch"]],"ans":"c","exp":"If a method is capable of causing an exception that it does not handle. It must specify this behaviour the behaviour so that callers of the method can guard themselves against that exception. This is done by using throws clause in methods declaration."},{"id":1073,"cat":"Core Java","topic":"Throw, Throws & Nested Try","q":"What will be the output of the following Java code?","opts":[["a","TypeA"],["b","TypeB"],["c","Compile Time Error"],["d","0TypeB"]],"ans":"c","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n            {\n                int a = args.length;\n                int b = 10 / a;\n                System.out.print(a);\n                try\n                {\n                    if (a == 1)\n                        a = a / a - a;\n                    if (a == 2)\n                    {\n                        int []c = {1};\n                        c[8] = 9;\n                    }\n                }\n                catch (ArrayIndexOutOfBoundException e)\n                {\n                    System.out.println(\"TypeA\");\n                }\n                catch (ArithmeticException e)\n                {\n                    System.out.println(\"TypeB\");\n                }\n            }\n        }\n    }"],"exp":"Because we can't go beyond array limit"},{"id":1074,"cat":"Core Java","topic":"Throw, Throws & Nested Try","q":"What will be the output of the following Java code?","opts":[["a","A"],["b","B"],["c","Hello"],["d","Runtime Exception"]],"ans":"d","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n            {\n                System.out.print(\"A\");\n                throw new NullPointerException (\"Hello\");\n            }\n            catch(ArithmeticException e)\n            {\n                System.out.print(\"B\");\n            }\n        }\n    }"]},{"id":1075,"cat":"Core Java","topic":"Throw, Throws & Nested Try","q":"What will be the output of the following Java code?","opts":[["a","Finally"],["b","Compilation fails"],["c","The code runs with no output"],["d","An exception is thrown at runtime"]],"ans":"a","cod":["public class San\n {\n    public static void main(String[] args)\n    {\n        try\n        {\n            return;\n        }\n        finally\n        {\n            System.out.println( \"Finally\" );\n        }\n    }\n}"],"exp":"Because finally will execute always."},{"id":1076,"cat":"Core Java","topic":"Throw, Throws & Nested Try","q":"What will be the output of the following Java code?","opts":[["a","The program will not compile because no exceptions are specified"],["b","The program will not compile because no catch clauses are specified"],["c","Hello world"],["d","Hello world Finally executing"]],"ans":"d","cod":["public class San\n{\n    public static void main(String args[])\n    {\n        try\n        {\n            System.out.print(\"Hello world \");\n        }\n        finally\n        {\n            System.out.println(\"Finally executing \");\n        }\n    }\n}"]},{"id":1077,"cat":"Core Java","topic":"Try and Catch","q":"What is the use of try & catch?","opts":[["a","It allows us to manually handle the exception"],["b","It allows to fix errors"],["c","It prevents automatic terminating of the program in cases when an exception occurs"],["d","All of the mentioned"]],"ans":"d"},{"id":1078,"cat":"Core Java","topic":"Try and Catch","q":"Which of these keywords are used for the block to be examined for exceptions?","opts":[["a","try"],["b","catch"],["c","throw"],["d","check"]],"ans":"a","exp":"try is used for the block that needs to checked for exception."},{"id":1079,"cat":"Core Java","topic":"Try and Catch","q":"Which of these keywords are used for the block to handle the exceptions generated by try block?","opts":[["a","try"],["b","catch"],["c","throw"],["d","check"]],"ans":"b"},{"id":1080,"cat":"Core Java","topic":"Try and Catch","q":"Which of these keywords are used for generating an exception manually?","opts":[["a","try"],["b","catch"],["c","throw"],["d","check"]],"ans":"c"},{"id":1081,"cat":"Core Java","topic":"Try and Catch","q":"Which of these statements is incorrect?","opts":[["a","try block need not to be followed by catch block"],["b","try block can be followed by finally block instead of catch block"],["c","try can be followed by both catch and finally block"],["d","try need not to be followed by anything"]],"ans":"d","exp":"try must be followed by either catch or finally block."},{"id":1082,"cat":"Core Java","topic":"Try and Catch","q":"What will be the output of the following Java code?","opts":[["a","Hello"],["b","World"],["c","HelloWOrld"],["d","Compilation Error"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n           try\n           {\n               int a = 0;\n               int b = 5;\n               int c = b / a;\n               System.out.print(\"Hello\");\n           }\n           catch(Exception e)\n           {\n               System.out.print(\"World\");\n           }\n        }\n    }"]},{"id":1083,"cat":"Core Java","topic":"Try and Catch","q":"What will be the output of the following Java code?","opts":[["a","Hello"],["b","World"],["c","HelloWOrld"],["d","Compilation Error"]],"ans":"a","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n           try\n           {\n               int a = 0;\n               int b = 5;\n               int c = a / b;\n               System.out.print(\"Hello\");\n           }\n           catch(Exception e)\n           {\n               System.out.print(\"World\");\n           }\n        }\n    }"]},{"id":1084,"cat":"Core Java","topic":"Try and Catch","q":"What will be the output of the following Java code?","opts":[["a","Hello"],["b","World"],["c","HelloWOrld"],["d","Compilation Error"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n           try\n           {\n               int a = 0;\n               int b = 5;\n               int c = b / a;\n               System.out.print(\"Hello\");\n           }\n        }\n    }"],"exp":"try must be followed by either catch or finally"},{"id":1085,"cat":"Core Java","topic":"Try and Catch","q":"What will be the output of the following Java code?","opts":[["a","Hello"],["b","World"],["c","HelloWOrld"],["d","Compilation Error"]],"ans":"c","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n           try\n           {\n               int a = 0;\n               int b = 5;\n               int c = a / b;\n               System.out.print(\"Hello\");\n           }\n           finally\n           {\n               System.out.print(\"World\");\n           }\n        }\n    }"],"exp":"finally block is always executed after try block, no matter exception is found or not."},{"id":1086,"cat":"Core Java","topic":"Try and Catch","q":"What will be the output of the following Java code?","opts":[["a","Hello"],["b","World"],["c","HelloWOrld"],["d","WorldWorld"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n           try\n           {\n               int a = 0;\n               int b = 5;\n               int c = b / a;\n               System.out.print(\"Hello\");\n           }\n           catch(Exception e)\n           {\n               System.out.print(\"World\");\n           }\n           finally\n           {\n               System.out.print(\"World\");\n           }\n        }\n    }"],"exp":"finally block is always executed after tryblock, no matter exception is found or not. catch block is executed only when exception is found. Here divide by zero exception is found hence both catch and finally are executed."},{"id":1087,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"Which of these is necessary condition for automatic type conversion in Java?","opts":[["a","The destination type is smaller than source type."],["b","The destination type is larger than source type."],["c","The destination type can be larger or smaller than source type."],["d","None of the mentioned"]],"ans":"b"},{"id":1088,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is the prototype of the default constructor of this class?\npublic class prototype { }","opts":[["a","prototype( )"],["b","prototype(void)"],["c","public prototype(void)"],["d","public prototype( )"]],"ans":"d"},{"id":1089,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is the error in this code?\nbyte b = 50;\nb = b * 50;","opts":[["a","b can not contain value 100, limited by its range."],["b","* operator has converted b * 50 into int, which can not be converted to byte without casting."],["c","b can not contain value 50."],["d","No error in this code"]],"ans":"b","exp":"While evaluating an expression containing int, bytes or shorts , the whole expression is converted to int then evaluated and result is also of type int."},{"id":1090,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"If an expression contains double, int, float, long, then whole expression will promoted into which of these data types?","opts":[["a","long"],["b","int"],["c","double"],["d","float"]],"ans":"c","exp":"If any operand is double the result of expression is double."},{"id":1091,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is Truncation is Java?","opts":[["a","Floating-point value assigned to an integer type."],["b","Integer value assigned to floating type."],["c","Floating-point value assigned to an Floating type."],["d","Integer value assigned to floating type."]],"ans":"a"},{"id":1092,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is the output of this program?","opts":[["a","E U"],["b","U E"],["c","V E"],["d","U F"]],"ans":"a","cod":["    class char_increment {\n        public static void main(String args[])\n        {\n            char c1 = 'D';\n            char c2 = 84;\n            c2++;\n            c1++;\n            System.out.println(c1 + \" \"  + c2);\n        }\n    }"],"exp":"Operator ++ increments the value of character by 1. c1 and c2 are given values D and 84, when we use ++ operator their values increments by 1, c1 and c2 becomes E and U respectively.\n$ javac char_increment.java\n$ java char_increment\nE U"},{"id":1093,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is the output of this program?","opts":[["a","38 43"],["b","39 44"],["c","295 300"],["d","295.04 300"]],"ans":"b","cod":["    class conversion {\n        public static void main(String args[])\n        {\n            double a = 295.04;\n            int  b = 300;\n            byte c = (byte) a;\n            byte d = (byte) b;\n            System.out.println(c + \" \"  + d);\n        }\n    }"],"exp":"Type casting a larger variable into a smaller variable results in modulo of larger variable by range of smaller variable. b contains 300 which is larger than byte's range i:e -128 to 127 hence d contains 300 modulo 256 i:e 44.\n$ javac conversion.java\n$ java conversion\n39 44"},{"id":1094,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is the output of this program?","opts":[["a","b is : 2"],["b","b is : 1"],["c","Compilation Error."],["d","An exception is thrown at runtime."]],"ans":"c","cod":["    class A {\n        final public int calculate(int a, int b) { return 1; }\n    }\n    class B extends A {\n        public int calculate(int a, int b) { return 2; }\n    }\n     public class output {\n        public static void main(String args[])\n        {\n            B object = new B();\n            System.out.print(\"b is \" + b.calculate(0, 1));\n        }\n    }"],"exp":"The code does not compile because the method calculate() in class A is final and so cannot be overridden by method of class b."},{"id":1095,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is the output of this program?","opts":[["a","1 1"],["b","1 0"],["c","1 0 3"],["d","1 2 3"]],"ans":"d","cod":["    class main_arguments {\n        public static void main(String [] args)\n        {\n            String [][] argument = new String[2][2];\n            int x;\n            argument[0] = args;\n            x = argument[0].length;\n            for (int y = 0; y < x; y++)\n                System.out.print(\" \" + argument[0][y]);\n        }\n    }"],"exp":"In argument[0] = args;, the reference variable arg[0], which was referring to an array with two elements, is reassigned to an array (args) with three elements.\n$ javac main_arguments.java\n$ java main_arguments\n1 2 3"},{"id":1096,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is the output of this program?","opts":[["a","Hello c"],["b","Hello"],["c","Hello world"],["d","Runtime Error."]],"ans":"d","cod":["    class c {\n        public void main( String[] args )\n        {\n            System.out.println( \"Hello\" + args[0] );\n        }\n    }"],"exp":"A runtime error will occur owning to the main method of the code fragment not being declared static.\n$ javac c.java\nException in thread "main" java.lang.NoSuchMethodError: main"},{"id":1097,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is the prototype of the default constructor of this Java class?","opts":[["a","prototype( )"],["b","prototype(void)"],["c","public prototype(void)"],["d","public prototype( )"]],"ans":"d","cod":["    public class prototype { }"]},{"id":1098,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What will be the error in the following Java code?","opts":[["a","b cannot contain value 100, limited by its range"],["b","* operator has converted b * 50 into int, which can not be converted to byte without casting"],["c","b cannot contain value 50"],["d","No error in this code"]],"ans":"b","cod":["    byte b = 50;\n    b = b * 50;"],"exp":"While evaluating an expression containing int, bytes or shorts, the whole expression is converted to int then evaluated and the result is also of type int."},{"id":1099,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"If an expression contains double, int, float, long, then the whole expression will be promoted into which of these data types?","opts":[["a","long"],["b","int"],["c","double"],["d","float"]],"ans":"c","exp":"If any operand is double the result of an expression is double."},{"id":1100,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What is Truncation in Java?","opts":[["a","Floating-point value assigned to an integer type"],["b","Integer value assigned to floating type"],["c","Floating-point value assigned to a Floating type"],["d","Integer value assigned to an integer type"]],"ans":"a","exp":"Truncate means to trim some digits of a floating type number or a double type number from right. We can also truncate the decimal portion completely making it an integer type number."},{"id":1101,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What will be the output of the following Java code?","opts":[["a","E U"],["b","U E"],["c","V E"],["d","U F"]],"ans":"a","cod":["    class char_increment\n    {\n        public static void main(String args[])\n        {\n            char c1 = 'D';\n            char c2 = 84;\n            c2++;\n            c1++;\n            System.out.println(c1 + \" \"  + c2);\n        }\n    }"],"exp":"Operator ++ increments the value of character by 1. c1 and c2 are given values D and 84, when we use ++ operator their values increments by 1, c1 and c2 becomes E and U respectively."},{"id":1102,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What will be the output of the following Java code?","opts":[["a","38 43"],["b","39 44"],["c","295 300"],["d","295.04 300"]],"ans":"b","cod":["    class conversion\n    {\n        public static void main(String args[])\n        {\n            double a = 295.04;\n            int  b = 300;\n            byte c = (byte) a;\n            byte d = (byte) b;\n            System.out.println(c + \" \"  + d);\n        }\n    }"],"exp":"Type casting a larger variable into a smaller variable results in modulo of larger variable by range of smaller variable. b contains 300 which is larger than byte's range i:e -128 to 127 hence d contains 300 modulo 256 i:e 44."},{"id":1103,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What will be the output of the following Java code?","opts":[["a","b is : 2"],["b","b is : 1"],["c","Compilation Error"],["d","An exception is thrown at runtime"]],"ans":"c","cod":["    class A\n    {\n        final public int calculate(int a, int b) { return 1; }\n    }\n    class B extends A\n    {\n        public int calculate(int a, int b) { return 2; }\n    }\n     public class output\n     {\n        public static void main(String args[])\n        {\n            B object = new B();\n            System.out.print(\"b is \" + b.calculate(0, 1));\n        }\n    }"],"exp":"The code does not compile because the method calculate() in class A is final and so cannot be overridden by method of class b."},{"id":1104,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What will be the output of the following Java program, if we run as "java main_arguments 1 2 3"?","opts":[["a","1 1"],["b","1 0"],["c","1 0 3"],["d","1 2 3"]],"ans":"d","cod":["    class main_arguments\n    {\n        public static void main(String [] args)\n        {\n            String [][] argument = new String[2][2];\n            int x;\n            argument[0] = args;\n            x = argument[0].length;\n            for (int y = 0; y < x; y++)\n                System.out.print(\" \" + argument[0][y]);\n        }\n    }"],"exp":"In argument[0] = args;, the reference variable arg[0], which was referring to an array with two elements, is reassigned to an array (args) with three elements."},{"id":1105,"cat":"Core Java","topic":"Type Conversions, Promotions and Castings","q":"What will be the output of the following Java program?","opts":[["a","Hello c"],["b","Hello"],["c","Hello world"],["d","Runtime Error"]],"ans":"d","cod":["    class c\n    {\n        public void main( String[] args )\n        {\n            System.out.println( \"Hello\" + args[0] );\n        }\n    }"],"exp":"A runtime error will occur owning to the main method of the code fragment not being declared static."},{"id":1106,"cat":"Core Java","topic":"Type Interface","q":"Why are generics used?","opts":[["a","Generics make code more fast"],["b","Generics make code more optimised and readable"],["c","Generics add stability to your code by making more of your bugs detectable at compile time"],["d","Generics add stability to your code by making more of your bugs detectable at runtime"]],"ans":"c","exp":"Generics add stability to your code by making more of your bugs detectable at compile time."},{"id":1107,"cat":"Core Java","topic":"Type Interface","q":"Which of these type parameters is used for a generic class to return and accept any type of object?","opts":[["a","K"],["b","N"],["c","T"],["d","V"]],"ans":"c","exp":"T is used for type, A type variable can be any non-primitive type you specify: any class type, any interface type, any array type, or even another type variable."},{"id":1108,"cat":"Core Java","topic":"Type Interface","q":"Which of these type parameters is used for a generic class to return and accept a number?","opts":[["a","K"],["b","N"],["c","T"],["d","V"]],"ans":"b","exp":"N is used for Number."},{"id":1109,"cat":"Core Java","topic":"Type Interface","q":"Which of these is an correct way of defining generic class?","opts":[["a","class name(T1, T2, ..., Tn) { /* ... */ }"],["b","class name<T1, T2, ..., Tn> { /* ... */ }"],["c","class name[T1, T2, ..., Tn] { /* ... */ }"],["d","class name{T1, T2, ..., Tn} { /* ... */ }"]],"ans":"b","exp":"The type parameter section, delimited by angle brackets (<>), follows the class name. It specifies the type parameters (also called type variables) T1, T2, ..., and Tn."},{"id":1110,"cat":"Core Java","topic":"Type Interface","q":"Which of the following is an incorrect statement regarding the use of generics and parameterized types in Java?","opts":[["a","Generics provide type safety by shifting more type checking responsibilities to the compiler"],["b","Generics and parameterized types eliminate the need for down casts when using Java Collections"],["c","When designing your own collections class (say, a linked list), generics and parameterized types allow you to achieve type safety with just a single class definition as opposed to defining multiple classes"],["d","All of the mentioned"]],"ans":"c"},{"id":1111,"cat":"Core Java","topic":"Type Interface","q":"Which of the following reference types cannot be generic?","opts":[["a","Anonymous inner class"],["b","Interface"],["c","Inner class"],["d","All of the mentioned"]],"ans":"a"},{"id":1112,"cat":"Core Java","topic":"Type Interface","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","1"],["c","[1]"],["d","[0]"]],"ans":"d","cod":["    public class BoxDemo\n    {\n        public static <U> void addBox(U u,\n        java.util.List<Box<U>> boxes)\n        {\n           Box<U> box = new Box<>();\n           box.set(u);\n           boxes.add(box);\n        }\n        public static <U> void outputBoxes(java.util.List<Box<U>> boxes)\n        {\n            int counter = 0;\n            for (Box<U> box: boxes)\n            {\n                U boxContents = box.get();\n                System.out.println(\"[\" + boxContents.toString() + \"]\");\n                counter++;\n            }\n        }\n        public static void main(String[] args)\n        {\n            java.util.ArrayList<Box<Integer>> listOfIntegerBoxes = new java.util.ArrayList<>();\n            BoxDemo.<Integer>addBox(Integer.valueOf(0), listOfIntegerBoxes);\n            BoxDemo.outputBoxes(listOfIntegerBoxes);\n        }\n    }"]},{"id":1113,"cat":"Core Java","topic":"Type Interface","q":"What will be the output of the following Java program?","opts":[["a","10"],["b","Box #0 [10]"],["c","Box contains [10]"],["d","Box #0 contains [10]"]],"ans":"d","cod":["    public class BoxDemo\n    {\n        public static <U> void addBox(U u,\n        java.util.List<Box<U>> boxes)\n        {\n           Box<U> box = new Box<>();\n           box.set(u);\n           boxes.add(box);\n        }\n        public static <U> void outputBoxes(java.util.List<Box<U>> boxes)\n        {\n            int counter = 0;\n            for (Box<U> box: boxes)\n            {\n                U boxContents = box.get();\n                System.out.println(\"Box #\" + counter + \" contains [\" + boxContents.toString() + \"]\");\n                counter++;\n            }\n        }\n        public static void main(String[] args)\n        {\n            java.util.ArrayList<Box<Integer>> listOfIntegerBoxes = new java.util.ArrayList<>();\n            BoxDemo.<Integer>addBox(Integer.valueOf(10), listOfIntegerBoxes);\n            BoxDemo.outputBoxes(listOfIntegerBoxes);\n        }\n    }"]},{"id":1114,"cat":"Core Java","topic":"URL Class","q":"What does URL stands for?","opts":[["a","Uniform Resource Locator"],["b","Uniform Resource Latch"],["c","Universal Resource Locator"],["d","Universal Resource Latch"]],"ans":"a","exp":"URL is Uniform Resource Locator."},{"id":1115,"cat":"Core Java","topic":"URL Class","q":"Which of these exceptions is thrown by URL class's constructors?","opts":[["a","URLNotFound"],["b","URLSourceNotFound"],["c","MalformedURLException"],["d","URLNotFoundException"]],"ans":"c"},{"id":1116,"cat":"Core Java","topic":"URL Class","q":"Which of these methods is used to know host of an URL?","opts":[["a","host()"],["b","getHost()"],["c","GetHost()"],["d","gethost()"]],"ans":"b"},{"id":1117,"cat":"Core Java","topic":"URL Class","q":"Which of these methods is used to know the full URL of an URL object?","opts":[["a","fullHost()"],["b","getHost()"],["c","ExternalForm()"],["d","toExternalForm()"]],"ans":"d"},{"id":1118,"cat":"Core Java","topic":"URL Class","q":"Which of these class is used to access actual bits or content information of a URL?","opts":[["a","URL"],["b","URLDecoder"],["c","URLConnection"],["d","All of the mentioned"]],"ans":"d","exp":"URL, URLDecoder and URLConnection all there are used to access information stored in a URL."},{"id":1119,"cat":"Core Java","topic":"URL Class","q":"What will be the output of the following Java code?","opts":[["a","http"],["b","https"],["c","www"],["d","com"]],"ans":"a","cod":["    import java.net.*;\n    class networking\n    {\n        public static void main(String[] args) throws MalformedURLException\n        {\n            URL obj = new URL(\"https://www.sanfoundry.com/javamcq\");\n            System.out.print(obj.getProtocol());\n        }\n    }"],"exp":"obj.getProtocol() is used to know the protocol used by the host. http stands for hypertext transfer protocol, usually 2 types of protocols are used http and https, where s in https stands for secured."},{"id":1120,"cat":"Core Java","topic":"URL Class","q":"What will be the output of the following Java program?","opts":[["a","1"],["b","0"],["c","-1"],["d","garbage value"]],"ans":"c","cod":["    import java.net.*;\n    class networking\n    {\n        public static void main(String[] args) throws MalformedURLException\n        {\n            URL obj = new URL(\"https://www.sanfoundry.com/javamcq\");\n            System.out.print(obj.getPort());\n        }\n    }"],"exp":"Since we have not explicitly set the port default value that is -1 is printed."},{"id":1121,"cat":"Core Java","topic":"URL Class","q":"What will be the output of the following Java program?","opts":[["a","sanfoundry"],["b","sanfoundry.com"],["c","www.sanfoundry.com"],["d","https://www.sanfoundry.com/javamcq"]],"ans":"c","cod":["    import java.net.*;\n    class networking\n    {\n        public static void main(String[] args) throws MalformedURLException\n        {\n            URL obj = new URL(\"https://www.sanfoundry.com/javamcq\");\n            System.out.print(obj.getHost());\n        }\n    }"]},{"id":1122,"cat":"Core Java","topic":"URL Class","q":"What will be the output of the following Java program?","opts":[["a","sanfoundry"],["b","sanfoundry.com"],["c","www.sanfoundry.com"],["d","https://www.sanfoundry.com/javamcq"]],"ans":"d","cod":["    import java.net.*;\n    class networking\n    {\n        public static void main(String[] args) throws MalformedURLException\n        {\n            URL obj = new URL(\"https://www.sanfoundry.com/javamcq\");\n            System.out.print(obj.toExternalForm());\n        }\n    }"],"exp":"toExternalForm() is used to know the full URL of an URL object."},{"id":1123,"cat":"Core Java","topic":"Vectors & Stack","q":"Which of these class object can be used to form a dynamic array?","opts":[["a","ArrayList"],["b","Map"],["c","Vector"],["d","ArrayList & Vector"]],"ans":"d","exp":"Vectors are dynamic arrays, it contains many legacy methods that are not part of collection framework, and hence these methods are not present in ArrayList. But both are used to form dynamic arrays."},{"id":1124,"cat":"Core Java","topic":"Vectors & Stack","q":"Which of these are legacy classes?","opts":[["a","Stack"],["b","Hashtable"],["c","Vector"],["d","All of the mentioned"]],"ans":"d","exp":"Stack, Hashtable, Vector, Properties and Dictionary are legacy classes."},{"id":1125,"cat":"Core Java","topic":"Vectors & Stack","q":"Which of these is the interface of legacy?","opts":[["a","Map"],["b","Enumeration"],["c","HashMap"],["d","Hashtable"]],"ans":"b"},{"id":1126,"cat":"Core Java","topic":"Vectors & Stack","q":"What is the name of a data member of class Vector which is used to store a number of elements in the vector?","opts":[["a","length"],["b","elements"],["c","elementCount"],["d","capacity"]],"ans":"c"},{"id":1127,"cat":"Core Java","topic":"Vectors & Stack","q":"Which of these methods is used to add elements in vector at specific location?","opts":[["a","add()"],["b","set()"],["c","AddElement()"],["d","addElement()"]],"ans":"d","exp":"addElement() is used to add data in the vector, to obtain the data we use elementAt() and to first and last element we use firstElement() and lastElement() respectively."},{"id":1128,"cat":"Core Java","topic":"Vectors & Stack","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","3"],["c","2"],["d","5"]],"ans":"c","cod":["    import java.util.*;\n    class vector\n    {\n        public static void main(String args[])\n        {\n            Vector obj = new Vector(4,2);\n            obj.addElement(new Integer(3));\n            obj.addElement(new Integer(2));\n            obj.addElement(new Integer(5));\n            System.out.println(obj.elementAt(1));\n        }\n    }"],"exp":"obj.elementAt(1) returns the value stored at index 1, which is 2."},{"id":1129,"cat":"Core Java","topic":"Vectors & Stack","q":"What will be the output of the following Java code?","opts":[["a","2"],["b","3"],["c","4"],["d","6"]],"ans":"c","cod":["    import java.util.*;\n    class vector\n    {\n        public static void main(String args[])\n        {\n            Vector obj = new Vector(4,2);\n            obj.addElement(new Integer(3));\n            obj.addElement(new Integer(2));\n            obj.addElement(new Integer(5));\n            System.out.println(obj.capacity());\n        }\n    }"]},{"id":1130,"cat":"Core Java","topic":"Vectors & Stack","q":"What will be the output of the following Java code?","opts":[["a","[3, 2, 6]"],["b","[3, 2, 8]"],["c","[3, 2, 6, 8]"],["d","[3, 2, 8, 6]"]],"ans":"d","cod":["    import java.util.*;\n    class vector\n    {\n        public static void main(String args[])\n        {\n            Vector obj = new Vector(4,2);\n            obj.addElement(new Integer(3));\n            obj.addElement(new Integer(2));\n            obj.addElement(new Integer(6));\n            obj.insertElementAt(new Integer(8), 2);\n            System.out.println(obj);\n        }\n    }"]},{"id":1131,"cat":"Core Java","topic":"Vectors & Stack","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","1"],["c","true"],["d","false"]],"ans":"c","cod":["    import java.util.*;\n    class vector\n    {\n        public static void main(String args[])\n        {\n            Vector obj = new Vector(4,2);\n            obj.addElement(new Integer(3));\n            obj.addElement(new Integer(2));\n            obj.addElement(new Integer(5));\n            obj.removeAll(obj);\n            System.out.println(obj.isEmpty());\n        }\n    }"],"exp":"firstly elements 3, 2, 5 are entered in the vector obj, but when obj.removeAll(obj); is executed all the elements are deleted and vector is empty, hence obj.isEmpty() returns true."},{"id":1132,"cat":"Core Java","topic":"Vectors & Stack","q":"What will be the output of the following Java code?","opts":[["a","[3, 5]"],["b","[3, 2]"],["c","[3, 2, 5]"],["d","[3, 5, 2]"]],"ans":"a","cod":["    import java.util.*;\n    class stack\n    {\n        public static void main(String args[])\n        {\n            Stack obj = new Stack();\n            obj.push(new Integer(3));\n            obj.push(new Integer(2));\n            obj.pop();\n            obj.push(new Integer(5));\n     \t    System.out.println(obj);\n        }\n    }"],"exp":"push() and pop() are standard functions of the class stack, push() inserts in the stack and pop removes from the stack. 3 & 2 are inserted using push() the pop() is used which removes 2 from the stack then again push is used to insert 5 hence stack contains elements 3 & 5."},{"id":1133,"cat":"Core Java","topic":"Vectors & Stack","q":"What is the name of data member of class Vector which is used to store number of elements in the vector?","opts":[["a","length"],["b","elements"],["c","elementCount"],["d","capacity"]],"ans":"c"},{"id":1134,"cat":"Core Java","topic":"Vectors & Stack","q":"What is the output of this program?","opts":[["a","0"],["b","3"],["c","2"],["d","5"]],"ans":"c","cod":["    import java.util.*;\n    class vector\n    {\n        public static void main(String args[])\n        {\n            Vector obj = new Vector(4,2);\n            obj.addElement(new Integer(3));\n            obj.addElement(new Integer(2));\n            obj.addElement(new Integer(5));\n            System.out.println(obj.elementAt(1));\n        }\n    }"],"exp":"obj.elementAt(1) returns the value stored at index 1, which is 2.\n$ javac vector.java\n$ java vector\n2"},{"id":1135,"cat":"Core Java","topic":"Vectors & Stack","q":"What is the output of this program?","opts":[["a","2"],["b","3"],["c","4"],["d","6"]],"ans":"c","cod":["    import java.util.*;\n    class vector\n    {\n        public static void main(String args[])\n        {\n            Vector obj = new Vector(4,2);\n            obj.addElement(new Integer(3));\n            obj.addElement(new Integer(2));\n            obj.addElement(new Integer(5));\n            System.out.println(obj.capacity());\n        }\n    }"],"exp":"$ javac vector.java\n$ java vector\n4"},{"id":1136,"cat":"Core Java","topic":"Vectors & Stack","q":"What is the output of this program?","opts":[["a","[3, 2, 6]."],["b","[3, 2, 8]."],["c","[3, 2, 6, 8]."],["d","[3, 2, 8, 6]."]],"ans":"d","cod":["    import java.util.*;\n    class vector\n    {\n        public static void main(String args[])\n        {\n            Vector obj = new Vector(4,2);\n            obj.addElement(new Integer(3));\n            obj.addElement(new Integer(2));\n            obj.addElement(new Integer(6));\n            obj.insertElementAt(new Integer(8), 2);\n            System.out.println(obj);\n        }\n    }"],"exp":"$ javac vector.java\n$ java vector\n[3, 2, 8, 6]."},{"id":1137,"cat":"Core Java","topic":"Vectors & Stack","q":"What is the output of this program?","opts":[["a","0"],["b","1"],["c","true"],["d","false"]],"ans":"c","cod":["    import java.util.*;\n    class vector\n    {\n        public static void main(String args[])\n        {\n            Vector obj = new Vector(4,2);\n            obj.addElement(new Integer(3));\n            obj.addElement(new Integer(2));\n            obj.addElement(new Integer(5));\n            obj.removeAll(obj);\n            System.out.println(obj.isEmpty());\n        }\n    }"],"exp":"firstly elements 3, 2, 5 are entered in the vector obj, but when obj.removeAll(obj); is executed all the elements are deleted and vector is empty, hence obj.isEmpty() returns true.\n$ javac vector.java\n$ java vector\ntrue"},{"id":1138,"cat":"Core Java","topic":"Vectors & Stack","q":"What is the output of this program?","opts":[["a","[3, 5]."],["b","[3, 2]."],["c","[3, 2, 5]."],["d","[3, 5, 2]."]],"ans":"a","cod":["    import java.util.*;\n    class stack\n    {\n        public static void main(String args[])\n        {\n            Stack obj = new Stack();\n            obj.push(new Integer(3));\n            obj.push(new Integer(2));\n            obj.pop();\n            obj.push(new Integer(5));\n     \t    System.out.println(obj);\n        }\n    }"],"exp":"push() and pop() are standard functions of the class stack, push() inserts in the stack and pop removes from the stack. 3 & 2 are inserted using push() the pop() is used which removes 2 from the stack then again push is used to insert 5 hence stack contains elements 3 & 5.\n$ javac stack.java\n$ java stack\n[3, 5]."},{"id":1139,"cat":"Core Java","topic":"Void, Process & System Classes","q":"Which of these class have only one field 'TYPE'?","opts":[["a","Void"],["b","Process"],["c","System"],["d","Runtime"]],"ans":"a","exp":"The Void class has one field, TYPE, which holds a reference to the Class object for the type void."},{"id":1140,"cat":"Core Java","topic":"Void, Process & System Classes","q":"Which of the following method of Process class can terminate a process?","opts":[["a","void kill()"],["b","void destroy()"],["c","void terminate()"],["d","void exit()"]],"ans":"b","exp":"Kills the subprocess. The subprocess represented by this Process object is forcibly terminated."},{"id":1141,"cat":"Core Java","topic":"Void, Process & System Classes","q":"Standard output variable 'out' is defined in which class?","opts":[["a","Void"],["b","Process"],["c","Runtime"],["d","System"]],"ans":"d","exp":"Standard output variable 'out' is defined in System class. out is usually used in print statement i:e System.out.print()."},{"id":1142,"cat":"Core Java","topic":"Void, Process & System Classes","q":"Which of these class can encapsulate an entire executing program?","opts":[["a","Void"],["b","Process"],["c","Runtime"],["d","System"]],"ans":"b"},{"id":1143,"cat":"Core Java","topic":"Void, Process & System Classes","q":"Which of the following is method of System class is used to find how long a program takes to execute?","opts":[["a","currenttime()"],["b","currentTime()"],["c","currentTimeMillis()"],["d","currenttimeMillis()"]],"ans":"c"},{"id":1144,"cat":"Core Java","topic":"Void, Process & System Classes","q":"Which of these class holds a collection of static methods and variables?","opts":[["a","Void"],["b","Process"],["c","Runtime"],["d","System"]],"ans":"d","exp":"System class holds a collection of static methods and variables. The standard input, output and error output of java runtime is stored in the in, out and err variables of System class."},{"id":1145,"cat":"Core Java","topic":"Void, Process & System Classes","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","1"],["c","1000"],["d","System Dependent"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            long start, end;\n            start = System.currentTimeMillis();\n            for (int i = 0; i < 10000000; i++);\n            end = System.currentTimeMillis();\n            System.out.print(end - start);\n        }\n    }"],"exp":"end time is the time taken by loop to execute it can be any non zero value depending on the System."},{"id":1146,"cat":"Core Java","topic":"Void, Process & System Classes","q":"What will be the output of the following Java code?","opts":[["a","ABCDEF ABCDEF"],["b","ABCDEF GHIJKL"],["c","GHIJKL ABCDEF"],["d","GHIJKL GHIJKL"]],"ans":"a","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            byte a[] = { 65, 66, 67, 68, 69, 70 };\n            byte b[] = { 71, 72, 73, 74, 75, 76 };\n            System.arraycopy(a , 0, b, 0, a.length);\n            System.out.print(new String(a) + \" \" + new String(b));\n        }\n    }"],"exp":"System.arraycopy() is a method of class System which is used to copy a string into another string."},{"id":1147,"cat":"Core Java","topic":"Void, Process & System Classes","q":"What will be the output of the following Java code?","opts":[["a","ABCDEF GHIJKL"],["b","ABCDEF GCDEFL"],["c","GHIJKL ABCDEF"],["d","GCDEFL GHIJKL"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            byte a[] = { 65, 66, 67, 68, 69, 70 };\n            byte b[] = { 71, 72, 73, 74, 75, 76 };\n            System.arraycopy(a, 2, b, 1, a.length-2);\n            System.out.print(new String(a) + \" \" + new String(b));\n ch is used to copy a string into another string.\n$ javac Output.java\n$ java Output\nABCDEF ABCDEF"},{"id":1151,"cat":"Core Java","topic":"Void, Process & System Classes","q":"What is the output of this program?","opts":[["a","ABCDEF GHIJKL"],["b","ABCDEF GCDEFL"],["c","GHIJKL ABCDEF"],["d","GCDEFL GHIJKL"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            byte a[] = { 65, 66, 67, 68, 69, 70 };\n            byte b[] = { 71, 72, 73, 74, 75, 76 };\n            System.arraycopy(a, 2, b, 1, a.length-2);\n            System.out.print(new String(a) + \" \" + new String(b));\n        }\n    }"],"exp":"$ javac Output.java\n$ java Output\nABCDEF GCDEFL"},{"id":1152,"cat":"Core Java","topic":"Void, Process & System Classes","q":"What is the output of this program?","opts":[["a","ABCDEF GHIJKL"],["b","ABCDEF GCDEFL"],["c","GHIJKL ABCDEF"],["d","GCDEFL GHIJKL"]],"ans":"a","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            byte a[] = { 65, 66, 67, 68, 69, 70 };\n            byte b[] = { 71, 72, 73, 74, 75, 76 };\n            System.arraycopy(a, 1, b, 3, 0);\n            System.out.print(new String(a) + \" \" + new String(b));\n        }\n    }"],"exp":"Since last parameter of System.arraycopy(a,1,b,3,0) is 0 nothing is copied from array a to array b, hence b remains as it is.\n$ javac Output.java\n$ java Output\nABCDEF GHIJKL"},{"id":1153,"cat":"Core Java","topic":"Wildcards","q":"Which of these is wildcard symbol?","opts":[["a","?"],["b","!"],["c","%"],["d","&"]],"ans":"a","exp":"In generic code, the question mark (?), called the wildcard, represents an unknown type."},{"id":1154,"cat":"Core Java","topic":"Wildcards","q":"What is use of wildcards?","opts":[["a","It is used in cases when type being operated upon is not known"],["b","It is used to make code more readable"],["c","It is used to access members of super class"],["d","It is used for type argument of generic method"]],"ans":"a","exp":"The wildcard can be used in a variety of situations: as the type of a parameter, field, or local variable; sometimes as a return type (though it is better programming practice to be more specific). The wildcard is never used as a type argument for a generic method invocation, a generic class instance creation, or a supertype."},{"id":1155,"cat":"Core Java","topic":"Wildcards","q":"Which of these keywords is used to upper bound a wildcard?","opts":[["a","stop"],["b","bound"],["c","extends"],["d","implements"]],"ans":"c"},{"id":1156,"cat":"Core Java","topic":"Wildcards","q":"Which of these is an correct way making a list that is upper bounded by class Number?","opts":[["a","List<? extends Number>"],["b","List<extends ? Number>"],["c","List(? extends Number)"],["d","List(? UpperBounds Number)"]],"ans":"a"},{"id":1157,"cat":"Core Java","topic":"Wildcards","q":"Which of the following keywords are used for lower bounding a wild card?","opts":[["a","extends"],["b","super"],["c","class"],["d","lower"]],"ans":"b","exp":"A lower bounded wildcard is expressed using the wildcard character ('?'), following by the super keyword, followed by its lower bound: ."},{"id":1158,"cat":"Core Java","topic":"Wildcards","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","4"],["c","5.0"],["d","6.0"]],"ans":"d","cod":["    import java.util.*;\n    class Output\n    {\n        public static double sumOfList(List<? extends Number> list)\n        {\n            double s = 0.0;\n            for (Number n : list)\n                s += n.doubleValue();\n            return s;\n        }\n        public static void main(String args[])\n        {\n            List<Integer> li = Arrays.asList(1, 2, 3);\n            System.out.println(sumOfList(li));\n        }\n    }"]},{"id":1159,"cat":"Core Java","topic":"Writing Console Outputs","q":"Which of these class contains the methods print() & println()?","opts":[["a","System"],["b","System.out"],["c","BUfferedOutputStream"],["d","PrintStream"]],"ans":"d","exp":"print() and println() are defined under the class PrintStream, System.out is the byte stream used by these methods ."},{"id":1160,"cat":"Core Java","topic":"Writing Console Outputs","q":"Which of these methods can be used to writing console output?","opts":[["a","print()"],["b","println()"],["c","write()"],["d","all of the mentioned"]],"ans":"d","exp":"The methods that can be used to write console output include print(), println(), and write()."},{"id":1161,"cat":"Core Java","topic":"Writing Console Outputs","q":"Which of these classes are used by character streams output operations?","opts":[["a","InputStream"],["b","Writer"],["c","ReadStream"],["d","InputOutputStream"]],"ans":"b","exp":"Character streams uses Writer and Reader classes for input & output operations."},{"id":1162,"cat":"Core Java","topic":"Writing Console Outputs","q":"Which of these class is used to read from a file?","opts":[["a","InputStream"],["b","BufferedInputStream"],["c","FileInputStream"],["d","BufferedFileInputStream"]],"ans":"c","exp":"FileInputStream Extracts input bytes from a file in a file system. It is suitable for reading binary data like images or videos."},{"id":1163,"cat":"Core Java","topic":"Writing Console Outputs","q":"What will be the output of the following Java program?\nFree 30-Day C++ Certification Bootcamp is Live. Join Now!","opts":[["a","6 4 6 9"],["b","5 4 5 9"],["c","7 8 8 9"],["d","4 3 6 9"]],"ans":"a","cod":["class output\n{\n    public static void main(String args[])\n    {\n        String a=\"hello i love java\";\n        System.out.println(a.indexof('i')+\" \"+a.indexof('o')+\" \"+a.lastIndexof('i')+\"                          \"+a.lastIndexof('o'));\n    }\n}"],"exp":"indexof('c') and lastIndexof('c') are pre defined function which are used to get the index of first and last occurrence of the character pointed by c in the given array."},{"id":1164,"cat":"Core Java","topic":"Writing Console Outputs","q":"What will be the output of the following Java program?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["   class output\n   {\n       public static void main(String args[])\n       {\n           char c[]={'a','1','b',' ','A','0'};\n           for (int i = 0; i < 5; ++i)\n           {\n\t       if(Character.isDigit(c[i]))\n                  System.out.println(c[i]+\" is a digit\");\n               if(Character.isWhitespace(c[i]))\n                  System.out.println(c[i]+\" is a Whitespace character\");\n               if(Character.isUpperCase(c[i]))\n                  System.out.println(c[i]+\" is an Upper case Letter\");\n               if(Character.isLowerCase(c[i]))\n                  System.out.println(c[i]+\" is a lower case Letter\");\n               i = i + 2;\n           }\n       }\n   }"],"exp":"Character.isDigit(c[i]),Character.isUpperCase(c[i]),Character.isWhitespace(c[i]) are the function of library java.lang\nthey are used to find weather the given character is of specified type or not. They return true or false i:e Boolean variable."},{"id":1165,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a",""],["b","Runtime Error"],["c",""],["d","Compilation Error"]],"ans":"a","cod":["public class Main\n{\n    int a, b;\n    Main(int i, int j)\n    {\n        a = i;\n        b = j;\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(27, 2);\n        Main b = a;\n        System.out.println(a.a);\n        System.out.println(b.b);\n\n    }\n}"],"exp":"The object a is assigned to b, hence linking both to the same reference. Therefore they access the same elements when called. Since they both refer to the same reference, the values will be printed in the same order as they are assigned i.e. 27 and 2."},{"id":1166,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a","n"],["b","Compilation Error"],["c","g"],["d","Runtime Error"]],"ans":"c","cod":["public class Main\n{\n    String s;\n    Main(String a)\n    {\n        s = a;\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"Assigning Object\");\n        Main b = a;\n        System.out.println(b.s.charAt(4));\n    }\n}"],"exp":"The object a is assigned to b, linking them to the same reference, hence it can call the string s of the object a. The charAt function returns the character at the specified index in the string. As indexing starts at 0, the nth index refers to the (n+1)th position."},{"id":1167,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a","200"],["b","1200"],["c","2400"],["d","800"]],"ans":"b","cod":["import java.util.*;\npublic class Main\n{\n    int a, b;\n    Main(int a, int b)\n    {\n        this.a = a;\n        this.b = b;\n    }\n    void area()\n    {\n        System.out.println(a*b);\n    }\n    public static void main(String[] args)\n    {\n        int height = 10;\n        int breadth = 20;\n        Main a = new Main(height, breadth);\n        Main b = a;\n        a.a = 30;\n        b.b = 40;\n        b.area();\n    }\n}"],"exp":"As the objects a and b refer to the same reference, changing the element of one object changes it for the other object as well, hence the values are changed for both objects."},{"id":1168,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a","15"],["b","20"],["c","40"],["d","Compilation Error"]],"ans":"b","cod":["import java.util.*;\npublic class Main\n{\n    int a, b;\n    Main(int a, int b)\n    {\n        this.a = a;\n        this.b = b;\n    }\n    Main(Main s)\n    {\n        a = s.a;\n        b = s.b;\n    }\n    public static void main(String[] args)\n    {\n        Main x = new Main(20, 40);\n        Main y = x;\n        Main z = new Main(x);\n        z.a = 15;\n        System.out.println(x.a);\n    }\n}"],"exp":"Z is an object copied from x using the copy constructor, hence they do not correspond to the same reference. Therefore changing an element in z doesn't affect x or y's elements."},{"id":1169,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a","20 40"],["b",""],["c","Main@2a139a55"],["d","Compilation Error"]],"ans":"c","cod":["public class Main\n{\n    int a, b;\n    Main(int a, int b)\n    {\n        this.a = a;\n        this.b = b;\n    }\n    void Print()\n    {\n        System.out.println(this);\n    }\n    public static void main(String[] args)\n    {\n        Main x = new Main(20, 40);\n        Main y = x;\n        y.Print();\n    }\n}"],"exp":"When an object is printed, it is printed in the format ClassName@HashCode."},{"id":1170,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"b","cod":["public class Main\n{\n    int a, b;\n    Main(int a, int b)\n    {\n        this.a = a;\n        this.b = b;\n    }\n    public static void main(String[] args)\n    {\n        Main x = new Main(40, 80);\n        Main y = x;\n        System.out.println(x);\n        System.out.println(y);\n    }\n}"],"exp":"When an object is printed, it is printed in the format ClassName@HashCode. The objects x and y refer to the same objects as y is assigned to x. Hence they print the same output."},{"id":1171,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a","3"],["b","6"],["c","4"],["d","7"]],"ans":"a","cod":["import java.util.*;\npublic class Main\n{\n    String s;\n    Main(String a)\n    {\n        s = a;\n    }\n    void Position(char a)\n    {\n        System.out.println(s.indexOf(a));\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"Assigning Object\");\n        Main b = a;\n        b.Position('i');\n    }\n}"],"exp":"The indexOf function returns the first index of the specified character in the string calling it. Since indexing starts from 0, the nth position in a string refers to the (n-1)th index."},{"id":1172,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a","106"],["b","Compilation Error"],["c","Runtime Error"],["d","74"]],"ans":"d","cod":["public class Main\n{\n    char ch;\n    Main(char a)\n    {\n        ch = a;\n    }\n    void Ascii()\n    {\n        System.out.println((int)ch);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main('J');\n        Main b = a;\n        b.Ascii();\n    }\n}"],"exp":"When a character is type converted to integer, it converts to it's ascii value. The ascii value of 'j' is 106, and that of 'J' is 74."},{"id":1173,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"c","cod":["import java.util.*;\npublic class Main\n{\n    int a;\n    Main(int i)\n    {\n        a = i;\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(20);\n        Main b = a;\n        System.out.println(b.getClass());\n        System.out.println(a.getClass().getSuperclass());\n    }\n}"],"exp":"A class is an object of the superclass Object of the lang package of Java. Therefore when the superclass of Main is called, it returns java.lang.Object."},{"id":1174,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"a","cod":["import java.util.*;\npublic class Main\n{\n    LinkedList l = new LinkedList();\n    Main(int i)\n    {\n        l.add(i);\n    }\n    void push(int a)\n    {\n        l.add(a);\n    }\n    void print()\n    {\n        System.out.println(l);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(5);\n        Main b = a;\n        a.push(40);\n        b.push(30);\n        b.push(40);\n        b.print();\n        a.print();\n    }\n}"],"exp":"As both objects a and b correspond to the same reference, any change in one object will reflect on the other."},{"id":1175,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a","120"],["b","40"],["c","10"],["d","20"]],"ans":"a","cod":["public class Main\n{\n    int a, b;\n    Main(int i, int j)\n    {\n        a = i;\n        b = j;\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(10, 2);\n        Main b = a;\n        b.a = 30;\n        System.out.println(a.a<<b.b);\n    }\n}"],"exp":"The left shift operator adds 0s to the binary form of the number at the end, thus increasing the value in multiples of 2. Here the bits are shifted by 2, hence it is equivalent by multiplying the number by 22, which is 4."},{"id":1176,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"a","cod":["import java.util.*;\npublic class Main\n{\n    LinkedList l = new LinkedList();\n    Main(int i)\n    {\n        l.add(i);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(20);\n        Main b = a;\n        b.l.add(40);\n        System.out.println(a.l);\n        System.out.println(b.l);\n    }\n}"],"exp":"Objects a and b refer to the same reference as a is assigned to b with the assignment ( = ) operator, therefore a change in one object results in a change in both objects."},{"id":1177,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Compilation Error"]],"ans":"b","cod":["import java.util.*;\npublic class Main\n{\n    LinkedList l = new LinkedList();\n    Main(int i)\n    {\n        l.add(i);\n    }\n    void add(int a)\n    {\n        l.add(a);\n    }\n    void sum()\n    {\n        int sum = 0;\n        Iterator i = l.iterator();\n        while(i.hasNext())\n            sum+ = (int)i.next();\n        System.out.println(sum);\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(35);\n        Main b = a;\n        a.add(45);\n        b.add(32);\n        b.add(64);\n        a.add(23);\n        a.sum();\n        b.sum();\n    }\n}"],"exp":"The object a is assigned to b, therefore a change in one results in a change in both as they both are linked to the same reference."},{"id":1178,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"d","cod":["public class Main\n{\n    String s;\n    Main(String a)\n    {\n        s = a;\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"Sanfoundry\");\n        Main b = a;\n        System.out.println(a.s.indexOf('n'));\n        System.out.println(b.s.indexOf('n', 3));\n    }\n}"],"exp":"Both objects a and b refer to the same object as a is assigned to b. The indexOf function returns the index of the character in the string. If an integer is passed along with the character, it searches from that index."},{"id":1179,"cat":"OOP using Java","topic":"Assigning Objects","q":"What will be the output of the following Java code?","opts":[["a","Compilation Error"],["b","Sanfoundry"],["c","foundryfoundry"],["d","foundrySan"]],"ans":"c","cod":["public class Main\n{\n    String s;\n    Main(String a)\n    {\n        s = a;\n    }\n    void change(String a)\n    {\n        s = a;\n    }\n    public static void main(String[] args)\n    {\n        Main a = new Main(\"San\");\n        Main b = a;\n        b.change(\"foundry\");\n        System.out.println(b.s+a.s);\n    }\n}"],"exp":"The objects a and b are linked to the same reference because a is assigned to b, therefore changing something in one object changes it in both objects."},{"id":1180,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a","98000.0"],["b","98000"],["c","Compilation error"],["d","25000"]],"ans":"a","cod":["class Worker\n{\n    float salary=98000;\n}\nclass Manager extends Worker\n{\n    int bonus=25000;\n    public static void main(String args[])\n    {\n        Manager p=new Manager();\n        System.out.println(+p.salary);\n    }\n}"],"exp":"When you inherit from an existing class, you can reuse methods and fields of the inherited class. In this case, the variable 'salary' which is of datatype float is a part of the class 'Worker'. Hence, it can be accessed as the 'extend' keyword has been used by the current class."},{"id":1181,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a","player3"],["b","Free 30-Day Java Certification Bootcamp is Live. Join Now!"],["c","Compilation error"],["d",""]],"ans":"a","cod":["class Base\n{\n    void player1()\n    {\n        System.out.println(\"player1\");\n    }\n}\nclass Intermediate extends Base\n{\n    void player2()\n    {\n        System.out.println(\"player2\");\n    }\n}\nclass SubClass extends Intermediate\n{\n    void player3()\n    {\n        System.out.println(\"player3\");\n    }\n    public static void main(String args[])\n    {\n        SubClass d=new SubClass();\n        d.player3();\n    }\n}"],"exp":"A class can also be derived from one class, which is already derived from another base class. This is called Multilevel inheritance. In the above program, SubClass inherits the properties of Intermediate, which in turn has inherited the properties of Base class."},{"id":1182,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a","Base class called"],["b","Derived class called"],["c",""],["d",""]],"ans":"b","cod":["class Base\n{\n    public void display()\n    {\n        System.out.println(\"Base class called\");\n    }\n}\nclass Derived extends Base\n{\n    public void display()\n    {\n        System.out.println(\"Derived class called\");\n    }\n    public static void main(String[] args)\n    {\n        Base obj = new Derived();\n        obj.display();\n    }\n}"],"exp":"In the above program, 'obj' is a reference of Base type and refers to an object of Derived class. Functions are virtual by default in Java. So the run time polymorphism happens and show() in Derived is called."},{"id":1183,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a","Tier1"],["b",""],["c","Tier3"],["d","Compilation Error"]],"ans":"d","cod":["class Tier1\n{\n    public void Display()\n    {\n        System.out.println(\"Tier1\");\n    }\n}\nclass Tier2 extends Tier1\n{\n    public void Display()\n    {\n        System.out.println(\"Tier2\");\n    }\n}\nclass Tier3 extends Tier2\n{\n    public void Display()\n    {\n        super.super.Display();\n        System.out.println(\"Tier3\");\n    }\n    public static void main(String[] args)\n    {\n        Tier3 obj = new Tier3();\n        obj.Display();\n    }\n}"],"exp":"The 'super' keyword in Java cannot be nested as mentioned in the above program. The member functions and data members of Tier1 can be accessed only by tier2 using the 'super' keyword."},{"id":1184,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a","Inherited"],["b",""],["c",""],["d","Compilation error"]],"ans":"d","cod":["class SampleClass1\n{\n    System.out.println(\"Class1\");\n}\nclass SampleClass2\n{\n    System.out.println(\"Class2\");\n}\nclass Base extends SampleClass2, SampleClass1\n{\n    void display()\n    {\n        System.out.println(\"Inherited\");\n    }\n    public static void main(String[] args)\n    {\n        Base obj = new Base();\n        obj.Display();\n    }\n}"],"exp":"In Java, a class can not extend more than one class. Class Base is extending two classes - Class SampleClass2 and Class SampleClass1. It is a compile time error as Java doesn't support multiple inheritance."},{"id":1185,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a","2 2"],["b","3 3"],["c","2 3"],["d","3 2"]],"ans":"c","cod":["class Base\n{\n    int num1;\n}\nclass Derived extends Base\n{\n    int num2;\n    void display()\n    {\n        super.num1 = num2 + 1;\n        System.out.println(j + \" \" + i);\n    }\n    public static void main(String args[])\n    {\n        Derived obj = new Derived();\n        obj.num1 = 1;\n        obj.num2 = 2;\n        obj.display();\n    }\n}"],"exp":"The most common use of the super keyword is to eliminate the confusion between super-classes and sub-classes that have methods with the same name. In this case, the variable 'num1' is a part of the class Base and since the value of the variable 'num2' is 2, 'i' results in 3."},{"id":1186,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a","Class X"],["b","Class Y"],["c","Compilation error"],["d",""]],"ans":"a","cod":["class Base\n{\n    static void staticMethod()\n    {\n        System.out.println(\"Class X\");\n    }\n}\nclass Derived extends Base\n{\n    static void staticMethod()\n    {\n        System.out.println(\"Class Y\");\n    }\n    public static void main(String[] args)\n    {\n        Base.staticMethod();\n    }\n}"],"exp":"In this case, 'Base' is the super-class and 'Derived' is the sub-class. Since static methods do not require an object to be called, the member function staticMethod() can be called using the class name. As the class name mentioned in the output is Base, the print statement in Base class is executed."},{"id":1187,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a","2"],["b","1"],["c","Compilation error"],["d","-1"]],"ans":"a","cod":["class Base\n{\n    public void print_for()\n    {\n        System.out.println(\"1\");\n    }\n}\nclass Derived extends Base\n{\n    public void print_fr()\n    {\n        System.out.println(\"2\");\n    }\n    public static void main(String[] args)\n    {\n        Derived g = new Derived();\n        g.print_for();\n    }\n}"],"exp":"The object 'g' belongs to the class 'Derived'. Higher priority is given to the functions in the classtype belonging to the object incase of multiple functions having same prototype in different classes. The object 'g' is used to call the function print_for(). As Derived is a subclass and the object 'g' belongs to it, 2 will be the output."},{"id":1188,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a","Compilation error"],["b","Null"],["c","class java.io"],["d","class java.lang.Object"]],"ans":"d","cod":["class BaseClass\n{\n    public static void main(String[] args)\n    {\n        String s = new String(\"HelloWorld\");\n        Class strClass = s.getClass();\n        System.out.println(\"Base class of String: \" + strClass.getSuperclass());\n    }\n}"],"exp":"All classes in Java are inherited from Object class. In the same way, even the String class is a part of Object class. Therefore, the Object class is the superclass to all other classes and it defines methods that all its subclasses share."},{"id":1189,"cat":"OOP using Java","topic":"Base Class","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c","Compilation error"],["d",""]],"ans":"a","cod":["class Sum\n{\n    int z;\n    public void addition(int x, int y)\n    {\n        z = x + y;\n        System.out.println(z);\n    }\n}\nclass Product extends Sum\n{\n    public void multiplication(int x, int y)\n    {\n        z = x * y;\n        System.out.println(z);\n    }\npublic static void main(String args[])\n    {\n        int a = 2, b = 15;\n        Product obj = new Product();\n        obj.addition(a, b);\n        obj.multiplication(a, b);\n    }\n}"],"exp":"In this example, you can observe two classes namely Product and Sum. Using 'extends' keyword, the Product class inherits the method addition() of Sum class. In the given program, when an object to Product class is created, a copy of the contents of the superclass Sum is made within it. Hence addition() and multiplication() methods can be accessed using the created object."},{"id":1190,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a","Sandnfoury"],["b","Sanfoundry"],["c","ndnfouSary"],["d","Compilation Error"]],"ans":"a","cod":["import java.util.*;\npublic class Collection\n{\n    public static void main(String args[])\n    {\n        String a[] = {\"Sa\",\"nf\",\"ou\",\"nd\",\"ry\"};\n        Arrays.sort(a);\n        for(int i=0;i<5;i++)\n        {\n            System.out.print(a[i]);\n        }\n    }\n}"],"exp":"The sort() function of the Arrays class sorts the elements of the array in alphabetic order, giving more preference to upper case letters first. As the string "Sa" begins with an upper case letter, it is given more preference."},{"id":1191,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d","Random arrangement of the 4 items"]],"ans":"d","cod":["import java.util.*;\npublic class Collection2\n{\n    public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        l.add(\"Sanfoundry\");\n        l.add(10);\n        l.add(20);\n        l.add(30);\n        Collections.shuffle(l);\n        Iterator i = l.iterator();\n        while(i.hasNext())\n        System.out.println(i.next());\n    }\n}"],"exp":"The shuffle() function of the collections class shuffles the given linked list completely, therefore it is difficult to predict the final list after shuffling. There is no particular order for the shuffling and may result in many cases which are near impossible to compute."},{"id":1192,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a","Sanfoundry"],["b","yrdnuofnaS"],["c",""],["d",""]],"ans":"b","cod":["import java.util.*;\npublic class MainCall\n{\n    public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        l.add(\"S\");\n        l.add(\"a\");\n        l.add(\"n\");\n        l.add(\"f\");\n        l.add(\"o\");\n        l.add(\"u\");\n        l.add(\"n\");\n        l.add(\"d\");\n        l.add(\"r\");\n        l.add(\"y\");\n        Collections.reverse(l);\n        Iterator i = l.iterator();\n        while(i.hasNext())\n        System.out.print(i.next());\n    }\n}"],"exp":"The reverse() function of the Collections class reverses the elements of the given collection class(in this case, it is a linked list). Hence, the given string "Sanfoundry" stored in a linked list object 'l' appears in reverse order."},{"id":1193,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a","Sanfoundry"],["b",""Sanfoundry""],["c","[S, a, n, f, o, u, n, d, r, y]"],["d","Compilation Error"]],"ans":"c","cod":["import java.util.*;\npublic class MainExecute\n{\n    public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        String s = \"Sanfoundry\";\n        for(int i=0;i<s.length();i++)\n        {\n            l.add(s.charAt(i));\n        }\n        System.out.println(l);\n    }\n}"],"exp":"A string variable is converted into a linked list object 'l' in the above program. When a collection item is printed, it returns the collection in the form of an array by default if no further instructions are given by the user."},{"id":1194,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a","[1, 2, 5, 3]"],["b","[1, 2, 4, 3]"],["c","[1, 2, 4, 5]"],["d","Compilation Error"]],"ans":"b","cod":["import java.util.*;\npublic class LinkedList\n{\n    public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        l.add(1);\n        l.add(2);\n        l.add(4);\n        l.add(5);\n        l.add(3);\n        l.remove(3);\n        System.out.println(l);\n    }\n}"],"exp":"The remove() function of the Collection class removes the element at the specified index from the collection. In the above program, the index 3 is specified inside the remove() method, hence the number 3 which is a part of the linked list is erased from the linked list."},{"id":1195,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a","[S, n, f, o, n]"],["b","[a, u, d, r, y]"],["c","[S, n, f, o]"],["d","Error"]],"ans":"a","cod":["import java.util.*;\npublic class retainAll\n{\n    public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        String s = \"Sanfoundry\";\n        for(int i=0;i<s.length();i++)\n        {\n            l.add(s.charAt(i));\n        }\n        LinkedList a = new LinkedList();\n        a.add('S');\n        a.add('f');\n        a.add('n');\n        a.add('o');\n        l.retainAll(a);\n        System.out.println(l);\n    }\n}"],"exp":"The retainAll() function retains all the values of the given collection. If the function is called, it matches the given class or object in the collection which is passed as a parameter to the function in the given block of code."},{"id":1196,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","1"],["c","true"],["d","false"]],"ans":"c","cod":["import java.util.*;\npublic class charAt\n{\n    public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        String s = \"Sanfoundry\";\n        for(int i=0;i<s.length();i++)\n        {\n            l.add(s.charAt(i));\n        }\n        System.out.println(l.contains('S'));\n    }\n}"],"exp":"The contains() function of Collections class is used to check if the element specified is present in the collection class. If it is present, it returns true, otherwise it returns false."},{"id":1197,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a","No output"],["b","Found 'n'"],["c",""],["d","Compilation Error"]],"ans":"c","cod":["import java.util.*;\npublic class Find\n{\n     public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        l.add(\"S\");\n        l.add(\"a\");\n        l.add(\"n\");\n        l.add(\"f\");\n        l.add(\"o\");\n        l.add(\"u\");\n        l.add(\"n\");\n        l.add(\"d\");\n        l.add(\"r\");\n        l.add(\"y\");\n        Iterator i = l.iterator();\n        while(i.hasNext())\n        {\n            if(i.next().equals(\"n\"))\n            System.out.println(\"Found 'n'\");\n        }\n    }\n}"],"exp":"The iterator i iterates through the LinkedList and next function gives the value of the element. The if checks if the element of the list is equal to "n" or not. If it is equal to the given string "n", then it prints Found 'n'."},{"id":1198,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"c","cod":["import java.util.*;\npublic class Size\n{\n     public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        for(int i=0;i<10;i++)\n        {\n            l.add(i);\n        }\n        System.out.println(l.size());\n        l.clear();\n        System.out.println(l.size());\n    }\n}"],"exp":"The size() function of the collections class returns the size of the collection calling it, and the clear() function clears all the items in the collection calling it. In the above code, the size() function is used twice, once for the original linked list and second time for the empty linked list."},{"id":1199,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","cod":["import java.util.*;\npublic class hashCode\n{\n     public static void main(String args[])\n    {\n        LinkedList l = new LinkedList();\n        l.add(\"Sanfoundry\");\n        System.out.println(l.hashCode());\n        l.clear();\n        System.out.println(l.hashCode());\n        l.add(\"SANFOUNDRY\");\n        System.out.println(l.hashCode());\n        l.clear();\n        System.out.println(l.hashCode());\n    }\n}"],"exp":"The hashCode() function of the collections class returns a specific hashcode for a collection which changes based on the content of the collection. For an empty collection, the hashcode is always 1. Hashcode generated is very complicated and tough to predict for a user."},{"id":1200,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a","A"],["b","B"],["c",""],["d",""]],"ans":"a","cod":["import java.util.*;\npublic class Stack\n{\n    public static void main(String args[])\n    {\n        Stack<String> stack = new Stack<String>();\n        stack.push(\"A\");\n        stack.push(\"B\");\n        stack.pop();\n        Iterator<String> itr=stack.iterator();\n        while(itr.hasNext())\n        {\n            System.out.println(itr.next());\n        }\n    }\n}"],"exp":"Stack is a first-in-first-out(FIFO) oriented data structure. Stack collection class has two features - push and pop. Push mechanism inserts an element at the top of the stack while pop removes the top element."},{"id":1201,"cat":"OOP using Java","topic":"Collection Classes","q":"What will be the output of the following Java code?","opts":[["a","A"],["b","B"],["c","Null"],["d","Compilation error"]],"ans":"a","cod":["import java.util.*;\nclass TestJavaCollection1\n{\n    public static void main(String args[])\n    {\n        ArrayList<String> list=new ArrayList<String>();\n        list.add(\"A\");\n        Iterator itr=list.iterator();\n        while(itr.hasNext())\n        {\n            System.out.println(itr.next());\n        }\n    }\n}"],"exp":"The ArrayList class is a resizable dynamic array, which can be found in the java.util package. It is a collection class which used to store values in an array, dynamically at the runtime by the compiler."},{"id":1202,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","14"],["b","100"],["c","1400"],["d","14100"]],"ans":"a","cod":["class StudentData\n{\n   int ID;\n   String Name;\n   int Age;\n   StudentData()\n   {\n       ID = 100;\n       Name = \"New\";\n       Age = 18;\n   }\n   StudentData(int num1, String str, int num2)\n   {\n       ID = num1;\n       Name = str;\n       Age = num2;\n       System.out.println(ID);\n   }\n   public static void main(String args[])\n   {\n       StudentData obj = new StudentData();\n       StudentData obj2 = new StudentData(14, \"Dravid\", 25);\n  }\n}"],"exp":"StudentData is a classs having two constructors- one of them is of default nature and other is of type parameterized. There are two objects 'obj' and 'obj2' created for that sake. The parameterized constructor having the print statement displays the output using the values given during the object creation."},{"id":1203,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","2.0"],["b","2"],["c","2.0f"],["d","2.0d"]],"ans":"a","cod":["class PrintNumber\n{\n    float num;\n    public PrintNumber(int num)\n    {\n        this.num=num;\n    }\n    public PrintNumber(float num)\n    {\n        this.num=num;\n    }\n    void Display()\n    {\n        System.out.println(num);\n    }\n    public static void main(String[] args)\n    {\n        PrintNumber obj=new PrintNumber(2);\n        PrintNumber obj1=new PrintNumber(2.0f);\n        obj1.Display();\n    }\n}"],"exp":"'this' keyword is used to refer to the currently executing object. In the above program, there is an instance variable named 'num' which is initialized using two constructors. There are two objects created for passing int and float values. Since the Display() method is called using obj1 object, the float value is printed.\nFree 30-Day C Certification Bootcamp is Live. Join Now!"},{"id":1204,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","2.0"],["b","Compilation Error"],["c","2.0f"],["d","2.0d"]],"ans":"b","cod":["class Overload\n{\n    float num;\n    int x;\n    public Overload(int num)\n    {\n        x=num;\n    }\n    public Overload(float num)\n    {\n        this.num=num;\n    }\n    void Display()\n    {\n        System.out.println(num);\n    }\n    public static void main(String[] args)\n    {\n        Overload obj=new Overload(2);\n        Overload obj1=new Overload(2.0);\n        obj1.Display();\n    }\n}"],"exp":"One instance integer variable 'x' and the other float instance variable 'num' are initialized in separate constructors. Objects 'obj' and 'obj1' are created for the same purpose. As obj1 passes a float variable but calls the constructor used to initialize an integer variable, the compiler throws an error."},{"id":1205,"cat":"OOP using Java","topic":"Constructor Overloading","q":"What is the output of the following Java code?","opts":[["a","0"],["b","Null"],["c","Compilation Error"],["d","Garbage Value"]],"ans":"c","cod":["class Sum\
