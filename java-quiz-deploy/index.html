 = \"Sanfoundry\";\n}\nclass B extends A\n{\n    void index(char ch)\n    {\n        System.out.println(s.indexOf(ch));\n    }\n}\npublic class Index\n{\n    public static void main(String[] args)\n    {\n       B b = new B();\n       b.index('n');\n    }\n}"],"exp":"The object 'b' is an object of the class B, which extends class A, hence inheriting the value of the String variable 's'. The indexOf function returns the index of the first instance of a character in the string. As indexing starts from 0, the nth position refers to the (n-1)th index."},{"id":1494,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","25"],["b","Garbage Value"],["c","Compilation Error"],["d","-1"]],"ans":"a","cod":["import java.util.ArrayList;\nclass ArrayList\n{\n    public static void main(String[] args)\n    {\n        ArrayList<Integer> al = new ArrayList<Integer>();\n        al.add(25);\n        System.out.println(al.get(0));\n    }\n}"],"exp":"The above program uses the concept of wrapper class. When working with Collection objects and data structures such as ArrayList, primitive types cannot be used. Hence, wrapper class 'Integer' is used in this case."},{"id":1495,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","25"],["b","Garbage Value"],["c","Compilation Error"],["d","-1"]],"ans":"c","cod":["import java.util.ArrayList;\nclass ArrayList2\n{\n    public static void main(String[] args)\n    {\n        ArrayList<int> al = new ArrayList<int>();\n        al.add(25);\n        System.out.println(al.get(0));\n    }\n}"],"exp":"The above program uses the concept of wrapper class. When an object to a wrapper class is created, a memory location is allocated and primitive data types can be stored. As ArrayList uses only object reference for storing values, primitive datatypes like 'int' cannot be used."},{"id":1496,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","5"],["b","Compilation error"],["c","4"],["d","Null"]],"ans":"a","cod":["class IntegertoString\n{\n    public static void main(String[] args)\n    {\n        Integer num = 12345;\n        String str = num.toString();\n        System.out.println(str.length());\n    }\n}"],"exp":"Wrapper classes come under java.util package. 'toString()' method is used to convert wrapper objects to strings. In the following example, we convert an Integer object to a String, and use the length() method of the String class to output the length of the "string"."},{"id":1497,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","3"],["b","Compilation error"],["c","150"],["d","2"]],"ans":"b","cod":["class InttoString\n{\n    public static void main(String[] args)\n    {\n        int num = 150;\n        String str = num.toString();\n        System.out.println(str.length());\n    }\n}"],"exp":"A wrapper class in Java converts a primitive data type into class object. toString() method is used to convert wrapper objects to strings but as num is a primitive datatype(int), an error is thrown because toString() method cannot convert a primitive datatype to a string."},{"id":1498,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","4 3.99"],["b","4 3"],["c","4 0.99"],["d","Compilation error"]],"ans":"a","cod":["class InttoDouble\n{\n    public static void main(String[] args)\n    {\n        Integer myInt = 4;\n        Double myDouble = 3.99;\n        System.out.print(myInt+\" \");\n        System.out.println(myDouble);\n    }\n}"],"exp":"Wrapper classes are those whose objects wraps a primitive data type within them. In the java.lang package, Java provides a separate class for each of the primitive data types namely Byte, Character, Double, Integer, Float, Long and Short. The objects can be printed directly using System.out.print() function."},{"id":1499,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","3"],["b","3.0"],["c","Garbage Value"],["d","Compilation Error"]],"ans":"d","cod":["class Double\n{\n    public static void main(String[] args)\n    {\n        Double num = 3;\n        System.out.println(num);\n    }\n}"],"exp":"Wrapper classes provide a way to use primitive data types (int, boolean, etc..) as objects. In the java.lang package, Java provides a separate class for each of the primitive data types namely Byte, Character, Double, Integer, Float, Long, Short. As the object 'num' is of object Double, it needs to have a fractional part to be differentiated from an Integer object. In this code, 3 is considered an Integer object and not as a Double object."},{"id":1500,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","6.80"],["b","6.8"],["c","Garbage Value"],["d","Compilation Error"]],"ans":"b","cod":["class Double2\n{\n    public static void main(String[] args)\n    {\n        Double num = 6.80;\n        System.out.println(num);\n    }\n}"],"exp":"The wrapper class in Java provides the mechanism to convert primitive datatypes into object and object into primitive. The 'num' object has the value 6.80 which makes it readable by the compiler as a object of type Double without any ambiguity. Compilers ignores the zero at the least valued position."},{"id":1501,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","3.14 1.42"],["b","Compilation error"],["c","3.14 null"],["d","3.14 -1"]],"ans":"a","cod":["class PiObject\n{\n    public static void main(String[] args)\n    {\n        Double num1 = 3.14;\n        Double num2 = new Double(1.42);\n        System.out.print(num1+\" \"+num2);\n    }\n}"],"exp":"Both the statements written above convey the same thing, ie converting a primitive data to an object. The primitive data types are not objects and hence they do not belong to any class like the Wrapper classes. While using collections or data structures such as ArrayList, it is required to convert the primitive type to object first which we can do by using wrapper classes."},{"id":1502,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","100 D"],["b","100 100"],["c","Compilation error"],["d","Garbage value"]],"ans":"b","cod":["class Value\n{\n    public static void main(String args[])\n    {\n        Integer obj = new Integer(100);\n        int num = obj.intValue();\n        System.out.println(num+ \" \"+ obj);\n    }\n}"],"exp":"A Wrapper class is a class whose object wraps or contains a primitive data type. We can wrap a primitive value into a wrapper class object. An object of a wrapper class can also be converted to its corresponding primitive type. In this case, an Integer object is converted to int using intValue()."},{"id":1503,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","10"],["b","11"],["c","Compilation error"],["d","-1"]],"ans":"a","cod":["class Calculate\n{\n    public static void main(String[] args)\n    {\n        Integer obj = new Integer(10);\n        calc(obj);\n        System.out.print(obj);\n    }\n    public static void calc(Integer obj)\n    {\n        obj = obj + 1;\n    }\n}"],"exp":"Wrapper classes are immutable in nature. An object of a wrapper class can also be converted to its corresponding primitive type. Hence, the wrapper classes cannot be modified and the same value of the object stays till the end."},{"id":1504,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","10 10"],["b","10 -1"],["c","Garbage value"],["d","Compilation error"]],"ans":"a","cod":["class ValueOfNum\n{\n    public static void main(String args[])\n    {\n        int num=10;\n        Integer obj=Integer.valueOf(num);\n        System.out.println(num+ \" \"+ obj);\n    }\n}"],"exp":"Wrapper classes provide a way to use primitive data types (int, boolean, etc..) as objects. Here an int is converted into an Integer. Indirectly, a primitive datatype is converted into an object."},{"id":1505,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","1"],["b","0"],["c","-1"],["d","Compilation error"]],"ans":"a","cod":["class CompareTo\n{\n    public static void main(String args[])\n    {\n        Integer i = new Integer(10);\n        System.out.println(i.compareTo(7));\n    }\n}"],"exp":"'compareTo' method in java.lang.Number class is used to compare two objects of same type. It is an additional feature under Number class for wrapper classes. Two different types cannot be compared, so both the argument and the Number object that invoke the method should be of the same type. The value 1 is returned if the number is greater than the argument."},{"id":1506,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","64 144 1100100"],["b","64 134 0010011"],["c","59 144 1100100"],["d","64 134 0010011"]],"ans":"a","cod":["class Conversion\n{\n    public static void main(String args[])\n    {\n        int b=100;\n        System.out.print(Integer.toHexString(b)+\" \");\n        System.out.print(Integer.toOctalString(b)+\" \");\n        System.out.print(Integer.toBinaryString(b)+\" \");\n    }\n}"],"exp":"A wrapper class is a class whose object wraps or contains a primitive data types. The above methods are used to convert integers of base 10 into hexadecimal, octal and binary type."},{"id":1507,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","1100100"],["b","4"],["c","100"],["d","Compilation error"]],"ans":"b","cod":["class StringValueOf\n{\n    public static void main(String args[])\n    {\n        String b=\"100\";\n        System.out.print(Integer.valueOf(b,2));\n    }\n}"],"exp":"The wrapper class in Java provides the mechanism to convert primitive into object and object into primitive. The valueOf() returns an Integer object holding the integer value of the specified string representation, parsed with the value of radix. In this case, 2 is the base radix. Hence, 100 is converted into binary."},{"id":1508,"cat":"OOP using Java","topic":"Wrapper Class","q":"What is the output of the following Java code?","opts":[["a","2"],["b","17"],["c","Compilation error"],["d","-1"]],"ans":"d","cod":["class IndexOf\n{\n    public static void main(String args[])\n    {\n        Integer b=17;\n        String str=Integer.toString(b);\n        System.out.println(str.indexOf(\"5\"));\n    }\n}"],"exp":"Wrapper classes are those whose objects wraps a primitive data type within them. Here, variable 'b' is of a primitive data type int. It is converted to a string using a toString() method and hence all string functions can be used on it."},{"id":1509,"cat":"Advanced Java","topic":"Annotations","q":"Which version of Java introduced annotation?","opts":[["a","Java 5"],["b","Java 6"],["c","Java 7"],["d","Java 8"]],"ans":"a","exp":"Annotation were introduced with Java 5 version."},{"id":1510,"cat":"Advanced Java","topic":"Annotations","q":"Annotation type definition looks similar to which of the following?","opts":[["a","Method"],["b","Class"],["c","Interface"],["d","Field"]],"ans":"c","exp":"Annotation type definition is similar to an interface definition in which the keyword interface is preceded by the sign @."},{"id":1511,"cat":"Advanced Java","topic":"Annotations","q":"Which of the following is not pre defined annotation in Java?","opts":[["a","@Deprecated"],["b","@Overriden"],["c","@SafeVarags"],["d","@FunctionInterface"]],"ans":"b","exp":"@Overriden is not a pre defined annotation in Java. @Depricated, @Override, @SuppressWarnings, @SafeVarags and @FunctionInterface are the pre defined annotations."},{"id":1512,"cat":"Advanced Java","topic":"Annotations","q":"Annotations which are applied to other annotations are called meta annotations.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"Annotations which are applied to other annotations are called meta annotations."},{"id":1513,"cat":"Advanced Java","topic":"Annotations","q":"Which one of the following annotations is not used in Hibernate?","opts":[["a","@Entity"],["b","@Column"],["c","@Basic"],["d","@Query"]],"ans":"d","exp":"@Query is not an annotation used in Hibernate."},{"id":1514,"cat":"Advanced Java","topic":"Annotations","q":"Which one of the following is not ID generating strategy using @GeneratedValue annotation?","opts":[["a","Auto"],["b","Manual"],["c","Identity"],["d","Sequence"]],"ans":"b","exp":"Auto, Table, Identity and Sequence are the ID generating strategies using @GeneratedValue annotation."},{"id":1515,"cat":"Advanced Java","topic":"Annotations","q":"Which one of the following is not an annotation used by Junit with Junit4?","opts":[["a","@Test"],["b","@BeforeClass"],["c","@AfterClass"],["d","@Ignored"]],"ans":"d","exp":"@Test, @Before, @BeforeClass, @After, @AfterClass and @Ignores are the annotations used by Junit with Junit4."},{"id":1516,"cat":"Advanced Java","topic":"Annotations","q":"Using which annotation non visible or private method can be tested?","opts":[["a","@VisibleForTesting"],["b","@NonVisibleForTesting"],["c","@Visible"],["d","@NonVisible"]],"ans":"a","exp":"Using @VisibleForTesting annotation private or non visible method can be tested."},{"id":1517,"cat":"Advanced Java","topic":"Annotations","q":"Which of the following annotation is used to avoid execution of Junits?","opts":[["a","@NoTest"],["b","@explicit"],["c","@avoid"],["d","@ignore"]],"ans":"d","exp":"@ignore annotation is used to avoid execution of Junits."},{"id":1518,"cat":"Advanced Java","topic":"Annotations","q":"Which is the Parent class of annotation class?","opts":[["a","Class"],["b","Object"],["c","Main"],["d","Super"]],"ans":"b","exp":"Object is the parent class of annotation class."},{"id":1519,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Which of below is not a dependency management tool?","opts":[["a","Ant"],["b","Maven"],["c","Gradle"],["d","Jenkins"]],"ans":"d","exp":"Jenkins is continuous integration system. Ant, Maven, Gradle is used for build process."},{"id":1520,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Which of the following is not a maven goal?","opts":[["a","clean"],["b","package"],["c","install"],["d","debug"]],"ans":"d","exp":"clean, package, install are maven goals. Debug is used finding and resolving of defects."},{"id":1521,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Which file is used to define dependency in maven?","opts":[["a","build.xml"],["b","pom.xml"],["c","dependency.xml"],["d","version.xml"]],"ans":"b","exp":"pom.xml is used to define dependency which is used to package the jar. POM stands for project object model."},{"id":1522,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Which file is used to specify the packaging cycle?","opts":[["a","build.xml"],["b","pom.xml"],["c","dependency.xml"],["d","version.xml"]],"ans":"a","exp":"Project structure is specified in build.xml."},{"id":1523,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Which environment variable is used to specify the path to maven?","opts":[["a","JAVA_HOME"],["b","PATH"],["c","MAVEN_HOME"],["d","CLASSPATH"]],"ans":"c","exp":"MAVEN_HOME should be set to the bin folder of maven installation."},{"id":1524,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Which of the below is a source code management tool?","opts":[["a","Jenkins"],["b","Maven"],["c","Git"],["d","Hudson"]],"ans":"c","exp":"Source code management tools help is version control, compare different versions of code, crash management, etc. Git, SVN are popular source code management tools."},{"id":1525,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Can we run Junits as a part of Jenkins job?","opts":[["a","True"],["b","False"]],"ans":"a","exp":"As a part of jenkins job, we can run junits, fitnesse, test coverage reports, call shell or bat scripts, etc."},{"id":1526,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Which command can be used to check maven version?","opts":[["a","mvn -ver"],["b","maven -ver"],["c","maven -version"],["d","mvn -version"]],"ans":"d","exp":"mvn -version can be used to check the version of installed maven from command prompt."},{"id":1527,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Which of the following is not true for Ant?","opts":[["a","It is a tool box"],["b","It provides lifecycle management"],["c","It is procedural"],["d","It doesn't have formal conventions"]],"ans":"b","exp":"Ant doesn't provide lifecycle management. Maven provides lifecycle."},{"id":1528,"cat":"Advanced Java","topic":"Application Lifecycle - Ant, Maven and Jenkins","q":"Which maven plugin creates the project structure?","opts":[["a","dependency"],["b","properties"],["c","archetype"],["d","execution"]],"ans":"c","exp":"Archetype is the maven plugin which creates the project structure."},{"id":1529,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"Autocloseable was introduced in which Java version?","opts":[["a","java SE 7"],["b","java SE 8"],["c","java SE 6"],["d","java SE 4"]],"ans":"a","exp":"Java 7 introduced autocloseable interface."},{"id":1530,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"What is the alternative of using finally to close resource?","opts":[["a","catch block"],["b","autocloseable interface to be implemented"],["c","try block"],["d","throw Exception"]],"ans":"b","exp":"Autocloseable interface provides close() method to close this resource and any other underlying resources."},{"id":1531,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"Which of the below is a child interface of Autocloseable?","opts":[["a","Closeable"],["b","Close"],["c","Auto"],["d","Cloneable"]],"ans":"a","exp":"A closeable interface extends autocloseable interface. A Closeable is a source or destination of data that can be closed."},{"id":1532,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"It is a good practise to not throw which exception in close() method of autocloseable?","opts":[["a","IOException"],["b","CustomException"],["c","InterruptedException"],["d","CloseException"]],"ans":"c","exp":"InterruptedException interacts with a thread's interrupted status and runtime misbehavior is likely to occur if an InterruptedException is suppressed."},{"id":1533,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"What will be the output of the following Java code snippet?","opts":[["a","Runtime Error"],["b","IOException"],["c","Compilation Error"],["d","Runs successfully"]],"ans":"d","cod":["try (InputStream is = ...)\n{\n    // do stuff with is...\n}\ncatch (IOException e)\n{\n    // handle exception\n}"],"exp":"Using java 7 and above, AutoCloseable objects can be opened in the try-block (within the ()) and will be automatically closed instead of using the finally block."},{"id":1534,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"What is the difference between AutoCloseable and Closeable?","opts":[["a","Closeable is an interface and AutoCloseable is a concrete class"],["b","Closeable throws IOException; AutoCloseable throws Exception"],["c","Closeable is a concept; AutoCloseable is an implementation"],["d","Closeable throws Exception; AutoCloseable throws IOException"]],"ans":"b","exp":"Closeable extends AutoCloseable and both are interfaces. Closeable throws IOException and AutoCloseable throws Exception."},{"id":1535,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"What is the use of Flushable interface?","opts":[["a","Flushes this stream by writing any buffered output to the underlying stream"],["b","Flushes this stream and starts reading again"],["c","Flushes this connection and closes it"],["d","Flushes this stream and throws FlushException"]],"ans":"a","exp":"Flushable interface provides flush() method which Flushes this stream by writing any buffered output to the underlying stream."},{"id":1536,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"Which version of java added Flushable interface?","opts":[["a","java SE 7"],["b","java SE 8"],["c","java SE 6"],["d","java SE 5"]],"ans":"d","exp":"Flushable and Closeable interface are added in java SE 5."},{"id":1537,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"Does close() implicitly flush() the stream.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"close() closes the stream but it flushes it first."},{"id":1538,"cat":"Advanced Java","topic":"AutoCloseable, Closeable and Flushable Interfaces","q":"AutoCloseable and Flushable are part of which package?","opts":[["a","Autocloseable java.lang; Flushable java.io"],["b","Autocloseable java.io; Flushable java.lang"],["c","Autocloseable and Flushable java.io"],["d","Autocloseable and Flushable java.lang"]],"ans":"a","exp":"Autocloseable is a part of java.lang; Flushable is a part of java.io."},{"id":1539,"cat":"Advanced Java","topic":"Client and Server","q":"How does applet and servlet communicate?","opts":[["a","HTTP"],["b","HTTPS"],["c","FTP"],["d","HTTP Tunneling"]],"ans":"d","exp":"Applet and Servlet communicate through HTTP Tunneling."},{"id":1540,"cat":"Advanced Java","topic":"Client and Server","q":"In CGI, process starts with each request and will initiate OS level process.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"A new process is started with each client request and that corresponds to initiate a heavy OS level process for each client request."},{"id":1541,"cat":"Advanced Java","topic":"Client and Server","q":"Which class provides system independent server side implementation?","opts":[["a","Socket"],["b","ServerSocket"],["c","Server"],["d","ServerReader"]],"ans":"b","exp":"ServerSocket is a java.net class which provides system independent implementation of server side socket connection."},{"id":1542,"cat":"Advanced Java","topic":"Client and Server","q":"What happens if ServerSocket is not able to listen on the specified port?","opts":[["a","The system exits gracefully with appropriate message"],["b","The system will wait till port is free"],["c","IOException is thrown when opening the socket"],["d","PortOccupiedException is thrown"]],"ans":"c","exp":"public ServerSocket() creates an unbound server socket. It throws IOException if specified port is busy when opening the socket."},{"id":1543,"cat":"Advanced Java","topic":"Client and Server","q":"What does bind() method of ServerSocket offer?","opts":[["a","binds the serversocket to a specific address (IP Address and port)"],["b","binds the server and client browser"],["c","binds the server socket to the JVM"],["d","binds the port to the JVM"]],"ans":"a","exp":"bind() binds the server socket to a specific address (IP Address and port). If address is null, the system will pick an ephemeral port and valid local address to bind socket."},{"id":1544,"cat":"Advanced Java","topic":"Client and Server","q":"Which of the below are common network protocols?","opts":[["a","TCP"],["b","UDP"],["c","TCP and UDP"],["d","CNP"]],"ans":"c","exp":"Transmission Control Protocol(TCP) and User Datagram Protocol(UDP) are the two common network protocol. TCP/IP allows reliable communication between two applications. UDP is connection less protocol."},{"id":1545,"cat":"Advanced Java","topic":"Client and Server","q":"Which class represents an Internet Protocol address?","opts":[["a","InetAddress"],["b","Address"],["c","IP Address"],["d","TCP Address"]],"ans":"a","exp":"InetAddress represents an Internet Protocol address. It provides static methods like getByAddress(), getByName() and other instance methods like getHostName(), getHostAddress(), getLocalHost()."},{"id":1546,"cat":"Advanced Java","topic":"Client and Server","q":"What does local IP address start with?","opts":[["a","10.X.X.X"],["b","172.X.X.X"],["c","192.168.X.X"],["d","10.X.X.X, 172.X.X.X, or 192.168.X.X"]],"ans":"d","exp":"Local IP addresses look like 10.X.X.X, 172.X.X.X, or 192.168.X.X."},{"id":1547,"cat":"Advanced Java","topic":"Client and Server","q":"What happens if IP Address of host cannot be determined?","opts":[["a","The system exit with no message"],["b","UnknownHostException is thrown"],["c","IOException is thrown"],["d","Temporary IP Address is assigned"]],"ans":"b","exp":"UnknownHostException is thrown when IP Address of host cannot be determined. It is an extension of IOException."},{"id":1548,"cat":"Advanced Java","topic":"Client and Server","q":"What is the java method for ping?","opts":[["a","hostReachable()"],["b","ping()"],["c","isReachable()"],["d","portBusy()"]],"ans":"c","exp":"inet.isReachable(5000) is a way to ping a server in java."},{"id":1549,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"Which mode allows us to run program interactively while watching source code and variables during execution?","opts":[["a","safe mode"],["b","debug mode"],["c","successfully run mode"],["d","exception mode"]],"ans":"b","exp":"Debug mode allows us to run program interactively while watching source code and variables during execution."},{"id":1550,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"How can we move from one desired step to another step?","opts":[["a","breakpoints"],["b","System.out.println"],["c","logger.log"],["d","logger.error"]],"ans":"a","exp":"Breakpoints are inserted in code. We can move from one point to another in the execution of a program."},{"id":1551,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"Which part stores the program arguments and startup parameters?","opts":[["a","debug configuration"],["b","run configuration"],["c","launch configuration"],["d","project configuration"]],"ans":"c","exp":"Launch configuration stores the startup class, program arguments and vm arguments."},{"id":1552,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"How to deep dive into the execution of a method from a method call?","opts":[["a","F3"],["b","F5"],["c","F7"],["d","F8"]],"ans":"b","exp":"F5 executes currently selected line and goes to the next line in the program. If the selected line is a method call, debugger steps into the associated code."},{"id":1553,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"Which key helps to step out of the caller of currently executed method?","opts":[["a","F3"],["b","F5"],["c","F7"],["d","F8"]],"ans":"c","exp":"F7 steps out to the caller of the currently executed method. This finishes the execution of the current method and returns to the caller of this method."},{"id":1554,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"Which view allows us to delete and deactivate breakpoints and watchpoints?","opts":[["a","breakpoint view"],["b","variable view"],["c","debug view"],["d","logger view"]],"ans":"a","exp":"The Breakpoints view allows us to delete and deactivate breakpoints and watchpoints. We can also modify their properties."},{"id":1555,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"What is debugging an application which runs on another java virtual machine on another machine?","opts":[["a","virtual debugging"],["b","remote debugging"],["c","machine debugging"],["d","compiling debugging"]],"ans":"b","exp":"Remote debugging allows us to debug applications which run on another Java virtual machine or even on another machine. We need to set certain flags while starting the application."},{"id":1556,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"What happens when the value of variable change?","opts":[["a","changed value pop on the screen"],["b","variable changes are printed in logs"],["c","dump of variable changes are printed on the screen on end of execution"],["d","variable tab shows variables highlighted when values change"]],"ans":"d","exp":"When a variable value changes, the value in variable tab is highlighted yellow in eclipse."},{"id":1557,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"Which perspective is used to run a program in debug view?","opts":[["a","java perspective"],["b","eclipse perspective"],["c","debug perspective"],["d","jdbc perspective"]],"ans":"c","exp":"We can switch from one perspective to another. Debug perspective shows us the breakpoints, variables, etc."},{"id":1558,"cat":"Advanced Java","topic":"Debugging in Eclipse","q":"How does eclipse provide the capability for debugging browser actions?","opts":[["a","internal web browser"],["b","chrome web browser"],["c","firefox web browser"],["d","internet explorer browser"]],"ans":"a","exp":"Eclipse provides internal web browser to debug browser actions."},{"id":1559,"cat":"Advanced Java","topic":"Design Patterns","q":"Which of the below is not a valid design pattern?","opts":[["a","Singleton"],["b","Factory"],["c","Command"],["d","Java"]],"ans":"d","exp":"Design pattern is a general repeatable solution to a commonly occurring problem in software design. There are various patterns available for use in day to day coding problems."},{"id":1560,"cat":"Advanced Java","topic":"Design Patterns","q":"Which of the below author is not a part of GOF (Gang of Four)?","opts":[["a","Erich Gamma"],["b","Gang Pattern"],["c","Richard Helm"],["d","Ralph Johnson"]],"ans":"b","exp":"Four authors named Richard Helm, Erich Gamma, Ralph Johnson and John Vlissides published a book on design patterns. This book initiated the concept of Design Pattern in Software development. They are known as Gang of Four (GOF)."},{"id":1561,"cat":"Advanced Java","topic":"Design Patterns","q":"Which of the below is not a valid classification of design pattern?","opts":[["a","Creational patterns"],["b","Structural patterns"],["c","Behavioural patterns"],["d","Java patterns"]],"ans":"d","exp":"Java patterns is not a valid classification of design patterns. The correct one is J2EE patterns."},{"id":1562,"cat":"Advanced Java","topic":"Design Patterns","q":"Which design pattern provides a single class which provides simplified methods required by client and delegates call to those methods?","opts":[["a","Adapter pattern"],["b","Builder pattern"],["c","Facade pattern"],["d","Prototype pattern"]],"ans":"c","exp":"Facade pattern hides the complexities of the system and provides an interface to the client using which client can access the system."},{"id":1563,"cat":"Advanced Java","topic":"Design Patterns","q":"Which design pattern ensures that only one object of particular class gets created?","opts":[["a","Singleton pattern"],["b","Filter pattern"],["c","State pattern"],["d","Bridge pattern"]],"ans":"a","exp":"Singleton pattern involves a single class which is responsible to create an object while making sure that only one object gets created. This class provides a way to access the only object which can be accessed directly without need to instantiate another object of the same class."},{"id":1564,"cat":"Advanced Java","topic":"Design Patterns","q":"Which design pattern suggests multiple classes through which request is passed and multiple but only relevant classes carry out operations on the request?","opts":[["a","Singleton pattern"],["b","Chain of responsibility pattern"],["c","State pattern"],["d","Bridge pattern"]],"ans":"b","exp":"Chain of responsibility pattern creates a chain of receiver objects for a particular request. The sender and receiver of a request are decoupled based on the type of request. This pattern is one of the behavioral patterns."},{"id":1565,"cat":"Advanced Java","topic":"Design Patterns","q":"Which design pattern represents a way to access all the objects in a collection?","opts":[["a","Iterator pattern"],["b","Facade pattern"],["c","Builder pattern"],["d","Bridge pattern"]],"ans":"a","exp":"Iterator pattern represents a way to access the elements of a collection object in sequential manner without the need to know its underlying representation."},{"id":1566,"cat":"Advanced Java","topic":"Design Patterns","q":"What does MVC pattern stands for?","opts":[["a","Mock View Control"],["b","Model view Controller"],["c","Mock View Class"],["d","Model View Class"]],"ans":"b","exp":"Model represents an object or JAVA POJO carrying data.View represents the visualization of the data that model contains. The controller acts on both model and view. It is usually used in web development."},{"id":1567,"cat":"Advanced Java","topic":"Design Patterns","q":"Is design pattern a logical concept.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"Design pattern is a logical concept. Various classes and frameworks are provided to enable users to implement these design patterns."},{"id":1568,"cat":"Advanced Java","topic":"Design Patterns","q":"Which design pattern works on data and action taken based on data provided?","opts":[["a","Command pattern"],["b","Singleton pattern"],["c","MVC pattern"],["d","Facade pattern"]],"ans":"a","exp":"Command pattern is a data driven design pattern. It is a behavioral pattern. A request is wrapped under an object as command and passed to the invoker object. The invoker object looks for the appropriate object which can handle this command and passes this command to the corresponding object which executes the command."},{"id":1569,"cat":"Advanced Java","topic":"JDBC","q":"Which of the following contains both date and time?","opts":[["a","java.io.date"],["b","java.sql.date"],["c","java.util.date"],["d","java.util.dateTime"]],"ans":"d","exp":"java.util.date contains both date and time. Whereas, java.sql.date contains only date."},{"id":1570,"cat":"Advanced Java","topic":"JDBC","q":"Which of the following is advantage of using JDBC connection pool?","opts":[["a","Slow performance"],["b","Using more memory"],["c","Using less memory"],["d","Better performance"]],"ans":"d","exp":"Since the JDBC connection takes time to establish. Creating connection at the application start-up and reusing at the time of requirement, helps performance of the application."},{"id":1571,"cat":"Advanced Java","topic":"JDBC","q":"Which of the following is advantage of using PreparedStatement in Java?","opts":[["a","Slow performance"],["b","Encourages SQL injection"],["c","Prevents SQL injection"],["d","More memory usage"]],"ans":"c","exp":"PreparedStatement in Java improves performance and also prevents from SQL injection."},{"id":1572,"cat":"Advanced Java","topic":"JDBC","q":"Which one of the following contains date information?","opts":[["a","java.sql.TimeStamp"],["b","java.sql.Time"],["c","java.io.Time"],["d","java.io.TimeStamp"]],"ans":"a","exp":"java.sql.Time contains only time. Whereas, java.sql.TimeStamp contains both time and date."},{"id":1573,"cat":"Advanced Java","topic":"JDBC","q":"What does setAutoCommit(false) do?","opts":[["a","commits transaction after each query"],["b","explicitly commits transaction"],["c","does not commit transaction automatically after each query"],["d","never commits transaction"]],"ans":"c","exp":"setAutoCommit(false) does not commit transaction automatically after each query. That saves a lot of time of the execution and hence improves performance."},{"id":1574,"cat":"Advanced Java","topic":"JDBC","q":"Which of the following is used to call stored procedure?","opts":[["a","Statement"],["b","PreparedStatement"],["c","CallableStatment"],["d","CalledStatement"]],"ans":"c","exp":"CallableStatement is used in JDBC to call stored procedure from Java program."},{"id":1575,"cat":"Advanced Java","topic":"JDBC","q":"Which of the following is used to limit the number of rows returned?","opts":[["a","setMaxRows(int i)"],["b","setMinRows(int i)"],["c","getMaxrows(int i)"],["d","getMinRows(int i)"]],"ans":"a","exp":"setMaxRows(int i) method is used to limit the number of rows that the database returns from the query."},{"id":1576,"cat":"Advanced Java","topic":"JDBC","q":"Which of the following is method of JDBC batch process?","opts":[["a","setBatch()"],["b","deleteBatch()"],["c","removeBatch()"],["d","addBatch()"]],"ans":"d","exp":"addBatch() is a method of JDBC batch process. It is faster in processing than executing one statement at a time."},{"id":1577,"cat":"Advanced Java","topic":"JDBC","q":"Which of the following is used to rollback a JDBC transaction?","opts":[["a","rollback()"],["b","rollforward()"],["c","deleteTransaction()"],["d","RemoveTransaction()"]],"ans":"a","exp":"rollback() method is used to rollback the transaction. It will rollback all the changes made by the transaction."},{"id":1578,"cat":"Advanced Java","topic":"JDBC","q":"Which of the following is not a JDBC connection isolation levels?","opts":[["a","TRANSACTION_NONE"],["b","TRANSACTION_READ_COMMITTED"],["c","TRANSACTION_REPEATABLE_READ"],["d","TRANSACTION_NONREPEATABLE_READ"]],"ans":"d","exp":"TRANSACTION_NONREPEATABLE_READ is not a JDBC connection isolation level."},{"id":1579,"cat":"Advanced Java","topic":"JSP","q":"Which page directive should be used in JSP to generate a PDF page?","opts":[["a","contentType"],["b","generatePdf"],["c","typePDF"],["d","contentPDF"]],"ans":"a","exp":"<%page contentType="application/pdf"> tag is used in JSP to generate PDF."},{"id":1580,"cat":"Advanced Java","topic":"JSP","q":"Which tag should be used to pass information from JSP to included JSP?","opts":[["a","Using <%jsp:page> tag"],["b","Using <%jsp:param> tag"],["c","Using <%jsp:import> tag"],["d","Using <%jsp:useBean> tag"]],"ans":"a","exp":"<%jsp:param> tag is used to pass information from JSP to included JSP."},{"id":1581,"cat":"Advanced Java","topic":"JSP","q":"Application is instance of which class?","opts":[["a","javax.servlet.Application"],["b","javax.servlet.HttpContext"],["c","javax.servlet.Context"],["d","javax.servlet.ServletContext"]],"ans":"d","exp":"Application object is wrapper around the ServletContext object and it is an instance of a javax.servlet.ServletContext object."},{"id":1582,"cat":"Advanced Java","topic":"JSP","q":"_jspService() method of HttpJspPage class should not be overridden.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"_jspService() method is created by JSP container. Hence, it should not be overridden."},{"id":1583,"cat":"Advanced Java","topic":"JSP","q":"Which option is true about session scope?","opts":[["a","Objects are accessible only from the page in which they are created"],["b","Objects are accessible only from the pages which are in same session"],["c","Objects are accessible only from the pages which are processing the same request"],["d","Objects are accessible only from the pages which reside in same application"]],"ans":"b","exp":"Object data is available till session is alive."},{"id":1584,"cat":"Advanced Java","topic":"JSP","q":"Default value of autoFlush attribute is?","opts":[["a","true"],["b","false"]],"ans":"a","exp":"Default value "true" depicts automatic buffer flushing."},{"id":1585,"cat":"Advanced Java","topic":"JSP","q":"Which one is the correct order of phases in JSP life cycle?","opts":[["a","Initialization, Cleanup, Compilation, Execution"],["b","Initialization, Compilation, Cleanup, Execution"],["c","Compilation, Initialization, Execution, Cleanup"],["d","Cleanup, Compilation, Initialization, Execution"]],"ans":"c","exp":"The correct order is Compilation, Initialization, Execution, Cleanup."},{"id":1586,"cat":"Advanced Java","topic":"JSP","q":""request" is instance of which one of the following classes?","opts":[["a","Request"],["b","HttpRequest"],["c","HttpServletRequest"],["d","ServletRequest"]],"ans":"c","exp":"request is object of HttpServletRequest."},{"id":1587,"cat":"Advanced Java","topic":"JSP","q":"Which is not a directive?","opts":[["a","include"],["b","page"],["c","export"],["d","useBean"]],"ans":"c","exp":"Export is not a directive."},{"id":1588,"cat":"Advanced Java","topic":"JSP","q":"Which is mandatory in <jsp:useBean /> tag?","opts":[["a","id, class"],["b","id, type"],["c","type, property"],["d","type,id"]],"ans":"a","exp":"The useBean searches existing object and if not found creates an object using class."},{"id":1589,"cat":"Advanced Java","topic":"JSP Elements","q":"Which one of the following is correct for directive in JSP?","opts":[["a","<%@directive%>"],["b","<%!directive%>"],["c","<%directive%>"],["d","<%=directive%>"]],"ans":"a","exp":"Directive is declared as <%@directive%>."},{"id":1590,"cat":"Advanced Java","topic":"JSP Elements","q":"Which of the following action variable is used to include a file in JSP?","opts":[["a","jsp:setProperty"],["b","jsp:getProperty"],["c","jsp:include"],["d","jsp:plugin"]],"ans":"c","exp":"jsp:include action variable is used to include a file in JSP."},{"id":1591,"cat":"Advanced Java","topic":"JSP Elements","q":"Which attribute uniquely identification element?","opts":[["a","ID"],["b","Class"],["c","Name"],["d","Scope"]],"ans":"a","exp":"ID attribute is used to uniquely identify action element."},{"id":1592,"cat":"Advanced Java","topic":"JSP Elements","q":""out" is implicit object of which class?","opts":[["a","javax.servlet.jsp.PrintWriter"],["b","javax.servlet.jsp.SessionWriter"],["c","javax.servlet.jsp.SessionPrinter"],["d","javax.servlet.jsp.JspWriter"]],"ans":"d","exp":"JspWriter object is referenced by the implicit variable out which is initialized automatically using methods in the PageContext object."},{"id":1593,"cat":"Advanced Java","topic":"JSP Elements","q":"Which object stores references to the request and response objects?","opts":[["a","sessionContext"],["b","pageContext"],["c","HttpSession"],["d","sessionAttribute"]],"ans":"b","exp":"pageContext object contains information about directives issued to JSP page."},{"id":1594,"cat":"Advanced Java","topic":"JSP Elements","q":"What temporarily redirects response to the browser?","opts":[["a","<jsp:forward>"],["b","<%@directive%>"],["c","response.sendRedirect(URL)"],["d","response.setRedirect(URL)"]],"ans":"c","exp":"response.sendRedirect(URL) directs response to the browser and creates a new request."},{"id":1595,"cat":"Advanced Java","topic":"JSP Elements","q":"Which tag is used to set a value of a JavaBean?","opts":[["a","<c:set>"],["b","<c:param>"],["c","<c:choose>"],["d","<c:forward>"]],"ans":"a","exp":"<c:set> is used to set a value of a java.util.Map object."},{"id":1596,"cat":"Advanced Java","topic":"JSP Elements","q":"Can <!-comment-> and <%-comment-%> be used alternatively in JSP?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"<!-comment-> is an HTML comment. <%-comment-%> is JSP comment."},{"id":1597,"cat":"Advanced Java","topic":"JSP Elements","q":"Java code is embedded under which tag in JSP?","opts":[["a","Declaration"],["b","Scriptlet"],["c","Expression"],["d","Comment"]],"ans":"b","exp":"Scriptlet is used to embed java code in JSP."},{"id":1598,"cat":"Advanced Java","topic":"JSP Elements","q":"Which of the following is not a directive in JSP?","opts":[["a","page directive"],["b","include directive"],["c","taglib directive"],["d","command directive"]],"ans":"d","exp":"command directive is not a directive in JSP."},{"id":1599,"cat":"Advanced Java","topic":"Java Beans","q":"Which of the following is not an Enterprise Beans type?","opts":[["a","Doubleton"],["b","Singleton"],["c","Stateful"],["d","Stateless"]],"ans":"a","exp":"Stateful, Stateless and Singleton are session beans."},{"id":1600,"cat":"Advanced Java","topic":"Java Beans","q":"Which of the following is not true about Java beans?","opts":[["a","Implements java.io.Serializable interface"],["b","Extends java.io.Serializable class"],["c","Provides no argument constructor"],["d","Provides setter and getter methods for its properties"]],"ans":"b","exp":"java.io.Serializable is not a class. Instead it is an interface. Hence it cannot be extended."},{"id":1601,"cat":"Advanced Java","topic":"Java Beans","q":"Which file separator should be used by MANIFEST file?","opts":[["a","/"],["b","\\"],["c","-"],["d","//"]],"ans":"a","exp":"MANIFEST file uses classes using / file separator."},{"id":1602,"cat":"Advanced Java","topic":"Java Beans","q":"Which of the following is correct error when loading JAR file with duplicate name?","opts":[["a","java.io.NullPointerException"],["b","java.lang.ClassNotFound"],["c","java.lang.ClassFormatError"],["d","java.lang.DuplicateClassError"]],"ans":"c","exp":"java.lang.ClassFormatError: Duplicate Name error is thrown when .class file in the JAR contains a class whose class name is different from the expected name."},{"id":1603,"cat":"Advanced Java","topic":"Java Beans","q":"Java Beans are extremely secured?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"JavaBeans do not add any security features to the Java platform."},{"id":1604,"cat":"Advanced Java","topic":"Java Beans","q":"Which of the following is not a feature of Beans?","opts":[["a","Introspection"],["b","Events"],["c","Persistence"],["d","Serialization"]],"ans":"d","exp":"Serialization is not the feature of Java Beans. Introspection, Customization, Events, Properties and Persistence are the features."},{"id":1605,"cat":"Advanced Java","topic":"Java Beans","q":"What is the attribute of java bean to specify scope of bean to have single instance per Spring IOC?","opts":[["a","prototype"],["b","singleton"],["c","request"],["d","session"]],"ans":"b","exp":"Singleton scope of bean specifies only one instance per spring IOC container. This is the default scope."},{"id":1606,"cat":"Advanced Java","topic":"Java Beans","q":"Which attribute is used to specify initialization method?","opts":[["a","init"],["b","init-method"],["c","initialization"],["d","initialization-method"]],"ans":"b","exp":"init-method is used to specify the initialization method."},{"id":1607,"cat":"Advanced Java","topic":"Java Beans","q":"Which attribute is used to specify destroy method?","opts":[["a","destroy"],["b","destroy-method"],["c","destruction"],["d","destruction-method"]],"ans":"b","exp":"destroy-method is used to specify the destruction method."},{"id":1608,"cat":"Advanced Java","topic":"Java Beans","q":"How to specify autowiring by name?","opts":[["a","@Qualifier"],["b","@Type"],["c","@Constructor"],["d","@Name"]],"ans":"a","exp":"Different beans of the same class are identified by name."},{"id":1609,"cat":"Advanced Java","topic":"Reflection API","q":"What are the components of a marker interface?","opts":[["a","Fields and methods"],["b","No fields, only methods"],["c","Fields, no methods"],["d","No fields, No methods"]],"ans":"d","exp":"Marker interface in Java is an empty interface in Java."},{"id":1610,"cat":"Advanced Java","topic":"Reflection API","q":"Which of the following is not a marker interface?","opts":[["a","Serializable"],["b","Cloneable"],["c","Remote"],["d","Reader"]],"ans":"d","exp":"Reader is not a marker interface. Serializable, Cloneable and Remote interfaces are marker interface."},{"id":1611,"cat":"Advanced Java","topic":"Reflection API","q":"What is not the advantage of Reflection?","opts":[["a","Examine a class's field and method at runtime"],["b","Construct an object for a class at runtime"],["c","Examine a class's field at compile time"],["d","Examine an object's class at runtime"]],"ans":"c","exp":"Reflection inspects classes, interfaces, fields and methods at a runtime."},{"id":1612,"cat":"Advanced Java","topic":"Reflection API","q":"How private method can be called using reflection?","opts":[["a","getDeclaredFields"],["b","getDeclaredMethods"],["c","getMethods"],["d","getFields"]],"ans":"b","exp":"getDeclaredMethods gives instance of java.lang.reflect.Method."},{"id":1613,"cat":"Advanced Java","topic":"Reflection API","q":"How private field can be called using reflection?","opts":[["a","getDeclaredFields"],["b","getDeclaredMethods"],["c","getMethods"],["d","getFields"]],"ans":"a","exp":"getDeclaredFields gives instance of java.lang.reflect.Fields."},{"id":1614,"cat":"Advanced Java","topic":"Reflection API","q":"What is used to get class name in reflection?","opts":[["a","getClass().getName()"],["b","getClass().getFields()"],["c","getClass().getDeclaredFields()"],["d","new getClass()"]],"ans":"a","exp":"getClass().getName() is used to get a class name from object in reflection."},{"id":1615,"cat":"Advanced Java","topic":"Reflection API","q":"How method can be invoked on unknown object?","opts":[["a","obj.getClass().getDeclaredMethod()"],["b","obj.getClass().getDeclaredField()"],["c","obj.getClass().getMethod()"],["d","obj.getClass().getObject()"]],"ans":"c","exp":"obj.getClass().getMethod is used to invoke a method on unknown object obj."},{"id":1616,"cat":"Advanced Java","topic":"Reflection API","q":"How to get the class object of associated class using Reflection?","opts":[["a","Class.forName("className")"],["b","Class.name("className")"],["c","className.getClass()"],["d","className.getClassName()"]],"ans":"a","exp":"forName(String className) returns the Class object associated with the class or interface with the given string name."},{"id":1617,"cat":"Advanced Java","topic":"Reflection API","q":"What does Class.forName("myreflection.Foo").getInstance() return?","opts":[["a","An array of Foo objects"],["b","class object of Foo"],["c","Calls the getInstance() method of Foo class"],["d","Foo object"]],"ans":"d","exp":"Class.forName("myreflection.Foo") returns the class object of Foo and getInstance() would return a new object."},{"id":1618,"cat":"Advanced Java","topic":"Reflection API","q":"What does foo.getClass().getMethod("doSomething", null) return?","opts":[["a","doSomething method instance"],["b","Method is returned and we can call the method as method.invoke(foo,null);"],["c","Class object"],["d","Exception is thrown"]],"ans":"b","exp":"foo.getClass().getMethod() returns a method and we can call the method using method.invoke();"},{"id":1619,"cat":"Advanced Java","topic":"Servlet","q":"How constructor can be used for a servlet?","opts":[["a","Initialization"],["b","Constructor function"],["c","Initialization and Constructor function"],["d","Setup() method"]],"ans":"c","exp":"We cannot declare constructors for interface in Java. This means we cannot enforce this requirement to any class which implements Servlet interface.\nAlso, Servlet requires ServletConfig object for initialization which is created by container."},{"id":1620,"cat":"Advanced Java","topic":"Servlet","q":"Can servlet class declare constructor with ServletConfig object as an argument?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"ServletConfig object is created after the constructor is called and before init() is called. So, servlet init parameters cannot be accessed in the constructor."},{"id":1621,"cat":"Advanced Java","topic":"Servlet","q":"What is the difference between servlets and applets?\ni. Servlets execute on Server; Applets execute on browser\nii. Servlets have no GUI; Applet has GUI\niii. Servlets creates static web pages; Applets creates dynamic web pages\niv. Servlets can handle only a single request; Applet can handle multiple requests","opts":[["a","i, ii, iii are correct"],["b","i, ii are correct"],["c","i, iii are correct"],["d","i, ii, iii, iv are correct"]],"ans":"b","exp":"Servlets execute on Server and doesn't have GUI. Applets execute on browser and has GUI."},{"id":1622,"cat":"Advanced Java","topic":"Servlet","q":"Which of the following code is used to get an attribute in a HTTP Session object in servlets?","opts":[["a","session.getAttribute(String name)"],["b","session.alterAttribute(String name)"],["c","session.updateAttribute(String name)"],["d","session.setAttribute(String name)"]],"ans":"a","exp":"session has various methods for use."},{"id":1623,"cat":"Advanced Java","topic":"Servlet","q":"Which method is used to get three-letter abbreviation for locale's country in servlets?","opts":[["a","Request.getISO3Country()"],["b","Locale.getISO3Country()"],["c","Response.getISO3Country()"],["d","Local.retrieveISO3Country()"]],"ans":"a","exp":"Each country is usually denoted by a 3 digit code.ISO3 is the 3 digit country code."},{"id":1624,"cat":"Advanced Java","topic":"Servlet","q":"Which of the following code retrieves the body of the request as binary data?","opts":[["a","DataInputStream data = new InputStream()"],["b","DataInputStream data = response.getInputStream()"],["c","DataInputStream data = request.getInputStream()"],["d","DataInputStream data = request.fetchInputStream()"]],"ans":"c","exp":"InputStream is an abstract class. getInputStream() retrieves the request in binary data."},{"id":1625,"cat":"Advanced Java","topic":"Servlet","q":"When destroy() method of a filter is called?","opts":[["a","The destroy() method is called only once at the end of the life cycle of a filter"],["b","The destroy() method is called after the filter has executed doFilter method"],["c","The destroy() method is called only once at the begining of the life cycle of a filter"],["d","The destroyer() method is called after the filter has executed"]],"ans":"a","exp":"destroy() is an end of life cycle method so it is called at the end of life cycle."},{"id":1626,"cat":"Advanced Java","topic":"Servlet","q":"Which of the following is true about servlets?","opts":[["a","Servlets execute within the address space of web server"],["b","Servlets are platform-independent because they are written in java"],["c","Servlets can use the full functionality of the Java class libraries"],["d","Servlets execute within the address space of web server, platform independent and uses the functionality of java class libraries"]],"ans":"d","exp":"Servlets execute within the address space of a web server. Since it is written in java it is platform independent. The full functionality is available through libraries."},{"id":1627,"cat":"Advanced Java","topic":"Servlet","q":"How is the dynamic interception of requests and responses to transform the information done?","opts":[["a","servlet container"],["b","servlet config"],["c","servlet context"],["d","servlet filter"]],"ans":"d","exp":"Servlet has various components like container, config, context, filter. Servlet filter provides the dynamic interception of requests and responses to transform the information."},{"id":1628,"cat":"Advanced Java","topic":"Servlet","q":"Which are the session tracking techniques?\ni. URL rewriting\nii. Using session object\niii.Using response object\niv. Using hidden fields\nv. Using cookies\nvi. Using servlet object","opts":[["a","i, ii, iii, vi"],["b","i, ii, iv, v"],["c","i, vi, iii, v"],["d","i, ii, iii, v"]],"ans":"b","exp":"URL rewriting, using session object, using cookies, using hidden fields are session tracking techniques."},{"id":1629,"cat":"Advanced Java","topic":"Session Management","q":"Which of the following is used for session migration?","opts":[["a","Persisting the session in database"],["b","URL rewriting"],["c","Create new database connection"],["d","Kill session from multiple sessions"]],"ans":"a","exp":"Session migration is done by persisting session in database. It can also be done by storing session in memory on multiple servers."},{"id":1630,"cat":"Advanced Java","topic":"Session Management","q":"Which of the below is not a session tracking method?","opts":[["a","URL rewriting"],["b","History"],["c","Cookies"],["d","SSL sessions"]],"ans":"b","exp":"History is not a session tracking type. Cookies, URL rewriting, Hidden form fields and SSL sessions are session tracking methods."},{"id":1631,"cat":"Advanced Java","topic":"Session Management","q":"Which of the following is stored at client side?","opts":[["a","URL rewriting"],["b","Hidden form fields"],["c","SSL sessions"],["d","Cookies"]],"ans":"d","exp":"Cookies are stored at client side. Hence, it is advantageous in some cases where clients disable cookies."},{"id":1632,"cat":"Advanced Java","topic":"Session Management","q":"Which of the following leads to high network traffic?","opts":[["a","URL rewriting"],["b","Hidden form fields"],["c","SSL sessions"],["d","Cookies"]],"ans":"a","exp":"WRL rewriting requires large data transfer to and from the server which leads to network traffic and access may be slow."},{"id":1633,"cat":"Advanced Java","topic":"Session Management","q":"Which of the following is not true about session?","opts":[["a","All users connect to the same session"],["b","All users have same session variable"],["c","Default timeout value for session variable is 20 minutes"],["d","New session cannot be created for a new user"]],"ans":"c","exp":"Default timeout value for session variable is 20 minutes. This can be changed as per requirement."},{"id":1634,"cat":"Advanced Java","topic":"Session Management","q":"SessionIDs are stored in cookies.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"SessionIDs are stored in cookies, URLs and hidden form fields."},{"id":1635,"cat":"Advanced Java","topic":"Session Management","q":"What is the maximum size of cookie?","opts":[["a","4 KB"],["b","4 MB"],["c","4 bytes"],["d","40 KB"]],"ans":"a","exp":"The 4K is the maximum size for the entire cookie, including name, value, expiry date etc. To support most browsers, it is suggested to keep the name under 4000 bytes, and the overall cookie size under 4093 bytes."},{"id":1636,"cat":"Advanced Java","topic":"Session Management","q":"How can we invalidate a session?","opts":[["a","session.discontinue()"],["b","session.invalidate()"],["c","session.disconnect()"],["d","session.falsify()"]],"ans":"b","exp":"We can invalidate session by calling session.invalidate() to destroy the session."},{"id":1637,"cat":"Advanced Java","topic":"Session Management","q":"Which method creates unique fields in the HTML which are not shown to the user?","opts":[["a","User authentication"],["b","URL writing"],["c","HTML Hidden field"],["d","HTML invisible field"]],"ans":"c","exp":"HTML Hidden field is the simplest way to pass information but it is not secure and a session can be hacked easily."},{"id":1638,"cat":"Advanced Java","topic":"Session Management","q":"Which object is used by spring for authentication?","opts":[["a","ContextHolder"],["b","SecurityHolder"],["c","AnonymousHolder"],["d","SecurityContextHolder"]],"ans":"d","exp":"The SessionManagementFilter checks the contents of the SecurityContextRepository against the current contents of the SecurityContextHolder to determine whether user has been authenticated during the current request by a non-interactive authentication mechanism, like pre authentication or remember me."},{"id":1639,"cat":"Advanced Java","topic":"Web Application","q":"Servlet are used to program which component in a web application?","opts":[["a","client"],["b","server"],["c","tomcat"],["d","applet"]],"ans":"b","exp":"A servlet class extends the capabilities of servers that host applications which are accessed by way of a request-response programming model."},{"id":1640,"cat":"Advanced Java","topic":"Web Application","q":"Which component can be used for sending messages from one application to another?","opts":[["a","server"],["b","client"],["c","mq"],["d","webapp"]],"ans":"c","exp":"Messaging is a method of communication between software components or applications. MQ can be used for passing message from sender to receiver."},{"id":1641,"cat":"Advanced Java","topic":"Web Application","q":"How are java web applications packaged?","opts":[["a","jar"],["b","war"],["c","zip"],["d","both jar and war"]],"ans":"d","exp":"war are deployed on apache servers or tomcat servers. With Spring boot and few other technologies tomcat is brought on the machine by deploying jar."},{"id":1642,"cat":"Advanced Java","topic":"Web Application","q":"How can we connect to database in a web application?","opts":[["a","oracle sql developer"],["b","toad"],["c","JDBC template"],["d","mysql"]],"ans":"c","exp":"JDBC template can be used to connect to database and fire queries against it."},{"id":1643,"cat":"Advanced Java","topic":"Web Application","q":"How can we take input text from user in HTML page?","opts":[["a","input tag"],["b","inoutBufferedReader tag"],["c","meta tag"],["d","scanner tag"]],"ans":"a","exp":"HTML provides various user input options like input, radio, text, etc."},{"id":1644,"cat":"Advanced Java","topic":"Web Application","q":"Which of the below is not a javascript framework for UI?","opts":[["a","Vaadin"],["b","AngularJS"],["c","KendoUI"],["d","Springcore"]],"ans":"d","exp":"Springcore is not a javascript framework. It is a comprehensive programming and configuration model for enterprise applications based on java."},{"id":1645,"cat":"Advanced Java","topic":"Web Application","q":"Which of the below can be used to debug front end of a web application?","opts":[["a","Junit"],["b","Fitnesse"],["c","Firebug"],["d","Mockito"]],"ans":"c","exp":"Firebug integrates with firefox and enables to edit, debug and monitor CSS, HTML and javascript of any web page."},{"id":1646,"cat":"Advanced Java","topic":"Web Application","q":"What type of protocol is HTTP?","opts":[["a","stateless"],["b","stateful"],["c","transfer protocol"],["d","information protocol"]],"ans":"a","exp":"HTTP is a stateless protocol. It works on request and response mechanism and each request is an independent transaction."},{"id":1647,"cat":"Advanced Java","topic":"Web Application","q":"What does MIME stand for?","opts":[["a","Multipurpose Internet Messaging Extension"],["b","Multipurpose Internet Mail Extension"],["c","Multipurpose Internet Media Extension"],["d","Multipurpose Internet Mass Extension"]],"ans":"b","exp":"MIME is an acronym for Multi-purpose Internet Mail Extensions. It is used for classifying file types over the Internet. It contains type/subtype e.g. application/msword."},{"id":1648,"cat":"Advanced Java","topic":"Web Application","q":"What is the storage capacity of single cookie?","opts":[["a","2048 MB"],["b","2048 bytes"],["c","4095 bytes"],["d","4095 MB"]],"ans":"c","exp":"Storage capacity of cookies is 4095 bytes/cookie."}];
const CM={"Stage 5: Classes & Methods":["Class Fundamentals & Object Declaration","Data Members","Member Functions","Methods","Methods Taking Parameters"],"Stage 6: Constructors":["Constructor","Constructors","Types of Constructors","Constructor Overloading","Copy Constructors","Constructors & Garbage Collection","This Keyword"],"Stage 7: Arrays":["Array","Arrays and Static Keyword","Array Class Under Java"],"Stage 8: String Handling":["String Handling","String Class","String Comparision","Character Extraction","Searching and Modifying a String","StringBuffer Class","StringBuffer Class's Methods","Text Formatting"],"Stage 9: OOP Principles":["OOPs","Assigning Objects","Overloading Methods & Argument Passing","Method Overloading","Method Overriding","Access Control","Static Class","Final Class"],"Stage 10: Inheritance":["Inheritance","Base Class","Derived Class","Single Level Inheritance","Multilevel Inheritance","Hierarchical Inheritance","Hybrid Inheritance","Types of Inheritance"],"Stage 11: Abstract Classes & Interfaces":["Abstract Class","Interfaces","Type Interface"],"Stage 12: Packages & Nested Classes":["Packages","Inner Class","Nested Class"],"Stage 13: Exception Handling":["Exception Handling","Exceptions Types","Try and Catch","Throw, Throws & Nested Try","Keyword Finally and Built in Exceptions","Creating Exceptions","Java's Built in Exceptions"],"Stage 14: Java Standard Library":["Java.lang Introduction","Java.lang - Class","Object Class","Object & Math Classes","Wrapper Class","Integer, Long & Character Wrappers","Double & Float Wrappers","Java.lang - Boolean Wrapper Advance","Character Wrapper Advance","Java.lang - Byte & Short Wrappers","Java.lang - Runtime & ClassLoader Classes","Void, Process & System Classes","System Class Advance","Rounding Functions","Miscellaneous Math Methods & StrictMath Class","Random Number","Regular Expression"]};
const CO=["Stage 5: Classes & Methods","Stage 6: Constructors","Stage 7: Arrays","Stage 8: String Handling","Stage 9: OOP Principles","Stage 10: Inheritance","Stage 11: Abstract Classes & Interfaces","Stage 12: Packages & Nested Classes","Stage 13: Exception Handling","Stage 14: Java Standard Library"];
const CS=15;

const byTopic={};
Q.forEach(q=>{(byTopic[q.topic]=byTopic[q.topic]||[]).push(q);});
const allTopics=Object.keys(byTopic);

// ── CRAM BANK: stages 5-14 only, code-present capped at 50% ─────────────
const CRAM_TOPICS=new Set(CO.flatMap(s=>CM[s]||[]));
const _cramAll=Q.filter(q=>CRAM_TOPICS.has(q.topic));
const _cramNone=_cramAll.filter(q=>!q.cod);
let _cramCode=_cramAll.filter(q=>q.cod);
if(_cramCode.length>_cramNone.length)
  _cramCode=_cramCode.sort(()=>Math.random()-.5).slice(0,_cramNone.length);
const CRAM_Q=[..._cramCode,..._cramNone];

function chunks(topic){
  const qs=byTopic[topic]||[],c=[];
  for(let i=0;i<qs.length;i+=CS)c.push(qs.slice(i,i+CS));
  return c;
}
