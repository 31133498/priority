();\n\tpublic void push(E obj)\n        {\n            stk.push(obj);\n\t}\n\tpublic E pop()\n        {\n            E obj = stk.pop();\n\t    return obj;\n\t}\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            genericstack <Integer> gs = new genericstack<Integer>();\n            gs.push(36);\n            System.out.println(gs.pop());\n        }\n    }"],"exp":"The genericstack implements the stack logic , the push() method pushes the "Hello" to stack and pop() method returns the top element of the stack.\nNote : The type String for the stack is restricted."},{"id":452,"cat":"Core Java","topic":"Generics","q":"What will be the output of the following Java code?","opts":[["a","Error"],["b","Hello"],["c","36"],["d","Hello 36"]],"ans":"a","cod":["    import java.util.*;\n    public class genericstack <E>\n    {\n        Stack <E> stk = new Stack <E>();\n\tpublic void push(E obj)\n        {\n            stk.push(obj);\n\t}\n\tpublic E pop()\n        {\n            E obj = stk.pop();\n\t    return obj;\n\t}\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            genericstack <String> gs = new genericstack<String>();\n            gs.push(\"Hello\");\n            System.out.print(gs.pop() + \" \");\n            genericstack <Integer> gs = new genericstack<Integer>();\n            gs.push(36);\n            System.out.println(gs.pop());\n        }\n    }"],"exp":"The name gs for both the String and an Integer type stack raise a compilation error."},{"id":453,"cat":"Core Java","topic":"Generics","q":"What will be the output of the following Java program?","opts":[["a","36"],["b","Hello"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"d","cod":["    import java.util.*;\n    public class genericstack <E>\n    {\n        Stack <E> stk = new Stack <E>();\n\tpublic void push(E obj)\n        {\n            stk.push(obj);\n\t}\n\tpublic E pop()\n        {\n            E obj = stk.pop();\n\t    return obj;\n\t}\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            genericstack <String> gs = new genericstack<String>();\n            gs.push(36);\n            System.out.println(gs.pop());\n        }\n    }"],"exp":"generic stack object gs is defined to contain a string parameter but we are sending an integer parameter, which results in compilation error."},{"id":454,"cat":"Core Java","topic":"Generics","q":"Which of these Exception handlers cannot be type parameterized?","opts":[["a","catch"],["b","throw"],["c","throws"],["d","all of the mentioned"]],"ans":"d","exp":"we cannot Create, Catch, or Throw Objects of Parameterized Types as generic class cannot extend the Throwable class directly or indirectly."},{"id":455,"cat":"Core Java","topic":"Generics","q":"Which of the following cannot be Type parameterized?","opts":[["a","Overloaded Methods"],["b","Generic methods"],["c","Class methods"],["d","Overriding methods"]],"ans":"a","exp":"Cannot Overload a Method Where the Formal Parameter Types of Each Overload Erase to the Same Raw Type."},{"id":456,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"Which of the following has the highest memory requirement?","opts":[["a","Heap"],["b","Stack"],["c","JVM"],["d","Class"]],"ans":"c","exp":"JVM is the super set which contains heap, stack, objects, pointers, etc."},{"id":457,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"Where is a new object allocated memory?","opts":[["a","Young space"],["b","Old space"],["c","Young or Old space depending on space availability"],["d","JVM"]],"ans":"a","exp":"A new object is always created in young space. Once young space is full, a special young collection is run where objects which have lived long enough are moved to old space and memory is freed up in young space for new objects."},{"id":458,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"Which of the following is a garbage collection technique?","opts":[["a","Cleanup model"],["b","Mark and sweep model"],["c","Space management model"],["d","Sweep model"]],"ans":"b","exp":"A mark and sweep garbage collection consists of two phases, the mark phase and the sweep phase. I mark phase all the objects reachable by java threads, native handles and other root sources are marked alive and others are garbage. In sweep phase, the heap is traversed to find gaps between live objects and the gaps are marked free list used for allocating memory to new objects."},{"id":459,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"What is -Xms and -Xmx while starting jvm?","opts":[["a","Initial; Maximum memory"],["b","Maximum; Initial memory"],["c","Maximum memory"],["d","Initial memory"]],"ans":"a","exp":"JVM will be started with Xms amount of memory and will be able to use a maximum of Xmx amount of memory. java -Xmx2048m -Xms256m."},{"id":460,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"Which exception is thrown when java is out of memory?","opts":[["a","MemoryFullException"],["b","MemoryOutOfBoundsException"],["c","OutOfMemoryError"],["d","MemoryError"]],"ans":"c","exp":"The Xms flag has no default value, and Xmx typically has a default value of 256MB. A common use for these flags is when you encounter a java.lang.OutOfMemoryError."},{"id":461,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"How to get prints of shared object memory maps or heap memory maps for a given process?","opts":[["a","jmap"],["b","memorymap"],["c","memorypath"],["d","jvmmap"]],"ans":"a","exp":"We can use jmap as jmap -J-d64 -heap pid."},{"id":462,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"What happens to the thread when garbage collection kicks off?","opts":[["a","The thread continues its operation"],["b","Garbage collection cannot happen until the thread is running"],["c","The thread is paused while garbage collection runs"],["d","The thread and garbage collection do not interfere with each other"]],"ans":"c","exp":"The thread is paused when garbage collection runs which slows the application performance."},{"id":463,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"Which of the below is not a Java Profiler?","opts":[["a","JVM"],["b","JConsole"],["c","JProfiler"],["d","Eclipse Profiler"]],"ans":"a","exp":"Memory leak is like holding a strong reference to an object although it would never be needed anymore. Objects that are reachable but not live are considered memory leaks. Various tools help us to identify memory leaks."},{"id":464,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"Which of the below is not a memory leak solution?","opts":[["a","Code changes"],["b","JVM parameter tuning"],["c","Process restart"],["d","GC parameter tuning"]],"ans":"c","exp":"Process restart is not a permanent fix to memory leak problem. The problem will resurge again."},{"id":465,"cat":"Core Java","topic":"Heap and Garbage Collection","q":"Garbage Collection can be controlled by a program?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"Garbage Collection cannot be controlled by a program."},{"id":466,"cat":"Core Java","topic":"Hibernate","q":"Which of the following is not a core interface of Hibernate?","opts":[["a","Configuration"],["b","Criteria"],["c","SessionManagement"],["d","Session"]],"ans":"c","exp":"SessionManagement is not a core interface of Hibernate. Configuration, Criteria, SessionFactory, Session, Query and Transaction are the core interfaces of Hibernate."},{"id":467,"cat":"Core Java","topic":"Hibernate","q":"SessionFactory is a thread-safe object.","opts":[["a","True"],["b","False"]],"ans":"a","exp":"SessionFactory is a thread-safe object. Multiple threads can access it simultaneously."},{"id":468,"cat":"Core Java","topic":"Hibernate","q":"Which of the following methods returns proxy object?","opts":[["a","loadDatabase()"],["b","getDatabase()"],["c","load()"],["d","get()"]],"ans":"c","exp":"load() method returns proxy object. load() method should be used if it is sure that instance exists."},{"id":469,"cat":"Core Java","topic":"Hibernate","q":"Which of the following methods hits database always?","opts":[["a","load()"],["b","loadDatabase()"],["c","getDatabase()"],["d","get()"]],"ans":"d","exp":"get() method hits database always. Also, get() method does not return proxy object."},{"id":470,"cat":"Core Java","topic":"Hibernate","q":"Which of the following method is used inside session only?","opts":[["a","merge()"],["b","update()"],["c","end()"],["d","kill()"]],"ans":"b","exp":"update() method can only be used inside session. update() should be used if session does not contain persistent object."},{"id":471,"cat":"Core Java","topic":"Hibernate","q":"Which of the following is not a state of object in Hibernate?","opts":[["a","Attached()"],["b","Detached()"],["c","Persistent()"],["d","Transient()"]],"ans":"a","exp":"Attached() is not a state of object in Hibernate. Detached(), Persistent() and Transient() are the only states in Hibernate."},{"id":472,"cat":"Core Java","topic":"Hibernate","q":"Which of the following is not an inheritance mapping strategies?","opts":[["a","Table per hierarchy"],["b","Table per concrete class"],["c","Table per subclass"],["d","Table per class"]],"ans":"d","exp":"Table per class is not an inheritance mapping strategies."},{"id":473,"cat":"Core Java","topic":"Hibernate","q":"Which of the following is not an advantage of using Hibernate Query Language?","opts":[["a","Database independent"],["b","Easy to write query"],["c","No need to learn SQL"],["d","Difficult to implement"]],"ans":"d","exp":"HQL is easy to implement. Also, to implement it HQL it is not dependent on a database platform."},{"id":474,"cat":"Core Java","topic":"Hibernate","q":"In which file database table configuration is stored?","opts":[["a",".dbm"],["b",".hbm"],["c",".ora"],["d",".sql"]],"ans":"b","exp":"Database table configuration is stored in .hbm file."},{"id":475,"cat":"Core Java","topic":"Hibernate","q":"Which of the following is not an advantage of Hibernate Criteria API?","opts":[["a","Allows to use aggregate functions"],["b","Cannot order the result set"],["c","Allows to fetch only selected columns of result"],["d","Can add conditions while fetching results"]],"ans":"b","exp":"addOrder() can be used for ordering the results."},{"id":476,"cat":"Core Java","topic":"HttpResponse & URLConnection Class","q":"Which of these is a wrapper around everything associated with a reply from an http server?","opts":[["a","HTTP"],["b","HttpResponse"],["c","HttpRequest"],["d","httpserver"]],"ans":"b","exp":"HttpResponse is wrapper around everything associated with a reply from an http server."},{"id":477,"cat":"Core Java","topic":"HttpResponse & URLConnection Class","q":"Which of these transfer protocol must be used so that URL can be accessed by URLConnection class object?","opts":[["a","http"],["b","https"],["c","Any Protocol can be used"],["d","None of the mentioned"]],"ans":"a","exp":"For a URL to be accessed from remote location http protocol must be used."},{"id":478,"cat":"Core Java","topic":"HttpResponse & URLConnection Class","q":"Which of these methods is used to know when was the URL last modified?","opts":[["a","LastModified()"],["b","getLastModified()"],["c","GetLastModified()"],["d","getlastModified()()"]],"ans":"b"},{"id":479,"cat":"Core Java","topic":"HttpResponse & URLConnection Class","q":"Which of these methods is used to know the type of content used in the URL?","opts":[["a","ContentType()"],["b","contentType()"],["c","getContentType()"],["d","GetContentType()"]],"ans":"c"},{"id":480,"cat":"Core Java","topic":"HttpResponse & URLConnection Class","q":"Which of these data member of HttpResponse class is used to store the response from an http server?","opts":[["a","status"],["b","address"],["c","statusResponse"],["d","statusCode"]],"ans":"d","exp":"When we send a request to an http server it responds with a status code this status code is stored in statusCode and a textual equivalent which is stored in reasonPhrase."},{"id":481,"cat":"Core Java","topic":"HttpResponse & URLConnection Class","q":"What will be the output of the following Java program?\nNote: Host URL is written in html and simple text.","opts":[["a","html"],["b","text"],["c","html/text"],["d","text/html"]],"ans":"d","cod":["    import java.net.*;\n    class networking\n    {\n        public static void main(String[] args) throws Exception\n        {\n            URL obj = new URL(\"https://www.sanfoundry.com/javamcq\");\n            URLConnection obj1 = obj.openConnection();\n            System.out.print(obj1.getContentType());\n        }\n    }"]},{"id":482,"cat":"Core Java","topic":"HttpResponse & URLConnection Class","q":"What will be the output of the following Java program?\nNote: Host URL is having length of content 127.","opts":[["a","126"],["b","127"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"b","cod":["    import java.net.*;\n    class networking\n    {\n        public static void main(String[] args) throws Exception\n        {\n            URL obj = new URL(\"https://www.sanfoundry.com/javamcq\");\n            URLConnection obj1 = obj.openConnection();\n            int len = obj1.getContentLength();\n            System.out.print(len);\n        }\n    }"]},{"id":483,"cat":"Core Java","topic":"HttpResponse & URLConnection Class","q":"What will be the output of the following Java program?\nNote: Host URL was last modified on june 18 tuesday 2013.","opts":[["a","june"],["b","18-6-2013"],["c","Tue 18 Jun 2013"],["d","Tue Jun 18 2013"]],"ans":"d","cod":["    import java.net.*;\n    class networking\n    {\n        public static void main(String[] args) throws Exception\n        {\n            URL obj = new URL(\"https://www.sanfoundry.com/javamcq\");\n            URLConnection obj1 = obj.openConnection();\n            System.out.print(obj1.getLastModified);\n        }\n    }"]},{"id":484,"cat":"Core Java","topic":"Httpd","q":"Which of these methods of httpd class is used to read data from the stream?","opts":[["a","getDta()"],["b","GetResponse()"],["c","getStream()"],["d","getRawRequest()"]],"ans":"d","exp":"The getRawRequest() method reads data from a stream until it gets two consecutive newline characters."},{"id":485,"cat":"Core Java","topic":"Httpd","q":"Which of these method of httpd class is used to get report on each hit to HTTP server?","opts":[["a","log()"],["b","logEntry()"],["c","logHttpd()"],["d","logResponse()"]],"ans":"b"},{"id":486,"cat":"Core Java","topic":"Httpd","q":"Which of these methods are used to find a URL from the cache of httpd?","opts":[["a","findfromCache()"],["b","findFromCache()"],["c","serveFromCache()"],["d","getFromCache()"]],"ans":"c","exp":"serveFromCatche() is a boolean method that attempts to find a particular URL in the cache. If it is successful then the content of that cache entry are written to the client, otherwise it returns false."},{"id":487,"cat":"Core Java","topic":"Httpd","q":"Which of these variables stores the number of hits that are successfully served out of cache?","opts":[["a","hits"],["b","hitstocache"],["c","hits_to_cache"],["d","hits.to.cache"]],"ans":"d"},{"id":488,"cat":"Core Java","topic":"Httpd","q":"Which of these method of httpd class is used to write UrlCacheEntry object into local disk?","opts":[["a","writeDiskCache()"],["b","writetoDisk()"],["c","writeCache()"],["d","writeDiskEntry()"]],"ans":"a","exp":"The writeDiskCache() method takes an UrlCacheEntry object and writes it persistently into the local disk. It constructs directory names out of URL, making sure to replace the slash(/) characters with system dependent seperatorChar."},{"id":489,"cat":"Core Java","topic":"Httpd","q":"Which of these method is used to start a server thread?","opts":[["a","run()"],["b","start()"],["c","runThread()"],["d","startThread()"]],"ans":"a","exp":"run() method is called when the server thread is started."},{"id":490,"cat":"Core Java","topic":"Httpd","q":"Which of these method is called when http daemon is acting like a normal web server?","opts":[["a","Handle()"],["b","HandleGet()"],["c","handleGet()"],["d","Handleget()"]],"ans":"c"},{"id":491,"cat":"Core Java","topic":"Httpd","q":"Which of these method is used to find a URL from the cache of httpd?","opts":[["a","findfromCache()"],["b","findFromCache()"],["c","serveFromCache()"],["d","getFromCache()"]],"ans":"c","exp":"serveFromCatche() is a boolean method that attempts to find a particular URL in the cache. If it is successful then the content of that cache entry are written to the client, otherwise it returns false."},{"id":492,"cat":"Core Java","topic":"Httpd","q":"Which of these class is used for operating on request from the client to the server?","opts":[["a","http"],["b","httpDecoder"],["c","httpConnection"],["d","httpd"]],"ans":"d"},{"id":493,"cat":"Core Java","topic":"Httpd","q":"What is the output of this program?\nNote: Host URL is having length of content 127.","opts":[["a","126"],["b","127"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"b","cod":["    import java.net.*;\n    class networking\n    {\n        public static void main(String[] args) throws Exception\n        {\n            URL obj = new URL(\"http://www.sanfoundry.com/javamcq\");\n            URLConnection obj1 = obj.openConnection();\n            int len = obj1.getContentLength();\n            System.out.print(len);\n        }\n    }"],"exp":"$ javac networking.java\n$ java networking\n127"},{"id":494,"cat":"Core Java","topic":"Httpd","q":"What is the output of this program?","opts":[["a","cisco"],["b","cisco.com"],["c","www.cisco.com"],["d","none of the mentioned"]],"ans":"b","cod":["    import java.net.*;\n    class networking\n    {\n        public static void main(String[] args) throws UnknownHostException\n        {\n            InetAddress obj1 = InetAddress.getByName(\"cisco.com\");\n            System.out.print(obj1.getHostName());\n        }\n    }"],"exp":"$ javac networking.java\n$ java networking\ncisco.com"},{"id":495,"cat":"Core Java","topic":"Implementing Runnable Interface for Threads","q":"Which of these method is used to implement Runnable interface?","opts":[["a","stop()"],["b","run()"],["c","runThread()"],["d","stopThread()"]],"ans":"b","exp":"To implement Runnable interface, a class needs only to implement a single method called run()."},{"id":496,"cat":"Core Java","topic":"Implementing Runnable Interface for Threads","q":"Which of these method is used to begin the execution of a thread?","opts":[["a","run()"],["b","start()"],["c","runThread()"],["d","startThread()"]],"ans":"b"},{"id":497,"cat":"Core Java","topic":"Implementing Runnable Interface for Threads","q":"Which of these statement is incorrect?","opts":[["a","A thread can be formed by implementing Runnable interface only"],["b","A thread can be formed by a class that extends Thread class"],["c","start() method is used to begin execution of the thread"],["d","run() method is used to begin execution of a thread before start() method in special cases"]],"ans":"d","exp":"run() method is used to define the code that constitutes the new thread, it contains the code to be executed. start() method is used to begin execution of the thread that is execution of run(). run() itself is never used for starting execution of the thread."},{"id":498,"cat":"Core Java","topic":"Implementing Runnable Interface for Threads","q":"What will be the output of the following Java code?","opts":[["a","My Thread"],["b","Thread[My Thread,5,main]"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"a","cod":["    class newthread implements Runnable\n    {\n\tThread t;\n\tnewthread()\n        {\n\t    t = new Thread(this,\"My Thread\");\n\t    t.start();\n\t}\n\tpublic void run()\n        {\n\t    System.out.println(t.getName());\n\t}\n    }\n    class multithreaded_programing\n    {\n        public static void main(String args[])\n        {\n            new newthread();\n        }\n    }"]},{"id":499,"cat":"Core Java","topic":"Implementing Runnable Interface for Threads","q":"What will be the output of the following Java code?","opts":[["a","My Thread"],["b","Thread[My Thread,5,main]"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"b","cod":["    class newthread implements Runnable\n    {\n\tThread t;\n\tnewthread()\n        {\n\t    t = new Thread(this,\"My Thread\");\n\t    t.start();\n\t}\n\tpublic void run()\n        {\n\t    System.out.println(t);\n\t}\n    }\n    class multithreaded_programing\n    {\n        public static void main(String args[])\n        {\n            new newthread();\n        }\n    }"]},{"id":500,"cat":"Core Java","topic":"Implementing Runnable Interface for Threads","q":"What will be the output of the following Java code?","opts":[["a","My Thread"],["b","Thread[My Thread,5,main]"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["    class newthread implements Runnable\n    {\n\tThread t;\n\tnewthread()\n        {\n\t    t = new Thread(this,\"My Thread\");\n\t    t.start();\n\t}\n    }\n    class multithreaded_programing\n    {\n        public static void main(String args[])\n        {\n            new newthread();\n        }\n    }"],"exp":"Thread t has been made by using Runnable interface, hence it is necessary to use inherited abstract method run() method to specify instructions to be implemented on the thread, since no run() method is used it gives a compilation error."},{"id":501,"cat":"Core Java","topic":"Implementing Runnable Interface for Threads","q":"What will be the output of the following Java code?","opts":[["a","Thread[New Thread,0,main]"],["b","Thread[New Thread,1,main]"],["c","Thread[New Thread,5,main]"],["d","Thread[New Thread,10,main]"]],"ans":"d","cod":["    class newthread implements Runnable\n    {\n\tThread t;\n\tnewthread()\n        {\n\t    t = new Thread(this,\"New Thread\");\n\t    t.start();\n\t}\n\tpublic void run()\n        {\n\t    t.setPriority(Thread.MAX_PRIORITY);\n            System.out.println(t);\n\t}\n    }\n    class multithreaded_programing\n    {\n        public static void main(String args[])\n        {\n            new newthread();\n        }\n    }"],"exp":"Thread t has been made with default priority value 5 but in run method the priority has been explicitly changed to MAX_PRIORITY of class thread, that is 10 by code 't.setPriority(Thread.MAX_PRIORITY);' using the setPriority function of thread t."},{"id":502,"cat":"Core Java","topic":"Implementing Runnable Interface for Threads","q":"What will be the output of the following Java code?","opts":[["a","true"],["b","false"],["c","truetrue"],["d","falsefalse"]],"ans":"d","cod":["    class newthread implements Runnable\n    {\n\tThread t;\n\tnewthread()\n        {\n\t    t1 = new Thread(this,\"Thread_1\");\n\t    t2 = new Thread(this,\"Thread_2\");\n\t    t1.start();\n\t    t2.start();\n\t}\n\tpublic void run()\n        {\n\t    t2.setPriority(Thread.MAX_PRIORITY);\n\t    System.out.print(t1.equals(t2));\n        }\n    }\n    class multithreaded_programing\n    {\n        public static void main(String args[])\n        {\n            new newthread();\n        }\n    }"],"exp":"Threads t1 & t2 are created by class newthread that is implementing runnable interface, hence both the threads are provided their own run() method specifying the actions to be taken. When constructor of newthread class is called first the run() method of t1 executes than the run method of t2 printing 2 times "false" as both the threads are not equal one is having different priority than other, hence falsefalse is printed."},{"id":503,"cat":"Core Java","topic":"Inheritance","q":"Which of this keyword must be used to inherit a class?","opts":[["a","super"],["b","this"],["c","extent"],["d","extends"]],"ans":"d"},{"id":504,"cat":"Core Java","topic":"Inheritance","q":"A class member declared protected becomes a member of subclass of which type?","opts":[["a","public member"],["b","private member"],["c","protected member"],["d","static member"]],"ans":"b","exp":"A class member declared protected becomes a private member of subclass."},{"id":505,"cat":"Core Java","topic":"Inheritance","q":"Which of these is correct way of inheriting class A by class B?","opts":[["a","class B + class A {}"],["b","class B inherits class A {}"],["c","class B extends A {}"],["d","class B extends class A {}"]],"ans":"c"},{"id":506,"cat":"Core Java","topic":"Inheritance","q":"Which two classes use the Shape class correctly?","opts":[["a","B,E"],["b","A,C"],["c","C,E"],["d","T,H"]],"ans":"a","cod":["A. public class Circle implements Shape\n   {\n    private int radius;\n   }\nB. public abstract class Circle extends Shape\n   {\n    private int radius;\n   }\nC. public class Circle extends Shape\n   {\n   private int radius;\n   public void draw();\n   }\nD. public abstract class Circle implements Shape\n   {\n    private int radius;\n    public void draw();\n   }\nE. public class Circle extends Shape\n   {\n    private int radius;\n    public void draw()\n    {\n     /* code here */\n    }\n   }\nF. public abstract class Circle implements Shape\n   {\n     private int radius;\n     public void draw()\n     {\n      /* code here */\n     }\n   }"],"exp":"If one is extending any class, then they should use extends keyword not implements."},{"id":507,"cat":"Core Java","topic":"Inheritance","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","1"],["c","2"],["d","Compilation Error"]],"ans":"c","cod":["    class A\n    {\n        int i;\n        void display()\n        {\n            System.out.println(i);\n        }\n    }\n    class B extends A\n    {\n        int j;\n        void display()\n        {\n            System.out.println(j);\n        }\n    }\n    class inheritance_demo\n    {\n        public static void main(String args[])\n        {\n            B obj = new B();\n            obj.i=1;\n            obj.j=2;\n            obj.display();\n        }\n   }"],"exp":"Class A & class B both contain display() method, class B inherits class A, when display() method is called by object of class B, display() method of class B is executed rather than that of Class A."},{"id":508,"cat":"Core Java","topic":"Inheritance","q":"What will be the output of the following Java program?","opts":[["a","2 2"],["b","3 3"],["c","2 3"],["d","3 2"]],"ans":"c","cod":["    class A\n    {\n        int i;\n    }\n    class B extends A\n    {\n        int j;\n        void display()\n        {\n            super.i = j + 1;\n            System.out.println(j + \" \" + i);\n        }\n    }\n    class inheritance\n    {\n        public static void main(String args[])\n        {\n            B obj = new B();\n            obj.i=1;\n            obj.j=2;\n            obj.display();\n        }\n   }"]},{"id":509,"cat":"Core Java","topic":"Inheritance","q":"What will be the output of the following Java program?","opts":[["a","1 2"],["b","2 1"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"a","cod":["    class A\n    {\n        public int i;\n        public int j;\n        A()\n        {\n            i = 1;\n            j = 2;\n\t}\n    }\n    class B extends A\n    {\n        int a;\n        B()\n        {\n            super();\n        }\n    }\n    class super_use\n    {\n        public static void main(String args[])\n        {\n            B obj = new B();\n            System.out.println(obj.i + \" \" + obj.j)\n        }\n   }"],"exp":"Keyword super is used to call constructor of class A by constructor of class B. Constructor of a initializes i & j to 1 & 2 respectively."},{"id":510,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"What is the range of short data type in Java?","opts":[["a","-128 to 127"],["b","-32768 to 32767"],["c","-2147483648 to 2147483647"],["d","None of the mentioned"]],"ans":"b","exp":"Short occupies 16 bits in memory. Its range is from -32768 to 32767."},{"id":511,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"What is the range of byte data type in Java?","opts":[["a","-128 to 127"],["b","-32768 to 32767"],["c","-2147483648 to 2147483647"],["d","None of the mentioned"]],"ans":"a","exp":"Byte occupies 8 bits in memory. Its range is from -128 to 127."},{"id":512,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"Which of the following are legal lines of Java code?","opts":[["a","1 and 2"],["b","2 and 3"],["c","3 and 4"],["d","All statements are correct"]],"ans":"d","cod":["   1. int w = (int)888.8;\n   2. byte x = (byte)100L;\n   3. long y = (byte)100;\n   4. byte z = (byte)1000L;"],"exp":"Statements (1), (2), (3), and (4) are correct. (1) is correct because when a floating-point number (a double in this case) is cast to an int, it simply loses the digits after the decimal. (2) and (4) are correct because a long can be cast into a byte. If the long is over 127, it loses its precision due to narrowing of the conversion. (3) actually works, even though a cast is not necessary, because a long can store a byte."},{"id":513,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"An expression involving byte, int, and literal numbers is promoted to which of these?","opts":[["a","int"],["b","long"],["c","byte"],["d","float"]],"ans":"a","exp":"An expression involving bytes, ints, shorts, literal numbers, the entire expression is promoted to int before any calculation is done."},{"id":514,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"Which of these literals can be contained in float data type variable?","opts":[["a","-1.7e+308"],["b","-3.4e+038"],["c","+1.7e+308"],["d","-3.4e+050"]],"ans":"b","exp":"Range of float data type is -(3.4e38) To +(3.4e38)"},{"id":515,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"Which data type value is returned by all transcendental math functions?","opts":[["a","int"],["b","float"],["c","double"],["d","long"]],"ans":"c","exp":"Only double data type value is returned by all transcendental math functions. Transcendental math functions don't return int or long. They return double instead of float as double has larger range."},{"id":516,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"What will be the output of the following Java code?","opts":[["a","16.34"],["b","16.566666644"],["c","16.46666666666667"],["d","16.46666666666666"]],"ans":"c","cod":["    class average {\n        public static void main(String args[])\n        {\n            double num[] = {5.5, 10.1, 11, 12.8, 56.9, 2.5};\n            double result;\n            result = 0;\n            for (int i = 0; i < 6; ++i)\n                result = result + num[i];\n\t    System.out.print(result/6);\n\n        }\n    }"]},{"id":517,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"What will be the output of the following Java statement?","opts":[["a","Infinity"],["b","0.0"],["c","NaN"],["d","all of the mentioned"]],"ans":"d","cod":["class output {\n        public static void main(String args[])\n        {\n            double a, b,c;\n            a = 3.0/0;\n            b = 0/4.0;\n            c=0/0.0;\n\n\t    System.out.println(a);\n            System.out.println(b);\n            System.out.println(c);\n        }\n    }"],"exp":"For floating point literals, we have constant value to represent (10/0.0) infinity either positive or negative and also have NaN (not a number for undefined like 0/0.0), but for the integral type, we don't have any constant that's why we get an arithmetic exception."},{"id":518,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"What will be the output of the following Java code?","opts":[["a","25"],["b","24"],["c","32"],["d","33"]],"ans":"c","cod":["    class increment {\n        public static void main(String args[])\n        {\n             int g = 3;\n             System.out.print(++g * 8);\n        }\n    }"],"exp":"Operator ++ has more preference than *, thus g becomes 4 and when multiplied by 8 gives 32."},{"id":519,"cat":"Core Java","topic":"Integer and Floating Datatypes","q":"What will be the output of the following Java code?","opts":[["a","301.5656"],["b","301"],["c","301.56"],["d","301.56560000"]],"ans":"a","cod":["    class area {\n        public static void main(String args[])\n        {\n             double r, pi, a;\n             r = 9.8;\n             pi = 3.14;\n             a = pi * r * r;\n             System.out.println(a);\n        }\n    }"]},{"id":520,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"Which of these is a wrapper for data type int?","opts":[["a","Integer"],["b","Long"],["c","Byte"],["d","Double"]],"ans":"a"},{"id":521,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"Which of the following methods is a method of wrapper Integer for obtaining hash code for the invoking object?","opts":[["a","int hash()"],["b","int hashcode()"],["c","int hashCode()"],["d","Integer hashcode()"]],"ans":"c"},{"id":522,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"Which of these is a super class of wrappers Long, Character & Integer?","opts":[["a","Long"],["b","Digits"],["c","Float"],["d","Number"]],"ans":"d","exp":"Number is an abstract class containing subclasses Double, Float, Byte, Short, Integer and Long."},{"id":523,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"Which of these is a wrapper for simple data type char?","opts":[["a","Float"],["b","Character"],["c","String"],["d","Integer"]],"ans":"b"},{"id":524,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"Which of the following is method of wrapper Integer for converting the value of an object into int?","opts":[["a","bytevalue()"],["b","int intValue();"],["c","Bytevalue()"],["d","Byte Bytevalue()"]],"ans":"b"},{"id":525,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"Which of these methods is used to obtain value of invoking object as a long?","opts":[["a","long value()"],["b","long longValue()"],["c","Long longvalue()"],["d","Long Longvalue()"]],"ans":"b","exp":"long longValue() is used to obtain value of invoking object as a long."},{"id":526,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","1"],["c","256"],["d","257"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            Integer i = new Integer(257);\n            byte x = i.byteValue();\n            System.out.print(x);\n        }\n    }"],"exp":"i.byteValue() method returns the value of wrapper i as a byte value. i is 257, range of byte is 256 therefore i value exceeds byte range by 1 hence 1 is returned and stored in x."},{"id":527,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","1"],["c","257"],["d","257.0"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            Integer i = new Integer(257);\n            float x = i.floatValue();\n            System.out.print(x);\n        }\n    }"]},{"id":528,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"What will be the output of the following Java program?","opts":[["a","256"],["b","256.0"],["c","256.00"],["d","257.00"]],"ans":"a","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            Long i = new Long(256);\n            System.out.print(i.hashCode());\n        }\n    }"]},{"id":529,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"Which of these is wrapper for simple data type char?","opts":[["a","Float"],["b","Character"],["c","String"],["d","Integer"]],"ans":"b"},{"id":530,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"What is the output of this program?","opts":[["a","true false true"],["b","false true true"],["c","true true false"],["d","false false false"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            char a[] = {'a', '5', 'A', ' '};\n            System.out.print(Character.isDigit(a[0]) + \" \");\n            System.out.print(Character.isWhitespace(a[3]) + \" \");\n            System.out.print(Character.isUpperCase(a[2]));\n        }\n    }"],"exp":"Character.isDigit(a[0]) checks for a[0], whether it is a digit or not, since a[0] i:e 'a' is a character false is returned. a[3] is a whitespace hence Character.isWhitespace(a[3]) returns a true. a[2] is an upper case letter i:e 'A' hence Character.isUpperCase(a[2]) returns true.\n$ javac Output.java\n$ java Output\nfalse true true"},{"id":531,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"What is the output of this program?","opts":[["a","0"],["b","1"],["c","256"],["d","257"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            Integer i = new Integer(257);\n            byte x = i.byteValue();\n            System.out.print(x);\n        }\n    }"],"exp":"i.byteValue() method returns the value of wrapper i as a byte value. i is 257, range of byte is 256 therefore i value exceeds byte range by 1 hence 1 is returned and stored in x.\n$ javac Output.java\n$ java Output\n1"},{"id":532,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"What is the output of this program?","opts":[["a","0"],["b","1"],["c","257"],["d","257.0"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            Integer i = new Integer(257);\n            float x = i.floatValue();\n            System.out.print(x);\n        }\n    }"],"exp":"$ javac Output.java\n$ java Output\n257.0"},{"id":533,"cat":"Core Java","topic":"Integer, Long & Character Wrappers","q":"What is the output of this program?","opts":[["a","256"],["b","256.0"],["c","256.00"],["d","257.00"]],"ans":"a","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            Long i = new Long(256);\n            System.out.print(i.hashCode());\n        }\n    }"],"exp":"$ javac Output.java\n$ java Output\n256"},{"id":534,"cat":"Core Java","topic":"Interfaces","q":"Which of these keywords is used to define interfaces in Java?","opts":[["a","interface"],["b","Interface"],["c","intf"],["d","Intf"]],"ans":"a","exp":"The interface keyword (all lowercase) is used in Java to define an interface. Interfaces in Java specify a set of methods that a class can implement. The other options are invalid as Java is case-sensitive, and such keywords do not exist."},{"id":535,"cat":"Core Java","topic":"Interfaces","q":"Which of these can be used to fully abstract a class from its implementation?","opts":[["a","Objects"],["b","Packages"],["c","Interfaces"],["d","None of the Mentioned"]],"ans":"c","exp":"The concept of fully abstracting a class from its implementation is commonly achieved using interfaces."},{"id":536,"cat":"Core Java","topic":"Interfaces","q":"Which of these access specifiers can be used for an interface?","opts":[["a","public"],["b","protected"],["c","private"],["d","all of the mentioned"]],"ans":"a","exp":"Access specifier of an interface is either public or no specifier. When no access specifier is used then default access specifier is used due to which interface is available only to other members of the package in which it is declared, when declared public it can be used by any code."},{"id":537,"cat":"Core Java","topic":"Interfaces","q":"Which of these keywords is used by a class to use an interface defined previously?","opts":[["a","import"],["b","Import"],["c","implements"],["d","Implements"]],"ans":"c","exp":"interface is inherited by a class using implements."},{"id":538,"cat":"Core Java","topic":"Interfaces","q":"Which of the following is the correct way of implementing an interface salary by class manager?","opts":[["a","class manager extends salary {}"],["b","class manager implements salary {}"],["c","class manager imports salary {}"],["d","none of the mentioned"]],"ans":"b","exp":"implements keyword is used to inherit an interface in a class.\nSyntax:\nFree 30-Day C Certification Bootcamp is Live. Join Now!"},{"id":539,"cat":"Core Java","topic":"Interfaces","q":"Which of the following is an incorrect statement about packages?","opts":[["a","Interfaces specifies what class must do but not how it does"],["b","Interfaces are specified public if they are to be accessed by any code in the program"],["c","All variables in interface are implicitly final and static"],["d","All variables are static and methods are public if interface is defined public"]],"ans":"d","exp":"All methods and variables are implicitly public if interface is declared public."},{"id":540,"cat":"Core Java","topic":"Interfaces","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","2"],["c","4"],["d","None of the mentioned"]],"ans":"c","cod":["   interface calculate\n   {\n       void cal(int item);\n   }\n   class display implements calculate\n   {\n       int x;\n       public void cal(int item)\n       {\n           x = item * item;\n       }\n   }\n   class interfaces\n   {\n       public static void main(String args[])\n       {\n           display arr = new display();\n           arr.x = 0;\n           arr.cal(2);\n           System.out.print(arr.x);\n       }\n   }"],"exp":"The cal() method is overridden in the Display class, which inherits from Calculate. This method sets the instance variable x to the square of the passed value, i.e., 2 * 2 = 4. Therefore, arr.x is 4."},{"id":541,"cat":"Core Java","topic":"Interfaces","q":"What will be the output of the following Java program?","opts":[["a","0 0"],["b","2 2"],["c","4 1"],["d","1 4"]],"ans":"c","cod":["   interface calculate\n   {\n       void cal(int item);\n   }\n   class displayA implements calculate\n   {\n       int x;\n       public void cal(int item)\n       {\n           x = item * item;\n       }\n   }\n   class displayB implements calculate\n   {\n       int x;\n       public void cal(int item)\n       {\n           x = item / item;\n       }\n   }\n   class interfaces\n   {\n       public static void main(String args[])\n       {\n           displayA arr1 = new displayA();\n           displayB arr2 = new displayB();\n           arr1.x = 0;\n           arr2.x = 0;\n           arr1.cal(2);\n           arr2.cal(2);\n           System.out.print(arr1.x + \" \" + arr2.x);\n       }\n   }"],"exp":"class displayA implements the interface calculate by doubling the value of item, where as class displayB implements the interface by dividing item by item, therefore variable x of class displayA stores 4 and variable x of class displayB stores 1."},{"id":542,"cat":"Core Java","topic":"Interfaces","q":"What will be the output of the following Java program?","opts":[["a","0 1 2"],["b","0 2 4"],["c","0 0 4"],["d","0 1 4"]],"ans":"c","cod":["interface calculate\n{\n            int VAR = 0;\n            void cal(int item);\n}\n        class display implements calculate\n        {\n            int x;\n          public  void cal(int item)\n          {\n                if (item<2)\n                    x = VAR;\n                else\n                    x = item * item;\n            }\n        }\n class interfaces\n{\n\n            public static void main(String args[])\n            {\n                display[] arr=new display[3];\n\n               for(int i=0;i<3;i++)\n               arr[i]=new display();\n               arr[0].cal(0);\n               arr[1].cal(1);\n               arr[2].cal(2);\n               System.out.print(arr[0].x+\" \" + arr[1].x + \" \" + arr[2].x);\n            }\n}"],"exp":"According to the overridden cal() method in the Display class, the method sets the instance variable x to VAR if the argument passed is less than 2; otherwise, it sets x to the square of the argument passed."},{"id":543,"cat":"Core Java","topic":"Iterators","q":"Which of these return type of hasNext() method of an iterator?","opts":[["a","Integer"],["b","Double"],["c","Boolean"],["d","Collections Object"]],"ans":"c","exp":"hasNext() returns boolean values true or false."},{"id":544,"cat":"Core Java","topic":"Iterators","q":"Which of these methods is used to obtain an iterator to the start of collection?","opts":[["a","start()"],["b","begin()"],["c","iteratorSet()"],["d","iterator()"]],"ans":"d","exp":"To obtain an iterator to the start of the start of the collection we use iterator() method."},{"id":545,"cat":"Core Java","topic":"Iterators","q":"Which of these methods can be used to move to next element in a collection?","opts":[["a","next()"],["b","move()"],["c","shuffle()"],["d","hasNext()"]],"ans":"a"},{"id":546,"cat":"Core Java","topic":"Iterators","q":"Which of these iterators can be used only with List?","opts":[["a","Setiterator"],["b","ListIterator"],["c","Literator"],["d","None of the mentioned"]],"ans":"b"},{"id":547,"cat":"Core Java","topic":"Iterators","q":"Which of these is a method of ListIterator used to obtain index of previous element?","opts":[["a","previous()"],["b","previousIndex()"],["c","back()"],["d","goBack()"]],"ans":"b","exp":"previousIndex() returns index of previous element. if there is no previous element then -1 is returned."},{"id":548,"cat":"Core Java","topic":"Iterators","q":"Which of these exceptions is thrown by remover() method?","opts":[["a","IOException"],["b","SystemException"],["c","ObjectNotFoundExeception"],["d","IllegalStateException"]],"ans":"d"},{"id":549,"cat":"Core Java","topic":"Iterators","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","1"],["c","-1"],["d","EMPTY"]],"ans":"d","cod":["    import java.util.*;\n    class Collection_iterators\n    {\n        public static void main(String args[])\n        {\n            ListIterator a = list.listIterator();\n                if(a.previousIndex()! = -1)\n                    while(a.hasNext())\n\t                System.out.print(a.next() + \" \");\n                else\n                   System.out.print(\"EMPTY\");\n        }\n    }"]},{"id":550,"cat":"Core Java","topic":"Iterators","q":"What will be the output of the following Java program?","opts":[["a","2 8 5 1"],["b","1 5 8 2"],["c","2"],["d","2 1 8 5"]],"ans":"b","cod":["    import java.util.*;\n    class Collection_iterators\n    {\n        public static void main(String args[])\n        {\n            LinkedList list = new LinkedList();\n            list.add(new Integer(2));\n            list.add(new Integer(8));\n            list.add(new Integer(5));\n            list.add(new Integer(1));\n            Iterator i = list.iterator();\n            Collections.reverse(list);\n\t    while(i.hasNext())\n\t        System.out.print(i.next() + \" \");\n        }\n    }"],"exp":"Collections.reverse(list) reverses the given list, the list was 2->8->5->1 after reversing it became 1->5->8->2."},{"id":551,"cat":"Core Java","topic":"Iterators","q":"What will be the output of the following Java program?","opts":[["a","2 8 5 1"],["b","1 5 8 2"],["c","1 2 5 8"],["d","2 1 8 5"]],"ans":"c","cod":["    import java.util.*;\n    class Collection_iterators\n    {\n        public static void main(String args[])\n        {\n            LinkedList list = new LinkedList();\n            list.add(new Integer(2));\n            list.add(new Integer(8));\n            list.add(new Integer(5));\n            list.add(new Integer(1));\n            Iterator i = list.iterator();\n            Collections.reverse(list);\n\t    Collections.sort(list);\n            while(i.hasNext())\n\t        System.out.print(i.next() + \" \");\n        }\n    }"],"exp":"Collections.sort(list) sorts the given list, the list was 2->8->5->1 after sorting it became 1->2->5->8."},{"id":552,"cat":"Core Java","topic":"Iterators","q":"What will be the output of the following Java program?","opts":[["a","2 8 5"],["b","2 1 8"],["c","2 5 8"],["d","8 5 1"]],"ans":"b","cod":["    import java.util.*;\n    class Collection_iterators\n    {\n        public static void main(String args[])\n        {\n            LinkedList list = new LinkedList();\n            list.add(new Integer(2));\n            list.add(new Integer(8));\n            list.add(new Integer(5));\n            list.add(new Integer(1));\n            Iterator i = list.iterator();\n            Collections.reverse(list);\n\t    Collections.shuffle(list);\n            i.next();\n            i.remove();\n            while(i.hasNext())\n\t        System.out.print(i.next() + \" \");\n        }\n    }"],"exp":"i.next() returns the next element in the iteration. i.remove() removes from the underlying collection the last element returned by this iterator (optional operation). This method can be called only once per call to next(). The behavior of an iterator is unspecified if the underlying collection is modified while the iteration is in progress in any way other than by calling this method."},{"id":553,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"Which component is used to compile, debug and execute java program?","opts":[["a","JVM"],["b","JDK"],["c","JIT"],["d","JRE"]],"ans":"b","exp":"JDK is a core component of Java Environment and provides all the tools, executables and binaries required to compile, debug and execute a Java Program."},{"id":554,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"Which component is responsible for converting bytecode into machine specific code?","opts":[["a","JVM"],["b","JDK"],["c","JIT"],["d","JRE"]],"ans":"a","exp":"JVM is responsible to converting bytecode to the machine specific code. JVM is also platform dependent and provides core java functions like garbage collection, memory management, security etc."},{"id":555,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"Which component is responsible to run java program?","opts":[["a","JVM"],["b","JDK"],["c","JIT"],["d","JRE"]],"ans":"d","exp":"JRE is the implementation of JVM, it provides platform to execute java programs."},{"id":556,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"Which component is responsible to optimize bytecode to machine code?","opts":[["a","JVM"],["b","JDK"],["c","JIT"],["d","JRE"]],"ans":"c","exp":"JIT optimizes bytecode to machine specific language code by compiling similar bytecodes at the same time. This reduces overall time taken for compilation of bytecode to machine specific language."},{"id":557,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"Which statement is true about java?","opts":[["a","Platform independent programming language"],["b","Platform dependent programming language"],["c","Code dependent programming language"],["d","Sequence dependent programming language"]],"ans":"a","exp":"Java is called 'Platform Independent Language' as it primarily works on the principle of 'compile once, run everywhere'."},{"id":558,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"Which of the below is invalid identifier with the main method?","opts":[["a","public"],["b","static"],["c","private"],["d","final"]],"ans":"c","exp":"main method cannot be private as it is invoked by external method. Other identifier are valid with main method."},{"id":559,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"What is the extension of java code files?","opts":[["a",".class"],["b",".java"],["c",".txt"],["d",".js"]],"ans":"b","exp":"Java files have .java extension."},{"id":560,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"What is the extension of compiled java classes?","opts":[["a",".class"],["b",".java"],["c",".txt"],["d",".js"]],"ans":"a","exp":"The compiled java files have .class extension."},{"id":561,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"How can we identify whether a compilation unit is class or interface from a .class file?","opts":[["a","Java source file header"],["b","Extension of compilation unit"],["c","We cannot differentiate between class and interface"],["d","The class or interface name should be postfixed with unit type"]],"ans":"a","exp":"The Java source file contains a header that declares the type of class or interface, its visibility with respect to other classes, its name and any superclass it may extend, or interface it implements."},{"id":562,"cat":"Core Java","topic":"JDK-JRE-JIT-JVM","q":"What is use of interpreter?","opts":[["a","They convert bytecode to machine language code"],["b","They read high level code and execute them"],["c","They are intermediated between JIT and JVM"],["d","It is a synonym for JIT"]],"ans":"b","exp":"Interpreters read high level language (interprets it) and execute the program. Interpreters are normally not passing through byte-code and jit compilation."},{"id":563,"cat":"Core Java","topic":"JUnits","q":"JUnits are used for which type of testing?","opts":[["a","Unit Testing"],["b","Integration Testing"],["c","System Testing"],["d","Blackbox Testing"]],"ans":"a","exp":"JUnit is a testing framework for unit testing. It uses java as a programming platform. It is managed by junit.org community."},{"id":564,"cat":"Core Java","topic":"JUnits","q":"Which of the below statement about JUnit is false?","opts":[["a","It is an open source framework"],["b","It provides an annotation to identify test methods"],["c","It provides test runners for running test"],["d","They cannot be run automatically"]],"ans":"d","exp":"JUnits test can be run automatically and they check their own results and provide immediate feedback."},{"id":565,"cat":"Core Java","topic":"JUnits","q":"Which of the below is an incorrect annotation with respect to JUnits?","opts":[["a","@Test"],["b","@BeforeClass"],["c","@Junit"],["d","@AfterEach"]],"ans":"c","exp":"@Test is used to annotate method under test, @BeforeEach and @AfterEach are called before and after each method respectively. @BeforeClass and @AfterClass are called only once for each class."},{"id":566,"cat":"Core Java","topic":"JUnits","q":"Which of these is not a mocking framework?","opts":[["a","EasyMock"],["b","Mockito"],["c","PowerMock"],["d","MockJava"]],"ans":"d","exp":"EasyMock, jMock, Mockito, Unitils Mock, PowerMock and JMockit are a various mocking framework."},{"id":567,"cat":"Core Java","topic":"JUnits","q":"Which method is used to verify the actual and expected results in Junits?","opts":[["a","assert()"],["b","equals()"],["c","=="],["d","isEqual()"]],"ans":"a","exp":"assert method is used to compare actual and expected results in Junit. It has various implementation like assertEquals, assertArrayEquals, assertFalse, assertNotNull, etc."},{"id":568,"cat":"Core Java","topic":"JUnits","q":"What does assertSame() method use for assertion?","opts":[["a","equals() method"],["b","isEqual() method"],["c","=="],["d","compare() method"]],"ans":"c","exp":"== is used to compare the objects not the content. assertSame() method compares to check if actual and expected are the same objects. It does not compare their content."},{"id":569,"cat":"Core Java","topic":"JUnits","q":"How to let junits know that they need to be run using PowerMock?","opts":[["a","@PowerMock"],["b","@RunWith(PowerMock)"],["c","@RunWith(Junits)"],["d","@RunWith(PowerMockRunner.class)"]],"ans":"d","exp":"@RunWith(PowerMockRunner.class) signifies to use PowerMock JUnit runner. Along with that @PrepareForTest(User.class) is used to declare the class being tested. mockStatic(Resource.class) is used to mock the static methods."},{"id":570,"cat":"Core Java","topic":"JUnits","q":"How can we simulate if then behavior in Junits?","opts":[["a","if{..} else{..}"],["b","if(..){..} else{..}"],["c","Mockito.when(...).thenReturn(...);"],["d","Mockito.if(..).then(..);"]],"ans":"c","exp":"Mockito.when(mockList.size()).thenReturn(100); assertEquals(100, mockList.size()); is the usage to implement if and then behavior."},{"id":571,"cat":"Core Java","topic":"JUnits","q":"What is used to inject mock fields into the tested object automatically?","opts":[["a","@InjectMocks"],["b","@Inject"],["c","@InjectMockObject"],["d","@Mock"]],"ans":"a","exp":"@InjectMocks annotation is used to inject mock fields into the tested object automatically."},{"id":572,"cat":"Core Java","topic":"JUnits","q":"How can junits be implemented using maven?","opts":[["a",""],["b",""],["c",""],["d",""]],"ans":"a","exp":"JUnits can be used using dependency tag in maven in pom.xml. The version as desired and available in repository can be used."},{"id":573,"cat":"Core Java","topic":"Java 8 Features","q":"Which of the following is not introduced with Java 8?","opts":[["a","Stream API"],["b","Serialization"],["c","Spliterator"],["d","Lambda Expression"]],"ans":"b","exp":"Serialization is not introduced with Java 8. It was introduced with an earlier version of Java."},{"id":574,"cat":"Core Java","topic":"Java 8 Features","q":"What is the purpose of BooleanSupplier function interface?","opts":[["a","represents supplier of Boolean-valued results"],["b","returns Boolean-valued result"],["c","There is no such function interface"],["d","returns null if Boolean is passed as argument"]],"ans":"a","exp":"BooleanSupplier function interface represents supplier of Boolean-valued results."},{"id":575,"cat":"Core Java","topic":"Java 8 Features","q":"What is the return type of lambda expression?","opts":[["a","String"],["b","Object"],["c","void"],["d","Function"]],"ans":"d","exp":"Lambda expression enables us to pass functionality as an argument to another method, such as what action should be taken when someone clicks a button."},{"id":576,"cat":"Core Java","topic":"Java 8 Features","q":"Which is the new method introduced in java 8 to iterate over a collection?","opts":[["a","for (String i : StringList)"],["b","foreach (String i : StringList)"],["c","StringList.forEach()"],["d","List.for()"]],"ans":"c","exp":"Traversing through forEach method of Iterable with anonymous class."},{"id":577,"cat":"Core Java","topic":"Java 8 Features","q":"What are the two types of Streams offered by java 8?","opts":[["a","sequential and parallel"],["b","sequential and random"],["c","parallel and random"],["d","random and synchronized"]],"ans":"a","exp":"Sequential stream and parallel stream are two types of stream provided by java."},{"id":578,"cat":"Core Java","topic":"Java 8 Features","q":"Which feature of java 8 enables us to create a work stealing thread pool using all available processors at its target?","opts":[["a","workPool"],["b","newWorkStealingPool"],["c","threadPool"],["d","workThreadPool"]],"ans":"b","exp":"Executors newWorkStealingPool() method to create a work-stealing thread pool using all available processors as its target parallelism level."},{"id":579,"cat":"Core Java","topic":"Java 8 Features","q":"What does Files.lines(Path path) do?","opts":[["a","It reads all the files at the path specified as a String"],["b","It reads all the lines from a file as a Stream"],["c","It reads the filenames at the path specified"],["d","It counts the number of lines for files at the path specified"]],"ans":"b","exp":"Files.lines(Path path) that reads all lines from a file as a Stream."},{"id":580,"cat":"Core Java","topic":"Java 8 Features","q":"What is Optional object used for?","opts":[["a","Optional is used for optional runtime argument"],["b","Optional is used for optional spring profile"],["c","Optional is used to represent null with absent value"],["d","Optional means it's not mandatory for method to return object"]],"ans":"c","exp":"Optional object is used to represent null with absent value. This class has various utility methods to facilitate code to handle values as 'available' or 'not available' instead of checking null values."},{"id":581,"cat":"Core Java","topic":"Java 8 Features","q":"What is the substitute of Rhino javascript engine in Java 8?","opts":[["a","Nashorn"],["b","V8"],["c","Inscript"],["d","Narcissus"]],"ans":"a","exp":"Nashorn provides 2 to 10 times faster in terms of performance, as it directly compiles the code in memory and passes the bytecode to JVM. Nashorn uses invoke dynamic feature."},{"id":582,"cat":"Core Java","topic":"Java 8 Features","q":"What does SAM stand for in the context of Functional Interface?","opts":[["a","Single Ambivalue Method"],["b","Single Abstract Method"],["c","Simple Active Markup"],["d","Simple Abstract Markup"]],"ans":"b","exp":"SAM Interface stands for Single Abstract Method Interface. Functional Interface is also known as SAM Interface because it contains only one abstract method."},{"id":583,"cat":"Core Java","topic":"Java.io Byte Streams","q":"Which of these classes is used for input and output operation when working with bytes?","opts":[["a","InputStream"],["b","Reader"],["c","Writer"],["d","All of the mentioned"]],"ans":"a","exp":"InputStream & OutputStream are designed for byte stream. Reader and writer are designed for character stream."},{"id":584,"cat":"Core Java","topic":"Java.io Byte Streams","q":"Which of these class is used to read and write bytes in a file?","opts":[["a","FileReader"],["b","FileWriter"],["c","FileInputStream"],["d","InputStreamReader"]],"ans":"c"},{"id":585,"cat":"Core Java","topic":"Java.io Byte Streams","q":"Which of these method of InputStream is used to read integer representation of next available byte input?","opts":[["a","read()"],["b","scanf()"],["c","get()"],["d","getInteger()"]],"ans":"a"},{"id":586,"cat":"Core Java","topic":"Java.io Byte Streams","q":"Which of these data type is returned by every method of OutputStream?","opts":[["a","int"],["b","float"],["c","byte"],["d","none of the mentioned"]],"ans":"d","exp":"Every method of OutputStream returns void and throws an IOExeption in case of errors."},{"id":587,"cat":"Core Java","topic":"Java.io Byte Streams","q":"Which of these is a method to clear all the data present in output buffers?","opts":[["a","clear()"],["b","flush()"],["c","fflush()"],["d","close()"]],"ans":"b"},{"id":588,"cat":"Core Java","topic":"Java.io Byte Streams","q":"Which of these method(s) is/are used for writing bytes to an outputstream?","opts":[["a","put()"],["b","write()"],["c","printf()"],["d","write() and read()"]],"ans":"b","exp":"write() method is specifically designed for writing bytes to an OutputStream where as printf() method is primarily used for formatted data to a stream. put() is not there."},{"id":589,"cat":"Core Java","topic":"Java.io Byte Streams","q":"What will be the output of the following Java program? (Note: inputoutput.java is stored in the disk.)","opts":[["a","true"],["b","false"],["c","prints number of bytes in file"],["d","prints number of characters in the file"]],"ans":"c","cod":["    import java.io.*;\n    class filesinputoutput\n    {\n        public static void main(String args[])\n        {\n            InputStream obj = new FileInputStream(\"inputoutput.java\");\n            System.out.print(obj.available());\n        }\n    }"],"exp":"obj.available() returns the number of bytes."},{"id":590,"cat":"Core Java","topic":"Java.io Byte Streams","q":"What will be the output of the following Java program?","opts":[["a","abc"],["b","ABC"],["c","ab"],["d","AB"]],"ans":"a","cod":["    import java.io.*;\n    public class filesinputoutput\n    {\n    \tpublic static void main(String[] args)\n        {\n \t   String obj  = \"abc\";\n           byte b[] = obj.getBytes();\n           ByteArrayInputStream obj1 = new ByteArrayInputStream(b);\n           for (int i = 0; i < 2; ++ i)\n           {\n               int c;\n               while ((c = obj1.read()) != -1)\n               {\n            \t   if(i == 0)\n                   {\n            \t       System.out.print((char)c);\n            \t   }\n               }\n           }\n        }\n    }"]},{"id":591,"cat":"Core Java","topic":"Java.io Byte Streams","q":"What will be the output of the following Java program?","opts":[["a","abc"],["b","ABC"],["c","ab"],["d","AB"]],"ans":"b","cod":["    import java.io.*;\n    public class filesinputoutput\n eam in terms of functioning?","opts":[["a","File"],["b","Writer"],["c","InputStream"],["d","Reader"]],"ans":"a","exp":"A File describes properties of a file, a File object is used to obtain or manipulate the information associated with a disk file, such as the permissions, time date, and directories path, and to navigate subdirectories."},{"id":602,"cat":"Core Java","topic":"Java.io Introduction","q":"Which of these is specified by a File object?","opts":[["a","a file in disk"],["b","directory path"],["c","directory in disk"],["d","none of the mentioned"]],"ans":"c"},{"id":603,"cat":"Core Java","topic":"Java.io Introduction","q":"Which of these is method for testing whether the specified element is a file or a directory?","opts":[["a","IsFile()"],["b","isFile()"],["c","Isfile()"],["d","isfile()"]],"ans":"b","exp":"isFile() returns true if called on a file and returns false when called on a directory."},{"id":604,"cat":"Core Java","topic":"Java.io Introduction","q":"What will be the output of the following Java code?","opts":[["a","java"],["b","system"],["c","java/system"],["d","/java/system"]],"ans":"b","cod":["    import java.io.*;\n    class files\n    {\n        public static void main(String args[])\n        {\n            File obj = new File(\"/java/system\");\n            System.out.print(obj.getName());\n        }\n    }"],"exp":"obj.getName() returns the name of the file."},{"id":605,"cat":"Core Java","topic":"Java.io Introduction","q":"What will be the output of the following Java program? (Note: file is made in c drive.)","opts":[["a","java"],["b","system"],["c","c:/java/system"],["d","c:\\java\\system"]],"ans":"d","cod":["    import java.io.*;\n    class files\n    {\n        public static void main(String args[])\n        {\n            File obj = new File(\"c:/java/system\");\n            System.out.print(obj.getAbsolutePath());\n        }\n    }"]},{"id":606,"cat":"Core Java","topic":"Java.io Introduction","q":"What will be the output of the following
