nce","q":"Which of the following constant are defined in Character wrapper?","opts":[["a","MAX_RADIX"],["b","MAX_VALUE"],["c","TYPE"],["d","All of the mentioned"]],"ans":"d","exp":"Character wrapper defines 5 constants - MAX_RADIX, MIN_RADIX, MAX_VALUE, MIN_VALUE & TYPE."},{"id":136,"cat":"Core Java","topic":"Character Wrapper Advance","q":"Which of these is a super class of Character wrapper?","opts":[["a","Long"],["b","Digits"],["c","Float"],["d","Number"]],"ans":"d","exp":"Number is an abstract class containing subclasses Double, Float, Byte, Short, Character, Integer and Long."},{"id":137,"cat":"Core Java","topic":"Character Wrapper Advance","q":"Which of these methods is used to know whether a given Character object is part of Java's Identifiers?","opts":[["a","isIdentifier()"],["b","isJavaIdentifier()"],["c","isJavaIdentifierPart()"],["d","none of the mentioned"]],"ans":"c"},{"id":138,"cat":"Core Java","topic":"Character Wrapper Advance","q":"Which of these coding techniques is used by method isDefined()?","opts":[["a","Latin"],["b","ASCII"],["c","ANSI"],["d","UNICODE"]],"ans":"d","exp":"isDefined() returns true if ch is defined by Unicode. Otherwise, it returns false."},{"id":139,"cat":"Core Java","topic":"Character Wrapper Advance","q":"What will be the output of the following Java program?","opts":[["a","<"],["b",">"],["c","?"],["d","$"]],"ans":"c","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            int a = Character.MAX_VALUE;\n            System.out.print((char)a);\n        }\n    }"],"exp":"Character.MAX_VALUE returns the largest character value, which is of character '?'."},{"id":140,"cat":"Core Java","topic":"Character Wrapper Advance","q":"What will be the output of the following Java program?","opts":[["a","<"],["b","!"],["c","@"],["d","Space"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            int a = Character.MIN_VALUE;\n            System.out.print((char)a);\n        }\n    }"],"exp":"Character.MIN_VALUE returns the smallest character value, which is of space character ' '."},{"id":141,"cat":"Core Java","topic":"Character Wrapper Advance","q":"What will be the output of the following Java program?","opts":[["a","true false true"],["b","false true true"],["c","true true false"],["d","false false false"]],"ans":"b","cod":["    class Output\n    {\n         public static void main(String args[])\n         {\n             char a[] = {'a', '5', 'A', ' '};\n             System.out.print(Character.isDigit(a[0])+ \" \");\n             System.out.print(Character.isWhitespace(a[3])+ \" \");\n             System.out.print(Character.isUpperCase(a[2]));\n        }\n    }"],"exp":"Character.isDigit(a[0]) checks for a[0], whether it is a digit or not, since a[0] i:e 'a' is a character false is returned. a[3] is a whitespace hence Character.isWhitespace(a[3]) returns a true. a[2] is an uppercase letter i:e 'A' hence Character.isUpperCase(a[2]) returns true."},{"id":142,"cat":"Core Java","topic":"Character Wrapper Advance","q":"What will be the output of the following Java program?","opts":[["a","b"],["b","c"],["c","B"],["d","C"]],"ans":"c","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n\t    char a = (char) 98;\n            a = Character.toUpperCase(a);\n            System.out.print(a);\n        }\n    }"]},{"id":143,"cat":"Core Java","topic":"Character Wrapper Advance","q":"What will be the output of the following Java program?","opts":[["a","true"],["b","false"],["c","@"],["d","B"]],"ans":"b","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n\t    char a = '@';\n            boolean x = Character.isLetter(a);\n            System.out.print(x);\n        }\n    }"]},{"id":144,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"What is the numerical range of a char data type in Java?","opts":[["a","-128 to 127"],["b","0 to 256"],["c","0 to 32767"],["d","0 to 65535"]],"ans":"d","exp":"Char occupies 16-bit in memory, so it supports 216 i:e from 0 to 65535."},{"id":145,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"Which of these coding types is used for data type characters in Java?","opts":[["a","ASCII"],["b","ISO-LATIN-1"],["c","UNICODE"],["d","None of the mentioned"]],"ans":"c","exp":"Unicode defines fully international character set that can represent all the characters found in all human languages. Its range is from 0 to 65536."},{"id":146,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"Which of these values can a boolean variable contain?","opts":[["a","True & False"],["b","0 & 1"],["c","Any integer value"],["d","true"]],"ans":"d","exp":"Boolean variable can contain only one of two possible values, true and false. Everything in lowercase. Capitalized True and False are not boolean values in Java."},{"id":147,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"Which of these occupy first 0 to 127 in Unicode character set used for characters in Java?","opts":[["a","ASCII"],["b","ISO-LATIN-1"],["c","None of the mentioned"],["d","ASCII and ISO-LATIN1"]],"ans":"d","exp":"First 0 to 127 character set in Unicode are same as those of ISO-LATIN-1 and ASCII."},{"id":148,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"Which one is a valid declaration of a boolean?","opts":[["a","boolean b1 = 1;"],["b","boolean b2 = 'false';"],["c","boolean b3 = false;"],["d","boolean b4 = 'true'"]],"ans":"c","exp":"Boolean can only be assigned true or false literals."},{"id":149,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"What will be the output of the following Java program?","opts":[["a","i i i i i"],["b","0 1 2 3 4"],["c","i j k l m"],["d","None of the mentioned"]],"ans":"a","cod":["    class array_output {\n        public static void main(String args[])\n        {\n            char array_variable [] = new char[10];\n\t    for (int i = 0; i < 10; ++i) {\n                array_variable[i] = 'i';\n                System.out.print(array_variable[i] + \" \" );\n                i++;\n            }\n        }\n    }"]},{"id":150,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"What will be the output of the following Java program?","opts":[["a","66"],["b","67"],["c","65"],["d","64"]],"ans":"a","cod":["    class mainclass {\n        public static void main(String args[])\n        {\n            char a = 'A';\n            a++;\n\t    System.out.print((int)a);\n        }\n    }"],"exp":"ASCII value of 'A' is 65, on using ++ operator character value increments by one."},{"id":151,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","1"],["c","true"],["d","false"]],"ans":"c","cod":["    class mainclass {\n        public static void main(String args[])\n        {\n            boolean var1 = true;\n\t    boolean var2 = false;\n\t    if (var1)\n\t        System.out.println(var1);\n\t    else\n\t        System.out.println(var2);\n       }\n    }"]},{"id":152,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"What will be the output of the following Java code?","opts":[["a","0"],["b","1"],["c","true"],["d","false"]],"ans":"d","cod":["    class booloperators {\n        public static void main(String args[])\n        {\n            boolean var1 = true;\n\t    boolean var2 = false;\n\t    System.out.println((var1 & var2));\n        }\n    }"],"exp":"boolean '&' operator always returns true or false. It returns true when both the values are true and false otherwise. Since, var1 is defined true and var2 is defined false hence their '&' operator result is false."},{"id":153,"cat":"Core Java","topic":"Character and Boolean Datatypes","q":"What will be the output of the following Java code?","opts":[["a","162"],["b","65 97"],["c","67 95"],["d","66 98"]],"ans":"b","cod":["    class asciicodes {\n        public static void main(String args[])\n        {\n            char var1 = 'A';\n\t    char var2 = 'a';\n\t    System.out.println((int)var1 + \" \" + (int)var2);\n        }\n    }"],"exp":"ASCII code for 'A' is 65 and for 'a' is 97."},{"id":154,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"What is the stored in the object obj in following lines of Java code?","opts":[["a","Memory address of allocated memory of object"],["b","NULL"],["c","Any arbitrary pointer"],["d","Garbage"]],"ans":"b","cod":["   box obj;"],"exp":"Memory is allocated to an object using new operator. box obj; just declares a reference to object, no memory is allocated to it hence it points to NULL."},{"id":155,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"Which of these keywords is used to make a class?","opts":[["a","class"],["b","struct"],["c","int"],["d","none of the mentioned"]],"ans":"a"},{"id":156,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"Which of the following is a valid declaration of an object of class Box?","opts":[["a","Box obj = new Box();"],["b","Box obj = new Box;"],["c","obj = new Box();"],["d","new Box obj;"]],"ans":"a"},{"id":157,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"Which of these operators is used to allocate memory for an object?","opts":[["a","malloc"],["b","alloc"],["c","new"],["d","give"]],"ans":"c","exp":"Operator new dynamically allocates memory for an object and returns a reference to it. This reference is address in memory of the object allocated by new."},{"id":158,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"Which of these statement is incorrect?","opts":[["a","Every class must contain a main() method"],["b","Applets do not require a main() method at all"],["c","There can be only one main() method in a program"],["d","main() method must be made public"]],"ans":"a","exp":"Every class does not need to have a main() method, there can be only one main() method which is made public."},{"id":159,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"What will be the output of the following Java program?","opts":[["a","9"],["b","8"],["c","Compilation error"],["d","Runtime error"]],"ans":"c","cod":["    class main_class\n    {\n        public static void main(String args[])\n        {\n            int x = 9;\n            if (x == 9)\n            {\n                int x = 8;\n                System.out.println(x);\n            }\n        }\n    }"],"exp":"Two variables with the same name can't be created in a class."},{"id":160,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"Which of the following statements is correct?","opts":[["a","Public method is accessible to all other classes in the hierarchy"],["b","Public method is accessible only to subclasses of its parent class"],["c","Public method can only be called by object of its class"],["d","Public method can be accessed by calling object of the public class"]],"ans":"a"},{"id":161,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"What will be the output of the following Java program?","opts":[["a","12"],["b","200"],["c","400"],["d","100"]],"ans":"b","cod":["    class box\n    {\n        int width;\n        int height;\n        int length;\n    }\n    class mainclass\n    {\n        public static void main(String args[])\n        {\n             box obj = new box();\n             obj.width = 10;\n             obj.height = 2;\n             obj.length = 10;\n             int y = obj.width * obj.height * obj.length;\n             System.out.print(y);\n        }\n    }"]},{"id":162,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"What will be the output of the following Java program?","opts":[["a","1"],["b","2"],["c","Runtime error"],["d","Garbage value"]],"ans":"a","cod":["    class box\n    {\n        int width;\n        int height;\n        int length;\n    }\n    class mainclass\n    {\n        public static void main(String args[])\n        {\n            box obj1 = new box();\n            box obj2 = new box();\n            obj1.height = 1;\n            obj1.length = 2;\n            obj1.width = 1;\n            obj2 = obj1;\n            System.out.println(obj2.height);\n        }\n    }"],"exp":"When we assign an object to another object of same type, all the elements of right side object gets copied to object on left side of equal to, =, operator."},{"id":163,"cat":"Core Java","topic":"Class Fundamentals & Object Declaration","q":"What will be the output of the following Java program?","opts":[["a","0"],["b","1"],["c","Runtime error"],["d","classname@hashcode in hexadecimal form"]],"ans":"d","cod":["   class box\n   {\n        int width;\n        int height;\n        int length;\n   }\n    class mainclass\n    {\n        public static void main(String args[])\n        {\n            box obj = new box();\n            System.out.println(obj);\n        }\n    }"],"exp":"When we print object internally toString() will be called to return string into this format classname@hashcode in hexadecimal form."},{"id":164,"cat":"Core Java","topic":"Coding Best Practices","q":"What should the return type of method where there is no return value?","opts":[["a","Null"],["b","Empty collection"],["c","Singleton collection"],["d","Empty String"]],"ans":"b","exp":"Returning Empty collection is a good practice. It eliminates chances of unhandled null pointer exceptions."},{"id":165,"cat":"Core Java","topic":"Coding Best Practices","q":"What data structure should be used when number of elements is fixed?","opts":[["a","Array"],["b","Array list"],["c","Vector"],["d","Set"]],"ans":"a","exp":"Array list has variable size. Array is stored in contiguous memory. Hence, reading is faster. Also, array is memory efficient."},{"id":166,"cat":"Core Java","topic":"Coding Best Practices","q":"What causes the program to exit abruptly and hence its usage should be minimalistic?","opts":[["a","Try"],["b","Finally"],["c","Exit"],["d","Catch"]],"ans":"c","exp":"In case of exit, the program exits abruptly hence would never be able to debug the root cause of the issue."},{"id":167,"cat":"Core Java","topic":"Coding Best Practices","q":"Which of the following is good coding practice to determine oddity?\ni)\nii)","opts":[["a","i"],["b","ii"],["c","(i) causes compilation error"],["d","(ii) causes compilation error"]],"ans":"b","cod":["public boolen abc(int num)\n{\n\treturn num % 2 == 1;\n}","public boolean xyz(int num)\n{\n\treturn (num & 1)!= 0;\n }"],"exp":"Arithmetic and logical operations are much faster than division and multiplication."},{"id":168,"cat":"Core Java","topic":"Coding Best Practices","q":"Which one of the following causes memory leak?","opts":[["a","Release database connection when querying is complete"],["b","Use Finally block as much as possible"],["c","Release instances stored in static tables"],["d","Not using Finally block often"]],"ans":"d","exp":"Finally block is called in successful as well exception scenarios. Hence, all the connections are closed properly which avoids memory leak."},{"id":169,"cat":"Core Java","topic":"Coding Best Practices","q":"Which of the following is a best practice to measure time taken by a process for execution?","opts":[["a","System.currentTimeMillis()"],["b","System.nanoTime()"],["c","System.getCurrentTime()"],["d","System.getProcessingTime()"]],"ans":"b","exp":"System.nanoTime takes around 1/100000 th of a second whereas System.currentTimeMillis takes around 1/1000th of a second."},{"id":170,"cat":"Core Java","topic":"Coding Best Practices","q":"What one of the following is best practice to handle Null Pointer exception?\ni) int noOfStudents = line.listStudents().count;\nii) int noOfStudents = getCountOfStudents(line);","opts":[["a","Option (i)"],["b","Option (ii)"],["c","Compilation Error"],["d","Option (ii) gives incorrect result"]],"ans":"b","cod":["    public int getCountOfStudents(List line)\n    {\n\tif(line != null)\n        {\n\t\tif(line.listOfStudents() != null)\n                {\n\t\t\treturn line.listOfStudents().size();\n\t\t}\n\t}\n\tthrow new NullPointerException(\"List is empty\");\n    }"],"exp":"Null check must be done while dealing with nested structures to avoid null pointer exceptions."},{"id":171,"cat":"Core Java","topic":"Coding Best Practices","q":"Which of the below is true about java class structure?","opts":[["a","The class name should start with lowercase"],["b","The class should have thousands of lines of code"],["c","The class should only contain those attribute and functionality which it should; hence keeping it short"],["d","The class attributes and methods should be public"]],"ans":"c","exp":"Class name should always start with upper case and contain those attribute and functionality which it should (Single Responsibility Principle); hence keeping it short. The attributes should be usually private with get and set methods."},{"id":172,"cat":"Core Java","topic":"Coding Best Practices","q":"Which of the below is false about java coding?","opts":[["a","variable names should be short"],["b","variable names should be such that they avoid ambiguity"],["c","test case method names should be created as english sentences without spaces"],["d","class constants should be used when we want to share data between class methods"]],"ans":"a","exp":"variable names like i, a, abc, etc should be avoided. They should be real world names which avoid ambiguity. Test case name should explain its significance."},{"id":173,"cat":"Core Java","topic":"Coding Best Practices","q":"Which is better in terms of performance for iterating an array?","opts":[["a","for(int i=0; i<100; i++)"],["b","for(int i=99; i>=0; i-)"],["c","for(int i=100; i<0; i++)"],["d","for(int i=99; i>0; i++)"]],"ans":"a","exp":"Looping from 0 to 99 (for(int i=0; i<100; i++)) is generally better in terms of performance because it follows a natural forward iteration, making it more cache-friendly and optimizing branch prediction. Other options may cause inefficiencies or incorrect execution."},{"id":174,"cat":"Core Java","topic":"Collection Algorithms","q":"Which of these is an incorrect form of using method max() to obtain a maximum element?","opts":[["a","max(Collection c)"],["b","max(Collection c, Comparator comp)"],["c","max(Comparator comp)"],["d","max(List c)"]],"ans":"c","exp":"Its illegal to call max() only with comparator, we need to give the collection to be searched into."},{"id":175,"cat":"Core Java","topic":"Collection Algorithms","q":"Which of these methods sets every element of a List to a specified object?","opts":[["a","set()"],["b","fill()"],["c","Complete()"],["d","add()"]],"ans":"b"},{"id":176,"cat":"Core Java","topic":"Collection Algorithms","q":"Which of these methods can randomize all elements in a list?","opts":[["a","rand()"],["b","randomize()"],["c","shuffle()"],["d","ambiguous()"]],"ans":"c","exp":"shuffle - randomizes all the elements in a list."},{"id":177,"cat":"Core Java","topic":"Collection Algorithms","q":"Which of these methods can convert an object into a List?","opts":[["a","SetList()"],["b","ConvertList()"],["c","singletonList()"],["d","CopyList()"]],"ans":"c","exp":"singletonList() returns the object as an immutable List. This is an easy way to convert a single object into a list. This was added by Java 2.0."},{"id":178,"cat":"Core Java","topic":"Collection Algorithms","q":"Which of these is true about unmodifiableCollection() method?","opts":[["a","unmodifiableCollection() returns a collection that cannot be modified"],["b","unmodifiableCollection() method is available only for List and Set"],["c","unmodifiableCollection() is defined in Collection class"],["d","none of the mentioned"]],"ans":"b","exp":"unmodifiableCollection() is available for al collections, Set, Map, List etc."},{"id":179,"cat":"Core Java","topic":"Collection Algorithms","q":"What will be the output of the following Java program?","opts":[["a","2 8 5 1"],["b","1 5 8 2"],["c","2"],["d","2 1 8 5"]],"ans":"a","cod":["    import java.util.*;\n    class Collection_Algos\n    {\n        public static void main(String args[])\n        {\n            LinkedList list = new LinkedList();\n            list.add(new Integer(2));\n            list.add(new Integer(8));\n            list.add(new Integer(5));\n            list.add(new Integer(1));\n            Iterator i = list.iterator();\n\t    while(i.hasNext())\n\t        System.out.print(i.next() + \" \");\n        }\n    }"]},{"id":180,"cat":"Core Java","topic":"Collection Algorithms","q":"What will be the output of the following Java program?","opts":[["a","2 8 5 1"],["b","1 5 8 2"],["c","2"],["d","2 1 8 5"]],"ans":"b","cod":["    import java.util.*;\n    class Collection_Algos\n    {\n        public static void main(String args[])\n        {\n            LinkedList list = new LinkedList();\n            list.add(new Integer(2));\n            list.add(new Integer(8));\n            list.add(new Integer(5));\n            list.add(new Integer(1));\n            Iterator i = list.iterator();\n            Collections.reverse(list);\n\t    while(i.hasNext())\n\t        System.out.print(i.next() + \" \");\n        }\n    }"],"exp":"Collections.reverse(list) reverses the given list, the list was 2->8->5->1 after reversing it became 1->5->8->2."},{"id":181,"cat":"Core Java","topic":"Collection Framework","q":"Which of these packages contain all the collection classes?","opts":[["a","java.lang"],["b","java.util"],["c","java.net"],["d","java.awt"]],"ans":"b","exp":"The package that contains all the collection classes and interfaces in the Java Collection Framework is java.util."},{"id":182,"cat":"Core Java","topic":"Collection Framework","q":"Which of these classes is not part of Java's collection framework?","opts":[["a","Maps"],["b","Array"],["c","Stack"],["d","Queue"]],"ans":"a","exp":"Maps is not a part of ublic static void main(String args[])\n        {\n            BitSet obj = new BitSet(5);\n            for (int i = 0; i < 5; ++i)\n                obj.set(i);\n            obj.clear(2);\n            System.out.print(obj);\n        }\n    }"],"exp":"The clear(int bitIndex) method sets the bit at the given index to false; for example, calling clear(2) will reset the bit at index 2 to 0."},{"id":188,"cat":"Core Java","topic":"Collection Framework","q":"Which of these interface declares core method that all collections will have?","opts":[["a","set"],["b","EventListner"],["c","Comparator"],["d","Collection"]],"ans":"d","exp":"Collection interfaces defines core methods that all the collections like set, map, arrays etc will have."},{"id":189,"cat":"Core Java","topic":"Collection Framework","q":"Which of these interface handle sequences?","opts":[["a","Set"],["b","List"],["c","Comparator"],["d","Collection"]],"ans":"b","exp":"The List interface handles sequences as it allows ordered collections of elements. Lists can contain duplicate elements and provide precise control over the position of each element. On the other hand, Set does not allow duplicates and does not guarantee order, Comparator is used for sorting and comparing, and Collection is a more general interface that doesn't specifically handle sequencing."},{"id":190,"cat":"Core Java","topic":"Collection Framework","q":"Which of this interface must contain a unique element?","opts":[["a","Set"],["b","List"],["c","Array"],["d","Collection"]],"ans":"a","exp":"Set interface extends collection interface to handle sets, which must contain unique elements."},{"id":191,"cat":"Core Java","topic":"Collection Framework","q":"Which of these is a Basic interface that all other interface inherits?","opts":[["a","Set"],["b","Array"],["c","List"],["d","Collection"]],"ans":"d","exp":"Collection interface is inherited by all other interfaces like Set, Array, Map etc. It defines core methods that all the collections like set, map, arrays etc will have"},{"id":192,"cat":"Core Java","topic":"Collection Framework","q":"Which of these is static variable defined in Collections?","opts":[["a","EMPTY_SET"],["b","EMPTY_LIST"],["c","EMPTY_MAP"],["d","All of the mentioned"]],"ans":"d","exp":"The Collections class has only these three static variables.\nEMPTY_LIST => The empty list (immutable).\nEMPTY_MAP => The empty map (immutable).\nEMPTY_SET => The empty set (immutable)."},{"id":193,"cat":"Core Java","topic":"Collection Framework","q":"What will be the output of the following Java program?","opts":[["a","12345"],["b","54321"],["c","1234"],["d","5432"]],"ans":"a","cod":["    import java.util.*;\n    class Array\n    {\n        public static void main(String args[])\n        {\n            int array[] = new int [5];\n            for (int i = 5; i > 0; i--)\n                array[5 - i] = i;\n            Arrays.sort(array);\n            for (int i = 0; i < 5; ++i)\n            \tSystem.out.print(array[i]);;\n        }\n    }"],"exp":"Arrays.sort(array) method sorts the array into 1,2,3,4,5."},{"id":194,"cat":"Core Java","topic":"Collection Framework","q":"What will be the output of the following Java program?","opts":[["a","2 8 5 1"],["b","1 5 8 2"],["c","1 2 5 8"],["d","2 1 8 5"]],"ans":"c","cod":["    import java.util.*;\n    class Collection_Algos\n    {\n        public static void main(String args[])\n        {\n            LinkedList list = new LinkedList();\n            list.add(new Integer(2));\n            list.add(new Integer(8));\n            list.add(new Integer(5));\n            list.add(new Integer(1));\n            Iterator i = list.iterator();\n            Collections.reverse(list);\n\t    Collections.sort(list);\n            while(i.hasNext())\n\t        System.out.print(i.next() + \" \");\n        }\n    }"],"exp":"Collections.sort(list) sorts the given list, the list was 2->8->5->1 after sorting it became 1->2->5->8."},{"id":195,"cat":"Core Java","topic":"Collection Framework","q":"What will be the output of the following Java program?","opts":[["a","2 8 5 1"],["b","1 5 8 2"],["c","1 2 5 8"],["d","Any random order"]],"ans":"d","cod":["    import java.util.*;\n    class Collection_Algos\n    {\n        public static void main(String args[])\n        {\n            LinkedList list = new LinkedList();\n            list.add(new Integer(2));\n            list.add(new Integer(8));\n            list.add(new Integer(5));\n            list.add(new Integer(1));\n            Iterator i = list.iterator();\n            Collections.reverse(list);\n\t    Collections.shuffle(list);\n            while(i.hasNext())\n\t        System.out.print(i.next() + \" \");\n        }\n    }"],"exp":"shuffle - randomizes all the elements in a list."},{"id":196,"cat":"Core Java","topic":"Command Line Arguments","q":"Which of this method is given parameter via command line arguments?","opts":[["a","main()"],["b","recursive() method"],["c","Any method"],["d","System defined methods"]],"ans":"a","exp":"Only main() method can be given parameters via using command line arguments."},{"id":197,"cat":"Core Java","topic":"Command Line Arguments","q":"Which of these data types is used to store command line arguments?","opts":[["a","Array"],["b","Stack"],["c","String"],["d","Integer"]],"ans":"c"},{"id":198,"cat":"Core Java","topic":"Command Line Arguments","q":"How many arguments can be passed to main()?","opts":[["a","Infinite"],["b","Only 1"],["c","System Dependent"],["d","None of the mentioned"]],"ans":"a"},{"id":199,"cat":"Core Java","topic":"Command Line Arguments","q":"Which of these is a correct statement about args in the following line of code?","opts":[["a","args is a String"],["b","args is a Character"],["c","args is an array of String"],["d","args in an array of Character"]],"ans":"c","cod":["public static void main(String args[])"],"exp":"args in an array of String."},{"id":200,"cat":"Core Java","topic":"Command Line Arguments","q":"Can command line arguments be converted into int automatically if required?","opts":[["a","Yes"],["b","No"],["c","Compiler Dependent"],["d","Only ASCII characters can be converted"]],"ans":"b","exp":"All command Line arguments are passed as a string. We must convert numerical value to their internal forms manually."},{"id":201,"cat":"Core Java","topic":"Command Line Arguments","q":"What will be the output of the following Java program, Command line execution is done as - "java Output This is a command Line"?","opts":[["a","java"],["b","Output"],["c","This"],["d","is"]],"ans":"c","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            System.out.print(args[0]);\n        }\n    }"]},{"id":202,"cat":"Core Java","topic":"Command Line Arguments","q":"What will be the output of the following Java program, Command line exceution is done as - "java Output This is a command Line"?","opts":[["a","java"],["b","is"],["c","This"],["d","command"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            System.out.print(args[3]);\n        }\n    }"]},{"id":203,"cat":"Core Java","topic":"Command Line Arguments","q":"What will be the output of the following Java program, Command line execution is done as - java Output "This is a command Line"?","opts":[["a","This"],["b","java Output This is a command Line"],["c","This is a command Line"],["d","Compilation Error"]],"ans":"c","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            for (String arg : args)\n            {\n                System.out.print(arg);\n            }\n        }\n    }"]},{"id":204,"cat":"Core Java","topic":"Command Line Arguments","q":"What will be the output of the following Java program, Command line execution is done as - "java Output command Line 10 A b 4 N"?","opts":[["a","java"],["b","10"],["c","20"],["d","error"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            System.out.print((int)args[2] * 2);\n        }\n    }"]},{"id":205,"cat":"Core Java","topic":"Command Line Arguments","q":"What will be the output of the following Java program, Command line execution is done as - "java Output command Line 10 A b 4 N"?","opts":[["a","java"],["b","10"],["c","b"],["d","N"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n            System.out.print(args[6]);\n        }\n    }"]},{"id":206,"cat":"Core Java","topic":"ComponentEvent, ContainerEvent & FocusEvent Classes","q":"Which of these events is generated when the size of an event is changed?","opts":[["a","ComponentEvent"],["b","ContainerEvent"],["c","FocusEvent"],["d","InputEvent"]],"ans":"a","exp":"A ComponentEvent is generated when the size, position or visibility of a component is changed."},{"id":207,"cat":"Core Java","topic":"ComponentEvent, ContainerEvent & FocusEvent Classes","q":"Which of these events is generated when the component is added or removed?","opts":[["a","ComponentEvent"],["b","ContainerEvent"],["c","FocusEvent"],["d","InputEvent"]],"ans":"b","exp":"A ContainerEvent is generated when a component is added to or removed from a container. It has two integer constants COMPONENT_ADDED & COMPONENT_REMOVED."},{"id":208,"cat":"Core Java","topic":"ComponentEvent, ContainerEvent & FocusEvent Classes","q":"Which of these methods can be used to obtain the reference to the container that generated a ContainerEvent?","opts":[["a","getContainer()"],["b","getContainerCommand()"],["c","getActionEvent()"],["d","getContainerEvent()"]],"ans":"d"},{"id":209,"cat":"Core Java","topic":"ComponentEvent, ContainerEvent & FocusEvent Classes","q":"Which of these methods can be used to get reference to a component that was removed from a container?","opts":[["a","getComponent()"],["b","getchild()"],["c","getContainerComponent()"],["d","getComponentChild()"]],"ans":"b","exp":"The getChild() method returns a reference to the component that was added to or removed from the container."},{"id":210,"cat":"Core Java","topic":"ComponentEvent, ContainerEvent & FocusEvent Classes","q":"Which of these are integer constants of ComponentEvent class?","opts":[["a","COMPONENT_HIDDEN"],["b","COMPONENT_MOVED"],["c","COMPONENT_RESIZE"],["d","All of the mentioned"]],"ans":"d","exp":"The component event class defines 4 constants COMPONENT_HIDDEN, COMPONENT-MOVED, COMPONENT-RESIZE and COMPONENT-SHOWN."},{"id":211,"cat":"Core Java","topic":"ComponentEvent, ContainerEvent & FocusEvent Classes","q":"Which of these events is generated when computer gains or loses input focus?","opts":[["a","ComponentEvent"],["b","ContainerEvent"],["c","FocusEvent"],["d","InputEvent"]],"ans":"c"},{"id":212,"cat":"Core Java","topic":"ComponentEvent, ContainerEvent & FocusEvent Classes","q":"FocusEvent is subclass of which of these classes?","opts":[["a","ComponentEvent"],["b","ContainerEvent"],["c","ItemEvent"],["d","InputEvent"]],"ans":"a"},{"id":213,"cat":"Core Java","topic":"ComponentEvent, ContainerEvent & FocusEvent Classes","q":"Which of these methods can be used to know the type of focus change?","opts":[["a","typeFocus()"],["b","typeEventFocus()"],["c","isTemporary()"],["d","isPermanent()"]],"ans":"c","exp":"There are two types of focus events - permanent and temporary. The isTemporary() method indicates if this focus change is temporary, it returns a Boolean value."},{"id":214,"cat":"Core Java","topic":"ComponentEvent, ContainerEvent & FocusEvent Classes","q":"Which of these is superclass of ContainerEvent class?","opts":[["a","WindowEvent"],["b","ComponentEvent"],["c","ItemEvent"],["d","InputEvent"]],"ans":"b","exp":"ContainerEvent is superclass of ContainerEvent, FocusEvent, KeyEvent, MouseEvent and WindowEvent."},{"id":215,"cat":"Core Java","topic":"Constructor","q":"What is true about private constructor?","opts":[["a","Private constructor ensures only one instance of a class exist at any point of time"],["b","Private constructor ensures multiple instances of a class exist at any point of time"],["c","Private constructor eases the instantiation of a class"],["d","Private constructor allows creating objects in other classes"]],"ans":"a","exp":"Object of private constructor can only be created within class. Private constructor is used in singleton pattern."},{"id":216,"cat":"Core Java","topic":"Constructor","q":"What would be the behaviour if this() and super() used in a method?","opts":[["a","Runtime error"],["b","Throws exception"],["c","compile time error"],["d","Runs successfully"]],"ans":"c","exp":"this() and super() cannot be used in a method. This throws compile time error."},{"id":217,"cat":"Core Java","topic":"Constructor","q":"What is false about constructor?","opts":[["a","Constructors cannot be synchronized in Java"],["b","Java does not provide default copy constructor"],["c","Constructor can have a return type"],["d",""this" and "super" can be used in a constructor"]],"ans":"c","exp":"The constructor cannot have a return type. It should create and return new objects. Hence it would give a compilation error."},{"id":218,"cat":"Core Java","topic":"Constructor","q":"What could be true about Class.getInstance() considering that it defines the getInstance() method?","opts":[["a","Class.getInstance calls the constructor"],["b","Class.getInstance is same as new operator"],["c","Class.getInstance needs to have matching constructor"],["d","Class.getInstance creates object if class does not have any constructor"]],"ans":"d","exp":"The method getInstance() can be used to create an object if the class doesn't have any constructor."},{"id":219,"cat":"Core Java","topic":"Constructor","q":"What is true about constructor?","opts":[["a","It can contain return type"],["b","It can take any number of parameters"],["c","It can have any non access modifiers"],["d","Constructor cannot throw an exception"]],"ans":"b","exp":"Constructor returns a new object with variables defined as in the class. Instance variables are newly created and only one copy of static variables are created."},{"id":220,"cat":"Core Java","topic":"Constructor","q":"Abstract class cannot have a constructor.","opts":[["a","True"],["b","False"]],"ans":"b","exp":"No instance can be created of abstract class. Only pointer can hold instance of object."},{"id":221,"cat":"Core Java","topic":"Constructor","q":"What is true about protected constructor?","opts":[["a","Protected constructor can be called directly"],["b","Protected constructor can only be called using super()"],["c","Protected constructor can be used outside package"],["d","protected constructor can be instantiated even if child is in a different package"]],"ans":"b","exp":"Protected access modifier means that constructor can be accessed by child classes of the parent class and classes in the same package."},{"id":222,"cat":"Core Java","topic":"Constructor","q":"What is not the use of "this" keyword in Java?","opts":[["a","Passing itself to another method"],["b","Calling another constructor in constructor chaining"],["c","Referring to the instance variable when local variable has the same name"],["d","Passing itself to method of the same class"]],"ans":"d","exp":""this" is an important keyword in java. It helps to distinguish between local variable and variables passed in the method as parameters."},{"id":223,"cat":"Core Java","topic":"Constructor","q":"What would be the behaviour if one parameterized constructor is explicitly defined, but no default constructor is provided?","opts":[["a","Compilation error"],["b","Compilation succeeds"],["c","Runtime error"],["d","Compilation succeeds but at the time of creating object using default constructor, it throws compilation error"]],"ans":"d","exp":"The class compiles successfully. But the object creation of that class gives a compilation error."},{"id":224,"cat":"Core Java","topic":"Constructor","q":"What would be behaviour if the constructor has a return type?","opts":[["a","Compilation error"],["b","Runtime error"],["c","Compilation and runs successfully"],["d","Only String return type is allowed"]],"ans":"a","exp":"The constructor cannot have a return type. It should create and return new object. Hence it would give compilation error."},{"id":225,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"What is the return type of Constructors?","opts":[["a","int"],["b","float"],["c","void"],["d","none of the mentioned"]],"ans":"d","exp":"Constructors does not have any return type, not even void."},{"id":226,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"Which keyword is used by the method to refer to the object that invoked it?","opts":[["a","import"],["b","catch"],["c","abstract"],["d","this"]],"ans":"d","exp":"this keyword can be used inside any method to refer to the current object. this is always a reference to the object on which the method was invoked."},{"id":227,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"Which of the following is a method having same name as that of its class?","opts":[["a","finalize"],["b","delete"],["c","class"],["d","constructor"]],"ans":"d","exp":"A constructor is a method that initializes an object immediately upon creation. It has the same name as that of class in which it resides."},{"id":228,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"Which operator is used by Java run time implementations to free the memory of an object when it is no longer needed?","opts":[["a","delete"],["b","free"],["c","new"],["d","none of the mentioned"]],"ans":"d","exp":"Java handles deallocation of memory automatically, we do not need to explicitly delete an element. Garbage collection only occurs during execution of the program. When no references to the object exist, that object is assumed to be no longer needed, and the memory occupied by the object can be reclaimed."},{"id":229,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"Which function is used to perform some action when the object is to be destroyed?","opts":[["a","finalize()"],["b","delete()"],["c","main()"],["d","none of the mentioned"]],"ans":"a"},{"id":230,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"What will be the output of the following Java code?","opts":[["a","100"],["b","150"],["c","200"],["d","250"]],"ans":"b","cod":["    class box\n    {\n        int width;\n        int height;\n        int length;\n        int volume;\n        box()\n        {\n            width = 5;\n            height = 5;\n            length = 6;\n        }\n        void volume()\n        {\n             volume = width*height*length;\n        }\n    }\n    class constructor_output\n    {\n        public static void main(String args[])\n        {\n            box obj = new box();\n            obj.volume();\n            System.out.println(obj.volume);\n        }\n   }"]},{"id":231,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"What will be the output of the following Java code?","opts":[["a","compile time error"],["b","run time error"],["c","compile and runs fine"],["d","unreported exception java.io.IOException in default constructor"]],"ans":"a","cod":["class San\n{\n     San()throws IOException\n     {\n\n     }\n\n}\nclass Foundry extends San\n{\n     Foundry()\n     {\n\n     }\n     public static void main(String[]args)\n     {\n\n     }\n}"],"exp":"If parent class constructor throws any checked exception, compulsory child class constructor should throw the same checked exception as its parent, otherwise code won't compile."},{"id":232,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"What will be the output of the following Java code?","opts":[["a","150"],["b","200"],["c","Run time error"],["d","Compilation error"]],"ans":"d","cod":["    class box\n    {\n        int width;\n        int height;\n        int length;\n        int volume;\n        void finalize()\n        {\n            volume = width*height*length;\n            System.out.println(volume);\n        }\n        protected void volume()\n       {\n            volume = width*height*length;\n            System.out.println(volume);\n       }\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            box obj = new box();\n            obj.width=5;\n            obj.height=5;\n            obj.length=6;\n            obj.volume();\n        }\n    }"]},{"id":233,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"Which of the following statements are incorrect?","opts":[["a","default constructor is called at the time of object declaration"],["b","constructor can be parameterized"],["c","finalize() method is called when a object goes out of scope and is no longer needed"],["d","finalize() method must be declared protected"]],"ans":"c","exp":"finalize() method is called just prior to garbage collection. it is not called when object goes out of scope."},{"id":234,"cat":"Core Java","topic":"Constructors & Garbage Collection","q":"What will be the output of the following Java code?","opts":[["a","0 0"],["b","5 6"],["c","6 5"],["d","5 5"]],"ans":"c","cod":["    class area\n    {\n        int width;\n        int length;\n        int area;\n        void area(int width, int length)\n        {\n            this.width = width;\n            this.length = length;\n        }\n\n    }\n    class Output\n    {\n        public static void main(String args[])\n        {\n            area obj = new area();\n            obj.area(5 , 6);\n            System.out.println(obj.length + \" \" + obj.width);\n        }\n    }"],"exp":"this keyword can be used inside any method to refer to the current object. this is always a reference to the object on which the method was invoked."},{"id":235,"cat":"Core Java","topic":"Control Statements","q":"Which of these selection statements test only for equality?","opts":[["a","if"],["b","switch"],["c","if & switch"],["d","none of the mentioned"]],"ans":"b","exp":"Switch statements checks for equality between the controlling variable and its constant cases."},{"id":236,"cat":"Core Java","topic":"Control Statements","q":"Which of these are selection statements in Java?","opts":[["a","if()"],["b","for()"],["c","continue"],["d","break"]],"ans":"a","exp":"Continue and break are jump statements, and for is a looping statement."},{"id":237,"cat":"Core Java","topic":"Control Statements","q":"Which of the following loops will execute the body of loop even when condition controlling the loop is initially false?","opts":[["a","do-while"],["b","while"],["c","for"],["d","none of the mentioned"]],"ans":"a"},{"id":238,"cat":"Core Java","topic":"Control Statements","q":"Which of these jump statements can skip processing the remainder of the code in its body for a particular iteration?","opts":[["a","break"],["b","return"],["c","exit"],["d","continue"]],"ans":"d"},{"id":239,"cat":"Core Java","topic":"Control Statements","q":"Which of this statement is incorrect?","opts":[["a","switch statement is more efficient than a set of nested ifs"],["b","two case constants in the same switch can have identical values"],["c","switch statement can only test for equality, whereas if statement can evaluate any type of boolean expression"],["d","it is possible to create a nested switch statements"]],"ans":"b","exp":"No two case constants in the same switch can have identical values."},{"id":240,"cat":"Core Java","topic":"Control Statements","q":"What will be the output of the following Java program?","opts":[["a","1"],["b","2"],["c","3"],["d","4"]],"ans":"b","cod":["    class selection_statements\n    {\n        public static void main(String args[])\n        {\n            int var1 = 5;\n            int var2 = 6;\n            if ((var2 = 1) == var1)\n                System.out.print(var2);\n            else\n                System.out.print(++var2);\n        }\n    }"],"exp":"var2 is initialised to 1. The conditional statement returns false and the else part gets executed."},{"id":241,"cat":"Core Java","topic":"Control Statements","q":"What will be the output of the following Java program?","opts":[["a","5"],["b","6"],["c","14"],["d","compilation error"]],"ans":"b","cod":["    class comma_operator\n    {\n        public static void main(String args[])\n        {\n             int sum = 0;\n             for (int i = 0, j = 0; i < 5 & j < 5; ++i, j = i + 1)\n                 sum += i;\n \t     System.out.println(sum);\n        }\n    }"],"exp":"Using comma operator, we can include more than one statement in the initialization and iteration portion of the for loop. Therefore both ++i and j = i + 1 is executed i gets the value - 0,1,2,3,4 & j gets the values -0,1,2,3,4,5."},{"id":242,"cat":"Core Java","topic":"Control Statements","q":"What will be the output of the following Java program?","opts":[["a","1 3 5 7"],["b","2 4 6 8"],["c","1 3 5 7 9"],["d","1 2 3 4 5 6 7 8 9"]],"ans":"c","cod":["    class jump_statments\n    {\n        public static void main(String args[])\n        {\n             int x = 2;\n             int y = 0;\n             for ( ; y < 10; ++y)\n             {\n                 if (y % x == 0)\n                     continue;\n                 else if (y == 8)\n                      break;\n                 else\n                    System.out.print(y + \" \");\n             }\n        }\n    }"],"exp":"Whenever y is divisible by x remainder body of loop is skipped by continue statement, therefore if condition y == 8 is never true as when y is 8, remainder body of loop is skipped by continue statements of first if. Control comes to print statement only in cases when y is odd."},{"id":243,"cat":"Core Java","topic":"Control Statements","q":"What will be the output of the following Java program?","opts":[["a","Hello"],["b","run time error"],["c","Hello world"],["d","compile time error"]],"ans":"d","cod":["class Output\n{\n        public static void main(String args[])\n        {\n           final int a=10,b=20;\n          while(a<b)\n          {\n\n          System.out.println(\"Hello\");\n          }\n          System.out.println(\"World\");\n\n        }\n}"],"exp":"Every final variable is compile time constant."},{"id":244,"cat":"Core Java","topic":"Control Statements","q":"What will be the output of the following Java program?","opts":[["a","5 10"],["b","10 5"],["c","5"],["d","10"]],"ans":"d","cod":["    class Output\n    {\n        public static void main(String args[])\n        {\n             int a = 5;\n             int b = 10;\n             first:\n             {\n                second:\n                {\n                   third:\n                   {\n                       if (a ==  b >> 1)\n                           break second;\n                   }\n                   System.out.println(a);\n                }\n                System.out.println(b);\n             }\n        }\n    }"],"exp":"b >> 1 in if returns 5 which is equal to a i:e 5, therefore body of if is executed and block second is exited. Control goes to end of the block second executing the last print statement, printing 10."},{"id":245,"cat":"Core Java","topic":"Control Statements","q":"What would be the output of the following code snippet if variable a=10?","opts":[["a","1 2"],["b","2 3"],["c","1 3"],["d","3"]],"ans":"d","cod":["if(a<=0)\n{\n   if(a==0)\n   {\n     System.out.println(\"1 \");\n   }\n   else\n   {\n      System.out.println(\"2 \");\n   }\n}\nSystem.out.println(\"3 \");"],"exp":"Since the first if condition is not met, control would not go inside if statement and hence only statement after the entire if block will be executed."},{"id":246,"cat":"Core Java","topic":"Control Statements","q":"The while loop repeats a set of code while the condition is not met?","opts":[["a","True"],["b","False"]],"ans":"b","exp":"While loop repeats a set of code only until the condition is met."},{"id":247,"cat":"Core Java","topic":"Control Statements","q":"What is true about a break?","opts":[["a","Break stops the execution of entire program"],["b","Break halts the execution and forces the control out of the loop"],["c","Break forces the control out of the loop and starts the execution of next iteration"],["d","Break halts the execution of the loop for certain time frame"]],"ans":"b","exp":"Break halts the execution and forces the control out of the loop."},{"id":248,"cat":"Core Java","topic":"Control Statements","q":"What is true about do statement?","opts":[["a","do statement executes the code of a loop at least once"],["b","do statement does not get execute if condition is not matched in the first iteration"],["c","do statement checks the condition at the beginning of the loop"],["d","do statement executes the code more than once always"]],"ans":"a","exp":"Do statement checks the condition at the end of the loop. Hence, code gets executed at least once."},{"id":249,"cat":"Core Java","topic":"Control Statements","q":"Which of the following is used with the switch statement?","opts":[["a","Continue"],["b","Exit"],["c","break"],["d","do"]],"ans":"c","exp":"Break is used with a switch statement to shift control out of switch."},{"id":250,"cat":"Core Java","topic":"Control Statements","q":"What is the valid data type for variable "a" to print "Hello World"?","opts":[["a","int and float"],["b","short and double"],["c","char and long"],["d","byte and char"]],"ans":"d","cod":["switch(a)\n{\n   System.out.println(\"Hello World\");\n}"],"exp":"The switch condition would only meet if variable "a" is of type byte or char."},{"id":251,"cat":"Core Java","topic":"Control Statements","q":"Which of the following is not a decision making statement?","opts":[["a","if"],["b","if-else"],["c","switch"],["d","do-while"]],"ans":"d","exp":"do-while is an iteration statement. Others are decision making statements."},{"id":252,"cat":"Core Java","topic":"Control Statements","q":"Which of the following is not a valid jump statement?","opts":[["a","break"],["b","goto"],["c","continue"],["d","return"]],"ans":"b","exp":"break, continue and return transfer control to another part of the program and returns back to caller after execution. However, goto is marked as not used in Java."},{"id":253,"cat":"Core Java","topic":"Control Statements","q":"From where break statement causes an exit?","opts":[["a","Only from innermost loop"],["b","Terminates a program"],["c","Only from innermost switch"],["d","From innermost loops or switches"]],"ans":"d","exp":"The break statement causes an exit from innermost loop or switch."},{"id":254,"cat":"Core Java","topic":"Control Statements","q":"Which of the following is not a valid flow control statement?","opts":[["a","exit()"],["b","break"],["c","continue"],["d","return"]],"ans":"a","exp":"exit() is not a flow control statement in Java. exit() terminates the currently running JVM."},{"id":255,"cat":"Core Java","topic":"Core Java API Packages","q":"Which of these package is used for graphical user interface?","opts":[["a","java.applet"],["b","java.awt"],["c","java.awt.image"],["d","java.io"]],"ans":"b","exp":"java.awt provides capabilities for graphical user interface."},{"id":256,"cat":"Core Java","topic":"Core Java API Packages","q":"Which of this package is used for analyzing code during run-time?","opts":[["a","java.applet"],["b","java.awt"],["c","java.io"],["d","java.lang.reflect"]],"ans":"d","exp":"Reflection is the ability of a software to analyze itself. This is provided by java.lang.reflect package."},{"id":257,"cat":"Core Java","topic":"Core Java API Packages","q":"Which of this package is used for handling security related issues in a program?","opts":[["a","java.security"],["b","java.lang.security"],["c","java.awt.image"],["d","java.io.security"]],"ans":"a","exp":"java.security handles certificates, keys, digests, signatures, and other security functions."},{"id":258,"cat":"Core Java","topic":"Core Java API Packages","q":"Which of these class allows us to get real time data about private and protected member of a class?","opts":[["a","java.io"],["b","GetInformation"],["c","ReflectPermission"],["d","MembersPermission"]],"ans":"c","exp":"The ReflectPermission class allows reflection of private or protected members of a class. This was added after java 2.0 ."},{"id":259,"cat":"Core Java","topic":"Core Java API Packages","q":"Which of this package is used for invoking a method remotely?","opts":[["a","java.rmi"],["b","java.awt"],["c","java.util"],["d","java.applet"]],"ans":"a","exp":"java.rmi provides capabilities for remote method invocation."},{"id":260,"cat":"Core Java","topic":"Core Java API Packages","q":"What will be the output of the following Java program?","opts":[["a","Program prints all the constructors of 'java.awt.Dimension' package"],["b","Program prints all the possible constructors of class 'Class'"],["c","Program prints "Exception""],["d","Runtime Error"]],"ans":"a","cod":["    import java.lang.reflect.*;\n    class Additional_packages\n    {\n         public static void main(String args[])\n         {\n\t     try\n             {\n\t         Class c = Class.forName(\"java.awt.Dimension\");\n\t\t Constructor constructors[] = c.getConstructors();\n\t\t for (int i = 0; i < constructors.length; i++)\n\t\t     System.out.println(constructors[i]);\n\t     }\n\t     catch (Exception e)\n             {\n                   System.out.print(\"Exception\");\n             }\n        }\n    }"]},{"id":261,"cat":"Core Java","topic":"Core Java API Packages","q":"What will be the output of the following Java program?","opts":[["a","Program prints all the constructors of 'java.awt.Dimension' package"],["b","Program prints all the methods of 'java.awt.Dimension' package"],["c","Program prints all the data members of 'java.awt.Dimension' package"],["d","program prints all the methods and data member of 'java.awt.Dimension' package"]],"ans":"c","cod":["    import java.lang.reflect.*;\n    class Additional_packages\n    {\n         public static void main(String args[])\n         {\n\t     try\n             {\n\t         Class c = Class.forName(\"java.awt.Dimension\");\n\t\t Field fields[] = c.getFields();\n\t\t for (int i = 0; i < fields.length; i++)\n\t\t     System.out.println(fields[i]);\n\t     }\n\t     catch (Exception e)\n             {\n                   System.out.print(\"Exception\");\n             }\n        }\n    }"]},{"id":262,"cat":"Core Java","topic":"Core Java API Packages","q":"What is the length of the application box made in the following Java program?","opts":[["a","20"],["b","Default value"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["    import java.awt.*;\n    import java.applet.*;\n    public class myapplet extends Applet\n    {\n        Graphic g;\n        g.drawString(\"A Simple Applet\",20,20);\n    }"],"exp":"To implement the method drawString we need first need to define abstract method of AWT that is paint() method. Without paint() method we cannot define and use drawString or any Graphic class methods."},{"id":263,"cat":"Core Java","topic":"Creating Exceptions","q":"Which of these classes is used to define exceptions?","opts":[["a","Exception"],["b","Throwable"],["c","Abstract"],["d","System"]],"ans":"a"},{"id":264,"cat":"Core Java","topic":"Creating Exceptions","q":"Which of these methods return description of an exception?","opts":[["a","getException()"],["b","getMessage()"],["c","obtainDescription()"],["d","obtainException()"]],"ans":"b","exp":"getMessage() returns a description of the exception."},{"id":265,"cat":"Core Java","topic":"Creating Exceptions","q":"Which of these methods is used to print stack trace?","opts":[["a","obtainStackTrace()"],["b","printStackTrace()"],["c","getStackTrace()"],["d","displayStackTrace()"]],"ans":"b"},{"id":266,"cat":"Core Java","topic":"Creating Exceptions","q":"Which of these methods return localized description of an exception?","opts":[["a","getLocalizedMessage()"],["b","getMessage()"],["c","obtainLocalizedMessage()"],["d","printLocalizedMessage()"]],"ans":"a"},{"id":267,"cat":"Core Java","topic":"Creating Exceptions","q":"Which of these classes is super class of Exception class?","opts":[["a","Throwable"],["b","System"],["c","RunTime"],["d","Class"]],"ans":"a"},{"id":268,"cat":"Core Java","topic":"Creating Exceptions","q":"What will be the output of the following Java code?","opts":[["a","3"],["b","Exception"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"b","cod":["    class Myexception extends Exception\n    {\n\tint detail;\n        Myexception(int a)\n        {\n            detail = a;\n\t}\n\tpublic String toString()\n        {\n\t    return \"detail\";\n\t}\n    }\n    class Output\n    {\n        static void compute (int a) throws Myexception\n        {\n\t     throw new Myexception(a);\n\t}\n\tpublic static void main(String args[])\n        {\n            try\n            {\n                compute(3);\n            }\n           catch(Myexception e)\n           {\n               System.out.print(\"Exception\");\n           }\n        }\n    }"],"exp":"Myexception is self defined exception."},{"id":269,"cat":"Core Java","topic":"Creating Exceptions","q":"What will be the output of the following Java code?","opts":[["a","3"],["b","Exception"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"c","cod":["    class Myexception extends Exception\n    {\n\tint detail;\n        Myexception(int a)\n        {\n        detail = a;\n\t}\n\tpublic String toString()\n        {\n\t    return \"detail\";\n\t}\n    }\n    class Output\n    {\n        static void compute (int a) throws Myexception\n        {\n\t     throw new Myexception(a);\n\t}\n\tpublic static void main(String args[])\n        {\n            try\n            {\n                compute(3);\n            }\n           catch(DevideByZeroException e)\n           {\n               System.out.print(\"Exception\");\n           }\n        }\n    }"],"exp":"Mexception is self defined exception, we are generating Myexception but catching DevideByZeroException which causes error."},{"id":270,"cat":"Core Java","topic":"Creating Exceptions","q":"What will be the output of the following Java code?","opts":[["a","A"],["b","B"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n            {\n                throw new NullPointerException (\"Hello\");\n                System.out.print(\"A\");\n            }\n            catch(ArithmeticException e)\n            {\n        \tSystem.out.print(\"B\");\n            }\n        }\n    }"],"exp":"try block is throwing NullPointerException but the catch block is used to counter Arithmetic Exception. Hence NullPointerException occurs since no catch is there which can handle it, compilation error occurs."},{"id":271,"cat":"Core Java","topic":"Creating Exceptions","q":"What will be the output of the following Java code?","opts":[["a","3"],["b","Exception"],["c","Runtime Error"],["d","Compilation Error"]],"ans":"b","cod":["    class Myexception extends Exception\n    {\n\tint detail;\n        Myexception(int a)\n        {\n        detail = a;\n\t}\n\tpublic String toString()\n        {\n\t    return \"detail\";\n\t}\n    }\n    class Output\n    {\n        static void compute (int a) throws Myexception\n        {\n\t     throw new Myexception(a);\n\t}\n\tpublic static void main(String args[])\n        {\n            try\n            {\n                compute(3);\n            }\n           catch(Exception e)\n           {\n               System.out.print(\"Exception\");\n           }\n        }\n    }"],"exp":"Myexception is self defined exception."},{"id":272,"cat":"Core Java","topic":"Creating Exceptions","q":"What will be the output of the following Java code?\nNote : Execution command line : $ java exception_handling one","opts":[["a","TypeA"],["b","TypeB"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["    class exception_handling\n    {\n        public static void main(String args[])\n        {\n            try\n            {\n                int a = args.length;\n                int b = 10 / a;\n                System.out.print(a);\n                try\n                {\n                     if (a == 1)\n                         a = a / a - a;\n                     if (a == 2)\n                     {\n                         int c = {1};\n                         c[8] = 9;\n                     }\n                }\n                catch (ArrayIndexOutOfBoundException e)\n                {\n                    System.out.println(\"TypeA\");\n                }\n                catch (ArithmeticException e)\n                {\n                    System.out.println(\"TypeB\");\n                }\n            }\n        }\n    }"],"exp":"try without catch or finally"},{"id":273,"cat":"Core Java","topic":"Creating Threads","q":"Which of these keywords are used to implement synchronization?","opts":[["a","synchronize"],["b","syn"],["c","synch"],["d","synchronized"]],"ans":"d"},{"id":274,"cat":"Core Java","topic":"Creating Threads","q":"Which of this method is used to avoid polling in Java?","opts":[["a","wait()"],["b","notify()"],["c","notifyAll()"],["d","all of the mentioned"]],"ans":"d","exp":"Polling is a usually implemented by looping in CPU is wastes CPU time, one thread being executed depends on other thread output and the other thread depends on the response on the data given to the first thread. In such situation CPU time is wasted, in Java this is avoided by using methods wait(), notify() and notifyAll()."},{"id":275,"cat":"Core Java","topic":"Creating Threads","q":"Which of these method is used to tell the calling thread to give up a monitor and go to sleep until some other thread enters the same monitor?","opts":[["a","wait()"],["b","notify()"],["c","notifyAll()"],["d","sleep()"]],"ans":"a","exp":"wait() method is used to tell the calling thread to give up a monitor and go to sleep until some other thread enters the same monitor. This helps in avoiding polling and minimizes CPU idle time."},{"id":276,"cat":"Core Java","topic":"Creating Threads","q":"Which of these method wakes up the first thread that called wait()?","opts":[["a","wake()"],["b","notify()"],["c","start()"],["d","notifyAll()"]],"ans":"b"},{"id":277,"cat":"Core Java","topic":"Creating Threads","q":"Which of these method wakes up all the threads?","opts":[["a","wakeAll()"],["b","notify()"],["c","start()"],["d","notifyAll()"]],"ans":"d","exp":"notifyAll() wakes up all the threads that called wait() on the same object. The highest priority thread will run first."},{"id":278,"cat":"Core Java","topic":"Creating Threads","q":"What is synchronization in reference to a thread?","opts":[["a","It's a process of handling situations when two or more threads need access to a shared resource"],["b","It's a process by which many thread are able to access same shared resource simultaneously"],["c","It's a process by which a method is able to access many different threads simultaneously"],["d","It's a method that allow too many threads to access any information the require"]],"ans":"a","exp":"When two or more threads need to access the same shared resource, they need some way to ensure that the resource will be used by only one thread at a time, the process by which this is achieved is called synchronization"},{"id":279,"cat":"Core Java","topic":"Creating Threads","q":"What will be the output of the following Java program?","opts":[["a","true"],["b","false"],["c","Main thread interrupted"],["d","None of the mentioned"]],"ans":"c","cod":["    class newthread extends Thread\n    {\n\tThread t;\n\tString name;\n\tnewthread(String threadname)\n        {\n\t    name = threadname;\n\t    t = new Thread(this,name);\n\t    t.start();\n\t}\n\tpublic void run()\n        {\n        }\n\n    }\n    class multithreaded_programing\n    {\n        public static void main(String args[])\n        {\n\t    newthread obj1 = \t new newthread(\"one\");\n\t    newthread obj2 =\t new newthread(\"two\");\n            try\n            {\n                obj1.t.wait();\n                System.out.print(obj1.t.isAlive());\n            }\n            catch(Exception e)\n            {\n\t    System.out.print(\"Main thread interrupted\");\n            }\n        }\n    }"],"exp":"obj1.t.wait() causes main thread to go out of processing in sleep state hence causes exception and "Main thread interrupted" is printed."},{"id":280,"cat":"Core Java","topic":"Creating Threads","q":"What will be the output of the following Java program?","opts":[["a","true"],["b","false"],["c","Main thread interrupted"],["d","None of the mentioned"]],"ans":"b","cod":["    class newthread extends Thread\n    {\n\tThread t;\n\tString name;\n\tnewthread(String threadname)\n        {\n\t    name = threadname;\n\t    t = new Thread(this,name);\n\t    t.start();\n\t}\n\tpublic void run()\n        {\n        }\n\n    }\n    class multithreaded_programing\n    {\n        public static void main(String args[])\n        {\n\t    newthread obj1 = \t new newthread(\"one\");\n\t    newthread obj2 =\t new newthread(\"two\");\n            try\n            {\n                Thread.sleep(1000);\n                System.out.print(obj1.t.isAlive());\n            }\n            catch(InterruptedException e)\n            {\n\t    System.out.print(\"Main thread interrupted\");\n            }\n        }\n    }"],"exp":"Thread.sleep(1000) has caused all the threads to be suspended for some time, hence onj1.t.isAlive() returns false."},{"id":281,"cat":"Core Java","topic":"Creating Threads","q":"What will be the output of the following Java program?","opts":[["a","true"],["b","false"],["c","Main thread interrupted"],["d","None of the mentioned"]],"ans":"b","cod":["    class newthread extends Thread\n    {\n\tThread t;\n\tString name;\n\tnewthread(String threadname)\n        {\n\t    name = threadname;\n\t    t = new Thread(this,name);\n\t    t.start();\n\t}\n\tpublic void run()\n        {\n        }\n\n    }\n    class multithreaded_programing\n    {\n        public static void main(String args[])\n        {\n\t    newthread obj1 = \t new newthread(\"one\");\n\t    newthread obj2 =\t new newthread(\"two\");\n            try\n            {\n                 System.out.print(obj1.t.equals(obj2.t));\n            }\n            catch(Exception e)\n            {\n\t    System.out.print(\"Main thread interrupted\");\n            }\n        }\n    }"],"exp":"Both obj1 and obj2 have threads with different name that is "one" and "two" hence obj1.t.equals(obj2.t) returns false."},{"id":282,"cat":"Core Java","topic":"Creating Threads","q":"What will be the output of the following Java program?","opts":[["a","true"],["b","false"],["c","truetrue"],["d","falsefalse"]],"ans":"d","cod":["    class newthread extends Thread\n    {\n\tThread t;\n\tnewthread()\n        {\n\t    t1 = new Thread(this,\"Thread_1\");\n\t    t2 = new Thread(this,\"Thread_2\");\n\t    t1.start();\n\t    t2.start();\n\t}\n\tpublic void run()\n        {\n\t    t2.setPriority(Thread.MAX_PRIORITY);\n\t    System.out.print(t1.equals(t2));\n        }\n    }\n    class multithreaded_programing\n    {\n        public static void main(String args[])\n        {\n            new newthread();\n        }\n    }"],"exp":"This program was previously done by using Runnable interface, here we have used Thread class. This shows both the method are equivalent, we can use any of them to create a thread."},{"id":283,"cat":"Core Java","topic":"Creating Threads","q":"Which of these interface is implemented by Thread class?","opts":[["a","Runnable"],["b","Connections"],["c","Set"],["d","MapConnections"]],"ans":"a"},{"id":284,"cat":"Core Java","topic":"Creating Threads","q":"Which of these method waits for the thread to treminate?","opts":[["a","sleep()"],["b","isAlive()"],["c","join()"],["d","stop()"]],"ans":"c"},{"id":285,"cat":"Core Java","topic":"Creating Threads","q":"What is the output of this program?","opts":[["a","My Thread"],["b","Thread[My Thread,5,main]"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"a","cod":["    class newthread implements Runnable {\n\tThread t;\n\tnewthread() {\n\t    t = new Thread(this,\"My Thread\");\n\t    t.start();\n\t}\n\tpublic void run() {\n\t    System.out.println(t.getName());\n\t}\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"$ javac multithreaded_programing.java\n$ java multithreaded_programing\nMy Thread"},{"id":286,"cat":"Core Java","topic":"Creating Threads","q":"What is the output of this program?","opts":[["a","My Thread"],["b","Thread[My Thread,5,main]"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"b","cod":["    class newthread implements Runnable {\n\tThread t;\n\tnewthread() {\n\t    t = new Thread(this,\"My Thread\");\n\t    t.start();\n\t}\n\tpublic void run() {\n\t    System.out.println(t);\n\t}\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"$ javac multithreaded_programing.java\n$ java multithreaded_programing\nThread[My Thread,5,main]"},{"id":287,"cat":"Core Java","topic":"Creating Threads","q":"What is the output of this program?","opts":[["a","My Thread"],["b","Thread[My Thread,5,main]"],["c","Compilation Error"],["d","Runtime Error"]],"ans":"c","cod":["    class newthread implements Runnable {\n\tThread t;\n\tnewthread() {\n\t    t = new Thread(this,\"My Thread\");\n\t    t.start();\n\t}\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"Thread t has been made by using Runnable interface, hence it is necessary to use inherited abstract method run() method to specify instructions to be implemented on the thread, since no run() method is used it gives a compilation error.\n$ javac multithreaded_programing.java\nThe type newthread must implement the inherited abstract method Runnable.run()"},{"id":288,"cat":"Core Java","topic":"Creating Threads","q":"What is the output of this program?","opts":[["a","Thread[New Thread,0,main]"],["b","Thread[New Thread,1,main]"],["c","Thread[New Thread,5,main]"],["d","Thread[New Thread,10,main]"]],"ans":"d","cod":["    class newthread implements Runnable {\n\tThread t;\n\tnewthread() {\n\t    t = new Thread(this,\"New Thread\");\n\t    t.start();\n\t}\n\tpublic void run() {\n\t    t.setPriority(Thread.MAX_PRIORITY);\n            System.out.println(t);\n\t}\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"Thread t has been made with default priority value 5 but in run method the priority has been explicitly changed to MAX_PRIORITY of class thread, that is 10 by code 't.setPriority(Thread.MAX_PRIORITY);' using the setPriority function of thread t.\n$ javac multithreaded_programing.java\n$ java multithreaded_programing\nThread[New Thread,10,main]"},{"id":289,"cat":"Core Java","topic":"Creating Threads","q":"What is the output of this program?","opts":[["a","true"],["b","false"],["c","truetrue"],["d","falsefalse"]],"ans":"d","cod":["    class newthread implements Runnable {\n\tThread t;\n\tnewthread() {\n\t    t1 = new Thread(this,\"Thread_1\");\n\t    t2 = new Thread(this,\"Thread_2\");\n\t    t1.start();\n\t    t2.start();\n\t}\n\tpublic void run() {\n\t    t2.setPriority(Thread.MAX_PRIORITY);\n\t    System.out.print(t1.equals(t2));\n        }\n    }\n    class multithreaded_programing {\n        public static void main(String args[]) {\n            new newthread();\n        }\n    }"],"exp":"Threads t1 & t2 are created by class newthread that is implementing runnable interface, hence both the threads are provided their own run() method specifying the actions to be taken. When constructor of newthread class is called first the run() method of t1 executes than the run method of t2 printing 2 times "false" as both the threads are not equal one is having different priority than other, hence falsefalse is printed.\n$ javac multithreaded_programing.java\n$ java multithreaded_programing\nfalsefalse"},{"id":290,"cat":"Core Java","topic":"Creating Threads","q":"What does AWT stands for?","opts":[["a","All Window Tools"],["b","All Writing Tools"],["c","Abstract Window Toolkit"],["d","Abstract Writing Toolkit"]],"ans":"c","exp":"AWT stands for Abstract Window Toolkit, it is used by applets to interact with the user."},{"id":291,"cat":"Core Java","topic":"Creating Threads","q":"Which of these is used to perform all input & output operations in Java?","opts":[["a","streams"],["b","Variables"],["c","classes"],["d","Methods"]],"ans":"a","exp":"Like in any other language, streams are used for input and output operations."},{"id":292,"cat":"Core Java","topic":"Creating Threads","q":"Which of these is a type of stream in Java?","opts":[["a","Integer stream"],["b","Short stream"],["c","Byte stream"],["d","Long stream"]],"ans":"c","exp":"Java defines only two types of streams - Byte stream and character stream."},{"id":293,"cat":"Core Java","topic":"Creating Threads","q":"Which of these classes are used by Byte streams for input operation?","opts":[["a","InputStream"],["b","InputOutputStream"],["c","Reader"],["d","All of the mentioned"]],"ans":"a","exp":"Byte stream uses InputStream and OutputStream classes for input and output operation."},{"id":294,"cat":"Core Java","topic":"Creating Threads","q":"Which of these classes are used by character streams for output operations?","opts":[["a","InputStream"],["b","Writer"],["c","ReadStream"],["d","InputOutputStream"]],"ans":"b","exp":"Character streams uses Writer and Reader classes for input & output operations."},{"id":295,"cat":"Core Java","topic":"Creating Threads","q":"Which of these class is used to read from byte array?","opts":[["a","InputStream"],["b","BufferedInputStream"],["c","ArrayInputStream"],["d","ByteArrayInputStream"]],"ans":"d","exp":"ByteArrayInputStream: This class is designed to allow reading byte streams from a byte array. It provides methods to read bytes from the array, such as read() which reads the next byte of the ByteArrayInputStream."},{"id":296,"cat":"Core Java","topic":"Creating Threads","q":"What will be the output of the following Java program if input given is 'abcqfghqbcd'?","opts":[["a","abcqfgh"],["b","abc"],["c","abcq"],["d","abcqfghq"]],"ans":"c","cod":["    import java.io.*;\n    class Input_Output\n    {\n        public static void main(String args[]) throws IOException\n        {\n            char c;\n            BufferedReader obj = new BufferedReader(new InputStreamReader(System.in));\n            do\n            {\n                c = (char) obj.read();\n\t        System.out.print(c);\n            } while(c != 'q');\n        }\n    }"],"exp":"The do-while loop in the program only prints the output from the stream from the beginning to the q character including q."},{"id":297,"cat":"Core Java","topic":"Creating Threads","q":"What will be the output of the following Java program if input given is "abc'def/'egh"?","opts":[["a","abc'"],["b","abcdef/'"],["c","abc'def/'egh"],["d","abc?def/"]],"ans":"a","cod":["import java.io.*;\nclass Input_Output\n{\n    public static void main(String args[]) throws IOException\n    {\n        char c;\n        BufferedReader obj = new BufferedReader(new InputStreamReader(System.in));\n        do\n        {\n            c = (char) obj.read();\n            System.out.print(c);\n        } while(c!='/');\n    }\n}"],"exp":"Since / is used to terminate the loop to print the character from stream. And the ' use in the statement without \\ it will not be recognized without an escape sequence."},{"id":298,"cat":"Core Java","topic":"Creating Threads","q":"What will be the output of the following Java program?","opts":[["a","4"],["b","5"],["c","6"],["d","7"]],"ans":"b","cod":["    class output\n    {\n        public static void main(String args[])\n        {\n             StringBuffer c = new StringBuffer(\"Hello\");\n             System.out.println(c.length());\n        }\n    }"],"exp":"length() method is used to obtain length of StringBuffer object, length of "Hello" is 5."},{"id":299,"cat":"Core Java","topic":"Creating Threads","q":"Which of these method can be used to make the main thread to be executed last among all the threads?","opts":[["a","stop()"],["b","sleep()"],["c","join()"],["d","call()"]],"ans":"b","exp":"By calling sleep() within main(), with long enough delay to ensure that all child threads terminate prior to the main thread."},{"id":300,"cat":"Core Java","topic":"Creating Threads","q":"Which of these method is used to find out that a thread is still running or not?","opts":[["a","run()"],["b","Alive()"],["c","isAlive()"],["d","checkRun()"]],"ans":"c","exp":"The isAlive( ) method returns true if the thread upon which it is called is still running. It returns false otherwise."},{"id":301,"cat":"Core Java","topic":"Creating Threads","q":"What is the default value of priority variable MIN_PRIORITY AND MAX_PRIORITY?","opts":[["a","0 & 256"],["b","0 & 1"],["c","1 & 10"],["d","1 & 256"]],"ans":"c"},{"id":302,"cat":"Core Java","topic":"Creating Threads","q":"Which of these method is used to explicitly set the priority of a thread?","opts":[["a","set()"],["b","make()"],["c","setPriority()"],["d","makePriority()"]],"ans":"c","exp":"The default value of priority given to a thread is 5 but we can explicitly change that value between the permitted values 1 & 10, this is done by using the method setPriority()."},{"id":303,"cat":"Core Java","topic":"Creating Threads","q":"What is synchronization in reference to a thread?","opts":[["a","It's a process of handling situatio
