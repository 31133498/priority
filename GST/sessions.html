n ceaseless change.", "Albert Camus, a French existentialist known as the philosopher of absurdity, holds that the only truly serious philosophical question is whether life is worth living (whether life is meaningful or meaningless), while counselling courage in the face of life's absurdity.", "Jean-Paul Sartre describes man as carrying an inner emptiness rooted in nothingness — the ontological foundation of man's being — making man permanently restless and dissatisfied; all human efforts to fill this vacuum are futile, hence Sartre's declaration that 'man is a useless passion.'", "Jacques Maritain defines philosophy as 'the science that studies the highest principles of all things'; Martin Heidegger defines philosophy as the search for the true meaning of Being, warning that modern forgetfulness of what it means 'to be' poses danger to civilization and humanism.", "Society in the broadest sense refers to the totality of all human relationships — 'the system of interrelationships and structures that connect individuals around the world'; in the narrower conventional sense, it is a group of people sharing a common culture, occupying a common territory, and feeling themselves a unified and distinct identity.", "The objective conditions for society's existence are three: (1) a group of people, (2) sharing a common culture, and (3) occupying a common territorial space — all materially verifiable facts.", "The subjective condition for society's existence is that the group feels itself to constitute a unified and distinct entity; both objective and subjective conditions are each necessary but not individually sufficient — only their combination provides a sufficient condition for society.", "Aristotle asserted in his Politics that 'man is a political animal,' meaning man is a gregarious being who cannot achieve happiness (the ultimate goal of human life) in isolation but only through interaction with others in the polis.", "Karl Marx defined society as not consisting of individuals but expressing 'the sum of interrelations, the relations within which these individuals stand,' emphasising structural relationships over individual identities.", "Western philosophy originated in the commercially prosperous city of Miletus in the Ionian region of Ancient Greece; its material conditions were congenial to the emergence of speculative cosmology as the first form of philosophical inquiry.", "Machiavelli's The Prince illustrates how historical context shapes philosophy — written during intense political instability in the Italian peninsula, it reflects a concern with restoring political stability, exemplifying Kyle Cupp's conclusion that 'all philosophy is contextual.'", "The relationship between philosophy and society is not a direct linear causal one but an extremely complicated bidirectional relationship in which society's material and historical conditions shape philosophy, while philosophy in turn transforms social practices and institutions.", "Society influences philosophy in two primary ways: (1) the material conditions of a society impact the content of philosophy, and (2) the historical conditions of a society shape the problems that philosophers address.", "Peter Singer distinguishes between intuitive/everyday morality — acting on generally accepted principles without critical examination — and the critical level of morality, where moral beliefs are subjected to evaluative scrutiny and may be revised.", "Ethics contributed to moral progress by subjecting slavery to rational scrutiny; even Plato and Aristotle once supported it, but philosophical reflection exposed slavery's lack of moral justification, leading to its universal condemnation and abolition.", "The Stoics, Thomas Aquinas, and John Locke demonstrated through natural rights philosophy that humans possess inalienable and inviolable rights knowable through reason; these now form the core of the 1948 Universal Declaration of Human Rights (UDHR) and are enshrined in virtually all national constitutions.", "Political philosophy produced organizing principles now adopted by governments worldwide, including separation of powers, federalism, checks and balances, representative government, civil rights, and popular sovereignty — the United States founding fathers drew heavily from these philosophical ideas.", "Philosophers Nietzsche, Darwin, and Hegel — though they may not have intended it — provided the motivation and legitimation for totalitarian rulers like Mussolini and Hitler; aspects of German philosophy emphasising Aryan racial supremacy contributed to the rise of Nazism, showing that philosophical ideas can have unintended negative societal consequences.", "Existentialism flourished after the Great Depression of the 1930s and World War II, when optimism was at its lowest; rejecting grand abstraction, it focused on loneliness, death, spiritual emptiness, ontological insecurity, and the void of absolute values, counselling self-definition through free choice and personal responsibility.", "Marxism is among the most impactful philosophical ideologies; after the 1917 Russian Revolution, the rise of Mao Tse-tung, and the spread of communism in Eastern Europe, close to two billion people came under centrally planned economies inspired by Marxist thought.", "Marxist thought became the philosophy of decolonisation in Africa — African nationalists used Marxian analysis to demonstrate the connection between colonial expansion and economic exploitation, mobilising against imperialism and winning political independence.", "J.I. Omoregbe argues that philosophical theories are 'dynamites and powerful agents of change, transformation and development'; Plato's admonition that until philosophers become kings — or rulers become philosophers — 'there will be no respite for humanity' establishes philosophy as a principal agent of social transformation."], "questions": [{"question": "What is the correct etymological breakdown of the word 'philosophy'?", "options": {"a": "'philos' (friend) + 'logos' (reason) = friend of reason", "b": "'philo' (love) + 'sophia' (wisdom) = love of wisdom", "c": "'philo' (light) + 'sophia' (knowledge) = light of knowledge", "d": "'polis' (city) + 'sophia' (wisdom) = wisdom of the city"}, "answer": "b", "explanation": "Philosophy comes from the Greek 'philo' meaning love and 'sophia' meaning wisdom, so 'philosophia' means 'love or pursuit of wisdom.'"}, {"question": "According to Socrates, what is the root of moral evil?", "options": {"a": "Poverty and material deprivation", "b": "Weakness of the will", "c": "Ignorance", "d": "Social inequality"}, "answer": "c", "explanation": "For Socrates, knowledge is virtue and ignorance is the root of moral evil — the implication being that one who truly knows what is good will necessarily do it."}, {"question": "Allen Wood's conception of philosophy is described as 'Socratic' because it emphasises:", "options": {"a": "The study of political governance", "b": "Self-reflection as the core of philosophy", "c": "The analysis of language and propositions", "d": "The pursuit of scientific method"}, "answer": "b", "explanation": "Allen Wood's view that philosophy is a self-reflective activity parallels Socrates' understanding that reflection is the core of philosophy — hence the description as 'Socratic.'"}, {"question": "Plato's term 'doxa' refers to which of the following?", "options": {"a": "Certain, evidential knowledge anchored in ideas", "b": "The highest form of intellectual illumination", "c": "Opinion or hearsay that anyone can express", "d": "The essence of things in the world of Forms"}, "answer": "c", "explanation": "Plato contrasts knowledge (episteme) with opinion (doxa); doxa is hearsay expressible by anybody, while genuine knowledge is critical, evidential, and anchored in ideas."}, {"question": "Aristotle's claim that metaphysics studies 'being qua being' means it studies:", "options": {"a": "All beings under specific scientific conditions and categories", "b": "The being of God as the supreme being", "c": "All things purely in regard to their having being, not under any particular condition", "d": "The relationship between mind and matter"}, "answer": "c", "explanation": "Metaphysics as 'first philosophy' studies being qua being — things in regard to those aspects that pertain to their being merely by virtue of their having being, unlike departmental sciences that study being under specified conditions."}, {"question": "Bertrand Russell's positioning of philosophy 'between theology and science' means that philosophy:", "options": {"a": "Combines religious faith with scientific experimentation", "b": "Relies on authority like theology but rejects rational reasoning like science", "c": "Speculates on unresolved matters like theology but appeals to reason rather than authority like science", "d": "Is superior to both theology and science in method and scope"}, "answer": "c", "explanation": "Russell states philosophy speculates on matters where definite knowledge is unattainable (like theology) but appeals to human reasoning rather than tradition or revelation (like science)."}, {"question": "Which philosopher defines philosophy as 'the science that studies the highest principles of all things'?", "options": {"a": "Martin Heidegger", "b": "A.J. Ayer", "c": "Jacques Maritain", "d": "Jean-Paul Sartre"}, "answer": "c", "explanation": "Jacques Maritain explicitly defines philosophy as the science that studies the highest principles of all things, while Heidegger defines it as the search for the true meaning of Being."}, {"question": "Martin Heidegger argues that modern civilisation faces danger because:", "options": {"a": "Science has replaced philosophy as the dominant intellectual activity", "b": "There is a hardened forgetfulness of what it means 'to be,' threatening humanism", "c": "Political philosophy has abandoned democratic ideals", "d": "Existentialism has promoted nihilism and despair"}, "answer": "b", "explanation": "Heidegger sees the fundamental philosophical question as the meaning of Being; he warns that forgetfulness of Being poses danger for civilisation and humanism, requiring radical rehabilitation."}, {"question": "Albert Camus concludes that 'there is but one truly serious philosophical problem' — what is it?", "options": {"a": "The existence of God", "b": "The nature of justice in society", "c": "Suicide — judging whether life is or is not worth living", "d": "The relationship between mind and body"}, "answer": "c", "explanation": "Camus states that whether life is worth living is the fundamental philosophical question; all other questions (dimensions of the world, categories of the mind) come second."}, {"question": "Jean-Paul Sartre's description of man as carrying 'an emptiness at the heart of his being' has its origin in:", "options": {"a": "Man's social alienation under capitalism", "b": "The failure of religion to provide meaning", "c": "Nothingness — the ontological foundation of man's being", "d": "Man's biological mortality and fear of death"}, "answer": "c", "explanation": "Sartre traces the inner emptiness to nothingness, which is the ontological foundation of man's being, separating man from himself and making him permanently restless and dissatisfied."}, {"question": "The Ionian cosmologists of Ephesus are significant in the history of philosophy primarily because they:", "options": {"a": "Founded the first formal school of philosophy", "b": "First raised the question of the meaning of human life", "c": "Sought the fundamental stuff (arche) of reality underlying cosmic unity and diversity", "d": "Introduced the method of logical deduction"}, "answer": "c", "explanation": "The Ionians (Milesian school) focused on finding the common element that holds things together — the arche — proposing water, air, fire, and the infinite as fundamental stuff, making them the first cosmologists."}, {"question": "In the broadest sense, society is defined as:", "options": {"a": "A group of people sharing one religion and language", "b": "The system of interrelationships and structures that connect individuals around the world", "c": "A nation-state governed by a single government", "d": "People living under a common legal system"}, "answer": "b", "explanation": "In its broadest ontological sense, society refers to the totality of all human relationships — the system of interrelationships connecting individuals, captured in Heidegger's phrase 'being-with-others.'"}, {"question": "Which combination correctly represents ALL objective conditions for the existence of society?", "options": {"a": "Common language, democratic governance, and shared history", "b": "A group of people, shared culture, and common territorial space", "c": "Unified identity, shared economy, and common territory", "d": "Common religion, ethnic homogeneity, and shared history"}, "answer": "b", "explanation": "The three objective (materially verifiable) conditions for society are: a group of people, sharing a common culture, and occupying a common territorial space."}, {"question": "Why is the subjective condition logically indispensable for the existence of society?", "options": {"a": "Without it, there can be no shared culture or territory", "b": "A group sharing territory and culture but not feeling unified does not yet constitute a society", "c": "It replaces the need for any objective conditions", "d": "It is what distinguishes modern societies from ancient ones"}, "answer": "b", "explanation": "Even if all objective conditions are met, if people do not feel themselves to constitute a unified and distinct entity, they cannot be called a society — the subjective condition is the decisive element that completes the sufficient condition."}, {"question": "Aristotle's claim that 'man is a political animal' in Politics implies that:", "options": {"a": "Man is inherently power-hungry and seeks to dominate others", "b": "Man is naturally suited to democratic governance", "c": "Man can only achieve happiness through social interaction in the polis, not in isolation", "d": "Man's highest virtue is political participation"}, "answer": "c", "explanation": "Aristotle's assertion means man is gregarious by nature — a moral and rational being who can attain happiness only through interaction with others in the political community, not in isolation."}, {"question": "Karl Marx's definition — 'Society does not consist of individuals but expresses the sum of interrelations, the relations within which these individuals stand' — challenges which view?", "options": {"a": "The view that society is shaped by biological factors", "b": "The atomistic view that society is simply an aggregate of independent individuals", "c": "The view that social relationships are determined by geography", "d": "The view that the state is prior to the individual"}, "answer": "b", "explanation": "Marx's definition emphasises that society is constituted by structural relations and interrelations, not by individual units treated in isolation — a direct challenge to atomistic individualism."}, {"question": "Western philosophy's origins in the commercially prosperous city of Miletus illustrates which principle about philosophy and society?", "options": {"a": "Philosophy only emerges in wealthy civilisations", "b": "Material conditions of a society influence the content and emergence of philosophy", "c": "Geography determines the form of philosophical inquiry", "d": "Commerce is the primary driver of all intellectual activity"}, "answer": "b", "explanation": "The Milesian case shows that the material conditions — commercial prosperity enabling leisure for reflection — shaped the emergence of speculative cosmology as the first form of philosophical inquiry."}, {"question": "Kyle Cupp's statement that 'all philosophy is contextual' most directly supports which argument in the text?", "options": {"a": "Philosophy cannot be universally valid across cultures", "b": "Society's historical and material context shapes the problems and agenda of philosophers", "c": "Philosophical ideas have no universal applicability", "d": "Cultural relativism is the correct philosophical position"}, "answer": "b", "explanation": "Cupp's statement is invoked to support the thesis that philosophy reflects the peculiar concerns of the context in which it is developed — philosophers have specific agendas shaped by their time and place, as Machiavelli illustrates."}, {"question": "Peter Singer's 'critical level of morality' involves:", "options": {"a": "Following the moral rules established by religious authority", "b": "Acting on generally accepted moral principles without reflection", "c": "Subjecting moral beliefs to evaluative scrutiny that may reveal wrong principles and prompt revision", "d": "Applying universal ethical theories derived from pure reason"}, "answer": "c", "explanation": "Singer's critical level goes beyond intuitive everyday morality — it subjects moral beliefs to evaluative scrutiny, sometimes revealing that accepted principles were wrong, as happened with slavery."}, {"question": "The text uses the example of slavery to illustrate how ethics contributes to society. What specific mechanism is highlighted?", "options": {"a": "Ethics lobbies governments to pass anti-slavery legislation", "b": "Philosophical rational scrutiny exposes the lack of moral justification for practices once widely accepted", "c": "Ethical codes issued by religious institutions abolish immoral practices", "d": "Economic analysis reveals that slavery is unprofitable"}, "answer": "b", "explanation": "The text shows that even respected philosophers (Plato, Aristotle) once accepted slavery; as philosophers began subjecting it to rational scrutiny, its moral unjustifiability became clear, demonstrating philosophy's role in moral progress."}, {"question": "The 1948 Universal Declaration of Human Rights (UDHR) is philosophically grounded in ideas first developed by which thinkers?", "options": {"a": "Marx, Engels, and Hegel", "b": "Camus, Sartre, and de Beauvoir", "c": "The Stoics, Thomas Aquinas, and John Locke", "d": "Plato, Aristotle, and Socrates"}, "answer": "c", "explanation": "The Stoics, Aquinas, and Locke demonstrated through natural rights philosophy that humans possess inalienable rights knowable through reason — these ideas now form the philosophical core of the UDHR."}, {"question": "Which of the following political principles listed in the text is NOT described as a product of political philosophical thinking adopted by governments worldwide?", "options": {"a": "Separation of powers", "b": "Checks and balances", "c": "Theocracy", "d": "Popular sovereignty"}, "answer": "c", "explanation": "The text lists separation of powers, federalism, checks and balances, representative government, civil rights, and popular sovereignty as products of political philosophy. Theocracy is not among them."}, {"question": "The text's discussion of Nietzsche, Darwin, and Hegel's ideas being used by fascist regimes best illustrates which principle?", "options": {"a": "Philosophers are morally responsible for all uses of their ideas", "b": "Philosophical ideas can have unintended negative societal consequences far beyond their authors' intentions", "c": "German philosophy is inherently totalitarian", "d": "Political philosophy is the most dangerous branch of philosophy"}, "answer": "b", "explanation": "The text explicitly states these philosophers 'may not have envisaged' their ideas leading to fascism — the point is that philosophical ideas, once released, can be appropriated to justify outcomes unintended by their originators."}, {"question": "Existentialism emerged as a response to the aftermath of the Great Depression and World War II because:", "options": {"a": "It was funded by European governments to restore morale", "b": "Optimism was at its lowest and despair pervaded European societies, making human-condition-focused philosophy relevant", "c": "German idealism had failed scientifically and needed a replacement", "d": "Marxism had been discredited by the failure of Soviet communism"}, "answer": "b", "explanation": "Existentialism flourished precisely because optimism was at its lowest and despair pervaded many European societies after the Depression and WWII — it addressed real concerns of loneliness, death, and meaninglessness that abstract philosophy had ignored."}, {"question": "Karl Marx's famous declaration — 'The point is to change the world' — represents a critique of:", "options": {"a": "Scientific positivism that ignores social reality", "b": "Religious philosophy that promises change only in the afterlife", "c": "Pure philosophical theorising and abstraction that merely interprets without transforming", "d": "Existentialism's focus on individual meaning"}, "answer": "c", "explanation": "Marx's statement is a critique of philosophy that only interprets or theorises about the world; Marxism insists that genuine philosophy must orient itself toward practical transformation of social reality."}, {"question": "Approximately how many people came under the influence of centrally planned economies inspired by Marxist thought following the 1917 Russian Revolution?", "options": {"a": "250 million", "b": "500 million", "c": "One billion", "d": "Close to two billion"}, "answer": "d", "explanation": "The text states that after the Russian Revolution of 1917, the rise of Mao Tse-tung, and the spread of communism in Eastern Europe, close to two billion people came under centrally planned economies inspired by Marxist thought."}, {"question": "The text claims that Marxist thought became the 'philosophy of decolonisation' in Africa because:", "options": {"a": "Marx wrote specifically about African colonial conditions", "b": "Marxian analysis demonstrated the connection between colonial expansion and economic exploitation", "c": "African socialist philosophers rejected all Western thought except Marx", "d": "The Soviet Union directly financed African independence movements"}, "answer": "b", "explanation": "African nationalists used Marxian ideas that demonstrated how colonial expansion was driven by economic exploitation, giving them both an analytical framework and a mobilising ideology for the anti-imperialist struggle."}, {"question": "J.I. Omoregbe's characterisation of philosophical theories as 'dynamites' conveys which idea?", "options": {"a": "Philosophy is dangerous and should be restricted to academics", "b": "Philosophical ideas are explosive forces of change, transformation, and development in society", "c": "Philosophy destroys traditional values and social cohesion", "d": "Only revolutionary philosophy has any practical impact"}, "answer": "b", "explanation": "Omoregbe uses the metaphor of 'dynamites' to convey that philosophical theories are powerful agents of change and social development — countering the misconception that philosophy has no practical influence on society."}, {"question": "Plato's admonition that 'until philosophers become kings...there will be no respite for humanity' most directly argues for:", "options": {"a": "The abolition of democracy in favour of meritocracy", "b": "The primacy of wisdom and philosophical reason in the exercise of political governance", "c": "The exclusion of non-philosophers from civic life", "d": "The superiority of theoretical knowledge over practical skills"}, "answer": "b", "explanation": "Plato's statement argues that good governance requires philosophical wisdom — those who govern must either be philosophers or become philosophical; without this, humanity will find no respite. This reinforces philosophy's role as an agent of social transformation."}, {"question": "The Anglo-Saxon analytic tradition's conception of philosophy is criticised in the text because it:", "options": {"a": "Ignores the contributions of non-Western philosophy", "b": "Reduces philosophy to analysis alone, treating analysis as an end rather than a means", "c": "Promotes an overly abstract and metaphysical view of philosophy", "d": "Aligns philosophy too closely with political ideology"}, "answer": "b", "explanation": "Omoregbe criticises the analytic tradition for lending credence to the misconception that philosophy is 'only analysis and no more, no less' — analysis is part of philosophy but only a means to an end, not philosophy's entire purpose."}]}];

function buildSessButtons() {
  var scroll = document.getElementById('sessScroll');
  scroll.innerHTML = '';
  SESSIONS.forEach(function(s, i) {
    var btn = document.createElement('button');
    btn.className = 'sess-btn' + (i === curSess ? ' active' : '');
    btn.id = 'sbtn' + i;
    btn.textContent = 'S' + s.session;
    btn.title = s.topic;
    btn.onclick = function() { goSession(i); };
    scroll.appendChild(btn);
  });
}

function goSession(idx) {
  curSess = idx;
  curPage = 0;
  qAnswers = {}; correct = 0; wrong = 0;
  document.querySelectorAll('.sess-btn').forEach(function(b, i) {
    b.className = 'sess-btn' + (i === idx ? ' active' : '');
  });
  document.getElementById('sumScreen').classList.remove('show');
  render();
  // Scroll button into view
  var btn = document.getElementById('sbtn' + idx);
  if (btn) btn.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

  qAnswers = {}; correct = 0; wrong = 0;
  document.getElementById('pointsTab').classList.toggle('active', m === 'points');
  document.getElementById('quizTab').classList.toggle('active', m === 'quiz');
  document.getElementById('sumScreen').classList.remove('show');
  render();
}

function totalItems() {
  return subMode === 'points' ? SESSIONS[curSess].points.length : SESSIONS[curSess].questions.length;
}
function totalPages() { return Math.ceil(totalItems() / pageSize); }
function pageItems() {
  var s = curPage * pageSize;
  var src = subMode === 'points' ? SESSIONS[curSess].points : SESSIONS[curSess].questions;
  return src.slice(s, s + pageSize);
}

function prevPage() {
  if (curPage > 0) { curPage--; window.scrollTo(0,0); render(); }
}

function nextPage() {
  var tp = totalPages();
  if (curPage < tp - 1) {
    curPage++; window.scrollTo(0,0); render();
  } else if (subMode === 'quiz') {
    showSummary();
  } else {
    // End of points — prompt to try quiz
    if (curSess < SESSIONS.length - 1 || subMode === 'points') {
      var msg = subMode === 'points'
        ? 'You have read all 30 key points! Ready to test yourself?'
        : '';
      if (subMode === 'points') {
        setSubMode('quiz');
      }
    }
  }
}

function answer(localIdx, chosen) {
  var q = SESSIONS[curSess].questions[localIdx];
  if (!q || qAnswers[localIdx] !== undefined) return;
  var ok = chosen === q.answer;
  qAnswers[localIdx] = {chosen: chosen, ok: ok};
  if (ok) correct++; else wrong++;
  var card = document.getElementById('qc' + localIdx);
  if (!card) return;
  card.querySelectorAll('.opt').forEach(function(opt) {
    opt.classList.add('answered');
    if (opt.dataset.l === q.answer) opt.classList.add('show-c');
    if (opt.dataset.l === chosen && !ok) opt.classList.add('sel-w');
  });
  var ex = card.querySelector('.rexpl');
  if (ex) {
    ex.textContent = (ok ? '✓ Correct — ' : '✗ Wrong — ') + esc(q.explanation || '');
    ex.className = 'rexpl ' + (ok ? 'rc' : 'rw');
  }
  updateScore();
}

function updateScore() {
  var total = Object.keys(qAnswers).length;
  document.getElementById('scoreTxt').innerHTML =
    '<span style="color:#16a34a;font-weight:700">' + correct + ' correct</span> &nbsp;' +
    '<span style="color:#dc2626;font-weight:700">' + wrong + ' wrong</span> &nbsp;' +
    '<span style="color:#71717a">' + total + '/30 answered</span>';
}

function showSummary() {
  document.getElementById('contentArea').innerHTML = '';
  document.getElementById('sumScreen').classList.add('show');
  var pct = Math.round((correct / 30) * 100);
  document.getElementById('sumScore').textContent = correct + '/30';
  document.getElementById('sumLbl').textContent =
    pct >= 80 ? 'Excellent! Session mastered.' :
    pct >= 60 ? 'Good progress. Review the points and try again.' :
    'Go back and read the 30 key points again before retrying.';
  document.getElementById('scoreTxt').textContent = pct + '% — ' + correct + '/30 correct';
  document.getElementById('pbar').style.width = '100%';
}

function retryQuiz() {
  qAnswers = {}; correct = 0; wrong = 0; curPage = 0;
  document.getElementById('sumScreen').classList.remove('show');
  render();
}

function nextSession() {
  if (curSess < SESSIONS.length - 1) goSession(curSess + 1);
  setSubMode('points');
}

function render() {
  if (!SESSIONS.length) return;
  var sess = SESSIONS[curSess];
  var tp = totalPages();
  var items = pageItems();
  var s = curPage * pageSize;
  var pct = ((curPage + 1) / tp) * 100;

  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('topInfo').textContent = 'S' + sess.session + ' · ' + (subMode === 'points' ? 'Points ' : 'Quiz ') + (curPage+1) + '/' + tp;
  document.getElementById('sessInfo').textContent = sess.topic;
  document.getElementById('prevBtn').style.opacity = curPage === 0 ? '0.3' : '1';

  var isLast = curPage >= tp - 1;
  var nextLbl = 'Next →';
  if (isLast) {
    nextLbl = subMode === 'points' ? 'Take Quiz →' : 'Finish →';
  }
  document.getElementById('nextBtn').textContent = nextLbl;

  if (subMode === 'quiz') {
    updateScore();
  } else {
    document.getElementById('scoreTxt').textContent = sess.topic;
  }

  var area = document.getElementById('contentArea');
  document.getElementById('sumScreen').classList.remove('show');
  area.innerHTML = '';

  if (subMode === 'points') {
    // Header only on first page
    if (curPage === 0) {
      var hdr = document.createElement('div');
      hdr.className = 'session-header';
      hdr.innerHTML =
        '<div class="session-title">Session ' + sess.session + ': ' + esc(sess.topic) + '</div>' +
        '<div class="session-sub">30 exam-critical points · master these to ace this topic</div>';
      area.appendChild(hdr);
    }

    items.forEach(function(pt, i) {
      var globalIdx = s + i;
      // Track seen
      if (!pointsSeen[curSess]) pointsSeen[curSess] = new Set();
      pointsSeen[curSess].add(globalIdx);

      var card = document.createElement('div');
      card.className = 'point-card';
      var numEl = document.createElement('div');
      numEl.className = 'point-num seen';
      numEl.textContent = globalIdx + 1;
      var txt = document.createElement('div');
      txt.className = 'point-text';
      txt.textContent = pt;
      card.appendChild(numEl);
      card.appendChild(txt);
      area.appendChild(card);
    });
  } else {
    items.forEach(function(q, i) {
      var localIdx = s + i;
      var card = document.createElement('div');
      card.className = 'q-card';
      card.id = 'qc' + localIdx;

      var html = '<div class="q-num">Q' + (localIdx+1) + ' of 30</div>';
      html += '<div class="q-text">' + esc(q.question) + '</div>';
      html += '<div class="opts">';
      ['a','b','c','d'].forEach(function(l) {
        if (!q.options[l]) return;
        var ans = qAnswers[localIdx];
        var cls = 'opt';
        if (ans) {
          cls += ' answered';
          if (l === q.answer) cls += ' show-c';
          if (ans.chosen === l && !ans.ok) cls += ' sel-w';
        }
        html += '<div class="' + cls + '" data-l="' + l + '" onclick="answer(' + localIdx + ',\'' + l + '\')">' +
          '<span class="opt-letter">' + l.toUpperCase() + '</span>' + esc(q.options[l]) + '</div>';
      });
      html += '</div>';
      var ans = qAnswers[localIdx];
      var ecls = 'rexpl', etxt = '';
      if (ans) {
        ecls += ans.ok ? ' rc' : ' rw';
        etxt = (ans.ok ? '✓ Correct — ' : '✗ Wrong — ') + esc(q.explanation || '');
      }
      html += '<div class="' + ecls + '">' + etxt + '</div>';

      card.innerHTML = html;
      area.appendChild(card);
    });
  }
}
</script>
</body>
</html>
