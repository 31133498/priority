is collection of data listed as a separate characteristic of scientific knowledge, distinct from mere observation?", "options": {"a": "Because data collection is cheaper than experimentation", "b": "Because observation alone is sufficient for establishing scientific laws", "c": "Because the way things are observed to behave may actually differ from how they truly behave", "d": "Because data collection is required only in the social sciences"}, "answer": "c", "explanation": "The session explains: 'It is often suspected and contended that the way things are observed to behave may actually be different from how they truly behave. This makes collection of facts for close scrutiny another important feature of science.'"}, {"question": "Which of the following is NOT mentioned in Session 12 as a basic characteristic that distinguishes scientific knowledge from other sorts of knowledge?", "options": {"a": "Observation of facts", "b": "Experimentation", "c": "Philosophical intuition", "d": "Collection of data"}, "answer": "c", "explanation": "The session lists observation of facts, collection of data, experimentation, and research as the basic characteristics distinguishing scientific knowledge. Philosophical intuition is not listed; it belongs to the domain of philosophy, not scientific method."}, {"question": "Research is defined in Session 12 as:", "options": {"a": "The application of pre-existing theories to new problems", "b": "Ongoing activity situated on a ground plan projected into an object sphere", "c": "A one-time laboratory experiment conducted under controlled conditions", "d": "The collection of bibliographic sources on a given topic"}, "answer": "b", "explanation": "The session defines research as 'ongoing activity situated on a ground plan projected into an object sphere,' drawing on Heidegger's formulation, and identifies it as the essence of science."}, {"question": "In science, the term 'rigour' specifically means:", "options": {"a": "Strict adherence to government-approved research protocols", "b": "The obligation to remain within the sphere opened up — tenaciously staying on course and in focus", "c": "Using only quantitative methods in research", "d": "Replicating experiments at least three times before publishing"}, "answer": "b", "explanation": "The session defines rigour precisely as 'the obligation to remain within the sphere opened up' and further explains it as 'tenaciously remaining on course, in focus.' It is through rigour that research achieves its objective of eliciting the truth of what is."}, {"question": "A scientific claim described as 'veridical' means that:", "options": {"a": "It has been verified by at least two independent laboratories", "b": "It is capable of being shown to be true or false", "c": "It has been published in a peer-reviewed journal", "d": "It is universally accepted by the scientific community"}, "answer": "b", "explanation": "The session states: 'another recognizable feature of a work of science is that its claims or assertions are veridical, that is, they are capable of being shown to be true or false.' Veridical refers to the falsifiability/verifiability of scientific claims."}, {"question": "Science is described in Session 12 as 'officialdom.' This means science is:", "options": {"a": "Controlled by government agencies and official bodies", "b": "Strict official position constructed on facts or evidence, with strict adherence to rules without recourse to sentiments", "c": "A formal academic discipline taught only in universities", "d": "An enterprise that requires official certification to practise"}, "answer": "b", "explanation": "The session explains: 'Science is strict official position constructed on facts or evidence. It is strict adherence to or insistence on rules without recourse to sentiments or extraneous considerations. Science is officialdom.'"}, {"question": "Which of the following disciplines would be EXCLUDED from the strict definition of science as used in Session 12?", "options": {"a": "Physics", "b": "Astronomy", "c": "Sociology", "d": "Chemistry"}, "answer": "c", "explanation": "The session states that science in this context refers to 'disciplines of a mathematical, physical, chemical and natural sorts' such as Mathematics, Physics, Chemistry, Astronomy, Biology. Social Sciences like Sociology are excluded because they lack rigour, laboratory experimentation, and exactness."}, {"question": "The primary reason given in Session 12 for studying the History and Philosophy of Science is:", "options": {"a": "To memorise the biographies of famous scientists", "b": "To acquaint scholars with developments in the enterprise so they can purposively partake of the opportunities offered by the scientific outlook", "c": "To satisfy the requirements of a university degree programme", "d": "To demonstrate the superiority of Western science over other knowledge systems"}, "answer": "b", "explanation": "The session argues it is necessary to study History and Philosophy of Science so that 'we can acquaint ourselves with developments in the enterprise with a view to availing ourselves of the opportunities offered by the scientific outlook' and because 'it is only when we have adequate understanding of when and how something came about and what it promises could we purposively partake of it.'"}, {"question": "Scientific activities are produced primarily and mainly by:", "options": {"a": "Government funding and institutional support", "b": "Laboratory equipment and advanced technology", "c": "A hunch — the feeling upon observation of facts that something might be the case", "d": "Formal education in scientific disciplines"}, "answer": "c", "explanation": "The session is explicit: 'What produces scientific activities is, primarily and mainly, a hunch, that is, the feeling (upon observation of facts) that something might be the case.' This hunch sparks curiosity and gives impetus to scientific investigation."}, {"question": "Which condition, beyond intellectual capacity and the urge to know, is described in Session 12 as essential for the emergence of a science culture?", "options": {"a": "Access to international journals and databases", "b": "A conducive social and political climate that ensures continuity and consistency of policy", "c": "The presence of a strong religious tradition that values learning", "d": "Economic prosperity and a large middle class"}, "answer": "b", "explanation": "The session states: 'You need, also, for the emergence of a scientific way of life a conducive social and political climate. You need a social and political environment that ensures continuity and consistency of policy positions such that research proposals are not tied to the vagaries of changing political fortunes.'"}, {"question": "According to Sandra Harding, science and knowledge are always:", "options": {"a": "Objective and free from social influence", "b": "Deeply permeated by value commitments and the social relations through which they come into existence", "c": "Products of individual genius operating independently of society", "d": "Valid only when subjected to peer review"}, "answer": "b", "explanation": "The session quotes Harding directly: 'science and knowledge will always be deeply permeated by value commitments and the social relations through which they come into existence.' This is central to her feminist philosophy of science."}, {"question": "Sandra Harding's recommendation that we must 'reinvent science' was made in the context of:", "options": {"a": "Improving laboratory safety standards", "b": "Making sense of our social experience and integrating emancipatory values into scientific practice", "c": "Developing new mathematical frameworks for quantum physics", "d": "Replacing Western science with indigenous knowledge systems"}, "answer": "b", "explanation": "The session notes that 'Sandra Harding thinks that we would have to reinvent science (of the latter sort) in order to make sense of our social experience,' and this is linked to the argument that humanities and social sciences 'that extol emancipatory, liberatory and democratic values' must develop alongside the natural sciences."}, {"question": "The Pedestrian Method of presenting philosophy of science is criticised primarily because:", "options": {"a": "It relies too heavily on ancient Greek philosophy", "b": "It discusses scientific topics without showing what is philosophical about them, making the enterprise accessible to anyone regardless of philosophical training", "c": "It focuses exclusively on Western science and ignores African contributions", "d": "It is too abstract and difficult for students to understand"}, "answer": "b", "explanation": "The session criticises the Pedestrian Method for discussing topics like measurement, electrons, and notable scientists 'without a hint as to how these scientific exploits generated philosophical problems.' This makes it 'threadbare, barren, pedestrian' — an 'all-comers affair' where even 'an accountant is competent to teach philosophy of science.'"}, {"question": "Why is the 'anything goes' attitude to philosophy described in Session 12 as no longer tenable?", "options": {"a": "Because modern philosophy has become too specialised for general audiences", "b": "Because centuries of dismemberment of philosophy into independent disciplines have left each with its own object sphere and exclusive functions", "c": "Because scientific progress has made philosophical generalism obsolete", "d": "Because African philosophy requires a distinct methodological framework"}, "answer": "b", "explanation": "The session argues that the traditional 'anything goes' attitude to philosophy can no longer hold after centuries of the dismemberment of philosophy into independent disciplines, each with its own object sphere and exclusive functions."}, {"question": "The Critical Method of presenting philosophy of science is also referred to as:", "options": {"a": "Hermeneutics", "b": "Phenomenology", "c": "Meta-science or meta-scientific inquiry", "d": "Dialectical materialism"}, "answer": "c", "explanation": "The session states: 'The critical question concerning the procedure of human reason in scientific research, for example, is not science but meta-science, and as such qualifies to be called philosophical.' The Critical Method is described as 'meta science or meta scientific inquiries of the methodology of science.'"}, {"question": "Under the Critical Method, who can legitimately engage in philosophy of science?", "options": {"a": "Only trained philosophers with a doctorate in philosophy", "b": "Only working scientists with laboratory experience", "c": "Both trained philosophers and trained scientists, since the scientist is also compelled to critique his methods", "d": "Only historians of science who specialise in intellectual history"}, "answer": "c", "explanation": "The session notes that under the Critical Method, 'a working scientist, at some point, would be compelled to critique his method and basic assumptions. This makes philosophy of science an enterprise that is open to two sorts of people — the trained philosopher and the trained scientist.'"}, {"question": "According to Session 12, what typically happens when trained scientists abandon research to engage in philosophical criticism of method?", "options": {"a": "They produce ground-breaking philosophical theories", "b": "They return to the laboratory with renewed insight", "c": "They never return to the laboratory, depriving humankind of their fact-finding work", "d": "They become science administrators and policy makers"}, "answer": "c", "explanation": "The session states: 'experience shows that trained scientists — mathematicians, biologists, chemists, physicists — who abandoned research and laboratory experiments to deal with the philosophical problems of method and basic assumptions never returned to their primary duty posts. For, as soon as they enter the exciting philosophical arena of controversy... they never remember to return to the laboratory.' Rene Weber's Dialogues with Scientists and Sages is cited on this point."}, {"question": "The Original Philosophical Method of presenting philosophy of science heeds the call of which philosopher to 'go back to the things themselves'?", "options": {"a": "Immanuel Kant", "b": "Edmund Husserl", "c": "Karl Popper", "d": "Georg Wilhelm Friedrich Hegel"}, "answer": "b", "explanation": "The Original Philosophical Method requires heeding Husserl's call to go back to the things themselves — returning to the etymology of philosophy and the core areas that define its exclusive functions."}, {"question": "The Greek etymological combination 'Philein Sophia' translates as:", "options": {"a": "Friend of truth", "b": "Lover of knowledge", "c": "Love of wisdom", "d": "Seeker of facts"}, "answer": "c", "explanation": "The session explicitly states: 'the Greek etymological combination for philosophy is Philein Sophia, \"love of wisdom.\"' This etymology is central to the Original Philosophical Method's approach to philosophy of science."}, {"question": "The three core areas of philosophy identified in Session 12 are:", "options": {"a": "Logic, rhetoric, and aesthetics", "b": "Metaphysics, epistemology, and ethics", "c": "Ontology, phenomenology, and hermeneutics", "d": "Politics, economics, and history"}, "answer": "b", "explanation": "The session states: 'philosophy is sometimes, perhaps, less controversially defined in terms of its core areas of metaphysics, epistemology and ethics.' It further defines metaphysics as the study of reality, epistemology as the study or theory of knowledge, and ethics as the study of the norms of moral behaviour."}, {"question": "Why is the philosopher described as indispensable in the realm of science, according to the Original Philosophical Method?", "options": {"a": "Because philosophers have superior mathematical skills", "b": "Because only philosophers can communicate scientific findings to the public", "c": "Because the scientist lacks wisdom — generated only by the philosopher through pure reason — to guide the knowledge of facts he produces", "d": "Because philosophy provides funding and institutional legitimacy to scientific research"}, "answer": "c", "explanation": "The session argues: 'This wisdom which the philosopher alone generates through the exercise of the power of pure reason or transcendence is not available to the trained scientist. Consequently, the scientist is not equipped to guide and guard what he produces — knowledge of facts, of what is true or false — with wisdom. This privation on the part of science makes the philosopher, the custodian of wisdom, indispensable.'"}, {"question": "Wisdom, as defined in Session 12 citing Ruch and Anyanwu, consists of:", "options": {"a": "Mastery of all known scientific disciplines", "b": "Making judicious balance of intuitive and discursive interpretations of our experience of being and of beings", "c": "Strict adherence to the rules of formal logic", "d": "Knowledge of moral codes across different cultural traditions"}, "answer": "b", "explanation": "The session quotes Ruch and Anyanwu's African Philosophy: 'Wisdom consists in making judicious balance of intuitive and discursive interpretations of our experience of being and of beings.' This wisdom is what distinguishes the philosopher's contribution from the scientist's."}, {"question": "A genuine, original philosophy of science under the Original Philosophical Method requires a philosopher to:", "options": {"a": "Translate scientific findings into accessible language for policymakers", "b": "Inject a priori metaphysical, epistemological, or ethical notions into science to elevate its empirical content to necessary, universal truth", "c": "Conduct independent laboratory experiments to verify scientific claims", "d": "Teach the history of science as a separate course from philosophy"}, "answer": "b", "explanation": "The session states: 'a genuine philosophy of science is one wherein a trained philosopher injects his a priori metaphysical, epistemological or ethical notions into science with a view to elevating its empirical content to the rank of necessary, universal, truth.' This is the defining criterion of the Original Philosophical Method."}, {"question": "Science becomes 'originally, truly and radically philosophical' according to Session 12 if and only if:", "options": {"a": "It is taught in a philosophy faculty rather than a science faculty", "b": "Scientists adopt the Socratic method of questioning", "c": "A philosopher's orientation in metaphysics, epistemology, or ethics — or a combination — informs the relevant science", "d": "Scientific findings are subjected to public debate and democratic scrutiny"}, "answer": "c", "explanation": "The session concludes: 'science or any discipline becomes originally, truly and radically philosophical if and only if a philosopher's orientation in metaphysics or epistemology or ethics or a combination of same informs the relevant science or discipline.' This is the core principle of the Original Philosophical Method."}, {"question": "The session cites the great traditions of philosophers — Plato, Aristotle, Kant, Hegel, Heidegger, Russell, and Popper — in order to:", "options": {"a": "Argue that philosophy is superior to science historically", "b": "Support the proposition that a philosopher in science must be metaphysicizing, epistemologizing, or ethicizing", "c": "Show that all major philosophers were also scientists", "d": "Demonstrate that African philosophy has been excluded from mainstream discourse"}, "answer": "b", "explanation": "The session states: 'a philosopher in the realm of science, if he is to be true to his calling, is either metaphysicizing, epistemologizing or ethicizing science. This proposition holds good for the philosophy of any discipline whatsoever. Our assertion is supported by the great traditions in philosophy such as the works of Plato, Aristotle, Kant, Hegel, Heidegger, Russell, and Popper.'"}]}, {"session": 13, "topic": "The History and Method of Science", "points": ["Western science began among Greek philosophers of the 6th–5th centuries B.C. on the coast and islands of the Eastern Mediterranean; their works survive only through fragments, references, and brief quotations made by later authors.", "Thales of Miletus, the earliest Greek philosopher in recorded history, proposed that water is the ultimate constituent of the universe; Empedocles (500–440 B.C.) held that 'love and strife' are the ultimate principles of the cosmos.", "Pythagoras (c. 530 B.C.) founded Pythagoreanism, an explicitly religious tradition that sought the master-key to universal harmony through mathematics, construing the personality of numbers as an ordered array of dots.", "Parmenides (c. 500 B.C.) and Zeno (c. 490 B.C.) argued for the unchanging unity of all things; Zeno's paradoxes of motion present a challenge that has lingered into contemporary times.", "Plato (429–347 B.C.) argued in the Republic that geometry prepares the mind for dialectics about the world of forms, and that genuine scientific knowledge is attained through intellectual apprehension of ideal entities—not sensory perception.", "Aristotle (384–322 B.C.) founded the Lyceum, created a biological science and taxonomy, made major contributions to logic, physics, and political theory, and established the scholarly method of defining a subject area, critically dialoguing with predecessors, and then developing arguments through reason and experience.", "The Hellenistic Age (323–30 B.C.), centred on the Library of Alexandria, produced notable mathematicians—Euclid (330–275 B.C.), Archimedes (287–212 B.C.), Apollonius (260–200 B.C.)—and astronomer Hipparchus (190–120 B.C.), and saw the early seeds of alchemy develop from Egyptian attempts to rationalise chemical change with Aristotelian theories.", "The Library of Alexandria was destroyed in 624 A.D. when Muslims under Caliph Omar conquered Alexandria; the Caliph justified the act by arguing that books agreeing with the Koran were useless and those disagreeing were pernicious and should be destroyed.", "Rome, despite its sophistication in law, warfare, and public hygiene, failed to produce a scientist of note; the two able scientists under Emperor Marcus Aurelius—Galen of Pergamon (medicine, anatomy, physiology) and Ptolemy of Alexandria (mathematical astronomy)—were both Greeks.", "In the Dark and Middle Ages (642–1453), Aristotelianism was the dominant Weltanschauung; the 13th century saw St. Thomas Aquinas (1226–1274) and the experimentally-minded Franciscan friar Roger Bacon (1214–1294), who worked mainly on optics, though religion tended to obstruct science while philosophy served as its handmaiden.", "Islamic civilization made crucial contributions to Western science: Arab leaders of Baghdad in the 9th century had the bulk of Greek science translated into Arabic, and their scholars advanced especially in mathematics, astronomy, optics, chemistry, and medicine.", "Jabir ibn Hayyan (late 8th century A.D.) was the first adumbrator of the phlogiston theory; Geber (9th century), the 'father of Arabian alchemy,' advanced chemical methods including evaporation, filtration, sublimation, distillation, and crystallisation, and prepared tetraoxosulphate (VI) and trioxonitrate (IV) acids.", "Ibn-al-Hazen (965–1038) gave the first correct explanation of vision—that ocular vision is achieved by something passing from the object into the eye—and worked on lens optics; Al-Kindi (800–873) worked on refraction of light; Al-Khawarizmi wrote a treatise on algebra that introduced modern numerical notation into Western Europe.", "The words 'alcohol' and 'algebra' are of Arabic origin; the Arabic numeral system (nine digits in a place-value system) was of Indian origin but transmitted to Europe through Islamic civilisation; Avicenna (980–1037) and Averroes (1126–1198) speculated on metaphysics and science within Platonism and Aristotelianism respectively.", "China's three inventions seen by Francis Bacon as crucial for European transformation were the magnetic compass, gunpowder, and the printing press; China failed to break through to modern science because its philosophy of nature relied on organic analogies, lacked abstract logic and mathematics, and its bureaucracy distrusted innovation.", "The Renaissance (1452–1600) saw learning move back from monasteries to universities; its three catalysts for the rebirth of science were: the discovery of man and nature in Italy; growth in mining, metallurgy, and Gutenberg's printing press in Germany; and trans-oceanic explorations by Spain and Portugal that created new demands on astronomy and mathematics.", "Copernicus (1473–1543) inaugurated the Copernican Revolution in De Revolutionibus Orbium Coelestrum (1543) by replacing the geocentric theory (earth at the centre, consistent with Church teaching) with the heliocentric theory (earth rotates on its axis and revolves around the sun).", "Galileo Galilei (1564–1641), founder of the science of dynamics, established the law of falling bodies (all objects fall at the same rate in a vacuum regardless of mass), demolishing Aristotle's theory; he was persecuted by the Inquisition in 1616 and 1633 for supporting Copernicus and using the telescope.", "Isaac Newton (1642–1727) formulated the law of universal gravitation in The Mathematical Principles of Natural Philosophy: every body attracts every other body with a force directly proportional to their masses and inversely proportional to the square of the distance between them; he also analysed white light into its spectral components.", "The Industrial Revolution (beginning in Britain c. 1760) was an indirect catalyst for scientific research; industrial chemistry, thermodynamics, and engineering greatly benefited; after the French Revolution, France (Laplace, Lagrange, Lavoisier, Carnot) dominated the scientific world and the Ecole Polytechnique was founded.", "Lavoisier replaced the phlogiston theory with the oxygen theory, inaugurating the chemical revolution; Mendeleev (1834–1907) invented the modern Periodic Table; Dalton's atomic theory held that all matter consists of small, indivisible, indestructible particles called atoms; Mendel (1822–1884) discovered the laws of inheritance of characteristics.", "The 19th century witnessed Darwin's theory of natural selection/evolution (1859), which unified biology, philosophy, and geology but clashed with theology; Louis Pasteur established the microbiological origin of disease; Theodore Schwann identified the cellular structure of organisms; physicists Oersted, Faraday, Helmholtz, and Maxwell contributed to the theory of energy conversion and conservation.", "Einstein's Special Theory of Relativity (1905) and General Theory (1916) resolved anomalies in Newtonian physics: Einstein showed there is no universal 'now' (only 'here and now' for each observer), that space and time are inextricably interwoven as a single four-dimensional reality, and established E=mc2, revealing the enormous energy latent in matter.", "The Michelson-Morley experiment (1886, repeated until 1904) found no ether-shift, undermining the Newtonian assumption of a universal frame of reference and directly prompting the theoretical discussions leading to Einstein's relativity theory.", "Max Planck (1850–1947) discovered in 1900 that matter emits energy in discrete packets (quanta), not a continuous stream; Werner Heisenberg (1901–1976) formalised the principle of indeterminacy (1927), stating it is impossible to measure both the position and velocity of a subatomic particle simultaneously with complete precision.", "Scientific research does not begin with mere observation but with a felt problem or difficulty; a preliminary hypothesis is formulated based on background knowledge, additional facts are collected, and the dialectical interplay between hypotheses and facts progresses until a satisfactory explanatory theory is developed—as illustrated by Roentgen's discovery of X-rays.", "Scientific observation is always theory-laden: theory guides observation in three ways—by indicating what kinds of items exist, what equipment is appropriate for observing them, and how to interpret the data; as instruments improve, entities once deemed unobservable (atoms, electrons) become observable.", "Scientific objectivity is not the psychological detachment of the individual scientist; rather, it is the social and public character of science and its institutions that imposes mental discipline and preserves objectivity through inter-subjective, experimentally justifiable interpretative procedures—described as a trialogue between the scientist, his theory, and nature.", "Popper's falsificationism holds that a theory is scientific only if it is testable (refutable) in principle; bold theories that survive severe testing are 'corroborated' rather than proven; Popper prefers increasing verisimilitude (likeness to truth) over certainty; his model is criticised for not providing an unambiguous algorithm for deciding when a theory is actually falsified.", "Kuhn argued that science develops through phases: pre-paradigm theoretical anarchy → normal science (puzzle-solving within a disciplinary matrix comprising symbolic generalisations, models, and exemplars) → anomaly → crisis → scientific revolution (paradigm shift); Feyerabend's anarchist 'anything goes' methodology rejected all fixed methodological rules and advocated the principle of proliferation of competing theories."], "questions": [{"question": "Which pre-Socratic Greek philosopher held that 'love and strife' are the ultimate principles of the universe?", "options": {"a": "Thales of Miletus", "b": "Empedocles", "c": "Parmenides", "d": "Pythagoras"}, "answer": "b", "explanation": "Empedocles (500–440 B.C.) proposed 'love and strife' as the ultimate principles. Thales held that all is water; Parmenides argued for the unchanging unity of all things; Pythagoras focused on number and harmony."}, {"question": "Plato's argument in the Republic that geometry prepares the mind for dialectics implies which view of scientific knowledge?", "options": {"a": "Genuine scientific knowledge comes from controlled empirical experiments on observable phenomena", "b": "Scientific knowledge is derived through inductive accumulation of sensory facts", "c": "Scientific knowledge is attained through intellectual apprehension of ideal entities in the world of forms", "d": "Scientific knowledge requires both mathematical reasoning and biological observation equally"}, "answer": "c", "explanation": "Plato held that perceptible things are mere images of real ideas (forms). Geometry trains the mind for the higher discourse of dialectics, which leads to the intellectual apprehension of ideal, non-sensory entities."}, {"question": "Caliph Omar justified destroying the Library of Alexandria on the grounds that books agreeing with the Koran were useless while books disagreeing were pernicious. What does this episode illustrate about the relationship between religion and science?", "options": {"a": "Islamic civilisation was uniformly hostile to scientific knowledge throughout history", "b": "Religious authority can become a powerful force that sets back scientific progress when it refuses to allow knowledge beyond its texts", "c": "The Greeks had misled the world with their scientific writings and Omar was correct to destroy them", "d": "Libraries are irrelevant to scientific progress since knowledge can be reconstructed independently"}, "answer": "b", "explanation": "The text describes this destruction as causing a 'terrible, though temporary, set-back' to science. It illustrates how doctrinal religious authority that does not tolerate alternative knowledge can impede the cumulative transmission of scientific progress."}, {"question": "Why did Rome, despite its sophisticated civilisation, fail to produce any notable scientist?", "options": {"a": "Rome lacked access to Greek scientific texts and had no contact with Hellenistic scholars", "b": "Roman religion prohibited inquiry into natural phenomena on pain of death", "c": "Rome considered science fit only for casual speculation and practical technique, and its social structure—with slavery and attachment to magic—left no room for disciplined scientific inquiry", "d": "All Roman intellectuals emigrated to Alexandria before they could contribute to science in Rome"}, "answer": "c", "explanation": "The text states Romans discussed science seriously only in connection with ethical philosophies (Stoicism, Epicureanism) and speculates that slavery, lack of social mobility, and attachment to magic prevented the appreciation of disciplined scientific inquiry."}, {"question": "Which of the following pairs correctly matches an Islamic scholar with his specific scientific contribution?", "options": {"a": "Avicenna — explained vision as something passing from the object into the eye", "b": "Al-Khawarizmi — advanced chemical methods including distillation and crystallisation", "c": "Geber — fathered Arabian alchemy and improved methods of evaporation, filtration, sublimation, melting, distillation, and crystallisation", "d": "Al-Kindi — gave the first correct explanation of the act of vision using lens optics"}, "answer": "c", "explanation": "Geber (9th century) is called the father of Arabian alchemy and advanced these specific chemical methods. Ibn-al-Hazen explained vision; Al-Kindi worked on refraction of light; Al-Khawarizmi wrote on algebra."}, {"question": "The text states that China did not achieve the breakthrough in modern science that Europe did. Which reason is explicitly given in the text?", "options": {"a": "China had no tradition of philosophical inquiry", "b": "Chinese civilisation deliberately rejected all foreign scientific knowledge", "c": "Chinese philosophy of nature was based on organic analogies and did not produce the abstract logic and mathematics needed as the language of science, and bureaucracy stifled innovation", "d": "China lacked the natural resources needed to support scientific experimentation"}, "answer": "c", "explanation": "The text explicitly gives two reasons: (1) Chinese philosophy relied on organic analogies without abstract logic and mathematics, and (2) China paid too much attention to stability and bureaucracy, distrusting the merchant class, making innovation difficult."}, {"question": "Copernicus's De Revolutionibus Orbium Coelestrum (1543) is described as revolutionary because it:", "options": {"a": "Proved mathematically that the moon orbits the earth using telescope observations", "b": "Removed the earth from the centre of the universe and reduced it to the status of a body revolving around the sun", "c": "Replaced Aristotelian physics with a new theory of motion based on experiment", "d": "Established the law of universal gravitation that explains planetary motion"}, "answer": "b", "explanation": "The Copernican Revolution replaced geocentrism (earth at centre, which agreed with Church teaching) with heliocentrism (earth moves around the sun). This also undermined the theological pre-eminence of man by removing earth's central status."}, {"question": "Galileo's law of falling bodies directly discredited which claim made by Aristotle?", "options": {"a": "That the sun, not the earth, is at the centre of the universe", "b": "That projectiles travel in a straight line until their 'impetus' is exhausted", "c": "That heavier objects fall faster than lighter objects", "d": "That the planets move in perfect circular orbits around the earth"}, "answer": "c", "explanation": "Aristotle had supposed that heavy objects fall quicker than light objects. Galileo demonstrated at the Leaning Tower of Pisa that all objects fall at the same rate in a vacuum, making Aristotle's theory of falling bodies discredited."}, {"question": "Newton's law of universal gravitation states that the force between two bodies is:", "options": {"a": "Directly proportional to the square of their masses and inversely proportional to their distance", "b": "Directly proportional to their masses and inversely proportional to the square of the distance between them", "c": "Inversely proportional to their masses and directly proportional to the square of their distance", "d": "Directly proportional to their masses and directly proportional to their distance"}, "answer": "b", "explanation": "Newton's law states the force is F ∝ m1×m2 / r². The force increases with mass but decreases as the square of the distance grows. This law explained tidal phenomena, planetary motion, satellite orbits, and comets."}, {"question": "Which of the following correctly identifies a contribution Lavoisier made to chemistry in the 18th century?", "options": {"a": "He invented the modern Periodic Table of elements", "b": "He proposed the atomic theory that matter consists of indivisible particles", "c": "He replaced the phlogiston theory with the oxygen theory, inaugurating the chemical revolution", "d": "He discovered the microbiological origin of disease through controlled experiments"}, "answer": "c", "explanation": "Lavoisier replaced the phlogiston theory (which explained combustion as the release of a substance called phlogiston) with the oxygen theory. Mendeleev invented the Periodic Table; Dalton proposed atomic theory; Pasteur discovered the microbial origin of disease."}, {"question": "Darwin's theory of evolution (1859) clashed with theology primarily because:", "options": {"a": "It proposed that the universe was billions rather than thousands of years old", "b": "It tended to jettison the 'divine plan' as a causative agent in the evolutionary process", "c": "It suggested that humans evolved from lower primates rather than from a divine creation", "d": "It argued that the Bible's account of Noah's flood was geologically impossible"}, "answer": "b", "explanation": "The text states Darwin's theory 'clashed with theology because it tended to jettison the divine plan as a causative agent in the evolutionary process.' The mechanism of natural selection removed the need for supernatural direction of species development."}, {"question": "The Michelson-Morley experiment (1886) is significant in the history of science because:", "options": {"a": "It confirmed Newton's predictions about the speed of falling bodies", "b": "It proved that light travels faster than sound in all media", "c": "It found no ether-shift, undermining the Newtonian assumption of a universal frame of reference and prompting the theoretical discussions that led to Einstein's relativity", "d": "It demonstrated that planetary orbits are ellipses rather than circles"}, "answer": "c", "explanation": "Newtonian physics assumed a universal coordinate system in which measurable ether-shift would occur. Michelson and Morley, and repeated experiments until 1904, found no such shift, creating an anomaly that Einstein's relativity resolved."}, {"question": "Einstein's introduction of the 'fourth dimension' in the theory of relativity refers to:", "options": {"a": "The quantum realm of subatomic particles that operates differently from the macro world", "b": "Space-time — the fusion of the three spatial dimensions with time as a single unified reality", "c": "The gravitational field that bends light passing near massive objects", "d": "The energy dimension expressed by the equation E=mc2"}, "answer": "b", "explanation": "Einstein showed that space and time are 'inextricably interwoven, and are species of a single reality.' He introduced space-time as the fourth dimension alongside length, width, and height, discrediting the Newtonian notion of absolute time."}, {"question": "Heisenberg's principle of indeterminacy implies which philosophical consequence for scientific knowledge?", "options": {"a": "All scientific knowledge is relative to the observer's cultural framework", "b": "The behaviour of macro (large-scale) phenomena such as planets is fundamentally unpredictable", "c": "Every description of nature contains some basic and irremovable uncertainty, and the future of a subatomic particle cannot be predicted with complete certainty", "d": "Scientists must abandon the use of mathematical formalism in describing natural phenomena"}, "answer": "c", "explanation": "Heisenberg showed that measuring a particle's position precisely makes its velocity uncertain and vice versa. This means complete certainty about the present state of a subatomic particle—and therefore complete prediction of its future—is impossible in principle."}, {"question": "According to the text, scientific research correctly begins with:", "options": {"a": "Systematic observation of facts, gathering data before forming any hypothesis", "b": "A felt problem or difficulty in a practical or theoretical situation, since no inquiry can get underway without some difficulty being perceived", "c": "The formulation of a bold theory that can be tested against empirical evidence", "d": "A literature review of all existing knowledge in the relevant scientific field"}, "answer": "b", "explanation": "The text explicitly states that 'no scientific inquiry can even get underway until and unless some difficulty is felt in a practical or theoretical situation.' The idea that science starts with observation is described as a widespread but incorrect belief."}, {"question": "Roentgen's discovery of X-rays is used in the text to illustrate which specific feature of scientific method?", "options": {"a": "That scientific discoveries are made by pure accident independent of prior knowledge", "b": "That background knowledge enables a scientist to identify an anomaly as a significant problem and form a relevant preliminary hypothesis leading to systematic investigation", "c": "That experiments must always be reproduced by independent scientists before their results are accepted", "d": "That theoretical and practical concerns in science are always completely separate"}, "answer": "b", "explanation": "Roentgen noticed the glow of a barium platinocyanide screen and, because of his background knowledge about cathode rays, identified it as anomalous. He hypothesised a new form of radiation and systematically investigated, eventually discovering X-rays. Without prior knowledge, he would not have perceived the anomaly as significant."}, {"question": "The text states that 'the discovery of explanatory theories in science is a creative process which involves both imagination and knowledge always.' This claim is best illustrated by which feature of the scientific method described?", "options": {"a": "The use of probability calculus to calculate the likelihood that a theory is true", "b": "The requirement that all experiments be conducted under strictly controlled laboratory conditions", "c": "The process by which a scientist, having collected sufficient additional facts, must 'think things through' to formulate a satisfactory hypothesis that accounts for all available data", "d": "The requirement that scientific theories be reviewed by peer committees before publication"}, "answer": "c", "explanation": "The text compares this stage to a puzzle solver who has all the pieces but must put them together. The synthesis of initial facts, additional data, and preliminary hypotheses into a coherent explanatory theory requires both creative imagination and deep knowledge of the subject."}, {"question": "Scientific theory guides observation in three specific ways, according to the text. Which option correctly lists all three?", "options": {"a": "It predicts outcomes, selects the sample size, and determines statistical analysis methods", "b": "It indicates what kinds of items exist, what equipment is appropriate for observing them, and how to interpret the data from that equipment", "c": "It identifies the research question, sets experimental controls, and selects the methodology", "d": "It determines the laboratory setting, the timeframe, and the conditions of the experiment"}, "answer": "b", "explanation": "The text explicitly states that theory guides observation in three ways: (a) it indicates what kinds of items exist, (b) what kinds of equipment are appropriate for observing them, and (c) how to interpret the data from the equipment which aids scientific observation."}, {"question": "Karl Popper's concept of 'corroboration' in falsificationism means:", "options": {"a": "A theory has been proven to be absolutely true by accumulating sufficient confirmatory evidence", "b": "A theory has been shown to be highly probable through multiple repeated experiments", "c": "A theory has survived severe testing without being falsified, demonstrating its mettle without guaranteeing its truth", "d": "A theory has been accepted by the majority of scientists in a given discipline"}, "answer": "c", "explanation": "Popper held that theories can never be proven; they can only be corroborated (survived severe testing) or falsified (contradicted by experimental findings). Corroboration is not proof of truth but evidence of the theory's resilience. Science aims at verisimilitude, not certainty."}, {"question": "Popper's falsificationism is criticised in the text for which specific weakness?", "options": {"a": "It makes falsifiability too easy to achieve, allowing non-scientific theories to pass the demarcation criterion", "b": "It fails to account for the social nature of scientific knowledge", "c": "It cannot provide an unambiguous answer to when a scientific claim is successfully corroborated or falsified, since there is no theory-independent algorithm for this determination", "d": "It ignores the role of inductive reasoning in the daily practice of science"}, "answer": "c", "explanation": "The text notes that the decision whether a theory is corroborated or falsified depends on whether experimental outcomes are consistent with theoretical assumptions of observation—since scientists cannot agree on a theory-independent language of pure observation, they may legitimately disagree about whether a finding constitutes corroboration or falsification."}, {"question": "Kuhn's concept of 'normal science' is best described as:", "options": {"a": "Science conducted in everyday settings without specialised equipment", "b": "The ideal standard of scientific practice against which all actual science is measured", "c": "Puzzle-solving activity firmly based on a paradigm (disciplinary matrix), with the paradigm providing the framework for problems and problem-solutions accepted by a scientific community", "d": "Scientific research that employs strictly inductive methods of inquiry"}, "answer": "c", "explanation": "Kuhn defines normal science as research based on one or more past achievements (the paradigm) that the scientific community acknowledges as supplying the foundation for future practices. It is puzzle-solving within the paradigm's cognitive framework."}, {"question": "Which of the following is NOT listed as one of the three basic cognitive components of Kuhn's disciplinary matrix (paradigm)?", "options": {"a": "Symbolic generalisations such as f=ma or e=mc2", "b": "Models, such as depicting an atom as a miniature solar system", "c": "Exemplars: concrete problem-solutions accepted as templates for solving related problems", "d": "Methodological protocols: step-by-step rules specifying how experiments must be conducted"}, "answer": "d", "explanation": "Kuhn's disciplinary matrix comprises symbolic generalisations, models, and exemplars. Methodological protocols are not listed as one of the three components. Indeed, Kuhn's point is that the paradigm provides implicit rather than explicit algorithmic rules."}, {"question": "Feyerabend's 'principle of proliferation' as an alternative to Kuhn's 'principle of tenacity' holds that:", "options": {"a": "Scientists must tenaciously defend their theories against all objections until overwhelming evidence refutes them", "b": "The only way to ensure scientific progress is for scientists to generate many competing theories simultaneously rather than sticking to one paradigm", "c": "Scientific theories should be replaced immediately upon any falsifying evidence rather than being retained tenaciously", "d": "New scientific theories must be proliferated across different cultural and geographic contexts to be valid"}, "answer": "b", "explanation": "Feyerabend argued that both tenacity and proliferation are always co-present in science, but that proliferating competing theories—rather than tenaciously adhering to one paradigm as Kuhn suggested—is the engine of scientific progress."}, {"question": "The text's critique of Feyerabend's 'anything goes' anarchist methodology is that:", "options": {"a": "It is too logically rigorous for most practising scientists to follow", "b": "It wrongly puts outmoded superstitions and magical practices on the same level as modern science, ignoring science's proven track record of vastly expanding knowledge and transforming technology", "c": "It fails to acknowledge the role of social consensus in determining scientific truth", "d": "It does not allow for the possibility of scientific revolutions or paradigm shifts"}, "answer": "b", "explanation": "The text states that Feyerabend 'went too far by putting outmoded superstitions or magical practices on the same level with modern science.' It argues that science's methodological commitments to verification, coherence, and predictability are intimately connected with its relative success—which is not merely a product of ideological pressure."}, {"question": "Aristotle's scholarly method, as described in the text, involved which sequence of steps?", "options": {"a": "Observation → experimentation → theory formulation → peer review", "b": "Define the subject area and its problems, critically dialogue with predecessors, then proceed by reason and experience to develop his own argument", "c": "Formulate a hypothesis, gather data inductively, derive a law, and test predictions", "d": "Accept received wisdom from Plato, modify it based on observation, and publish results"}, "answer": "b", "explanation": "The text explicitly describes Aristotle's method: he would define the subject area and its problems, dialogue critically with predecessors (sometimes showing them naïve or incorrect), and then proceed by reason and experience to develop his own argument. This is described as a 'master of the scholarly method of investigation.'"}, {"question": "Max Planck's quantum hypothesis (1900) resolved a deadlock in physics that arose from trying to explain:", "options": {"a": "The elliptical orbits of planets that Newton's circular model could not fully account for", "b": "The radiation of energy from a red-hot black body, which the continuous-flow theory based on Newtonian principles failed to explain", "c": "The results of the Michelson-Morley experiment that showed no ether-shift", "d": "The behaviour of electrons in atomic orbits that contradicted classical electromagnetic theory"}, "answer": "b", "explanation": "The text states there was a 'deadlock as to the explanation of the radiation of energy from a red-hot black body according to the continuous-flow theory based on Newtonian principles.' Planck solved this by positing that energy is emitted in discrete quanta rather than continuously."}, {"question": "The text's account of scientific objectivity is most accurately captured by which statement?", "options": {"a": "Objectivity is achieved when the scientist completely removes personal bias through rigorous training and discipline", "b": "Objectivity in science rests entirely on the use of mathematical and statistical methods that are inherently value-free", "c": "Objectivity is fundamentally a social achievement—the public character of science and its institutions imposes mental discipline and preserves objectivity through inter-subjective procedures", "d": "Objectivity means that all scientific observations must be independently verifiable by any person regardless of training or background"}, "answer": "c", "explanation": "The text explicitly states (citing Popper) that 'neither the dryness nor the remoteness of the problems handled in science could prevent idiosyncratic factors from interfering with the individual scientist's beliefs. Rather, it is the social or public character of science and its institution which imposes a mental discipline on the scientist, and also preserves its objectivity.'"}, {"question": "During the medieval period, the dominant intellectual worldview in Europe was Aristotelianism. What does the text say about the medieval period's actual contribution to science?", "options": {"a": "The medieval period was completely sterile and made no contribution to the foundations of modern science", "b": "The medieval period was the golden age of science due to the influence of Islamic civilisation", "c": "Though earlier historians depicted it as pure dogmatism, increasing scholarship recognises that essential facts and principles of modern science owed greatly to the medieval period, even if its science was embryonic", "d": "The medieval period contributed mainly through theology's synthesis with Platonism, which provided the philosophical foundations for the Scientific Revolution"}, "answer": "c", "explanation": "The text notes that 'it is becoming increasingly accepted now, with more scholarship in the history of science, that some essential facts and principles of modern science owed greatly to the medieval period.' The medieval epoch is described as having embryonic science in a period when the distinction between techniques, theoretical science, and popular magic was unclear."}, {"question": "The Industrial Revolution's contribution to science was described as 'indirect at the outset' because:", "options": {"a": "The revolution was driven entirely by engineers rather than scientists, so science played no role", "b": "Industrial problems were initially beyond the capacity of existing scientific techniques, but attempts to solve them acted as a catalyst for scientific research and created an audience for further investigation", "c": "Science had to wait for the French Revolution to create the institutional support needed for scientific progress", "d": "The revolution undermined science by replacing educated craftsmen with unskilled factory workers"}, "answer": "b", "explanation": "The text states: 'though virtually all the problems that resulted from industrial practice were beyond the capacity of existing scientific techniques and theories of the time, there is little doubt that attempts to solve them acted as a catalyst for scientific research and provided audience for further investigation.' Thus the contribution was indirect."}, {"question": "How did Einstein's theory of relativity change the traditional concept of time as understood in Newtonian physics?", "options": {"a": "Einstein showed that time is an illusion and does not actually exist in the physical world", "b": "Einstein proved that time passes more slowly for objects moving at high speeds but is otherwise universal", "c": "Einstein demonstrated that there is no universal 'now'—closely spaced occurrences that appear in one sequence to observer A may appear in the opposite sequence to observer B, making the traditional notion of universal time sequence untenable", "d": "Einstein showed that time is cyclical rather than linear, repeating itself every few billion years"}, "answer": "c", "explanation": "Einstein found that comparing time in two different places requires sending a signal, which demands the passage of time, so there can be no universal 'now.' Closely spaced events can appear in different sequences to different observers. This discredited the traditional notion of time as a strict universal succession of before and after."}]}, {"session": 14, "topic": "Philosophy, Science and Technology", "points": ["Philosophy is derived from two Greek words — 'philo' (love) and 'Sophia' (wisdom) — literally meaning 'love of wisdom.'", "As an academic discipline, philosophy is a method of reflective thinking and reasoned inquiry that trains individuals to think through problems while facing all facts involved.", "According to J.I. Omoregbe, philosophy is essentially a reflective activity; to philosophize is to reflect on human experience in search of answers to fundamental questions, with human experience as the source of philosophical reflection.", "Stanley Honer defines philosophy as an activity undertaken by human beings deeply concerned about who they are and what everything means, and a philosopher as a person who perceives patterns of meaning in experiences and awareness of existence.", "C.B. Okolo defines philosophy as a form of critical inquiry into things and their causes, human experience, and man's role and prospects in it.", "Philosophy is regarded as the highest form of inquiry, involving no presuppositions and taking nothing for granted — it questions everything, including itself.", "Philosophers employ the tools of logic, ethics, epistemology, and metaphysics to construct a systematic, coherent, and consistent picture of all that we know and think.", "Philosophy is more than technical analysis of statements; it also attends to the relentless human effort to achieve an organized view of themselves and the universe, spanning economy, religion, and politics.", "In its general (wide) sense, science refers to any organized body of knowledge, and 'scientific thinking' means organized inquiry guided by laws of thought — making every academic discipline scientific in this sense.", "In its narrow (restricted) sense, science is confined to disciplines carried out through hypotheses, experiments, and verification using instruments in laboratories — classical examples include Chemistry, Biology, Physics, and Biochemistry.", "The Longman Dictionary defines science as the study of knowledge made into a system that depends on seeing and testing facts and stating general natural laws.", "S.S. Chauhan defines science as a systematized body of knowledge that may be verified at any time by any number of individuals under a given condition.", "Ordinary thinking differs from scientific thinking in that scientific thinking requires formal education and training, and is conducted by experts according to rules or laws of thought.", "The word 'technology' is derived from the Greek 'techne' (art or craft) and 'logos' (word, speech, study); it refers both to tools/artifacts that manipulate the environment and to the study of those artifacts.", "Technology first appeared in English in the 17th century meaning a discussion of applied arts only; by the early 20th century it embraced tools, machines, processes, and ideas; by mid-20th century it was defined as the means by which humans seek to change or manipulate their environment.", "Technology covers every aspect of human life — domestic (spoons, blenders, washing machines), industrial/commercial (pins, typewriters, machinery), and communication (radio, TV, computers, telephones).", "Technology is the application of scientific findings for the fabrication of gadgets and equipment; it is the knowledge and means used to produce the material needs of human beings.", "The discovery of the mariner's compass opened the way for exploration by land, sea, and air, brought different nations and cultures into greater contact, and enabled exchange of ideas for mutual benefit.", "The steam engine marked the beginning of the industrial revolution and automation; the introduction of railways facilitated transportation, increased productivity, and reduced costs of production.", "Electricity lights houses, pumps water, and refrigerates food; the telephone eliminated distance as a barrier to communication; radio and television keep society informed about current events and government activities.", "Science and technology have preserved rural life, particularly in developed countries, by improving amenities such as electricity, pipe-borne water, and medical facilities, reducing rural-to-urban migration.", "Biological sciences have a more far-reaching effect on humans than physical sciences because most basic human problems — including food production and health — are biological in nature.", "Medical science has relieved pain through antibiotics and anaesthetics, lengthened the human lifespan, enabled organ transplants (e.g., kidney), and facilitated family planning.", "Mechanized farming, use of fertilizers and insecticides, and controlled storage facilities have increased agricultural yields and ensured year-round food supply; Nigeria, as an agricultural country, stands to benefit greatly from mechanized farming.", "Science and technology have enabled weather forecasting and the construction of levees and embankments to protect against natural hazards such as floods and earthquakes.", "A key demerit of science and technology is the production of weapons like the AK47, which has increased casualties and contributed to child soldiers in war-ravaged countries, especially in Africa.", "The mariner's compass — a product of science — guided European powers to Africa, making it a tool of colonialism and imperialism against African states, illustrating the paradox of scientific discovery.", "Factory machinery increased industrial productivity but also compelled workers to work long hours under hazardous conditions; the telephone, while easing communication, has largely crippled individual initiative and independence.", "Television has transferred western values and civilization to Africa, reshaping African modes of thought and disrupting African traditions and value systems.", "Science and technology have produced weapons of mass destruction (hydrogen and atomic bombs) capable of destroying the world; modern medicine's success in extending life has led to over-population in some countries — almost every scientific discovery has both good and bad sides."], "questions": [{"question": "What is the literal meaning of the word 'philosophy' based on its Greek etymological roots?", "options": {"a": "Study of nature", "b": "Love of wisdom", "c": "Knowledge of truth", "d": "Science of reasoning"}, "answer": "b", "explanation": "Philosophy comes from 'philo' (love) and 'Sophia' (wisdom), meaning love of wisdom."}, {"question": "Which scholar defines philosophy as 'essentially a reflective activity' in which one reflects on human experience in search of answers to fundamental questions?", "options": {"a": "Stanley Honer", "b": "C.B. Okolo", "c": "J.I. Omoregbe", "d": "S.S. Chauhan"}, "answer": "c", "explanation": "J.I. Omoregbe specifically describes philosophy as essentially a reflective activity aimed at reflecting on human experience to answer fundamental questions."}, {"question": "According to Stanley Honer, a philosopher is best described as someone who:", "options": {"a": "Conducts laboratory experiments to verify knowledge", "b": "Analyzes the technical structure of language", "c": "Perceives patterns of meaning from the various experiences and awareness of existence", "d": "Specializes exclusively in logic and epistemology"}, "answer": "c", "explanation": "Honer defines a philosopher as a person who perceives in some measure the ways in which various experiences and awareness of existence form a pattern of meaning."}, {"question": "Which combination of tools do philosophers use to construct a systematic and coherent picture of reality?", "options": {"a": "Hypothesis, experiment, observation, and verification", "b": "Logic, ethics, epistemology, and metaphysics", "c": "Induction, deduction, abduction, and synthesis", "d": "Grammar, rhetoric, arithmetic, and geometry"}, "answer": "b", "explanation": "The session states that philosophers employ logic, ethics, epistemology, and metaphysics to construct a systematic, coherent, and consistent picture of all that we know and think."}, {"question": "Which feature most sharply distinguishes philosophy from science as a form of inquiry?", "options": {"a": "Philosophy uses reasoning while science uses observation", "b": "Philosophy is ancient while science is modern", "c": "Philosophy questions everything including itself and makes no presuppositions, while science builds on verifiable systematized knowledge", "d": "Science is broader in scope than philosophy"}, "answer": "c", "explanation": "Philosophy is regarded as the highest form of inquiry involving no presuppositions — it even questions itself — whereas science systematizes knowledge verifiable under given conditions."}, {"question": "In which sense of 'science' can every academic discipline be said to be scientific in its mode of inquiry?", "options": {"a": "The narrow sense", "b": "The restricted sense", "c": "The general (wide) sense", "d": "The experimental sense"}, "answer": "c", "explanation": "In the general sense, science refers to any organized body of knowledge, so every academic discipline qualifies as scientific in this sense."}, {"question": "What key requirement distinguishes science in the NARROW sense from science in the general sense?", "options": {"a": "It must be guided by laws of thought", "b": "It must use hypotheses, experiments, and laboratory verification", "c": "It must involve formal academic qualifications", "d": "It must deal with organized bodies of knowledge"}, "answer": "b", "explanation": "Science in the narrow sense is restricted to disciplines carried out through hypotheses, experiments, and verification using instruments, generally in laboratories."}, {"question": "According to S.S. Chauhan, what property makes scientific knowledge distinctly scientific?", "options": {"a": "It can only be verified by trained experts", "b": "It must be derived from laboratory experiments", "c": "It may be verified at any time by any number of individuals under a given condition", "d": "It must deal exclusively with natural phenomena"}, "answer": "c", "explanation": "Chauhan defines science as a systematized body of knowledge verifiable at any time by any number of individuals under a given condition — emphasizing universal verifiability."}, {"question": "The Greek word 'techne,' from which 'technology' is partly derived, means:", "options": {"a": "Word or speech", "b": "Tool or machine", "c": "Art or craft", "d": "Science or knowledge"}, "answer": "c", "explanation": "Technology derives from 'techne' (art or craft) and 'logos' (word/speech/study). 'Techne' specifically means art or craft."}, {"question": "Which pair correctly captures both interpretations of the concept of technology?", "options": {"a": "Ancient tools and modern machines", "b": "Tools and artifacts used to manipulate nature AND the study of those artifacts/tools", "c": "Industrial technology and domestic technology", "d": "Natural science and applied science"}, "answer": "b", "explanation": "Technology can mean the tools and artifacts humans use to manipulate the environment, or it can refer to the study of those artifacts and tools themselves."}, {"question": "When did the word 'technology' first appear in the English language?", "options": {"a": "15th century", "b": "16th century", "c": "17th century", "d": "18th century"}, "answer": "c", "explanation": "The session states that technology historically appeared first in English in the 17th century, initially used to mean a discussion of applied arts only."}, {"question": "How was 'technology' defined by the mid-20th century?", "options": {"a": "The scientific study of industrial arts", "b": "The branch of knowledge dealing with industrial methods", "c": "The means or activity by which human beings seek to change or manipulate their environment", "d": "A growing range of tools and machines used in production"}, "answer": "c", "explanation": "By mid-century, technology was defined by phrases such as 'the means or activity by which human beings seek to change or manipulate their environment.'"}, {"question": "Which of the following correctly describes the relationship between science and technology?", "options": {"a": "Technology is a branch of pure science", "b": "Science and technology are identical in method and purpose", "c": "Technology is the application of scientific findings for fabricating gadgets and equipment", "d": "Science studies what technology produces"}, "answer": "c", "explanation": "Technology is the knowledge and means used to produce material needs; it is the application of scientific findings for the fabrication of gadgets, equipment, etc."}, {"question": "What was the PRIMARY historical significance of the discovery of the mariner's compass?", "options": {"a": "It led directly to the industrial revolution", "b": "It opened the way for exploration and brought different nations and cultures into contact, enabling exchange of ideas", "c": "It made communication easier within continents", "d": "It laid the foundation for modern military technology"}, "answer": "b", "explanation": "The mariner's compass opened the way for exploration by land, sea, and air and brought different nations and cultures into greater contact, resulting in exchange of ideas for mutual benefit."}, {"question": "The session presents the mariner's compass as having a PARADOXICAL effect on Africa. What was this paradoxical effect?", "options": {"a": "It improved African trade routes but disrupted local fishing", "b": "While a scientific achievement, it guided European powers to Africa, facilitating colonialism and imperialism", "c": "It helped Africans explore other continents but brought western diseases", "d": "It increased African wealth but caused environmental damage"}, "answer": "b", "explanation": "The same compass that enabled exploration also guided European powers to Africa, making it an instrument of colonialism and imperialism — illustrating the paradox of scientific discoveries."}, {"question": "Which development is identified as marking the beginning of the industrial revolution and automation?", "options": {"a": "Discovery of electricity", "b": "Invention of the telephone", "c": "The age of the steam engine", "d": "Development of the mariner's compass"}, "answer": "c", "explanation": "The session explicitly states that the age of the steam engine marked the beginning of the industrial revolution and automation."}, {"question": "Why do biological sciences have a more far-reaching effect on human beings than physical sciences, according to the session?", "options": {"a": "Biological science has more advanced technology than physical science", "b": "Most basic human problems — food production, health — are biological in nature", "c": "Physical sciences only produce machines and tools, not medicines", "d": "Biological science has a longer history than physical science"}, "answer": "b", "explanation": "The session states that the influence of biological sciences is likely to have a more far-reaching effect because most basic problems of human beings are of a biological nature."}, {"question": "Which four areas of human endeavour does the session explicitly identify as having been impacted by science and technology (as given in the In-Text Answer)?", "options": {"a": "Education, law, religion, and politics", "b": "Agriculture, communication, health, and transportation", "c": "Industry, commerce, defence, and energy", "d": "Philosophy, science, art, and religion"}, "answer": "b", "explanation": "The session's In-Text Answer (ITAs 14.5.2) explicitly names agriculture, communication, health, and transportation as the four areas impacted by science and technology."}, {"question": "What notable DEMERIT of the telephone does the session highlight?", "options": {"a": "It makes communication too rapid for meaningful exchange", "b": "It has largely crippled individual initiative and independence", "c": "It is inaccessible to rural communities", "d": "It spreads misinformation at high speed"}, "answer": "b", "explanation": "The session notes that the telephone, while making communication easy, has to a large extent crippled initiative and independence — people seek direction from superiors for matters they could have resolved independently."}, {"question": "How has modern medicine's success paradoxically contributed to a social problem?", "options": {"a": "It has created mass dependence on pharmaceutical drugs", "b": "It has displaced traditional healers from their communities", "c": "By enabling longer life, it increased the aged population and contributed to over-population in some countries", "d": "It has made people neglect preventive health measures"}, "answer": "c", "explanation": "The session states that modern medicine has enabled mankind to live longer, increasing the percentage of the aged and in some countries leading to over-population."}, {"question": "The hydrogen bomb and atomic bomb are cited in the session as examples of:", "options": {"a": "Useful energy sources developed through nuclear science", "b": "Products of biological science", "c": "Weapons of mass destruction and annihilation capable of destroying the world", "d": "Technologies developed during the industrial revolution"}, "answer": "c", "explanation": "The session explicitly identifies hydrogen and atomic bombs as weapons of mass destruction and annihilation capable of destroying the world in a few hours."}, {"question": "What is the session's ultimate conclusion about the nature of science and technology?", "options": {"a": "Their benefits always outweigh their negative effects", "b": "They are fundamentally harmful and must be controlled", "c": "They are very good in many ways, but their applications may be either good or evil", "d": "Only developed countries derive genuine benefit from them"}, "answer": "c", "explanation": "The session concludes that science and technology are very good in a number of ways; however, their applications may be good or evil — capturing their paradoxical nature."}, {"question": "Nigeria is described in the session as principally:", "options": {"a": "An industrial country with a strong manufacturing base", "b": "An agricultural country blessed with natural vegetation, good soil, and a relatively predictable climate", "c": "A technologically advanced country in need of scientific reform", "d": "A country with poor natural resources that must rely on technology"}, "answer": "b", "explanation": "The session explicitly describes Nigeria as principally an agricultural country blessed with natural vegetation, good soil, and a relatively predictable climate."}, {"question": "The session argues that 'all wealth is created by human labour guided by education and acquired scientific skills' to make which specific point?", "options": {"a": "Developing nations should focus on expanding their education systems alone", "b": "Younger nations must direct energy and resources toward scientific and technological advancement to achieve a balanced economy", "c": "Human labour is inherently more valuable than technological investment", "d": "Wealthier countries simply have a more educated workforce"}, "answer": "b", "explanation": "This argument leads to the conclusion that younger nations of the world must take a cue from bigger nations and direct resources toward scientific and technological advancement to reach a balanced economy."}, {"question": "What negative consequence of television in Africa does the session identify?", "options": {"a": "Increased unemployment among local content producers", "b": "Reduction in agricultural productivity due to time wasted", "c": "Transfer of western values that reshapes African modes of thought and disrupts African traditions and value systems", "d": "Increased dependence on western technology for broadcasting"}, "answer": "c", "explanation": "Television has aided the transfer of western values and civilization to Africa, reshaping African modes of thought and leading to the disruption of African traditions and value systems."}, {"question": "How does the session characterize philosophy in relation to inquiry and presuppositions?", "options": {"a": "Philosophy accepts established truths as starting points for further inquiry", "b": "Philosophy is limited to questioning only scientific claims", "c": "Philosophy involves no presuppositions and questions everything, including itself", "d": "Philosophy presupposes the existence of God and the immortality of the soul"}, "answer": "c", "explanation": "The session states that philosophy is regarded as the highest form of inquiry that involves no presuppositions, not taking anything for granted, and even questions itself."}, {"question": "In what context does the session discuss fishing trawlers?", "options": {"a": "As a threat to coastal fishing communities and their livelihoods", "b": "As a cause of environmental destruction in the high seas", "c": "To illustrate how science and technology replaced manually paddled canoes, enabling longer sea operations and greater protein supply", "d": "As an example of industrialization causing unemployment among traditional fishermen"}, "answer": "c", "explanation": "The session mentions trawlers gradually replacing manually paddled canoes; equipped with storage and cold rooms, they operate for long periods, and catches are stored in refrigerators, ensuring fresh protein supply."}, {"question": "What specific demerit is attributed to the introduction of factory machines during the industrial revolution?", "options": {"a": "They caused widespread air and water pollution", "b": "They led to mass unemployment by replacing skilled workers", "c": "They compelled people to work in factories for long hours and under hazardous conditions", "d": "They made goods too expensive for average consumers"}, "answer": "c", "explanation": "The session notes that while machines brought about industrial revolution and productivity, they made people work in factories for long hours and under hazardous conditions."}, {"question": "According to the session, what role does science and technology play in protecting humans against natural hazards?", "options": {"a": "Science eliminates natural disasters entirely through prediction", "b": "Weather forecasting provides advance warning of cyclones, and building of levees and embankments helps contain flood waters", "c": "Technology allows humans to relocate away from disaster-prone areas", "d": "Scientific insurance schemes compensate victims of natural disasters"}, "answer": "b", "explanation": "The session states that weather forecasts provide advance warning of cyclones, and the building of levees or embankments along rivers to contain floodwaters has been evolved through the application of science and technology."}, {"question": "Which of the following BEST explains the 'paradoxical nature' of science and technology as presented in Session 14?", "options": {"a": "Science is inherently beneficial while technology is inherently harmful", "b": "Technology benefits developed nations while science benefits developing nations", "c": "Almost every discovery in science and technology has both beneficial and harmful sides, making moral value dependent on how they are applied", "d": "Science provides knowledge while technology creates danger"}, "answer": "c", "explanation": "The session repeatedly demonstrates that scientific and technological achievements — the compass, telephone, medicine, machines — carry both merits and demerits; the session concludes that applications of science and technology may be good or evil."}]}, {"session": 15, "topic": "Philosophy of Religion and General Review", "points": ["Philosophy is etymologically derived from two Greek words: 'philo' (love) and 'sophia' (wisdom), meaning 'love or pursuit of wisdom' — an attempt to acquire knowledge and satisfy curiosity through the pursuit of mental excellence.", "Allen Wood conceives philosophy as a self-reflective activity that cannot take its own nature for granted; he argues philosophers should renew the question 'What is philosophy?' to free the discipline from self-imposed shallowness.", "Socrates views philosophy as a reflective attitude that elevates contemplation and the search for universally valid knowledge; for Socrates, knowledge is virtue and ignorance is the root of moral evil, making knowledge an instrument of empowerment and liberation.", "Plato grounds philosophy in thinking and contemplation where the mind transcends to the world of Forms to grasp the essences (true natures) of things; he distinguishes knowledge from opinion (doxa) — opinion is hearsay expressible by anyone, while knowledge is critical, evidential, and anchored in ideas.", "Plato is correctly described as an objective idealist — the philosophical position that reality is located in the ideal world (the world of Forms) and possesses independent existence apart from human perception.", "Aristotle locates philosophy in the realm of praxis and designates metaphysics as 'first philosophy,' which studies being qua being — all things in regard to those aspects that pertain to their having being, irrespective of specific conditions.", "Bertrand Russell places philosophy between theology and science: like theology it speculates on matters where definite knowledge is unattainable, but like science it appeals to human reasoning rather than authority, tradition, or revelation.", "A.J. Ayer conceives philosophy as an activity of analysis; the existentialists, by contrast, reject mere analysis of propositions in favour of finding the meaning and purpose of life through human experience.", "The Ionians (early Greek cosmologists of Ephesus) focused on the cosmos and identified water, air, fire, and the infinite as candidate fundamental stuffs of reality, seeking the unity underlying apparent diversity and the continuity withi
