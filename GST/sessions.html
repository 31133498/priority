<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST 212 Sessions — ShazdTechBro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--white:#fff;--black:#0a0a0a;--g100:#f4f4f5;--g200:#e4e4e7;--g400:#a1a1aa;--g500:#71717a;--g700:#3f3f46;--green:#16a34a;--greenl:#f0fdf4;--red:#dc2626;--redl:#fef2f2;--blue:#2563eb;--bluel:#eff6ff;--amber:#d97706;--amberl:#fffbeb}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--black);min-height:100vh}

/* Topbar */
.topbar{position:fixed;top:0;left:0;right:0;background:var(--white);border-bottom:1px solid var(--g200);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;gap:8px}
.brand{font-size:13px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.brand span{font-weight:400;color:var(--g500)}
.nav-tabs{display:flex;background:var(--g100);border-radius:8px;padding:3px;gap:2px}
.nav-tab{padding:6px 12px;border-radius:6px;border:none;background:transparent;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--g500);transition:all .15s;white-space:nowrap;text-decoration:none;display:flex;align-items:center}
.nav-tab.active{background:var(--white);color:var(--black);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pbar-wrap{position:fixed;top:49px;left:0;right:0;height:3px;background:var(--g200);z-index:99}
.pbar-fill{height:100%;background:var(--black);transition:width .4s}

/* Session selector bar */
.sess-bar{position:fixed;top:52px;left:0;right:0;background:var(--white);border-bottom:1px solid var(--g200);z-index:98;padding:0}
.sess-scroll{display:flex;overflow-x:auto;padding:8px 16px;gap:6px;scrollbar-width:none}
.sess-scroll::-webkit-scrollbar{display:none}
.sess-btn{flex-shrink:0;padding:5px 11px;border-radius:20px;border:1.5px solid var(--g200);background:var(--white);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--g500);transition:all .15s;white-space:nowrap}
.sess-btn.active{background:var(--black);color:white;border-color:var(--black)}
.sess-btn.done{border-color:var(--green);color:var(--green)}
.sess-btn.done.active{background:var(--green);color:white;border-color:var(--green)}

/* Sub-mode tabs */
.sub-mode-bar{position:fixed;top:92px;left:0;right:0;background:var(--white);border-bottom:1px solid var(--g200);z-index:97;padding:6px 16px;display:flex;gap:6px;align-items:center;justify-content:space-between}
.sub-tabs{display:flex;background:var(--g100);border-radius:8px;padding:3px;gap:2px}
.sub-tab{padding:5px 14px;border-radius:6px;border:none;background:transparent;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--g500);transition:all .15s}
.sub-tab.active{background:var(--white);color:var(--black);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sess-info{font-size:11px;color:var(--g500);font-weight:500}

/* Main */
.main{padding:140px 16px 110px;max-width:720px;margin:0 auto}

/* Points view */
.session-header{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--g200)}
.session-title{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.session-sub{font-size:12px;color:var(--g500)}
.point-card{background:var(--white);border:1px solid var(--g200);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;animation:fu .18s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.point-num{width:24px;height:24px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--g500);flex-shrink:0;margin-top:1px}
.point-num.seen{background:var(--g700);color:white}
.point-text{font-size:14px;line-height:1.55;color:var(--black);font-weight:450}
.point-card:active{background:var(--g100)}

/* Quiz view */
.q-card{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:12px;animation:fu .2s ease}
.q-num{font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.q-text{font-size:15px;font-weight:500;color:var(--black);line-height:1.5;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--g200);font-size:13.5px;color:var(--g700);transition:all .1s;cursor:pointer}
.opt-letter{width:22px;height:22px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--g500);flex-shrink:0}
.opt:hover:not(.answered){border-color:var(--g400);background:var(--g100)}
.opt.show-c{border-color:var(--green);background:var(--greenl);color:var(--green);font-weight:600}
.opt.show-c .opt-letter{background:var(--green);color:white}
.opt.sel-w{border-color:var(--red);background:var(--redl);color:var(--red);font-weight:600}
.opt.sel-w .opt-letter{background:var(--red);color:white}
.rexpl{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.6;display:none}
.rexpl.rc{display:block;border-left:3px solid var(--green);background:var(--greenl);color:var(--green)}
.rexpl.rw{display:block;border-left:3px solid var(--red);background:var(--redl);color:var(--red)}

/* Score bar */
.score-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--g200);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100}
.score-txt{font-size:12px;color:var(--g500);font-weight:500}
.nav-btns{display:flex;gap:8px}
.nbtn{padding:9px 18px;border-radius:8px;border:1.5px solid var(--g200);background:var(--white);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--black);transition:all .15s}
.nbtn:hover{background:var(--g100)}
.nbtn.pri{background:var(--black);color:white;border-color:var(--black)}
.nbtn.pri:hover{opacity:.85}

/* Summary */
.sum{text-align:center;padding:40px 20px;display:none}
.sum.show{display:block}
.sum-score{font-size:58px;font-weight:800;letter-spacing:-3px;margin-bottom:4px}
.sum-lbl{font-size:13px;color:var(--g500);margin-bottom:20px}
.sum-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Progress ring on session buttons */
.done-all .sess-btn{border-color:var(--green)}

@media(max-width:600px){
  .topbar{padding:8px 12px}
  .brand span{display:none}
  .nav-tab{padding:6px 9px;font-size:10px}
  .main{padding:148px 12px 100px}
  .score-bar{flex-direction:column;align-items:stretch;gap:6px;padding:8px 12px}
  .score-txt{text-align:center;font-size:11px}
  .nav-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .nbtn{padding:10px 8px;font-size:12px;text-align:center}
  .sub-mode-bar{flex-direction:column;align-items:flex-start;gap:4px;padding:5px 12px}
}
</style>
</head>

  <div class="brand">GST 212 <span>· ShazdTechBro</span></div>
  <div class="nav-tabs">
    <a class="nav-tab" href="index.html">Bank</a>
    <a class="nav-tab active" href="sessions.html">Sessions</a>
  </div>

</div>

<div class="sub-mode-bar">

    <button class="sub-tab active" id="pointsTab" onclick="setSubMode('points')">30 Key Points</button>

</div>

<div class="main" id="mainContent">

    <div class="sum-score" id="sumScore"></div>

  </div>
</div>

<script>
var SESSIONS = [{"session": 1, "topic": "Nature and Branches of Philosophy", "points": ["The word 'philosophy' is coined from two Greek words: 'Philein' (to love) and 'Sophia' (wisdom), literally meaning 'love of wisdom.'", "Philosophy has no universally accepted definition; ten professional philosophers asked 'What is philosophy?' will give ten different answers.", "The first and most fundamental problem of philosophy is philosophy itself — the question 'What is philosophy?' is itself a philosophical problem.", "We can speak of 'a definition' of philosophy but never 'the definition' of philosophy, because no single definition commands universal agreement among philosophers.", "The ancient Greeks, about 500 years before Christ on the islands of Miletus and Ionia, distinguished wisdom — the ability to draw meaning from experience and see beyond appearances — from mere factual knowledge.", "Philosophy as the Search for Reality holds that beneath the diverse objects of experience lies one basic stuff; Thales identified this as water, while other Ionian philosophers suggested air and earth.", "Anaximander extended Thales's search by positing the 'apeiron' — a limitless, non-empirical something that is neither a substance nor a sensible object, transcending all ordinary experience.", "Philosophy as the Search for Truth involves comparing truths from different disciplines (physics, biology, religion, etc.) and seeking a supreme Truth that supersedes all partial truths; this search is often equated with the search for Reality.", "Philosophy as the Formulation of Metaphysical Systems/Cosmologies attempts to create grand speculative frameworks in which every aspect of nature has its appropriate place, later replaced — per Jacob Bronowski — by theoretical postulates from which deductive systems are built.", "Philosophy as the Rational Explanation of Nature holds that nature can be fully explained by human reason without recourse to the supernatural; Thales and other Ionians broke from Homer's mythological explanations.", "Homer and Greek poets relied on intuition and supernatural notions — gods, goddesses, and spirits controlling human affairs — to explain nature before the Ionian philosophers introduced rational inquiry.", "The 'Linguistic Turn' in 20th-century Western philosophy, most prominent in Britain and the USA, redefined philosophy's central task as the critical and logical analysis of language — clarifying terms, ensuring consistency, and marking out semantic implications.", "Noam Chomsky, the renowned grammarian, argued that philosophy does nothing beyond marking out the 'deep structures' of language from their 'surface structure,' representing the extreme linguistic position.", "Socrates, considered the father of Western philosophy, embodied philosophy as the Search for the Ideal Life: 'to know what is good is to be good; it is to lead a virtuous life.'", "Socrates demonstrated his philosophy concretely by refusing to escape prison in Athens — telling friends that a good citizen obeys the laws of his society — and accepting his death sentence rather than betray his principles.", "The existentialist conception holds that 'existence precedes essence' — man first exists, then defines himself, and only then turns to understand and explain the world around him.", "Key existentialist philosophers are Soren Kierkegaard, Martin Buber, Albert Camus, Karl Jaspers, and Martin Heidegger, all of whom see man as the subject and determinant of truth.", "Martin Heidegger (1889–1976) opened his Introduction to Metaphysics with the fundamental metaphysical question: 'Why is there something and not nothing?' — asking why the world with everything in it exists at all.", "The metaphysical problem of the nature of reality produces three schools: materialism (the world is purely material; no spirits exist), idealism (the world is essentially spiritual; matter is unreal), and dualism (reality is composed of both spirit and matter).", "Epistemology is the philosophical inquiry into the nature, origin, scope, limits, and reliability of human knowledge, asking: What can man know? How certain is that knowledge? What is beyond human knowledge?", "Immanuel Kant (1724–1804) held that 'noumena' (things-in-themselves) are beyond human knowledge, while G.W.F. Hegel (1770–1831) rejected this, arguing nothing is beyond the cognitive power of human reason.", "Sceptics hold that man can never know anything with absolute certainty, making scepticism a key school within epistemology that challenges the reliability of all human knowledge.", "Ethics, the third core branch of philosophy, raises questions about the moral standard, the source of moral principles (reason, passions, society, or God), sanctions for moral laws, and the basis for distinguishing right from wrong.", "Philosophy of Law (Jurisprudence) examines the nature of law and justice, the relationship between law and morality, and conditions for the validity of law; key schools include the natural law school, the legal positivist school, and the legal realist school.", "Philosophy of Science questions the objectivity, certainty, and reliability of scientific theories, noting that past scientific theories have been revised and challenging the guarantee that current theories will not be overturned by future research.", "Political Philosophy focuses centrally on justice — how to organize society to ensure fairness, equal opportunities, and equitable distribution of goods to all members — with different political systems representing different answers.", "Philosophy of Religion raises whether religion requires the concept of God (Buddha founded Buddhism without believing in God) and addresses the problem of evil: why does evil exist in a world created by an all-good, all-powerful God?", "Philosophy of Mind addresses the mind-body interaction problem: how a spiritual mind and a material body causally interact, given that events in each (e.g., anger affecting the body; brain damage affecting the mind) demonstrably affect the other.", "African Philosophy's first debate (1960s–70s) was about whether it existed at all; the current debate concerns its 'Africanness' — what distinguishes it from other philosophies — including the problem that it is written in foreign European languages.", "The scope of philosophy is contested: materialists limit it to material realities; idealists extend it to spiritual and immaterial realities; ontologists extend it to Being itself — the ultimate source from which all beings derive their existence."], "questions": [{"question": "The Greek word 'Sophia' in the word 'philosophy' means:", "options": {"a": "Love", "b": "Truth", "c": "Wisdom", "d": "Reality"}, "answer": "c", "explanation": "Philosophy is formed from 'Philein' (to love) + 'Sophia' (wisdom). Sophia specifically means wisdom, not mere knowledge."}, {"question": "Thales, one of the earliest Ionian philosophers, identified the basic stuff of all reality as:", "options": {"a": "Air", "b": "Fire", "c": "Earth", "d": "Water"}, "answer": "d", "explanation": "Thales identified water as the fundamental element from which all objects in the world came into existence, like a potter's clay that can become many different objects."}, {"question": "Anaximander's 'apeiron' is best described as:", "options": {"a": "A divine spirit that created the universe", "b": "A limitless, non-empirical something that transcends sensible experience", "c": "The mathematical principle governing all of nature", "d": "A combination of air and water as the source of all things"}, "answer": "b", "explanation": "The apeiron is described in the session as 'the limitless something which is neither a substance nor an empirical object' — it lies beyond sensible experience, taking Thales's search beyond the material."}, {"question": "The 'Linguistic Turn' in 20th-century philosophy was most strongly associated with philosophers in:", "options": {"a": "France and Germany", "b": "Greece and Italy", "c": "Britain and the United States", "d": "Africa and India"}, "answer": "c", "explanation": "The session states that philosophers in Britain and the United States became disillusioned with speculation and led the movement to redefine philosophy as critical/logical analysis of language."}, {"question": "A philosopher argues: 'The real task of philosophy is to clarify terms, eliminate ambiguity, and expose the logical implications of our statements.' This view best represents philosophy as:", "options": {"a": "The Search for Reality", "b": "The Formulation of Metaphysical Systems", "c": "The Critical/Logical Analysis of Language", "d": "The Concern with Human Existence"}, "answer": "c", "explanation": "This exactly matches the linguistic conception of philosophy: clarifying terms, ensuring consistency, and marking out logical and semantic implications of language — the core of the Linguistic Turn."}, {"question": "Socrates refused his friends' plan to help him escape from prison because:", "options": {"a": "He believed he was genuinely guilty of the charges", "b": "He feared being caught and given a harsher punishment", "c": "He had always taught that a good citizen obeys the laws of his society", "d": "He believed death would lead him to the ideal life"}, "answer": "c", "explanation": "Socrates told his friends he had always taught that a good citizen obeys the laws of his society; escaping would contradict his own philosophical teaching and betray his principles."}, {"question": "Which philosopher explicitly rejected Kant's view that 'noumena' are beyond human knowledge, arguing that nothing is beyond the cognitive power of human reason?", "options": {"a": "Martin Heidegger", "b": "G.W.F. Hegel", "c": "Soren Kierkegaard", "d": "Albert Camus"}, "answer": "b", "explanation": "G.W.F. Hegel (1770–1831) disagreed with Immanuel Kant (1724–1804), arguing there is nothing either beyond human knowledge or beyond the cognitive power of human reason."}, {"question": "The existentialist phrase 'existence precedes essence' means that:", "options": {"a": "Physical existence is more real than abstract ideas", "b": "Man first exists, then defines himself, then turns to understand the world", "c": "The essence of a thing must be known before it can exist", "d": "Moral essence is more important than physical existence"}, "answer": "b", "explanation": "For existentialists, man 'first exists of all appearances, defines himself before he then turns to understand and explain the world' — existence comes before the discovery of essence."}, {"question": "Martin Heidegger is best known for asking which fundamental philosophical question?", "options": {"a": "What is the good life and how should we live it?", "b": "Can we know anything with absolute certainty?", "c": "Why is there something and not nothing?", "d": "What is the proper scope of language in philosophy?"}, "answer": "c", "explanation": "Heidegger opened his Introduction to Metaphysics with this fundamental metaphysical question — asking why the world with everything in it exists at all rather than there being nothing."}, {"question": "A philosopher holds that the world is purely material, man is entirely a material being, and there are no spirits. This philosopher belongs to the school of:", "options": {"a": "Idealism", "b": "Dualism", "c": "Materialism", "d": "Existentialism"}, "answer": "c", "explanation": "The session defines materialism as the school that holds the world is purely material, man himself is entirely a material being, and there are no spirits — directly matching this description."}, {"question": "The branch of philosophy that asks 'What can man know? How reliable is knowledge? What are the limits of human knowledge?' is:", "options": {"a": "Metaphysics", "b": "Ethics", "c": "Epistemology", "d": "Aesthetics"}, "answer": "c", "explanation": "Epistemology is defined as the philosophical inquiry into the nature, origin, scope, limits, and reliability of human knowledge — it directly addresses all these questions."}, {"question": "A lawyer argues that only material/enacted laws are valid laws and that morality is irrelevant to legal validity. This lawyer most likely belongs to which school of philosophy of law?", "options": {"a": "Natural law school", "b": "Legal positivist school", "c": "Legal realist school", "d": "Jurisprudential idealist school"}, "answer": "b", "explanation": "Legal positivism holds that law is valid based on its source (proper enactment by authority), not its moral content. The natural law school, by contrast, would say immoral law is not truly law."}, {"question": "Socrates is identified in the session as:", "options": {"a": "The founder of the Ionian school of philosophy", "b": "The father of Western philosophy", "c": "The first philosopher to use the word 'philosophy'", "d": "The philosopher who identified water as the basic stuff of reality"}, "answer": "b", "explanation": "The session explicitly refers to Socrates as 'the father of Western philosophy' in the context of the conception of philosophy as the Search for the Ideal Life."}, {"question": "The philosophical position of dualism in metaphysics holds that:", "options": {"a": "Reality is purely material", "b": "Reality is purely spiritual", "c": "Reality is composed of both spiritual and material elements", "d": "Reality cannot be known with human certainty"}, "answer": "c", "explanation": "Dualism holds that the world is made up of both spiritual and material elements, and that man himself is composed of spirit and matter — a middle position between materialism and idealism."}, {"question": "Before the Ionian philosophers, thinkers like Homer explained natural phenomena primarily through:", "options": {"a": "Mathematical reasoning and calculations", "b": "Rational deduction from first principles", "c": "Intuition and supernatural myths involving gods and goddesses", "d": "Systematic empirical observation"}, "answer": "c", "explanation": "The session states that Homer and other Greek poets relied on intuition and supernatural notions — gods, goddesses, and spirits populating the world and controlling human affairs — as the bases of popular myths."}, {"question": "The epistemological school that denies man can ever attain absolutely certain knowledge is called:", "options": {"a": "Rationalism", "b": "Empiricism", "c": "Scepticism", "d": "Idealism"}, "answer": "c", "explanation": "The session explicitly states that 'the sceptics deny that man can ever know anything with certainty' — this is the defining feature of scepticism within epistemological debates."}, {"question": "The central concern of Political Philosophy, as stated in the session, is:", "options": {"a": "The nature and sources of political power", "b": "The definition and enforcement of law", "c": "Justice, equal opportunities, and equitable distribution of society's goods", "d": "The relationship between the state and religious institutions"}, "answer": "c", "explanation": "The session states: 'In Political Philosophy the basic issue is that of justice. How do we organize society in such a way that there will be justice and fairness to all its members?'"}, {"question": "Philosophy of Education is primarily concerned with:", "options": {"a": "Setting national curriculum standards", "b": "Distinguishing education from indoctrination while respecting students' freedom", "c": "The history of educational institutions", "d": "Measuring academic performance and achievement"}, "answer": "b", "explanation": "The session states that in Philosophy of Education 'there is the basic issue of distinguishing between educating a person and indoctrinating him' and 'educating people and respecting their freedom.'"}, {"question": "A student says: 'Once we clarify the language of the mind-body debate, the problem resolves itself.' A philosopher responds: 'Language clarification is insufficient — there is an inherent metaphysical problem about the nature of reality.' The philosopher's response reflects which insight from the session?", "options": {"a": "The linguistic turn fully resolved all philosophical problems", "b": "There is much more to the problem of mind and God than mere language", "c": "Metaphysics is more important than epistemology", "d": "Only African philosophers address the mind-body problem correctly"}, "answer": "b", "explanation": "The session explicitly states: 'today, the feeling is that there is much more to the problem of mind and God than that of mere language. There is the inherent metaphysical problem of the nature of reality.'"}, {"question": "According to the session, the ancient Greeks understood 'wisdom' as distinct from mere knowledge because wisdom involves:", "options": {"a": "Mastery of science, medicine, and mathematics", "b": "Ability to draw meaning from experience, judge wisely, and see beyond appearances", "c": "The accumulation of the greatest quantity of factual information", "d": "Skill in rhetoric and public persuasion"}, "answer": "b", "explanation": "The session defines Greek wisdom as 'the ability to draw meaning from experience, to judge experience wisely; to see beyond what merely meets the eyes' — distinguishing it from mere knowledge of facts."}, {"question": "The philosophical problem of evil in Philosophy of Religion is most directly a challenge to:", "options": {"a": "Atheism", "b": "Agnosticism", "c": "Theism", "d": "Scepticism"}, "answer": "c", "explanation": "The problem of evil — why evil exists in a world created by God — challenges theism (belief in a good, all-powerful God). It is theists who must explain this apparent contradiction."}, {"question": "Philosophy of Mind's central problem, as described in the session, is:", "options": {"a": "Whether the brain is capable of rational thought", "b": "The nature of the mind and how a spiritual mind interacts with a material body", "c": "Whether consciousness can be measured scientifically", "d": "The relationship between language and mental states"}, "answer": "b", "explanation": "The session defines Philosophy of Mind as addressing 'the basic problem is the nature of the mind and how the mind interacts with the body,' noting that the spiritual mind and material body demonstrably affect each other."}, {"question": "The debate about African Philosophy shifted after the 1960s–70s from whether it existed to which new question?", "options": {"a": "Whether African philosophers are internationally recognized", "b": "What makes African philosophy specifically African — its distinguishing features and characteristics", "c": "Whether African philosophy should be taught in African universities", "d": "Whether African oral traditions qualify as philosophy"}, "answer": "b", "explanation": "The session states: 'That debate is over now. The issue now is the Africanness of African Philosophy. In other words, what makes African Philosophy specifically African? What distinguishes African philosophy from other philosophies?'"}, {"question": "According to the session, the scope of philosophy for idealist philosophers includes:", "options": {"a": "Only material and empirically observable realities", "b": "Only scientific and mathematical truths", "c": "Both material and spiritual/immaterial realities such as spirit, mind, soul, and God", "d": "Only ethical and political questions affecting human society"}, "answer": "c", "explanation": "The session states that idealist philosophers 'philosophize about spirit, mind, soul, God, etc.' and 'conceive reality as basically spiritual,' including all realities within the scope of philosophy."}, {"question": "Jacob Bronowski's contribution described in the session is the idea that philosophical speculation evolved into:", "options": {"a": "Pure linguistic analysis devoid of metaphysical content", "b": "Empirical laboratory experiments", "c": "Theoretical postulates from which deductive systems explaining human experience can be built", "d": "Mathematical axioms for proving the existence of God"}, "answer": "c", "explanation": "The session cites Bronowski's view that speculative axioms were replaced by 'theoretical postulates — axioms from which deductive systems dealing with or explaining different aspects of human experience can be built.'"}, {"question": "Philosophy of Religion raises the case of Buddha to illustrate which philosophical question?", "options": {"a": "Does God exist?", "b": "Can there be a religion without the concept of God?", "c": "Is Buddhism superior to other religions?", "d": "Can a non-believer lead a moral life?"}, "answer": "b", "explanation": "The session uses Buddha — who founded Buddhism without believing in God — to raise the question: 'Can there be a religion without the concept of God? Can a person who does not believe in God be a religious man?'"}, {"question": "A philosopher who holds that matter is unreal or merely a manifestation of spirit, and who extends the scope of philosophy to cover God, soul, and mind, belongs to which school?", "options": {"a": "Materialism", "b": "Dualism", "c": "Idealism", "d": "Scepticism"}, "answer": "c", "explanation": "The session states that idealists 'see matter as unreal, or at best only a manifestation of spirit' and 'conceive reality as basically spiritual,' philosophizing about spirit, mind, soul, and God."}, {"question": "The session states that in ancient Greece, philosophy included all knowledge — logic, mathematics, physics, medicine, cosmology — because:", "options": {"a": "All disciplines were taught by the same professors", "b": "Wisdom, which philosophy seeks, needs knowledge as its basis, and an ignorant person cannot be truly wise", "c": "Greek universities did not differentiate between disciplines", "d": "Philosophy and science were considered identical by the Greeks"}, "answer": "b", "explanation": "The session explains: 'Wisdom needs knowledge as basis because an ignorant person, a man or woman who knows little or nothing about the facts of nature and existence can hardly be wise in relating facts to each other.'"}, {"question": "The problem that African philosophy is written in foreign European languages is significant because it raises the question of:", "options": {"a": "Whether African philosophers are educated enough", "b": "Whether using a foreign language diminishes the quality and Africanness of African philosophy", "c": "Whether European languages are philosophically sophisticated", "d": "Whether African philosophy should be banned from universities"}, "answer": "b", "explanation": "The session explicitly asks: 'Does the fact that African philosophy is written in foreign languages diminish the quality and the Africanness of African philosophy?' — presenting this as a serious problem in African philosophy."}, {"question": "According to the session, when philosophy is described as the 'search for Reality,' Reality is understood as something that:", "options": {"a": "Can only be discovered through scientific experiments", "b": "Has independent existence and possesses characteristics by its own nature", "c": "Is created by human thought and language", "d": "Is identical to mathematical truth"}, "answer": "b", "explanation": "The session states that Reality 'is thus generally regarded as something that has its own independent existence. This means that those who regard matter as Reality believe that its existence does not depend on the prior existence of any other thing.'"}]}, {"session": 2, "topic": "History of Philosophy", "points": ["Philosophy as an intellectual enterprise is dated to when man began to wonder and ask fundamental questions about his being — a view attributed to Aristotle — distinguishing the philosopher (who goes beyond communal belief) from the mythologist (who merely echoes it).", "Western philosophy is divided into five historical epochs: the Ancient, the Hellenistic, the Medieval, the Modern, and the Contemporary period.", "The Ancient period comprises two sub-periods: the Pre-Socratic period (focused primarily on cosmology and the universe) and the Socratic/Classical period (Socrates, Plato, and Aristotle).", "The Milesian school, based in Miletus, Ionia (Asia Minor), was the first formal philosophical tradition; its three representatives are Thales, Anaximander, and Anaximenes.", "Thales (624–547 B.C.) is considered the first philosopher and scientist in the western tradition; he predicted a solar eclipse in 585 BC, identified water as the primary substance of all things, explained earthquakes as natural phenomena, and initiated proof by deduction.", "Anaximander (610–546 BC) held that the universe originated from an amorphous, formless mass containing opposites (hot/cold, wet/dry) whose union and separation formed sea, land, and air; he was the first to determine solstices and equinoxes and the first to draw a map.", "Anaximenes (died 528 BC), teacher of Anaxagoras, originated the concept of monism and held air/mist as the fundamental substance from which all others derive: fire is rarefied air, while condensed air becomes water, then earth, then stone.", "Pythagoras (580–500 B.C.) held that numbers explain everything in the universe, assigning them mystical functions; his philosophy synthesized religion, mathematics, and science, and he founded a school and religious brotherhood in Croton, Italy, that believed in reincarnation (influenced by Orphism).", "Heraclitus (544–483 B.C.) proposed fire as the primordial element, held that reality consists of constant change and motion, and introduced the concept of logos (an organizing principle akin to reason) that harmonizes opposing tensions; his ideas influenced Hegel, Heidegger, and Wittgenstein.", "Parmenides of Elea (510–450 B.C.) directly opposed Heraclitean flux by arguing that nothing changes and everything is permanently in a state of being, and he elevated reason over sensory evidence.", "Anaxagoras (500–428 B.C.), a disciple of Anaximenes, was the first to bring philosophy to Athens and the first philosopher to propose Mind (Nous) as the primary cause of physical change, identifying Nous with consciousness.", "The Atomists — Leucippus and Democritus — held that everything is composed of physically (but not geometrically) indivisible atoms of infinite number, varying shapes, and sizes, always in motion, with empty spaces between them; their materialism profoundly influenced Karl Marx, who wrote his thesis on Democritus.", "The Sophists (represented by Protagoras of Abdera and Gorgias) were itinerant teachers who taught rhetoric, politics, and the art of success for money; their chief philosophical position was that 'nothing can be known,' making them the opponents of genuine knowledge.", "Socrates (469–399 B.C.) wrote nothing; all knowledge of him comes from disciples Plato and Xenophanes; he turned philosophy away from cosmology and sophistry toward ethics, lifestyle, and morality, and was tried and executed by the Athenian authorities by drinking hemlock.", "Plato (427–347 B.C.) taught that Forms (or Ideas) are the timeless, motionless, absolutely real essences of things located outside the everyday world, knowable only through reason and not sense perception; he defined man as a being made of soul (reason) and body.", "Plato founded the Academy — considered the first university in Europe — held that knowledge is reminiscence (the soul's recollection of Forms), and wrote The Republic as his magnus opus on how the state should be organized.", "Aristotle (born 384 B.C. in Stageira), Plato's student for twenty years, developed formal logic (which deals with the form that reasoning takes), covered logic, physics, ethics, psychology, biology, politics, metaphysics, and rhetoric, and founded the Lyceum.", "The Hellenistic period (after Aristotle, before the Medieval era) produced five schools: the Cynics, the Cyrenaics, Epicureanism, Stoicism, and Scepticism.", "The Cynic school (founded by Antisthenes, a disciple of Socrates) emphasized a return to nature, self-discipline, self-knowledge, and asceticism; the Cyrenaic school (founded by Aristippus of Cyrene) identified pleasure as the goal of life and the criterion for judging right from wrong.", "Stoicism (founded by Zeno) held that all knowledge derives from perception, that all things and events are interrelated, and that man should live according to nature and be ruled by reason; Epicureanism (founded by Epicurus, drawing from Democritus and the Cyrenaics) emphasized asceticism to strengthen the power of reason over emotion.", "Scepticism (established by Pyrrho of Elis) denied that either reason or the senses can give us adequate and certain knowledge, and held that without an objective moral standard one should simply follow the prevailing customs or laws of one's place.", "The Medieval period (also called the Middle Ages or Dark Ages) was characterized by the use of philosophy to embellish religious thought; religion became dominant in state affairs, science and materialism stagnated, and notable figures included St. Augustine, Boethius, John Scotus Eriugena, St. Anselm, and Thomas Aquinas.", "St. Augustine (born in Tagaste, Algeria, A.D. 354) modelled his philosophy on Plato, adopted Plato's world of Ideas to represent the mind of God, equated the Platonic Idea of Good with God, and wrote The City of God and The Confessions.", "Boethius combined neo-Platonism and Stoicism, defined man as 'an individual substance of a rational nature,' held that philosophy's task is to awaken and broaden man's knowledge, and wrote The Consolation of Philosophy based on his personal journey from consul to prisoner.", "St. Anselm (Augustinian tradition) formulated the ontological argument for God's existence: God is 'a being greater than that which no one can conceive'; Thomas Aquinas (largely Aristotelian) held that matter and form are inseparable, that all human knowledge derives from experience, and wrote the Summa Theologica and Summa Contra Gentiles.", "The Modern period (Renaissance to end of the 19th century, also called the Age of Scientific Knowledge) emphasized reason, experience, and observation, and provided the philosophical foundation for experimental science and empirical research; Francis Bacon's Novum Organum argued that knowledge should be used to improve man's condition and dominate nature.", "René Descartes introduced methodic doubt, held that reason is the foundation of all awareness and experience preceding knowledge, and raised the mind-body problem; Spinoza (Jewish) held that nature/God presents itself as both spirit and matter; Leibniz (1646–1716) maintained that monads are the basic elementary substances of all things and that this world is the best of all possible worlds.", "The British Empiricists — John Locke (father of British empiricism), George Berkeley, and David Hume — held that knowledge derives from sense experience: Locke identified three types of knowledge (intuitive, demonstrative, sensitive) and is the philosopher of private property; Berkeley's maxim 'esse est percipi' (to exist is to be perceived) denied material substance; Hume criticised causality as neither demonstrable nor intuitable.", "Immanuel Kant (born Konigsberg, 1724–1804) distinguished a priori from a posteriori knowledge and introduced synthetic a priori propositions, instigating German Idealism (Fichte, Schelling, and Hegel); Hegel took German idealism to its height with Hegelianism, which focuses on Being as the Absolute Spirit; Karl Marx (1818–1883) developed dialectical and historical materialism, influencing socialism as an alternative to capitalism.", "The Contemporary period produced major movements including Logical Positivism (the Vienna Circle — Carnap, Schlick, Neurath, Reichenbach — who held that science is the only valid path to knowledge and used the verification principle to dismiss metaphysics, religion, and ethics); Pragmatism (Pierce, James, Dewey — 'what works in practice is true'); Phenomenology (Husserl); Analytic Philosophy (Moore, Russell, Wittgenstein); and Existentialism (founded by Kierkegaard, who identified three stages of existence — aesthetic, ethical, and religious — and developed by Nietzsche, Jaspers, Heidegger, and Sartre)."], "questions": [{"question": "According to the text, what distinguishes a philosopher from a mythologist when answering fundamental questions about the universe?", "options": {"a": "The philosopher uses religious texts while the mythologist uses reason", "b": "The philosopher goes beyond common belief while the mythologist echoes communal consensus", "c": "The philosopher focuses on the cosmos while the mythologist focuses on human society", "d": "The philosopher writes books while the mythologist speaks only in public"}, "answer": "b", "explanation": "The text states that 'a philosopher would be he who goes beyond the common belief in answering such questions while a mythologist would merely echo communal consensus.'"}, {"question": "Which of the following correctly lists the five periods of western philosophy in chronological order?", "options": {"a": "Pre-Socratic, Socratic, Medieval, Modern, Contemporary", "b": "Ancient, Hellenistic, Medieval, Modern, Contemporary", "c": "Ancient, Medieval, Renaissance, Modern, Contemporary", "d": "Pre-Socratic, Hellenistic, Scholastic, Enlightenment, Contemporary"}, "answer": "b", "explanation": "The text explicitly states that western philosophy is periodized into 'the ancient, medieval, modern and contemporary,' with the Hellenistic period placed between the Ancient and Medieval eras."}, {"question": "Thales of Miletus is credited with which of the following achievements?", "options": {"a": "Drawing the first map and determining solstices", "b": "Originating the concept of monism", "c": "Predicting a solar eclipse in 585 BC and initiating proof by deduction", "d": "Founding a school and religious brotherhood in Croton"}, "answer": "c", "explanation": "The text attributes to Thales the prediction of a solar eclipse in 585 BC and the initiation of proof by deduction. Drawing a map and determining solstices belongs to Anaximander; monism to Anaximenes; and the brotherhood at Croton to Pythagoras."}, {"question": "Anaximander's primary innovation over Thales was proposing that the origin of the universe is:", "options": {"a": "Water, the first principle of all things", "b": "Fire, the primordial element in perpetual change", "c": "An amorphous, formless mass containing opposites such as hot/cold and wet/dry", "d": "Air or mist, which condenses and rarefies into other substances"}, "answer": "c", "explanation": "Anaximander rejected a single named element; he proposed the universe originated as an amorphous formless mass with internal opposites. Water is Thales' answer, fire is Heraclitus's, and air is Anaximenes's."}, {"question": "According to Anaximenes' theory of transformation, placing the substances in order from most rarefied to most condensed gives:", "options": {"a": "Air → Water → Earth → Stone → Fire", "b": "Fire → Air → Water → Earth → Stone", "c": "Stone → Earth → Water → Air → Fire", "d": "Water → Air → Fire → Earth → Stone"}, "answer": "b", "explanation": "Anaximenes held that fire is rarefied air. When air condenses, it becomes first water, then earth, then stone. So the sequence from most rarefied to most condensed is: Fire → Air → Water → Earth → Stone."}, {"question": "Which Pre-Socratic philosopher is correctly paired with his primary philosophical claim?", "options": {"a": "Heraclitus — nothing changes; everything is permanently in a state of being", "b": "Parmenides — reality consists of change and motion organized by logos", "c": "Pythagoras — numbers explain everything in the universe", "d": "Thales — air is the fundamental substance from which all things derive"}, "answer": "c", "explanation": "Pythagoras assigned mystical functions to numbers and held that numbers explain everything. The other pairings are reversed: Heraclitus held change and logos; Parmenides held that nothing changes; Thales proposed water, not air."}, {"question": "Heraclitus' concept of logos is best described as:", "options": {"a": "The primordial fire from which all things are born", "b": "An organizing principle akin to reason that unifies opposing tensions", "c": "The immortal soul that persists through reincarnation", "d": "The empty space between atoms in which motion takes place"}, "answer": "b", "explanation": "The text defines logos as 'the organizing principle akin to reason' through which objects exist as a harmony of opposing tensions. Fire is the primordial element; the soul and reincarnation relate to Pythagoras; empty space between atoms belongs to the Atomists."}, {"question": "Anaxagoras made a historically significant contribution by being the first to:", "options": {"a": "Identify water as the primary substance of the universe", "b": "Teach philosophy in exchange for money", "c": "Introduce philosophy to the Athenians and propose Mind (Nous) as the primary cause of physical change", "d": "Argue that reality is permanently fixed and unchanging"}, "answer": "c", "explanation": "The text states Anaxagoras was 'the first to introduce philosophy to the Athenians and the first to suggest mind as the primary cause of physical change.' Teaching for money describes the Sophists; water is Thales'; unchanging reality is Parmenides'."}, {"question": "The Atomists (Leucippus and Democritus) held that atoms are physically but not geometrically indivisible. What does this distinction mean in practice?", "options": {"a": "Atoms can be split by fire but not by water", "b": "Atoms have shapes and sizes that can be described mathematically, but they cannot be physically broken apart", "c": "Atoms are invisible to the eye but visible under magnification", "d": "Atoms are indivisible only when they are at rest, not when in motion"}, "answer": "b", "explanation": "The statement that atoms are 'physically but not geometrically indivisible' means they cannot be physically broken, yet they possess definite geometric properties (shape, size). Karl Marx was so influenced by these ideas that he wrote his thesis on Democritus."}, {"question": "A sophist in Ancient Greece from the 5th century BC onwards was primarily:", "options": {"a": "A state official responsible for upholding civic law", "b": "An itinerant teacher of rhetoric, politics, and the art of success, who charged fees", "c": "A philosopher who believed all knowledge is innate", "d": "A priest who combined religious and philosophical teachings"}, "answer": "b", "explanation": "The text defines a sophist from the 5th century BC as 'an itinerant teacher of rhetoric, politics and the art of success in life in exchange for money,' teaching 'those who have money to pay for lessons.'"}, {"question": "Socrates' primary philosophical concern — distinct from his Pre-Socratic predecessors — was:", "options": {"a": "Identifying the primary material substance of the universe", "b": "Developing formal logic and classifying the natural sciences", "c": "Turning philosophy toward lifestyle, existence, and morality, challenging scepticism", "d": "Establishing a school and writing systematic philosophical treatises"}, "answer": "c", "explanation": "The text states Socrates 'turned philosophy from the study of cosmology and away from sophistry' to 'lifestyle, issues of existence, morals etc.' and 'compelled philosophy to consider' these areas. He wrote nothing; Aristotle developed formal logic."}, {"question": "Plato's doctrine that 'knowledge is reminiscence' implies which of the following?", "options": {"a": "Learning is the process of constructing entirely new ideas through sensory input", "b": "The soul already possesses knowledge of the Forms and learning is merely recollection", "c": "Memory is unreliable and cannot serve as a foundation for true knowledge", "d": "Only those trained in rhetoric can achieve genuine understanding"}, "answer": "b", "explanation": "Plato's reminiscence doctrine holds that the soul had prior acquaintance with the Forms before birth; earthly learning is therefore a recollection of what the soul already knows, not the construction of new knowledge from sensory experience."}, {"question": "Which statement correctly distinguishes Plato's Academy from Aristotle's Lyceum?", "options": {"a": "The Academy focused on mathematics and Forms; the Lyceum focused on rhetoric and politics exclusively", "b": "The Academy was founded by Plato and is considered the first university in Europe; the Lyceum was founded by Aristotle", "c": "The Academy was founded by Socrates; the Lyceum was founded by Plato", "d": "Both institutions were located in the same city and taught identical curricula"}, "answer": "b", "explanation": "The text states Plato 'founded the first university (called the Academy) in Europe' and that Aristotle 'founded a school known as Lyceum.' Socrates founded no institution and wrote nothing."}, {"question": "The Hellenistic school that identified pleasure as the goal of life and the criterion for judging right from wrong was the:", "options": {"a": "Cynics", "b": "Stoics", "c": "Cyrenaics", "d": "Epicureans"}, "answer": "c", "explanation": "The Cyrenaic school, founded by Aristippus of Cyrene, 'identified pleasure as the goal of life and made it a criterion for judging right from wrong.' Cynics emphasised asceticism; Stoics emphasised living according to nature and reason; Epicureans emphasised asceticism to strengthen reason."}, {"question": "How does Stoicism's view of knowledge differ from the Sceptics' view?", "options": {"a": "Stoics hold that perception is the criterion for truth; Sceptics deny that reason or senses can give adequate knowledge", "b": "Stoics deny the existence of an external world; Sceptics affirm it", "c": "Stoics believe only divine revelation gives knowledge; Sceptics believe science gives certain knowledge", "d": "Both schools agree that knowledge is impossible but disagree on its source"}, "answer": "a", "explanation": "Stoicism holds that 'all knowledge derives from perception which is the criterion for truth'; Pyrrho's Scepticism holds that 'neither reason nor the senses could give us adequate and certain knowledge.' These positions are directly opposed."}, {"question": "The Medieval period is characterised by which of the following philosophical tendencies?", "options": {"a": "A focus on empirical science and rejection of religious authority", "b": "The use of philosophy to embellish religious thought, with religion dominant in state affairs", "c": "A return to Pre-Socratic cosmology and abandonment of ethics", "d": "The rise of scepticism and denial of metaphysical knowledge"}, "answer": "b", "explanation": "The text states the Medieval period is 'the era in which the church brought philosophic thesis to embellish religious thought and norms' and that 'religion became very powerful in the affairs of the state,' leading to the stagnation of science and materialism."}, {"question": "St. Augustine's relationship to Plato's philosophy is best described as:", "options": {"a": "He rejected Plato entirely and built his system on Aristotle", "b": "He adopted Plato's world of Ideas to represent the mind of God and equated the Idea of Good with God", "c": "He used Plato's dialectics to argue against the existence of God", "d": "He combined Plato with Stoicism to define man as a rational substance"}, "answer": "b", "explanation": "The text states Augustine 'fashioned his philosophy after Plato' and 'adopted Plato's world of ideas to represent the mind of God and the idea of good to be God.' The combination of Plato with Stoicism describes Boethius."}, {"question": "Boethius' definition of man as 'an individual substance of a rational nature' is significant because it:", "options": {"a": "Denies the existence of the human soul", "b": "Provides a philosophical definition that emphasises individuality and rationality as essential to humanity", "c": "Identifies man with the natural world and denies free will", "d": "Argues that man is purely a material being with no spiritual dimension"}, "answer": "b", "explanation": "Boethius's definition emphasises two key philosophical attributes: that man is an individual substance (not an abstract universal) and that rationality is his defining characteristic — a definition that influenced subsequent Medieval anthropology."}, {"question": "St. Anselm's ontological argument for God's existence is best summarised as:", "options": {"a": "God must exist because the universe requires a first cause", "b": "God exists because the majority of people across cultures believe in a deity", "c": "God is a being greater than that which no one can conceive, and therefore must exist in reality", "d": "God's existence can be proven through scientific observation of design in nature"}, "answer": "c", "explanation": "The text directly states Anselm's ontological view: 'God is a being greater than that which no one can conceive.' The classical ontological argument holds that if we can conceive of the greatest possible being, that being must exist in reality."}, {"question": "Thomas Aquinas's position that 'matter and form are inseparable' aligns him with which philosopher's tradition?", "options": {"a": "Plato, who held that Forms exist separately from matter", "b": "Aristotle, who held that form and matter are always found together in concrete things", "c": "Descartes, who separated mind and matter as distinct substances", "d": "Berkeley, who denied the existence of matter altogether"}, "answer": "b", "explanation": "The text says Aquinas was 'largely Aristotelian.' Aristotle (unlike Plato) held that form does not exist separately from matter but is always embodied in concrete physical things — precisely the view Aquinas adopted."}, {"question": "Francis Bacon's philosophical significance in the Modern period lies in his argument that:", "options": {"a": "Reason is the sole foundation of knowledge, preceding all experience", "b": "Knowledge should be discovered and used to improve man's lot and dominate nature, marking the beginning of the new scientific era", "c": "The mind is a blank slate that passively records sensory impressions", "d": "God's existence can be proved through the ontological argument"}, "answer": "b", "explanation": "The text states Bacon's thesis was 'about how knowledge could be discovered and used by man to improve his lot and dominate nature' and that his work 'marked the beginning of the new scientific era.' The blank-slate concept is Locke's; reason preceding experience is Descartes'."}, {"question": "Descartes' 'methodic doubt' is a philosophical method in which he:", "options": {"a": "Accepts only knowledge derived from sense perception", "b": "Doubts everything that can be doubted until he reaches an indubitable foundation — his own existence as a thinking being", "c": "Rejects all scientific knowledge as uncertain", "d": "Argues that morality should be based on public consensus"}, "answer": "b", "explanation": "The text states Descartes 'derived the notion to the methodic doubt' from 'the proof of his own existence,' which is the cogito — he doubted everything systematically until he arrived at the certainty of his own thinking existence as the foundation."}, {"question": "George Berkeley's claim that 'esse est percipi' most directly challenges which philosophical position?", "options": {"a": "Rationalism, which holds that reason alone gives knowledge", "b": "Materialism, which holds that matter exists independently of perception", "c": "Scepticism, which doubts all knowledge including perceptual knowledge", "d": "Stoicism, which holds that man must live according to nature"}, "answer": "b", "explanation": "By asserting 'to exist is to be perceived,' Berkeley denies that material objects exist independently of a mind perceiving them — a direct attack on materialism. His view does not challenge rationalism or Stoicism, and it actually affirms (rather than undermines) the reality of perception."}, {"question": "David Hume's philosophical contribution that 'any metaphysics not based on sense experience contains sophistry and illusion' is best described as:", "options": {"a": "Radical rationalism — knowledge begins with pure reason", "b": "Radical empiricism — only sense-experience-based claims have cognitive value", "c": "Idealism — reality is constituted by the perceiving mind", "d": "Existentialism — man is the sole judge of his own existence"}, "answer": "b", "explanation": "Hume's rejection of any metaphysics not grounded in sense experience is the hallmark of radical empiricism. This position was so extreme that it famously 'awoke Kant from his dogmatic slumber' and prompted the development of critical philosophy."}, {"question": "Kant's distinction between 'a priori' and 'a posteriori' knowledge is correctly described as:", "options": {"a": "A priori knowledge is derived from experience; a posteriori knowledge is independent of experience", "b": "A priori knowledge is independent of experience; a posteriori knowledge is derived from experience", "c": "A priori knowledge is certain and infallible; a posteriori knowledge is always doubtful", "d": "A priori knowledge belongs to ethics; a posteriori knowledge belongs to science"}, "answer": "b", "explanation": "By definition, a priori knowledge is prior to and independent of experience (e.g., mathematical truths), while a posteriori knowledge comes after and depends on experience. The text confirms Kant made this key distinction."}, {"question": "Hegel's philosophy is distinguished from Kant's idealism by taking it to its absolute conclusion, which Hegelianism expresses as:", "options": {"a": "Matter is the only reality; all mental phenomena reduce to physical processes", "b": "The individual rational will is the ultimate standard of morality", "c": "Being is the Absolute Spirit, and history is the unfolding of this Spirit", "d": "Scientific verification is the only criterion of meaningful propositions"}, "answer": "c", "explanation": "The text states 'Hegelianism focuses on Being as the Absolute Spirit' and that Hegel 'took German idealism to its height.' This absolute idealism views all of reality — including history — as the self-development of the Absolute Spirit."}, {"question": "The Vienna Circle's verification principle served as a tool to:", "options": {"a": "Confirm the truth of metaphysical and religious propositions", "b": "Determine the meaningfulness, falsity, or truth of propositions, ruling out metaphysics, religion, and ethics as irrelevant", "c": "Establish that scientific knowledge is inferior to philosophical knowledge", "d": "Prove that pragmatism's 'what works is true' standard is scientifically valid"}, "answer": "b", "explanation": "The text states the logical positivists used the verification principle as 'the instrument of verifying meaningfulness, falsity and truth' and concluded that 'metaphysics, religion and ethics are irrelevant because no knowledge can be derived from them.'"}, {"question": "Pragmatism's core thesis — 'what works in practice is true' — was founded by C.S. Pierce and further developed by William James and John Dewey. How does this position differ from the logical positivists' verification principle?", "options": {"a": "Both hold identical criteria for truth; they differ only in their founding figures", "b": "Pragmatism uses practical consequences as the criterion for truth; logical positivism uses empirical verifiability by science", "c": "Pragmatism rejects science; logical positivism accepts it as the only valid knowledge", "d": "Pragmatism is a Medieval philosophy; logical positivism is ancient"}, "answer": "b", "explanation": "Pragmatism judges truth by practical workability; logical positivism (the Vienna Circle) judges meaningfulness by scientific verifiability. Both are empirically oriented but apply different criteria — practical outcome versus scientific testability."}, {"question": "Kierkegaard's three stages of human existence — aesthetic, ethical, and religious — describe a progression in which the highest stage is:", "options": {"a": "Aesthetic — the pursuit of pleasure and sensory experience", "b": "Ethical — the conformity to universal moral duties", "c": "Religious — the individual's direct, passionate relationship with God beyond ethical norms", "d": "Intellectual — the philosopher's pursuit of pure reason"}, "answer": "c", "explanation": "Kierkegaard's three stages in Stages on Life's Way are the aesthetic, ethical, and religious. The religious stage is the highest, representing an intensely personal 'leap of faith' beyond the universal ethical stage. The text confirms these three stages as the basis upon which 'human existence was based.'"}, {"question": "Existentialism's picture of human life in 'an absurd and meaningless universe where individuals are responsible for and the sole judge of their conduct' most directly implies which philosophical principle?", "options": {"a": "Determinism — all human actions are causally fixed by prior events", "b": "Radical human freedom and individual responsibility in the absence of pre-given meaning", "c": "That social norms and laws are the ultimate source of moral authority", "d": "That the natural world provides an objective standard for human conduct"}, "answer": "b", "explanation": "The existentialist claim that individuals are 'responsible for and the sole judge of their conducts' in a meaningless universe directly implies radical freedom — there is no pre-given essence or divine command telling us what to be; existence precedes essence, and we must create our own meaning."}]}, {"session": 3, "topic": "Metaphysics", "points": ["Metaphysics is the core discipline of philosophy and the ground of the positive sciences, originally addressing the first question of philosophy: 'what is real reality?'", "Positivism — the view that only specialized sciences dealing with empirical facts can provide real knowledge — is the chief intellectual movement that relegated and attacked metaphysics.", "The 'eruption of philosophy' refers to its fragmentation into the positive sciences, a process necessitated by the need for division of labour, not an accident or regrettable incident.", "Philosophy's exclusive subject-matter comprises three areas: ontology (reality), epistemology (truth/knowledge), and axiology (value).", "Ontology, also called metaphysica generalis, is the science of being precisely as being — studying Being in general, not particular aspects of being.", "Epistemology (theory of knowledge) evaluates claims to knowledge, addressing five key questions: whether we can know reality, by what medium, with certainty, to what extent, and what is the foundation of human knowledge.", "Axiology (theory of value) branches into ethics, which prescribes principles of morality and norms of human conduct, and aesthetics, which deals with beauty, art appreciation, and art criticism.", "Logic is described as 'the soul of philosophy' and is philosophy's indispensable instrument of action; to deny a piece of philosophical work of logic is to disembowel it.", "Metaphysica specialis refers to the fragmentation of philosophy into regional ontologies — the specialized sciences such as History, Physics, Chemistry, Biology, and Sociology — which deal with particular aspects of reality.", "Metaphysica generalis is what remains of philosophy after it has shed its burden to the positive sciences; it deals with Being in general, reality in general, or what-is in totality, and is transcendental philosophy properly so-called.", "The metaphysician is aptly described as the 'editor of reality' because he seeks to determine the principle or category of reality that governs the world, grounds experience, and explains the universe.", "Every positive science proceeds primarily as metaphysics because it investigates an aspect of reality and develops conceptual tools through the mind's active categorizing to order experience.", "When a positive science raises the question of the ground of its own being — such as asking 'what are the fundamental assumptions of biology?' (meta-biology) — it is engaging in metaphysical inquiry.", "Being metaphysical means employing metaphysical concepts to organize experience in any field of intellectual transaction, while being a metaphysician means boldly confronting the problem of Reality in general.", "Aristotle defined metaphysics as the study of 'being qua being' — the study of being precisely as being, not the search for a hidden double of palpable reality, making metaphysics pure ontology.", "Plato, the prototype traditional metaphysician, held that Ideas are real while non-Idea things (appearance, becoming) are mere shadows or illusions, making the Idea the governing principle of reality.", "Greek cosmology introduced four elementary substances — water, earth, air, and fire — as the ultimate stuff of the universe, each proposed by its purveyor as the one basic element permeating everything.", "Parmenides insisted on the 'One' and Being as permanence, holding that non-being, change, alteration, and plurality are illusory features of reality — opposing the Heraclitan thesis of perpetual flux.", "Heraclitus held the opposing view that Being is impermanence — reality is in a perpetual state of flux or constant change.", "Protagoras of Abdera introduced the human dimension to Greek thought, assigning primacy to human subjectivity: 'of things that are, that they are; of things that are not, that they are not.'", "Traditional metaphysics led to the absolutization of reality, wherein almost every thinker claimed a 'God's eye' perspective, reducing all of reality to one adopted principle with their own position as absolute.", "The social consequences of metaphysical absolutism include religious intolerance (Christianity vs. Islam conflict), political dictatorship (one-party states), and ideological extremism — all products of insisting on a cherished perspective over against nothing.", "Neo-metaphysicism is the know-it-all, superior-holier-thou attitude: holding doggedly and dogmatically to a point of view even in the face of overwhelming counter-evidence and condemning all antagonistic views.", "The Vienna Circle of the 1920s and Ayer's logical empiricism treated metaphysics as the disease of which philosophy and the positive sciences must be cured, making no pretence of their hostility.", "Positivism paradoxically becomes a metaphysics by making a definitive pronouncement on reality — insisting that reality is 'a system of processes governed everywhere by the law of causality' — thus elevating itself to classical metaphysics.", "Any project to exterminate metaphysics is itself a metaphysics — to repudiate metaphysics is to dig away the ground on which we stand, and any therapeutics of metaphysics is a metaphysics of its own.", "Phenomenological ontology involves letting things stand out clearly as they are without prior conceptual prejudice or reification — the liberal temper of letting beings be and respecting every point of view.", "Man in his ultimate essence is a homo viator — a wanderer, eccentric, finder and pointer of the way — not an overlord or ultimate initiator, according to the phenomenological understanding.", "The 'either-or syndrome' — insisting on either this or that without recognizing alternatives — is neo-metaphysicism and represents a mental relapse into archaism and a betrayal of circumspection.", "Philosophy's proper role is to raise and renew the question of reality in a sagely, oracular manner at every age, providing the guidelines for the positive sciences to achieve security, character, stature, and maturity."], "questions": [{"question": "According to the session, the primary reason philosophy lost its independent status was that:", "options": {"a": "Philosophy became too abstract and disconnected from everyday life", "b": "It began to tag along with the sciences, becoming subservient to the specialized positive sciences", "c": "Greek cosmology replaced philosophy as the dominant discipline", "d": "Metaphysicians abandoned their research into Being"}, "answer": "b", "explanation": "The text states that 'philosophy lost its independent status and became subservient to the specialized, positive sciences, like a weak man who must depend on his children for sustenance' after beginning to 'tag along with the sciences.'"}, {"question": "A philosopher who investigates other disciplines like physics or history does so primarily to:", "options": {"a": "Compete with specialists in those disciplines", "b": "Prove the superiority of philosophy over all other disciplines", "c": "Provide a clearing and ground for those disciplines to achieve security and maturity", "d": "Replace those disciplines with philosophical analysis"}, "answer": "c", "explanation": "The text explicitly states that when a philosopher interrogates other disciplines, 'he does so, not to compete with specialists in these disciplines, but to provide a clearing, a ground, for them to achieve security, acquire character, stature and maturity.'"}, {"question": "Which of the following correctly identifies the five questions addressed by epistemology as outlined in the session?", "options": {"a": "What is beauty, what is virtue, can logic be trusted, what is justice, and what is the meaning of life?", "b": "Can we know reality, by what medium, with certainty, to what extent can knowledge be valid, and what is the foundation of human knowledge?", "c": "What exists, is existence meaningful, can God be proven, is free will real, and is science reliable?", "d": "What is Being, what is non-being, can facts be known, what is truth, and how does language relate to reality?"}, "answer": "b", "explanation": "The session explicitly lists these five epistemological questions: (1) Can we know reality? (2) By what medium can we know reality? (3) Can we be certain we know reality? (4) To what extent can our claims be valid? (5) What is the foundation of human knowledge?"}, {"question": "The description of sciences as 'regional ontologies' means that:", "options": {"a": "Sciences are confined to specific geographic regions of the world", "b": "Each science deals with a particular aspect or profile of reality rather than Being in general", "c": "Sciences are inferior forms of philosophy restricted to observable phenomena", "d": "Ontology must be studied regionally before it can be studied universally"}, "answer": "b", "explanation": "Regional ontologies are the specialized sciences (metaphysica specialis) that 'deal with beings or particular aspects of what-is.' Each science investigates a particular dimension of reality, unlike metaphysica generalis which deals with Being in totality."}, {"question": "According to the session, which of the following best illustrates a scientist 'being metaphysical' without being a metaphysician?", "options": {"a": "A chemist publishing a paper on molecular bonding", "b": "A physicist conducting experiments in a laboratory", "c": "A historian asking whether history can be studied objectively or subjectively (meta-historical inquiry)", "d": "A biologist describing the anatomy of a newly discovered species"}, "answer": "c", "explanation": "The session states: 'The question whether history can be studied objectively or subjectively, empirically or supra-empirically is not history as history but a meta-historical inquiry.' When scientists raise questions about the ground of their being, they are 'being metaphysical' even though they are not metaphysicians."}, {"question": "Aristotle's formulation of metaphysics as 'being qua being' is distinct from Platonic metaphysics because:", "options": {"a": "Aristotle rejected the existence of any underlying reality", "b": "Aristotle focused on the study of being as being itself, not on searching for a hidden double of palpable reality", "c": "Aristotle believed only empirical science could study reality", "d": "Aristotle prioritized ethics over metaphysics in his philosophical system"}, "answer": "b", "explanation": "The text states Aristotle 'sketched the task of professional academic metaphysics as the study of being qua being, that is, the study of being precisely as being, not the study of aspects of being or the search of a hidden double of palpable existence.' This contrasts with Plato who sought Ideas as the hidden double of reality."}, {"question": "The Vienna Circle and A.J. Ayer's logical empiricism viewed metaphysics as:", "options": {"a": "The foundation of all genuine knowledge", "b": "A legitimate but secondary branch of philosophy", "c": "The disease of which philosophy and the positive sciences must be cured", "d": "Identical to the natural sciences in method and scope"}, "answer": "c", "explanation": "The session explicitly states: 'The positivism of the Vienna Circle of the 1920s and Ayer's logical empiricism, for instance, made no pretence that metaphysics was the disease of which philosophy and the positive sciences must be cured.'"}, {"question": "The text argues that positivism, in its attempt to destroy metaphysics, paradoxically became a metaphysics because:", "options": {"a": "Positivists read metaphysical texts and incorporated their ideas", "b": "By insisting that reality is 'a system of processes governed everywhere by the law of causality,' positivism made a definitive metaphysical pronouncement on reality", "c": "Positivists failed to conduct proper scientific experiments", "d": "The Vienna Circle dissolved before completing its anti-metaphysical program"}, "answer": "b", "explanation": "The session states that by 'making a definitive pronouncement on reality, that is, by insisting that reality is a system of processes governed everywhere by the law of causality, positivism elevated itself to the rank of classical metaphysics... this is how positivism becomes the metaphysics of science.'"}, {"question": "According to the session, why is any attempt to exterminate metaphysics self-defeating?", "options": {"a": "Because metaphysics has political protection from academic institutions", "b": "Because any project to exterminate metaphysics must itself adopt a metaphysical position, making the therapy the very ailment it seeks to cure", "c": "Because scientists secretly rely on metaphysics for funding", "d": "Because Aristotle's authority cannot be overturned by modern thinkers"}, "answer": "b", "explanation": "The text argues that 'any therapeutics (i.e. science of cure) of metaphysics is a metaphysics of its own, in which case the therapy is a rejuvenation and a reinvigoration of the ailment.' To repudiate metaphysics is to engage in a metaphysical act."}, {"question": "Metaphysica generalis is best understood as:", "options": {"a": "The collection of all specialized sciences grouped together", "b": "What remains of philosophy after fragmentation into positive sciences — the study of Being in general rather than particular aspects of being", "c": "The history of philosophy from ancient Greece to modern times", "d": "The application of metaphysical principles to political governance"}, "answer": "b", "explanation": "The session states: 'Metaphysica generalis is what is left of philosophy after the fragmentation and it deals with Being in general, reality in general or what-is in totality.' It is 'transcendental philosophy properly so-called.'"}, {"question": "The 'absolutization of reality' in traditional metaphysics refers to:", "options": {"a": "The scientific process of measuring reality with absolute precision", "b": "The tendency of every traditional metaphysician to adopt a single principle of reality and treat their own perspective as absolute, leaving no room for alternatives", "c": "Plato's proof that the Absolute Idea governs all material things", "d": "The claim that reality can be fully known through rational deduction alone"}, "answer": "b", "explanation": "The text describes how traditional metaphysics crystallized the mind-set that reality is one and knowable by a single subject, with each thinker claiming a 'God's eye perspective.' The result: 'My position, my perspective, is absolute and every other opposed perspective would count as nothing.'"}, {"question": "Which of the following correctly distinguishes 'informative philosophy' from 'interrogative philosophy'?", "options": {"a": "Informative philosophy asks original questions; interrogative philosophy records historical answers", "b": "Informative philosophy is the history of philosophy (indirect exposure to Being); interrogative philosophy is the philosophy of other disciplines", "c": "Informative philosophy deals with facts; interrogative philosophy deals with values", "d": "Informative philosophy is epistemology; interrogative philosophy is axiology"}, "answer": "b", "explanation": "The session states: 'Informative philosophy is conventionally treated as history of philosophy. Interrogative or investigative philosophy is the philosophy of other disciplines.' Informative philosophy provides an indirect exposure to Being by acquainting students with what preceding philosophers have said."}, {"question": "Heraclitus' contribution to Greek metaphysics was the thesis that:", "options": {"a": "Being is permanent and change is illusory", "b": "The Idea is the ultimate principle governing reality", "c": "Being is impermanence — reality is in a perpetual state of flux or constant change", "d": "Human subjectivity determines the nature of what is real"}, "answer": "c", "explanation": "The session states: 'Heraclitan thesis... that Being is impermanence, that is, that Reality is in a perpetual state of flux or constant change.' This directly opposes Parmenides who held Being as permanence."}, {"question": "Parmenides' metaphysical position holds that:", "options": {"a": "Reality consists of multiple substances competing for dominance", "b": "Non-being, change, alteration, and plurality are real features of existence", "c": "Being is the 'One' and permanence, and non-being, change, and plurality are illusory", "d": "The human mind cannot access the ultimate nature of reality"}, "answer": "c", "explanation": "The text states: 'Parmenides insisting on the \"One,\" the \"It is\" as Being and Being as permanence. In the Parmenidean system, non-being, change, alteration and plurality are illusory features of Reality.'"}, {"question": "The statement 'every science prostitutes with metaphysics' is best interpreted to mean:", "options": {"a": "Scientists secretly practice occultism", "b": "All sciences depend on and use metaphysical foundations while publicly denying or vilifying metaphysics", "c": "Metaphysics is a corrupt discipline that corrupts every field it touches", "d": "Prostitution is a metaphysical concept in academic philosophy"}, "answer": "b", "explanation": "The text states: 'every science prostitutes with metaphysics but like the hapless prostitute, almost everyone (including those who employ her services) vilifies it.' The sciences depend on metaphysical foundations but denounce metaphysics, like clients who deny employing a service they actually use."}, {"question": "According to the session, neo-metaphysicism differs from traditional metaphysical thinking primarily in that:", "options": {"a": "Neo-metaphysicism is practiced only by professional philosophers while traditional metaphysics was for everyone", "b": "Neo-metaphysicism is the same absolutist dogmatic temperament but manifested in daily life and social discourse, not just in grand metaphysical systems", "c": "Neo-metaphysicism accepts multiple perspectives while traditional metaphysics did not", "d": "Neo-metaphysicism is associated with Western philosophy while traditional metaphysics is African"}, "answer": "b", "explanation": "The session describes neo-metaphysicism as the know-it-a
