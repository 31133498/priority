parison mean?", "options": {"a": "Logic uses numerical operations rather than narrative accounts", "b": "Logic operates with universal, necessary rules — like arithmetic — rather than contingent, particular historical facts", "c": "Logic was developed later than history as a discipline but earlier than arithmetic", "d": "Logic focuses on quantitative relationships more than qualitative analysis"}, "answer": "b", "explanation": "The comparison highlights that logic, like arithmetic, deals with universal and necessary rules that hold in all contexts. History, by contrast, records particular contingent events. Logic is not context-specific — its laws are universal."}, {"question": "Alfred Tarski's view of logic, as stated in this session, is that logic:", "options": {"a": "Studies the psychological processes by which humans form beliefs", "b": "Provides a framework for evaluating historical and social evidence", "c": "Establishes rules for conducting scientific experiments", "d": "Analyzes the meanings of concepts common to all sciences and establishes the general laws governing them"}, "answer": "d", "explanation": "Tarski defined logic as the discipline that analyzes meanings of concepts common to all sciences and establishes their general governing laws — a broader, cross-disciplinary scope for logic."}, {"question": "Jean Oesterle's description of logic as an 'art' that guides us toward knowledge most directly implies which of the following?", "options": {"a": "Logic is a practical, learnable instrument for acquiring knowledge that was previously unknown to us", "b": "Logic is an aesthetic discipline related to music and the visual arts", "c": "Logic operates independently of reason and does not require systematic rules", "d": "Logic is self-sufficient and can answer all scientific and moral questions on its own"}, "answer": "a", "explanation": "Oesterle emphasizes logic's instrumental and epistemic function — it is a learnable art (skill) that leads us from what we know toward what we did not previously know, making it essential for scientific knowing."}, {"question": "Why is any attempt to reject or attack logic through argumentation necessarily self-defeating?", "options": {"a": "Because logic is defined by institutional authority and therefore cannot be challenged", "b": "Because any coherent attack on logic must use logical reasoning, meaning the attacker relies on the very thing they seek to reject", "c": "Because logic is derived from mathematics and mathematics is universally accepted as unquestionable", "d": "Because rejecting logic also requires rejecting language, making communication impossible"}, "answer": "b", "explanation": "Any structured argument against logic necessarily employs logical reasoning (premises, inference, conclusion). This means the attack presupposes and relies on the very thing it denies, making it self-contradictory."}, {"question": "Which of the following correctly distinguishes logic as 'prescriptive' from psychology as 'descriptive'?", "options": {"a": "Logic describes what is logically possible; psychology describes what is psychologically real", "b": "Logic uses formal symbols; psychology uses natural language descriptions", "c": "Logic tells us how we ought to reason if we wish to reason correctly; psychology reports how people actually reason", "d": "Logic is a natural science; psychology is a social science"}, "answer": "c", "explanation": "The prescriptive nature of logic means it sets standards and rules for correct reasoning. Psychology's descriptive nature means it reports actual cognitive behavior — including habitual errors, emotional biases, and developmental stages."}, {"question": "Which of the following is CORRECT about logic as a skill, according to this study session?", "options": {"a": "Logic must be learnt and practised, though some may be better at it than others — similar to games and languages", "b": "Logic is an innate ability that all humans are born with equally", "c": "Only trained philosophers and mathematicians need to apply logic in their work", "d": "Logic is impossible to learn without a prior grounding in mathematics"}, "answer": "a", "explanation": "The text explicitly states that logic is not an inborn skill but must be learnt and practised. It also notes that some may be better at it than others, comparing it to learning games and languages."}, {"question": "The Law of Identity (A is A), as applied to the domain of law and morality in the text, primarily means:", "options": {"a": "Every law must be applied equally to all people without distinction", "b": "Moral standards are identical across all cultures and historical periods", "c": "Logic and morality are one and the same system of rules", "d": "A particular action must be identified and recognized for what it actually is, without confusion with other actions"}, "answer": "d", "explanation": "The Law of Identity applied to law and morality means correctly identifying an action as what it is (A as A) — the foundation of legal identification and proper classification of actions and offences."}, {"question": "The Law of Excluded Middle, as applied to law and morality in the text, refers to:", "options": {"a": "The legal principle that the middle class has no special rights under the law", "b": "Understanding how a law can be applied and how an action can be evaluated based on binary legal possibilities", "c": "The rule that moral decisions must always be made quickly without room for deliberation", "d": "The logical proof that morality is ultimately reducible to mathematical calculation"}, "answer": "b", "explanation": "The Law of Excluded Middle is used in the context of law to understand the likely ways a law can be applied and how an action can be legally evaluated — it provides the binary framework for legal judgment."}, {"question": "According to Frege, what is logic's primary task?", "options": {"a": "To study the psychological processes that accompany the discovery of truth in science", "b": "To establish probabilistic laws for evaluating competing scientific hypotheses", "c": "To discover the laws of truth — not the laws of assertion or thought", "d": "To provide a symbolic notation system for constructing mathematical proof"}, "answer": "c", "explanation": "Frege made a precise distinction: logic discovers the laws of truth itself, not the laws of thinking about truth (psychology) or asserting truth (epistemology). This gives logic its unique, objective character."}, {"question": "Which scholar articulated a mathematical theory of infinite numbers and continuity, thereby removing much of the mysticism that had previously obscured mathematics?", "options": {"a": "George Cantor", "b": "C. S. Pierce", "c": "Karl Weierstrass", "d": "Giuseppe Peano"}, "answer": "a", "explanation": "George Cantor developed the mathematical theory of infinite numbers and continuity, an achievement that abolished a great deal of the mysticism which had obscured mathematics before his time."}, {"question": "The text states that the logicist programme 'did not succeed in its primary objective.' What does this most accurately reveal about the relationship between logic and mathematics?", "options": {"a": "Logic and mathematics have been shown to be completely unrelated disciplines", "b": "Mathematics has since been proven to be fully independent of logic", "c": "Russell abandoned the project before any meaningful progress could be made", "d": "Though logic and mathematics are closely and genuinely related, reducing pure mathematics entirely to logic alone proved unachievable"}, "answer": "d", "explanation": "The failure of the logicist programme does not sever the logic-mathematics relationship — it only shows that a complete reduction of mathematics to pure logic is not achievable. The disciplines remain deeply linked but distinct."}, {"question": "Jean Oesterle's statement that logic guides us 'in coming to know something previously unknown' most closely identifies logic's role as:", "options": {"a": "A means of aesthetic communication and stylistic expression", "b": "An instrument for acquiring new knowledge from what is already known", "c": "A system for classifying and cataloguing existing facts", "d": "A therapeutic tool for resolving personal moral dilemmas"}, "answer": "b", "explanation": "Oesterle highlights logic's epistemic (knowledge-generating) function: it leads the mind from what it already knows to what was previously unknown, making it the primary instrument of scientific and philosophical discovery."}, {"question": "How does logic relate to natural science, according to this study session?", "options": {"a": "Logic replaces the need for experimental verification in theoretical natural science", "b": "Logic determines which scientific hypotheses are morally and socially acceptable", "c": "Logic serves as a tool of inference to deduce empirical consequences from hypotheses, which are then subjected to experimental testing", "d": "Logic and natural science operate in entirely separate and non-overlapping domains"}, "answer": "c", "explanation": "Logic is used in natural science to deduce what empirical consequences follow from a hypothesis. Those consequences are then tested experimentally. Logic handles the inference; experimentation handles the verification."}, {"question": "J. S. Mill's methods of inductive logic were specifically designed to accomplish which of the following?", "options": {"a": "Assist in the discovery of causal connections between phenomena in nature", "b": "Prove that all scientific truths can be derived logically without any need for observation", "c": "Establish a probabilistic framework for evaluating competing scientific theories", "d": "Demonstrate that inductive reasoning and deductive reasoning are fundamentally identical"}, "answer": "a", "explanation": "Mill's methods were specifically intended to help scientists identify causal relationships between natural phenomena, giving inductive logic a practical scientific role beyond Bacon's earlier critique of simple enumeration."}, {"question": "The text argues that if logic were rejected from moral reasoning, 'there is no distinction between the good and the bad, right and wrong, just and unjust.' This is most precisely because:", "options": {"a": "Morality is identical to logic and depends entirely on formal syllogistic proof", "b": "The rejection of logic automatically and directly causes criminal behaviour in society", "c": "Social constructs and laws are invented exclusively by trained logicians", "d": "Without logical standards — rules of identity, non-contradiction, and evaluation — there is no principled basis for making or sustaining moral distinctions"}, "answer": "d", "explanation": "Moral distinctions require the application of consistent logical principles (identity, non-contradiction, excluded middle). Without these logical tools, there is no rational foundation for differentiating moral categories."}, {"question": "According to this study session, which of the following best explains why EVERY human being should study logic?", "options": {"a": "Because logic is a prerequisite for formal education in mathematics and computer science", "b": "Because logic is an indispensable means of obtaining knowledge more easily, more surely, and more efficiently", "c": "Because logic provides the only correct and reliable method for settling moral and legal disputes", "d": "Because studying logic is required for professional advancement in all academic and vocational careers"}, "answer": "b", "explanation": "The text cites Jean Oesterle's argument: since every human being desires knowledge to some degree, and since logic is the indispensable instrument for acquiring knowledge more easily, surely, and efficiently, it is of use to every human being."}, {"question": "Rudolf Carnap's contribution to the relationship between logic and science, as part of logical positivism, was:", "options": {"a": "Demonstrating how the theory of calculus can be established without infinitesimals", "b": "Developing the formal theory of relations in mathematical logic", "c": "Emphasizing a probabilistic theory of inductive logic for the sciences", "d": "Providing a synthesis of fundamental theories in mathematical logic attributed to Schroeder"}, "answer": "c", "explanation": "Carnap, as a logical positivist, emphasized that the inductive logic used in science takes the form of a probabilistic theory — extending and systematizing earlier inductivist philosophy of science."}, {"question": "The text states that logic as a systematic discipline 'dates as far back as half a millennium' and is 'much older than most recent academic fields, social constructs and institutions, and even religions.' What is the key significance of this claim?", "options": {"a": "The long history of logic demonstrates its enduring relevance and validity across different eras, civilizations, and fields of human activity", "b": "Logic predates even philosophy and mathematics as a discipline of human inquiry", "c": "Logic is relevant only in its classical pre-modern form before the emergence of modern sciences", "d": "Logic was formalized as a discipline before the invention of written language or numerical systems"}, "answer": "a", "explanation": "The longevity of logic as a systematic discipline — predating most modern fields and institutions — is cited to establish its tested, enduring relevance across human civilizations and intellectual endeavors."}, {"question": "The text applies the three laws of thought to law and morality. Which option correctly maps all three laws to their legal or moral applications as described in the session?", "options": {"a": "Identity = not confusing punishments; Contradiction = identifying an action; Excluded Middle = applying all laws", "b": "Identity = applying laws equally to all; Contradiction = distinguishing good from evil; Excluded Middle = resolving paradoxes", "c": "Identity = logical consistency in judgments; Contradiction = criminal sentencing procedure; Excluded Middle = appeal processes", "d": "Identity = identifying an action as what it is; Contradiction = not confusing an action or its punishment with another; Excluded Middle = understanding how a law can be applied and an action evaluated"}, "answer": "d", "explanation": "The text maps the three laws directly: Identity (A as A) = recognizing an action for what it is; Contradiction = not confusing an action or its punishment with another; Excluded Middle = understanding the ways a law can be applied and how an action can be evaluated."}, {"question": "C. S. Pierce's specific and named contribution to the development of mathematical logic was:", "options": {"a": "Publishing a treatise on the calculus of class inclusion", "b": "Developing a theory of relations", "c": "Inventing the first complete formal symbolic notation for deductive logic", "d": "Establishing the probabilistic framework that Carnap later formalized"}, "answer": "b", "explanation": "The text explicitly identifies C. S. Pierce as having 'developed a theory of relations' as his contribution to mathematical logic — a foundational contribution to formal logic distinct from Boole's class calculus."}, {"question": "The text states that 'a computer is a logic machine' and 'a mind is at least in part a logic machine.' This is primarily used to support which conclusion about the scope of logic?", "options": {"a": "Computers are more reliably logical than humans and will eventually replace human reasoning in all domains", "b": "Logic is a purely mechanical and algorithmic process with no creative or intuitive element", "c": "Logic lies at the foundation of computer science, cognitive science, and philosophy of mind — establishing it as a foundational discipline across multiple fields beyond philosophy", "d": "The practical study of logic is only relevant to people working in technology and engineering"}, "answer": "c", "explanation": "The text uses the computer-mind analogy to demonstrate that logic is not confined to philosophy and mathematics but is foundational to computer science, cognitive science, and the philosophy of mind — illustrating its extraordinary breadth and relevance."}]}, {"session": 7, "topic": "Fallacies", "points": ["Human knowledge is essentially inferential — Kant asserts that by in-built laws of the mind we think in terms of association, causation, and succession, linking ideas and events.", "Inferential thinking is a process of abstraction or extraction by which we combine or synthesize occurrences in the world to arrive at a judgment.", "Inference in logic is the reasoning process by which we transit from premises to conclusion — defined by Uduigwomen as 'the ability to discern and describe the connections between terms and statements whose association may not be immediately apparent.'", "The logician is NOT concerned with the process of inference itself but with its outcomes — the arguments produced by reasoning that can be formulated, examined, and analyzed (Copi and Cohen).", "Argument is the subject matter (theme) of logic; logic is defined as the criteria for the evaluation of argument.", "An argument is any group of propositions of which one (the conclusion) is claimed to follow from the others (the premises), which are regarded as providing support or grounds for the truth of that one (Copi and Cohen).", "Argumentation is the act of methodically and structurally arranging propositions into premises and conclusion — it is the formal substantiation of inference in structural form.", "Argument in logic does NOT mean debate or controversy — it refers to the reasoning or inferential procedure that results in the soundness of a completed reasoning process.", "The three constituent elements of every argument are: (a) propositions, (b) premises, and (c) conclusion.", "A proposition is a declarative sentence that either asserts or denies something — logic deals exclusively with declarative propositions; exclamatory, interrogative, and imperative sentences are excluded.", "Premises are the building blocks and the 'legs' on which a conclusion stands; premise indicators include 'since,' 'because,' 'for,' 'as,' 'follows from,' 'may be inferred from,' 'in view of the fact that.'", "Conclusion indicators include 'therefore,' 'hence,' 'thus,' 'so,' 'accordingly,' 'consequently,' 'it follows that,' 'we may infer,' 'I conclude that,' 'which entails that.'", "Momoh defines a conclusion as the peak or apex of the premises — the logical confluence where the premises 'hang things together' and the implicational knot is tied.", "Deduction and induction are the two fundamental methods of inference and argument; deduction is the general rule of logic while induction is the particular rule of logic.", "A deductive argument is one whose premises are claimed to provide conclusive grounds for the truth of its conclusion — if premises are true, the conclusion follows with absolute necessity (Copi and Cohen).", "A deductive argument is valid when it is impossible for its premises to be true and its conclusion false — every deductive argument is either valid or invalid, with no intermediate states.", "The conventional definition of deduction as moving 'from general to particular' is incomplete and misleading because deductive arguments can also move from general to general, or from particular to particular.", "The four standard methods of testing validity are: (1) Syllogisms and Venn Diagrams, (2) Truth Tables, (3) Rules of Inference, and (4) Rules of Replacement — the first two belong to classical (Aristotelian) logic, the last two to modern symbolic logic.", "An inductive argument is one whose conclusion is claimed to follow from its premises only with probability — this probability is a matter of degree and dependent upon what else may be the case (Copi and Cohen).", "Inductive arguments are assessed as 'correct or incorrect,' 'stronger or weaker,' or 'better or worse' — the terms valid/invalid do NOT apply to inductive arguments.", "The four key characteristics of inductive arguments are: (a) probabilistic, (b) analogous, (c) non-demonstrative, and (d) ampliative.", "Inductive arguments are ampliative because their conclusions expand beyond the content of the premises — the conclusions implicitly contain new information not present in the premises.", "Inductive arguments are non-demonstrative because no number of particular confirmations constitutes sufficient grounds for their conclusions, making the justification of inductive arguments permanently problematic.", "David Hume articulated the experiential basis of induction: 'all arguments from experience are founded on the similarity which we discover among natural objects, and by which we are induced to expect effects similar to those which we have found to follow from such objects.'", "The method of analogy is the act of comparing or inferring a relationship between two dissimilar things or events; analogy by deduction is holistic (concerned with complex wholes), while analogy by induction is atomistic (concerned with simple parts).", "Truth and falsity are attributes of propositions alone; validity/invalidity, correctness/incorrectness, and soundness/unsoundness are attributes of arguments — these categories must never be confused.", "Validity/invalidity applies exclusively to deductive arguments; correct/incorrect applies to inductive arguments — but soundness is a shared standard applicable when any argument is both well-formed and has true premises.", "An argument is sound when it is: (a) valid, (b) has all true premises, and (c) has a true conclusion — defined by Uduma as 'a valid argument with all true premises and a true conclusion.'", "Logical correctness is determined by both form (rational coherence) and content (empirical correspondence) — an argument cannot be complete or sound if reason and fact do not cohere.", "The concern of logic and the logician is with the logical relations between propositions that determine the correctness of arguments — logicians are interested in correctness even when an argument's premises are false."], "questions": [{"question": "According to Copi and Cohen, what is the primary concern of the logician?", "options": {"a": "The psychological process of inference itself", "b": "The arguments that are the outcomes of reasoning", "c": "The truth or falsity of individual propositions", "d": "The empirical verification of premises"}, "answer": "b", "explanation": "Copi and Cohen explicitly state: 'It is not the thought processes called reasoning (inference) that are the logician's concern, but the outcomes of those processes, the arguments that are the products of reasoning, and that can be formulated in writing, examined, and analyzed.'"}, {"question": "Which of the following sentences can logic deal with?", "options": {"a": "Who is the president of Nigeria?", "b": "Please submit your assignment.", "c": "Abuja is the capital of Nigeria.", "d": "What an amazing result!"}, "answer": "c", "explanation": "Logic deals only with declarative propositions — statements that can be affirmed as true or denied as false. Interrogative ('Who is...?'), imperative ('Please submit...'), and exclamatory ('What an amazing...!') sentences are excluded."}, {"question": "Which of the following is a premise indicator?", "options": {"a": "Therefore", "b": "Hence", "c": "In view of the fact that", "d": "Consequently"}, "answer": "c", "explanation": "'In view of the fact that' is listed as a premise indicator. 'Therefore,' 'hence,' and 'consequently' are all conclusion indicators."}, {"question": "A deductive argument with false premises but a valid logical form is best described as:", "options": {"a": "Sound and valid", "b": "Valid but unsound", "c": "Correct but invalid", "d": "Invalid and unsound"}, "answer": "b", "explanation": "Validity is a formal property — an argument is valid if the conclusion necessarily follows from the premises regardless of their actual truth. However, soundness requires both validity AND true premises. An argument with false premises can be valid but cannot be sound."}, {"question": "The defining difference between a deductive and an inductive argument is:", "options": {"a": "Deduction moves from particular to general; induction from general to particular", "b": "Deductive conclusions follow with absolute necessity; inductive conclusions follow only with probability", "c": "Deduction applies only to science; induction applies only to philosophy", "d": "Deductive arguments have premises; inductive arguments do not"}, "answer": "b", "explanation": "The fundamental distinction is certainty vs. probability. A deductive argument is 'one whose conclusion is claimed to follow from its premises with absolute necessity,' while an inductive argument is 'one whose conclusion is claimed to follow its premises only with probability, this probability being a matter of degree.'"}, {"question": "Which of the following correctly describes the 'ampliative' characteristic of inductive arguments?", "options": {"a": "The premises completely determine the truth of the conclusion", "b": "The conclusion expands beyond the information contained in the premises", "c": "The argument always proceeds from particular to general", "d": "The argument can be empirically verified through observation"}, "answer": "b", "explanation": "Inductive arguments are ampliative because 'the conclusions of inductive arguments expand beyond the content of the premises' — they implicitly contain new information not present in the premises."}, {"question": "Consider: 'All hardworking students are bright; all bright students have good grades; therefore, all hardworking students have good grades.' What type of deductive argument is this?", "options": {"a": "Particular to particular", "b": "Particular to general", "c": "General to particular", "d": "General to general"}, "answer": "d", "explanation": "Both premises and the conclusion are universal/general statements using 'all.' This illustrates that deduction is not always from general to particular — it can proceed from general to general, disproving the conventional but incomplete definition."}, {"question": "An argument is said to be sound when:", "options": {"a": "It is valid regardless of the truth of its premises", "b": "Its conclusion is probable given the premises", "c": "It is valid, all premises are true, and the conclusion is true", "d": "Its propositions are declarative sentences"}, "answer": "c", "explanation": "Uduma defines soundness: 'an argument is said to be sound if (a) it is valid, (b) all its premises are true, and (c) its conclusion is true.' Copi and Cohen concur: 'when an argument is valid, and all of its premises are true, we call it sound.'"}, {"question": "Which of the following is a characteristic of inductive arguments but NOT of deductive arguments?", "options": {"a": "Composed of propositions as premises and conclusions", "b": "Can be appraised as either sound or unsound", "c": "Conclusions are only probable, not certain", "d": "Can be assessed as correct or incorrect"}, "answer": "c", "explanation": "Only inductive arguments yield conclusions that are merely probable. Deductive arguments, when valid, yield conclusions that follow with absolute necessity. Both can be composed of propositions, both can be sound, and while 'correct/incorrect' primarily applies to inductive arguments, 'valid/invalid' applies to deductive ones."}, {"question": "David Hume's contribution to understanding inductive inference is best described as:", "options": {"a": "Showing that inductive arguments can be demonstratively valid", "b": "Establishing that all arguments from experience are founded on similarity discovered among natural objects", "c": "Proving that induction yields certainty when enough instances are observed", "d": "Defining induction as a form of deductive reasoning"}, "answer": "b", "explanation": "Hume stated: 'all arguments from experience are founded on the similarity which we discover among natural objects, and by which we are induced to expect effects similar to those which we have found to follow from such objects.' This grounds induction in experiential similarity."}, {"question": "Which pair of validity-testing methods belongs to classical Aristotelian logic?", "options": {"a": "Rules of Inference and Rules of Replacement", "b": "Truth Tables and Rules of Inference", "c": "Syllogisms/Venn Diagrams and Truth Tables", "d": "Venn Diagrams and Rules of Replacement"}, "answer": "c", "explanation": "'Syllogisms/Venn Diagrams and Truth Tables belong under classical logic and are rooted in the analytical works of Aristotle, while The Rules of Inference and The Rules of Replacement are techniques of modern symbolic logic' (Copi and Cohen)."}, {"question": "Momoh defines a premise as:", "options": {"a": "The apex of an argument where the implicational knot is tied", "b": "The building block of a conclusion — the prop or leg on which a conclusion stands", "c": "Any declarative sentence that can be affirmed or denied", "d": "The final judgment made as a result of inferential reasoning"}, "answer": "b", "explanation": "Momoh defines a premise as: 'the building block of a conclusion, it is the prop, the leg on which a conclusion stands. Wherever an argument is present there must be a premise or a set of premises which provide the logical, inferential or implicational leg or legs for the conclusion to stand.'"}, {"question": "Analogy by deduction is described as 'holistic' while analogy by induction is 'atomistic.' This means:", "options": {"a": "Deduction examines isolated facts while induction examines the big picture", "b": "Deduction sees relationships between complex wholes; induction sees relationships between simple parts", "c": "Deduction is more accurate than induction because it looks at everything", "d": "Induction is holistic because it generalizes from many instances"}, "answer": "b", "explanation": "The session explains: 'by the rule of general logic (reason) we see relationship between complex things' (holistic deduction), 'and by the rule of particular logic (the senses) we see relationship between simple things' (atomistic induction), citing Kant."}, {"question": "Why is the conventional definition of inductive inference as 'reasoning from particular to general' described as misleading?", "options": {"a": "Because induction never actually leads to general conclusions", "b": "Because inductive inference can also move from general to general or from particular to particular", "c": "Because induction is actually a deductive method", "d": "Because induction only considers past instances"}, "answer": "b", "explanation": "The session explicitly states the conventional definition 'can be misleading' because 'in inductive inference, we can move from general to general or from universal to universal and from particular to particular' — not only from particular to general."}, {"question": "Truth and falsity are properly attributed to which of the following?", "options": {"a": "Arguments", "b": "Deductive inferences", "c": "Propositions", "d": "Methods of inference"}, "answer": "c", "explanation": "'Truth and falsity are attributes of proposition in logic.' Validity/invalidity and correctness/incorrectness are attributes of arguments, not propositions. This distinction is fundamental to logical analysis."}, {"question": "Which of the following inductive argument examples moves from particular premises to a particular conclusion?", "options": {"a": "All academics are intelligent; therefore, intending academics will probably be intelligent", "b": "Akpan, Amadi, and Gani are all democratic; therefore probably all labour leaders are democrats", "c": "Idi Amin was a tyrant; Abacha was a tyrant; therefore Abubakar would probably be a tyrant", "d": "Amadi a trader is a liar; Bode a trader is a liar; therefore all traders are liars"}, "answer": "c", "explanation": "The Idi Amin/Abacha example has specific named individuals as premises (particulars) and Abubakar as the conclusion (also a particular). Options b and d move from particular premises to a universal conclusion; option a moves from a general premise to a general conclusion."}, {"question": "The relationship between argument and inference in logic is best described as:", "options": {"a": "They are completely different processes with no connection", "b": "Inference determines the process of argument, while argument is the very structure of the inferential process", "c": "Argument is more important than inference in logic", "d": "Inference replaces argument in modern symbolic logic"}, "answer": "b", "explanation": "The session states: 'inference determines the process of argument, argument is in itself the very structure of the inferential process.' They are interconnected: argument is not possible without inference, and inference produces arguments as its outcome."}, {"question": "An argument whose propositions are logically coherent but factually false would be described by a logician as:", "options": {"a": "Invalid, because the premises are false", "b": "Valid but unsound, since the logician is interested in correctness of form even with false premises", "c": "Sound, because the logical form is correct", "d": "Incorrect, because logic requires empirical truth"}, "answer": "b", "explanation": "The session notes that arguments with false premises can still be valid 'because by form, they are coherent,' adding that 'the logician is interested in the correctness even of arguments whose premises may be false.' However, such arguments are not sound since soundness requires true premises."}, {"question": "What does Kant mean by the 'in-built laws of the mind' in relation to inference?", "options": {"a": "That human beings are born with logical knowledge", "b": "That we naturally think in terms of association, causation, and succession, creating links between ideas and events", "c": "That the rules of logic are fixed and unchanging", "d": "That inference is instinctive and requires no education"}, "answer": "b", "explanation": "Kant (1964) states: 'By the in-built laws of our minds, we think in terms of association, causation, succession; which explains the reason why we always see a link or affinity between ideas, and events of the world.' This grounds the universality of inferential thinking."}, {"question": "Logical form requires that an argument must have both 'form' and 'content.' What do these terms mean respectively?", "options": {"a": "The number of premises and the length of the conclusion", "b": "Rational coherence and empirical correspondence", "c": "Deductive structure and inductive probability", "d": "Validity and soundness"}, "answer": "b", "explanation": "The session defines: 'By form we mean rational coherence, while by content we mean empirical correspondence. Hence an argument cannot be said to be complete or sound if reason and fact do not cohere — the logical form of an argument must correspond with its content.'"}, {"question": "Which statement about the test of validity is most accurate?", "options": {"a": "It is concerned with the truth or falsity of each proposition in an argument", "b": "It deals with the form and quality of deductive inference", "c": "It is equally applicable to both inductive and deductive arguments", "d": "It was established exclusively by Aristotle"}, "answer": "b", "explanation": "The session states: 'to talk about the test of validity is to deal with the form and quality of deductive inference.' Validity is 'akin to deductive argument' — inductive arguments are not assessed using validity at all."}, {"question": "Inferential thinking enables a transition 'from the known to the unknown.' Which statement best explains this?", "options": {"a": "We discover entirely new knowledge with no reference to existing knowledge", "b": "Premises (known) provide the basis from which conclusions (unknown or new information) are derived", "c": "Induction allows us to know future events with certainty", "d": "The unknown is derived through empirical observation alone"}, "answer": "b", "explanation": "The session explains that inference 'enables the transition from the premises to the conclusion' — the premises are the known (available information) and the conclusion is the unknown (new information derived from them), making 'allowance for a transition from the known to the unknown.'"}, {"question": "Inductive inference leads to 'over-generalization' while deductive inference acts as a check on this. What does this mean?", "options": {"a": "Deduction is always more accurate than induction", "b": "Induction tends toward a high degree of probability while deduction seeks a high degree of confirmation or corroboration", "c": "Deduction eliminates all uncertainty in knowledge", "d": "Induction should be avoided in scientific reasoning"}, "answer": "b", "explanation": "The session states: 'The inductive inference leads to over generalization or a high degree of probability... the deductive inference helps to tame the attitude of overgeneralization. Instead of seeking for high degree of probability, we seek for a high degree of confirmation or corroboration among things or events.'"}, {"question": "The definition of argument provided by Copi and Cohen emphasizes that an argument:", "options": {"a": "Is a debate between two opposing viewpoints", "b": "Is any group of propositions where one is claimed to follow from the others", "c": "Must contain at least three propositions to be valid", "d": "Must be expressed in formal symbolic notation"}, "answer": "b", "explanation": "Copi and Cohen define argument as 'any group of propositions of which one is claimed to follow from the others, which are regarded as providing support or grounds for the truth of that one.' This definition emphasizes following-from (entailment), not debate."}, {"question": "Which of the following correctly distinguishes between inductive 'correctness' and deductive 'validity'?", "options": {"a": "Both terms mean the same thing in logic", "b": "Validity means the conclusion necessarily follows from premises; correctness means premises probabilistically support the inductive claim", "c": "Correctness is a stricter standard than validity", "d": "Validity applies to all arguments while correctness applies only to induction"}, "answer": "b", "explanation": "The session specifies: 'A deductive argument is correct when valid and valid if the premises cannot be true and the conclusion false; on the other hand an inductive argument is correct when the premises if true justify the inductive claim.' Validity involves necessity; correctness involves probability."}, {"question": "What does it mean that 'inference is not possible without linking one occurrence to another'?", "options": {"a": "Inference requires at least two premises", "b": "The act of inference is purely mental and consists in connecting events or facts to arrive at a judgment", "c": "Inference must always be expressed in formal language", "d": "Only trained logicians can perform valid inferences"}, "answer": "b", "explanation": "The session explains: 'Inference is not possible without linking one occurrence (event) to another. This act is purely mental and is not possible without judgment.' This applies equally to detectives, mechanics, lawyers, and judges — all engage in inference by linking facts."}, {"question": "Why do logicians 'pay little attention' to deductive arguments with false premises and false conclusions even when they are formally valid?", "options": {"a": "Because such arguments are always invalid", "b": "Because logic essentially deals with the truth or falsity of the premises of arguments", "c": "Because false premises can never produce a valid argument", "d": "Because such arguments are considered inductive"}, "answer": "b", "explanation": "The session notes: 'logicians pay little attention to this type of argument because logic essentially deals with the truth or falsity of the premises of arguments.' While formally valid, such arguments are practically irrelevant because their premises are false."}, {"question": "The description of both inductive and deductive inference as 'conjectural, analogous and probabilistic' implies that:", "options": {"a": "Deduction can never yield certainty", "b": "All human inferential knowledge, at a fundamental level, involves speculation and analogy about an interconnected universe", "c": "Induction and deduction are identical methods", "d": "Logic cannot provide reliable knowledge"}, "answer": "b", "explanation": "The session argues that 'as methods of inference, induction and deduction are conjectural, analogous and probabilistic' because 'inferences are speculations or systematic conjectures about the future' and 'we believe that events and things of the world are interlinked.' Both methods share this fundamental epistemic character."}, {"question": "A valid deductive argument with premises 'Spiders have wings' and 'Creatures with wings are insects' concluding 'Spiders are insects' illustrates which logical principle?", "options": {"a": "An argument must have true premises to be valid", "b": "Validity is a formal property that depends on the structure of argument, not the actual truth of premises", "c": "This argument is invalid because spiders are not insects", "d": "False premises always produce invalid arguments"}, "answer": "b", "explanation": "The session explicitly uses this example to show that arguments can be formally valid (coherent in structure) even with false premises and a false conclusion. The conclusion follows necessarily from the premises by form, making it valid — but not sound, since the premises are false."}, {"question": "What is the role of 'argument' in establishing the procedure of logic?", "options": {"a": "Argument tells us what to infer and how to infer", "b": "Argument establishes the procedure by which we can logically determine whether our inference is valid or invalid", "c": "Argument replaces inference in formal logic", "d": "Argument is only relevant to empirical sciences"}, "answer": "b", "explanation": "The session states: 'it is not the duty of argument or logic to tell us what to infer or how to infer, rather, what argument helps us to achieve is to establish the procedure by which we can logically determine whether our inference is valid or invalid, correct or incorrect.'"}]}, {"session": 8, "topic": "Ethics and Moral Philosophy", "points": ["Logic is defined as the study of methods and principles used to distinguish good (correct) from bad (incorrect) reasoning, and it employs the laws of thought and rules of inference to achieve this goal.", "The three fundamental laws of thought are the Law of Identity, the Law of Contradiction (Non-contradiction), and the Law of Excluded Middle — each is a self-evident truth that guides human thinking.", "The Law of Identity states that every object has an attribute peculiar to it; symbolised as p → p, every proposition of this form is a tautology (necessarily true because it implies itself).", "The Law of Contradiction states that the same attribute cannot at the same time belong and not belong to the same object in the same respect; symbolised as ¬(p ∧ ¬p), making p ∧ ¬p necessarily false.", "The Law of Excluded Middle resolves contradiction by asserting that any statement is either true or false — nothing in between; symbolised as p ∨ ¬p, which is necessarily true.", "The Law of Identity faces criticism from advocates of philosophy of change who argue it cannot account for change in reality; logic resolves this by requiring fully-formulated, changeless (non-elliptical) statements.", "The Law of Contradiction is challenged by Heraclitean, Marxist, and Hegelian philosophies that treat conflicting forces (e.g., rich vs. poor) as its foundation; Copi counters that such opposing classes merely have conflicting attributes and are not logically contradictory.", "The Law of Excluded Middle is challenged by Logical Positivism, which deems assertions like 'God either exists or does not' as meaningless; Anele responds that the principle applies only to genuine propositions, not to meaningless assertions.", "The nine elementary formal rules of inference are: Modus Ponens (M.P.), Modus Tollens (M.T.), Hypothetical Syllogism (H.S.), Absorption (Abs.), Disjunctive Syllogism (D.S.), Addition (Add.), Conjunction (Conj.), Simplification (Simp.), and Constructive Dilemma (C.D.).", "Modus Ponens (affirming the antecedent) has the valid form: p → q; p; therefore q — given a conditional and the affirmation of its antecedent, the consequent is validly concluded.", "Modus Tollens (denying the consequent) has the valid form: p → q; ¬q; therefore ¬p — given a conditional and the denial of its consequent, the antecedent is validly denied.", "Hypothetical Syllogism is a chain argument with the form p → q; q → r; therefore p → r, and it is valid because of the transitive character of the entailment relation.", "Absorption (Abs.) permits the inference from p → q to p → (p ∧ q), meaning that if p implies q, then p implies both itself and q simultaneously.", "Disjunctive Syllogism (D.S.) has the form: p ∨ q; ¬p; therefore q — given a disjunction and the denial of one disjunct, the other disjunct is validly concluded.", "Addition (Add.) permits the inference from a single premise p to p ∨ q; it is the only rule of inference in which the conclusion contains a proposition (q) that does not appear anywhere in the premise.", "Conjunction (Conj.) permits the inference from two separate true premises p and q to their conjunction p ∧ q — two independently existing statements are validly joined into one.", "Simplification (Simp.) moves from the complex to the simpler: given a conjunction p ∧ q as a single premise, the first conjunct p can be validly separated out as the conclusion.", "Constructive Dilemma (C.D.) has the form: (p → q) ∧ (r → s); p ∨ r; therefore q ∨ s — it employs at least four different variables, the largest number among all the rules of inference.", "A fallacy (from Latin 'fallere', meaning to deceive) is an argument that tends to be persuasive but does not provide logically adequate grounds for a change in belief; fallacies are classified as either formal or informal.", "Formal fallacies are fallacious by virtue of their logical form — they resemble valid logical forms and are always deductively invalid; the four types are Fallacies of Propositional Logic, Syllogistics, Predicate Logic, and Modal Logic.", "Affirming the Consequent (formal fallacy of propositional logic) has the invalid form: p → q; q; therefore p — it resembles Modus Ponens but illegitimately takes the consequent as the affirmed premise.", "Denying the Antecedent (formal fallacy of propositional logic) has the invalid form: p → q; ¬p; therefore ¬q — it resembles Modus Tollens but illegitimately denies the antecedent instead of the consequent.", "Affirming a Disjunct (formal fallacy of propositional logic) has the invalid form: p ∨ q; p; therefore ¬q — it resembles Disjunctive Syllogism but affirms rather than denies one disjunct.", "Converting a Conditional (formal fallacy) illegitimately infers q → p from p → q by swapping antecedent and consequent, thus destroying the validity of the original argument.", "Informal fallacies do not have inherently bad logical forms but make errors in evidence, relevance, or clarity; they are unsystematic and best used to identify arguments that seem wrong but cannot be formally invalidated.", "Fallacies of Relevance (informal) occur when premises are psychologically compelling but provide no actual logical support for the conclusion; key examples include Ad Populum, Ad Misericordiam, Ad Baculum, Ad Hominem (Abusive and Circumstantial), Red Herring, Straw Man, Ad Ignorantiam, Ad Verecundiam, False Cause, Hasty Generalization, Fallacy of Accident, Complex Question, and Ignoratio Elenchi.", "Ad Hominem has two forms: Abusive (directly insulting or discrediting the person holding a view rather than addressing the argument) and Circumstantial (discrediting a view by appealing to the circumstances or affiliations of the person holding it).", "False Cause (Post Hoc, Ergo Propter Hoc — 'after this, therefore because of this') mistakenly treats a sequential relationship as a causal one, assuming that because event A preceded event B, A must have caused B.", "Fallacies of Ambiguity (also called Fallacies of Clearness) arise when a term, phrase, or sentence shifts meaning between premise and conclusion; the four types are Equivocation, Composition and Division, Amphiboly, and Accent.", "Equivocation occurs when a word with multiple meanings is used in different senses in the premises and the conclusion; Amphiboly arises from grammatically awkward phrasing that admits two interpretations; Accent arises from wrong emphasis that perverts the intended meaning; Composition attributes part properties to a whole, and Division attributes whole properties to the parts."], "questions": [{"question": "Which of the following correctly lists the three Laws of Thought?", "options": {"a": "Laws of Identity, Sufficient Reason, and Excluded Middle", "b": "Laws of Identity, Contradiction, and Excluded Middle", "c": "Laws of Syllogism, Identity, and Non-contradiction", "d": "Laws of Bivalence, Contradiction, and Sufficient Reason"}, "answer": "b", "explanation": "The three Laws of Thought are the Law of Identity, the Law of Contradiction (Non-contradiction), and the Law of Excluded Middle. The Law of Sufficient Reason and the Law of Syllogism are not among them."}, {"question": "The symbolic representation of the Law of Identity is:", "options": {"a": "p ∧ ¬p", "b": "p ∨ ¬p", "c": "p → p", "d": "¬p → p"}, "answer": "c", "explanation": "The Law of Identity is symbolised as p → p (if p then p). This is a tautology — it implies itself and is necessarily true. p ∧ ¬p symbolises the Law of Contradiction, and p ∨ ¬p symbolises the Law of Excluded Middle."}, {"question": "The symbolic form p ∧ ¬p represents a proposition that is:", "options": {"a": "A tautology — necessarily true", "b": "Contingent — could be either true or false", "c": "Necessarily false", "d": "Meaningless"}, "answer": "c", "explanation": "According to the Law of Contradiction, p ∧ ¬p (a proposition conjoined with its negation) is necessarily false. The necessarily true form is p ∨ ¬p (the Law of Excluded Middle), and p → p is the tautology form of the Law of Identity."}, {"question": "The word 'fallacy' is derived from the Latin word:", "options": {"a": "'fallire' meaning to fall short", "b": "'fallere' meaning to deceive", "c": "'fallax' meaning a weak argument", "d": "'fallacia' meaning circular reasoning"}, "answer": "b", "explanation": "The text explicitly states that 'fallacy' derives from the Latin 'fallere', meaning to deceive. A fallacy is thus an argument designed to deceive — it appears correct but is not."}, {"question": "Modus Ponens is sometimes called 'affirming the antecedent.' Which of the following correctly expresses its valid form?", "options": {"a": "p → q; ¬q; therefore ¬p", "b": "p → q; q; therefore p", "c": "p → q; p; therefore q", "d": "p ∨ q; ¬p; therefore q"}, "answer": "c", "explanation": "Modus Ponens has the form: p → q (conditional), p (affirm antecedent), therefore q (conclude consequent). Option (a) is Modus Tollens; option (b) is the fallacy of affirming the consequent; option (d) is Disjunctive Syllogism."}, {"question": "How many elementary formal rules of inference are identified in Study Session 8?", "options": {"a": "Seven", "b": "Eight", "c": "Nine", "d": "Ten"}, "answer": "c", "explanation": "The session lists exactly nine rules of inference: Modus Ponens, Modus Tollens, Hypothetical Syllogism, Absorption, Disjunctive Syllogism, Addition, Conjunction, Simplification, and Constructive Dilemma."}, {"question": "Argumentum ad Populum is popularly known as the Bandwagon fallacy because it:", "options": {"a": "Appeals to force and threats to compel agreement", "b": "Attacks the personal character of the opponent", "c": "Justifies a conclusion by appealing to the audience's emotions based on popular opinion", "d": "Appeals to an authority outside their area of competence"}, "answer": "c", "explanation": "Ad Populum (Appeal to People/Popularity) feeds on the emotions of the audience by relying on what is popular rather than on logical evidence. Propagandists and advertisers frequently use this fallacy."}, {"question": "Which rule of inference moves from complex to simple — separating the first conjunct of a conjunction to form the conclusion?", "options": {"a": "Conjunction", "b": "Addition", "c": "Absorption", "d": "Simplification"}, "answer": "d", "explanation": "Simplification (Simp.) has the form: p ∧ q; therefore p. It 'liberates' the first conjunct. Conjunction does the opposite — it moves from simple to complex by joining two premises into a conjunctive conclusion."}, {"question": "An argument follows the form: p → q; q; therefore p. This argument is:", "options": {"a": "Valid — it is an instance of Modus Ponens", "b": "Valid — it is an instance of Modus Tollens", "c": "Invalid — it commits the formal fallacy of Affirming the Consequent", "d": "Invalid — it commits the formal fallacy of Denying the Antecedent"}, "answer": "c", "explanation": "This form is invalid because it takes the consequent (q) as the second premise rather than the antecedent (p). Modus Ponens requires the antecedent to be affirmed. Taking the consequent as the second premise commits the formal fallacy of Affirming the Consequent."}, {"question": "Modus Tollens has the valid form p → q; ¬q; therefore ¬p. Which form below commits the related formal fallacy of Denying the Antecedent?", "options": {"a": "p → q; p; therefore q", "b": "p → q; ¬p; therefore ¬q", "c": "p → q; ¬q; therefore ¬p", "d": "p → q; therefore q → p"}, "answer": "b", "explanation": "Denying the Antecedent has the invalid form: p → q; ¬p; therefore ¬q. It resembles Modus Tollens but denies the antecedent (not the consequent). Option (a) is valid Modus Ponens; option (c) is valid Modus Tollens; option (d) is Converting a Conditional."}, {"question": "The rule of Absorption in symbolic form states:", "options": {"a": "p ∧ q; therefore p", "b": "p; q; therefore p ∧ q", "c": "p → q; therefore p → (p ∧ q)", "d": "p → q; q → r; therefore p → r"}, "answer": "c", "explanation": "Absorption (Abs.) permits inference from p → q to p → (p ∧ q): if p implies q, then p implies both p and q. Option (a) is Simplification; option (b) is Conjunction; option (d) is Hypothetical Syllogism."}, {"question": "Hypothetical Syllogism is valid due to which property of the entailment relation?", "options": {"a": "Reflexive property", "b": "Symmetric property", "c": "Transitive property", "d": "Associative property"}, "answer": "c", "explanation": "Hypothetical Syllogism (p → q; q → r; therefore p → r) is a chain argument that is valid because of the transitive character of the entailment relation — if A entails B and B entails C, then A entails C."}, {"question": "Which rule of inference is unique in that its conclusion contains a proposition that does not appear anywhere in its single premise?", "options": {"a": "Absorption", "b": "Simplification", "c": "Addition", "d": "Disjunctive Syllogism"}, "answer": "c", "explanation": "Addition (Add.) permits inference from p to p ∨ q. The new proposition q does not appear in the premise at all — it is newly added. This makes Addition unique among all nine rules of inference."}, {"question": "Constructive Dilemma is distinguished from the other rules of inference by employing at minimum how many different variables?", "options": {"a": "Two", "b": "Three", "c": "Four", "d": "Five"}, "answer": "c", "explanation": "Constructive Dilemma has the form (p → q) ∧ (r → s); p ∨ r; therefore q ∨ s, which involves four variables (p, q, r, s). The session explicitly states that C.D. involves at least four different variables, the most of any rule."}, {"question": "A senator's views on petroleum taxation are dismissed because her husband owns a large oil company. This argument commits which fallacy?", "options": {"a": "Ad Hominem Abusive", "b": "Ad Hominem Circumstantial", "c": "Argumentum ad Verecundiam", "d": "Red Herring"}, "answer": "b", "explanation": "Ad Hominem Circumstantial attacks a person's argument by appealing to their circumstances or affiliations (e.g., a spouse's business interests) rather than addressing the argument itself. Ad Hominem Abusive would directly insult the senator's character."}, {"question": "'No one has ever proven that UFOs exist, therefore no UFOs exist.' This argument commits which fallacy?", "options": {"a": "Hasty Generalization", "b": "Argumentum ad Ignorantiam", "c": "False Cause", "d": "Straw Man"}, "answer": "b", "explanation": "Argumentum ad Ignorantiam (Fallacy of Ignorance) occurs when the absence of proof against something is used as proof of its non-existence (or vice versa). The absence of evidence is not the evidence of absence."}, {"question": "The Fallacy of Composition is also called Part-For-The-Whole because it:", "options": {"a": "Attributes the properties of the whole group to each of its individual parts", "b": "Attributes the properties of the parts to the whole group", "c": "Uses a word in two different senses between premise and conclusion", "d": "Draws a general conclusion from an insufficient sample"}, "answer": "b", "explanation": "The Fallacy of Composition (Pars pro toto) involves projecting the qualities of parts onto the whole — arguing that because something is true of the parts, it must be true of the whole. Its inverse, the Fallacy of Division, argues from whole properties to the parts."}, {"question": "Fallacies of Ambiguity arise from:", "options": {"a": "Premises that have no logical connection to the conclusion", "b": "A shift in the meaning of a word, phrase, or sentence between premises and conclusion", "c": "Arguments that appeal to the audience's emotions", "d": "Arguments that have an inherently invalid logical form"}, "answer": "b", "explanation": "Fallacies of Ambiguity (Fallacies of Clearness) occur when the argument's formulation contains ambiguity — a term may have one sense in a premise and a different sense in the conclusion, making the inference fallacious."}, {"question": "Which pair below correctly identifies two formal fallacies of propositional logic?", "options": {"a": "Undistributed Middle Term and Illicit Major", "b": "Affirming the Consequent and Denying the Antecedent", "c": "Equivocation and Amphiboly", "d": "Hasty Generalization and False Cause"}, "answer": "b", "explanation": "Affirming the Consequent and Denying the Antecedent are both Fallacies of Propositional Logic. Options (a) are Fallacies of Syllogistics; options (c) are Fallacies of Ambiguity; options (d) are informal fallacies of relevance."}, {"question": "The Fallacy of Division is best described as:", "options": {"a": "Attributing properties of the parts to the whole", "b": "Attributing properties of the whole to each of the individual parts", "c": "Drawing a sweeping conclusion from insufficient evidence", "d": "Applying a general rule to a special case where it is not applicable"}, "answer": "b", "explanation": "The Fallacy of Division is the inverse of Composition — it involves arguing from the properties of a whole group and attributing those properties to the individual parts that make up the group. Option (a) describes Composition; option (c) is Hasty Generalization; option (d) is the Fallacy of Accident."}, {"question": "Consider: 'If Anselm was a contemporary of Aquinas, then he was a medieval philosopher. If Anselm was a medieval philosopher, then he proved God's existence. Therefore, if Anselm was a contemporary of Aquinas, then he proved God's existence.' Which rule of inference is applied?", "options": {"a": "Modus Ponens", "b": "Modus Tollens", "c": "Hypothetical Syllogism", "d": "Constructive Dilemma"}, "answer": "c", "explanation": "This is Hypothetical Syllogism (p → q; q → r; therefore p → r): the consequent of the first conditional (medieval philosopher) becomes the antecedent of the second, and the conclusion links the first antecedent directly to the last consequent."}, {"question": "Copi's response to the Marxist (Hegelian) challenge to the Law of Contradiction is that:", "options": {"a": "Marxist dialectics proves that contradictions are real and unavoidable", "b": "The rich and poor classes are genuinely logically contradictory", "c": "The conflicting social classes merely have conflicting attributes and do not constitute a logical denial of each other", "d": "Formal logic is inapplicable to socio-economic phenomena"}, "answer": "c", "explanation": "Copi argued it is 'loose and inconvenient terminology' to call the conflict between rich and poor 'contradictory.' Each class does not necessarily count as a logical denial of the other — they merely have conflicting attributes. The Law of Contradiction remains intact."}, {"question": "The statement 'Obama is the American President' is described as an elliptical proposition because:", "options": {"a": "It contains an implicit contradiction", "b": "Its truth value is susceptible to change because it is not fully formulated with time qualifications", "c": "It violates the Law of Excluded Middle", "d": "It is a tautology that cannot be falsified"}, "answer": "b", "explanation": "An elliptical proposition is one that is not properly formulated — it omits essential temporal or contextual qualifiers, making its truth value changeable over time. Logic requires complete statements; a proper formulation would be 'Obama was American President between 2009 and 2017.'"}, {"question": "Which formal fallacy is committed in the argument: 'If Tunde was NAPS President, then he was popular. Therefore, if Tunde was popular, then he was NAPS President'?", "options": {"a": "Affirming the Consequent", "b": "Denying the Antecedent", "c": "Converting a Conditional", "d": "Affirming a Disjunct"}, "answer": "c", "explanation": "Converting a Conditional illegitimately infers q → p from p → q by swapping antecedent and consequent. Being popular does not entail being NAPS President — the original direction of entailment is not reversible."}, {"question": "How does the Fallacy of Accent operate?", "options": {"a": "By using a word in two different senses between premise and conclusion", "b": "By justifying a conclusion through presuppositions arising from wrong stress or emphasis placed on certain words", "c": "By drawing inferences from grammatically ambiguous sentence structure", "d": "By attributing the qualities of parts to the whole"}, "answer": "b", "explanation": "Accent occurs when wrong emphasis or accentuation of words perverts the intended meaning. For example, 'It is wrong to lie to your PARENTS' implies lying to others is acceptable. The fallacy exploits the way stress changes meaning."}, {"question": "'You should give back whatever you borrow. Your friend gave you his car keys to stop him driving drunk, but now (while drunk) he is asking for them back. Therefore you must give them back.' This illustrates which fallacy?", "options": {"a": "Hasty Generalization", "b": "Begging the Question", "c": "Fallacy of Accident", "d": "Straw Man"}, "answer": "c", "explanation": "The Fallacy of Accident occurs when a general rule is applied to a specific case where accidental circumstances make the rule inapplicable. The general rule 'return what you borrow' does not apply when doing so would cause harm — the accidental circumstance of intoxication renders the rule inapplicable."}, {"question": "What correctly distinguishes formal fallacies from informal fallacies?", "options": {"a": "Formal fallacies appear in inductive arguments, while informal fallacies appear in deductive ones", "b": "Formal fallacies are fallacious by virtue of their logical form and are always deductively invalid; informal fallacies make errors in evidence, relevance, or clarity without having an inherently bad form", "c": "Informal fallacies can be represented symbolically, while formal fallacies cannot", "d": "Formal fallacies are more common in ordinary language, while informal fallacies appear only in academic writing"}, "answer": "b", "explanation": "Formal fallacies are identified by analysing their logical form — the form itself is always invalid. Informal fallacies lack bad forms but make other kinds of errors (relevance, evidence, clarity). The session explicitly states this distinction."}, {"question": "Conjunction (Conj.) and Simplification (Simp.) are related rules that move in opposite directions. Which statement best captures this relationship?", "options": {"a": "Conjunction moves from two premises to a disjunctive conclusion; Simplification moves from a disjunction to a single premise", "b": "Conjunction joins two separate premises into a conjunctive conclusion; Simplification separates the first conjunct of a conjunctive premise into a standalone conclusion", "c": "Conjunction adds a new proposition to an existing premise; Simplification removes the added proposition", "d": "Conjunction is valid only for atomic propositions; Simplification works with compound propositions"}, "answer": "b", "explanation": "Conjunction (p; q; therefore p ∧ q) moves from two simple premises to a complex conjunctive conclusion. Simplification (p ∧ q; therefore p) does the reverse — it breaks a conjunction down and liberates the first conjunct. The session explicitly describes them as moving in opposite directions."}, {"question": "Anele's defence of the Law of Excluded Middle against the Logical Positivist challenge is best summarised as:", "options": {"a": "Logical Positivism is itself a fallacious philosophical doctrine", "b": "The existence of God can be empirically verified under certain conditions", "c": "The Law of Excluded Middle applies only to genuine propositions and cannot legitimately be applied to meaningless assertions", "d": "All assertions, including meaningless ones, are subject to the principle of bivalence"}, "answer": "c", "explanation": "Anele argues that the principle of excluded middle is only applicable to propositions — statements that can genuinely be true or false. If an assertion is meaningless (as Logical Positivists claim about metaphysical claims), the law simply does not apply to it; this does not invalidate the law itself."}, {"question": "Which of the following is an example of the fallacy of Equivocation?", "options": {"a": "'If you do not vote for me, I will not develop this community' — using fear of consequences", "b": "'I saw Tade at the Bank' — where 'bank' could mean a financial institution or a river bank, creating ambiguity", "c": "'My grandfather died the morning after a black cat crossed my path — the cat caused his death' — confusing sequence for causation", "d": "'Everyone agrees that corruption is wrong, so you must agree too' — appealing to popular consensus"}, "answer": "b", "explanation": "Equivocation occurs when a word with more than one meaning is used in different senses, causing confusion and misinterpretation. The word 'bank' in the given example could mean a financial institution or the side of a river — two entirely different meanings used ambiguously."}]}, {"session": 9, "topic": "The Philosophy of Other Disciplines", "points": ["Philosophy is defined as a critical, rational, and reflective study of the nature of the world, of man and his position and goal in the world; its methods and contents together best define it.", "The five basic subject areas of philosophy are Metaphysics, Epistemology, Ethics, Logic, and the Philosophy of Other Disciplines (also called the Philosophy of the Infrastructure of Disciplines).", "The lack of a universally acceptable definition of philosophy results from differences in area perspectives, schools of thought (Idealist vs. Materialist), culture, historical epoch, and the individual philosopher's programme and agenda.", "Argument is the decisive characteristic of philosophy; 'without intuitive argument and clarification, there is strictly no philosophy' because philosophy is an exercise in elaborate argumentation, clarification, and the answering of known or anticipated objections.", "Philosophy begins with wonder; a philosopher is a professional thinker whose dictum is 'take nothing for granted,' equipped with intuitive insight and rational stamina to delve into the difficult problems of life.", "Philosophy goes with criticism, scepticism, and refusal to believe unless on rational grounds; it is an analogical term with a chequered history, and today it is the consciousness of a people at a given point in time.", "Philosophy of Other Disciplines is a second-order activity that deals with the general theories, character, problems, and presuppositions in other disciplines by applying philosophical methodology to them.", "Philosophy is called the 'parent discipline' or 'mother of all disciplines' because all other disciplines are intellectual descendants of philosophy; the award of a Doctor of Philosophy (PhD) at the apex of academic achievement signifies this continuity and paternalism.", "According to C.S. Momoh, 'Philosophy is the base and the apex, the foundation, the ceiling and the roof of any civilization' and is 'the queen and king of all the disciplines; wherever philosophy is present, there is light, where it is absent there is darkness.'", "Herbert Spencer held that philosophy coordinates other branches of knowledge; human knowledge resembles a tree with philosophy as the trunk (parent stem) and the special sciences as the branches that differentiated as knowledge grew.", "The philosopher is accused of being an 'imperialist' or 'busy-body' who meddles in other disciplines; this charge is refuted because philosophy, as parent discipline, has a legitimate mandate to examine the fundamental principles and presuppositions of all fields.", "Philosophy of Education deals with the general theories, fundamental questions, problems and presuppositions in education; it determines the scale of educational values and addresses questions such as 'why do we go to school?', 'who should be educated?', and 'what should the teacher teach?'", "G.F. Kneller confirms that philosophy of education questions presuppositions in educational practice to give meaning and synthesis to the process, and seeks to comprehend education in its entirety to guide the choice of educational ends and policies.", "Philosophy of History raises the philosophical question of what history is (its essence and nature), examines historical methodology, and asks whether history is a science and whether there are objective laws guiding the historical process.", "A Hegelian historian believes history is driven by a necessary universal force toward freedom (development in the consciousness of freedom), while Karl Popper's 'poverty of historicism' holds that there are no objective metaphysical or scientific laws by which historical developments can be predicted.", "Positive law is concerned only with what the law says and the validity of law, not with whether a legal rule is morally justified; philosophy of law — also called jurisprudential philosophy or legal philosophy — moves beyond validity to ask about the ethical justification, nature, and purpose of law.", "The task of a legal philosopher, as described in the session, is to discuss the nature and sources of law and the relation of law to ethics or morality.", "Philosophy of Religion deals with questions such as the nature of God, arguments for and against God's existence, the problem of evil, grounds for religious belief, and the nature of miracles and religious language; theology deals only with the sociological, historical, and psychological aspects of religion.", "Religion needs philosophy because questions about the existence and nature of God cannot be answered satisfactorily by staying within the Bible or Quran; they require the appeal to human reason, which is at its highest in philosophy.", "Philosophy of Science examines scientific statements, theories, assumptions, methodology, and developments; while science deals with 'how' and application (technology), philosophy deals with 'why' and defines the nature of the truth that science discovers.", "Philosophy of Science has a moral and social dimension that critically examines ethical issues of scientific use or misuse, including ecological safety and bio-hazards from chemical, industrial, and radioactive releases from nuclear power activities.", "Aesthetics is the branch of philosophy that deals with arts — including design, fine arts, creative art, and literature — and is defined as 'a philosophy or perception of beauty in art and in nature.'", "Philosophy of Language deals with theories and problems of meaning and the nature of language; the Analytic Movement in philosophy, mainly concerned with language, holds that the philosopher's business is to bring out features of the use and meaning of words and forms of statements.", "Logic is both an instrument (tool) and a branch of philosophy; it is the study of correct and incorrect reasoning, valid and invalid inferences, and argument, and it forms the prominent link between philosophy and language through classification of statements and meanings.", "Philosophy of Political Science investigates the normative meanings of political terms such as 'democracy,' 'equality,' and 'freedom,' and explores the philosophical basis of political values; political scientists deal only with descriptive and prescriptive meanings, while normative meanings fall under political philosophy.", "Mathematics and philosophy relate through symbolic logic; some logicians claim arithmetic is derivable from logic, and since algebra and geometry are extensions of arithmetic, the whole of pure mathematics is ultimately reducible to logic.", "The basic assumptions and axioms of mathematics are a priori propositions in philosophy; the question 'what is 1?' is axiomatic and unprovable — a first principle that is metaphysical — which is why mathematics cannot be fully explained without recourse to metaphysics.", "The psychologist explains the human mind and behaviour through quantitative and empirical analysis and experimentation, while the philosopher examines the concepts and validity of the claims; most psychological and social-science claims are value-laden, which makes them of direct interest to philosophy.", "The importance of philosophy includes being the repository of ideas for every organisation (medical, political, educational, financial, religious); wisdom — the love for wisdom — is essential for social justice, cultural development, and national progress beyond mere technological development.", "The charge that a philosopher is 'a jack of all trades and master of none' is a misconception; the philosopher claims knowledge only of the fundamental principles underlying each discipline, because the fundamentals of a subject are like premises in a logical argument — a change in the fundamentals entails a change in the entire subject."], "questions": [{"question": "Which of the following is the FIFTH basic subject area of philosophy, in addition to Metaphysics, Epistemology, Ethics, and Logic?", "options": {"a": "Existentialism", "b": "Phenomenology", "c": "Philosophy of Other Disciplines", "d": "Theology"}, "answer": "c", "explanation": "The five basic subject areas are Metaphysics, Epistemology, Ethics, Logic, and the Philosophy of Other Disciplines (also called the Philosophy of the Infrastructure of Disciplines)."}, {"question": "The award of a Doctor of Philosophy (PhD) at the highest level of academic achievement is significant because it:", "options": {"a": "Proves that science is subordinate to philosophy", "b": "Symbolises the continuity and paternalism of philosophy as the parent of all disciplines", "c": "Indicates that the holder has mastered every discipline", "d": "Is a tradition inherited from ancient Rome with no deeper meaning"}, "answer": "b", "explanation": "The PhD is awarded as a sign of continuity and paternalism because philosophy is the parent discipline from which all other disciplines descended."}, {"question": "Why does the session identify argument as the 'decisive characteristic' of philosophy?", "options": {"a": "Because philosophers are trained to be confrontational in public discourse", "b": "Because without intuitive argument and clarification there is strictly no philosophy, as it is an exercise in elaborating argumentation and answering objections", "c": "Because logic textbooks define argument as philosophy's only method", "d": "Because argument distinguishes philosophy from mathematics"}, "answer": "b", "explanation": "The session states that 'without intuitive argument and clarification, there is strictly no philosophy' and that philosophy is essentially an exercise in elaborate argumentation, clarification, and answering of known or anticipated objections."}, {"question": "According to C.S. Momoh, philosophy is BEST described as:", "options": {"a": "The most abstract and impractical of all academic disciplines", "b": "The base, apex, foundation, ceiling, and roof of any civilization — the queen and king of all disciplines", "c": "A discipline equal in status to the natural sciences", "d": "A Western intellectual tradition irrelevant to African societies"}, "answer": "b", "explanation": "Momoh's famous summary describes philosophy as the base and apex, foundation, ceiling, and roof of civilization, and as the queen and king of all disciplines."}, {"question": "Herbert Spencer's tree analogy of human knowledge implies that as knowledge grew:", "options": {"a": "Philosophy became one branch among many equal branches", "b": "The special sciences replaced philosophy as the trunk", "c": "The special sciences differentiated themselves as branches from philosophy, which was the original trunk", "d": "All disciplines remained part of a single unified philosophy"}, "answer": "c", "explanation": "Spencer held that philosophy was the trunk (parent stem) from which all knowledge grew; as knowledge expanded, it differentiated into special sciences as branches."}, {"question": "The philosopher's accusation of being an 'imperialist' who meddles in other disciplines is BEST refuted by the argument that:", "options": {"a": "Philosophers have legal authority to inspect any academic discipline", "b": "Philosophy merely borrows theories from other disciplines without giving anything back", "c": "Philosophy is the parent discipline from which all other disciplines descended, giving it a legitimate right to examine their fundamental principles", "d": "Other disciplines have no right to complain since philosophy was invented first"}, "answer": "c", "explanation": "The 'imperialist' charge is refuted by the fact that philosophy is the parent discipline; other disciplines are its intellectual descendants, so philosophy legitimately examines their foundational principles."}, {"question": "G.F. Kneller's role for philosophy of education is that it:", "options": {"a": "Replaces the curriculum with philosophical readings", "b": "Questions presuppositions in educational practice and seeks to comprehend education in its entirety to guide the choice of educational ends and policies", "c": "Provides the scientific data needed to improve teaching methods", "d": "Limits itself to training teachers in classroom management"}, "answer": "b", "explanation": "Kneller states that philosophy questions presuppositions in educational practice to give it meaning and synthesi
