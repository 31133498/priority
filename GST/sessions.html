s, and guides the choice of educational ends and policies."}, {"question": "Karl Popper's 'poverty of historicism' refers to the belief that:", "options": {"a": "History is too complex to study scientifically", "b": "Historians are poorly funded compared to scientists", "c": "There are no objective metaphysical or scientific laws on the basis of which historical developments can be predicted", "d": "History only records the actions of the poor and marginalised"}, "answer": "c", "explanation": "Popper's 'poverty of historicism' holds that there are no objective laws — metaphysical or scientific — by which historical developments are predictable, contrasting sharply with Hegel's view."}, {"question": "A Hegelian historian differs from a Popperian historian primarily because the Hegelian believes:", "options": {"a": "That history has no direction or purpose", "b": "That there is a necessary universal force driving history toward freedom (development in the consciousness of freedom)", "c": "That history must be studied through empirical data alone", "d": "That historical methodology is irrelevant to the interpretation of facts"}, "answer": "b", "explanation": "A Hegelian historian believes a necessary universal force drives history toward freedom (development in the consciousness of freedom) and therefore uses a different methodology from Popper, who denies such laws."}, {"question": "Which form of law is concerned only with the validity of law and what the law says, WITHOUT asking whether the law is morally justified?", "options": {"a": "Natural law", "b": "Jurisprudential law", "c": "Positive law", "d": "Moral law"}, "answer": "c", "explanation": "Positive law concerns itself with what the law says and which actions are legal or illegal; it does not concern itself with whether a legal rule is morally justified."}, {"question": "The task of a legal philosopher, according to the session, is to:", "options": {"a": "Represent clients in court using philosophical arguments", "b": "Draft legislation based on ethical principles", "c": "Discuss the nature and sources of law and the relation of law to ethics or morality", "d": "Enforce the law using philosophical reasoning"}, "answer": "c", "explanation": "The session explicitly states that 'the task of a legal philosopher is to discuss the nature and sources of law and the relation of law to ethics or morality.'"}, {"question": "The argument that 'law is sufficient in itself for social control and needs no philosophy' is refuted in the session by pointing out that:", "options": {"a": "Lawyers are incapable of understanding philosophy", "b": "Every legal system is based explicitly on principles, and philosophy is the study of the principles underlying knowledge and reality", "c": "Social control is not really the purpose of law", "d": "Philosophy of law is more profitable than legal practice"}, "answer": "b", "explanation": "The session refutes this by noting that every legal system is based on principles, and since philosophy is the study of principles underlying knowledge and reality, philosophy of law provides the fundamental basis of law."}, {"question": "Why does religion need philosophy, according to Study Session 9?", "options": {"a": "Because philosophers write better sermons than priests", "b": "Because questions about God's nature and existence cannot be adequately answered without appealing to human reason, which is at its highest in philosophy", "c": "Because theology has been absorbed entirely into philosophy", "d": "Because religion and philosophy teach identical doctrines"}, "answer": "b", "explanation": "The session argues that fundamental religious questions (existence of God, nature of miracles, problem of evil) require going beyond the Bible or Quran to philosophy — the appeal to human reason — which is at its highest peak in philosophy."}, {"question": "Theology, as described in Study Session 9, primarily deals with:", "options": {"a": "Arguments for and against the existence of God", "b": "The metaphysical basis of miracles and religious experience", "c": "The sociological, historical, and psychological aspects of religion", "d": "The normative meanings of religious terms"}, "answer": "c", "explanation": "The session defines theology as dealing with 'the sociological, historical and perhaps the psychological aspects of religion or religious questions,' distinguishing it from the deeper philosophical questions about religion."}, {"question": "While philosophy deals with 'why?' in studying natural reality, science deals with 'how?' and application (technology). This distinction means that:", "options": {"a": "Science and philosophy cannot supplement each other", "b": "Science discovers truth while philosophy defines the nature of that truth; both aim to liberate man from ignorance", "c": "Science is more important than philosophy for society", "d": "Philosophy can replace science in universities"}, "answer": "b", "explanation": "The session states that to discover truth is the task of science, while to define the nature of that truth is the task of philosophy; both aim at liberating man from ignorance and can supplement each other."}, {"question": "Philosophy of Science's moral and social dimension includes the critical examination of:", "options": {"a": "How scientists should be paid for their work", "b": "The peer-review process in academic journals", "c": "Ecological safety and bio-hazards from nuclear, chemical, and industrial activities", "d": "Whether scientists should be allowed to patent their discoveries"}, "answer": "c", "explanation": "The session states that philosophy of science in its moral sphere studies ecological safety and bio-hazards from chemical, industrial, and radioactive releases from nuclear power activities."}, {"question": "Aesthetics, as a branch of philosophy, is defined in the session as:", "options": {"a": "The scientific measurement and classification of beauty", "b": "A philosophy or perception of beauty in art and in nature", "c": "The history of artistic movements from ancient to modern times", "d": "A branch of psychology that analyses artistic behaviour"}, "answer": "b", "explanation": "The session quotes the definition of aesthetics as 'a philosophy or perception of beauty in art and in nature,' identifying it as the branch of philosophy that deals with arts and literature."}, {"question": "The Analytic Movement in philosophy, connected to the philosophy of language, is primarily concerned with:", "options": {"a": "Analysing political structures and power relationships", "b": "Bringing out features of the use and meaning of words and forms of statements — linguistic analysis and conceptual clarification", "c": "Performing chemical analysis to support scientific claims", "d": "Analysing historical documents using a scientific method"}, "answer": "b", "explanation": "The session states that the Analytic Movement is mainly concerned with language; the philosopher's business is to bring out features of the use or meaning of words and forms of statements."}, {"question": "Logic serves which TWO roles in philosophy, according to the session?", "options": {"a": "It is both an empirical science and a branch of mathematics", "b": "It is both an instrument/tool and a branch of philosophy", "c": "It is both a social science and a natural science", "d": "It is both descriptive and normative in equal measure"}, "answer": "b", "explanation": "The session explicitly states that Logic is 'both an instrument or tool and a branch of philosophy.'"}, {"question": "The normative meanings of political terms like 'democracy,' 'equality,' and 'freedom' are the concern of:", "options": {"a": "Descriptive political science", "b": "Positive law", "c": "Sociology of politics", "d": "Political philosophy/philosophy of political science"}, "answer": "d", "explanation": "Political scientists deal with descriptive and prescriptive meanings of political terms but not normative meanings. Discussing normative meanings means passing from politics to ethics, a branch of philosophy — the domain of political philosophy."}, {"question": "Some logicians argue that the whole of pure mathematics is reducible to logic because:", "options": {"a": "Mathematicians developed logic before philosophers did", "b": "Arithmetic is derivable from logic, and algebra and geometry are extensions of arithmetic", "c": "Mathematics and logic use the same symbols and notation", "d": "Logic textbooks contain chapters on arithmetic"}, "answer": "b", "explanation": "The session states that since arithmetic is derivable from logic, and algebra and geometry are extensions of arithmetic, it follows that the whole of pure mathematics is based on and reducible to logic."}, {"question": "Why is the question 'What is 1?' considered a philosophical and metaphysical question in the session?", "options": {"a": "Because it is too simple for mathematicians to take seriously", "b": "Because it is axiomatic and unprovable — a first principle that is metaphysical and cannot be explained without recourse to metaphysics", "c": "Because the answer requires experimental data to verify", "d": "Because 1 is a political concept related to unity"}, "answer": "b", "explanation": "The session argues that the question 'what is 1?' is axiomatic and unprovable — it is a first principle which is metaphysical, and metaphysics is the heartbeat of philosophy."}, {"question": "How does the philosopher's approach to the human mind differ fundamentally from the psychologist's approach?", "options": {"a": "The philosopher studies only animal behaviour while the psychologist studies human behaviour", "b": "The philosopher uses experiments while the psychologist uses intuition", "c": "The psychologist uses quantitative and empirical analysis and experimentation, while the philosopher examines the concepts and validity of the psychological claims", "d": "There is no meaningful difference; both use identical methods"}, "answer": "c", "explanation": "The session distinguishes the two: the psychologist explains the mind through quantitative/empirical analysis and experimentation, while the philosopher examines the concepts and validity of the claims."}, {"question": "The session states that most claims of psychologists, like other social scientists, are 'value-laden.' This means that:", "options": {"a": "Social scientists are motivated by financial incentives", "b": "Their claims carry embedded values and normative assumptions, making them of direct philosophical interest", "c": "Their work has high monetary value in the academic market", "d": "Social science values are always correct and beyond critique"}, "answer": "b", "explanation": "The session notes that the philosopher is interested in psychology because most of the claims of the psychologist, like other social scientists, are value-laden — they carry embedded values that require philosophical examination."}, {"question": "According to the session, philosophy is described as the 'repository of ideas' because:", "options": {"a": "Philosophers memorise more facts than scientists", "b": "Every organisation — medical, political, educational, industrial, religious — needs ideas, and philosophy is where those fundamental ideas are generated", "c": "Philosophy departments house the largest university libraries", "d": "Philosophy provides the tools for computer programming"}, "answer": "b", "explanation": "The session states that every organisation, regardless of type, needs ideas, and 'philosophy is the repository of ideas' — the source of the fundamental ideas needed for any enterprise."}, {"question": "The charge that philosophy is 'exceedingly abstract' and does not help one 'make money or increase social status' is answered in the session by pointing out that:", "options": {"a": "Philosophers actually earn higher salaries than other graduates", "b": "Philosophy courses are practical and include business modules", "c": "More than wealth and prestige, philosophy provides man an opportunity to fulfil his life's purpose, which is a more basic human need", "d": "The accusers have themselves studied philosophy without knowing it"}, "answer": "c", "explanation": "C.B. Okolo is quoted: 'More than wealth and prestige, philosophy provides for man an opportunity to fulfill his life's purpose which is a more basic need.' Philosophy addresses the meaning of human existence."}, {"question": "The 'ontological wonders' discussed in the session — such as 'Why is there something instead of nothing?' and 'What is the place of man in the universe?' — are described as:", "options": {"a": "Questions already answered definitively by modern science", "b": "Purely theological questions that only religion can address", "c": "Metaphysical questions that represent philosophy's real essence, going beyond material ('bread and butter') concerns", "d": "Mathematical problems that symbolic logic will eventually solve"}, "answer": "c", "explanation": "The session states that 'the real essence of philosophy is metaphysical; the metaphysical urge to penetrate reality' and that these are 'ontological wonders beyond bread and butter,' emphasising philosophy's spiritual and metaphysical dimension."}, {"question": "The refutation of the charge that a philosopher is 'a jack of all trades and master of none' rests on the fact that:", "options": {"a": "Philosophers do actually master every discipline they study in detail", "b": "The philosopher only claims knowledge of the fundamental principles underlying each discipline, not detailed disciplinary mastery", "c": "Modern philosophy departments require specialisation in one discipline only", "d": "The charge originates from jealousy among other academics"}, "answer": "b", "explanation": "The session clarifies that the philosopher does not claim to know all disciplines in detail; what the philosopher claims to know are the fundamental principles underlying each discipline."}, {"question": "According to the session, changing the fundamentals of a subject is comparable to changing premises in a logical argument because:", "options": {"a": "Conclusions are always more important than premises in any argument", "b": "A change in the truth-value of premises affects the soundness of the argument; likewise, a change in the fundamentals of a subject changes the subject itself", "c": "Logical arguments and academic subjects follow the same rules of syntax", "d": "Mathematics provides the only valid framework for both logic and academic disciplines"}, "answer": "b", "explanation": "The session explicitly draws this analogy: 'the fundamentals of a subject are like premises in a logical argument; a change in the truth value of a premise will affect the soundness of the argument itself. Likewise, a change in the fundamentals of a subject entails a change in the subject itself.'"}, {"question": "A student argues that 'the question of what history is' is a historical question. According to the session, this argument is WRONG because:", "options": {"a": "Historians are not qualified to define their own discipline", "b": "The question deals with the essence and nature of history, which is a philosophical question, not a question answerable by historical investigation itself", "c": "The definition of history is fixed by government policy, not by academics", "d": "Historical questions can only be answered by examining primary source documents"}, "answer": "b", "explanation": "The session notes that 'what is History?' is 'a philosophical question' dealing with the essence and nature of history; 'to be adequately tackled by the historian, he must have recourse to philosophy.'"}]}, {"session": 10, "topic": "African Philosophy", "points": ["Socio-political philosophy is a branch of philosophy whose central task is to prescribe how an ideal state ought to be organized, employing the tools of epistemology, ethics, ontology, and logic.", "The word 'political' is derived from the Greek 'polis' meaning city-state, where socio-political philosophy originated in ancient Greece in the 5th century B.C.", "The five central issues of socio-political philosophy are: the individual-society relationship; justification of government; principles guiding government aims and authority limits; constitution, institutions, and legal systems; and practical public policies.", "Socio-political philosophy derives its foundation from three fundamental philosophical disciplines: metaphysics (study of existence and man's relation to reality), epistemology (study of knowledge), and ethics (study of values guiding choices and actions).", "In the 5th century B.C., the Sophists challenged the legitimacy of the polis and its laws, prompting philosophical responses from Socrates (470-399 B.C.), Plato (427-347 B.C.), and Aristotle (384-322 B.C.).", "Plato based his political theory on the doctrine of forms, while Aristotle based his on a theory of biological naturalism; the Stoics, St. Augustine (A.D. 354-430), and Thomas Aquinas (1225-1274) justified political authority through belief in God and divinely instituted natural laws.", "Niccolo Machiavelli (1469-1527) broke with tradition by rejecting religion and classical philosophy, instead drawing on historical examples to offer practical advice to rulers in The Prince.", "Thomas Hobbes (1588-1679) argued that men must enter a social contract and surrender their natural liberties to an absolute sovereign, while John Locke (1632-1704) concluded the political state must have limited powers and citizens retain the right to revolution.", "Sceptical conservatives David Hume (1711-1776) and Edmund Burke (1729-1797) criticized both Hobbes and Locke, holding that tradition is the only basis for government and law.", "Jeremy Bentham (1748-1832) and John Stuart Mill (1806-1873) invoked the utilitarian principle of 'the greatest happiness for the greatest number,' advocating democratic, egalitarian, and welfarist political reforms.", "Continental European thinkers — Rousseau, Kant, Hegel, and Marx — drifted toward altruism and statism, regarding collectives as of greater reality and value than their individual members.", "Herbert Spencer (1820-1903) defended capitalism against socialism by appealing to the evolutionary theory of history; anarchists including Godwin, Proudhon, Bakunin, and Kropotkin criticized the state as inherently oppressive and advocated its abolition.", "Political philosophy was neglected through most of the 20th century due to logical positivism and linguistic analysis; John Rawls (neo-Kantian liberalism) and Robert Nozick (neo-Lockean libertarianism) revived it in the early 1970s.", "Individualism holds that the individual is prior to society because the mind belongs to the individual; collectivism opposes this by treating society as a super-organism in which the collective (tribe, race, or state) is the primary unit of reality and value.", "African political philosophy is a sub-set of political philosophy shaped specifically by Africa's peculiar historical experiences of slavery, colonialism, racialism, and neo-colonialism, which required unique solutions different from other regions.", "Ujamaa — literally meaning 'familyhood' — was articulated by Julius Nyerere (1922-1999) at Arusha on 5th February 1967 as the ideological basis of socialism in Tanzania.", "Nyerere identified three essentials of an ideal society — freedom, equality, and unity — which he argued were inherent features of traditional African life before colonialism introduced the phenomenon of social classes.", "Nyerere argued that African languages lacked vocabulary for the concept of 'class' because pre-colonial African society was classless; colonialism introduced class divisions into Africa.", "In Nyerere's socialist ideal state, land and all means of production are communally owned; the only permissible private ownership is personal tools such as a farmer's hoe, a carpenter's saw, and a family's house.", "Nyerere's foundational socialist principle is that 'without the acceptance of equality of all men, there can be no socialism'; he defined exploitation as a person with money making profit from a person without money through private ownership of the means of production.", "Leopold Senghor (1906-2001), together with Leon Damas and Aimie Cesaire, formulated Negritude to describe the cultural-political movement of French-speaking Africans and West Indian Negroes against the French colonial policy of assimilation.", "Senghor defined Negritude as the total cultural, social, and political values of African civilization and the black race as a whole, initially functioning as a pure ideology for decolonization; after independence he developed it into African socialism.", "The key difference between Nyerere and Senghor is one of degree, not kind: Nyerere advocated a total breakaway from Euro-philosophical tradition, while Senghor advocated selective adoption of European elements useful to African development; both rejected capitalism and orthodox socialism and saw traditional African societies as classless.", "Senghor's African socialism held that the problem was 'not how to put an end to the exploitation of man by man, but how to prevent it ever happening by bringing political and economic democracy back to life.'", "Kwame Nkrumah (1909-1972) believed complete industrialization is the key to African development, arguing that socialism and industrialization must go together and that all economic/social reconstruction without industrial and agrarian revolution is merely empty words.", "Nkrumah rejected the idea that socialism can be built in a single African country; he stated Ghana's independence was meaningless while vast African territories remained under colonial rule, requiring a pan-African approach to socialist construction.", "Nkrumah uniquely argued that traditional Africa no longer exists, having been corrupted by Afro-Islamic and Euro-Christian traditions — making him distinct from Nyerere's appeal to traditional roots and aligning him closer to the Marxist-Leninist tradition.", "Sekou Toure (1922-1984) called his brand of socialism 'communaucratique' deliberately to avoid appearing to import a foreign ideology; he rejected both capitalism (for imposing individualism and egotism alien to Africa) and communism (which he equated with collective/state capitalism), arguing Africa's struggle is between colonized peoples and colonizing powers, not between classes.", "Obafemi Awolowo (1909-1986) rejected the label 'African Socialism' because he viewed socialism as a normative science of universal application that should not bear the mark of any region; his 'democratic socialism' insists that government change occurs only through the electoral process and that revolutionary imposition of rule is immoral.", "Awolowo disagreed with Mao's dictum that 'power flows from the barrel of the gun,' asserting instead that 'power flows from a leadership sustained by the will and approval of the people freely articulated and given,' and invoked the role of the universal mind/God in bringing about an ideal state without necessarily using force."], "questions": [{"question": "From which Greek term is the word 'political' in socio-political philosophy directly derived?", "options": {"a": "Politeia", "b": "Polis", "c": "Logos", "d": "Ethos"}, "answer": "b", "explanation": "The word 'political' derives from the Greek 'polis' meaning city-state, where political philosophy originated in ancient Greece."}, {"question": "Which three fundamental philosophical disciplines provide the foundation for socio-political philosophy?", "options": {"a": "Logic, aesthetics, and theology", "b": "Ontology, axiology, and phenomenology", "c": "Metaphysics, epistemology, and ethics", "d": "Ethics, rhetoric, and logic"}, "answer": "c", "explanation": "Socio-political philosophy derives strength from metaphysics (study of existence), epistemology (study of knowledge), and ethics (study of values guiding choices and actions)."}, {"question": "The Sophists' 5th century B.C. challenge to the legitimacy of the polis provoked philosophical responses from which group of thinkers?", "options": {"a": "The Stoics, the Epicureans, and the Cynics", "b": "Socrates, Plato, and Aristotle", "c": "Machiavelli, Hobbes, and Locke", "d": "Augustine, Aquinas, and the Scholastics"}, "answer": "b", "explanation": "In the 5th century B.C., the Sophists challenged the legitimacy of the polis and its laws/institutions, prompting direct philosophical responses from Socrates, Plato, and Aristotle."}, {"question": "Thomas Hobbes's social contract theory concluded that individuals in a state of nature must:", "options": {"a": "Retain the right to revolution against any sovereign", "b": "Surrender their natural liberties to an absolute sovereign", "c": "Form a democracy based on the majority will", "d": "Obey only natural laws instituted by God"}, "answer": "b", "explanation": "Hobbes argued that to escape the brutal state of nature, men must enter into a social contract and surrender their natural liberties to an absolute sovereign."}, {"question": "John Locke's key departure from Hobbes in social contract theory was the conclusion that:", "options": {"a": "Citizens must surrender all natural rights unconditionally to the sovereign", "b": "Natural rights do not exist prior to political society", "c": "The political state must have limited powers and citizens retain the right to revolution", "d": "Tradition is the only valid basis for government and law"}, "answer": "c", "explanation": "While Hobbes argued for absolute sovereignty, Locke concluded the state must have limited powers and citizens retain the right to revolution against tyranny."}, {"question": "Ujamaa, Julius Nyerere's basis for Tanzanian socialism, was first formally articulated on:", "options": {"a": "January 1st, 1961", "b": "October 9th, 1964", "c": "April 26th, 1964", "d": "February 5th, 1967"}, "answer": "d", "explanation": "Ujamaa was first articulated by Nyerere at Arusha on the 5th of February 1967 as the ideological basis of socialism in Tanzania."}, {"question": "The Swahili word 'Ujamaa' literally translates to:", "options": {"a": "Brotherhood", "b": "Familyhood", "c": "Equality", "d": "Unity"}, "answer": "b", "explanation": "Ujamaa literally means 'familyhood' in Swahili, reflecting Nyerere's vision of a society structured on the bonds and mutual care of the family unit."}, {"question": "According to Nyerere, what phenomenon was foreign to Africa before colonialism, as evidenced by African languages lacking vocabulary to express it?", "options": {"a": "Democracy", "b": "Private property", "c": "Social classes", "d": "Religion"}, "answer": "c", "explanation": "Nyerere argued that the concept of class was introduced to Africa through colonial contact; African languages lacked the vocabulary for 'class' because pre-colonial African society was classless."}, {"question": "In Nyerere's ideal socialist state, which of the following forms of ownership is explicitly permitted?", "options": {"a": "Private ownership of farmland by individual farmers", "b": "Corporate ownership of industrial machinery", "c": "State ownership of all personal tools and household items", "d": "A farmer's personal hoe and a family's own house"}, "answer": "d", "explanation": "Nyerere's socialism communalizes land and means of production but allows limited private ownership of personal tools such as a farmer's hoe, a carpenter's saw, and a family's own house."}, {"question": "Nyerere's definition of exploitation is best summarized as:", "options": {"a": "The use of slave labour in agricultural production", "b": "A person with money making profit from a person without money through private ownership of the means of production", "c": "The extraction of natural resources by foreign multinational corporations", "d": "Unequal distribution of land regardless of how wealth is used"}, "answer": "b", "explanation": "Nyerere specifically defined exploitation as a person with money making profit from a person without money, with the source being private ownership of the means of production."}, {"question": "Leopold Senghor co-formulated the concept of Negritude with which two other intellectuals?", "options": {"a": "Kwame Nkrumah and Sekou Toure", "b": "Frantz Fanon and Patrice Lumumba", "c": "Leon Damas and Aimie Cesaire", "d": "Julius Nyerere and Kenneth Kaunda"}, "answer": "c", "explanation": "Senghor formulated Negritude together with Leon Damas and Aimie Cesaire as a cultural-political movement against the French colonial policy of assimilation."}, {"question": "The colonial policy against which Negritude was primarily a reaction was the French policy of:", "options": {"a": "Indirect rule", "b": "Apartheid", "c": "Segregation", "d": "Assimilation"}, "answer": "d", "explanation": "Negritude was formulated to describe the cultural-political movement of French-speaking Africans and West Indians against the specific French colonial policy of assimilation."}, {"question": "After independence, Senghor recognized that Negritude had 'run its course' and shifted to developing:", "options": {"a": "A theory of pan-African federalism", "b": "African socialism", "c": "A philosophy of democratic liberalism", "d": "A synthesis of Marxism and Christianity"}, "answer": "b", "explanation": "After independence, Senghor knew Negritude had served its decolonization purpose and thereafter developed his idea of African socialism."}, {"question": "The fundamental difference in approach between Nyerere and Senghor regarding European philosophy is that:", "options": {"a": "Nyerere embraced European philosophy wholesale while Senghor completely rejected it", "b": "Nyerere called for total breakaway from Euro-philosophical tradition while Senghor advocated selective adoption of useful European elements", "c": "Both fully accepted European philosophical frameworks with minor African modifications", "d": "Both fully rejected all European philosophical ideas without distinction"}, "answer": "b", "explanation": "Nyerere advocated total breakaway from Euro-philosophical tradition, while Senghor advocated adopting 'some essential things that are useful to African development' — a difference of degree, not kind."}, {"question": "Senghor's approach to exploitation in his African socialism was that the challenge was:", "options": {"a": "Ending current exploitation through revolutionary seizure of the means of production", "b": "Redistributing wealth equally among all citizens immediately", "c": "Not how to end existing exploitation, but how to prevent it ever happening by bringing political and economic democracy back to life", "d": "Nationalizing all industries while allowing foreign investment"}, "answer": "c", "explanation": "Senghor explicitly stated the problem in his African socialism was 'not how to put an end to the exploitation of man by man, but how to prevent it ever happening by bringing political and economic democracy back to life.'"}, {"question": "Which of the following BEST distinguishes Nkrumah's socialism from both Nyerere's and Senghor's?", "options": {"a": "Nkrumah rejected capitalism while Nyerere and Senghor accepted it", "b": "Nkrumah emphasized pan-African industrialization and rejected building socialism in a single country", "c": "Nkrumah based his socialism entirely on traditional African communal customs", "d": "Nkrumah advocated a return to a pre-colonial 'glorious past' more strongly than Nyerere"}, "answer": "b", "explanation": "Nkrumah's socialism uniquely required complete industrialization and pan-African scope — unlike Nyerere (Tanzania-focused, tradition-based) and Senghor (selective European adaptation), Nkrumah argued socialism cannot be built in a single African country."}, {"question": "Nkrumah's famous assertion about Ghana's independence was that it was meaningless unless:", "options": {"a": "Ghana adopted a fully socialist constitution within five years", "b": "Vast territories in Africa were also liberated from colonial rule", "c": "Ghana achieved complete industrialization", "d": "All ethnic groups in Ghana were equally represented in government"}, "answer": "b", "explanation": "Nkrumah stated that Ghana's independence was meaningless if vast territories in Africa remained under colonial rule, expressing his pan-African conviction that socialism cannot be built in a single country."}, {"question": "How did Nkrumah's view of traditional African society differ from Nyerere's?", "options": {"a": "Nkrumah saw traditional Africa as the ideal model for modern socialism while Nyerere dismissed it", "b": "Nkrumah argued traditional Africa no longer exists, having been corrupted by Afro-Islamic and Euro-Christian traditions, while Nyerere wanted to build on traditional roots", "c": "Both agreed traditional Africa provides a perfect foundation for modern socialist states", "d": "Nyerere argued traditional Africa no longer exists while Nkrumah believed it remained intact"}, "answer": "b", "explanation": "Nkrumah argued traditional Africa has been corrupted by Afro-Islamic and Euro-Christian traditions and no longer exists, making him distinct from Nyerere who appealed to building on Africa's 'glorious past.'"}, {"question": "Sekou Toure coined the term 'communaucratique' for his brand of socialism primarily because:", "options": {"a": "He wanted to align Guinea closely with Soviet communist ideology", "b": "He wished to avoid appearing to import a foreign ideology by using the term 'socialism'", "c": "He intended to emphasize the democratic nature of his system over Nyerere's Ujamaa", "d": "The term better described his rejection of all African traditional values"}, "answer": "b", "explanation": "Toure used 'communaucratique' specifically to avoid equivocation and false analogies — adopting the term 'socialism' would portray Guinea as importing a foreign ideology."}, {"question": "According to Sekou Toure, the fundamental struggle confronting Africa is:", "options": {"a": "Between the working class and the capitalist bourgeoisie", "b": "Between socialist states and Western capitalist powers", "c": "Between colonized peoples and colonizing powers, not between classes", "d": "Between traditional cultural values and modern industrial development"}, "answer": "c", "explanation": "Toure argued that Africa's struggle is not a Marxist class struggle but rather between the colonized people and the colonizing powers, distinguishing his context from European socialist theory."}, {"question": "Toure rejected capitalism because it imposes which values that he considered alien to Africa?", "options": {"a": "Democracy and individual rights", "b": "Industrialization and modernization", "c": "Individualism and egotism", "d": "Secularism and materialism"}, "answer": "c", "explanation": "Toure rejected capitalism because it imposes the values of individualism and egotism, which in his view are alien to African communal traditions."}, {"question": "Obafemi Awolowo's major philosophical objection to the label 'African Socialism' was that:", "options": {"a": "Africa is too ethnically diverse to have a single form of socialism", "b": "Socialism is a normative science of universal application that should not bear the mark of any region", "c": "Traditional African societies were never truly socialist in practice", "d": "The label would cause Western nations to withdraw economic support from Africa"}, "answer": "b", "explanation": "Awolowo viewed socialism as a normative science of universal application to all nations, therefore the question of 'African' socialism does not arise — it has no regional identity."}, {"question": "Why did Awolowo call his socialism 'democratic socialism'?", "options": {"a": "It merges classical democracy with communist collective ownership", "b": "Government installation and change is only permissible through the electoral process; revolutionary imposition is immoral", "c": "All economic decisions require approval by democratic referendum", "d": "It allows both private and state ownership under a written democratic constitution"}, "answer": "b", "explanation": "Awolowo's core democratic socialism insists that change must come through the democratic/electoral process alone; it is immoral for radicals to impose rule on people without their consent under the guise of socialist revolution."}, {"question": "Awolowo explicitly disagreed with which leader's statement that 'power flows from the barrel of the gun'?", "options": {"a": "Vladimir Lenin", "b": "Joseph Stalin", "c": "Fidel Castro", "d": "Chairman Mao"}, "answer": "d", "explanation": "Awolowo, as a Christian conscious of biblical injunctions against killing, specifically disagreed with Chairman Mao of China's dictum, asserting instead that power flows from leadership sustained by the will and approval of the people."}, {"question": "In socio-political philosophy, collectivism is BEST defined as the view that:", "options": {"a": "Individual citizens should collectively own the means of production", "b": "Society is a super-organism existing above individuals where the collective is the primary unit of reality and value", "c": "Government decisions should be made collectively through direct democracy", "d": "Individual rights are subordinate only when national security is threatened"}, "answer": "b", "explanation": "Collectivism treats society as a super-organism existing over and above its individual members, taking the collective (tribe, race, or state) as the primary unit of reality and standard of value — directly opposing individualism."}, {"question": "The 20th century neglect of political philosophy was largely attributed to the influence of:", "options": {"a": "Marxism and communism dominating academic discourse", "b": "The two World Wars devastating European intellectual institutions", "c": "Logical positivism and linguistic analysis, which were sceptical of reason apprehending objective moral truths", "d": "The Cold War forcing political philosophy to become ideologically polarized"}, "answer": "c", "explanation": "Political philosophy was neglected throughout most of the 20th century because of logical positivism and linguistic analysis, which were sceptical about reason's capacity to apprehend objective moral truths of any sort."}, {"question": "John Rawls is associated with which political-philosophical position in the 1970s revival of political theory?", "options": {"a": "Neo-Lockean libertarianism", "b": "Neo-Kantian liberalism", "c": "Neo-Marxist communitarianism", "d": "Neo-Hegelian statism"}, "answer": "b", "explanation": "John Rawls defended a neo-Kantian form of liberalism (A Theory of Justice), while his counterpart Robert Nozick defended a neo-Lockean libertarianism (Anarchy, State and Utopia) — both inaugurating the 1970s revival."}, {"question": "A political leader justifies their country's authoritarian control by arguing that the state is more real and more valuable than any of its individual citizens. This argument best reflects which philosophical position?", "options": {"a": "Individualism", "b": "Libertarianism", "c": "Democratic socialism", "d": "Collectivism"}, "answer": "d", "explanation": "Collectivism holds that the collective (in this case, the state) has greater reality and value than individual members — exactly the justification the leader is using to override individual interests."}, {"question": "Among the following African political thinkers, whose socialism most clearly follows in the tradition of Karl Marx and Lenin by insisting on industrialization as inseparable from socialist construction?", "options": {"a": "Leopold Senghor", "b": "Julius Nyerere", "c": "Kwame Nkrumah", "d": "Sekou Toure"}, "answer": "c", "explanation": "Nkrumah's socialism showed, like all modern Marxists, that socialism and industrialization go together; his insistence on agrarian and industrial revolution as prerequisites for socialism aligns him clearly with the Marx-Lenin tradition."}, {"question": "An African political philosopher argues that their country must not 'import' a foreign ideology, rejects both capitalism and communism as unsuitable for Africa's developmental stage, and insists the real African struggle is against colonial domination rather than class conflict. This description most accurately fits:", "options": {"a": "Kwame Nkrumah's Pan-African socialism", "b": "Julius Nyerere's Ujamaa", "c": "Sekou Toure's communaucratique", "d": "Obafemi Awolowo's democratic socialism"}, "answer": "c", "explanation": "All four features — rejecting the 'foreign ideology' label (hence 'communaucratique'), rejecting both capitalism and communism, framing the struggle as colonized vs. colonizer rather than class struggle — uniquely identify Sekou Toure's position."}]}, {"session": 11, "topic": "African Philosophy", "points": ["Philosophy etymologically means 'love for wisdom or knowledge,' and from the Ancient Greek perspective it originally connoted curiosity and the desire for fresh experience.", "Philosophy is defined in a narrow sense as a technical enterprise requiring formal training (making the philosopher a professional thinker who takes nothing for granted except on rational grounds) and in a broad sense as a worldview, belief system, and convictions governing the daily life of a people — sometimes called 'bar-parlour philosophy.'", "The four core areas of philosophy are metaphysics (ultimate reality), epistemology (ultimate truth), ethics (ultimate value), and logic (ultimate reason); philosophy is therefore a rational and systematic study of the nature of the world, man, and his position and goal in the world.", "J. S. Mbiti defines African philosophy as 'the understanding, attitude of mind, logic, perception, behind the manner in which African people think, act, or speak in different situations of life,' though this definition is considered too generalized.", "P. O. Bodunrin and P. Hountondji define African philosophy radically as philosophy done by African philosophers — extending the concept to include all research into Western philosophy carried out by Africans.", "Odera Oruka defines African philosophy as work dealing with specific African issues formulated by indigenous African thinkers or by thinkers versed in African cultural and intellectual life.", "The course text defines African philosophy as the reflection of an African or non-African on how Africans make sense of their existence and the world in which they live, based on African cultural experience and reality — and it possesses metaphysics, ethics, epistemology, logic, aesthetics, and science.", "The nature and tradition of African philosophy is found in the African philosophical tradition — every philosophy is rooted in a tradition, which is the spirit and style of that philosophy and the persistent and dominant orientation of a people's thought.", "National philosophical traditions are: British = empiricism, American = pragmatism, French = rationalism, German = idealism, Russian = materialism, Indian = spiritualism, and Chinese = humanism.", "African philosophy is characterised as more of co-existence with nature than conquest, collectivism rather than individualism, holism rather than atomism, synthesis rather than analysis, and monistic duality rather than dualism.", "The basic axiom (primary assumption) of African philosophy is spirit, life force, or vital force — the material has meaning and purpose only through the spiritual, a stance called 'spiritual empiricism.'", "According to Placid Tempels' Bantu philosophy, life forces are arranged in hierarchical order: God (highest), then divinities, ancestors, spirits, man, animals, plants, and minerals — superior forces can directly influence the lower, while lower forces can only indirectly influence higher ones.", "The seven problems of African philosophy are: (i) definition, (ii) documentation/undocumented knowledge, (iii) history, (iv) language, (v) logic and critical questions, (vi) methodology, and (vii) philosophical tradition — the most crucial being the problem of definition, since all other problems are offshoots of it.", "The African conception of God is non-anthropomorphic (human attributes are not ascribed to God), whereas Christian and Jewish conceptions are anthropomorphic — attributing to God the capacity to hear, see, feel, argue, regret, speak, love, hate, and be jealous.", "Africans do not worship God directly because: God cannot be conceived in image; God is not a local or personal deity but is for the whole universe; God is self-sufficient and does not need sacrifices made of things He created; and hierarchical order requires approaching God through lesser gods as intermediaries.", "The problem of evil does not arise in African philosophy because God remains inactive after creation, so evil cannot be attributed to Him; instead, evil is attributed to spiritual beings (witches, sorcerers, etc.) endowed with extraordinary powers — between God and man lie many powers and principalities, both good and evil.", "Evil serves a purposive function in African thought: moral evil punishes bad acts and operates through the doctrine of retribution; physical evil results from the activities and anger of spiritual beings — evil thus exists as evidence distinguishing moral uprightness from moral decadence.", "In African thought, the mind is superior to the body, yet mind and body are logically and functionally distinct but not ontologically distinct — they form a 'monistic duality,' meaning they are partners, each affecting the other, unlike Western dualism (two distinct entities) or monism (only one is real).", "According to D. E. Idoniboye, the mind has an 'active principle' and a 'quiescent counterpart' — it is the active principle that departs when someone becomes absent-minded, goes into a coma, or sleeps; full consciousness returns only when the active principle returns to the body.", "The soul in African philosophy is not absolutely but relatively immortal — there is a maximum period the soul can take on a body to reincarnate; thereafter the soul perishes and disintegrates completely, joining the ancestors.", "The Yoruba believe in 'Ori,' the Igbo in 'Chi,' and the Esan in 'Ehi' as the determinants of human destiny, all representing African versions of determinism — the view that given certain conditions, nothing else could happen apart from the way it happened.", "Human destiny (determinism) in African philosophy can be altered through the right sacrifices and worship of appropriate gods, and through behavioural choices — freedom and determinism are compatible since both involve causation (freedom caused by oneself, determinism by external factors).", "Mystical causality involves the interaction of spiritual, mystical, and human actions where appropriate manipulation of objects, words, gestures, or even thoughts can influence the behaviour of other objects even at a distance — this obstructs human freedom and renders its exercise difficult.", "Ethical causality relates to one's moral conduct and is a derivative of the principle of retribution — past actions determine present circumstances (backward-looking causation), meaning whatever happens to a person is a necessary consequence of past actions.", "Reincarnation is defined by Peter Geach as 'the successive animation of different human bodies by one human mind'; it can also mean passing into another living creature (man, animal, or plant) at death, and usually occurs only within the same clan.", "The reasons for reincarnation in African thought include: atonement for previous deeds or misdeeds, family resemblance and behavioural patterns, memory transfer (retrocognition), and divination — reincarnation gives successive chances to fulfil one's original destiny.", "Pan-Africanism was launched as a political movement in London in 1893 by Henry Sylvester Williams and later W. E. B. Du Bois — it is a response to Western disparaging comments on African thought and an attempt to define, characterise, and establish African cultural identity.", "The term 'Negritude' was first coined by Aimé Césaire of Martinique in his 1937 poem 'Return to my Native Land'; it was later popularised, politicised, and ideologised by Léopold Sédar Senghor, the first president of Senegal — Negritude constitutes an authentic African identity and distinctive mode of existence.", "Holism in African philosophy is a pluralistic theory based on the idea that the universe creates wholes and complete self-contained systems; D. A. Masolo notes that the holistic value is built around an ontology that accepts diversity and otherness without hierarchical judgments of human worth.", "African philosophy is practically relevant in ethics (developing an authentic African value system), politics (confederation/regionalism recommended for Nigeria; Pan-Africanism and Negritude reinvigorated), medicine (African traditional medicine), and science (African science, which is moral and mystical in causal explanation, now resonates with Relativity and Quantum theories)."], "questions": [{"question": "According to the text, what does philosophy etymologically mean?", "options": {"a": "Love for wisdom or knowledge", "b": "Critical analysis of society", "c": "Rational study of the sciences", "d": "Systematic inquiry into nature"}, "answer": "a", "explanation": "Etymologically, philosophy connotes 'love for wisdom or knowledge.' From the Ancient Greek perspective it originally meant curiosity and the desire for fresh experience."}, {"question": "In the narrow sense of philosophy, a philosopher is best described as:", "options": {"a": "Anyone who reflects on life's daily problems", "b": "A professional thinker who requires formal training and takes nothing for granted except on rational grounds", "c": "A person who believes in a particular worldview or doctrine", "d": "A bar-parlour thinker who draws on common experience"}, "answer": "b", "explanation": "In the narrow sense, philosophy is a technical enterprise requiring formal training. Here, a philosopher is a professional thinker who takes nothing for granted except on rational grounds — unlike the broad sense where 'everyone is a philosopher by nature.'"}, {"question": "Which of the following correctly pairs a philosophical area with what it studies?", "options": {"a": "Epistemology — ultimate value; Ethics — ultimate truth", "b": "Metaphysics — ultimate reason; Logic — ultimate reality", "c": "Epistemology — ultimate truth; Ethics — ultimate value", "d": "Logic — ultimate truth; Metaphysics — ultimate value"}, "answer": "c", "explanation": "The four core areas: metaphysics deals with ultimate reality, epistemology with ultimate truth, ethics with ultimate value, and logic with ultimate reason. Epistemology–truth and Ethics–value is the correct pairing."}, {"question": "P. O. Bodunrin and P. Hountondji's definition of African philosophy is considered 'radically new' because it:", "options": {"a": "Restricts African philosophy only to oral traditions of indigenous Africans", "b": "Defines African philosophy as philosophy done by African philosophers, including research into Western philosophy", "c": "Identifies African philosophy exclusively with African cultures, religions, and traditions", "d": "Focuses on the spiritual and communal harnessing of force in African societies"}, "answer": "b", "explanation": "Bodunrin and Hountondji's definition is called radically new because it defines African philosophy simply as philosophy done by African philosophers, extending it to include all research into Western philosophy carried out by Africans."}, {"question": "Odera Oruka defines African philosophy as work dealing with specific African issues formulated by:", "options": {"a": "Any scholar who has lived in Africa for at least five years", "b": "Indigenous African thinkers or thinkers versed in African cultural and intellectual life", "c": "African politicians and community leaders who address social problems", "d": "Only those who have received formal university-level philosophical training in Africa"}, "answer": "b", "explanation": "Oruka's definition specifies that African philosophy is formulated by indigenous African thinkers or by thinkers versed in African cultural and intellectual life — broadening the category beyond just indigenous people while still requiring cultural grounding."}, {"question": "Which of the following best represents the philosophical tradition associated with French philosophy?", "options": {"a": "Empiricism", "b": "Pragmatism", "c": "Rationalism", "d": "Idealism"}, "answer": "c", "explanation": "According to the text, French philosophy is identified with rationalism, just as British=empiricism, American=pragmatism, German=idealism, Russian=materialism, Indian=spiritualism, and Chinese=humanism."}, {"question": "The basic axiom of African philosophy — the 'primary assumption' — is:", "options": {"a": "Matter and its physical properties", "b": "Reason and logical deduction", "c": "Spirit, life force, or vital force", "d": "The collective will of the community"}, "answer": "c", "explanation": "In African philosophy, spirit, life force, or vital forces are the primary axioms. The material has meaning and purpose only through the lens of the spiritual — a stance the text calls 'spiritual empiricism.'"}, {"question": "According to Placid Tempels' Bantu philosophy, which entity occupies the highest position in the hierarchy of life forces?", "options": {"a": "Ancestors", "b": "Divinities", "c": "Man", "d": "God"}, "answer": "d", "explanation": "In Tempels' Bantu philosophy, life forces are arranged hierarchically: God is the highest, followed by divinities, ancestors, spirits, man, animals, plants, and minerals."}, {"question": "Among all the problems of African philosophy, which is identified as the most crucial because all other problems are offshoots of it?", "options": {"a": "The problem of methodology", "b": "The problem of documentation and undocumented knowledge", "c": "The problem of definition", "d": "The problem of language"}, "answer": "c", "explanation": "The text explicitly states that the most crucial of the seven problems is the problem of definition, because all other problems take their roots from it — the way other problems are tackled depends on what one takes African philosophy to be."}, {"question": "The African conception of God is described as non-anthropomorphic. This means that in African thought:", "options": {"a": "God is worshipped directly through elaborate temple rituals", "b": "Human attributes such as emotion, sight, and speech are NOT ascribed to God", "c": "God is conceived as having human-like emotions such as love and jealousy", "d": "God is identified with nature and natural phenomena"}, "answer": "b", "explanation": "Non-anthropomorphic means human attributes are not ascribed to God. The text contrasts this with Christian and Jewish conceptions, which ARE anthropomorphic — attributing to God the ability to hear, see, feel, argue, regret, speak, love, hate, and be jealous."}, {"question": "Why do Africans not approach God directly in worship, according to the text?", "options": {"a": "Africans believe God does not exist and so worship only ancestors", "b": "God is conceived as inactive and completely withdrawn from the universe after creation", "c": "God is non-local, cannot be imaged, is self-sufficient, and hierarchical order requires passing through lesser gods as intermediaries", "d": "God is considered malevolent and therefore dangerous to approach"}, "answer": "c", "explanation": "Multiple reasons are given: God cannot be conceived in an image; God is not a local or personal deity; God is self-sufficient; and the African world operates on hierarchical order — one cannot approach the highest being directly but must pass through intermediaries (lesser gods)."}, {"question": "Why does the 'problem of evil' NOT arise as a philosophical hurdle in African philosophy?", "options": {"a": "Africans deny the existence of evil in the world", "b": "African philosophy does not engage with questions about God", "c": "God remains inactive after creation, so evil cannot be attributed to Him — evil is instead caused by spiritual beings like witches and sorcerers", "d": "Africans believe God is the author of evil as a test of human faith"}, "answer": "c", "explanation": "The problem of evil arises when God is postulated as all-powerful AND all-loving, making evil inexplicable. In African philosophy, God is inactive after creation so evil is attributed to spiritual beings (witches, sorcerers, ancestors, etc.), not to God — evil and God can coexist without contradiction."}, {"question": "In African philosophy, moral evil is understood as:", "options": {"a": "A test sent by God to strengthen human character", "b": "Evidence of divine punishment operating through the principle of retribution for bad deeds", "c": "A random occurrence with no metaphysical explanation", "d": "The result of insufficient sacrifices to divinities"}, "answer": "b", "explanation": "The text explains that evil exists to punish bad acts and is ultimately a part of justice done by spiritual beings. Moral evil operates through the doctrine of retribution — it exists as evidence distinguishing moral uprightness from moral decadence."}, {"question": "The African theory of mind-body is best described as:", "options": {"a": "Dualism — mind and body are two entirely separate and independent entities", "b": "Monism — only the mind is real; the body is an illusion", "c": "Monistic duality — mind and body are logically and functionally distinct but not ontologically distinct", "d": "Materialism — only the body is real; the mind is a product of matter"}, "answer": "c", "explanation": "African theory asserts that mind and body are logically and functionally distinct but not ontologically distinct — they form a 'monistic duality.' This differs from Western dualism (two distinct real entities) and Western monism (only one is real)."}, {"question": "According to D. E. Idoniboye, what happens to the 'active principle' of the mind when a person goes into a coma?", "options": {"a": "It permanently merges with the quiescent counterpart", "b": "It departs from the body, and full consciousness returns only when it comes back", "c": "It transforms into a life force that strengthens the body's healing", "d": "It travels to the spirit world and receives messages for the person"}, "answer": "b", "explanation": "Idoniboye distinguishes the 'active principle' from the 'quiescent counterpart' of the mind. The active principle departs when one becomes absent-minded, goes into a coma, or sleeps — full consciousness is restored only when the active principle returns to the body."}, {"question": "In African philosophy, the soul is described as:", "options": {"a": "Absolutely immortal and incapable of destruction", "b": "A mere social construct with no metaphysical reality", "c": "Relatively immortal, with a maximum reincarnation period after which it perishes and joins the ancestors", "d": "Identical to the body and destroyed with it at physical death"}, "answer": "c", "explanation": "The text states the soul is 'not absolutely, but relatively immortal' — there is a maximum period the soul can take on a body to reincarnate. Thereafter, the soul perishes and disintegrates completely, joining the ancestors."}, {"question": "In Igbo culture, 'Chi' refers to:", "options": {"a": "A form of mystical healing power", "b": "The Igbo name for the Supreme God", "c": "The determinant of an individual's human destiny or purpose", "d": "A communal shrine dedicated to ancestor worship"}, "answer": "c", "explanation": "The text states that the Yoruba believe in 'Ori,' the Igbo in 'Chi,' and the Esan in 'Ehi' as the determinant of human destiny or purpose — representing African versions of determinism."}, {"question": "How does African philosophy reconcile human freedom with determinism?", "options": {"a": "By asserting that determinism is an illusion and human freedom is absolute", "b": "By claiming that destiny can be altered through the right sacrifices and worship, and that freedom and determinism are compatible through the concept of causality", "c": "By concluding that determinism eliminates all human responsibility for actions", "d": "By rejecting the concept of human destiny entirely"}, "answer": "b", "explanation": "The text says destiny/determinism can be altered through right sacrifices and worship of appropriate gods, and through behavioural patterns. Both freedom and determinism are compatible in the idea of causality — actions in freedom are caused by oneself; in determinism by external factors."}, {"question": "Mystical causality in African philosophy refers to:", "options": {"a": "The natural, observable cause-and-effect relationships in the physical world", "b": "The interaction of spiritual, mystical, and human actions where manipulation of objects, words, or thoughts can influence behaviour at a distance", "c": "The moral principle that one must reap the consequences of one's actions", "d": "The logical deduction of effects from known material causes"}, "answer": "b", "explanation": "Mystical causality involves the interaction of spiritual, mystical, and human actions — through appropriate manipulation of things, words, gestures, or even thoughts, behaviour of other objects can be influenced even at a distance. This differs from ethical causality, which relates to moral conduct."}, {"question": "Ethical causality in African philosophy is described as 'backward-looking causation.' This means:", "options": {"a": "Africans reject the idea that past events can influence the future", "b": "A person's present circumstances are a necessary consequence of their past actions", "c": "Moral judgments are always made by reviewing historical precedents from ancestors", "d": "Future events determine the meaning of present actions"}, "answer": "b", "explanation": "Ethical causality derives from the principle of retribution: effect follows cause as reward or punishment follows good or evil action. Whatever happens to a person is an inevitable outcome of their past actions — this is called backward-looking causation."}, {"question": "Peter Geach defines reincarnation as:", "options": {"a": "The transformation of the human spirit into an animal after death", "b": "The journey of the soul to the spirit world following physical death", "c": "The successive animation of different human bodies by one human mind", "d": "The physical resurrection of the dead body on judgment day"}, "answer": "c", "explanation": "Peter Geach's definition, cited in the text, is: reincarnation is 'the successive animation of different human bodies by one human mind.' The text also notes it can mean passing into another living creature (man, animal, or plant) at death."}, {"question": "Which of the following is NOT listed in the text as a reason for reincarnation?", "options": {"a": "Atonement for previous deeds or misdeeds", "b": "Family resemblance and behavioural patterns", "c": "Divine reward for exceptional moral virtue", "d": "Memory transfer or retrocognition"}, "answer": "c", "explanation": "The text lists four reasons for reincarnation: atonement for previous deeds/misdeeds, family resemblance and behavioural patterns, memory transfer (retrocognition), and divination. Divine reward for moral virtue is not mentioned."}, {"question": "Pan-Africanism was initially launched in London in 1893 by which two key figures?", "options": {"a": "Leopold Senghor and Aimé Césaire", "b": "Henry Sylvester Williams and W. E. B. Du Bois", "c": "J. S. Mbiti and Odera Oruka", "d": "Kwesi Wiredu and P. O. Bodunrin"}, "answer": "b", "explanation": "The text states Pan-Africanism was a political movement launched in London in 1893, initiated by Henry Sylvester Williams and later W. E. B. Du Bois (described as an African-American activist scholar)."}, {"question": "The term 'Negritude' was first coined by:", "options": {"a": "Leopold Senghor in his political speeches as Senegal's first president", "b": "Aimé Césaire of Martinique in his 1937 poem 'Return to my Native Land'", "c": "W. E. B. Du Bois in his Pan-African writings", "d": "C. S. Momoh in his writings on African philosophy"}, "answer": "b", "explanation": "The text is explicit: the first person who actually coined the term 'Negritude' was Aimé Césaire of Martinique in his poem 'Return to my Native Land' in 1937. Leopold Senghor later popularised, politicised, and ideologised the concept."}, {"question": "Holism in African philosophy holds that:", "options": {"a": "Reality is ultimately reducible to a single material substance", "b": "The fundamental principle of the universe is the creation of wholes, and knowledge or truth is many — accepting diversity without hierarchical judgments of human worth", "c": "Individual achievement is the highest expression of human potential", "d": "The physical world is an illusion and only spiritual reality matters"}, "answer": "b", "explanation": "Holism is described as a pluralistic theory based on the idea that the universe creates wholes and complete self-contained systems. D. A. Masolo notes it accepts diversity and otherness without hierarchical judgments of human worth — and acknowledges that knowledge or truth is not one but many."}, {"question": "In the African conception, how is the individual related to the community in philosophical terms?", "options": {"a": "The individual is completely subordinate to the community with no distinct identity", "b": "The individual is sovereign and the community is merely a collection of individuals", "c": "The individual and the whole are fused together, making the line between private and public philosophy difficult if not impossible to draw", "d": "The individual exists independently but voluntarily participates in communal life"}, "answer": "c", "explanation": "The text (William Abraham's point) says that in Africa the line between private and public philosophy is difficult if not impossible to draw because the individual and the whole are fused together — unlike Western philosophy whose framework is essentially individualistic and atomic."}, {"question": "How does the ideal existential orientation of African philosophy differ from that of Western and Asian philosophies?", "options": {"a": "African: conquer nature; Western: flee from life's illusions; Asian: co-exist with nature", "b": "African: co-exist with nature; Western: conquer the world and nature; Asian: flee from the illusions of life", "c": "African: flee from nature; Western: co-exist with nature; Asian: conquer the world", "d": "African and Asian share the same ideal of co-existence; Western alone aims to conquer nature"}, "answer": "b", "explanation": "The text states: the ideal life in Asian philosophy is to flee from the illusions of life in this world; Western philosophy seeks to conquer the world and nature; African philosophy seeks to co-exist with nature and the world — feeling at home in the universe."}, {"question": "What practical recommendation does C. S. Momoh make to fight corruption in Nigeria, drawing on African philosophy?", "options": {"a": "Restructuring the country into a confederation and holding free elections", "b": "Requiring every public office holder to swear an oath on juju, whose efficacy is real regardless of whether the swearer believes in it", "c": "Adopting European democratic institutions adapted to African cultural norms", "d": "Introducing Pan-African ideological education in all government ministries"}, "answer": "b", "explanation": "Momoh recommends that every public office holder be made to swear on specifically prepared juju spelling out consequences for willful enrichment — and states that 'the efficacy of juju is not a matter of belief, it is real.' This draws authentically on African traditional belief."}, {"question": "What form of government does the text recommend for Nigeria, based on African traditional political philosophy?", "options": {"a": "A unitary state with a strong central government controlling all regions", "b": "A military government guided by African traditional values", "c": "A confederation or regionalism, where the central government surrenders greater power to its constituent parts while a common organisation regulates shared concerns", "d": "A theocracy modelled on traditional chieftaincy systems"}, "answer": "c", "explanation": "The text recommends a confederation or regionalism for Nigeria — where the government of the whole surrenders greater power to the government of the parts, while a common organisation is set up to regulate matters of common concern. This is based on African traditional political structure."}, {"question": "According to the text, why does African traditional science resonate with modern scientific theories like Relativity and Quantum theory?", "options": {"a": "Both are purely empirical and exclude spiritual explanations", "b": "Both African science and modern physics agree that the material world is an illusion", "c": "Modern science has entered the spiritual world — accommodating non-physical dimensions such as spiritual entities — aligning with African science's moral and mystical causal explanation", "d": "Quantum theory proves the existence of witchcraft and ancestor spirits"}, "answer": "c", "explanation": "The text states: 'We are now living at a time when science at its highest power has entered the spiritual world.' Modern science now accommodates non-physical dimensions like spiritual entities, which aligns with African science's view that causal explanation goes beyond the physical and mechanical."}]}, {"session": 12, "topic": "Philosophy of Science and Technology", "points": ["Philosophy of science is a critical discussion of developments in science that examines how science has fared throughout the ages and how it has affected human destiny positively or negatively.", "For philosophy to maintain its pride of place in the realm of the sciences, it must make a clear statement and a significant contribution to the advancement of scientific knowledge.", "A philosophy that becomes subservient to science — acting as its 'handmaiden' as it was to theology in the medieval period — reduces itself to 'second fiddle' and consigns itself to obsolescence and irrelevance.", "The task of Philosophical Science is to prod scientists into 'an extremely healthy state of scepticism about many of the traditional foundations of their thinking' (E.A. Burtt, The Metaphysical Foundation of Modern Science).", "Galileo was the first in the history of science to observe the 'behaviour of falling bodies,' and his observations refuted Aristotle's theory that the rate of fall was proportional to the weight of the body.", "Collection of data for laboratory analysis and verification is a key characteristic of scientific knowledge because the way things are observed to behave may actually differ from how they truly behave.", "Experimentation in the laboratory determines the essential characteristics of things and constitutes a basic way of recognising a genuine work of science, especially in the natural sciences.", "A genuine work of science is characterised by formulation and testing of hypotheses, construction of theories, establishment of causal or probable laws, and results that are veridical (capable of being shown true or false), repeatable, and predictive.", "Research is 'ongoing activity' situated on a ground plan projected into an object sphere; it is the essence and kernel of science, and it demands commitment and rigour from all who participate in it.", "Rigour is the 'obligation to remain within the sphere opened up' — tenaciously remaining on course and in focus — and it is through rigour that research produces a strict opinion on what is true.", "Science is organised research devoted to attaining knowledge that establishes general laws governing particular, isolated facts, thereby increasing human power and technique for controlling and manipulating nature.", "Science has been described as 'trained and organised commonsense' and 'the critical and accurate observation and description of things and events.'", "In its strict or pure form, science is the 'quantitative and objective knowledge of nature' — knowledge for its own sake without regard for practical consequences — and is described as 'officialdom.'", "Science in the context of Philosophy of Science refers specifically to mathematical, physical, chemical, and natural disciplines (Mathematics, Physics, Chemistry, Astronomy, Biology, etc.) that claim exactness, objectivity, universality, and methodological orthodoxy.", "The social sciences are excluded from the strict definition of science because they lack rigour, laboratory experimentation, and exactness; they qualify only in a broad sense since they deal with facts that can be true or false.", "Studying the History and Philosophy of Science enables scholars to acquaint themselves with developments in the enterprise and purposively partake of the opportunities offered by the scientific outlook.", "An understanding of History and Philosophy of Science encourages governments and non-governmental organisations in developing nations to invest resources in the scientific enterprise by demonstrating science's progress and benefits.", "Scientific activities are produced primarily and mainly by a hunch — the feeling upon observation of facts that something might be the case — which sparks curiosity and gives impetus to investigation.", "A science culture requires, beyond the urge to know, dedication to research, intellectual stamina, the habit of seeking evidence and rigorously applying the logic of facts, and rejection of hearsay and rumour.", "A conducive social and political climate — one that ensures continuity and consistency of policy and insulates research from the whims of changing political fortunes — is necessary for the emergence of a science culture.", "Sandra Harding argued that science and knowledge 'will always be deeply permeated by value commitments and the social relations through which they come into existence,' making value orientation integral to research methodology.", "Sandra Harding also argued that we would have to 'reinvent science' to make sense of social experience, and that humanities and social sciences extolling emancipatory and democratic values must develop alongside the natural sciences.", "There are three distinguishable methods of presenting philosophy of science: the Pedestrian Method, the Critical Method, and the Original Philosophical Method.", "The Pedestrian Method discusses scientific topics (measurement, electrons, motion, etc.) without showing what is philosophical about them; it is described as 'threadbare, barren, pedestrian' and makes philosophy an 'all-comers affair' that any literate person can dispense.", "The 'anything goes' attitude — treating philosophy as a huge umbrella covering all theoretical activities — is untenable after centuries of division of philosophy into independent disciplines each with its own object sphere.", "The Critical Method entails examining science's fundamental assumptions and presuppositions, its competing theories, methods of inquiry, and relation to other fields; it is also called 'meta-science' or 'meta-scientific inquiry.'", "The Critical Method is not exclusive to trained philosophers — working scientists are also compelled to critique their methods — making philosophy of science open to both; however, when a scientist enters the philosophical arena, experience shows he never returns to the laboratory.", "The Original Philosophical Method heeds Husserl's call to 'go back to the things themselves' — to the etymology 'Philein Sophia' (love of wisdom) — and to philosophy's core areas: metaphysics (study of reality), epistemology (theory of knowledge), and ethics (norms of moral behaviour).", "Wisdom — 'the judicious balance of intuitive and discursive interpretations of our experience of being and of beings' — is generated only by the philosopher through pure reason; the scientist lacks this wisdom to guide the facts he produces, making the philosopher indispensable.", "Science becomes originally, truly, and radically philosophical if and only if a trained philosopher injects a priori metaphysical, epistemological, or ethical notions into science to elevate its empirical content to the rank of necessary, universal truth."], "questions": [{"question": "According to Session 12, philosophy of science is best described as:", "options": {"a": "The teaching of scientific topics such as measurement, velocity, and electrons to philosophy students", "b": "A critical discussion of developments in science examining how science has fared throughout the ages and affected human destiny", "c": "A sub-branch of natural science concerned with laboratory methodology", "d": "The application of scientific methods to solve philosophical problems"}, "answer": "b", "explanation": "The session defines philosophy of science as 'a critical discussion of developments in science which takes account of how it has fared throughout the ages, and how it has affected man's destiny positively or negatively.'"}, {"question": "The session warns that philosophy risks 'consigning itself to the dustbin of obsolescence' if it:", "options": {"a": "Refuses to engage with developments in natural science", "b": "Focuses exclusively on metaphysics and ethics", "c": "Becomes subservient to science and acts as its 'handmaiden'", "d": "Abandons the study of epistemology"}, "answer": "c", "explanation": "The text explicitly states that 'a philosophy that babysits the sciences or allows itself to be subservient to the disciplines reduces itself to the role of a second fiddle and in time consigns itself into the dustbin of obsolescence and irrelevance.' The analogy drawn is to scholasticism, where philosophy was the handmaiden of theology in the medieval period."}, {"question": "According to E.A. Burtt's The Metaphysical Foundation of Modern Science, the task of Philosophical Science is to:", "options": {"a": "Provide mathematical proofs for philosophical propositions", "b": "Prod scientists into an extremely healthy state of scepticism about the traditional foundations of their thinking", "c": "Reconcile religious doctrine with scientific discovery", "d": "Popularise scientific findings for a general audience"}, "answer": "b", "explanation": "The session directly quotes Burtt's work: 'the task of Philosophical Science is to prod scientists into an extremely healthy state of scepticism about many of the traditional foundations of their thinking.'"}, {"question": "Which scientist was the FIRST in the history of science to observe the 'behaviour of falling bodies'?", "options": {"a": "Isaac Newton", "b": "Aristotle", "c": "Copernicus", "d": "Galileo"}, "answer": "d", "explanation": "The session states: 'Galileo was the first in the history of science to start studying or observing the behaviour of falling bodies.' His observations led to refuting Aristotle's earlier theory of motion."}, {"question": "Aristotle's theory of motion, which was later refuted by observation, asserted that:", "options": {"a": "All bodies fall at the same rate regardless of weight", "b": "The rate of fall was proportional to the weight of the body", "c": "Heavier bodies fall slower than lighter bodies", "d": "Motion is only possible in a vacuum"}, "answer": "b", "explanation": "The session notes that Galileo's observations 'refuted earlier theories of motion such as that of Aristotle which asserted that the rate of fall was proportional to the weight of the body in question.'"}, {"question": "Why
