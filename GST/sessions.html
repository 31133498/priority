ll, superior attitude permeating 'our quotidian existence' and even 'amongst our scholars.' It is the metaphysical temperament — dogmatic insistence on one's own absolute perspective — applied in everyday social and intellectual contexts."}, {"question": "Why do some academic metaphysicians like Heidegger prefer to be called 'ontologists' rather than 'metaphysicians'?", "options": {"a": "Because ontology is a newer and more prestigious academic title", "b": "Because 'metaphysician' has been corrupted by association with occultism and the traditional search for hidden doubles of reality", "c": "Because Heidegger believed ontology was the same as epistemology", "d": "Because the term 'metaphysician' is banned in German academic philosophy"}, "answer": "b", "explanation": "The text states that traditional metaphysics 'concentrated its efforts on determining the hidden reality underlying the appearance of things' and that in developing societies, 'occultists, witches and wizards... now go by the name of metaphysicians.' This 'derailment of metaphysics' caused some like Heidegger to prefer the title 'ontologist.'"}, {"question": "The phenomenological attitude, as described in the session, is best characterized by:", "options": {"a": "Conducting empirical experiments to verify philosophical claims", "b": "Letting things stand out clearly as they are without prior conceptual prejudice — the habit of letting things be in their natural light", "c": "Adopting a single comprehensive principle to explain all of reality", "d": "Reducing all knowledge claims to logical propositions that can be verified"}, "answer": "b", "explanation": "The text describes phenomenological ontology as 'the orientation or habit of letting things stand out clearly as they are without prior conceptual prejudice or reification, that is, the habit of letting things in their natural light regardless of whether they make us happy or sad.'"}, {"question": "What is the significance of Protagoras of Abdera's position in Greek philosophy?", "options": {"a": "He proved that reality has no objective foundation beyond human perception", "b": "He introduced the human dimension, assigning primacy to human subjectivity as the measure of what is and what is not", "c": "He proposed water as the fundamental substance of reality", "d": "He argued that both Being and non-being are equally real"}, "answer": "b", "explanation": "The session states that 'Protagoras of Abdera introduced a human dimension and assigned primacy to human subjectivity — of things that are that they are, of things that are not that they are not.' This marked a shift from cosmic to human-centered metaphysics among the Pre-Socratics."}, {"question": "For a system to qualify as a philosophical system, it must:", "options": {"a": "Contain equal parts metaphysics, epistemology, and ethics with no one receiving primacy", "b": "Deal explicitly with questions of reality, truth, and value — what there is, how we access it, and how man should act", "c": "Be written by a professional philosopher with a doctorate in philosophy", "d": "Reject all claims from the positive sciences and specialized disciplines"}, "answer": "b", "explanation": "The text states: 'for a system to qualify as a philosophical system, it must deal explicitly with questions of reality, truth and value, that is, with what there is, the question of which access to what there is and how man should act in community.' Primacy may be given to one area over others."}, {"question": "The concept of man as 'homo viator' in the session signifies that:", "options": {"a": "Man is fundamentally a biological traveller adapting to different environments", "b": "Man's ultimate essence is that of a wanderer, finder and pointer of the way — not an overlord or ultimate initiator", "c": "Man must embark on physical journeys to discover metaphysical truth", "d": "Human existence is meaningless because we are always in transit"}, "answer": "b", "explanation": "The text states: 'Man in his ultimate essence, is a homo viator, a wanderer, an eccentric, a finder and a pointer of the way. He is not overlord; he is not the ultimate initiator.' This contrasts with the metaphysical temperament of seeing oneself as master and overlord of others."}, {"question": "The 'either-or syndrome' as described in the session represents:", "options": {"a": "A valid logical tool for making clear distinctions in philosophical argument", "b": "A form of neo-metaphysicism — a mental relapse into archaism that refuses to recognize alternative perspectives", "c": "The epistemological method of binary classification used in formal logic", "d": "Plato's dialectical method of arriving at truth through opposites"}, "answer": "b", "explanation": "The text states: 'The either-or perspective is neo-metaphysicism. It is a modern day version of the metaphysical temperament whose overcoming resides in the deliberate and careful cultivation of the phenomenological attitude.' It represents 'a mental relapse into archaism and a hopeless surrender to vituperative elitism.'"}, {"question": "According to the session, the mind's power to form 'horizons, relations, connections' antecedent to experience means that:", "options": {"a": "Human minds create reality entirely through imagination", "b": "The mind's schematizing faculty categorizes experience metaphysically, making every science that does this inherently metaphysical", "c": "Memory is the most important faculty in understanding reality", "d": "Empirical observation must always precede all conceptual understanding"}, "answer": "b", "explanation": "The text states that 'the mind has a power of forming horizons, relations, connections antecedent to experience' and that 'through the schematizing or image-forming faculty of the mind, both empirical and non-empirical concepts are designed for the ordering of experience. Any science that performs this task is invariably being metaphysical.'"}, {"question": "The text's reference to philosophy as a 'weak, senile Methuselah' is an analogy for:", "options": {"a": "The advanced age and wisdom of philosophy compared to young sciences", "b": "Philosophy's loss of independence and its undignified dependence on the positive sciences for relevance", "c": "The need for philosophy to retire and allow sciences to take over", "d": "The biblical figure's long life as a metaphor for philosophy's historical longevity"}, "answer": "b", "explanation": "The text warns against philosophy being 'a weak, senile Methuselah looking for relevance in the activities of the children (the positive sciences).' This describes philosophy's undignified loss of intellectual independence when it merely tags along with the sciences rather than providing foundational guidance."}, {"question": "According to the session, the key distinction between ontology and psychology is:", "options": {"a": "Ontology studies inanimate objects while psychology studies human beings", "b": "Describing general structures of consciousness necessary for knowledge is ontology, while describing particular mental acts of the existing valuing self is psychology", "c": "Ontology is purely theoretical while psychology is applied and practical", "d": "Ontology was developed by ancient Greeks while psychology is a modern discipline"}, "answer": "b", "explanation": "The text states: 'Any description of acts of consciousness as posited by the existing, valuing self is a psychology whereas a description of the structures of the acts of consciousness necessary for the constitution of knowledge in general is an ontology of mental acts.'"}, {"question": "When the text says philosophy must provide guidelines to sciences 'in a sagely, oracular manner,' it means philosophy should:", "options": {"a": "Issue authoritative decrees that scientists must obey", "b": "Constantly raise and renew the question of reality in general, providing foundational orientation rather than specific scientific instructions", "c": "Predict future scientific discoveries through metaphysical speculation", "d": "Replace the methods of specific sciences with philosophical analysis"}, "answer": "b", "explanation": "The text states: 'The proper way that philosophy can play the role of nourishing the sciences is to do so in a sagely, oracular manner, that is, by constantly raising and renewing the question of reality in general. In every age, the rejuvenation of the question of being would always provide new guidelines for the positive sciences.'"}, {"question": "The social manifestation of the 'metaphysical spirit' in traditional metaphysical thinking best illustrates which principle?", "options": {"a": "That philosophy has no practical relevance to social life", "b": "That absolutizing one's own perspective, when injected into society, produces intolerance, dictatorship, and violent conflict", "c": "That religion and politics should always be guided by metaphysical principles", "d": "That Greek philosophy was solely responsible for modern religious conflicts"}, "answer": "b", "explanation": "The session explicitly maps the metaphysical temperament — insisting one's perspective is absolute — onto religious conflicts (Christianity vs. Islam), political dictatorship, and extremism. 'The conflicts and clashes between Christians and Muslims all over the world are a product of the metaphysical spirit by the insistence on a cherished perspective over against nothing.'"}, {"question": "A student claims: 'Professional academic metaphysics is basically the same as witchcraft because both deal with supra-empirical reality.' According to the session, this claim is:", "options": {"a": "Correct, since both deal with reality beyond ordinary experience", "b": "Partially correct since the text acknowledges occultism is one form of metaphysics", "c": "Incorrect — professional academic metaphysics as ontology analyzes general structures of reality and is distinguishable from occultism", "d": "Correct, since the text uses the terms metaphysics and occultism interchangeably"}, "answer": "c", "explanation": "The text explicitly states: 'professional academic metaphysics, as the analysis of the general structures of Reality, is distinguishable from these various ways of actualizing metaphysical propensities. Professional academic metaphysics, strictly speaking, is ontology.' The text insists: 'Metaphysics is not witchcraft. Much less is it occultism or voodooism.'"}, {"question": "Why does the session argue that 'radical faith' must accommodate alternative perspectives and acknowledge that 'there is being everywhere'?", "options": {"a": "Because all perspectives are equally valid and no position can be better than another", "b": "Because radical faith that excludes alternatives collapses into the either-or syndrome — sheer extremism — failing to recognize that being pervades all things", "c": "Because religious faith requires acceptance of all religious traditions", "d": "Because positivism demands openness to all empirical possibilities"}, "answer": "b", "explanation": "The text states: 'Radical faith should not subscribe to the either-or syndrome because it is an intellectual canopy for extremism. A radical faith that does not subscribe to a middle course is sheer extremism.' Recognizing that 'there is being everywhere, not just this or that being' grounds the liberal temper and prevents extremism."}, {"question": "According to the session, the ultimate goal of phenomenological ontology is to graduate from the search for the ultimate nature of things to:", "options": {"a": "A complete catalog of all existing beings", "b": "A universal phenomenological ontology of man — a fundamental ontology rooted in man's essential nature", "c": "The replacement of all positive sciences with philosophical analysis", "d": "A purely logical system free from all metaphysical assumptions"}, "answer": "b", "explanation": "The text states: 'philosophy should have to graduate from the search for the ultimate nature of things to a universal phenomenological ontology of man.' Since 'every study of Being must take root in man's essential nature, ontology should have to reach out to the study of man's essential characteristics,' crystallizing in 'a phenomenological ontology of man.'"}]}, {"session": 4, "topic": "Epistemology and Theory of Knowledge", "points": ["Epistemology is the branch of philosophy that examines the nature, extent, and validity of human knowledge, answering the fundamental question 'How do we know?' — encompassing concepts, sensory validity, logical reasoning, memory, emotions, and all things mental.", "A.J. Ayer stipulated three necessary conditions for knowledge: the claim must be true, the knower must be sure of it, and the knower must have the right to be sure; Roderick Chisholm further added that what we know must also be reasonable and plausible.", "Common sense makes uncritical claims to knowledge but is historically and culturally limited, full of deception and uncertainty; epistemology subjects these everyday claims to rigorous scrutiny and exposes their limitations.", "Knowledge by acquaintance (Plato) requires the knower's mind or soul to be acquainted with the Forms in the world of Ideas — not through the senses but through ratiocination (reason); the soul perceives the Real before its contact with the body.", "In The Republic, Plato uses the analogies of the 'line' and 'cave' to show that genuine knowledge requires rising above sense perception via dialectics to the world of Forms; belief is the intermediate level between knowledge and opinion, and forms are the only true objects of knowledge.", "The Marxist (praxis) position holds that knowledge is explicable through practice; knowledge is historically conditioned, socially determined, and shaped by the epoch; mind is the highest product of matter — not the other way around — making our ontology define our epistemology.", "Knowledge as awareness holds that what we know is what we are aware of; St. Augustine distinguished immediate awareness (from sense-experience or internal mental experience) from spiritual awareness, both being products of the soul's perception.", "Knowledge as involvement means culturally delineated knowledge is acquired through participation and practice, producing competence and performance; in Platonic terms, involvement through discourse between pupil and teacher helps the soul recollect what it learned in the world of Forms.", "Knowledge of the heart is virtue-related and action-related knowledge rooted in feelings and moral perception, argued by David Hume, Miguel de Unamuno, and John Locke; it produces conviction, repentance, and adjusted behaviour, and disabuses the mind from immoral acts that reason may find an excuse for.", "Knowledge can entail belief but belief cannot entail knowledge; knowledge is justified belief requiring proof or evidence; Hamlyn defines belief as 'a state of mind in which propositions are taken to be true,' and Peirce defines it as 'the rule of action.'", "In the Theaetetus, Plato proves that true belief is not a sufficient condition for knowledge — orators and lawyers induce true belief without acquaintance with truth; he also dismisses 'true belief plus logos' as 'extremely darkened counsel'; knowledge is infallible, absolute, immutable, and eternal.", "Memory is the storehouse of the mind, performing three functions: remembering past events (retentive memory), association of ideas, and development of new ideas; without memory, human reason and intelligence are impossible.", "Scepticism denies the possibility and plausibility of absolute knowledge; the first sceptics in ancient Greece were the Sophists, who held knowledge is relative — making man the measure of what is and what is not; Gorgias argued knowledge cannot be communicated because personal acquaintance with the object is missing in the recipient.", "Academic sceptics (Arcesilaus, Carneades, Cicero, Sextus Empiricus, Diogenes Laertius) focused on the Socratic dictum 'All that I know is that I know nothing'; Carneades argued there are no distinguishing features between illusory and veridical perceptions, and recommended suspension of judgment.", "The Pyrrhonian School (attributed to Pyrrho of Ellis, 360–270 B.C., developed by Aenesidemus) produced epoché — suspension of judgment — about non-evident matters; Pyrrho doubted the human mind's power to penetrate the inner nature of things.", "Error is defined as 'a judgement that affirms what is not the case'; its sources include prejudice, pride, haste, fatigue, confused reasoning, and wishful thinking; it is a scandal to knowledge and an obstruction to objective knowledge.", "Descartes prescribed four rules to eliminate error: (i) avoid precipitancy and prejudice, accepting only what is clear and distinct; (ii) divide difficulties into as many parts as possible; (iii) conduct the mind from simplest to most complex; (iv) make complete enumeration of all links in an argument.", "A priori knowledge is knowledge whose validity is independent of experience; coined by Immanuel Kant, it is innate, intuitively evident, and expressed in necessary propositions (e.g., 'All husbands are married men') — the understanding of the subject implicitly entails the predicate.", "A posteriori knowledge derives its validity from matters of fact and experience; it is empirical, not necessarily certain, and expressed in synthetic propositions; most contingent propositions are a posteriori.", "An analytic proposition has the predicate's meaning contained in the subject (e.g., 'A spinster is an unmarried lady'); a synthetic proposition adds new predicate information not contained in the subject; a necessary proposition is true in all possible circumstances; a contingent proposition is true only in some circumstances.", "Religious knowledge is a product of feeling, emotion, reason, or faith — often through revelation (private, prophetic, or God's self-revelation through the Holy Spirit or nature); philosophers divide on this into three camps: agnostics, theists, and atheists.", "Rationalism (from Latin ratio, meaning reason) holds that reason expressed through mathematical method leads to true and certain knowledge; its modern father is René Descartes, though Plato anticipated it; rationalists mistrust the senses and rely firmly on reason.", "Spinoza identified three levels of the mind's operation: confused ideas (from external determination in the common order of nature), adequate ideas (through reason — clearly and distinctly perceived, with reference to God), and intuitive knowledge (the highest — perceiving the unity of individual and universal at a glance).", "In his 'Treatise on the Correction of the Understanding,' Spinoza identifies four levels of knowledge in ascending order: perception by hearsay, vague experience, concluding the essence of a thing from another, and perceiving a thing through its essence alone; God is the foundation of his epistemology.", "John Locke, father of classical empiricism, held all knowledge comes from experience through two channels: sensation (use of senses in contact with the sensible world) and reflection (the operation of the mind upon its own ideas); his tabula rasa doctrine holds the mind at birth is 'a white paper void of all characters, without any ideas.'", "Locke recognized three degrees of knowledge: intuitive (perceived directly by the mind without any intervening idea — the clearest and most certain), demonstrative (through proofs where each step must itself be intuitive, involving preceding doubt), and sensitive (evident in sense experience, requiring no additional proof beyond sensation).", "The coherence theory of truth holds that truth consists in relations of coherence among a set of beliefs, where parts derive meaning from the whole; associated with rationalists and idealists — Leibniz, Spinoza, Hegel, and Bradley.", "The correspondence theory of truth holds that a proposition is true if it corresponds to real-world facts (not in relation to other propositions); both Russell and Wittgenstein defined truth as correspondence of a proposition to a fact.", "The pragmatic theory of truth (Peirce, James, Dewey) holds that something is true if it has positive practical relevance to human life; the redundancy theory (Frank P. Ramsey) holds 'it is true that p' means no more than p; the performative theory (P.F. Strawson, supplementing Ramsey) holds truth is an expression of action, urging atomic rather than metalinguistic expressions.", "Epistemology's importance includes: ridding the mind of confusion, providing rational basis for change, developing critical attitudes toward knowledge claims, improving social relations, evaluating all branches of philosophy (ethics, metaphysics, aesthetics), distinguishing genuine knowledge from hunches, and making explicit that a person cannot relate above their level of cognition."], "questions": [{"question": "Epistemology as a branch of philosophy is primarily concerned with:", "options": {"a": "The ultimate nature of reality and what exists", "b": "How we acquire, validate, and determine the extent of human knowledge", "c": "The principles underlying moral right and wrong", "d": "The experience of beauty and standards of aesthetic judgement"}, "answer": "b", "explanation": "Epistemology examines the nature, extent, and validity of knowledge, answering 'How do we know?' It is not metaphysics (a), ethics (c), or aesthetics (d). The session defines it as the study of how the mind is related to reality and whether those relationships are valid."}, {"question": "A.J. Ayer's three conditions for a claim to constitute knowledge are that the claim must be true, the knower must be sure of it, AND:", "options": {"a": "The claim must be empirically verifiable by others", "b": "The claim must be mathematically demonstrable", "c": "The knower must have the right to be sure", "d": "The claim must be universally accepted by the community"}, "answer": "c", "explanation": "Ayer's third condition is that the knower must have the right to be sure — not just feel sure. This distinguishes genuine knowledge from lucky true belief. Options a, b, and d are not among Ayer's three stated conditions."}, {"question": "For Plato, genuine knowledge (as opposed to opinion or belief) is best characterised as:", "options": {"a": "Systematic observation and recording of physical phenomena", "b": "Intellectual perception acquired through participation in cultural practices", "c": "Acquaintance of the mind or reason with the Forms in the world of Ideas", "d": "Justified belief supported by eyewitness testimony"}, "answer": "c", "explanation": "Plato holds that genuine knowledge is acquaintance with the Forms (world of Ideas), reached by rising above sense perception through dialectics and reason. The soul perceives the Real before its contact with the body. Nothing in the perceptible world qualifies as true knowledge."}, {"question": "In Plato's Republic, the 'analogies of the line and cave' are used to illustrate that:", "options": {"a": "The physical world is the primary source of all knowledge", "b": "Knowledge progresses from belief at the mental stage to understanding through contemplation of Forms", "c": "Mathematical truths are the only certain form of knowledge", "d": "The mind is a blank slate that gradually fills through experience"}, "answer": "b", "explanation": "The analogies of the line and cave bring to a climax Plato's theory that the process of reasoning begins at the mental stage of belief, progresses through belief (intermediate between knowledge and opinion), and culminates in genuine knowledge through contemplation of Forms — reached via dialectics."}, {"question": "A judge in a court case reaches a correct verdict based on compelling eyewitness testimony, though she was not present at the crime. According to Plato's argument in the Theaetetus, the judge's mental state is best described as:", "options": {"a": "Knowledge, because she reached the correct conclusion through sound reasoning", "b": "Knowledge, because her belief turned out to be true", "c": "True belief, which is not sufficient for knowledge because acquaintance with the truth is missing", "d": "Demonstrative knowledge, because it was established through proof"}, "answer": "c", "explanation": "Plato uses exactly this scenario in the Theaetetus: orators and lawyers produce true belief in their audiences without acquaintance with the events. The best the judge can claim is persuasion from evidence — true belief, not knowledge. Knowledge requires acquaintance with the truth, not merely a correct conclusion."}, {"question": "The Marxist claim that 'our ontology also defines our epistemology' means which of the following?", "options": {"a": "Physical reality is an illusion created by the mind's cognitive activity", "b": "Our material and social conditions of existence shape the character and content of our knowledge", "c": "Only those trained in philosophy can access true knowledge", "d": "Knowledge of God is the highest form of knowledge available to humans"}, "answer": "b", "explanation": "The Marxist position holds that knowledge has a social character because we are social animals, and our knowledge is context- and content-sensitive as well as epoch-related. Our material existence (ontology) determines the character of our knowledge — knowledge is historically conditioned and socially shaped."}, {"question": "St. Augustine's contribution to the concept of 'knowledge as awareness' was to distinguish between:", "options": {"a": "Sensory awareness and rational awareness", "b": "Immediate awareness and spiritual awareness", "c": "Individual awareness and communal awareness", "d": "Past awareness and present awareness"}, "answer": "b", "explanation": "The session explicitly states that 'Philosophers like St. Augustine made distinction between the immediate awareness and spiritual awareness.' Immediate awareness can be a product of sense-experience or internal mental experience, while spiritual awareness relates to the soul's perception."}, {"question": "Gorgias argued that knowledge cannot be communicated. The core reason for his view is that:", "options": {"a": "Language is inherently ambiguous and can never convey precise meaning", "b": "Knowledge is so complex that words are always inadequate to capture it", "c": "Even if knowledge is verbalized, the recipient lacks personal acquaintance with the objects of knowledge", "d": "Only mathematical symbols, not words, can express genuine truths"}, "answer": "c", "explanation": "Gorgias held that when knowledge is verbalized, what is expressed are merely words — and for those words to be meaningful, the recipient would need personal acquaintance with the objects of knowledge. That vital element of acquaintance cannot be transmitted through words alone."}, {"question": "Carneades of the Academic Sceptics recommended suspension of judgment (epoché) primarily because:", "options": {"a": "He believed all knowledge was merely a matter of opinion with no objective basis", "b": "He argued there are no distinguishing features between illusory perceptions and veridical ones", "c": "He held that divine revelation is the only reliable source of knowledge", "d": "He believed the physical world was constantly changing and therefore unknowable"}, "answer": "b", "explanation": "Carneades argued that since we cannot distinguish between illusory and veridical (truth-bearing) perceptions from the inside — they feel the same — we have no reliable basis for claiming certainty about perception. Therefore, suspension of judgment is the rational response. This is a targeted epistemological argument, not a general nihilism (a) or reliance on revelation (c)."}, {"question": "The Pyrrhonian School's concept of 'epoché' refers to:", "options": {"a": "The eternal nature of God as perceived by reason", "b": "The intermediate mental state between knowledge and sensation", "c": "Suspension of judgment about matters that deal with what is non-evident", "d": "The process of dividing a problem into its simplest components"}, "answer": "c", "explanation": "The session defines epoché as 'suspension of judgment' — the Pyrrhonian School's major achievement was developing sceptical argumentation to produce this state of suspended judgment about non-evident matters. Pyrrho doubted the human mind's ability to penetrate the inner nature of things."}, {"question": "Descartes' third rule for directing the mind — 'conducting my mind in an orderly fashion, starting with what was simplest and easiest to know, and rising little by little to the knowledge of the most complex' — is best described as the principle of:", "options": {"a": "Radical doubt", "b": "Prejudice avoidance", "c": "Complete enumeration", "d": "Ordered reasoning from simple to complex"}, "answer": "d", "explanation": "This is Descartes' third rule. The first rule is avoiding precipitancy and prejudice (b describes the first rule), the second is dividing difficulties into parts, the third is the ordered progression from simple to complex, and the fourth is complete enumeration of argument links (c describes the fourth rule)."}, {"question": "The proposition 'All triangles have three sides' is best classified as:", "options": {"a": "A posteriori and synthetic", "b": "A priori and analytic", "c": "Contingent and empirical", "d": "A priori and synthetic"}, "answer": "b", "explanation": "The proposition is a priori because its truth is knowable independently of experience (no investigation needed) and analytic because 'having three sides' is contained in the very definition/meaning of 'triangle.' It is necessarily true in all possible circumstances."}, {"question": "John Locke's tabula rasa doctrine implies which of the following about the nature of the human mind at birth?", "options": {"a": "The mind contains innate mathematical principles placed there by God", "b": "The mind is a white paper void of all characters and ideas, shaped entirely by subsequent experience", "c": "The soul retains memories from its pre-bodily existence in the world of Forms", "d": "The mind has innate moral intuitions that guide behaviour from birth"}, "answer": "b", "explanation": "Locke declares in his Essay that the mind at birth is 'a white paper void of all characters, without any ideas.' All knowledge is subsequently built through sensation and reflection. This directly refutes rationalist and Platonist claims of innate knowledge (a, c, d)."}, {"question": "According to Locke, which degree of knowledge requires that each step in establishing a proof must itself be intuitively certain?", "options": {"a": "Sensitive knowledge", "b": "Intuitive knowledge", "c": "Demonstrative knowledge", "d": "Religious knowledge"}, "answer": "c", "explanation": "Demonstrative knowledge derives from proofs (not directly perceived), but — critically — 'each step must be intuitive.' This means the chain of reasoning depends on intuitive certainty at each link, even though the overall conclusion is not immediately self-evident. Intuitive knowledge (b) needs no such chain; sensitive knowledge (a) relies on sensation."}, {"question": "Which of the following correctly identifies the TWO sources of experience according to John Locke?", "options": {"a": "Reason and intuition", "b": "Memory and imagination", "c": "Sensation and reflection", "d": "Perception and demonstration"}, "answer": "c", "explanation": "Locke explicitly defines experience in two ways: (i) sensation — the use of our senses in coming into contact with the sensible world, and (ii) reflection — the operation of our mind within us, processing and reflecting on its own ideas. All knowledge ultimately derives from these two sources."}, {"question": "The coherence theory of truth holds that a proposition is true if:", "options": {"a": "It corresponds to an observable fact in the external world", "b": "It has been verified through practical application in human life", "c": "It is rational, justified, and internally coherent with the whole system of beliefs", "d": "It can be reduced to a simple assertoric statement without metalinguistic prefix"}, "answer": "c", "explanation": "The coherence theory takes truth to consist in relations of coherence among a set of beliefs: 'something is coherently true if it is rational, justified, and is characterized by internal relation in such a way that the part gets its meaning from the whole.' Option a is the correspondence theory, b is the pragmatic theory, and d describes the redundancy theory."}, {"question": "Frank P. Ramsey described the use of words like 'truth' and 'facts' as 'nothing but a roundabout way of asserting a proposition' and called treating them as separate problems 'a linguistic muddle.' This reflects which theory of truth?", "options": {"a": "Correspondence theory", "b": "Coherence theory", "c": "Pragmatic theory", "d": "Redundancy theory"}, "answer": "d", "explanation": "This is the redundancy theory of truth, attributed to Frank P. Ramsey. It holds that 'it is true that p' means no more than p — the prefix 'it is true' is redundant and inactive. Saying something is true adds no new information beyond simply asserting the proposition itself."}, {"question": "P.F. Strawson invented the Performative Theory of Truth specifically to:", "options": {"a": "Replace the Correspondence Theory, which he considered factually incorrect", "b": "Supplement Ramsey's Redundancy Theory and advocate for atomic language over metalinguistic expressions", "c": "Provide a pragmatic basis for determining which actions produce true outcomes", "d": "Defend the view that only scientific propositions can be evaluated as true or false"}, "answer": "b", "explanation": "The session states Strawson 'invented the performative theory of truth to supplement Ramsey's Redundancy Theory of Truth.' Both Ramsey and Strawson believed truth should be expressed in simple or atomic language instead of metalinguistic expressions — which lead to error. Their shared goal is correcting wrong expressions in stating truth."}, {"question": "Which of the following statements about Spinoza's epistemology is CORRECT?", "options": {"a": "Spinoza holds that all knowledge derives from sensory experience and reflection", "b": "For Spinoza, confused ideas represent the highest level of knowledge", "c": "Spinoza's epistemology is grounded in God as the foundation, with intuitive knowledge derived from an adequate idea of God's formal essence", "d": "Spinoza argues that sense-perception is more reliable than reason for attaining knowledge"}, "answer": "c", "explanation": "The session states that 'intuitive knowledge is innate and derives from God. God is the foundation of Spinoza's epistemology. And the knowledge of God is the highest possible knowledge that gives blessedness.' Adequate and intuitive knowledge are necessarily true because they proceed from an adequate idea of God's formal essence. Confused ideas are the lowest level (b is false), and Spinoza is a rationalist who mistrusts the senses (a, d are false)."}, {"question": "Spinoza identifies 'confused ideas' as arising when:", "options": {"a": "The mind perceives the unity of individual and universal simultaneously", "b": "The mind is determined externally to contemplate things in isolation in the common order of nature", "c": "The mind proceeds from an adequate idea of God's formal essence", "d": "The mind reflects on its own operations independently of external causes"}, "answer": "b", "explanation": "The session explains that 'Whenever the idea in the mind is determined externally to contemplate things in isolation, the mind has confused ideas.' This is the lowest level of knowledge — when the mind is passively determined by external, random causes rather than actively reasoning from within. Option a describes intuitive knowledge, c describes adequate/intuitive knowledge, and d describes reflection more broadly."}, {"question": "The proposition 'The current rector of this university is a woman' is best classified as:", "options": {"a": "A priori and analytic", "b": "Necessary, because it is stated with certainty", "c": "A posteriori and contingent", "d": "Synthetic a priori"}, "answer": "c", "explanation": "This proposition requires empirical investigation to verify (a posteriori) and is contingently true — it could be false under different circumstances (a different person could hold the position). Most contingent propositions are a posteriori, as the session states. It is not analytic because 'being a woman' is not part of the meaning of 'rector.'"}, {"question": "According to the session, why is scepticism philosophically valuable despite its denial of certain knowledge?", "options": {"a": "It proves that all human knowledge is false and should be abandoned", "b": "It confirms that divine revelation is the only reliable alternative to sensory knowledge", "c": "It serves as a tool to overhauling ignorance, revealing the dynamics of knowledge, and forcing philosophical rigor", "d": "It shows that only mathematical and logical truths deserve the name 'knowledge'"}, "answer": "c", "explanation": "The session states: 'scepticism can serve as a tool to overhaul our stockpile of ignorance.' Descartes used scepticism this way. It 'helps us discover the extent of freedom of will,' 'sifts objects of belief from knowledge,' and 'has always led to advancement of knowledge.' Scepticism is productive, not merely destructive."}, {"question": "Hamlyn defines belief as 'a state of mind in which propositions are taken to be true,' while Peirce defines it as 'the rule of action.' What do these two definitions share in common?", "options": {"a": "Both treat belief as equivalent to justified knowledge", "b": "Both imply belief involves accepting propositions as true — whether as a mental state or a habit of action — without requiring proof", "c": "Both restrict belief to religious and moral contexts", "d": "Both require the believer to have personal acquaintance with the object of belief"}, "answer": "b", "explanation": "The session notes the common element: 'the common thing about belief is that propositions are accepted as true, or habits are perpetuated on the ground of lack of proof.' Belief does not require the evidence or justification that knowledge demands — it involves taking something as true (mentally or behaviourally) without proof."}, {"question": "The session describes knowledge of the heart as being different from ordinary rational knowledge because it:", "options": {"a": "Is derived solely from logical deduction and mathematical proof", "b": "Is a higher form of knowledge accessible only to trained philosophers", "c": "Is action-related, rooted in feelings and moral conviction, and disabuses the mind from immoral acts that reason may excuse", "d": "Is identical to a priori knowledge since both are independent of sense experience"}, "answer": "c", "explanation": "Knowledge of the heart is explicitly described as 'virtue related' and action-related — producing 'conviction, repentance and adjusted behaviour.' The key claim is that it 'disabuses our mind from immoral acts, as murder, stealing, adultery... that reason may find an excuse for.' It operates through feelings and moral perception, not logical demonstration."}, {"question": "According to the session, memory's importance to knowledge is best captured by which statement?", "options": {"a": "Memory creates original knowledge by generating new ideas independent of experience", "b": "Memory stores and organises past encounters, enabling association of ideas and development of new ideas — without it, reason itself fails", "c": "Memory is only useful for recalling sensory experiences and has no role in rational knowledge", "d": "Memory is the primary faculty that distinguishes rationalism from empiricism"}, "answer": "b", "explanation": "The session states memory is 'the storehouse of the mind' performing: (i) remembering past events, (ii) association of ideas, and (iii) development of new ideas. Critically: 'we cannot talk of human beings with reason or intelligence without recourse to memory' — without it, 'man will simply become an imbecile.'"}, {"question": "The term 'rationalism' derives from the Latin 'ratio,' and its modern founder is René Descartes — yet Plato is also associated with this tradition. What do Plato and Descartes share as rationalists?", "options": {"a": "Both hold that all knowledge derives ultimately from sense experience", "b": "Both distrust the senses as a reliable source of knowledge and rely on reason as the path to truth", "c": "Both argue that practical activity is the only test of genuine knowledge", "d": "Both hold that knowledge is relative and culturally determined"}, "answer": "b", "explanation": "The session states that 'The rationalists mistrust the senses and adhere firmly to reason.' Plato's doctrine that genuine knowledge requires moving beyond sense perception to the world of Forms through dialectics, and Descartes' method of radical doubt and reliance on clear and distinct rational ideas, both exemplify this distrust of the senses in favour of reason."}, {"question": "Spinoza's four levels of knowledge in the 'Treatise on the Correction of the Understanding' are, in ascending order:", "options": {"a": "Sensation, memory, reason, intuition", "b": "Perception by hearsay, vague experience, concluding essence from another thing, perceiving a thing through its essence alone", "c": "Confused ideas, adequate ideas, intuitive ideas, divine knowledge", "d": "Sensitive, demonstrative, intuitive, revelatory"}, "answer": "b", "explanation": "The session explicitly lists Spinoza's four levels from the Treatise: (1) perception by hearsay, (2) vague experience, (3) concluding the essence of a thing from another, and (4) perceiving a thing through its essence alone (the highest). Option c describes the three levels from Ethics, not the Treatise, and conflates the two frameworks."}, {"question": "The correspondence theory of truth, as described in the session, differs from the coherence theory primarily because it:", "options": {"a": "Measures truth by practical usefulness rather than logical consistency", "b": "Assesses the truth of a proposition by its relation to the world and its correspondence to facts, not by its relation to other propositions", "c": "Holds that truth is determined by community consensus rather than individual judgment", "d": "Reduces all truth claims to simple assertoric statements"}, "answer": "b", "explanation": "The session explicitly contrasts the two: coherence theory assesses truth through relations among propositions in a belief system. The correspondence theory 'takes the truth of a proposition, not in its relations to other propositions, but in its relations to the world, its correspondence to the facts.' Both Russell and Wittgenstein defined truth this way."}, {"question": "Locke's empiricism becomes 'more questionable' (as described in the session) when he discusses degrees of knowledge, primarily because:", "options": {"a": "He acknowledges intuitive knowledge — knowledge perceived directly by the mind without sense intervention — which seems to undermine his empiricist foundation", "b": "He rejects the reliability of sensation entirely in his later work", "c": "He endorses Plato's theory of Forms as the basis of intuitive knowledge", "d": "He denies that reflection can produce genuine knowledge"}, "answer": "a", "explanation": "The session notes that Locke's 'empirical stand becomes more questionable in his exposition of the degrees of knowledge' because he recognises intuitive knowledge — perceived 'directly by the mind without the intervention of any other idea.' This acknowledgment of a non-sensory, direct form of knowledge creates tension with his foundational empiricist claim that all knowledge derives from experience."}, {"question": "The pragmatic theory of truth, associated with Peirce, James, and Dewey, holds that truth is best understood as:", "options": {"a": "The correspondence of a proposition to an observable fact in the external world", "b": "Internal consistency within a complete system of rationally connected beliefs", "c": "Success in practice — having positive, practical relevance to human life", "d": "Whatever a community of rational inquirers would agree upon over time"}, "answer": "c", "explanation": "The session defines the pragmatic theory as holding that 'something is true if it has positive, practical relevance to human life' and that 'anything that cannot be proved to have relevance to life cannot be said to be true, and should be discarded.' The maxim of pragmatism is that the meaning of a concept is given by reference to its practical or experimental consequences."}]}, {"session": 5, "topic": "Ethics and Aesthetics", "points": ["Ethics derives from the Greek word 'ethos' meaning character or custom, and is defined as the philosophical study of morality — the systematic examination of the fundamental principles of moral law using critical analysis and conceptual clarification.", "Morality, derived from the Latin 'moralis' (introduced by Cicero as the Latin equivalent of the Greek 'ethos'), refers to a person or group's standards of right and wrong or good and bad, comprising principles that regulate human conduct in society.", "The subject matter of ethics is morality; when one critically reflects on moral standards of oneself, society, or institutions, one is performing ethics.", "Ethics has three major sub-divisions: descriptive ethics (describes moral beliefs and practices), meta-ethics (analyses moral concepts and language), and normative ethics (prescribes standards and norms for conduct).", "Descriptive ethics describes and explains the moral positions held by individuals, groups, and societies without passing normative judgment — e.g., 'stealing is prohibited in traditional African society.'", "Meta-ethics analyses the concepts, language, and principles used in ethics to determine their actual meanings, connotations, and implications; meta-ethical theories include naturalism, anti-naturalism, emotivism, prescriptivism, and intuitionism.", "Normative ethics prescribes standards and norms regulating human behaviour; it determines correct moral principles and answers questions about which norms are worthy of acceptance and why.", "The distinction between moral judgment and moral principle: moral judgment concerns a specific human action, while moral principle concerns human actions and character in general; correct moral judgment is based on ideal moral principles.", "Ethics is a normative (prescriptive) science dealing with 'what ought to be,' whereas the empirical sciences are descriptive and deal with 'what is.'", "Moral issues arise when a choice affects the wellbeing of others — either by increasing benefit or causing harm; actions affecting only the agent's own wellbeing are subject to debate as to whether they constitute moral issues.", "Moral actions have three defining properties: (1) they are purposive or consciously performed, (2) they are voluntary or carried out of free choice, and (3) they affect or tend to affect the wellbeing of others in society.", "Consequentialist (teleological) theories, derived from the Greek 'teleos' meaning end or purpose, hold that the moral status of an action is determined by its results; examples include utilitarianism, ethical egoism, and hedonism.", "Utilitarianism holds that an action is right if it yields the greatest benefit for the greatest number of people — making it the most prominent consequentialist theory.", "Deontological theories, from the Greek 'deon' meaning duty, hold that the rightness or wrongness of actions is determined by the motive or intention of the agent, not its consequences; Immanuel Kant's categorical imperative is the most prominent example.", "The divine command theory, associated with St. Thomas Aquinas and St. Augustine, holds that an action is right or wrong precisely because God commands it — murder is not intrinsically bad but wrong because God says so.", "Ethical relativism argues that morality is relative to place and time, meaning there is no single moral standard uniformly applicable to all humans in all circumstances; different societies determine the moral worthiness of conduct.", "Moral individualism (subjectivism), associated with existentialism and Jean Paul Sartre, holds that individuals make actions right or wrong by deciding which standards to adopt — it is the individual, not God or society, who confers moral status.", "Conventionalism in ethics holds that an action is right or wrong because someone (God, society, or the individual) says or believes it is so; it encompasses the divine command theory, ethical relativism, and moral individualism.", "Moral realism holds that there is an objective ethical truth independent of anyone's view and admits exceptions, while ethical absolutism insists that moral standards apply to all humans at all times and in all circumstances with no exceptions.", "Moral universalism holds that moral principles are universal but allow for exceptions when higher values require it — for example, killing may be morally justified in self-defence, war, or capital punishment.", "Professional ethics refers to the specific moral code governing a profession; the Hippocratic Oath is the professional ethics guiding medical doctors, while ethics also regulates politics, defining responsibilities of leaders to citizens and vice versa.", "The term 'aesthetics' was introduced by the German philosopher Alexander Gottlieb Baumgarten in AD 1753 and derives from the Greek word 'aesthetikos' meaning perceptive; it is the branch of philosophy dealing with beauty, ugliness, and value judgments in the arts.", "Aesthetics is also called the philosophy of arts; the arts encompass traditional forms (music, literature, architecture, sculpture, dance, painting) as well as modern additions such as photography, film, performance arts, and popular culture.", "The scope of aesthetics covers both beauty and ugliness; 'beauty is in the eye of the beholder' reflects subjectivism, while objectivists argue that attributes can be objectively discerned as beautiful or ugly.", "Art as Imitation is the oldest theory of art, dating to Plato and Aristotle; it holds that painting depicts objects and people, music imitates moods, and theatre imitates human action.", "Plato's view that art is 'an imitation of an imitation' rests on his theory of Forms: reality consists of archetypes beyond sense experience, physical objects imitate those Forms, and artists copy physical objects — making art doubly removed from reality.", "The theory of Art as Play originated from Immanuel Kant's Critique of Judgement; it holds that art is a means of releasing excess energy and is related to the pleasure theory and the notion of art as escape from life.", "Art as Expression, associated with the Italian philosopher Benedetto Croce, holds that art is intuition expressed; the artist uses a peculiar artistic medium to relay a message — Nigerian musician Fela Anikulapo-Kuti exemplifies this by using music to express dissatisfaction with government.", "Plato and Aristotle considered aesthetics inseparable from morality and politics; Plotinus gave aesthetics mystical importance, arguing art raises the soul to contemplate universals and unite with 'the one'; Fichte equated beauty with truth.", "The social significance of aesthetics includes therapeutic value (Sigmund Freud — art discharges tensions and reveals hidden conflicts), revolutionary importance (Marcuse — art can break through social reality and open horizons of change), educational value, and representational significance."], "questions": [{"question": "The word 'ethics' is derived from which Greek word?", "options": {"a": "Deon", "b": "Ethos", "c": "Teleos", "d": "Aesthetikos"}, "answer": "b", "explanation": "Ethics comes from the Greek word 'ethos' meaning character or custom, indicating that its basic concerns are the character, attitudes, and conducts of individuals and groups."}, {"question": "Which of the following is correctly identified as the subject matter of ethics?", "options": {"a": "Logic", "b": "Epistemology", "c": "Morality", "d": "Metaphysics"}, "answer": "c", "explanation": "Ethics is defined as the philosophical study of morality; when one critically reflects on moral standards of self or society, one is performing ethics — making morality the subject matter of ethics."}, {"question": "Which of the following is NOT one of the three major sub-divisions of ethics?", "options": {"a": "Descriptive ethics", "b": "Applied ethics", "c": "Meta-ethics", "d": "Normative ethics"}, "answer": "b", "explanation": "The session identifies three major sub-divisions: descriptive ethics, meta-ethics, and normative ethics. Applied ethics is not listed as one of the three major subdivisions."}, {"question": "Which sub-division of ethics merely explains and describes the moral beliefs and practices held by individuals and societies without making normative prescriptions?", "options": {"a": "Normative ethics", "b": "Meta-ethics", "c": "Descriptive ethics", "d": "Professional ethics"}, "answer": "c", "explanation": "Descriptive ethics describes moral positions held by individuals, groups, and societies — for example, 'stealing is prohibited in traditional African society' — without prescribing what ought to be."}, {"question": "Which of the following is a complete and correct list of meta-ethical theories?", "options": {"a": "Utilitarianism, hedonism, and ethical egoism", "b": "Naturalism, anti-naturalism, emotivism, prescriptivism, and intuitionism", "c": "Consequentialism, deontology, and virtue ethics", "d": "Relativism, absolutism, and universalism"}, "answer": "b", "explanation": "Meta-ethical theories include naturalism, anti-naturalism, emotivism, prescriptivism, and intuitionism. The other options list normative ethical theories or positions on the objectivity of moral truth."}, {"question": "Which correctly states the distinction between moral judgment and moral principle?", "options": {"a": "Moral judgment concerns general human character; moral principle concerns a specific action", "b": "Moral judgment concerns a specific human action; moral principle concerns human actions and character in general", "c": "Both moral judgment and moral principle deal only with character traits", "d": "Moral judgment and moral principle are interchangeable terms in normative ethics"}, "answer": "b", "explanation": "The session explicitly states that moral judgment is about a specific human action while moral principle is about human actions and character; correct moral judgment is based on ideal moral principles."}, {"question": "How does ethics differ from the empirical sciences in its approach?", "options": {"a": "Ethics deals with 'what is' while empirical sciences deal with 'what ought to be'", "b": "Ethics is descriptive while empirical sciences are prescriptive", "c": "Ethics is prescriptive (normative), dealing with 'what ought to be'; empirical sciences are descriptive, dealing with 'what is'", "d": "Ethics and the empirical sciences are both purely descriptive disciplines"}, "answer": "c", "explanation": "Empirical sciences describe what is (descriptive), while ethics as a normative science prescribes what ought to be — it provides norms, standards, and principles to guide human action."}, {"question": "According to Barcalow, at what point does an issue become a moral issue?", "options": {"a": "When an action violates a divine command", "b": "When a choice affects the wellbeing of others by increasing benefit or causing harm", "c": "When an action is performed without conscious intent", "d": "When an action affects only the agent's own personal wellbeing"}, "answer": "b", "explanation": "Barcalow states that moral issues arise 'most fundamentally when the choice people face will affect the wellbeing of others either by increasing or decreasing it, causing either benefit or harm.'"}, {"question": "A decision to sell adulterated drugs constitutes a moral issue while a decision to eat a particular food does not. This distinction is based on:", "options": {"a": "Whether the action is legal or illegal", "b": "Whether the action affects the wellbeing of others", "c": "Whether the action follows divine command", "d": "Whether the action is performed voluntarily"}, "answer": "b", "explanation": "Barcalow's criterion is that moral issues arise when choices affect others' wellbeing. Selling adulterated drugs affects others' physical/psychological wellbeing; choosing what to eat does not (in typical cases)."}, {"question": "Which combination correctly identifies ALL THREE properties of moral actions?", "options": {"a": "Involuntary, rational, and socially sanctioned", "b": "Intentional, legal, and culturally approved", "c": "Purposive, voluntary, and affecting others' wellbeing", "d": "Conscious, compelled, and harmful to others"}, "answer": "c", "explanation": "The session specifies that moral actions are (1) purposive or consciously performed, (2) voluntary or carried out of free choice, and (3) affect or tend to affect the wellbeing of others in society."}, {"question": "The Greek word 'teleos' means:", "options": {"a": "Duty", "b": "Character", "c": "End or purpose", "d": "Beauty"}, "answer": "c", "explanation": "'Teleos' means end or purpose; teleological (consequentialist) theories therefore judge the moral status of actions by their ends or results."}, {"question": "Utilitarianism is correctly classified as which type of ethical theory?", "options": {"a": "Deontological", "b": "Meta-ethical", "c": "Teleological/Consequentialist", "d": "Descriptive"}, "answer": "c", "explanation": "Utilitarianism holds that an action is right if it yields the greatest benefit for the greatest number — this judges actions by their consequences, making it a teleological/consequentialist theory."}, {"question": "Immanuel Kant's categorical imperative is best classified as which type of ethical theory, and why?", "options": {"a": "Teleological, because it focuses on outcomes and maximising benefit", "b": "Deontological, because it judges actions by the motive or intention of the moral agent", "c": "Utilitarian, because it promotes the greatest good for the greatest number", "d": "Relativist, because it holds that morality varies across cultures"}, "answer": "b", "explanation": "Kant's categorical imperative is a deontological theory (from 'deon' meaning duty); it holds that the rightness or wrongness of actions is determined by the motive/intention of the agent, not by consequences."}, {"question": "The divine command theory holds that an action's moral status is determined by:", "options": {"a": "The consequences it produces for the greatest number", "b": "The intentions and motives of the moral agent", "c": "God's command — an action is right or wrong precisely because God says it is", "d": "The society in which the moral agent lives"}, "answer": "c", "explanation": "The divine command theory insists that murder, for example, is not intrinsically bad — it is wrong because God commands that it is so. Proponents include St. Thomas Aquinas and St. Augustine."}, {"question": "Which position holds that morality is relative to place and time, with no single moral standard universally applicable to all humans?", "options": {"a": "Moral universalism", "b": "Ethical absolutism", "c": "Moral realism", "d": "Ethical relativism"}, "answer": "d", "explanation": "Ethical relativism argues that different societies or cultures at any time or epoch determine the moral worthiness of any conduct — there is no uniform standard for all people."}, {"question": "Moral individualism (subjectivism), associated with Jean Paul Sartre's existentialism, holds that:", "options": {"a": "God alone determines what is morally right or wrong", "b": "Each individual makes actions right or wrong by deciding which standards to adopt", "c": "Society collectively determines the moral status of actions", "d": "Moral truth is objective and independent of any individual's opinion"}, "answer": "b", "explanation": "Moral individualism holds that it is the individual — not God or society — who confers moral status on actions by deciding which standards to adopt, rooted in the existentialist philosophy of Sartre."}, {"question": "Conventionalism in ethics encompasses which three positions?", "options": {"a": "Moral realism, universalism, and absolutism", "b": "Utilitarianism, deontology, and virtue ethics", "c": "Divine command theory, ethical relativism, and moral individualism", "d": "Naturalism, emotivism, and prescriptivism"}, "answer": "c", "explanation": "The session explicitly classifies divine command theory (God says so), ethical relativism (society determines it), and moral individualism (the individual decides) together under conventionalism — the view that actions are right/wrong because someone says or believes so."}, {"question": "What is the key difference between moral realism and ethical absolutism?", "options": {"a": "Moral realism denies objective moral truth; absolutism affirms it", "b": "Moral realism accepts universal truth but admits exceptions; absolutism admits no exceptions", "c": "Absolutism allows exceptions; moral realism admits none", "d": "They are identical positions under different names"}, "answer": "b", "explanation": "Moral realism insists on an objective ethical truth that is universal but admits exceptions; ethical absolutism holds that moral standards apply to all humans at all times in all circumstances with no exceptions."}, {"question": "Which of the following best describes moral universalism?", "options": {"a": "Moral principles apply to everyone without any possible exceptions", "b": "Each culture has its own completely valid and separate moral system", "c": "Moral principles are universal but allow for exceptions when higher values require it", "d": "God's commands are the only universally binding moral standard"}, "answer": "c", "explanation": "Moral universalism holds that principles are universal but give room for exceptions — for example, the principle against killing may be overridden in cases of self-defence, war, or capital punishment."}, {"question": "A soldier commits suicide to save his comrades. According to the session's discussion of moral universalism, this act:", "options": {"a": "Is always morally wrong because killing is absolutely prohibited", "b": "Is a purely personal decision with no moral dimension", "c": "Can be morally justified as it promotes a higher value (saving others), consistent with universalism allowing exceptions", "d": "Is morally right only if God commands it"}, "answer": "c", "explanation": "The session uses this as an example of moral universalism — that the principle against killing can be set aside to promote higher values, making heroic self-sacrifice morally justifiable."}, {"question": "In professional ethics, which oath guides medical doctors?", "options": {"a": "The Socratic Oath", "b": "The Hippocratic Oath", "c": "The Kantian Imperative", "d": "The Utilitarian Pledge"}, "answer": "b", "explanation": "The Hippocratic Oath is the professional ethics guiding medical doctors in their duties; it prevents them from using their power and opportunity to harm patients."}, {"question": "Alexander Gottlieb Baumgarten introduced the term 'aesthetics' in:", "options": {"a": "AD 1453", "b": "AD 1653", "c": "AD 1753", "d": "AD 1853"}, "answer": "c", "explanation": "The German philosopher Alexander Gottlieb Baumgarten introduced the term 'aesthetics' in AD 1753, though the study of beauty had been pursued by philosophers for centuries before."}, {"question": "The word 'aesthetics' is derived from the Greek word 'aesthetikos' which means:", "options": {"a": "Beautiful", "b": "Imitation", "c": "Pleasure", "d": "Perceptive"}, "answer": "d", "explanation": "Aesthetics derives from the Greek 'aesthetikos' meaning perceptive; it is the branch of philosophy dealing with value judgments in the arts and the standards of beauty."}, {"question": "Which of the following is the oldest theory of art?", "options": {"a": "Art as Expression", "b": "Art as Play", "c": "Art as Communication", "d": "Art as Imitation"}, "answer": "d", "explanation": "Art as Imitation is the oldest theory of art, dating back to the ancient Greek period of Plato and Aristotle, holding that art imitates objects, moods, emotions, and human action."}, {"question": "The theory of 'Art as Play' originated from which philosopher's work?", "options": {"a": "Plato", "b": "Aristotle", "c": "Immanuel Kant", "d": "Benedetto Croce"}, "answer": "c", "explanation": "The Art as Play theory originated from Immanuel Kant's Critique of Judgement, which distinguished arts from labour; it holds that art is a way of releasing excess energy."}, {"question": "Benedetto Croce, the Italian philosopher, is most associated with which theory of aesthetics?", "options": {"a": "Art as Imitation", "b": "Art as Play", "c": "Art as Expression", "d": "Art as Communication"}, "answer": "c", "explanation": "Croce sees art as intuition that is expressed; he holds that art has its own peculiar language that aids the artist in expressing emotions — a central tenet of the Art as Expression theory."}, {"question": "Plato's claim that art is 'an imitation of an imitation' is based on his theory that:", "options": {"a": "Artists must copy each other's masterpieces to learn their craft", "b": "Reality consists of archetypes/Forms; physical objects imitate those Forms; artists then copy those physical objects", "c": "Art directly captures transcendent reality more accurately than philosophical reasoning", "d": "All art forms are equally valid expressions of individual experience"}, "answer": "b", "explanation": "Plato held that reality = Forms (archetypes beyond sense experience); physical objects are imitations of those Forms; artists copy physical objects — so art is an imitation of an imitation, twice removed from true reality."}, {"question": "Fela Anikulapo-Kuti's use of music to express dissatisfaction with government policies is cited in the session as an example of which theory of art?", "options": {"a": "Art as Imitation", "b": "Art as Play", "c": "Art as Expression", "d": "Art as Pleasure"}, "answer": "c", "explanation": "The session uses Fela Anikulapo-Kuti as a contemporary example of Art as Expression — his music relayed a message about governmental decisions using his artistic medium, consistent with Croce's theory."}, {"question": "Which philosopher argued that art raises the soul to the contemplation of universals and enables the soul to unite with 'the one,' giving aesthetics a mystical significance?", "options": {"a": "Plato", "b": "Aristotle", "c": "Plotinus", "d": "Johann Gottlieb Fichte"}, "answer": "c", "explanation": "Plotinus, a third-century philosopher born in Egypt and trained at Alexandria, gave aesthetics mystical importance; he argued that art reveals the form of an object more than experience does and enables the soul to unite with 'the one.'"}, {"question": "According to the session, the FULL social significance of aesthetics includes which of the following?", "options": {"a": "Only therapeutic value (relaxation and stress relief)", "b": "Only pleasure and entertainment", "c": "Therapeutic, revolutionary, educational, and representational significance", "d": "Only scientific and technical value in advancing physics"}, "answer": "c", "explanation": "The session identifies multiple social significances: therapeutic (Freud — discharging tensions), revolutionary (Marcuse — breaking through social reality), educational, and representational; Plato and Aristotle also linked aesthetics inseparably to morality and politics."}]}, {"session": 6, "topic": "Symbolic Logic and Truth Functions", "points": ["The term 'logic' derives from the Greek word 'logos,' which is variously translated as sentence, discourse, reason, rule, and ratio.", "Alfred Tarski defined logic as the discipline that analyzes the meaning of concepts common to all the sciences and establishes the general laws governing those concepts.", "Gottlob Frege held that logic's primary task is to discover the laws of truth — not the laws of assertion or thought — distinguishing logic sharply from psychology.", "Irving Copi's adopted definition states that logic is the study of the methods and principles used to distinguish correct from incorrect reasoning.", "Logic is one of the seven traditional liberal arts, alongside arithmetic, geometry, astronomy, music, grammar, and rhetoric.", "Logic is not an inborn skill but must be learnt and practised like games and languages, though some individuals may excel more than others.", "Logic is prescriptive (it tells us how we ought to reason if we wish to reason correctly), while psychology is descriptive (it reports how people actually do reason, including their errors).", "Logic is not psychology: the psychology of reasoning is an empirical science concerned with actual reasoning habits, emotional influences, and brain processes, none of which are the concern of the logician.", "Jean Oesterle described logic as the art that guides us in coming to know something previously unknown — an instrument for finding out why things are as they are and for enabling scientific knowing.", "Harvey Bluedorn argued that a firm grasp of logical thinking skills is necessary to prepare one for life's confrontations and to hold fast to truth against every wind of doctrine.", "Logic helps detect fallacies and technical errors in reasoning; without it, one would be perpetually trapped in the confusion of incorrect inferences and fallacious constructs.", "Logic helps make valid inferences through observation, enhances communication, and enables the finding, creating, and resolving of paradoxes.", "Logic makes us more observant of language, language use, meanings, and the meaning of meaning — strengthening all fields including art, religion, law, science, and technology.", "Logic serves as a tool for ratiocination (the process of exact thinking and reasoning), and it is doubtful whether a philosopher could conduct rigorous inquiry without it.", "Logic does not differ according to the disciplines, fields, or institutions to which it is applied; the same universal rules and laws of thought govern every domain logic touches.", "Polylogism — the view that different disciplines require fundamentally different logics — is rejected on the ground that one who attacks logic must use logic in the attack, thereby contradicting themselves.", "Logic lies at the foundation of mathematics, computer science, cognitive science, and linguistics, in addition to philosophy — making it one of the most broadly foundational of all disciplines.", "The relationship between logic and mathematics was not clearly articulated until the closing decades of the nineteenth century, though Aristotle first systematically delineated logic's subject matter.", "George Boole, a British mathematical logician, published Laws of Thought in 1854, in which he dealt with the calculus of class inclusion, establishing a formal bridge between logic and mathematics.", "Gottlob Frege defined 'number' as a plurality of pluralities of pluralities, removing logical mistakes from earlier definitions and showing that key mathematical concepts derive from principles of deductive logic.", "Bertrand Russell described the relationship between logic and mathematics as that between a boy and a man, stating that 'logic is the boyhood of mathematics.'", "The logicist programme — Russell's attempt to deduce pure mathematics completely from logic — did not succeed in its primary objective, showing that the logic-mathematics relationship is real but more complex than a simple reduction.", "George Cantor articulated a mathematical theory of infinite numbers and continuity, abolishing much of the mysticism that had previously obscured mathematics.", "Psychology reveals how people actually think (descriptive), while logic explicates the objective relations of implication between propositions (prescriptive); the analysis of emotions accompanying thought belongs to psychology, not logic.", "Logic is a tool of inference in the sciences: a scientist uses logic and mathematics to deduce empirical consequences from hypotheses, which must then be tested experimentally.", "Rationalists hold that scientific knowledge can be obtained through reasoning alone, while empiricists insist knowledge of the objective world is only possible through observation.", "J. S. Mill's methods of inductive logic were specifically designed to assist in the discovery of causal connections between phenomena in nature, building on Bacon's earlier critique of simple enumeration.", "Rudolf Carnap and the logical positivists emphasized a probabilistic theory of inductive logic for the sciences, representing the contemporary development of inductivist philosophy of science.", "Logic underpins morality: the three laws of thought apply directly — the Law of Identity (identifying an action as what it is), the Law of Contradiction (not confusing one action or punishment with another), and the Law of Excluded Middle (evaluating how a law can be applied and how an action can be judged).", "Without logic applied to morality, there is no principled distinction between good and evil, right and wrong, just and unjust; rejecting logic from moral reasoning leads inevitably to moral confusion and social dysfunction."], "questions": [{"question": "The Greek word 'logos,' from which 'logic' is derived, carries several translations listed in this session. Which of the following is NOT among those translations?", "options": {"a": "Discourse", "b": "Truth", "c": "Sentence", "d": "Ratio"}, "answer": "b", "explanation": "The text lists sentence, discourse, reason, rule, and ratio as translations of 'logos.' Truth is not listed among them, making it the correct answer."}, {"question": "For the purpose of this study session, the definition of logic adopted is that of Irving Copi. Which of the following best captures his definition?", "options": {"a": "Logic is the art of discovering the universal laws of truth", "b": "Logic analyses the meanings of concepts common to all sciences", "c": "Logic is the study of methods and principles used to distinguish correct from incorrect reasoning", "d": "Logic is the systematic analysis of the laws of psychological reasoning"}, "answer": "c", "explanation": "Copi's adopted definition states that logic is the study of the methods and principles used to distinguish correct from incorrect reasoning — the most complete and relevant definition for this course."}, {"question": "George Boole published 'Laws of Thought' in 1854. What was the central subject matter of this foundational work?", "options": {"a": "The relationship between logic and moral law", "b": "The probabilistic theory of inductive reasoning", "c": "The methods of discovering causal connections in nature", "d": "The calculus of class inclusion"}, "answer": "d", "explanation": "Boole's 1854 'Laws of Thought' specifically dealt with the calculus of class inclusion, establishing a critical formal link between logic and mathematics."}, {"question": "Bertrand Russell expressed the relationship between logic and mathematics through a specific analogy. What was that analogy?", "options": {"a": "Logic is the boyhood of mathematics", "b": "Mathematics is the servant of logic", "c": "Logic and mathematics are twin disciplines born from the same source", "d": "Logic is to mathematics as grammar is to literature"}, "answer": "a", "explanation": "Russell stated that 'logic is the boyhood of mathematics,' suggesting that logic is an earlier, less mature stage that grows into the full discipline of mathematics."}, {"question": "Russell's logicist programme had an ambitious primary objective. Which of the following correctly states that objective?", "options": {"a": "To eliminate all psychological elements from philosophical reasoning", "b": "To prove that morality can be derived from the laws of logic alone", "c": "To deduce pure mathematics completely from the principles of logic", "d": "To unify logic, grammar, and rhetoric into a single unified discipline"}, "answer": "c", "explanation": "The logicist programme aimed to show that pure mathematics is entirely derivable from logical principles alone. Despite contributions from Frege, Peano, and Russell, it did not achieve this primary goal."}, {"question": "Logic is listed in this session as one of the seven traditional liberal arts. Which of the following is also correctly listed among the remaining six?", "options": {"a": "Philosophy", "b": "Rhetoric", "c": "Ethics", "d": "Theology"}, "answer": "b", "explanation": "The seven traditional liberal arts are: logic, arithmetic, geometry, astronomy, music, grammar, and rhetoric. Rhetoric is the only option that appears on this list."}, {"question": "A student argues that studying how people actually reason is the same as studying logic. What is the most precise rebuttal to this claim?", "options": {"a": "Logic uses symbols while psychology uses words, making them fundamentally different", "b": "Psychology studies brain chemistry while logic studies philosophical propositions", "c": "Logic applies only to scientific reasoning while psychology covers everyday reasoning", "d": "Logic is prescriptive — it tells us how one ought to reason — while psychology is descriptive, reporting how people actually do reason"}, "answer": "d", "explanation": "The fundamental distinction is normative (prescriptive) versus empirical (descriptive). Logic sets the standard for correct reasoning; psychology describes actual cognitive behavior including its errors and emotional influences."}, {"question": "The text rejects 'polylogism' as a position. Which of the following correctly identifies what polylogism claims and why the text rejects it?", "options": {"a": "Polylogism claims logic is culturally relative; rejected because truth is universal", "b": "Polylogism claims mathematics can exist without logic; rejected because Frege proved otherwise", "c": "Polylogism claims different fields require different logics; rejected because any coherent attack on logic must itself use logic, making the claim self-defeating", "d": "Polylogism claims morality has no logical basis; rejected because laws reflect logical rules of inference"}, "answer": "c", "explanation": "Polylogism holds that distinct disciplines require distinct logics. This is rejected because the same universal laws of thought apply everywhere, and any argument against logic must use logical reasoning — thereby contradicting itself."}, {"question": "Gottlob Frege's contribution to the relationship between logic and mathematics is best described as which of the following?", "options": {"a": "Defining 'number' in a way that removed logical mistakes from earlier definitions and demonstrated mathematics can derive from deductive logic", "b": "Publishing 'Laws of Thought' to develop the calculus of class inclusion", "c": "Developing a probabilistic theory of inductive logic for the natural sciences", "d": "Constructing a mathematical theory of infinite numbers and continuity"}, "answer": "a", "explanation": "Frege invented a definition of number that corrected earlier logical mistakes and showed that key mathematical concepts can be derived from the principles of deductive logic, furthering the logicist project."}, {"question": "The text states that logic 'is seen to be more of arithmetic than history.' In context, what does this com
