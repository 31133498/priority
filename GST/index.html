<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST 212 — ShazdTechBro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--white:#fff;--black:#0a0a0a;--g100:#f4f4f5;--g200:#e4e4e7;--g400:#a1a1aa;--g500:#71717a;--g700:#3f3f46;--green:#16a34a;--greenl:#f0fdf4;--red:#dc2626;--redl:#fef2f2;--blue:#2563eb;--bluel:#eff6ff}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--black);min-height:100vh}

/* Topbar */
.topbar{position:fixed;top:0;left:0;right:0;background:var(--white);border-bottom:1px solid var(--g200);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:100}
.brand{font-size:13px;font-weight:700;letter-spacing:-.3px}
.brand span{font-weight:400;color:var(--g500)}
.mode-toggle{display:flex;background:var(--g100);border-radius:8px;padding:3px;gap:2px}
.mode-btn{padding:6px 16px;border-radius:6px;border:none;background:transparent;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--g500);transition:all .15s}
.mode-btn.active{background:var(--white);color:var(--black);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pinfo{font-size:11px;color:var(--g500);font-weight:500}
.pbar-wrap{position:fixed;top:49px;left:0;right:0;height:3px;background:var(--g200);z-index:99}
.pbar-fill{height:100%;background:var(--black);transition:width .3s}

/* Study bar */
.study-bar{position:fixed;top:52px;left:0;right:0;background:var(--white);border-bottom:1px solid var(--g200);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:98}
.chunk-nav{display:flex;align-items:center;gap:5px;flex-shrink:0}
.chunk-arrow{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--g200);background:var(--white);cursor:pointer;font-size:16px;color:var(--g500);transition:all .15s;font-family:inherit;padding:0;display:flex;align-items:center;justify-content:center;line-height:1}
.chunk-arrow:hover:not(:disabled){background:var(--g100)}
.chunk-arrow:disabled{opacity:0.3;cursor:default}
.chunk-sel{border:1px solid var(--g200);border-radius:6px;padding:4px 6px;font-size:12px;font-family:inherit;background:var(--white);color:var(--black);cursor:pointer;max-width:170px}
.lap-track{display:flex;align-items:center;gap:3px;flex-shrink:0}
.lap-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--g200);background:var(--white);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--g400);transition:all .2s;flex-shrink:0;user-select:none}
.lap-dot.done{background:var(--g200);border-color:var(--g200);color:var(--g500)}
.lap-dot.active{background:var(--black);border-color:var(--black);color:white}
.lap-line{width:10px;height:2px;background:var(--g200);flex-shrink:0;transition:background .2s}
.lap-line.done{background:var(--g500)}
.quiz-pill{padding:3px 9px;border-radius:20px;border:2px solid var(--g200);background:var(--white);font-size:10px;font-weight:700;color:var(--g400);letter-spacing:.3px;transition:all .2s;flex-shrink:0}
.quiz-pill.active{background:var(--blue);border-color:var(--blue);color:white}

/* Main */
.main{padding:115px 20px 120px;max-width:720px;margin:0 auto}
.filter-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--g200)}
.fbtn{padding:4px 12px;border-radius:20px;border:1.5px solid var(--g200);background:var(--white);font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--g500);transition:all .15s;white-space:nowrap}
.fbtn.active{background:var(--black);color:white;border-color:var(--black)}
.page-header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px;border-bottom:1px solid var(--g200);margin-bottom:14px}
.page-label{font-size:12px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.5px}
.page-controls{display:flex;align-items:center;gap:12px}
.psz{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--g500)}
.psz select,.csz select{border:1px solid var(--g200);border-radius:6px;padding:4px 6px;font-size:12px;font-family:inherit;background:var(--white);color:var(--black);cursor:pointer}
.csz{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--g500)}

/* Question progress dots */
.q-prog{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:16px;padding:10px 12px;background:var(--white);border:1px solid var(--g200);border-radius:8px}
.q-dot{width:9px;height:9px;border-radius:50%;background:var(--g200);transition:background .15s;flex-shrink:0}
.q-dot.seen{background:var(--g400)}
.q-dot.curr{background:var(--black)}

/* Cards */
.q-card{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:20px;margin-bottom:12px;animation:fu .2s ease}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-num{font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.q-text{font-size:15px;font-weight:500;color:var(--black);line-height:1.5;margin-bottom:14px}
.tbadge{font-size:10px;padding:2px 8px;background:var(--g100);border-radius:20px;color:var(--g700);font-weight:500;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--g200);font-size:13.5px;color:var(--g700);transition:all .1s}
.opt-letter{width:22px;height:22px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--g500);flex-shrink:0}
.opt.correct-r{border-color:var(--green);background:var(--greenl);color:var(--green);font-weight:600}
.opt.correct-r .opt-letter{background:var(--green);color:white}
.opt.qopt{cursor:pointer}
.opt.qopt:hover:not(.answered){border-color:var(--g400);background:var(--g100)}
.opt.show-c{border-color:var(--green);background:var(--greenl);color:var(--green);font-weight:600}
.opt.show-c .opt-letter{background:var(--green);color:white}
.opt.sel-w{border-color:var(--red);background:var(--redl);color:var(--red);font-weight:600}
.opt.sel-w .opt-letter{background:var(--red);color:white}
.expl{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.6;border-left:3px solid var(--blue);background:var(--bluel);color:var(--blue)}
.rexpl{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.6;display:none}
.rexpl.rc{display:block;border-left:3px solid var(--green);background:var(--greenl);color:var(--green)}
.rexpl.rw{display:block;border-left:3px solid var(--red);background:var(--redl);color:var(--red)}

/* Score bar */
.score-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--g200);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:100}
.nav-btns{display:flex;gap:8px}
.nbtn{padding:8px 20px;border-radius:8px;border:1.5px solid var(--g200);background:var(--white);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--black);transition:all .15s}
.nbtn:hover{background:var(--g100)}
.nbtn.pri{background:var(--black);color:white;border-color:var(--black)}
.nbtn.pri:hover{opacity:.85}

/* Summary */
.sum{text-align:center;padding:60px 20px;display:none}
.sum.show{display:block}
.sum-score{font-size:64px;font-weight:800;letter-spacing:-3px}
.sum-lbl{font-size:14px;color:var(--g500);margin-bottom:8px}
.sum-chunk{font-size:12px;color:var(--g400);margin-bottom:20px}
.sum-btns{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
#loading{text-align:center;padding:60px 20px;font-size:14px;color:var(--g500)}

@media(max-width:600px){
  /* Topbar: hide redundant pinfo, tighter padding */
  .topbar{padding:10px 14px}
  .pinfo{display:none}
  .brand{font-size:12px}
  .mode-btn{padding:6px 12px;font-size:11px}

  /* Progress bar stays at 49px */
  .pbar-wrap{top:49px}

  /* Study bar: 2-row layout */
  .study-bar{top:52px;flex-direction:column;align-items:stretch;gap:7px;padding:8px 14px}
  .chunk-nav{justify-content:space-between}
  .chunk-sel{flex:1;max-width:none;font-size:12px}
  .lap-track{justify-content:center}
  .lap-dot{width:22px;height:22px;font-size:10px}
  .lap-line{width:8px}
  .quiz-pill{font-size:9px;padding:2px 7px}

  /* Main: compensate for taller 2-row study bar (~78px) */
  .main{padding:148px 12px 100px}

  /* Page header: stack controls below label */
  .page-header{flex-direction:column;align-items:flex-start;gap:8px}
  .page-controls{flex-wrap:wrap;gap:8px}

  /* Cards */
  .q-card{padding:14px}
  .q-text{font-size:14px}
  .opt{font-size:13px;padding:10px 10px}
  .expl,.rexpl{font-size:12px}

  /* Score bar: score on top, full-width nav buttons below */
  .score-bar{flex-direction:column;align-items:stretch;gap:8px;padding:10px 14px}
  #scoreDis{text-align:center;font-size:12px}
  .nav-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .nbtn{padding:11px 8px;font-size:13px;text-align:center}

  /* Summary */
  .sum-score{font-size:52px}
  .sum-btns{flex-direction:column;align-items:center}
  .sum-btns .nbtn{width:100%;max-width:280px}
}

@media(max-width:380px){
  .chunk-sel{font-size:11px}
  .q-text{font-size:13px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">GST 212 <span>· ShazdTechBro</span></div>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('read')" id="readBtn">Read</button>
    <button class="mode-btn" onclick="setMode('quiz')" id="quizBtn">Quiz</button>
    <a class="mode-btn" href="sessions.html" style="text-decoration:none">Sessions</a>
  </div>
  <div class="pinfo" id="pinfo">Loading...</div>
</div>

<div class="pbar-wrap"><div class="pbar-fill" id="pbar" style="width:0%"></div></div>

<div class="study-bar" id="studyBar" style="display:none">
  <div class="chunk-nav">
    <button class="chunk-arrow" id="prevChunkBtn" onclick="prevChunk()">‹</button>
    <select class="chunk-sel" id="chunkSel" onchange="goToChunk(parseInt(this.value))"></select>
    <button class="chunk-arrow" id="nextChunkBtn" onclick="nextChunk()">›</button>
  </div>
  <div class="lap-track" id="lapTrack"></div>
</div>

<div class="main">
  <div id="loading">Loading questions...</div>
  <div id="appContent" style="display:none">
    <div class="filter-wrap" id="filterWrap"></div>
    <div class="page-header">
      <div class="page-label" id="pageLabel">Page 1</div>
      <div class="page-controls">
        <div class="csz">Chunk <select id="chunkSzSel" onchange="setChunkSize(parseInt(this.value))"><option value="20">20</option><option value="25" selected>25</option><option value="30">30</option><option value="50">50</option></select> Qs</div>
        <div class="psz">Show <select onchange="setPageSize(parseInt(this.value))"><option value="5" selected>5</option><option value="10">10</option><option value="15">15</option><option value="25">25</option></select> per page</div>
      </div>
    </div>
    <div class="q-prog" id="qProg"></div>
    <div id="qContainer"></div>
    <div class="sum" id="sumScreen">
      <div class="sum-score" id="sumScore">0/0</div>
      <div class="sum-lbl" id="sumLbl">Quiz Complete</div>
      <div class="sum-chunk" id="sumChunk"></div>
      <p style="font-size:14px;color:#71717a;margin-top:4px" id="sumMsg"></p>
      <div class="sum-btns">
        <button class="nbtn" onclick="restartQuiz()">Try Again</button>
        <button class="nbtn" onclick="doNextChunk()">Next Chunk →</button>
        <button class="nbtn pri" onclick="backToRead()">Study Again</button>
      </div>
    </div>
  </div>
</div>

<div class="score-bar">
  <div id="scoreDis" style="font-size:13px;color:#71717a;font-weight:500">Loading...</div>
  <div class="nav-btns">
    <button class="nbtn" onclick="prevPage()" id="prevBtn">← Prev</button>
    <button class="nbtn pri" onclick="nextPage()" id="nextBtn">Next →</button>
  </div>
</div>

function computeChunks() {
  chunks = [];
  for (let i = 0; i < filtered.length; i += chunkSize) {
    chunks.push(filtered.slice(i, i + chunkSize));
  }
  if (chunks.length === 0) chunks.push([]);
}

function buildFilters() {
  const wrap = document.getElementById('filterWrap');
  wrap.innerHTML = '';
  TOPICS.forEach(t => {
    const count = t === 'All' ? ALL_Q.length : ALL_Q.filter(q => q.topic === t).length;
    const btn = document.createElement('button');
    btn.className = 'fbtn' + (t === selTopic ? ' active' : '');
    btn.textContent = SHORT[t] + ' (' + count + ')';
    btn.onclick = () => setTopic(t, btn);
    wrap.appendChild(btn);
  });
}

function buildChunkSelector() {
  const sel = document.getElementById('chunkSel');
  sel.innerHTML = '';
  chunks.forEach((c, i) => {
    const opt = document.createElement('option');
    const from = c[0] ? c[0].num : i * chunkSize + 1;
    const to = c[c.length - 1] ? c[c.length - 1].num : i * chunkSize + c.length;
    opt.value = i;
    opt.textContent = 'Chunk ' + (i + 1) + '/' + chunks.length + ' · Q' + from + '–' + to;
    sel.appendChild(opt);
  });
  sel.value = chunkIdx;
  document.getElementById('prevChunkBtn').disabled = chunkIdx === 0;
  document.getElementById('nextChunkBtn').disabled = chunkIdx >= chunks.length - 1;
}

function setTopic(topic, btn) {
  selTopic = topic;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = topic === 'All' ? [...ALL_Q] : ALL_Q.filter(q => q.topic === topic);
  chunkIdx = 0; lap = 0; lapPage = 0;
  qAnswers = {}; correct = 0; wrong = 0;
  computeChunks();
  buildChunkSelector();
  render();
}

  document.getElementById('quizBtn').classList.toggle('active', m === 'quiz');
  document.getElementById('sumScreen').classList.remove('show');
  render();
}

function setPageSize(n) { pageSize = n; lapPage = 0; render(); }

function setChunkSize(n) {
  chunkSize = n; chunkIdx = 0; lap = 0; lapPage = 0;
  qAnswers = {}; correct = 0; wrong = 0;
  computeChunks(); buildChunkSelector(); render();
}

function prevChunk() {
  if (chunkIdx > 0) {
    chunkIdx--; lap = 0; lapPage = 0;
    qAnswers = {}; correct = 0; wrong = 0;
    buildChunkSelector(); render();
  }
}

function nextChunk() {
  if (chunkIdx < chunks.length - 1) {
    chunkIdx++; lap = 0; lapPage = 0;
    qAnswers = {}; correct = 0; wrong = 0;
    buildChunkSelector(); render();
  }
}

function goToChunk(idx) {
  chunkIdx = idx; lap = 0; lapPage = 0;
  qAnswers = {}; correct = 0; wrong = 0;
  buildChunkSelector(); render();
}

function doNextChunk() {
  if (chunkIdx < chunks.length - 1) chunkIdx++;
  mode = 'read'; lap = 0; lapPage = 0;
  qAnswers = {}; correct = 0; wrong = 0;
  document.getElementById('readBtn').classList.add('active');
  document.getElementById('quizBtn').classList.remove('active');
  document.getElementById('sumScreen').classList.remove('show');
  buildChunkSelector(); render();
}

function backToRead() {
  mode = 'read'; lap = 0; lapPage = 0;
  qAnswers = {}; correct = 0; wrong = 0;
  document.getElementById('readBtn').classList.add('active');
  document.getElementById('quizBtn').classList.remove('active');
  document.getElementById('sumScreen').classList.remove('show');
  render();
}

function curChunk() { return chunks[chunkIdx] || []; }

function totalPages() { return Math.ceil(curChunk().length / pageSize) || 1; }

function curPageQs() {
  const s = lapPage * pageSize;
  return curChunk().slice(s, s + pageSize);
}

function prevPage() {
  if (lapPage > 0) { lapPage--; window.scrollTo(0, 0); render(); }
}

function nextPage() {
  const tp = totalPages();
  if (lapPage < tp - 1) {
    lapPage++; window.scrollTo(0, 0); render();
  } else if (mode === 'read') {
    if (lap < 2) {
      lap++; lapPage = 0; window.scrollTo(0, 0); render();
    } else {
      mode = 'quiz'; lap = 0; lapPage = 0;
      qAnswers = {}; correct = 0; wrong = 0;
      document.getElementById('readBtn').classList.remove('active');
      document.getElementById('quizBtn').classList.add('active');
      window.scrollTo(0, 0); render();
    }
  } else {
    showSummary();
  }
}

function answer(localIdx, chosen) {
  const q = curChunk()[localIdx];
  if (!q || qAnswers[localIdx] !== undefined) return;
  const ok = chosen === q.answer;
  qAnswers[localIdx] = { chosen, ok };
  if (ok) correct++; else wrong++;
  const card = document.getElementById('c' + localIdx);
  if (!card) return;
  card.querySelectorAll('.qopt').forEach(opt => {
    opt.classList.add('answered');
    if (opt.dataset.l === q.answer) opt.classList.add('show-c');
    if (opt.dataset.l === chosen && !ok) opt.classList.add('sel-w');
  });
  const ex = card.querySelector('.rexpl');
  if (ex) {
    ex.textContent = (ok ? '✓ Correct — ' : '✗ Wrong — ') + (q.explanation || '');
    ex.className = 'rexpl ' + (ok ? 'rc' : 'rw');
  }
  updateScore();
}

function updateScore() {
  const total = Object.keys(qAnswers).length;
  document.getElementById('scoreDis').innerHTML =
    '<span style="color:#16a34a;font-weight:700">' + correct + ' correct</span> &nbsp;' +
    '<span style="color:#dc2626;font-weight:700">' + wrong + ' wrong</span> &nbsp;' +
    '<span style="color:#71717a">' + total + ' answered</span>';
}

function showSummary() {
  document.getElementById('qContainer').innerHTML = '';
  document.getElementById('qProg').innerHTML = '';
  document.getElementById('sumScreen').classList.add('show');
  const chunk = curChunk();
  const total = Object.keys(qAnswers).length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  document.getElementById('sumScore').textContent = correct + '/' + total;
  document.getElementById('sumLbl').textContent = 'Quiz Complete · ' + pct + '%';
  document.getElementById('sumChunk').textContent =
    'Chunk ' + (chunkIdx + 1) + ' of ' + chunks.length +
    ' (Q' + (chunk[0] ? chunk[0].num : '?') + '–' + (chunk[chunk.length-1] ? chunk[chunk.length-1].num : '?') + ')';
  document.getElementById('sumMsg').textContent =
    pct >= 80 ? 'Excellent! Move on to the next chunk.' :
    pct >= 60 ? 'Good effort. Review wrong answers then try again.' :
    'Keep studying — do another 3 laps before re-quizzing.';
  document.getElementById('scoreDis').innerHTML =
    '<strong>' + pct + '%</strong> — ' + correct + '/' + total + ' correct';
}

function restartQuiz() {
  qAnswers = {}; correct = 0; wrong = 0; lapPage = 0;
  document.getElementById('sumScreen').classList.remove('show');
  render();
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  if (!ALL_Q.length) return;
  const chunk = curChunk();
  const tp = totalPages();
  const qs = curPageQs();
  const qStart = lapPage * pageSize + 1;
  const qEnd = Math.min(lapPage * pageSize + pageSize, chunk.length);

  document.getElementById('pinfo').textContent = 'Q' + qStart + '–' + qEnd + ' of ' + chunk.length;
  document.getElementById('pageLabel').textContent = 'Page ' + (lapPage + 1) + ' of ' + tp;

  const progressPct = mode === 'read'
    ? ((lap * tp + lapPage + 1) / (3 * tp)) * 100
    : ((lapPage + 1) / tp) * 100;
  document.getElementById('pbar').style.width = Math.min(progressPct, 100) + '%';

  document.getElementById('prevBtn').style.opacity = lapPage === 0 ? '0.3' : '1';

  const isLast = lapPage >= tp - 1;
  let nextLbl = 'Next →';
  if (isLast) {
    if (mode === 'read') {
      if (lap === 0) nextLbl = 'Lap 2 →';
      else if (lap === 1) nextLbl = 'Lap 3 →';
      else nextLbl = 'Quiz Time →';
    } else {
      nextLbl = 'Finish →';
    }
  }
  document.getElementById('nextBtn').textContent = nextLbl;

  if (mode === 'read') {
    document.getElementById('scoreDis').textContent =
      'Lap ' + (lap + 1) + ' of 3 · Q' + qStart + '–' + qEnd + ' of ' + chunk.length;
  } else {
    updateScore();
  }

  // Lap track
  const lapTrack = document.getElementById('lapTrack');
  lapTrack.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('div');
    dot.className = 'lap-dot';
    if (mode === 'quiz') dot.classList.add('done');
    else if (i < lap) dot.classList.add('done');
    else if (i === lap) dot.classList.add('active');
    dot.textContent = i + 1;
    lapTrack.appendChild(dot);
    const line = document.createElement('div');
    line.className = 'lap-line' + ((mode === 'quiz' || i < lap) ? ' done' : '');
    lapTrack.appendChild(line);
  }
  const qpill = document.createElement('div');
  qpill.className = 'quiz-pill' + (mode === 'quiz' ? ' active' : '');
  qpill.textContent = 'Quiz';
  lapTrack.appendChild(qpill);

  // Question progress dots
  const qprog = document.getElementById('qProg');
  qprog.innerHTML = '';
  chunk.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'q-dot';
    const pg = Math.floor(i / pageSize);
    if (pg < lapPage) dot.classList.add('seen');
    else if (pg === lapPage) dot.classList.add('curr');
    qprog.appendChild(dot);
  });

  // Questions
  const container = document.getElementById('qContainer');
  document.getElementById('sumScreen').classList.remove('show');
  container.innerHTML = '';

  qs.forEach((q, i) => {
    const localIdx = lapPage * pageSize + i;
    const div = document.createElement('div');
    div.className = 'q-card';
    div.id = 'c' + localIdx;

    let html = '<div class="q-num">Q' + (localIdx + 1) + ' of ' + chunk.length +
               '<span class="tbadge">' + esc(q.topic) + '</span></div>';
    html += '<div class="q-text">' + esc(q.question) + '</div><div class="opts">';

    ['a','b','c','d'].forEach(l => {
      if (!q.options[l]) return;
      const val = esc(q.options[l]);
      if (mode === 'read') {
        html += '<div class="opt' + (l === q.answer ? ' correct-r' : '') + '">' +
                '<span class="opt-letter">' + l.toUpperCase() + '</span>' + val + '</div>';
      } else {
        const ans = qAnswers[localIdx];
        let cls = 'opt qopt';
        if (ans) {
          cls += ' answered';
          if (l === q.answer) cls += ' show-c';
          if (ans.chosen === l && !ans.ok) cls += ' sel-w';
        }
        html += '<div class="' + cls + '" data-l="' + l + '" onclick="answer(' + localIdx + ',\'' + l + '\')">' +
                '<span class="opt-letter">' + l.toUpperCase() + '</span>' + val + '</div>';
      }
    });

    html += '</div>';
    if (mode === 'read') {
      html += '<div class="expl">' + esc(q.explanation || '') + '</div>';
    } else {
      const ans = qAnswers[localIdx];
      let ecls = 'rexpl', etxt = '';
      if (ans) {
        ecls += ans.ok ? ' rc' : ' rw';
        etxt = (ans.ok ? '✓ Correct — ' : '✗ Wrong — ') + esc(q.explanation || '');
      }
      html += '<div class="' + ecls + '">' + etxt + '</div>';
    }

    div.innerHTML = html;
    container.appendChild(div);
  });
}
</script>
</body>
</html>
